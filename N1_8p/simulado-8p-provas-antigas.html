imediata mais apropriada?"],"alternativas":{"A":"Realizar compressões torácicas externas imediatamente, pois a respiração irregular indica parada cardiorrespiratória iminente.","B":"Priorizar abertura das vias aéreas e ventilação com oxigênio suplementar, garantindo respiração eficaz antes de considerar compressões.","C":"Administrar líquidos aquecidos por via oral para prevenir hipotermia e auxiliar na recuperação ventilatória.","D":"Posicionar o paciente em decúbito lateral de segurança e aguardar a chegada do suporte avançado, evitando intervenções locais."},"correta":"B","oficial":{},"oficial_extra":["Segundo o PHTLS (Prehospital Trauma Life Support, 10ª edição, 2018) e recomendações internacionais sobre afogamento, a prioridade absoluta é o manejo da via aérea e da respiração. A vítima de submersão geralmente apresenta hipoxemia como causa principal da deterioração clínica, sendo a ventilação eficaz a intervenção mais crítica.","Incorreta: compressões torácicas imediatas. O paciente tem pulso presente, logo não há indicação de compressões, apenas suporte ventilatório imediato.","Correta: ventilação e oxigenação. O manejo inicial deve focar na abertura das vias aéreas (manobra de extensão de cabeça e elevação do queixo ou uso de cânula orofaríngea, se indicado) e ventilação com O₂ suplementar, assegurando oxigenação adequada. Essa conduta trata diretamente da hipoxemia secundária ao afogamento, que é a principal causa de morbimortalidade.","Incorreta: posição lateral e aguardar suporte. O paciente apresenta ventilação inadequada, sendo contraindicado apenas aguardar; é necessário suporte ativo imediato.","Incorreta: líquidos aquecidos por via oral. Conduta perigosa, pois o paciente está inconsciente, com risco de aspiração; o manejo da hipotermia deve ser feito por meios seguros (aquecimento externo/passivo ou ativo controlado).","Referência:","NAEMT. PHTLS: Prehospital Trauma Life Support. 10. ed. Burlington: Jones & Bartlett Learning, 2018. ISBN 978-1284171471."],"refs":[],"tema":"Afogamento — prioridade ventilatória","conceito":"O afogamento é um insulto HIPÓXICO. Por isso o algoritmo se inverte em relação à PCR de causa cardíaca: começa-se com ventilações de resgate (5 iniciais) e, na RCP, mantém-se a sequência A-B-C. Com pulso presente, o tratamento é ventilação, não compressão.","alt":{"A":"Compressão com pulso central palpável é erro.","B":"CORRETA. Abrir via aérea e ventilar com oxigênio suplementar, garantindo respiração eficaz antes de cogitar compressões.","C":"Líquido por via oral em paciente inconsciente é risco de aspiração — nunca.","D":"Decúbito lateral e espera são inaceitáveis com respiração irregular e hipóxia; aqui o problema é justamente a oxigenação."},"roteiro":[],"takehome":"Parada por afogamento, sufocação ou intoxicação = comece ventilando. Parada cardíaca súbita do adulto = comece comprimindo.","area":"HAM · Queimaduras e trauma ambiental"},{"id":121,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":6}],"enunciado":["(UNIDEP) Uma equipe de atendimento pré-hospitalar foi acionada para atender um homem de 28 anos, vítima de incêndio em ambiente fechado. No exame inicial, a equipe identifica que o paciente apresenta queimaduras em toda a região anterior do tórax, em ambos os membros superiores (face anterior e posterior dos braços) e na face. As áreas afetadas apresentam aspecto seco, de coloração esbranquiçada com pontos enegrecidos, ausência de sensibilidade dolorosa nas áreas mais afetadas e presença de edema ao redor das lesões. O paciente está consciente, orientado, com sinais vitais estáveis, mas relata dificuldade para respirar.","Considerando a avaliação da extensão corporal queimada pela Regra dos 9 de Wallace e a profundidade das lesões descritas, qual a melhor conduta inicial para este paciente?"],"alternativas":{"A":"Estimar a extensão em aproximadamente 36% da superfície corporal total, classificando como queimaduras de espessura parcial profunda, com indicação de cobertura com gazes umedecidas e transporte para unidade de atenção primária para observação.","B":"Estimar a extensão em aproximadamente 31,5% da superfície corporal total, considerando como queimaduras de espessura total, com indicação de suporte ventilatório com oxigênio a 100%, início de reposição volêmica e transporte imediato para um centro especializado em queimados.","C":"Estimar a extensão em aproximadamente 27% da superfície corporal total, classificando como queimaduras de espessura parcial superficial, com indicação de analgesia simples e hidratação oral, mantendo transporte sem prioridade.","D":"Estimar a extensão em aproximadamente 45% da superfície corporal total, classificando como queimaduras de espessura superficial, com necessidade apenas de monitorização de sinais vitais e aplicação de compressas frias nas áreas afetadas."},"correta":"B","oficial":{"B":"Estimar a extensão em aproximadamente 31,5% da superfície corporal total, considerando como queimaduras de espessura total, com indicação de suporte ventilatório com oxigênio a 100%, início de reposição volêmica e transporte imediato para um centro especializado em queimados.","C":"Estimar a extensão em aproximadamente 27% da superfície corporal total, classificando como queimaduras de espessura parcial superficial, com indicação de analgesia simples e hidratação oral, mantendo transporte sem prioridade: Incorreta por subestimar a extensão da queimadura (27% em vez de 31,5%), por classificar erroneamente como espessura parcial superficial, e por indicar apenas analgesia simples e hidratação oral, o que é totalmente inadequado para o caso.","A":"Estimar a extensão em aproximadamente 36% da superfície corporal total, classificando como queimaduras de espessura parcial profunda, com indicação de cobertura com gazes umedecidas e transporte para unidade de atenção primária para observação: Incorreta por uma dupla falha: superestimar a extensão da SCQ (36%) e classificar as lesões como espessura parcial profunda, quando os achados clínicos indicam claramente uma espessura total. Além disso, sugeriu uma conduta inadequada de encaminhamento apenas para atenção primária.","D":"Estimar a extensão em aproximadamente 45% da superfície corporal total, classificando como queimaduras de espessura superficial, com necessidade apenas de monitorização de sinais vitais e aplicação de compressas frias nas áreas afetadas. Incorreta por superestimar a extensão (45% em vez de 31,5%), classificar como espessura superficial (o que não condiz com a descrição clínica de lesão de 3º grau) e por recomendar apenas monitorização simples e compressas frias, o que não é indicado em grandes queimados com lesões profundas e risco de inalação."},"oficial_extra":["A alternativa está correta porque a estimativa de extensão com base na Regra dos 9 de Wallace é de aproximadamente 31,5%, considerando:","Face = 4,5% (se fosse crânio, seria 9%);","Região anterior do tórax = 9%;","Ambos os membros superiores (anterior + posterior) = 18%;","Totalizando 31,5% da superfície corporal total (SCQ).","A profundidade das lesões, descritas como secas, esbranquiçadas, com áreas enegrecidas e ausência de dor, caracteriza queimaduras de espessura total (3º grau). Além disso, o cenário de incêndio em ambiente fechado, com queixas respiratórias e queimaduras de face e tórax, sugere forte suspeita de lesão inalatória, exigindo suporte ventilatório com oxigênio a 100%, início precoce de reposição volêmica com cristalóides e transporte imediato e prioritário para um centro especializado em queimados.","Incorretas:","Referência:","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS (NAEMT); AMERICAN COLLEGE OF SURGEONS. Prehospital Trauma Life Support: PHTLS. 10. ed. Burlington, MA: Jones & Bartlett Learning, 2023."],"refs":[],"tema":"Queimadura de 3º grau — extensão e conduta","conceito":"Aspecto seco, esbranquiçado com pontos enegrecidos e SEM dor = espessura total (3º grau), pela destruição das terminações nervosas. Conta: face 4,5% (a cabeça inteira vale 9%; só a face é metade) + tórax anterior 9% (o tronco anterior inteiro é 18%; só o tórax é metade) + ambos os membros superiores completos 18% = 31,5%.","alt":{"A":"Superestima (36%) e classifica como parcial profunda; e mandar grande queimado para atenção primária é erro grave.","B":"CORRETA. 31,5%, espessura total, O2 a 100%, reposição volêmica e transporte para centro de queimados.","C":"Subestima e chama de parcial superficial — incompatível com lesão seca, branca e indolor. Hidratação oral não serve em grande queimado.","D":"Superestima (45%) e chama de superficial; compressa fria em grande queimado causa hipotermia."},"roteiro":[],"takehome":"Queimadura que NÃO dói é a mais grave. E preste atenção às frações: 'face' não é a cabeça inteira, 'tórax anterior' não é o tronco anterior inteiro.","area":"HAM · Queimaduras e trauma ambiental"},{"id":122,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":7}],"enunciado":["(FASA VIC) Homem, 34 anos, previamente hígido, é vítima de um acidente automobilístico em rodovia de alta velocidade. Ele era o condutor do veículo e usava cinto de segurança. De acordo com informações do serviço de regulação, houve colisão frontal contra um poste a aproximadamente 80 km/h, com acionamento dos airbags. O paciente foi encontrado consciente, queixando-se de dor torácica e dispneia leve. A avaliação inicial revelou frequência cardíaca de 110 bpm, pressão arterial de 98/65 mmHg, frequência respiratória de 24 irpm e saturação de 94% em ar ambiente. O exame físico evidenciou abrasões no tórax compatíveis com o uso do cinto de segurança e murmúrios vesiculares reduzidos no hemitórax esquerdo, sem desvio de traqueia.","Assinale a alternativa que representa o impacto fisiológico do trauma no paciente e a conduta inicial adequada."],"alternativas":{"A":"O paciente apresenta sinais de liberação de catecolaminas, resultando em hipermetabolismo. O manejo deve incluir monitorização rigorosa da glicemia e reposição adequada de fluidos.","B":"O paciente apresenta sinais iniciais de choque hipovolêmico devido à hemorragia torácica oculta. A conduta inicial deve incluir a reposição volêmica agressiva com cristaloides.","C":"O paciente encontra-se em uma fase hipodinâmica do choque, caracterizada por redução da taxa metabólica e da demanda energética, justificando um aporte calórico inicial reduzido.","D":"A presença de taquicardia e hipotensão indica um pneumotórax hipertensivo, sendo necessária a drenagem torácica imediata sem confirmação por imagem."},"correta":"A","oficial":{"A":"O paciente apresenta sinais de liberação de catecolaminas, resultando em hipermetabolismo. O manejo deve incluir monitorização rigorosa da glicemia e reposição adequada de fluidos. Correta. O politrauma ativa a resposta neuroendócrina, promovendo aumento do cortisol, catecolaminas e glicose sanguínea. O controle glicêmico é essencial, pois hiperglicemia excessiva pode levar a disfunção imunológica e pior prognóstico.","B":"O paciente apresenta sinais iniciais de choque hipovolêmico devido à hemorragia torácica oculta. A conduta inicial deve incluir a reposição volêmica agressiva com cristaloides. Incorreta. Embora o paciente apresente taquicardia e pressão arterial limítrofe, não há sinais claros de choque hipovolêmico grave. A hemorragia torácica maciça (hemotórax) se manifestaria com instabilidade hemodinâmica significativa e possível macicez à percussão, o que não foi descrito no caso. Além disso, a reposição volêmica agressiva pode ser prejudicial, pois aumenta o risco de coagulopatia e agrava a resposta inflamatória ao trauma.","D":"A presença de taquicardia e hipotensão indica um pneumotórax hipertensivo, sendo necessária a drenagem torácica imediata sem confirmação por imagem. Incorreta. Embora o paciente tenha sinais de possível lesão torácica, a ausência de desvio traqueal e instabilidade hemodinâmica imediata torna improvável um pneumotórax hipertensivo. O diagnóstico de pneumotórax simples ou contusão pulmonar deve ser confirmado por exames de imagem antes da realização de qualquer procedimento invasivo.","C":"O paciente encontra-se em uma fase hipodinâmica do choque, caracterizada por redução da taxa metabólica e da demanda energética, justificando um aporte calórico inicial reduzido. Incorreta. A resposta metabólica ao trauma não se caracteriza por um estado hipodinâmico com redução da taxa metabólica. Pelo contrário, a fase inicial é marcada por um estado hipercatabólico com aumento do gasto energético e proteico, exigindo um manejo nutricional precoce e adequado."},"oficial_extra":["Análise das demais alternativas:","Referência:","National Association of Emergency Medical Technicians. PHTLS - Atendimento pré- hospitalar ao traumatizado. 10ª ed. Burlington: Jones & Bartlett Learning, 2022. 762 p."],"refs":[],"tema":"Resposta metabólica ao trauma","conceito":"O trauma dispara fase catabólica (flow phase): catecolaminas, cortisol e glucagon elevam a glicemia (hiperglicemia de estresse), aumentam lipólise e proteólise. Hiperglicemia não controlada piora infecção e desfecho. Aqui o paciente está compensado (PA 98/65, FC 110) e sem sinais de pneumotórax hipertensivo.","alt":{"A":"CORRETA. Liberação de catecolaminas com hipermetabolismo; manejo com controle glicêmico e reposição adequada de fluidos.","B":"Não há sinais de choque hipovolêmico grave, e reposição AGRESSIVA aumenta coagulopatia, hipotermia e sangramento — a estratégia atual é reposição criteriosa.","C":"Inverte o conceito: a fase inicial é HIPERmetabólica e hipercatabólica, não hipodinâmica.","D":"Pneumotórax hipertensivo teria desvio de traqueia, turgência jugular e instabilidade — o enunciado nega desvio de traqueia de propósito."},"roteiro":[],"takehome":"Murmúrio reduzido unilateral SEM desvio de traqueia e SEM instabilidade = pneumotórax simples, hemotórax ou contusão — não hipertensivo.","area":"HAM · Choque e resposta ao trauma"},{"id":123,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":8}],"enunciado":["(Banco AFYA) Homem, 28 anos, é admitido após acidente de trânsito de alta energia. A equipe realizou a avaliação primária, garantindo via aérea pérvia, ventilação adequada e estabilização hemodinâmica inicial. Na avaliação secundária, registram-se os seguintes dados:","Sinais vitais: PA = 90x60 mmHg, FC = 132 bpm, FR = 28 irpm, SpO₂ = 93%.","Histórico SAMPLE: nega alergias, refere uso prévio de enalapril para hipertensão, última refeição há 4 horas, relata dor abdominal progressiva desde o acidente.","Exame céfalo-podálico: escoriações faciais, murmúrio vesicular preservado, abdome distendido e doloroso difusamente, sem fraturas pélvicas aparentes, pulsos periféricos palpáveis em membros inferiores.","Qual conduta deve ser priorizada nesse paciente na avaliação secundária?"],"alternativas":{"A":"Prescrever expansão volêmica agressiva, administrar corticoide endovenoso e liberar o paciente para exames ambulatoriais complementares.","B":"Proceder à reposição volêmica criteriosa, solicitar FAST abdominal à beira-leito e acionar equipe cirúrgica para investigação de possível lesão intra-abdominal.","C":"Iniciar analgesia venosa, manter jejum, solicitar tomografia abdominal com contraste e monitorar evolução clínica.","D":"Realizar sondagem nasogástrica, prescrever antibiótico profilático e programar observação clínica em unidade de internação."},"correta":"B","oficial":{"C":"Iniciar analgesia venosa, manter jejum, solicitar tomografia abdominal com contraste e monitorar evolução clínica. Incorreta. Tomografia pode ser útil, mas o paciente está instável (PA 90x60 mmHg, FC 132), e o exame de escolha na instabilidade é o FAST.","D":"Realizar sondagem nasogástrica, prescrever antibiótico profilático e programar observação clínica em unidade de internação. Incorreta. Sondagem nasogástrica e antibiótico não são condutas iniciais em abdome agudo traumático com instabilidade.","B":"Proceder à reposição volêmica criteriosa, solicitar FAST abdominal à beira-leito e acionar equipe cirúrgica para investigação de possível lesão intra-abdominal. Correta. Instabilidade hemodinâmica + dor abdominal difusa → suspeita de hemoperitônio. Conduta: reposição volêmica moderada, FAST à beira-leito e acionar equipe cirúrgica.","A":"Prescrever expansão volêmica agressiva, administrar corticoide endovenoso e liberar o paciente para exames ambulatoriais complementares. Incorreta. Expansão volêmica agressiva e corticoide não têm indicação no contexto; liberação ambulatorial seria erro grave."},"oficial_extra":[],"refs":["AMERICAN COLLEGE OF SURGEONS. ATLS: Advanced Trauma Life Support. 10. ed. Chicago: ACS, 2018.","LOPEZ, Fábio A.; BURNS, Dennis Alexander R.; JUNIOR, Dioclécio C. Tratado de Pediatria. 5. ed. Barueri-SP: Manole, 2021.","SOCIEDADE BRASILEIRA DE PEDIATRIA. Departamento de Emergências. Atendimento inicial ao trauma em crianças e adolescentes. Rio de Janeiro: SBP, 2022."],"tema":"Trauma abdominal com instabilidade","conceito":"PA 90x60 com FC 132 e abdome distendido e doloroso = suspeita de hemoperitônio. A regra de ouro: paciente INSTÁVEL faz FAST à beira do leito (rápido, sem sair da sala); paciente ESTÁVEL pode ir para a TC. FAST positivo com instabilidade = laparotomia.","alt":{"A":"Expansão agressiva, corticoide (sem indicação nenhuma no trauma) e alta ambulatorial — três erros.","B":"CORRETA. Reposição criteriosa + FAST à beira-leito + acionar a equipe cirúrgica.","C":"TC exige paciente estável; levar instável para a tomografia é arriscado (o 'túnel da morte').","D":"Sonda nasogástrica e antibiótico profilático não são conduta inicial no abdome agudo traumático instável."},"roteiro":[],"takehome":"Instável = FAST na sala. Estável = TC. Essa é a bifurcação que quase toda questão de trauma abdominal cobra.","area":"HAM · Atendimento ao politraumatizado"},{"id":124,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2025.2","num":9}],"enunciado":["(UNIREDENTOR) Você participa de uma equipe de atendimento pré-hospitalar e é chamado para um atendimento, por solicitação da central de regulação, com a seguinte informação: \"Acidente automobilístico envolvendo colisão frontal entre dois veículos, com múltiplas vítimas. Condutor do veículo A preso às ferragens, inconsciente, francamente taquidispneico, uso de cinto de segurança; passageiro do veículo B ejetado do automóvel, consciente, com queixa de dor torácica importante e dispneia leve.\"","Com base no cenário apresentado,","a) Descreva os componentes a serem observados na avaliação primária (ABCDE) no atendimento inicial ao paciente politraumatizado de uma forma geral. (0,5 ponto)","b) Elabore um plano de atendimento às vítimas (para cada uma), considerando as informações recebidas da regulação e os princípios de cinemática do trauma. (0,5 ponto)","c) Explique, de forma sucinta, a importância da avaliação primária no contexto do manejo global do paciente traumatizado. (0,5 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Avaliação Primária (ABCDE):","A – Airway (via aérea com proteção da coluna cervical): Avaliar permeabilidade da via aérea; estabilizar manualmente a coluna cervical.","B – Breathing (respiração): Avaliar expansibilidade torácica, movimentos paradoxais, uso de musculatura acessória, murmúrio vesicular, saturação de O₂; administrar oxigenoterapia.","C – Circulation (circulação com controle de hemorragias): Checar pulso s, tempo de enchimento capilar, coloração da pele, controle imediato de hemorragias externas graves; acesso venoso calibroso.","D – Disability (estado neurológico): Aplicar Escala de Coma de Glasgow, avaliar pupilas.","E – Exposure (exposição/controle do ambiente): Remover roupas para inspeção completa; prevenir hipotermia.","Plano de Atendimento às Vítimas:","Priorizar avaliação rápida da cena (segurança da cena, número de vítimas, mecanismos de trauma, recursos adicionais).","Condutor do veículo A: vítima inconsciente e presa às ferragens → alto risco, requer suporte avançado, prioridade máxima, via aérea definitiva (intubação orotraqueal se necessário) e desencarceramento (extricação).","Passageiro do veículo B: ejetado do carro, consciente com dispneia → suspeita de trauma torácico (suspeita de hemotórax, pneumotórax, contusão pulmonar). Realizar oxigenoterapia, monitorização da PA, FC e oximetria, acesso venoso e transporte rápido para hospital de referência. Considerar via aérea definitiva em","caso de piora do padrão respiratório.","Aplicar os princípios de cinemática do trauma: colisão frontal com ejeção sugere energia cinética elevada, associada a lesões internas graves (trauma torácico, abdominal, cranioencefálico e fraturas múltiplas). Considerar escores para avaliação de lesão raquimedular (Nexus, CCR).","Importância da Avaliação Primária:","Permite identificar e intervir rapidamente em condições ameaçadoras à vida (hemorragias exsanguinantes, vias aéreas obstruídas, pneumotórax hipertensivo, estados de choque, TCE grave, lesões negligenciadas e hipotermia). Constitui o alicerce do manejo efetivo ao paciente politraumatizado, garantindo que lesões fatais sejam identificadas e tratadas antes de procedimentos diagnósticos ou intervenções menos urgentes."],"refs":["NAEMT. Prehospital Trauma Life Support (PHTLS): Atendimento Pré-hospitalar ao Traumatizado. 9.ª ed. Jones & Bartlett Learning; 2020.","ATLS Subcommittee, American College of Surgeons. Advanced Trauma Life Support (ATLS®): Student Course Manual. 10ª ed. Chicago: American Collegeof Surgeons; 2018."],"tema":"Múltiplas vítimas — ABCDE e cinemática","conceito":"Duas vítimas com mecanismos diferentes: encarceramento com inconsciência (prioridade máxima, via aérea definitiva + extricação) e EJEÇÃO (marcador de alta energia, com mortalidade cerca de 6x maior e alto risco de trauma torácico e raquimedular).","alt":{},"roteiro":["a) ABCDE: A — via aérea com estabilização cervical manual; B — expansibilidade, movimento paradoxal, musculatura acessória, murmúrio, SpO2 e oxigenoterapia; C — pulsos, enchimento capilar, coloração, controle de hemorragias externas, acesso venoso calibroso; D — Glasgow e pupilas; E — exposição completa com prevenção de hipotermia.","b) Antes das vítimas: segurança da cena, número de vítimas, mecanismo e necessidade de recursos adicionais (bombeiros para desencarceramento, mais viaturas).","Condutor do veículo A (inconsciente, taquidispneico, encarcerado): prioridade máxima. Via aérea definitiva (Glasgow rebaixado), oxigenação, imobilização e extricação com a equipe de resgate; transporte para centro de trauma.","Passageiro do veículo B (ejetado, dor torácica, dispneia leve): consciente, mas com mecanismo de altíssima energia. Suspeitar de pneumotórax, hemotórax, contusão pulmonar e lesão raquimedular. Oxigenoterapia, monitorização, acesso venoso, imobilização da coluna e transporte rápido; via aérea definitiva se piorar.","Aplicar critérios de coluna (NEXUS ou Canadian C-Spine) para decidir sobre restrição de movimento.","c) Importância da avaliação primária: identifica e trata, em ordem de letalidade, as condições que matam em minutos — hemorragia exsanguinante, obstrução de via aérea, pneumotórax hipertensivo, choque, TCE grave e hipotermia — antes de qualquer exame diagnóstico. É a base do atendimento e deve ser repetida a cada mudança clínica."],"takehome":"Ejeção do veículo é, por si só, critério de transporte para centro de trauma, mesmo com o paciente parecendo bem.","area":"HAM · Atendimento ao politraumatizado"},{"id":125,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2025.2","num":10}],"enunciado":["(UNIGRANRIO Caxias) Paciente masculino, 34 anos, vítima de agressão com objeto cortante no pescoço, é admitido na sala de emergência em insuficiência respiratória grave, com estridor progressivo e queda da saturação (SpO₂ 82% em máscara com reservatório). Houve falha em múltiplas tentativas de intubação orotraqueal devido a edema e sangramento, e falha na ventilação com máscara facial e dispositivo supraglótico. Diante do quadro, a equipe indica via aérea cirúrgica de emergência.","Solicita-se ao aluno:","a) Indicar o procedimento a ser realizado baseado em evidências científicas. (0,3 ponto)","b) Descrever de forma sucinta e organizada da técnica do procedimento, incluindo:","1) pontos anatômicos de referência. (0,3 ponto)","2) material utilizado. (0,3 ponto)","3) passos técnicos. (0,6 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Critérios esperados de resposta:","Conduta correta: realização imediata de cricotireoidostomia por punção como via aérea cirúrgica temporária em situação de emergência. Justificativa: reconhece-se falha em intubação e em ventilação supraglótica/máscara. Diretrizes (ASA 2022, DAS 2015) orientam proceder sem demora a cricotireoidostomia. Descrição técnica (resumo esperado):","Anatomia: identificar membrana cricotireóidea (entre cartilagem tireoide e cricóide). Material: agulha ou cateter de grosso calibre (≥14G), seringa com solução salina, sistema de ventilação com conector em “Y” ou adaptador para oxigênio de alta pressão. Passos:","1. Posicionar paciente em decúbito dorsal, com extensão cervical, se possível. 2. Palpar membrana cricotireóidea. 3. Introduzir a agulha ou cateter em um ângulo de 45° caudal, aspirando até que haja entrada de ar. 4. Avançar cateter e retirar agulha. 5. Conectar sistema de ventilação de oxigênio com válvula adequada. 6. Confirmar entrada de ar bilateral e saturação.","Observação final: técnica é temporária, devendo ser convertida para via aérea definitiva (cricotireoidostomia cirúrgica ou traqueostomia) o quanto antes."],"refs":["AMERICAN SOCIETY OF ANESTHESIOLOGISTS. Practice guidelines for management of the difficult airway. Anesthesiology, v. 136, n. 1, p. 31-81, 2022. DOI: 10.1097/ALN.0000000000004002.","DIFFICULT AIRWAY SOCIETY. Guidelines for unanticipated difficult intubation in adults. British Journal of Anaesthesia, v. 115, n. 6, p. 827-848, 2015. DOI: 10.1093/bja/aev371.","TOWNSEND, Courtney M. Sabiston textbook of surgery: the biological basis of modern surgical practice. 21. ed. Philadelphia: Elsevier, 2021.","BRUNNICARDI, F. Charles et al. Schwartz’s principles of surgery. 11. ed. New York: McGraw-Hill Education, 2019.","COLÉGIO BRASILEIRO DE CIRURGIÕES. Tratado de cirurgia do CBC. 3. ed. Rio de Janeiro: Atheneu, 2022."],"tema":"Via aérea cirúrgica de emergência","conceito":"Cenário 'não intubo, não ventilo' (CICO): falha de intubação + falha de ventilação com máscara e supraglótico = via aérea cirúrgica imediata. Ponto anatômico: membrana cricotireóidea, entre a cartilagem tireoide (pomo de Adão) acima e a cricoide abaixo. A cricotireoidostomia CIRÚRGICA é contraindicada em menores de 12 anos — nessa faixa usa-se a punção.","alt":{},"roteiro":["a) Cricotireoidostomia de emergência (a banca aceitou a técnica por punção; a cirúrgica é a preferida no adulto e pode ser citada).","b1) Referências anatômicas: palpar a proeminência laríngea (cartilagem tireoide), descer até a depressão da membrana cricotireóidea, limitada inferiormente pela cartilagem cricoide. Estabilizar a laringe entre polegar e dedo médio da mão não dominante.","b2) Material: na punção — cateter ≥ 14G (12–14G no adulto), seringa com soro para aspirar e confirmar ar, conector/adaptador para oxigênio de alta pressão ou sistema em Y. Na cirúrgica — bisturi nº 10 ou 11, pinça de Kelly ou dilatador traqueal, gancho traqueal, tubo de traqueostomia 6.0 ou TOT 5.0–6.0, seringa e fixação; antissepsia e anestesia local se houver tempo.","b3) Passos (punção): decúbito dorsal, extensão cervical se não houver contraindicação (em trauma, mantenha estabilização); palpar e fixar a membrana; puncionar em ângulo de 45° em direção CAUDAL aspirando até o refluxo de ar; avançar o cateter e retirar a agulha; conectar ao sistema de oxigênio; confirmar expansão torácica e ausculta bilateral.","Observação essencial: a punção é TEMPORÁRIA (ventilação em jato permite oxigenar por cerca de 30–45 min, com retenção progressiva de CO2) e deve ser convertida em via aérea definitiva — cricotireoidostomia cirúrgica ou traqueostomia — o quanto antes.","Cite as complicações: sangramento, falso trajeto, lesão de cartilagem, enfisema subcutâneo, perfuração esofágica."],"takehome":"Decore a referência: entre a tireoide e a cricoide, e a agulha aponta para BAIXO (caudal). Punção é ponte, não destino.","area":"HAM · Via aérea e ventilação"},{"id":126,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":1}],"enunciado":["(BANCO AFYA) Um motociclista de 22 anos chega ao pronto-socorro após colisão com automóvel. Está consciente, orientado, com FR = 22 irpm, FC = 110 bpm, PA = 100x65 mmHg e SpO₂ = 95% em ar ambiente. Durante a avaliação secundária, após a estabilização inicial da via aérea e da circulação, o médico inicia o exame céfalo-podálico. Observa-se escoriações em couro cabeludo, pupilas isocóricas e fotorreagentes, murmúrio vesicular preservado, dor à palpação em hemitórax direito, sem enfisema subcutâneo, abdome flácido sem dor à palpação, pelve estável e escoriações em membros inferiores.","Qual medida integra adequadamente a avaliação secundária nesse paciente?"],"alternativas":{"A":"Integrar exame céfalo-podálico detalhado, registro dos sinais vitais seriados e coleta de histórico SAMPLE.","B":"Indicar a realização de exames de imagem, pois a avaliação secundária se restringe à propedêutica complementar.","C":"Priorizar a pesquisa de fraturas e lesões ortopédicas, deixando a anamnese detalhada para etapa posterior.","D":"Repetir a avaliação primária, uma vez que a secundária não inclui a investigação por sistemas corporais."},"correta":"A","oficial":{"A":"Integrar exame céfalo-podálico detalhado, registro dos sinais vitais seriados e coleta de histórico SAMPLE. Correta. Avaliação secundária = exame céfalo-podálico sistemático + sinais vitais + histórico SAMPLE.","C":"Priorizar a pesquisa de fraturas e lesões ortopédicas, deixando a anamnese detalhada para etapa posterior. Incorreta. Pesquisa ortopédica isolada não substitui avaliação integral do paciente politraumatizado.","D":"Repetir a avaliação primária, uma vez que a secundária não inclui a investigação por sistemas corporais. Incorreta. Avaliação primária e secundária são complementares, não redundantes."},"oficial_extra":["Realizar apenas exames de imagem, pois a avaliação secundária se restringe à propedêutica complementar. Incorreta. Avaliação secundária não se restringe a exames de imagem; envolve exame físico completo e anamnese dirigida."],"refs":["AMERICAN COLLEGE OF SURGEONS. ATLS: Advanced Trauma Life Support. 10. ed. Chicago: ACS, 2018.","LOPEZ, Fábio A.; BURNS, Dennis Alexander R.; JUNIOR, Dioclécio C. Tratado de Pediatria. 5. ed. Barueri-SP: Manole, 2021.","SOCIEDADE BRASILEIRA DE PEDIATRIA. Departamento de Emergências. Atendimento inicial ao trauma em crianças. Rio de Janeiro: SBP, 2022."],"tema":"Avaliação secundária — conteúdo","conceito":"Avaliação secundária = exame céfalo-podálico sistemático + sinais vitais seriados + história SAMPLE. Exames de imagem são complementares e vêm depois, não substituem o exame.","alt":{"A":"CORRETA. Exame céfalo-podálico detalhado, sinais vitais seriados e SAMPLE.","B":"Falso: a secundária não se restringe a propedêutica complementar.","C":"Foco ortopédico isolado deixa passar lesões torácicas e abdominais — e a dor em hemitórax direito descrita merece investigação.","D":"A secundária inclui, sim, investigação por sistemas; repetir a primária só se o paciente deteriorar."},"roteiro":[],"takehome":"Decore a tríade da secundária: céfalo-podálico + sinais vitais seriados + SAMPLE.","area":"HAM · Atendimento ao politraumatizado"},{"id":127,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":2}],"enunciado":["(AFYA UNIGRANRIO BARRA DA TIJUCA) Um homem de 20 anos é resgatado após afogamento em um rio. Encontra-se torporoso, agitado, com respiração irregular. Sinais vitais: frequência cardíaca de 132 bpm (VR: 60–100 bpm), frequência respiratória de 32 irpm (VR: 12–20 irpm), pressão arterial 88x55 mmHg (VR: 90– 120/60–80 mmHg), saturação de oxigênio 84% em ar ambiente (VR: >94%). O exame físico revela taquidispneia com tiragem subcostal, cianose de extremidades e estertores crepitantes difusos à ausculta pulmonar.","De acordo com o PHTLS, qual é a conduta inicial adequada para esse paciente?"],"alternativas":{"A":"Prescrever broncodilatador inalatório com corticoide venoso para reversão do broncoespasmo associado ao afogamento.","B":"Utilizar corticoide inalatório e posicionar o paciente em decúbito lateral, iniciar oxigênio sob máscara de Venturi com O2 a 100%.","C":"Indicar intubação orotraqueal precoce com O₂ a 100%, garantindo proteção das vias aéreas e ventilação adequada.","D":"Iniciar oxigenoterapia por cateter nasal a 10 L/min e reavaliar resposta à oxigenação em cinco minutos."},"correta":"C","oficial":{"D":"Iniciar oxigenoterapia por cateter nasal a 10 L/min e reavaliar resposta à oxigenação em cinco minutos. Incorreta. O cateter nasal não é suficiente para reverter uma hipoxemia grave associada à alteração do nível de consciência e risco de aspiração.","C":"Indicar intubação orotraqueal precoce com O₂ a 100%, garantindo proteção das vias aéreas e ventilação adequada. Correta. A intubação orotraqueal precoce com oxigênio a 100% está indicada em pacientes com rebaixamento do nível de consciência, esforço respiratório intenso e hipoxemia refratária. Essa conduta protege a via aérea e permite ventilação eficaz, conforme o protocolo do PHTLS (10.ª ed.).","A":"Prescrever broncodilatador inalatório com corticoide venoso para reversão do broncoespasmo associado ao afogamento. Incorreta. Embora broncodilatadores e corticoides possam ser úteis em casos selecionados com broncoespasmo, não são prioridade em pacientes com insuficiência respiratória e indicação de via aérea avançada.","B":"Utilizar corticoide inalatório e posicionar o paciente em decúbito lateral; iniciar oxigênio sob máscara de Venturi com O2 a 100%. Incorreta. O posicionamento lateral e uso de corticoide inalatório não são suficientes nem seguros neste contexto de torpor e instabilidade clínica. O suporte ventilatório precisa ser invasivo pelo nível de consciência do paciente e pelo padrão ventilatório (respiração irregular). Há risco elevado de aspiração."},"oficial_extra":["Referência:","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS. PHTLS - Atendimento pré-hospitalar ao traumatizado. 9.ª ed. Rio de Janeiro: Elsevier, 2020."],"refs":[],"tema":"Afogamento grave — via aérea definitiva","conceito":"Torporoso (rebaixamento de consciência) + respiração irregular + SpO2 84% + crepitantes difusos (edema pulmonar) + hipotensão. Rebaixamento de consciência + hipoxemia refratária = intubação. O afogamento causa lesão de surfactante e SDRA-like; a ventilação com PEEP é parte do tratamento.","alt":{"A":"Broncodilatador e corticoide não são prioridade e não tratam a hipoxemia por edema pulmonar.","B":"Corticoide inalatório não tem papel, e Venturi não entrega 100%; além disso o torpor traz risco alto de aspiração.","C":"CORRETA. Intubação orotraqueal precoce com O2 a 100%, protegendo a via aérea e garantindo ventilação (com PEEP).","D":"Cateter nasal a 10 L/min é oferta insuficiente e desconfortável; não corrige hipoxemia grave."},"roteiro":[],"takehome":"Corticoide não tem lugar no afogamento nem na lesão inalatória — é distrator recorrente nessas provas.","area":"HAM · Via aérea e ventilação"},{"id":128,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":3}],"enunciado":["(AFYA IPATINGA) Homem, 28 anos, previamente hígido, é retirado de uma cachoeira após submersão em água doce por tempo estimado de 3–4 minutos, sem relato de queda de altura ou trauma associado. Ele é trazido pela equipe de resgate, caminhando com apoio, vigilante, orientado, porém bastante ansioso, queixando-se de dispneia leve.","Na avaliação inicial, observa-se: - Estado mental: consciente, orientado, fala frases completas com leve esforço. - Frequência respiratória: 24 irpm, com sensação de “falta de ar”, sem tiragem importante. - Ausculta pulmonar: crepitações finas isoladas nas bases. - Saturação de O₂ em ar ambiente: 92%. - Frequência cardíaca: 98 bpm; pressão arterial: 120/75 mmHg. - Pele fria, porém com boa perfusão periférica, sem cianose central. - Sem vômitos ou secreções abundantes na via aérea.","Recordando a classificação do grau de afogamento, assinale a alternativa que apresenta o grau correto de afogamento deste paciente e a conduta adequada a ser tomada no atendimento inicial."],"alternativas":{"A":"Afogamento grau 4 – Iniciar imediatamente compressões torácicas, ventilação de suporte avançado e considerar uso precoce de drogas vasoativas, mesmo com pulso e pressão arterial normais.","B":"Afogamento grau 3 – Necessidade de ventilação com bolsa-válvula-máscara e intubação orotraqueal imediata, encaminhamento obrigatório para UTI, independentemente da saturação de O₂.","C":"Afogamento grau 1 – Conduta expectante, sem necessidade de oxigenoterapia ou observação prolongada, podendo liberar o paciente para domicílio imediatamente após breve avaliação.","D":"Afogamento grau 2 – Oxigenoterapia suplementar, observação em unidade de emergência por algumas horas, controle seriado de sinais vitais e saturação de O₂, com alta se permanecer estável."},"correta":"D","oficial":{"D":"Resposta correta: \"Afogamento grau 2 – Oxigenoterapia suplementar, observação em unidade de emergência por algumas horas, controle seriado de sinais vitais e saturação de O₂, com alta se permanecer estável.\"","C":"Afogamento grau 1 – Conduta expectante, sem necessidade de oxigenoterapia ou observação prolongada, podendo liberar o paciente para domicílio imediatamente após breve avaliação. Incorreta. No grau 1, o paciente apresenta tosse leve, sem dispneia e sem hipoxemia, com exame físico pulmonar normal, em que se poderia discutir alta mais precoce após observação mínima.","A":"Os graus mais elevados (3, 4, etc.) cursam com insuficiência respiratória moderada a grave, necessidade de ventilação assistida ou parada cardiorrespiratória, o que não se observa neste caso. Portanto, as alternativas \"Afogamento grau 4 – Iniciar imediatamente compressões torácicas, ventilação de suporte avançado e considerar uso precoce de drogas vasoativas, mesmo com pulso e pressão arterial normais.\" e \"Afogamento grau 3 – Necessidade de ventilação com bolsa-válvula- máscara e intubação orotraqueal imediata, encaminhamento obrigatório para UTI, independentemente da saturação de O₂.\" estão incorretas."},"oficial_extra":["Comentários: A vítima apresenta tosse, dispneia leve e hipoxemia discreta (SpO₂ ~92% em ar ambiente), com achados pulmonares mínimos, compatíveis com afogamento grau 2, em que há comprometimento respiratório leve, porém sem falência respiratória nem instabilidade hemodinâmica significativas. A conduta recomendada é oxigenoterapia suplementar, observação por algumas horas em ambiente hospitalar (emergência/observação), com monitorização de sinais vitais e saturação de O₂, devido ao risco de piora respiratória tardia (edema pulmonar secundário ao afogamento).","Referência:","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS. PHTLS: atendimento pré-hospitalar ao traumatizado. 10. ed. Rio de Janeiro: Elsevier, 2023."],"refs":[],"tema":"Afogamento grau 2 — observação","conceito":"Consciente, falando frases completas, dispneia leve, crepitações isoladas nas bases, SpO2 92%, hemodinâmica normal = grau 2. Ponto importante da conduta: mesmo o paciente leve precisa de OBSERVAÇÃO por algumas horas, pela possibilidade de piora respiratória tardia (edema pulmonar pode aparecer em 4–8 h).","alt":{"A":"Grau 4 tem insuficiência respiratória grave; e compressão torácica com pulso e PA normais é erro.","B":"Grau 3 tem crepitações difusas e hipoxemia mais importante; intubação obrigatória aqui seria sobretratamento.","C":"Grau 1 é só tosse, sem dispneia e sem hipoxemia. Liberar de imediato ignora o risco de deterioração tardia.","D":"CORRETA. Grau 2 — oxigenoterapia, observação por algumas horas com sinais vitais e SpO2 seriados, alta se estável."},"roteiro":[],"takehome":"Nenhuma vítima de afogamento com sintoma respiratório recebe alta imediata: o edema pulmonar pode aparecer horas depois.","area":"HAM · Queimaduras e trauma ambiental"},{"id":129,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":4}],"enunciado":["(AFYA PORTO NACIONAL) Um homem de 28 anos, previamente saudável, é atendido na sala de emergência da UPA após colisão automobilística em alta velocidade. Ele estava como passageiro do banco dianteiro, sem uso de cinto de segurança.","Na chegada, encontra-se consciente, agitado, pálido, taquicárdico (FC 138 bpm), taquipneico (FR 32 irpm), com pressão arterial de 84/54 mmHg, perfusão periférica lentificada e extremidades frias.","Considerando os princípios e as respostas fisiológicas orgânicas típicas ao trauma grave, qual dos achados abaixo representa uma resposta adaptativa inicial do organismo ao politrauma?"],"alternativas":{"A":"Bradipneia e hipoventilação em resposta à dor e hipoxemia inicial.","B":"Taquicardia e vasoconstrição periférica como mecanismos de compensação.","C":"Bradicardia sinusal decorrente de estímulo vagal compensatório.","D":"Hipotensão sustentada por vasodilatação periférica generalizada."},"correta":"B","oficial":{},"oficial_extra":["Diante de um trauma grave com hemorragia ou choque hipovolêmico, o organismo ativa respostas fisiológicas de compensação para manter a perfusão dos órgãos vitais.","Taquicardia ocorre como primeira resposta para aumentar o débito cardíaco frente à perda volêmica. Vasoconstrição periférica é desencadeada pelo sistema nervoso simpático, direcionando o fluxo sanguíneo para órgãos nobres (coração, cérebro e rins). Essas manifestações clínicas explicam a presença de extremidades frias, enchimento capilar lento, agitação e palidez. Dessa forma, esta é a alternativa correta.","bradicardia sinusal por estímulo vagal é alternativa incorreta, pois a bradicardia não é resposta típica inicial ao trauma; pode surgir apenas em fases muito avançadas de choque ou por causas específicas (trauma craniano grave, hipoxemia terminal).","hipotensão por vasodilatação é uma alternativa incorreta, pois a hipotensão no choque hipovolêmico é consequência da perda de volume, e não de vasodilatação periférica generalizada.","bradipneia e hipoventilação: alternativa incorreta, já que a resposta inicial ao trauma é a taquipneia, como tentativa de compensação metabólica e oxigenação adequada.","Referência:","PHTLS. Prehospital Trauma Life Support. 10. ed. Burlington: Jones & Bartlett Learning, 2018. ISBN 978-1284171471."],"refs":[],"tema":"Resposta adaptativa ao choque","conceito":"Compensação simpática: taquicardia (aumenta débito) e vasoconstrição periférica (aumenta resistência e redireciona fluxo para coração e cérebro). Isso explica palidez, extremidades frias, enchimento lento e agitação (hipoperfusão cerebral). A taquipneia também é compensatória da acidose.","alt":{"A":"Bradipneia não é resposta adaptativa — é sinal de falência; o padrão é taquipneia.","B":"CORRETA. Taquicardia e vasoconstrição periférica como compensação.","C":"Bradicardia no trauma é sinal de alarme: choque neurogênico, hipóxia grave ou hipertensão intracraniana (tríade de Cushing).","D":"Vasodilatação generalizada é padrão de choque distributivo, não a compensação do hipovolêmico."},"roteiro":[],"takehome":"Agitação no traumatizado é hipóxia/hipoperfusão cerebral até prova em contrário — não rotule como 'paciente nervoso'.","area":"HAM · Choque e resposta ao trauma"},{"id":130,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":5}],"enunciado":["(AFYA VITÓRIA DA CONQUISTA) Homem de 28 anos é trazido ao pronto-socorro após colisão motociclística. Chega imobilizado em prancha rígida com colar cervical.","Na avaliação primária (ABCDE):","A: Emite sons incompreensíveis (GCS 8), presença de sangue na cavidade oral. B: FR 30 irpm, SpO₂ 88% em ar ambiente, expansibilidade torácica simétrica. C: PA 100x60 mmHg, FC 120 bpm. D: Pupilas isocóricas e fotorreagentes. E: Escoriações múltiplas.","Durante a avaliação, apresenta roncos audíveis e queda progressiva da saturação.","Qual é a conduta mais adequada para o manejo imediato da via aérea neste paciente?"],"alternativas":{"A":"Inserir máscara laríngea como via aérea definitiva, com aspiração de vias aéreas e retirada de corpos estranhos, se necessário.","B":"Realizar manobra de inclinação da cabeça e elevação do queixo (chin lift) para desobstrução da via aérea.","C":"Realizar tração da mandíbula, aspiração da cavidade oral e proceder à intubação orotraqueal com proteção cervical.","D":"Oferecer oxigênio suplementar sob máscara não reinalante e reavaliar antes de qualquer intervenção invasiva."},"correta":"C","oficial":{"C":"Resposta correta: Realizar tração da mandíbula, aspiração da cavidade oral e proceder à intubação orotraqueal com proteção cervical. Comentários: segundo o ATLS 11.ª edição e o PHTLS 10.ª edição:","B":"- Alternativa Incorreta: Realizar manobra de inclinação da cabeça e elevação do queixo (chin lift) para desobstrução da via aérea.","A":"- Alternativa Incorreta: Inserir máscara laríngea como via aérea definitiva, com aspiração de vias aéreas e retirada de corpos estranhos se necessário.","D":"- Alternativa Incorreta: Oferecer oxigênio suplementar sob máscara não reinalante e reavaliar antes de qualquer intervenção invasiva."},"oficial_extra":["Paciente com GCS ≤ 8 deve ser considerado incapaz de proteger a via aérea → indicação de via aérea definitiva.","Em trauma com suspeita de lesão cervical, deve-se evitar hiperextensão do pescoço.","A manobra inicial correta é jaw thrust no trauma (tração da mandíbula), mantendo estabilização cervical manual.","Aspiração é mandatória na presença de sangue ou secreção.","Intubação orotraqueal com proteção cervical é o padrão-ouro para via aérea definitiva no trauma.","O quadro demonstra comprometimento progressivo da oxigenação e rebaixamento do nível de consciência — critérios clássicos para intervenção imediata.","A manobra head tilt–chin lift é contraindicada em pacientes com suspeita de trauma cervical, pois pode agravar possível lesão medular.","ATLS e PHTLS enfatizam que, nesses casos, deve-se utilizar jaw thrust com estabilização cervical.","Dispositivos supraglóticos (como máscara laríngea) são considerados via aérea alternativa ou temporária, indicados quando:","Intubação falha;","Operador inexperiente;","Situação de via aérea difícil.","Não substituem a via aérea definitiva quando há indicação clara de intubação.","Apenas ofertar oxigênio é insuficiente diante de:","GCS 8;","Sons obstrutivos;","Hipoxemia progressiva.","Os protocolos reforçam que não se deve atrasar a obtenção de via aérea definitiva em paciente que não protege via aérea."],"refs":["AMERICAN COLLEGE OF SURGEONS. Advanced Trauma Life Support (ATLS): Student Course Manual. 11. ed. Chicago: American College of Surgeons, 2025.","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS (NAEMT). PHTLS - Atendimento Pré-hospitalar ao Traumatizado. 10. ed. [S.l.]: Jones & Bartlett Publishers, 2023."],"tema":"Via aérea com Glasgow 8","conceito":"Glasgow ≤ 8 = incapaz de proteger a via aérea = via aérea definitiva. Com sangue na boca e roncos, a sequência é: jaw thrust → aspirar → intubar com estabilização cervical em linha.","alt":{"A":"Máscara laríngea NÃO é via aérea definitiva (não tem balonete traqueal, não protege contra aspiração) — é dispositivo de resgate temporário.","B":"Chin lift com inclinação da cabeça é contraindicado na suspeita de lesão cervical.","C":"CORRETA. Tração mandibular, aspiração e intubação orotraqueal com proteção cervical.","D":"Só oxigênio e reavaliar, com saturação caindo e Glasgow 8, é conduta insuficiente."},"roteiro":[],"takehome":"Via aérea definitiva = tubo na traqueia, com balonete insuflado, fixado e conectado à ventilação. Máscara laríngea e cânula não contam.","area":"HAM · Via aérea e ventilação"},{"id":131,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":6}],"enunciado":["(AFYA PALMAS) Homem de 35 anos, previamente hígido, é admitido no pronto- socorro após acidente automobilístico de alta energia. Está sonolento, agitado, sudoreico, taquicárdico, taquipneico, com extremidades frias e perfusão periférica de 4 segundos. Sinais vitais: PA de 80/60 mmHg; FC = 130 bpm; Sat = 90% em ar ambiente. Foram observados trauma torácico e fratura de membro inferior direito.","Quais as alterações fisiológicas que podem estar presentes neste paciente?"],"alternativas":{"A":"Acidose lática, ativação parassimpática e hipoglicemia.","B":"Redução da lipólise, aumento dos níveis de cortisol e vasodilatação.","C":"Anabolismo proteico, aumento da secreção de insulina e redução dos níveis de cortisol.","D":"Resposta catabólica, com hiperglicemia e acidose metabólica."},"correta":"D","oficial":{"D":"Resposta catabólica, com hiperglicemia e acidose metabólica. Correta: há predomínio do catabolismo, com proteólise, acidose metabólica com aumento do ácido lático por hipoperfusão tecidual."},"oficial_extra":["Predomínio de anabolismo proteico, aumento da secreção de insulina e aumento dos níveis de cortisol. Incorreta. Há predomínio do catabolismo, com proteólise. Os níveis de insulina estão normais ou aumentados. Os níveis de cortisol estão aumentados.","acidose lática, ativação parassimpática e redução da lipólise. Incorreta; ocorre acidose lática, mas ativação simpática e, em geral, ocorre hiperglicemia.","redução da lipólise, aumento do cortisol, vasodilatação. Incorreta: há aumento da lipólise, aumento do cortisol e vasoconstrição (aumento da resistência vascular periférica como mecanismo compensatório e tentativa de preservar perfusão de órgãos nobres)."],"refs":["NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS PHTLS: Atendimento pré-hospitalar ao traumatizado. 10. ed. Rio de Janeiro: Elsevier, 2023.","AMERICAN COLLEGE OF SURGEONS. ATLS: Suporte Avançado de Vida no Trauma. Manual do Curso de Alunos. 10. ed. Chicago: American College of Surgeons, 2018."],"tema":"Alterações fisiológicas no choque","conceito":"No trauma grave predominam: catabolismo (proteólise e lipólise aumentadas), hiperglicemia de estresse (catecolaminas, cortisol e glucagon, com resistência periférica à insulina), ativação SIMPÁTICA com vasoconstrição, e acidose metabólica lática por hipoperfusão.","alt":{"A":"Acidose lática está certa, mas a ativação é SIMPÁTICA (não parassimpática) e ocorre hiperglicemia, não hipoglicemia.","B":"Invertido: a lipólise AUMENTA e há vasoconstrição, não vasodilatação.","C":"Invertido: predomina catabolismo, e o cortisol sobe, não cai.","D":"CORRETA. Resposta catabólica com hiperglicemia e acidose metabólica."},"roteiro":[],"takehome":"Trauma grave = catabolismo + hiperglicemia + acidose + vasoconstrição. Qualquer alternativa com 'anabolismo', 'vasodilatação' ou 'hipoglicemia' está errada.","area":"HAM · Choque e resposta ao trauma"},{"id":132,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2026.1","num":7}],"enunciado":["(AFYA ITACOATIARA) Um paciente de 42 anos é trazido ao pronto-socorro após acidente automóvel com colisão lateral de moderada velocidade. Apresenta Glasgow 15, pressão arterial 110/70 mmHg, frequência cardíaca 92 bpm, frequência respiratória 16 irpm. Ao exame físico: abdômen com contusão no flanco esquerdo, sensibilidade à palpação difusa, sem distensão abdominal evidente. Ausculta revela ruídos intestinais presentes bilateralmente. Não há sinais de peritonite. O paciente relata dor abdominal leve a moderada. Ultrassom FAST realizado na sala de emergência não evidencia líquido livre na cavidade peritoneal. Radiografia de pelve não demonstra fraturas. Tomografia computadorizada de abdômen e pelve com contraste revela contusão renal esquerda sem laceração, sem sangramento ativo. Não há lesão de órgãos sólidos abdominais.","Considerando os achados clínicos, radiológicos e o mecanismo de trauma apresentados, qual é a classificação de risco e a conduta terapêutica mais apropriada para este paciente?"],"alternativas":{"A":"Classificar como trauma abdominal de baixo risco com indicação de manejo conservador, pois o paciente apresenta estabilidade hemodinâmica, FAST negativo, radiografia de pelve normal e tomografia computadorizada sem lesão de órgãos sólidos. Manter observação clínica com monitorização contínua de sinais vitais, realizar exame físico seriado a cada 2-4 horas e encaminhar para internação em unidade de observação para vigilância de possível deterioração.","B":"Classificar como trauma abdominal de risco indeterminado e encaminhar para observação domiciliar com orientações de retorno ao pronto-socorro se houver piora dos sintomas. Realizar apenas radiografia de abdômen em posição ortostática em 24 horas para avaliação de possível pneumoperitôneo tardio. Prescrever analgesia e repouso relativo em domicílio.","C":"Classificar como trauma abdominal de alto risco com indicação de exploração cirúrgica imediata por laparotomia, pois a contusão no flanco esquerdo e sensibilidade abdominal difusa indicam lesão intra-abdominal significativa. Realizar laparotomia exploradora para avaliação de possíveis lesões ocultas. Encaminhar para centro cirúrgico imediatamente.","D":"Classificar como trauma abdominal de risco intermediário com indicação de investigação diagnóstica adicional, pois a contusão renal requer seguimento com ultrassom seriado para avaliação de possível sangramento tardio. Realizar tomografia computadorizada de abdômen em 48 horas para confirmação de estabilidade da lesão renal. Encaminhar para internação em unidade de cuidados intermediários com restrição de atividade física."},"correta":"A","oficial":{"C":"Classificar como trauma abdominal de alto risco com indicação de exploração cirúrgica imediata por laparotomia, pois a contusão no flanco esquerdo e sensibilidade abdominal difusa indicam lesão intra-abdominal significativa. Realizar laparotomia exploradora para avaliação de possíveis lesões ocultas. Encaminhar para centro cirúrgico imediatamente.","A":"Classificar como trauma abdominal de baixo risco com indicação de manejo conservador, pois o paciente apresenta estabilidade hemodinâmica, FAST negativo, radiografia de pelve normal e tomografia computadorizada sem lesão de órgãos sólidos. Manter observação clínica com monitorização contínua de sinais vitais, realizar exame físico seriado a cada 2-4 horas e encaminhar para internação em unidade de observação para vigilância de possível deterioração.","D":"Classificar como trauma abdominal de risco intermediário com indicação de investigação diagnóstica adicional, pois a contusão renal requer seguimento com ultrassom seriado para avaliação de possível sangramento tardio. Realizar tomografia computadorizada de abdômen em 48 horas para confirmação de estabilidade da lesão renal. Encaminhar para internação em unidade de cuidados intermediários com restrição de atividade física.","B":"Classificar como trauma abdominal de risco indeterminado e encaminhar para observação domiciliar com orientações de retorno ao pronto-socorro se houver piora dos sintomas. Realizar apenas radiografia de abdômen em posição ortostática em 24 horas para avaliação de possível pneumoperitôneo tardio. Prescrever analgesia e repouso relativo em domicílio."},"oficial_extra":["Alternativa incorreta. Laparotomia exploradora imediata não é indicada neste paciente. O ATLS recomenda exploração cirúrgica apenas em pacientes com instabilidade hemodinâmica persistente, apesar de ressuscitação adequada, sinais de peritonite com indicação de intervenção cirúrgica ou evidência clara de lesão de órgão que requeira reparo. Este paciente apresenta estabilidade hemodinâmica, FAST negativo, ausência de sinais de peritonite e tomografia sem lesão de órgãos","sólidos. Laparotomia desnecessária expõe o paciente aos riscos de cirurgia, incluindo complicações anestésicas, infecção e aderências.","A alternativa está correta conforme o protocolo ATLS para avaliação de trauma abdominal fechado. O paciente apresenta critérios de risco baixo: estabilidade hemodinâmica (pressão arterial 110/70 mmHg, frequência cardíaca 92 bpm), Glasgow 15, FAST negativo (ausência de líquido livre), radiografia de pelve normal, e tomografia computadorizada sem lesão de órgãos sólidos abdominais. A contusão renal sem laceração e sem sangramento ativo não constitui indicação de intervenção cirúrgica de emergência. O manejo conservador com observação clínica rigorosa é apropriado, incluindo monitorização contínua de sinais vitais, exame físico seriado a cada 2-4 horas para detectar possível deterioração, e internação em unidade de observação. Esta abordagem permite identificação precoce de complicações como hemorragia tardia ou peritonite, enquanto evita laparotomia desnecessária. A maioria dos traumas abdominais fechados sem lesão de órgãos sólidos significativa responde bem ao manejo não operatório quando há vigilância apropriada.","Resposta incorreta. Embora contusão renal seja achado importante, não requer seguimento com ultrassom seriado quando a tomografia computadorizada com contraste já demonstrou ausência de sangramento ativo. Tomografia computadorizada em 48 horas é desnecessária e expõe o paciente a radiação adicional. A restrição de atividade física severa não é recomendada para contusão renal sem laceração. Internação em unidade de cuidados intermediários é excessiva para paciente com risco baixo e estável.","Resposta incorreta. Observação domiciliar é inadequada para paciente com trauma abdominal fechado recente, mesmo que de risco baixo. O ATLS recomenda internação e observação clínica em ambiente hospitalar para detecção precoce de complicações. Radiografia de abdômen em posição ortostática é método insensível para detecção de pneumoperitôneo e não é recomendada. Ausência de monitorização contínua de sinais vitais e exame físico seriado pode resultar em atraso diagnóstico de hemorragia tardia ou peritonite.","Referência:","AMERICAN COLLEGE OF SURGEONS. Advanced Trauma Life Support®: student course manual. 11. ed. Chicago: American College of Surgeons, 2025."],"refs":[],"tema":"Trauma abdominal — manejo conservador","conceito":"Paciente ESTÁVEL (Glasgow 15, PA 110/70, FC 92), FAST negativo, sem peritonite e TC mostrando apenas contusão renal sem laceração nem sangramento ativo = manejo NÃO OPERATÓRIO, que hoje é o padrão para lesões de órgão sólido em pacientes estáveis. O que se faz é vigiar: exame físico seriado e monitorização, porque a deterioração tardia é possível.","alt":{"A":"CORRETA. Baixo risco, manejo conservador com observação hospitalar, monitorização e exame físico seriado a cada 2–4 h.","B":"Observação domiciliar após trauma abdominal com dor e contusão renal é insegura; e radiografia ortostática para pneumoperitônio tardio é conduta sem sentido aqui.","C":"Laparotomia exploradora exige instabilidade persistente apesar da ressuscitação, peritonite ou lesão que precise de reparo — nada disso está presente.","D":"Reagenda exames mas não resolve: a contusão renal sem laceração e sem sangramento ativo não exige TC de controle rotineira; o que se faz é observação clínica."},"roteiro":[],"takehome":"Estável + FAST negativo + sem peritonite = observar, não operar. E lembre que 'observar' significa exame físico seriado, não deixar o paciente esquecido no leito.","area":"HAM · Atendimento ao politraumatizado"},{"id":133,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2026.1","num":9}],"enunciado":["(AFYA ABAETETUBA) Um homem de 27 anos é trazido pelo SAMU ao hospital de trauma após colisão moto x automóvel há cerca de 40 minutos. Foi encontrado consciente, porém pálido e sudorético. Na admissão, apresenta vias aéreas pérvias, imobilizado com colar cervical e prancha rígida, tórax simétrico, SpO₂ 94%, FR 28 irpm, FC 138 bpm, PA 80x45 mmHg, extremidades frias, tempo de enchimento capilar de 5 segundos, mucosas hipocoradas (+++/4+), diaforético e abdome doloroso difusamente com sinais de irritação peritoneal. Glasgow 14, pupilas isocóricas e fotorreagentes. Gasometria arterial: pH 7,26, HCO₃⁻ 15 mEq/L, lactato 6,2 mmol/L (VR < 2 mmol/L).","Com base nos dados clínicos e laboratoriais apresentados, responda:","a) Qual o distúrbio ácido-base identificado? Justifique. (0,5 ponto)","b) Explique o principal mecanismo fisiopatológico responsável por essa alteração no contexto do choque traumático e correlacione-o com os sinais clínicos observados. (1,0 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) acidose lática. Situação clínica em que, em decorrência de um choque hemorrágico, a produção de energia celular encontra-se prejudicada pela acidose láctica, resultante da hipoperfusão tecidual. O aluno deverá reconhecer tratar-se de acidose metabólica com ânion gap aumentado, evidenciada por pH reduzido, bicarbonato diminuído e lactato elevado.(0,5 ponto)","b) No contexto do trauma, a hipotensão (PA 80x45 mmHg), taquicardia, extremidades frias, tempo de enchimento capilar prolongado e lactato elevado indicam redução do débito circulatório e da oferta de oxigênio aos tecidos. A diminuição da perfusão compromete o metabolismo aeróbico mitocondrial, levando as células a utilizarem vias anaeróbias para produção de ATP. Esse processo resulta em acúmulo de lactato e desenvolvimento de acidose metabólica.","Portanto, o mecanismo fisiopatológico central é a hipoperfusão sistêmica secundária ao choque hemorrágico, com transição do metabolismo aeróbico para anaeróbico e consequente produção excessiva de lactato. (1,0 ponto)","Referência:","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS. PHTLS: Atendimento pré-hospitalar ao traumatizado. 10. ed. Rio de Janeiro: Elsevier, 2023."],"refs":[],"tema":"Acidose lática no choque hemorrágico","conceito":"Idêntico em raciocínio à questão 119, agora em formato aberto. pH 7,26 + HCO3 15 + lactato 6,2 = acidose metabólica com ânion gap aumentado. Lactato > 4 mmol/L é marcador de gravidade e preditor de mortalidade; sua depuração nas primeiras horas é o melhor indicador de ressuscitação adequada.","alt":{},"roteiro":["a) Acidose metabólica com ânion gap aumentado (acidose lática). Justifique pelos três dados: pH reduzido (7,26), bicarbonato reduzido (15) e lactato elevado (6,2). A FR de 28 é compensação respiratória (hiperventilação eliminando CO2).","b) Mecanismo: choque hemorrágico → queda do débito cardíaco e da oferta de O2 aos tecidos → a mitocôndria não sustenta o metabolismo aeróbio → a célula passa ao metabolismo anaeróbio, que gera pouco ATP e acumula lactato → acidose metabólica.","Correlação com os sinais: hipotensão (80x45) e taquicardia (138) = perda volêmica e compensação simpática; extremidades frias, enchimento capilar de 5 s, palidez e sudorese = vasoconstrição periférica redirecionando fluxo para órgãos nobres; mucosas hipocoradas = perda sanguínea; Glasgow 14 e taquipneia = hipoperfusão cerebral e compensação da acidose.","Estime a classe do choque: FC > 120, PA reduzida, enchimento capilar prolongado e alteração do estado mental = classe III (perda de 30–40% da volemia).","Conduta implícita: controlar a hemorragia (abdome com irritação peritoneal → FAST e provável laparotomia), hemoderivados em vez de grande volume de cristaloide, ácido tranexâmico e prevenção da tríade letal (hipotermia, acidose, coagulopatia)."],"takehome":"A acidose não é 'um exame alterado': é o marcador de que a célula está sem oxigênio. Trate a causa (a hemorragia), não o bicarbonato.","area":"HAM · Choque e resposta ao trauma"},{"id":134,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2026.1","num":10}],"enunciado":["(AFYA UNIGRANRIO BARRA DA TIJUCA) Um paciente do sexo masculino, 34 anos, vítima de acidente automobilístico de alta energia, é atendido em via pública por equipe de resgate. Apresenta trauma facial extenso, sangramento profuso por fossas nasais e pela boca e sinais de fratura mandibular. Mantém ventilação espontânea, porém com hipoventilação e saturação de oxigênio de 70%. A ventilação com bolsa-válvula-máscara foi ineficaz e não há condições técnicas de intubação orotraqueal ou nasotraqueal.","a) Considerando o algoritmo de abordagem do trauma no atendimento pré- hospitalar, descreva qual intervenção deve ser realizada para garantir a via aérea desse paciente e justifique a indicação dessa conduta nesse cenário. (0,75 ponto)","b) Descreva os principais passos técnicos do procedimento indicado para obtenção da via aérea emergencial nesse paciente, destacando as referências anatômicas utilizadas. (0,75 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) Intervenção indicada: realização de via aérea cirúrgica emergencial, preferencialmente cricotireoidostomia no adulto ou cricotireoidopunção percutânea com cateter, quando recursos ou treinamento limitam a abordagem.","Justificativa clínica:","Incapacidade de manter oxigenação adequada.","Falha da ventilação com bolsa-válvula-máscara.","Impossibilidade de intubação orotraqueal ou nasotraqueal.","Risco iminente de hipóxia e parada cardiorrespiratória.","Raciocínio fisiológico esperado.","Estabelecer rapidamente uma via aérea permeável.","Permitir ventilação e oxigenação adequadas.","Prevenir hipóxia cerebral e deterioração hemodinâmica.","O estudante deve reconhecer que o caso representa o cenário clássico de:","“não é possível ventilar e não é possível intubar”.","(0,75 ponto)","b)","Identificação das referências anatômicas.","Cartilagem tireoide.","Cartilagem cricoide.","Membrana cricotireóidea localizada entre ambas.","Principais etapas do procedimento.","Posicionamento do paciente e estabilização cervical manual.","Identificação da membrana cricotireóidea.","Antissepsia rápida, quando possível.","Incisão ou punção na membrana cricotireóidea.","Inserção de cânula ou cateter na traqueia.","Conexão ao sistema de ventilação.","Confirmação de ventilação e expansão torácica.","Objetivo do procedimento:","Garantir via aérea patente e ventilação eficaz até que seja possível estabelecer uma via aérea definitiva em ambiente hospitalar.","(0,75 ponto)","Referência:","PHTLS: Suporte de Vida no Trauma Pré-Hospitalar. National Association of Emergency Medical Technicians; American College of Surgeons. 10. ed. Burlington: Jones & Bartlett Learning, 2023."],"refs":[],"tema":"Cricotireoidostomia no trauma facial","conceito":"Cenário CICO clássico: trauma facial extenso com sangramento, sem possibilidade de intubação oral nem nasal (e a nasal seria contraindicada em trauma de face/base de crânio), ventilação com BVM ineficaz e SpO2 de 70%. Via aérea cirúrgica imediata.","alt":{},"roteiro":["a) Intervenção: cricotireoidostomia de emergência — cirúrgica no adulto, ou por punção (cricotireoidopunção com cateter) quando faltam recurso ou treinamento. Em menores de 12 anos, apenas a punção.","Justificativa: impossibilidade de oxigenar e de intubar por via oral ou nasal, ventilação com BVM ineficaz, hipoxemia grave (SpO2 70%) e risco iminente de parada hipóxica — o cenário 'não intubo, não ventilo'.","b) Referências anatômicas: cartilagem tireoide (proeminência laríngea) acima, cartilagem cricoide abaixo, e entre elas a membrana cricotireóidea — superficial, pouco vascularizada e sem estruturas nobres.","Passos: posicionar e estabilizar a coluna cervical manualmente; identificar e fixar a membrana entre polegar e dedo médio; antissepsia rápida se houver tempo; incisão vertical na pele e horizontal na membrana (ou punção em 45° caudal, aspirando até refluxo de ar); dilatar com pinça ou gancho traqueal; inserir cânula de traqueostomia 6.0 ou TOT 5.0–6.0 direcionada caudalmente; insuflar o balonete; conectar à ventilação.","Confirmação: expansão torácica simétrica, ausculta bilateral, capnografia e melhora da saturação. Fixar o dispositivo.","Objetivo e limite: garantir oxigenação até a conversão para via aérea definitiva (traqueostomia) em ambiente hospitalar; a punção é ainda mais temporária, permitindo cerca de 30–45 min por acúmulo de CO2."],"takehome":"Trauma de face é a indicação clássica de via aérea cirúrgica — e é onde a via nasal está proibida. Não insista em tentativas repetidas de intubação: cada tentativa piora o edema e o sangramento.","area":"HAM · Via aérea e ventilação"},{"id":135,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2024.2","num":1}],"enunciado":["(ITPAC CRUZEIRO DO SUL) Você foi recentemente nomeado gestor de uma Unidade Básica de Saúde (UBS) com alta demanda por serviços, logo, já observa alguns problemas enfrentados na unidade como falta de informações ao usuário, pessoas retornando para casa sem atendimento médico, número de fichas insuficientes e um conflito entre as equipes da unidade, incluindo ainda a falta de apoio da gestão municipal. Após uma breve reunião com a equipe, percebe uma necessidade significativa de coordenação do serviço. Diante do apresentado responda a questão abaixo:","Descreva cinco princípios ou habilidades fundamentais para o gerenciamento eficaz de uma unidade de saúde (1,5)."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Para implantar as suas agendas, os gerentes de UBS contam basicamente com seus funcionários e se utilizam fortemente da rede de relacionamentos desta forma, no seu dia a dia, os gerentes se utilizam de habilidades pessoais, como saber ouvir, ter empatia, conhecer as necessidades e expectativas dos funcionários, e dos usuários, ser flexível e saber monitorar o clima da unidade. Utilizando Iniciativas que estimulem o compartilhamento e a disseminação de conhecimentos, são de suma importância para a manutenção e a melhoria das atividades gerenciais nas UBS.","Além disso, pode ser contemplado a integração de ações clínicas e administrativas, a utilização de ferramentas de gestão, foco na qualidade do atendimento e na satisfação do paciente (1,5)."],"refs":["LOCH, S. et al. Gestão da Unidade de Saúde. In: GUSSO, Gustavo. et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 46. Disponível em: Minha Biblioteca.","GUSSO, G. NETO, P.P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 25. Disponível em: Minha Biblioteca."],"tema":"Gerenciamento de unidade de saúde","conceito":"O gerente de UBS trabalha com pouca autoridade formal e muita rede de relacionamento: governa por articulação, não por ordem. Os problemas do caso (falta de informação, fichas insuficientes, demanda reprimida, conflito de equipe, falta de apoio da gestão) são clássicos de coordenação e de organização do processo de trabalho — a solução vem do acolhimento e da gestão participativa, não de mais fichas.","alt":{},"roteiro":["Cinco princípios/habilidades que respondem à questão:","1) Comunicação e escuta ativa: reuniões de equipe periódicas, canais claros com usuários, informação visível sobre horários e fluxos — ataca diretamente a 'falta de informações ao usuário'.","2) Liderança e gestão de pessoas: empatia, conhecimento das necessidades e expectativas dos funcionários, mediação de conflitos, valorização e educação permanente.","3) Planejamento e organização do processo de trabalho: diagnóstico situacional do território, definição de prioridades, agenda programada, ACOLHIMENTO com classificação de risco em lugar da distribuição de fichas por ordem de chegada.","4) Uso de ferramentas de gestão e de informação: indicadores, e-SUS/prontuário eletrônico, monitoramento de metas, PDCA — decidir com dado, não com impressão.","5) Trabalho em equipe multiprofissional e articulação em rede: integrar ações clínicas e administrativas, articular com a gestão municipal, o controle social (conselho local de saúde) e os demais pontos da rede (referência e contrarreferência).","Pode-se acrescentar: foco na qualidade e na satisfação do usuário, flexibilidade e monitoramento do clima organizacional."],"takehome":"Em discursiva de gestão, ancore cada habilidade num problema do enunciado — é isso que diferencia uma resposta genérica de uma que pontua.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":136,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":2}],"enunciado":["(UNIDEP) O Dr. José, médico de uma Unidade Básica de Saúde (UBS), está enfrentando um aumento significativo no número de pacientes que necessitam de exames especializados que não são oferecidos pela UBS. Para lidar com essa demanda crescente, a gestão da UBS decidiu recorrer aos serviços privados de saúde para garantir que os pacientes recebam o atendimento necessário sem sobrecarregar a unidade. Diante disso, analise as afirmativas abaixo quanto a participação complementar dos Serviços de Saúde privados no Sistema Único de Saúde (SUS).","I. Para a efetiva participação dos serviços privados no SUS podem ser utilizados os convênios ou contratos como instrumentos contratuais. II. Devem ser contratualizados diretamente os serviços privados mais próximos da UBS, sem a necessidade de avaliação da qualidade, para garantir maior agilidade no atendimento dos pacientes. III. Deve ser feita uma análise da capacidade técnica e a qualidade dos serviços privados antes da contratualização. IV. Devem ser priorizados os serviços que tenham contratos antigos com o SUS, sem nova avaliação.","É correto o que se afirma em"],"alternativas":{"A":"I e III.","B":"I, II, III e IV.","C":"II, III e IV.","D":"III e IV."},"correta":"A","oficial":{},"oficial_extra":["Para a efetiva participação dos serviços privados no SUS podem ser utilizados os seguintes instrumentos contratuais:","Convênio - ato firmado entre o ente público e a instituição privada sem fins lucrativos quando houver interesse comum em firmar parceria em prol da prestação de serviços à saúde.","Contrato Administrativo – ato firmado entre o ente público e a instituição privada quando o objeto for a compra de serviços de saúde.","De acordo com as diretrizes do SUS, a ação mais apropriada no processo de regulação é garantir que a contratualização com serviços privados seja baseada em uma avaliação criteriosa da qualidade e capacidade técnica dos prestadores. Essa abordagem assegura que os pacientes recebam atendimento de qualidade, que os recursos públicos sejam utilizados de forma eficiente, e que o processo de regulação promova a equidade e a eficácia no acesso aos serviços de saúde.","Referência:","Brasil. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. Curso básico de regulação do Sistema Único de Saúde – SUS [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção à Saúde, Departamento de Regulação, Avaliação e Controle de Sistemas. – Brasília: Ministério da Saúde, 2016. 227 p. : il."],"refs":[],"tema":"Participação complementar do setor privado no SUS","conceito":"A Constituição (art. 199) permite a participação complementar da iniciativa privada quando a capacidade pública for insuficiente, com PREFERÊNCIA para entidades filantrópicas e sem fins lucrativos. Os instrumentos são: CONVÊNIO (com entidade privada sem fins lucrativos, em regime de parceria) e CONTRATO administrativo (compra de serviços, precedido de licitação/chamamento). A contratação sempre exige avaliação prévia de capacidade técnica, qualidade e conformidade — e as regras públicas prevalecem.","alt":{"A":"CORRETA. I (convênio e contrato como instrumentos) e III (análise prévia de capacidade técnica e qualidade) estão certas.","B":"Inclui II e IV, ambas erradas.","C":"II é falsa: dispensar avaliação de qualidade por 'agilidade' contraria a legislação e o princípio da qualidade da assistência.","D":"IV é falsa: contrato antigo não dispensa nova avaliação — os contratos têm vigência e exigem reavaliação periódica."},"roteiro":[],"takehome":"Nas questões de itens, procure as palavras absolutas: 'sem necessidade de avaliação' e 'sem nova avaliação' quase sempre marcam o item falso.","area":"IESC · Gestão privada e empreendedorismo"},{"id":137,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":3}],"enunciado":["(UNIDEP) João, um recém-formado em Medicina, decidiu abrir seu próprio consultório particular. Ele tem pouco conhecimento sobre o processo de abertura de uma clínica e está buscando orientações sobre quais etapas devem ser seguidas para garantir que sua clínica seja aberta de forma legal e eficiente. Diante disso, analise as afirmativas abaixo quanto as etapas que João deve seguir para abrir seu consultório médico/clínica médica particular.","I. Planejamento financeiro e aquisição de equipamentos. II. Escolha da localização do consultório. III. Registro no Conselho Regional de Medicina. IV. Obtenção do alvará de funcionamento.","Está correto o que se afirma em:"],"alternativas":{"A":"I, II.","B":"I, II, IV.","C":"III. IV.","D":"I, II, III, IV."},"correta":"D","oficial":{},"oficial_extra":["Planejamento financeiro e aquisição de equipamentos: Em seguida, é essencial realizar um planejamento financeiro e adquirir os equipamentos necessários para o funcionamento do consultório.","Escolha da localização do consultório: A localização deve ser escolhida levando em consideração o público-alvo e o planejamento financeiro.","Registro no Conselho Regional de Medicina: João deve registrar seu consultório no Conselho Regional de Medicina para obter a autorização necessária para atuar como médico.","Obtenção do alvará de funcionamento: Finalmente, é preciso obter o alvará de funcionamento para que o consultório possa operar legalmente."],"refs":["Terrim S, Melo A, Jácomo A. Empreendedorismo em saúde: relato de um modelo de Empresa Júnior em Medicina. Rev Med (São Paulo). 2015;94(2):94-8. doi: https://doi. org/10.11606/issn.1679-9836.v94i2p94-98.","Vendruscolo C, Hermes J, Zocche DAA, et al. Aplicação da Matriz SWOT: Tecnologia para a Gestão do Trabalho na Atenção Primária à Saúde. 2022;12:e4244. [Access_____]; Available in:______. DOI: http://dx.doi.org/10.19175/recom.v12i0.4244","Manual de Procedimentos administrativos https://portal.cfm.org.br/images/mpa_pj.pdf"],"tema":"Abertura de consultório — empreendedorismo em saúde","conceito":"Questão de completude: todas as etapas listadas fazem parte do processo. Na prática a abertura envolve plano de negócio e planejamento financeiro, escolha do ponto, constituição jurídica (CNPJ), registro da pessoa jurídica no CRM (com responsável técnico), alvará de funcionamento na prefeitura, licença sanitária da vigilância, alvará dos bombeiros e plano de gerenciamento de resíduos (PGRSS).","alt":{"A":"Incompleta: deixa de fora CRM e alvará.","B":"Incompleta: omite o registro no CRM, que é obrigatório.","C":"Incompleta: omite planejamento financeiro e localização.","D":"CORRETA. As quatro etapas são necessárias."},"roteiro":[],"takehome":"Quando todos os itens são plausíveis e não há nenhum absurdo, desconfie: a resposta costuma ser 'todas'.","area":"IESC · Gestão privada e empreendedorismo"},{"id":138,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":4}],"enunciado":["(UNIDEP) O Dr. João, médico de plantão em um hospital público, recebe um paciente trazido pelo SAMU com suspeita de infarto agudo do miocárdio (IAM). Ao avaliar a situação, ele descobre que a capacidade de leitos de UTI do hospital está completamente esgotada. Considerando a urgência do caso, assinale a alternativa que representa a conduta do Dr. João para garantir o atendimento especializado adequado ao paciente."],"alternativas":{"A":"Negar a admissão do pacien
