ra os AINEs sejam eficazes no controle da dor e da inflamação, eles não são a primeira linha de tratamento para todos os pacientes, especialmente aqueles com hipertensão, devido ao risco de elevação da pressão arterial e outros efeitos adversos. A suplementação com glucosamina e condroitina é controversa, com evidências mistas sobre sua eficácia. O uso de AINEs como primeira linha pode não ser ideal para este perfil de paciente.","D":"Prescrever opioides para controle da dor intensa, utilizar corticosteroides injetáveis para articulações afetadas, recomendar repouso absoluto e restrição de atividades físicas para evitar o agravamento da condição. O uso de opioides não é recomendado como tratamento inicial para osteoartrite devido ao risco de dependência e efeitos adversos graves. Corticosteroides injetáveis são reservados para casos em que há inflamação significativa não controlada por outras medidas e não devem ser uma primeira linha de tratamento. O repouso absoluto e a restrição de atividades físicas não são recomendados, pois a manutenção da atividade física é importante para a mobilidade e controle da dor na osteoartrite.","B":"Prescrever paracetamol para alívio da dor, iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) se necessário, recomendar o uso de dispositivos de apoio e incluir exercícios físicos leves conforme tolerado. Embora esta alternativa esteja próxima da correta, falta a recomendação de perda de peso, que é um componente crucial do manejo da osteoartrite em pacientes com IMC elevado. A inclusão de dispositivos de apoio pode ser útil, mas não substitui a importância de programas de exercícios e a necessidade de controlar o peso para reduzir a carga sobre as articulações."},"oficial_extra":["Justificativa para a resposta correta: é a mais adequada, pois alinha-se com as diretrizes terapêuticas para o manejo inicial da osteoartrite, especialmente em pacientes com comorbidades como hipertensão. O paracetamol é frequentemente recomendado como primeira linha de tratamento para alívio da dor em osteoartrite, devido ao seu perfil de segurança. Os AINEs são indicados apenas se o paracetamol não proporcionar alívio adequado, considerando os possíveis efeitos adversos, especialmente em pacientes hipertensos. A inclusão de um programa de fisioterapia é fundamental para melhorar a função articular e reduzir a dor, enquanto a perda de peso é crucial para reduzir a carga sobre as articulações, especialmente em pacientes com IMC elevado.","Justificativa para as alternativas incorretas:"],"refs":["CHEW, Felix S. Radiologia Esquelética. Editora Manole, 2016. E-book. ISBN 9788520448311. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788520448311/. Acesso em: 24 maio 2023.• https://www.dynamed.com/condition/ankylosing-spondylitis• https://www.dynamed.com/condition/overview-of-spondyloarthritis","https://www.dynamed.com/condition/overview-of-spondyloarthritis#TOPIC_OB3_M5R_BTB","JAMESON, J L.; FAUCI, Anthony S.; KASPER, Dennis L.; et al. Manual de medicina de Harrison. Grupo A, 2021. E-book. ISBN 9786558040040. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786558040040/. Acesso em: 27 mar. 2023."],"tema":"Tratamento da osteoartrite","conceito":"A base é não farmacológica: exercício, perda de peso (5–10% já melhora), fisioterapia, educação, dispositivos de apoio. AINE tópico é preferido; AINE sistêmico com cautela em hipertensos e nefropatas. Glucosamina/condroitina não são recomendadas.","alt":{"A":"AINE sistêmico de entrada em hipertensa com IMC 35 é o que as diretrizes evitam; e falta a perda de peso.","B":"É a 'quase certa': tem analgesia e exercício, mas OMITE a perda de peso.","C":"CORRETA. Analgesia escalonada + fisioterapia + perda de peso.","D":"Opioide de entrada, corticoide injetável de primeira linha e repouso absoluto — tudo errado."},"roteiro":[],"takehome":"Quando duas parecem certas, escolha a mais COMPLETA. Em gonartrose com obesidade, sem perda de peso a resposta é incompleta.","area":"CI · Reumatologia (OA e artrites)"},{"id":45,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":5}],"enunciado":["( AFYA IPATINGA) Maria das Graças, 54 anos, procura atendimento referindo dor e deformidades nas mãos, com evolução de dois anos. A dor surge quando realiza trabalhos manuais e utiliza o computador e está associada à rigidez matinal de cerca de 15 minutos. Descreve como intensidade 4/10 pela escala visual analógica de dor. Ao exame físico: dor à palpação de interfalangeanas distais e proximais, com aumento discreto de volume local, ausência de calor e hiperemia.","Tendo em vista a principal hipótese diagnóstica, assinale a alternativa correta em relação aos exames complementares."],"alternativas":{"A":"Quanto aos aspectos radiológicos é observado aumento do espaço intra-articular e formações de osteófitos.","B":"A análise do líquido sinovial caracteriza-se como líquido tipicamente inflamatório e contagem de leucócitos superior a 50.000 células/mm 3.","C":"A radiografia convencional é o método de imagem mais utilizado para o diagnóstico e avaliação da progressão da doença.","D":"Associa-se a elevação da velocidade de hemossedimentação, fator reumatóide e anti CCP positivo."},"correta":"C","oficial":{},"oficial_extra":["O caso exposto se refere a Osteoartrite de mãos. A paciente apresenta quadro articular de padrão mecânico, com dor que piora com atividade e rigidez matinal inferior a trinta minutos. Ao exame clínico sem sinais de artrite mas com aumento de volume de Interfalangeanas, sugestivo de nódulos de Heberden.","Laboratorialmente se caracteriza por provas inflamatórias dentro da normalidade ou discretamente aumentadas e marcadores reumatológicos como FR e anti CCP negativos.","A cintilografia óssea é um exame para detectar anormalidades ósseas - não é escolha para avaliação de sinovite. US e RNM são métodos de escolha para sinovite.","A análise de líquido sinovial revela líquido citrino, viscoso, com baixa celularidade, com contagem inferior a 5000 células/mm 3.","Através da radiografia é possível avaliar todos os aspectos para diagnóstico e seguimento dos pacientes, como presença de osteófitos, redução assimétrica de espaço articular, esclerose subcondral e cistos.","Referência:","MOREIRA, Caio; PINHEIRO, Geraldo da Rocha Castelar; MARQUES NETO João Francisco. Reumatologia Essencial."],"refs":[],"tema":"Osteoartrite de mãos — exames","conceito":"Padrão mecânico: dor com uso, rigidez < 30 min, sem flogose, provas inflamatórias normais, FR e anti-CCP negativos. OA de mãos pega IFD (Heberden), IFP (Bouchard) e rizartrose, poupando MCF e punhos — o oposto da AR.","alt":{"A":"Invertido: na OA o espaço articular DIMINUI.","B":"Líquido sinovial na OA é não inflamatório (< 2.000 leucócitos). Acima de 50.000 pense em artrite séptica.","C":"CORRETA. Radiografia é o exame padrão (espaço reduzido, osteófitos, esclerose subcondral, geodos).","D":"VHS alta com FR e anti-CCP positivos descreve artrite reumatoide."},"roteiro":[],"takehome":"O laboratório na OA serve para EXCLUIR outras doenças, não para confirmar.","area":"CI · Reumatologia (OA e artrites)"},{"id":46,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":6}],"enunciado":["( AFYA PARAÍBA) Uma paciente de 25 anos, do sexo feminino, procura atendimento psicológico relatando intensa instabilidade emocional, caracterizada por episódios frequentes de raiva, tristeza e ansiedade. Descreve relacionamentos interpessoais marcados por idealização e desvalorização, além de comportamentos impulsivos como automutilação e tentativas de suicídio. No histórico familiar, há relatos de transtornos de humor em parentes próximos.","Considerando o caso clínico apresentado, qual o diagnóstico mais provável?"],"alternativas":{"A":"Transtorno Bipolar.","B":"Transtorno Obsessivo Compulsivo.","C":"Transtorno de Personalidade com Instabilidade Emocional / Borderline.","D":"Transtorno de Ansiedade Generalizada."},"correta":"C","oficial":{},"oficial_extra":["Resposta: Transtorno de Personalidade com Instabilidade Emocional (TPIE). O Transtorno de Personalidade com Instabilidade Emocional, também conhecido como Transtorno Borderline de Personalidade, é caracterizado por um padrão de instabilidade nas relações interpessoais, autoimagem e emoções, além de impulsividade. A paciente do caso, apresenta instabilidade emocional intensa, com prejuízo nas relações interpessoais, idealização de desvalorização, com comportamentos impulsivos como automutilação e tentativa de suicídio, caracterizando pelo menos 5 dos critérios para TPIE.","Critérios Diagnósticos do DSM-5:","Para receber o diagnóstico de TPIE, um indivíduo deve apresentar 5 ou mais dos seguintes critérios:","Esforços desesperados para evitar o abandono real ou imaginado: Pessoas com TPIE tendem a ter medo intenso de serem abandonadas, o que pode levar a comportamentos desesperados para manter as relações. Relacionamentos intensos e instáveis que se alternam entre idealização e desvalorização da outra pessoa: As relações interpessoais de indivíduos com TPIE são frequentemente marcadas por grandes oscilações, indo de idealizar a outra pessoa a desvalorizá-la rapidamente. Perturbação da identidade: As pessoas com TPIE podem ter dificuldade em manter uma imagem estável de si mesmas, experimentando mudanças frequentes em seus objetivos, valores e autopercepção. Impulsividade em pelo menos duas áreas potencialmente prejudiciais a si mesmo: Impulsividade em áreas como gastos, sexo, uso de substâncias, direção imprudente ou compulsão alimentar é comum em indivíduos com TPIE. Comportamentos suicidas, gestos de automutilação ou ameaças: Comportamentos autodestrutivos são comuns em pessoas com TPIE, como tentativas de suicídio, automutilação e ameaças de se machucar. Instabilidade afetiva reativa: As emoções de pessoas com TPIE são intensas e flutuam rapidamente, em resposta a eventos externos ou internos. Sentimentos crônicos de vazio: Muitas pessoas com TPIE relatam um sentimento profundo e persistente de vazio interno. Raiva intensa e inapropriada, ou dificuldade em controlar a raiva: Explosões de raiva e dificuldade em controlar a agressividade são características comuns do TPIE. Ideação paranoide transitória relacionada ao estresse ou sintomas dissociativos graves: Em momentos de estresse, pessoas com TPIE podem experimentar pensamentos paranoicos ou sintomas dissociativos."],"refs":["Lopes, Antonio Carlos, ed. - Tratado de Clínica médica. São Paulo, Roca, 2006. 3v. ilus.","NARDI, A. E.; SILVA, A. G.; QUEVEDO, J. (org.). Tratado de psiquiatria da Associação Brasileira de Psiquiatria. Porto Alegre: Artmed, 2022."],"tema":"Transtorno de personalidade borderline","conceito":"Exige ≥ 5 de 9 critérios: medo de abandono, relações instáveis com idealização/desvalorização, perturbação da identidade, impulsividade, automutilação/suicídio, instabilidade afetiva, vazio crônico, raiva intensa, ideação paranoide transitória.","alt":{"A":"No TB os episódios duram dias a semanas e são autônomos; no TPB o humor muda em horas e é reativo a conflito interpessoal.","B":"TOC exige obsessões e/ou compulsões, ausentes aqui.","C":"CORRETA. Idealização/desvalorização + impulsividade + automutilação = pelo menos 5 critérios.","D":"TAG é preocupação difusa persistente, sem o padrão relacional instável."},"roteiro":[],"takehome":"Oscilação em horas e reativa = borderline. Em dias, com energia e sono alterados = bipolar. Tratamento de 1ª linha é psicoterapia (DBT).","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":47,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":7}],"enunciado":["( UNIDEP) Médico de 80 anos comparece a consulta devido a quadro de esquecimento iniciado há 6 meses. Relata que sente dificuldade para se lembrar de eventos cotidianos, como onde guardou um prontuário ou se desligou os equipamentos eletrônicos ao sair de seu consultório. Deixa claro no seu relato que esses eventos apesar de incomodarem, não interferem em suas atividades sociais ou profissionais. Essas informações são confirmadas pela sua filha que acompanha a consulta. Realizado alguns testes com os seguintes resultados: teste de fluência verbal 14 animais/minuto; miniexame do estado mental 23 pontos. Dentre as opções apresentadas, o diagnóstico mais provável é:"],"alternativas":{"A":"Doença de Alzheimer.","B":"Comprometimento cognitivo leve.","C":"Síndrome demencial.","D":"Envelhecimento cerebral normal."},"correta":"B","oficial":{"B":"Com as informações fornecidas conseguimos determinar a presença de alteração cognitiva devido ao teste de rastreio positivo (MEEM 23 – Valor normal > 24), porém sem comprometimento da funcionalidade, exatamente a definição de comprometimento cognitivo leve. Para estabelecer o diagnóstico de síndrome demencial é necessário que o comprometimento cognitivo cause algum grau de prejuízo as atividades diárias do indivíduo. No paciente em questão o enunciado deixa claro não haver interferência nas atividades sociais e profissionais. A doença de Alzheimer é a etiologia mais prevalente das síndromes demenciais, como em qualquer quadro demencial, o comprometimento funcional é fundamental para o diagnóstico. Não se deve atribuir alterações de memória ou cognição ao envelhecimento cerebral normal. Qualquer alteração ao basal deve ser investigada a fim de investigar sua significância clínica."},"oficial_extra":[],"refs":["CLEMENTE, R.; RIBEIRO-FILHO, S. Comprometimento cognitivo leve: aspectos conceituais, abordagem clínica e diagnóstica. Revista Hospital Universitário Pedro Ernesto (TÍTULO NÃO- CORRENTE), v. 7, n. 1, 2024.","AMERICAN PSYCHIATRIC ASSOCIATION. Diagnostic and Statistical Manual of Mental Disorders (DSM-5-TR)."],"tema":"CCL x demência","conceito":"A FUNCIONALIDADE decide: CCL tem déficit objetivo com independência preservada; demência tem prejuízo nas atividades. O corte do MEEM varia com a escolaridade (≈29 no superior, ≈20 em analfabetos).","alt":{"A":"Alzheimer é etiologia de demência, e demência exige prejuízo funcional — negado duas vezes no enunciado.","B":"CORRETA. MEEM 23 em paciente com curso superior é claramente alterado, mas sem repercussão funcional = CCL.","C":"Síndrome demencial exigiria perda de independência.","D":"Há teste objetivo alterado — não é envelhecimento normal."},"roteiro":[],"takehome":"A pergunta não é 'esquece?', é 'deixou de fazer sozinho o que fazia?'. Ajuste sempre o MEEM pela escolaridade.","area":"CI · Demências e parkinsonismo"},{"id":48,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":8}],"enunciado":["(IESVAP) Recém-nascido (RN), a termo, 36h de vida, parto normal. Mãe está aguardando a alta hospitalar junto com o bebê. Nega intercorrências na gestação. Ao examinar o RN, percebe-se que o mesmo encontra-se ictérico (zona III de Kramer). Solicita-se os seguintes exames laboratoriais: bilirrubina total de 13 mg/dl, bilirrubina indireta de 12 mg/dl e bilirrubina direta de 1 mg/dl. Tipagem sanguínea do RN A positivo, tipagem sanguínea da mãe: O positivo.","Figura: Normograma de Buthani, SBP, 2021.","Baseando-se no exame físico do RN, nos exames laboratoriais e no nomograma de Buthani acima, sua conduta é:"],"alternativas":{"A":"contraindicar a alta, e inicia fototerapia imediatamente, com reavaliação das bilirrubinas em 4-8h.","B":"alta hospitalar, e solicitar que o recém-nascido retorne ao serviço em 48h para reavaliação.","C":"contraindicar a alta, e inicia fototerapia imediatamente, com reavaliação clínica em 12h.","D":"alta; solicitar retorno em 72 horas, com bilirrubinas total e frações, hemograma e reticulócitos."},"correta":"A","oficial":{},"oficial_extra":["Alternativa correta: Contraindica a alta, e inicia fototerapia imediatamente, com reavaliação das bilirrubinas em 4-8h.","Justificativa:","O caso trata-se de uma icterícia patológica por provável incompatibilidade ABO. O nomograma de Bhutani é um gráfico que permite classificar o risco de hiperbilirrubinemia em recém-nascidos (RN) com 35 semanas ou mais de idade gestacional, de acordo com a idade pós-natal. O nomograma classifica os RN em zonas de risco (alto >percentil 95, intermediário alto- entre os percentis 75-95 intermediário baixo entre os percentis 40-75 e baixo abaixo do percentil 40). Tal classificação ajuda o pediatra a decidir se deve ou não liberar o RN para alta hospitalar, bem como a elaborar a investigação e o tratamento da icterícia. De acordo com o valor da bilirrubina total e a idade gestacional, o RN em questão encontra-se acima do P5 (alto risco), devendo permanecer internado, e iniciar imediatamente a fototerapia e reavaliar bilirrubinas em 4-8h.","O fluxograma abaixo mostra o manejo da hiperbilirrubinemia indireta em RN com 35 ou mais semanas de gestação na primeira semana de vida (Sociedade Brasileira de Pediatria)."],"refs":["JÚNIOR, Dioclécio C.; BURNS, Dennis Alexander R.; LOPEZ, Fábio A. Tratado de pediatria. 5ª edição. Barueri -SP: editora Manole, 2021. E-book. ISBN 9786555767476.","SBP - SOCIEDADE BRASILEIRA DE PEDIATRIA. Hiperbilirrubinemia indireta no período neonatal. Manual de Orientação, Departamento Científico de Neonatologia, n. 10, 2021. Disponível em: https://www.sbp.com.br/fileadmin/user_upload/23176c- MO_Hiperbilirrubinemia_indireta_periodo_neo.pdf"],"tema":"Icterícia neonatal — incompatibilidade ABO","conceito":"Icterícia precoce + BI alta com BD normal + mãe O e RN A = doença hemolítica ABO (a mãe O produz anti-A/anti-B IgG). Pode ocorrer na primeira gestação e o Coombs costuma ser fraco. Decida pelo nomograma de Bhutani, não pela zona de Kramer.","alt":{"A":"CORRETA. Contraindicar a alta, fototerapia imediata e recontrole de bilirrubina em 4–8 h (a hemólise sobe > 0,5 mg/dL/h).","B":"Alta com retorno em 48 h é o cenário clássico de reinternação por kernicterus.","C":"Acerta a fototerapia, mas reavaliação só clínica em 12 h é insuficiente — a pele clareia sob fototerapia sem que a bilirrubina tenha caído.","D":"Pede os exames certos, mas dar alta é a decisão errada."},"roteiro":[],"takehome":"Mãe O + RN A/B + icterícia precoce = hemólise. A resposta certa combina não dar alta + fototerapia + recontrole laboratorial.","area":"CI · Icterícia neonatal"},{"id":49,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":9}],"enunciado":["( AFYA CRUZEIRO DO SUL) A médica da Estratégia de Saúde da Família realiza a visita domiciliar de um recém-nascido de três dias. O bebê apresenta icterícia neonatal, com coloração amarelada evidente na face e no tronco, estendendo-se até a região umbilical, correspondendo à zona 3 de Kramer. A mãe relata que o bebê está amamentando bem, com seis episódios de diurese e três de evacuação nas últimas 24 horas. Não há histórico de doenças na família, e o parto foi cesáreo, sem intercorrências. O bebê nasceu com 36 semanas. O exame físico não mostra alterações além da icterícia.","Com base nesses dados, qual a conduta correta?"],"alternativas":{"A":"Iniciar fototerapia intensiva imediatamente na unidade de saúde, sem necessidade de exames adicionais.","B":"Encaminhar para hospitalização e possíveis transfusões de troca, considerando a extensão da icterícia.","C":"Realizar banhos de sol em domicílio por 30 minutos diários, expondo tronco em membros e reavaliar em 48 horas.","D":"Solicitar Bilirrubina sérica total e, se valor do normograma de Bhutani estiver acima do percentil 75, iniciar fototerapia."},"correta":"D","oficial":{},"oficial_extra":["A icterícia neonatal é comum e, muitas vezes, benigna, mas a extensão até a zona 3 de Kramer em um bebê de 3 dias sugere a necessidade de investigação adicional com exames laboratoriais . A solicitação de bilirrubina sérica total é essencial para determinar a gravidade e a necessidade de tratamento. De acordo com normograma de Bhutani, se o valor total de bilirrubina sérica for acima do percentil 75, há um risco significativo de kernicterus justificando a fototerapia.","Referência:","Júnior, Dioclécio, C. et al. Tratado de pediatria. v.1 . Disponível em: Minha Biblioteca, (5ª edição). Editora Manole, 2021."],"refs":[],"tema":"Icterícia neonatal na atenção básica","conceito":"RN de 3 dias no pico fisiológico, mamando bem — mas com dois pontos de atenção: 36 semanas (prematuro tardio) e zona 3 de Kramer. Kramer serve para triagem; a decisão é pela bilirrubina sérica no nomograma de Bhutani.","alt":{"A":"Iniciar fototerapia sem dosar bilirrubina é tratar às cegas.","B":"Exsanguineotransfusão é medida de exceção, não se indica por extensão da icterícia.","C":"Banho de sol está PROSCRITO pela SBP: sem eficácia, com risco de queimadura e hipotermia.","D":"CORRETA. Dosar bilirrubina e plotar em Bhutani; acima do percentil 75, com a prematuridade tardia, indica fototerapia."},"roteiro":[],"takehome":"Kramer triagem, Bhutani decisão. 35–36 semanas é fator de risco relevante.","area":"CI · Icterícia neonatal"},{"id":50,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":10}],"enunciado":["( UNIPTAN) Um adolescente, de 15 anos, comparece para atendimento após familiares notarem feridas nas mãos dele. Paciente relata que precisa lavar as mãos várias vezes ao dia e que seus banhos possuem duração de aproximadamente 3 horas. Ele explica: “Tenho pensamentos de que estou coberto de germes e de que se não me lavar ficarei doente. Quando estou no banho, preciso me lavar em uma ordem específica. Se não fizer isso, preciso recomeçar, e isso leva horas. E se eu não me lavar, sinto muita ansiedade e tenho a sensação de algo ruim possa acontecer. A minha pele está ferida e sangrando por eu passar tantas horas me lavando. Sei que não faz sentido, mas não consigo me controlar.”","Com base neste caso clínico, o tratamento de primeira linha é:"],"alternativas":{"A":"uso de inibidores seletivos da recaptação de serotonina, associado opcionalmente a um psicoestimulante, com duração de 6 meses.","B":"encaminhamento para neurocirurgia pois o caso é grave e refratário a tratamento.","C":"acompanhamento psicológico associado ao uso de benzodiazepínicos para auxiliar na ansiedade.","D":"terapia cognitivo comportamental associada ao uso de inibidores seletivos da recaptação de serotonina."},"correta":"D","oficial":{},"oficial_extra":["Paciente apresenta sinais e sintomas característicos de TOC (Transtorno Obsessivo Compulsivo). O tratamento de primeira linha é a associação de Terapia Cognitiva Comportamental com uso de medicamentos antidepressivos– fluoxetina, fluvoxamina, paroxetina, sertralina, clomipramina ou venlafaxina, podendo associar antipsicótico como risperidona se necessário. Após a resposta terapêutica, é recomendado manter o uso da medicação por mais 1 a 2 anos. O uso de psicoestimulante não é descrito como tratamento para TOC. O uso de benzodiazepínicos não é considerado linha de tratamento para os pensamentos obsessivos ou compulsão no TOC.","Referência:","UpToDate, DSM V."],"refs":[],"tema":"TOC — tratamento de primeira linha","conceito":"Obsessões egodistônicas + compulsões consumindo > 1 h/dia. Primeira linha: TCC com exposição e prevenção de resposta + ISRS em dose ALTA (fluoxetina 40–80 mg, sertralina 150–200 mg), com latência de 8–12 semanas e manutenção por 1–2 anos.","alt":{"A":"ISRS certo, mas psicoestimulante não tem papel e 6 meses é pouco.","B":"Neurocirurgia só em casos refratários a múltiplos tratamentos — este nunca foi tratado.","C":"Benzodiazepínico não trata obsessões e gera dependência.","D":"CORRETA. TCC-EPR + ISRS, combinação superior a cada um isolado."},"roteiro":[],"takehome":"TOC: dose ALTA e tempo LONGO. Em refratariedade, potencialize com antipsicótico atípico.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":51,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":11}],"enunciado":["( FASA VIC) Maria, 25 anos, G1P0, está com 10 semanas de gestação confirmada por ultrassonografia realizada há três semanas. Ela comparece à Unidade Básica de Saúde (UBS) relatando sangramento vaginal leve, de coloração marrom, iniciado há um dia, associado a leve dor abdominal em cólica. Não apresenta febre, e sua pressão arterial está normal (120/80 mmHg). Durante o exame físico, observa-se que o colo uterino está fechado, sem sinais de dilatação. Não há sinais de infecção ou outras anormalidades.","Diante desse quadro, identifique a alternativa que apresenta a conduta mais adequada para Maria considerando os achados do exame físico."],"alternativas":{"A":"Recomendar repouso absoluto em casa, sem necessidade de exames complementares, e agendar retorno em uma semana.","B":"Encaminhar a paciente para internação hospitalar devido ao risco iminente de aborto.","C":"Encaminhar a paciente imediatamente para o serviço de urgência e emergência para realização de curetagem uterina.","D":"Solicitar ultrassonografia obstétrica transvaginal para avaliação da gestação e liberar a paciente para repouso domiciliar, caso não haja sinais de complicações."},"correta":"D","oficial":{"D":"Resposta correta: Solicitar ultrassonografia obstétrica transvaginal para avaliação da gestação e liberar a paciente para repouso domiciliar, caso não haja sinais de complicações. A paciente apresenta sangramento leve e o colo uterino está fechado, o que sugere que o sangramento pode não estar associado a um aborto iminente. A ultrassonografia é essencial para avaliar o desenvolvimento fisiológico e a localização da gestação, descartando complicações como aborto retido ou gestação ectópica. Após a avaliação, se não houver sinais de complicações, a paciente pode ser liberada para repouso domiciliar com orientações sobre sinais de alerta.","C":"- Encaminhar a paciente imediatamente para o serviço de urgência e emergência para realização de curetagem uterina. Incorreto. O encaminhamento imediato para o serviço de urgência com indicação de curetagem uterina não é justificado sem antes realizar avaliação fetal e a presença de outras possíveis causas para o sangramento.","B":"- Encaminhar a paciente para internação hospitalar devido ao risco iminente de aborto. Incorreto. A internação hospitalar pode ser indicada em casos de sangramento abundante ou sinais de aborto iminente, o que não é o caso aqui, visto que o colo uterino está fechado e o sangramento é leve.","A":"- Recomendar repouso absoluto em casa, sem necessidade de exames complementares, e agendar retorno em uma semana. Incorreto. Embora o repouso seja uma conduta válida, a ausência de exames complementares pode deixar de identificar possíveis complicações que necessitam de manejo mais específico."},"oficial_extra":["Referência:","BEREK, J. S. (Ed.). Berek & Novak: tratado de ginecologia. 15. ed. Rio de Janeiro: Guanabara Koogan, 2014."],"refs":[],"tema":"Ameaça de abortamento","conceito":"Colo FECHADO: ameaça, retido ou completo. Colo ABERTO: em curso, incompleto ou infectado. Aqui colo fechado, sangramento leve, estável = ameaça. O diferencial obrigatório é gestação ectópica.","alt":{"A":"Dispensar exames deixa passar ectópica; e repouso absoluto não previne aborto.","B":"Internação é para instabilidade, sangramento abundante ou infecção.","C":"Curetagem em colo fechado com possível embrião vivo é erro grave.","D":"CORRETA. US transvaginal + alta com orientação de sinais de alarme."},"roteiro":[],"takehome":"Não esqueça tipagem e imunoglobulina anti-D se Rh negativo não sensibilizada.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":52,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":12}],"enunciado":["( IESVAP) Uma mulher, de 27 anos, é levada ao ambulatório de uma UBS pelos amigos e pela colega de quarto. Eles relatam que a paciente não tem dormido nas últimas 3 ou 4 semanas e que perceberam que ela fica acordada à noite, limpando o apartamento. Passou a ingerir grande quantidade de álcool o que leva a mesma ficar extremamente irritada e agressiva. Adquiriu um novo celular, modelo Iphone, embora a colega de quarto afirme que ela não tem dinheiro para comprar esse tipo de coisa. A paciente também tem se vangloriado para os amigos de que dormiu com três homens diferentes na última semana, mas esse não é seu comportamento habitual. Os amigos referem não tê-la visto usar alguma droga e acreditam que não tenha problema de saúde nem tome qualquer medicamento que precise de receita. Não estão a par de história familiar de distúrbios clínicos nem de transtornos psiquiátricos. Informam que ela é estudante de medicina. Em um exame do estado mental, a paciente se mostra alternadamente irritável e exaltada. Está usando uma camisa laranja forte e uma calça vermelha, e suas meias não formam par. Fica caminhando pela sala e recusa-se a sentar quando convidada pelo examinador. Sua fala é rápida e alta, e é difícil interrompê-la. Diz que seu humor está “ótimo” e está muito zangada com os amigos por tê-la obrigado a vir ao ambulatório. Fala que eles provavelmente tenham insistido porque “estão com inveja do meu sucesso com os homens”. Seus processos de pensamento são tangenciais. Nega qualquer ideação suicida ou homicida, alucinações ou delírios.","Assinale o diagnóstico mais provável para a paciente."],"alternativas":{"A":"Transtorno do pânico sem agorafobia.","B":"Transtorno de personalidade esquizotípica.","C":"Transtorno bipolar do humor, fase maníaca.","D":"Transtorno de ansiedade generalizada."},"correta":"C","oficial":{},"oficial_extra":["A história dessa paciente oferece uma descrição bastante direta do comportamento maníaco, e os resultados de seu exame do estado mental também são bastante clássicos. O uso significativo de álcool e ausência de problemas clínicos torna mais provável o diagnóstico de mania. O uso de substâncias, embora negado pelos amigos, precisa ser descartado por meio de um screening toxicológico de urina. Considerando a irritabilidade do paciente e a ausência de insight em relação à doença, provavelmente será impossível convencê-la a usar algum medicamento. Entre os diagnósticos diferenciais, deve-se levar em conta a possibilidade de um transtorno de personalidade “borderline” o que modificará a conduta do profissional frente ao paciente haja visto que esse exigiria apoio psicoterápico para aprendizagem de readaptação frente ao mundo e as necessidades da paciente."],"refs":["SADOCK, Benjamin. Compêndio de Psiquiatria. Ciência do comportamento e psiquiatria clínica. 9 ed. Rio de Janeiro: Artmed, 2009.","TOY & KLAMEN. Casos clínicos em psiquiatria. 3ed. Rio de Janeiro: Artmed, 2011 (QUESTÕES ADAPTADAS)."],"tema":"Episódio maníaco","conceito":"Mania: humor elevado/irritável + energia aumentada por ≥ 7 dias com prejuízo funcional. Mnemônico DIGFAST — Distraibilidade, Indiscrição, Grandiosidade, Fuga de ideias, Atividade aumentada, Sono reduzido, Tagarelice.","alt":{"A":"Pânico são crises de minutos, não semanas de humor elevado.","B":"Esquizotípica é padrão estável de excentricidade, não episódio recente.","C":"CORRETA. TB em episódio maníaco (tipo I). Descarte substâncias e TSH, avalie internação pela ausência de insight.","D":"TAG é preocupação crônica, não euforia com grandiosidade."},"roteiro":[],"takehome":"Rode o DIGFAST. O álcool aumentado aqui é consequência da mania, não a causa — mas o toxicológico é obrigatório.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":53,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2024.2","num":13}],"enunciado":["( UNINOVAFAPI) Uma mulher, de 60 anos, comparece à Unidade Básica de Saúde com queixas de poliartralgia simétrica, principalmente nas articulações dos joelhos e quadris. A dor piora com a atividade física e melhora com o repouso. Ela relata rigidez matinal que dura menos de 30 minutos e não tem sinais de inflamação visíveis. O exame físico revela discreto aumento de volume das articulações interfalangeanas distais das mãos, sem sinais flogísticos. Com base neste caso clínico, responda as questões abaixo:","1. Quais medicamentos são recomendados para o manejo da dor nesta paciente? 2. Quais intervenções não medicamentosas devem ser recomendadas para esta paciente?"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. Tratamento Medicamentoso:","Analgésicos e Anti-inflamatórios Não Esteroides (AINEs): Medicamentos como o paracetamol e os AINEs (ibuprofeno, naproxeno) podem ser utilizados para aliviar a dor e melhorar a função. É importante considerar os efeitos colaterais, especialmente em pacientes com comorbidades, devendo- se excluir contraindicações como nefropatia, doença ulcerosa péptica ou história de hemorragia digestiva alta e cardiopatia grave. Analgesia Tópica: Cremes e géis contendo AINEs, como o diclofenaco, podem ser utilizados para aliviar a dor local.","2. Tratamento Não Medicamentoso:","Fisioterapia: A fisioterapia é crucial para melhorar a mobilidade e a força muscular ao redor das articulações afetadas. Programas de exercícios específicos podem ajudar a reduzir a dor e melhorar a função articular. Exercícios Físicos: Atividades de baixo impacto, como caminhada, natação e exercícios aquáticos, são recomendadas para manter a função articular e a mobilidade, bem como para auxiliar na manutenção do peso. Perda de Peso: A redução do peso corporal pode aliviar a pressão sobre as articulações dos joelhos e quadris, ajudando a reduzir a dor e melhorar a função. Modificação do Estilo de Vida: Recomendações para adotar técnicas de alívio da dor, como a aplicação de calor ou frio, e o uso de suportes ortopédicos, se necessário. Educação do Paciente: Ensinar a paciente sobre a doença, o manejo dos sintomas e a importância da adesão ao tratamento e às mudanças no estilo de vida é fundamental."],"refs":["Jordan, K. M., & Arden, N. K. Osteoarthritis: Diagnosis and Management. BMJ, 2003.","Zhang, W., & Doherty, M. Osteoarthritis: A Review of Current Management. Best Practice & Research Clinical Rheumatology, 2006.","American College of Rheumatology. 2019 Recommendations for the Management of Osteoarthritis. Arthritis & Rheumatology, 2019."],"tema":"Osteoartrite — manejo completo","conceito":"Padrão mecânico com nódulos de Heberden. Na discursiva, organize por eixo e justifique cada item.","alt":{},"roteiro":["Medicamentoso: AINE tópico (diclofenaco gel) como primeira escolha em joelhos e mãos; paracetamol até 3 g/dia como analgésico de base.","AINE sistêmico na menor dose e tempo, checando contraindicações (úlcera/HDA, nefropatia, ICC, HAS) e associando IBP se risco gastrointestinal.","Duloxetina em dor crônica difusa; infiltração de corticoide em surto inflamatório.","Não recomendar: opioide, glucosamina/condroitina.","Não medicamentoso: exercício aeróbico de baixo impacto + fortalecimento de quadríceps (pilar do tratamento).","Perda de peso de 5–10%; fisioterapia e terapia ocupacional (proteção articular, adaptação de utensílios nas mãos).","Bengala CONTRALATERAL, palmilhas, termoterapia; educação sobre a importância do movimento."],"takehome":"Comece pelo não farmacológico — é o que tem mais evidência e o que os alunos esquecem.","area":"CI · Reumatologia (OA e artrites)"},{"id":54,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":14}],"enunciado":["( UNIREDENTOR) A.S.L., 17 anos de idade, primigesta, procura a emergência obstétrica devido a sangramento vaginal e dor intensa em andar inferior do abdome, sobretudo à esquerda. Ainda não iniciou o pré-natal, não possui nenhum exame laboratorial ou de imagem, exceto beta HCG que realizou há 07 dias e encontra-se reator. Refere última menstruação há 02 meses. Ao exame físico, apresenta intensa palidez cutâneo mucosa, pressão arterial de 80x50 mmHg e frequência cardíaca de 135 bpm. Abdome doloroso à palpação superficial e profunda, sobretudo em fossa ilíaca esquerda. Realizada culdocentese com extração de fluido sanguinolento.","Dentre as afirmativas abaixo, marque a conduta mais adequada."],"alternativas":{"A":"Aguardar realização de exame de imagem, principalmente ultrassonografia transvaginal para confirmação diagnóstica antes do tratamento cirúrgico.","B":"Realizar laparotomia para identificar foco de sangramento e controle do mesmo.","C":"Realizar laparoscopia para anexectomia e controle do sangramento.","D":"Iniciar uterotônicos para expulsão de restos ovulares antes da curetagem ou aspiração manual intrauterina."},"correta":"B","oficial":{},"oficial_extra":["Paciente com diagnóstico clínico de gestação ectópica. Apresenta instabilidade hemodinâmica e portanto indicação de tratamento cirúrgico. Nesse caso não há como aguardar realização de exames de imagem. Uterotônicos deveriam ser empregados em caso de aborto. A laparoscopia com anexectomia não corresponde à alternativa adequada uma vez que não foi citado anteriormente a localização do implante ectópico. Se encontrado fora da trompa ou ovário, a anexectomia não seria capaz de controlar o sangramento.","Referência:","Federação Brasileira das Associações de Ginecologia e Obstetrícia (FEBRASGO). São Paulo: FEBRASGO; 2021. (Protocolo FEBRASGO - Obstetrícia, nº 15)."],"refs":[],"tema":"Gestação ectópica rota","conceito":"Beta-hCG positivo + dor + choque + culdocentese com sangue = ectópica rota com hemoperitônio. Instável = laparotomia; estável = laparoscopia; metotrexato só com critérios restritos (massa < 3,5 cm, sem BCF, hCG < 5.000, sem hemoperitônio).","alt":{"A":"Esperar US em paciente chocada é perder sangue; o diagnóstico já está feito.","B":"CORRETA. Laparotomia com salpingectomia, junto de reposição volêmica, hemoderivados e anti-D se Rh negativo.","C":"Laparoscopia em instável, e 'anexectomia' pressupõe localização não estabelecida.","D":"Uterotônico e curetagem são condutas de abortamento — o útero aqui está vazio."},"roteiro":[],"takehome":"Ectópica é a principal causa de morte materna no 1º trimestre. Culdocentese positiva encerra a discussão.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":55,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":15}],"enunciado":["(AFYA PALMAS) Uma mãe traz seu filho de 7 anos à consulta, preocupada com um nódulo na região do pescoço, que notou há uma semana. A criança não apresenta febre, perda de peso ou sudorese noturna, mas teve uma amigdalite recentemente. O médico solicitou um hemograma, cujo resultado mostra: leucócitos 9.500/mm³ (normal: 4.000-11.000/mm³), hemoglobina 12 g/dL (normal: 11-14 g/dL), plaquetas 300.000/mm³ (normal: 150.000-450.000/mm³) e linfócitos 45% (normal: 25-45%). Ao exame físico, há uma linfonodomegalia cervical móvel e dolorosa.","Qual é a hipótese diagnóstica mais provável para este caso?"],"alternativas":{"A":"Leucemia Linfoblástica Aguda (LLA).","B":"Linfoma de Hodgkin.","C":"Linfonodomegalia reacional.","D":"Anemia aplástica"},"correta":"C","oficial":{"A":"Leucemia Linfoblástica Aguda (LLA). Errada. A LLA geralmente se apresenta com sintomas sistêmicos mais graves, como febre persistente, cansaço extremo, palidez e petéquias, além de alterações significativas no hemograma, como leucocitose importante, anemia grave e trombocitopenia. O hemograma normal no caso descrito torna essa hipótese menos provável.","B":"Linfoma de Hodgkin. Errada. O linfoma de Hodgkin frequentemente se manifesta com linfonodos endurecidos, indolores e fixos, além de sintomas como febre, sudorese noturna e perda de peso. Além disso, o hemograma frequentemente mostra algum grau de anemia ou alterações nos leucócitos. No caso descrito, os linfonodos são dolorosos e móveis, o que favorece outra etiologia.","C":"Linfonodomegalia reacional. Correta. A linfonodomegalia reacional é uma resposta comum a infecções, como a faringite mencionada no caso clínico. Os linfonodos reacionais são frequentemente dolorosos e móveis. O hemograma sem alterações relevantes sugere uma infecção recente, o que apoia essa hipótese.","D":"Anemia aplástica Errada. A anemia aplástica cursa com pancitopenia, ou seja, redução global das três séries do sangue (glóbulos vermelhos, glóbulos brancos e plaquetas), o que não é compatível com o hemograma apresentado, onde todas as células sanguíneas estão dentro dos limites normais."},"oficial_extra":["Justificativa das alternativas:","Referência Bibliográfica","JÚNIOR, Dioclécio C.; BURNS, Dennis Alexander R.; LOPEZ, Fábio A. Tratado de pediatria. 5ª edição. Barueri -SP: editora Manole, 2021. E-book. ISBN 9786555767476"],"refs":[],"tema":"Linfonodomegalia reacional","conceito":"Benigno: móvel, elástico, DOLOROSO, < 2–3 cm, com foco infeccioso. Alarme: endurecido, fixo, indolor, > 3 cm e crescendo, supraclavicular ou epitroclear, sintomas B ou hemograma alterado.","alt":{"A":"LLA cursaria com citopenias, blastos, dor óssea e sangramentos.","B":"Hodgkin dá linfonodo endurecido, indolor e aderido, com sintomas B.","C":"CORRETA. Reacional pós-amigdalite; observar e reavaliar em 2–4 semanas.","D":"Aplástica é pancitopenia e não causa linfonodomegalia."},"roteiro":[],"takehome":"Doloroso e móvel tranquiliza; endurecido, fixo e indolor preocupa. Supraclavicular sempre investiga.","area":"CI · Onco-hematologia pediátrica"},{"id":56,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":1},{"prova":"CI 3 2025.1","num":14}],"enunciado":["(AFYA PARAÍBA) Menino, 4 anos, natural e residente em São Paulo – SP. É trazido ao pronto- socorro com queixa de febre contínua há 30 dias, astenia, dor nos membros inferiores e petéquias. Sem antecedentes pessoais relevantes e não tem histórico recente de viagens. Não há história de contato com animais ou exposição a ambientes endêmicos.","Ao exame físico, apresenta como alterações febre (39°C), palidez, petéquias e regular estado geral. Presença de linfonodomegalias em região auricular posterior, epitroclear e supraclavicular. Hepatoesplenomegalia moderada.","De acordo com o caso apresentado, assinale a alternativa que apresenta a hipótese diagnóstica mais provável e que exame deve ser solicitado para o diagnóstico."],"alternativas":{"A":"Leucemia linfoblástica aguda. Solicitar mielograma.","B":"Malária. Solicitar gota espessa.","C":"Linfoma de Hodgkin. Solicitar ressonância nuclear magnética.","D":"Febre reumática. Solicitar fator reumatoide."},"correta":"A","oficial":{"A":"Correta: Leucemia linfoblástica aguda. Solicitar mielograma.","C":"Incorreta: Linfoma de Hodgkin. Solicitar ressonância nuclear magnética.","B":"Incorreta: Malária. Solicitar gota espessa.","D":"Incorreta: Febre reumática. Solicitar fator reumatoide."},"oficial_extra":["A principal hipótese é a Leucemia Linfoblástica Aguda (LLA). A faixa etária de maior incidência da LLA é do 2º ao 5º ano de vida, sendo rara no recém-nascido. Há discreto predomínio no sexo masculino (1,2:1). Os sinais e sintomas da LLA são decorrentes da infiltração neoplásica (linfoblastos) na medula óssea e da disseminação dessas células através da corrente sanguínea, para outros órgãos e sistemas. Geralmente, a evolução ocorre em dias ou semanas, com piora gradativa ou mesmo súbita. A dor óssea é frequente, geralmente ocorre em membros, principalmente inferiores, e pode tornar-se muito intensa, impedindo a deambulação. A febre","também é um sintoma prevalente, que ocorre em cerca de 50-60% dos casos. Palidez, astenia, petéquias e equimoses são comuns na fase inicial da doença. No exame clínico, além da palidez, fenômenos hemorrágicos e febre, frequentemente se observam hepatomegalia, esplenomegalia e linfonodomegalias generalizadas.","Ao diagnóstico, o hemograma revela várias alterações sugestivas da doença. A confirmação do diagnóstico é realizada pelo mielograma, avaliando-se as características citomorfológicas dos blastos. Para o diagnóstico de LLA, devem ser observados no mínimo 25% de linfoblastos na medula óssea.","O linfoma de Hodgkin (LH) tem pico de incidência entre 15-19 anos de idade, sendo considerado a neoplasia mais comum na adolescência (15%). Na forma infantil (< 15 anos), existe uma ligeira predominância do sexo masculino, sendo raro antes dos 5 anos de idade (acometendo 5 vezes mais meninos abaixo de 5 anos). O LH é mais indolente, e a história de aumento de linfonodos é de semanas ou meses. Em 80% das crianças com LH, a manifestação clínica inicial é de linfonodomegalia periférica indolor, preferencialmente na região cervical ou supraclavicular. Sintomas constitucionais como anorexia, fadiga, tosse, dispneia e prurido (este último mais visto em adultos) estão presentes em 25% dos casos. O diagnóstico do LH, assim como do LNH, é feito pela biópsia do local comprometido de maior representatividade.","No Brasil, a malária é um problema de saúde pública em que 99% dos casos ocorrem na Amazônia. As manifestações clínicas na malária são de caráter sistêmico em que a febre constitui o principal sinal ou sintoma, com duração variável de 6 a 12 horas. Ela costuma ser precedida de calafrio e seguida de sudorese, sendo em geral elevada e presente em quase todos os pacientes. Denomina-se tríade malárica a febre acompanhada de cefaleia e calafrio. Anorexia, artralgia e astenia podem também ocorrer, ao lado de manifestações respiratórias (tosse, dispneia) e gastrointestinais (dor abdominal, náuseas, vômitos e diarreia). No exame físico, além da constatação da febre, podem ser observados palidez, icterícia, hepatomegalia e esplenomegalia. A suspeita de malária deve ser cogitada em toda criança com febre que resida em área endêmica de malária ou que tenha estado recentemente em locais endêmicos para a doença, inclusive aqueles da área extra-amazônica. Para esse fim, solicitar a pesquisa de plasmódio em gota espessa, que é o exame específico mais comum para o diagnóstico.","A febre reumática (FR) é rara antes dos 5 anos e infrequente depois dos 15 ou na vida adulta. Atualmente, o diagnóstico é considerado na presença de sinais maiores, sinais menores e evidência de infecção de estreptococcia prévia. Não é possível fazer diagnóstico de FR sem ter ao menos a presença de um dos 5 sinais maiores: artrite, cardite, coreia, nódulos subcutâneos e eritema marginado. A artrite é definida pela presença de edema na articulação ou, na falta deste, pela associação de dor e limitação do movimento. No caso, a dor é relatada em todo o membro e não apenas na articulação. Além disso, não há indicação de solicitar fator reumatoide.","Referência:","PEDIATRIA, Sociedade Brasileira de. Tratado de pediatria. 6. ed. Barueri: Manole, 2024. E-book. p.v2-482. ISBN 9788520458679. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520458679/. Acesso em: 10 abr. 2025."],"refs":[],"tema":"Leucemia linfoblástica aguda","conceito":"Espelho da 55, com todos os alarmes: febre de 30 dias, dor em membros (infiltração medular — criança que para de andar pede hemograma), petéquias, palidez, hepatoesplenomegalia e linfonodos epitroclear e supraclavicular. LLA é o câncer mais comum da infância, pico dos 2 aos 5 anos.","alt":{"A":"CORRETA. LLA + mielograma (≥ 20–25% de blastos), com imunofenotipagem e punção lombar.","B":"Malária exige área endêmica, negada no enunciado.","C":"Hodgkin tem pico em adolescentes e o diagnóstico é por biópsia excisional, não RM.","D":"Febre reumática usa critérios de Jones e ASLO, não fator reumatoide."},"roteiro":[],"takehome":"Linfonodo supraclavicular ou epitroclear em criança nunca é 'reacional' por padrão.","area":"CI · Onco-hematologia pediátrica"},{"id":57,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":2},{"prova":"CI 3 2025.1","num":9}],"enunciado":["(AFYA ITABUNA) Uma mãe leva seu filho de 10 anos ao ambulatório pediátrico para avaliação de uma massa palpável na região cervical. A mãe relata que notou um aumento no tamanho do linfonodo há cerca de uma semana. O menino não apresenta febre, fadiga ou perda de apetite.","Ao exame físico, apresenta como alteração linfonodo cervical aumentado (aproximadamente 2 cm), elástico, móvel e indolor, sem sinais de infecção local.","Um hemograma completo foi solicitado e os resultados mostram: Hemoglobina: 12 g/dL, Contagem de leucócitos: 8.000/mm³, Contagem de plaquetas: 250.000/mm³, Linfócitos: 60% (valor normal: 20% a 50% do total de leucócitos) e Neutrófilos: 30% (valor normal: 40% a 70% do total de leucócitos).","Com base na história clínica e nos resultados do hemograma, qual é a hipótese mais apropriada para este caso?"],"alternativas":{"A":"Leucemia linfoblástica aguda.","B":"Linfoma não-Hodgkin.","C":"Linfoma de Hodgkin.","D":"Linfadenopatia reacional."},"correta":"D","oficial":{"D":"Correta: A linfadenopatia reacional é comum em crianças e pode ocorrer em resposta a infecções virais ou bacterianas. Os achados clínicos e laboratoriais sugerem uma resposta imunológica normal, com contagens hematológicas dentro dos limites normais. Características do linfonodo: linfonodos elásticos, móveis, indolores, de tamanho não maior que 2-3 cm, são frequentemente reacionais. No hemograma, caso o quadro infeccioso seja bacteriano, pode ser observada leucocitose com neutrofilia, e se viral há predomínio de linfócitos com atipias, desde que as demais séries, vermelha e plaquetária, estejam normais.","A":"Incorreta: Embora a leucemia linfoblástica aguda possa causar linfadenopatia, os resultados do hemograma não mostram anormalidades típicas dessa condição, como anemia significativa ou trombocitopenia. Além disso, a ausência de sintomas mais graves como febre alta ou perda de peso acentuada torna essa hipótese menos provável.","B":"Incorreta: O linfoma não-Hodgkin geralmente apresenta-se com linfadenopatia, embora os achados clínicos e laboratoriais não sejam típicos dessa condição. Outros sintomas estão associados, como febre, perda de peso, sudorese abundante à noite, prurido, inapetência, cansaço e calafrios. Linfonodos duros, elásticos, pouco dolorosos, aderidos a planos profundos, coalescentes com outros linfonodos, frequentemente gerando massa maior que 4 cm, são características das neoplasias, principalmente linfomas (doença de Hodgkin e menos frequentemente linfoma não Hodgkin).","C":"Incorreta: O linfoma de Hodgkin mais comum entre 15 e 35 anos pode apresentar-se com linfadenopatia cervical indolor, que se espalha de forma ordenada de um grupo de linfonodos para outro; no entanto, os exames laboratoriais não mostram anormalidades típicas. A confirmação requer biópsia do linfonodo."},"oficial_extra":[],"refs":["INCA - Instituto Nacional de Câncer. Disponível em: https://www.inca.gov.br/tipos-de- cancer/cancer-infantojuvenil. Acesso em: 10 abr. 2025.","PEDIATRIA, Sociedade Brasileira de. Tratado de pediatria. 6ª ed. Barueri: Manole, 2024. E-book. p. Capa. ISBN 9788520458679. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520458679/. Acesso em: 21 nov. 2024."],"tema":"Linfadenopatia reacional (variação)","conceito":"Aqui o linfonodo é INDOLOR, o que assusta — mas 2 cm, elástico, móvel, sem sintomas sistêmicos e com séries vermelha e plaquetária normais (só linfocitose relativa) mantém o padrão reacional viral.","alt":{"A":"LLA exigiria anemia, plaquetopenia ou blastos.","B":"LNH cresce rápido, forma massa > 4 cm e adere a planos profundos.","C":"Hodgkin tem pico dos 15 aos 35 anos, com linfonodo endurecido e sintomas B.","D":"CORRETA. Reacional; reavaliar em 2–4 semanas."},"roteiro":[],"takehome":"Indolor isolado com o resto normal ainda é reacional — mas exige reavaliação PROGRAMADA, não alta simples.","area":"CI · Onco-hematologia pediátrica"},{"id":58,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":3},{"prova":"CI 3 2025.1","num":5}],"enunciado":["(UNISL PORTO VELHO) Um homem de 32 anos comparece ao ambulatório psiquiátrico acompanhado da esposa, que relata mudanças significativas em seu comportamento nos últimos meses. Ele descreve episódios de extrema energia, em que se sente invencível, fala excessivamente e faz gastos impulsivos. Em outros momentos, sente-se profundamente deprimido, sem energia e com pensamentos suicidas. A esposa relata que ele tem um histórico de oscilações de humor desde os 20 anos, mas nunca procurou tratamento adequado. Nega antecedentes pessoais relevantes, uso de medicamentos e drogas.","Diante desse quadro, identifique qual é a conduta inicial mais apropriada."],"alternativas":{"A":"Indicar isoladamente a psicoterapia, pois a abordagem medicamentosa pode agravar os sintomas e causar dependência química.","B":"Recomendar mudanças no estilo de vida, como exercícios físicos e alimentação saudável, e reavaliar em seis meses antes de iniciar tratamento medicamentoso.","C":"Prescrever um antidepressivo isolado, pois poderá reduzir os sintomas depressivos e evitar recorrência de novos episódios.","D":"Iniciar um estabilizador de humor, como lítio ou ácido valproico, podendo associar um antipsicótico atípico conforme necessidade."},"correta":"D","oficial":{"D":"Iniciar um estabilizador de humor, como lítio ou ácido valproico, podendo associar um antipsicótico atípico conforme necessidade."},"oficial_extra":["Resposta correta:","Justificativa:","O transtorno afetivo bipolar exige um tratamento estruturado com estabilizadores de humor para reduzir a recorrência dos episódios maníacos e depressivos. O lítio é a principal medicação de escolha, demonstrando eficácia na estabilização do humor e na redução do risco de suicídio. O ácido valproico pode ser uma alternativa em casos específicos, como quando há contraindicação ao lítio. Em alguns casos, antipsicóticos atípicos (ex.: quetiapina, olanzapina) podem ser necessários para controle dos sintomas, especialmente em episódios maníacos mais intensos.","Análise das Alternativas Incorretas:","Incorreta: Prescrever um antidepressivo isolado, pois pode reduzir os sintomas depressivos e prevenir novos episódios.","O uso isolado de antidepressivos em pacientes com transtorno bipolar pode precipitar um episódio maníaco, aumentando o risco de impulsividade e comportamentos de risco. Se necessário, os antidepressivos devem ser usados em associação com estabilizadores de humor e sob monitoramento rigoroso.","Incorreta: Indicar apenas psicoterapia, pois a abordagem medicamentosa pode agravar os sintomas e causar dependência.","A psicoterapia pode auxiliar no manejo do transtorno bipolar, mas não substitui a necessidade de estabilizadores de humor. Além disso, os estabilizadores de humor não causam dependência química, diferentemente de algumas classes de medicamentos, como benzodiazepínicos.","Incorreta: Recomendar mudanças no estilo de vida, como exercícios físicos e boa alimentação, e reavaliar em seis meses antes de iniciar tratamento medicamentoso.","Embora hábitos saudáveis sejam importantes, o transtorno bipolar é uma condição psiquiátrica grave que requer tratamento farmacológico adequado. Adiar o tratamento pode levar a novos episódios e aumentar o risco de suicídio e comprometimento funcional."],"refs":["LOSCALZO, José; FAUCI, Anthony S.; KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21ª ed. Porto Alegre: AMGH, 2024. E-book. pág. 3551. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/.","American Psychiatric Association. Practice Guideline for the Treatment of Patients with Bipolar Disorder. 3ª ed. Washington, DC: APA, 2010.","Goodwin FK, Jamison KR. Manic-Depressive Illness: Bipolar Disorders and Recurrent Depression. 2ª ed. Oxford University Press, 2007.","Kaplan & Sadock’s Comprehensive Textbook of Psychiatry. 10ª ed. Philadelphia: Wolters Kluwer, 2017."],"tema":"Tratamento do transtorno bipolar","conceito":"Lítio é a referência: único com efeito antissuicídio, nível sérico 0,6–1,2 mEq/L, monitorar TSH e função renal, cuidado com AINE/IECA/tiazídico. Valproato é alternativa, mas muito teratogênico. Atípicos tratam a mania aguda.","alt":{"A":"Psicoterapia isolada não controla mania com ideação suicida; e estabilizadores não causam dependência.","B":"Esperar seis meses com pensamentos suicidas é inseguro.","C":"Antidepressivo ISOLADO no bipolar pode precipitar virada maníaca e ciclagem rápida.","D":"CORRETA. Estabilizador de humor, podendo associar antipsicótico atípico."},"roteiro":[],"takehome":"A pergunta que salva a resposta: esse paciente já teve mania? Se sim, nada de antidepressivo em monoterapia.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":59,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":4},{"prova":"CI 3 2025.1","num":7}],"enunciado":["(UNIREDENTOR) Mulher de 45 anos comparece à Unidade Básica de Saúde (UBS) relatando episódios recorrentes de taquicardia, sudorese intensa, sensação de falta de ar e medo iminente de morte. Refere que os sintomas iniciaram há cerca de seis meses, sem fator desencadeante claro, ocorrendo de forma abrupta e com resolução espontânea em aproximadamente 20 minutos. Nega eventos semelhantes prévios, transtornos psiquiátricos conhecidos ou uso de substâncias psicoativas. No exame físico, não há achados relevantes.","Qual é o diagnóstico mais provável?"],"alternativas":{"A":"Transtorno de Pânico.","B":"Transtorno de Estresse Pós-Traumático (TEPT).","C":"Transtorno de Ansiedade Generalizada (TAG).","D":"Transtorno de Ansiedade Social."},"correta":"A","oficial":{"A":"Transtorno de Pânico: Alternativa correta.","C":"Transtorno de Ansiedade Generalizada (TAG): Incorreta.","D":"Transtorno de Ansiedade Social: Incorreta.","B":"Transtorno de Estresse Pós-Traumático (TEPT): Incorreta."},"oficial_extra":["Analisando as alternativas:","O quadro descrito corresponde a crises de pânico espontâneas e recorrentes, sem fator desencadeante evidente e com sintomas autonômicos marcantes (taquicardia, sudorese, dispneia), além da sensação de morte iminente. O transtorno de pânico se caracteriza por ataques inesperados, acompanhados de preocupação persistente sobre novas crises.","O TAG se caracteriza por preocupação excessiva e persistente sobre múltiplas áreas da vida, acompanhada de sintomas físicos inespecíficos (fadiga, tensão muscular, irritabilidade), o que não condiz com a apresentação episódica abrupta da paciente.","O transtorno de ansiedade social envolve medo e evitação de situações sociais ou de desempenho por receio de avaliação negativa. A paciente não relata esse padrão de ansiedade relacionado a interações sociais.","O TEPT está associado a uma exposição prévia a evento traumático grave, gerando sintomas de reexperimentação, evitação e hiperestimulação autonômica. A paciente não menciona histórico de trauma significativo."],"refs":["LOSCALZO, José; FAUCI, Anthony S.; KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21ª ed. Porto Alegre: AMGH, 2024. E-book. pág. 3541. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 10 abr. 2025.","ASSOCIAÇÃO BRASILEIRA DE PSIQUIATRIA. Diretrizes para o diagnóstico e tratamento dos transtornos mentais na atenção primária à saúde. 2ª ed. Porto Alegre: Artmed, 2019."],"tema":"Transtorno de pânico","conceito":"Ataque: início abrupto, pico em ~10 min, duração 20–30 min, com ≥ 4 sintomas e medo de morrer. O TRANSTORNO exige ataques recorrentes inesperados + ≥ 1 mês de preocupação ou evitação. Excluir organicidade (TSH, ECG, glicemia, substâncias).","alt":{"A":"CORRETA. Crises espontâneas, recorrentes, autolimitadas, exame normal.","B":"TEPT exige trauma definido com revivescência e evitação.","C":"TAG é preocupação contínua por ≥ 6 meses, não crises abruptas.","D":"Ansiedade social tem gatilho de exposição ao julgamento."},"roteiro":[],"takehome":"Primeiro ataque aos 44 anos: peça TSH e ECG antes de fechar o diagnóstico. Tratamento é ISRS + TCC.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":60,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":5},{"prova":"CI 3 2025.1","num":6}],"enunciado":["(AFYA ITABUNA) Um homem de 60 anos comparece ao ambulatório com queixas de dor nas articulações, especialmente nos joelhos e nas mãos. Ele relata que a dor piora ao realizar atividades diárias, como subir escadas e abrir frascos, e melhora com o repouso. O paciente também menciona rigidez matinal que dura cerca de 20 minutos.","Ao exame físico, apresenta como alteração a diminuição leve da amplitude de movimento.","Considerando o quadro clínico apresentado, assinale a alternativa que contém o plano terapêutico inicial adequado para este paciente."],"alternativas":{"A":"Uso exclusivo de AINEs, sem necessidade de intervenções não farmacológicas.","B":"Educação do paciente, exercícios físicos, controle do peso e prescrição de paracetamol.","C":"Recomendações para repouso absoluto e uso de opioides para controle da dor.","D":"Fisioterapia intensiva e uso de corticosteroides injetáveis."},"correta":"B","oficial":{"B":"Correta: Educação do paciente, exercícios físicos, controle do peso e prescrição de paracetamol.","A":"Incorreta: Uso exclusivo de AINEs, sem necessidade de intervenções não farmacológicas.","C":"Incorreta: Recomendações para repouso absoluto e uso de opioides para controle da dor."},"oficial_extra":["A principal hipótese diagnóstica para o caso é a osteoartrite (OA). A dor articular da OA é primariamente relacionada à atividade nos primeiros estágios da doença. A dor surge durante ou imediatamente após o uso da articulação e, em seguida, desaparece de modo gradual. A rigidez da articulação afetada pode ser proeminente, porém a rigidez matinal costuma ser de curta duração (< 30 minutos). A OA é a causa mais comum de dor crônica no joelho em pessoas com > 45 anos de idade.","Educação do paciente, exercícios físicos, controle do peso e prescrição de paracetamol incluem intervenções não farmacológicas essenciais. A prescrição de paracetamol é uma abordagem segura e eficaz para o manejo da dor leve a moderada na osteoartrite.","Embora os AINEs sejam úteis no controle da dor e inflamação, esta alternativa é inadequada porque ignora as importantes intervenções não farmacológicas que são fundamentais no manejo da osteoartrite. O tratamento deve ser multidisciplinar e incluir mudanças no estilo de vida.","O repouso absoluto pode levar à rigidez articular e à perda de função. Além disso, o uso de opioides não é recomendado como primeira linha no tratamento da osteoartrite devido ao risco de dependência e efeitos colaterais.","Incorreta: Fisioterapia intensiva, uso de corticosteroides injetáveis e restrição total de atividades físicas.","Embora a fisioterapia possa ser benéfica, a proposta de \"uso intensivo\" pode não ser necessária ou apropriada em todos os casos. O uso de corticosteroides injetáveis deve ser reservado para situações específicas e não deve ser parte do plano inicial padrão."],"refs":["CHEW, Felix S. Radiologia Esquelética. Editora Manole, 2016. E-book. ISBN 9788520448311. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788520448311/. Acesso em: 02 mar. 2025.","JAMESON, J L.; FAUCI, Anthony S.; KASPER, Dennis L.; et al. Manual de medicina de Harrison. Grupo A, 2021. E-book. ISBN 9786558040040. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786558040040/. Acesso em: 02 mar. 2025.","LOSCALZO, José; FAUCI, Anthony S.; KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21ª ed. Porto Alegre: AMGH, 2024. E-book. pág. 2859. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 24 mar. 2025."],"tema":"Osteoartrite — plano inicial","conceito":"Quarta questão de OA do banco. A hierarquia é sempre: educação + exercício + peso como base, analgesia escalonada por cima, corticoide injetável e cirurgia para quem falha.","alt":{"A":"O erro é 'exclusivo, sem intervenções não farmacológicas' — que são justamente as de maior evidência.","B":"CORRETA. Educação, exercício, controle de peso e analgesia.","C":"Repouso absoluto é contraindicado e opioide não é primeira linha.","D":"Corticoide injetável não é conduta inicial; infiltrações repetidas prejudicam a cartilagem."},"roteiro":[],"takehome":"Qualquer alternativa que comece por opioide, corticoide injetável ou repouso absoluto está errada.","area":"CI · Reumatologia (OA e artrites)"},{"id":61,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":6},{"prova":"CI 3 2025.1","num":3}],"enunciado":["(AFYA PARAÍBA) Uma menina de 5 anos é levada à consulta devido a dor articular há 7 semanas, principalmente nas articulações dos joelhos e tornozelos. Além da dor, a mãe relata que a criança tem febre baixa intermitente e cansaço. Nega outros sintomas. Não há história de trauma, de outras doenças pregressas e de uso de medicamentos.","Ao exame físico, apresenta como alterações leve inchaço nas articulações afetadas e mobilidade limitada, sem sinais de infecção local.","Considerando o quadro clínico, assinale a alternativa que apresenta o diagnóstico mais provável nesse caso."],"alternativas":{"A":"Lúpus eritematoso sistêmico.","B":"Artrite idiopática juvenil.","C":"Leucemia linfoide aguda.","D":"Febre reumática."},"correta":"B","oficial":{"B":"A artrite idiopática juvenil é uma das causas mais comuns de dor articular em crianças, especialmente com sintomas como febre baixa intermitente, artrite oligoarticular (afetando poucas articulações) e cansaço. A AIJ é definida como a artrite que se inicia antes dos 16 anos de idade, com duração maior que 6 semanas, em pelo menos uma articulação. O quadro clínico da criança com dor em múltiplas articulações, associada a febre e sinais inflamatórios nas articulações, é compatível com a AIJ, sendo o diagnóstico mais provável neste caso.","A":"Lúpus Eritematoso Sistêmico (LES) – oligoartrite ou poliartrite aguda ou recorrente na apresentação da doença ocorre em até 70% dos pacientes com LES. O comprometimento articular é geralmente discreto, autolimitado e habitualmente sem deformidade articular. Frequentemente afeta múltiplos sistemas, incluindo pele (rash malar), rins (nefrite lúpica) e sistema hematológico (anemia, leucopenia, plaquetopenia). Sinais e sintomas constitucionais e inespecíficos são frequentes como primeiras manifestações da doença, tais como: febre, anorexia, perda de peso, fadiga, linfadenopatia difusa, hepatomegalia e esplenomegalia. O acometimento cutâneo ocorre em até 80% dos pacientes com LESJ. Não há menção de outros sintomas característicos do LES, tornando esse diagnóstico improvável.","C":"Leucemia Linfoide Aguda (LLA) – pode se manifestar com dor óssea e articular, febre e fadiga, mas geralmente vem acompanhada de outros sinais sistêmicos, como: palidez e fadiga intensa devido à anemia. Hematomas ou petéquias devido à plaquetopenia. Infecções frequentes devido à leucopenia. Hepatoesplenomegalia e linfadenopatia generalizada, que não foram mencionadas no caso. O inchaço articular na leucemia geralmente é secundário à infiltração leucêmica na medula óssea, e não uma verdadeira artrite inflamatória como na AIJ."},"oficial_extra":["Febre Reumática – complicação de infecção por Streptococcus beta-hemolítico do grupo A (geralmente faringite estreptocócica não tratada). A artrite da febre reumática tem caráter migratório. Além disso, a febre reumática geralmente afeta grandes articulações (joelhos, tornozelos, cotovelos), mas também apresenta outros sinais, como cardite, nódulos subcutâneos e eritema marginado, que não foram descritos no caso. A forma clássica é a oligoartrite ou poliartrite migratória (em média 6 articulações), com evolução assimétrica, permanecendo 1-5 dias em cada articulação em um surto total que dura em média 1-3 semanas."],"refs":["PEDIATRIA, Sociedade Brasileira de. Tratado de pediatria. 6ª ed. Barueri: Manole, 2024. E-book. p.v2-804. ISBN 9788520458679. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520458679/. Acesso em: 24 mar. 2025.","Petty, R. E., et al. (2019). Artrite Idiopática Juvenil: Abordagem Diagnóstica e Terapêutica. Pediatria."],"tema":"Artrite idiopática juvenil","conceito":"AIJ = artrite antes dos 16 anos, com duração > 6 semanas, em pelo menos uma articulação. Aqui: 7 semanas de artrite em joelhos e tornozelos, febre baixa e cansaço.","alt":{"A":"LES teria acometimento multissistêmico (rash malar, nefrite, citopenias), ausente aqui.","B":"CORRETA. Duração > 6 semanas, oligoartrite com inchaço e limitação, em criança.","C":"LLA traria palidez, petéquias, hepatoesplenomegalia e alterações no hemograma.","D":"Febre reumática tem artrite MIGRATÓRIA (1–5 dias por articulação) + critérios de Jones (cardite, coreia, eritema marginado)."},"roteiro":[],"takehome":"As 6 semanas de duração são o que define AIJ — é o número que a banca cobra.","area":"CI · Reumatologia (OA e artrites)"},{"id":62,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":7}],"enunciado":["(UNINOVAFAPI) Uma mulher de 55 anos procura atendimento no ambulatório devido a dor articular em ambos os joelhos há 12 meses. Ela refere que a dor piora ao final do dia e após atividades prolongadas, melhorando com o repouso. Relata rigidez matinal com duração de 15 minutos, nega febre ou perda de peso. Alega que realizou diversos tratamentos orientados por ortopedista, sem melhora.","No exame físico, não há sinais inflamatórios evidentes, mas observa-se crepitação à movimentação dos joelhos e discreta redução da amplitude de movimento.","Considerando o caso, quais exames complementares são mais indicados para avaliação do quadro apresentado pela paciente?"],"alternativas":{"A":"Dosagem de ácido úrico e análise do líquido sinovial.","B":"Fator reumatoide e velocidade de hemossedimentação (VHS).","C":"Tomografia computadorizada das articulações acometidas.","D":"Radiografia simples das articulações acometidas."},"correta":"D","oficial":{"B":"Incorreta: Fator reumatoide e velocidade de hemossedimentação (VHS).","D":"Correta: Radiografia simples das articulações acometidas.","A":"Incorreta: Dosagem de ácido úrico e análise do líquido sinovial.","C":"Incorreta: Tomografia computadorizada das articulações acometidas."},"oficial_extra":["A principal hipótese diagnóstica para o caso é a osteoartrite (OA). A OA é a causa mais comum de dor crônica no joelho em pessoas com > 45 anos de idade. A dor articular da OA é primariamente relacionada à atividade nos primeiros estágios da doença. A dor surge durante ou imediatamente após o uso da articulação e, em seguida, desaparece de modo gradual. Nenhum exame de sangue é indicado como rotina na avaliação dos pacientes com OA, a não ser quando os sintomas e sinais sugerirem artropatia inflamatória. Nem as radiografias nem a RM estão indicadas na avaliação da OA. Elas são indicadas para avaliar a possibilidade de OA somente quando a dor articular e os achados físicos forem atípicos para OA ou se a dor persistir após a instituição de um tratamento efetivo para a OA.","LOSCALZO, José; FAUCI, Anthony S. KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21. ed. Porto Alegre: AMGH, 2024. E-book. pág. 2859. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 24 mar. 2025.","Justificativa: Esses exames são indicados quando há suspeita de doenças inflamatórias autoimunes, como a artrite reumatoide. No entanto, a paciente apresenta uma artralgia de padrão mecânico, sem sinais inflamatórios sistêmicos ou sinovite evidente. A artrite reumatoide geralmente se manifesta com rigidez matinal prolongada (> 1 hora), edema articular e piora com o repouso, o que não está presente neste caso. Assim, essa alternativa está incorreta.","Referência:","SMOLEN, J. S.; ALETAHA, D.; McINNES, I. B. Rheumatoid arthritis. The Lancet, v. 388, n. 10055, p. 2023-2038, 2016.","Justificativa: A radiografia simples é o exame de escolha na investigação inicial de doenças articulares degenerativas, pois permite identificar características clássicas da osteoartrite, como redução do espaço articular, osteófitos, esclerose subcondral e cistos ósseos. É um exame de baixo custo, amplamente disponível e suficiente para estabelecer o diagnóstico na maioria dos casos.","Referência: FELSON, D. T. Osteoarthritis: new insights. Part 1: the disease and its risk factors. Annals of Internal Medicine, v. 133, n. 8, p. 635-646, 2000.","Justificativa: A dosagem de ácido úrico pode ser útil na suspeita de gota, uma artrite inflamatória que se manifesta com crises súbitas de dor intensa, geralmente acometendo a primeira articulação metatarsofalângica. A análise do líquido sinovial é indicada quando há suspeita de artrite infecciosa ou inflamatória. No entanto, a paciente apresenta artralgia crônica de padrão mecânico, sem sinais de inflamação, tornando essa alternativa incorreta.","Referência: RIChette, P. et al. 2016 updated EULAR evidence-based recommendations for the management of gout. Annals of the Rheumatic Diseases, v. 76, n. 1, p. 29-42, 2017.","Justificativa: A tomografia computadorizada é um exame útil para avaliação óssea detalhada, especialmente em casos de deformidades complexas ou fraturas. No entanto, não é a melhor opção para a investigação inicial de doenças articulares degenerativas. A radiografia simples é suficiente para o diagnóstico de osteoartrite, sendo mais acessível e menos onerosa.","Referência: GOLDENBERG, D. L. Clinical manifestations and diagnosis of osteoarthritis. UpToDate, 2022. Disponível em: www.uptodate.com. Acesso em: 13 mar. 2025."],"refs":[],"tema":"Osteoartrite — qual exame pedir","conceito":"Padrão mecânico clássico com crepitação. Não há indicação de exames laboratoriais de rotina na OA; a radiografia simples é o método de imagem padrão.","alt":{"A":"Ácido úrico e líquido sinovial investigam gota/artrite séptica — não há sinais inflamatórios.","B":"FR e VHS investigam artropatia inflamatória; seriam normais aqui e podem gerar falso-positivo.","C":"TC não acrescenta na OA e expõe a radiação desnecessária.","D":"CORRETA. Radiografia simples: redução do espaço articular, osteófitos, esclerose subcondral e geodos."},"roteiro":[],"takehome":"Na OA, exame de sangue só se o quadro sugerir doença inflamatória.","area":"CI · Reumatologia (OA e artrites)"},{"id":63,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":8},{"prova":"CI 3 2025.1","num":11}],"enunciado":["(IESVAP) Mulher de 75 anos, funcionária pública aposentada, comparece ao ambulatório de Geriatria, acompanhada da filha. A filha relata que, nos últimos 18 meses, a paciente tem apresentado episódios de esquecimento frequente de eventos recentes, dificuldade em encontrar palavras para se expressar e repetição de perguntas já respondidas. A paciente também tem apresentado dificuldades em realizar tarefas domésticas que antes eram rotineiras, como cozinhar e organizar a casa. Negam alterações do humor.","O exame físico não mostrou alterações neurológicas focais.","Mini Exame do Estado Mental (MEEM): 22/30 (valor de referência para a escolaridade: 26).","Realizou exames laboratoriais, incluindo hemograma, eletrólitos, função tireoidiana e vitamina B12, sem alterações. Ressonância magnética de crânio com atrofia hipocampal bilateral, além de atrofia encefálica difusa.","Qual é o tratamento mais adequado para essa paciente?"],"alternativas":{"A":"Iniciar tratamento com amantadina, um antagonista do receptor NMDA com efeito dopaminérgico.","B":"Orientar paciente e família sobre a importância de manter atividades físicas e mentais regulares.","C":"Iniciar tratamento com donepezila, um inibidor da acetilcolinesterase.","D":"Iniciar tratamento com antidepressivo, preferencialmente inibidor da recaptação de serotonina."},"correta":"C","oficial":{"C":"Correta: Iniciar tratamento com donepezila, um inibidor da acetilcolinesterase.","D":"Incorreta: Iniciar tratamento com antidepressivo, preferencialmente inibidor da recaptação de serotonina.","A":"Incorreta: Iniciar tratamento com amantadina, um antagonista do receptor NMDA com efeito dopaminérgico.","B":"Incorreta: Orientar paciente e família sobre a importância de manter atividades físicas e mentais regulares."},"oficial_extra":["A paciente apresenta sintomas de demência, sendo a doença de Alzheimer o diagnóstico mais provável para o caso. A donepezila é um inibidor da acetilcolinesterase, um medicamento de primeira linha, que pode ajudar a melhorar os sintomas cognitivos.","Embora a depressão possa causar sintomas semelhantes à demência, o quadro clínico da paciente e os exames complementares sugerem demência de Alzheimer. O tratamento com antidepressivo não é indicado primariamente nessa situação.","A amantadina não é indicada para o tratamento da demência de Alzheimer.","Embora as atividades físicas e mentais sejam importantes para a saúde cognitiva, a paciente apresenta sintomas de demência que necessitam de tratamento medicamentoso."],"refs":["LOSCALZO, Joseph; FAUCI, Anthony S.; KASPER, Dennis L.; et al. Medicina Interna de Harrison. 21. ed. Porto Alegre: AMGH, 2024. E-book. p. 3370. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 10 abr. 2025.","GREENBERG, David A.; AMINOFF, Michael J.; SIMON, Roger P. Neurologia clínica. 8. ed. Porto Alegre: ArtMed, 2014. E-book. p. Capa. ISBN 9788580553550. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788580553550/. Acesso em: 10 abr. 2025."],"tema":"Doença de Alzheimer — tratamento","conceito":"Aqui há demência estabelecida: 18 meses de declínio, perda de atividades instrumentais, MEEM 22 (corte 26 para a escolaridade), causas reversíveis excluídas e atrofia hipocampal bilateral na RM.","alt":{"A":"Amantadina é antiparkinsoniano/antiviral, sem papel na DA.","B":"Atividade física e mental é importante, mas não substitui o tratamento farmacológico numa demência já instalada.","C":"CORRETA. Donepezila, inibidor da acetilcolinesterase, primeira linha na DA leve a moderada.","D":"Não há alteração de humor; a depressão foi afastada no enunciado."},"roteiro":[],"takehome":"Investigação de demência sempre inclui TSH, B12, eletrólitos e neuroimagem antes de tratar.","area":"CI · Demências e parkinsonismo"},{"id":64,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":9}],"enunciado":["(UNIDEP) Recém-nascido com 72h de vida, sexo feminino, é trazido pelos pais à Unidade Básica de Saúde devido ao quadro de icterícia de início há aproximadamente 12 horas. Mãe G2P2A0, relata gestação sem intercorrências, criança nascida com 38 semanas e 3 dias, pesando 2980g. Tipo sanguíneo da mãe: A+ e da criança: A+. Recebe leite materno exclusivo, perda de peso de 4%. Relatam que a criança nasceu bem e recebeu alta após 48h da maternidade. Mãe nega alterações nas fezes e urina.","No exame físico, é possível observar a criança ativa e responsiva, eupneica, normocorada e afebril. Presença de icterícia em cabeça e pescoço. Abdômen indolor à palpação, sem visceromegalias.","A partir dessas informações, responda:","1. Qual é o diagnóstico sindrômico mais provável? (1,0) 2. A partir das definições de Kramer, em qual zona esse paciente se encontra? (0,5) 3. Qual deve ser a conduta mais apropriada no momento? (1,0)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. O diagnóstico mais provável, a partir da descrição do caso, é a icterícia neonatal fisiológica.","A hiperbilirrubinemia indireta é denominada fisiológica nos RN a termo quando a manifestação clínica ocorre após 24 horas de vida, atingindo concentração de bilirrubina sérica em torno de 12mg/dL de BT, entre o terceiro e o quarto dias de vida.","2. O paciente encontra-se na Zona 1.","A icterícia por hiperbilirrubinemia indireta apresenta progressão céfalo-caudal. Classicamente em RN termo, a constatação de icterícia na face (zona 1) está associada a valores de BI que variam de 4 a 8 mg/dL. Enquanto isso, a presença de icterícia da face até o umbigo (zona 2) corresponde a valores de 5 a 12 mg/dL, podendo alcançar os joelhos (zona 3) com níveis de BI superior a 15 mg/dL.","3. A conduta mais apropriada para o momento
