é a observação clínica, deve ser orientada a amamentação e retorno no 5º dia de vida ou em 48 horas para reavaliação.","Como a recomendação da alta hospitalar dos RN com idade gestacional ≥35 semanas no Brasil ocorre antes do pico da icterícia no termo (3º e 4º dias de vida) e no pré-termo tardio (5º e 6º dias de vida), o acompanhamento ambulatorial da evolução da icterícia se faz necessário. O pediatra deve realizar a primeira consulta após a saída da maternidade, no máximo, até o 5º dia de vida, para avaliar as condições de amamentação, além da icterícia e outras possíveis intercorrências."],"refs":["JÚNIOR, Dioclécio C.; BURNS, Dennis Alexander R.; LOPEZ, Fábio A. Tratado de pediatria. v.1. Editora Manole, 2021. E-book. ISBN 9786555767476. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786555767476/. Acesso em: 10 abr. 2025.","Sociedade Brasileira de Pediatria. Hiperbilirrubinemia indireta no período neonatal. Nº 10, 29 set. 2021."],"tema":"Icterícia neonatal fisiológica","conceito":"Fisiológica: aparece APÓS 24 h, pico entre o 3º e 4º dia no termo (5º–6º no pré-termo tardio), BI em torno de 12 mg/dL, sem hemólise. Aqui mãe e RN A+ (sem incompatibilidade), boa amamentação, perda de peso de apenas 4%.","alt":{},"roteiro":["1) Icterícia neonatal fisiológica (hiperbilirrubinemia indireta).","2) Zona 1 de Kramer — icterícia limitada a cabeça e pescoço (BI ~4–8 mg/dL). A progressão é céfalo-caudal.","3) Observação clínica, reforço da amamentação e retorno em 48 h ou até o 5º dia de vida.","Justificativa: a alta no Brasil ocorre antes do pico da icterícia, então a primeira consulta pós-maternidade deve acontecer até o 5º dia.","Sinais de alarme para orientar aos pais: icterícia progredindo para abdome e membros, recusa alimentar, letargia, fezes claras ou urina escura (colestase)."],"takehome":"Icterícia que começa antes de 24 h, ou com BD elevada, nunca é fisiológica.","area":"CI · Icterícia neonatal"},{"id":65,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":10},{"prova":"CI 3 2025.1","num":2}],"enunciado":["(FASA VIC) Paciente do sexo masculino, 15 anos, procura atendimento ambulatorial com queixa de obsessões e compulsões que têm prejudicado significativamente seu desempenho escolar e social. O paciente relata pensamentos intrusivos constantes, relacionados à contaminação por germes, o que o leva a realizar repetidas lavagens de mãos, chegando a gastar mais de uma hora por dia nesse comportamento. Além disso, ele se sente angustiado quando não consegue realizar essas práticas, e as suas atividades diárias estão sendo afetadas. O paciente não apresenta comorbidades e não tem histórico de uso de medicamentos nem drogas.","Diante do quadro clínico, você resolve iniciar, além da terapia, um tratamento farmacológico de primeira linha. Selecione esse medicamento."],"alternativas":{"A":"Clomipramina.","B":"Risperidona.","C":"Diazepam.","D":"Sertralina."},"correta":"D","oficial":{},"oficial_extra":["Trata-se de um caso de Transtorno Obsessivo-Compulsivo (TOC): caracterizado pela presença de obsessões ou compulsões que interferem negativamente na vida das pessoas acometidas e da família. Obsessões são pensamentos intrusivos e não desejados, que fogem ao controle do indivíduo. Compulsões são comportamentos repetitivos que os pacientes se sentem compelidos a realizar, para aliviar um estado de ansiedade crescente, muitas vezes motivado pelos pensamentos obsessivos. Os sintomas obsessivos e os rituais podem consumir um tempo considerável do dia, interferir nas atividades acadêmicas e no convívio com a família e os amigos e gerar sofrimento substancial. É muito comum a demora na identificação do quadro, porque muitas crianças e adolescentes acometidos escondem seus sintomas por vergonha.","Em casos moderados a graves, recomenda-se encaminhamento para um especialista em saúde mental para início do tratamento medicamentoso, que sempre deve estar combinado à intervenção psicológica. Os inibidores seletivos de recaptação da serotonina são os fármacos de primeira linha, mas suas ações se iniciam depois de 2 a 3 semanas de uso. Nos casos graves, em crianças mais velhas e adolescentes, pode ser indicada a associação com benzodiazepínicos num primeiro momento, pelo seu efeito imediato, programando-se a retirada gradual da medicação com a melhora do quadro, em vista do seu potencial em causar dependência.","Alternativa correta: Sertralina.","Justificativa: A sertralina é um ISRS com eficácia comprovada no tratamento de TOC e é considerada uma das melhores opções de tratamento para paciente adolescente. Ela tem um perfil de segurança bem estabelecido e, geralmente, apresenta menos efeitos colaterais, tornando-se uma boa escolha inicial para adolescentes com esse diagnóstico, além de ser um medicamento de primeira linha, como sugere no enunciado.","Análise das alternativas incorretas:","Diazepam – Incorreta. Justificativa: O diazepam é um benzodiazepínico utilizado para tratar ansiedade aguda e insônia, mas não possui eficácia comprovada no tratamento do TOC. Além disso, benzodiazepínicos apresentam risco de dependência e não atuam na neurobiologia do transtorno.","Clomipramina – Incorreta. Justificativa: Embora a clomipramina seja eficaz no tratamento do TOC, pertence à classe dos antidepressivos tricíclicos (ATC), que apresentam maior risco de efeitos adversos, como sedação, boca seca, ganho de peso e cardiotoxicidade. Por esse motivo, os ISRS são a primeira escolha, sendo a clomipramina reservada para casos refratários.","Risperidona – Incorreta Justificativa: A risperidona é um antipsicótico atípico, utilizado para transtornos psicóticos e, em alguns casos, para TOC resistente, associada a um ISRS. No entanto, não é indicada como tratamento inicial para o TOC, sendo reservada para quadros graves e refratários."],"refs":["LOSCALZO, Joseph; FAUCI, Anthony S. KASPER, Dennis L.; et al. Medicina Interna de Harrison. 21ª ed. Porto Alegre: AMGH, 2024. E-book. p. ii. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 10 abr. 2025.","PEDIATRIA, Sociedade Brasileira de. Tratado de pediatria. 6ª ed. Barueri: Manole, 2024. E-book. p.v2-1110. ISBN 9788520458679. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520458679/. Acesso em: 10 abr. 2025."],"tema":"TOC — escolha do fármaco","conceito":"Primeira linha farmacológica no TOC é ISRS. Clomipramina (tricíclico) tem eficácia comparável, mas fica em segunda linha pelos efeitos anticolinérgicos e cardiotóxicos.","alt":{"A":"Clomipramina é eficaz, mas não é a primeira escolha — sobretudo em adolescente.","B":"Risperidona é potencialização em casos refratários, não monoterapia inicial.","C":"Benzodiazepínico não trata TOC e gera dependência.","D":"CORRETA. Sertralina — ISRS aprovado em adolescentes, em doses maiores que na depressão."},"roteiro":[],"takehome":"TOC = ISRS + TCC. Clomipramina e antipsicótico ficam para depois.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":66,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":11}],"enunciado":["(UNIFIPMOC) No ambulatório de psiquiatria de um Centro de Especialidades Médicas:","Dr. Felipe: Boa tarde, Maria. A Dra. Renata, sua médica da ESF, me passou seu caso. Como tem se sentido ultimamente?","Maria: Olá, doutor. Tem sido difícil, meu humor anda com uns altos e baixos muito intensos.","Dr. Felipe: Altos e baixos... poderia explicar melhor sobre isso?","Maria: ahh... tem fases que estou com muita energia, bem “elétrica”, quase sem dormir. Nesses momentos, eu me acho uma verdadeira diva e compro tudo o que quero, acabo estourando o crédito do meu cartão. Nesses dias, eu me sinto muito atraente e tenho muitos relacionamentos sexuais com pessoas que nem conheço. Mas depois vem um período horrível de muito desânimo, não tenho vontade de fazer nada, nada me dá prazer. Sinto uma fadiga extrema e durmo quase o dia todo.","Dr. Felipe: Quanto tempo duram esses períodos?","Maria: Uma ou duas semanas quando estou cheia de energia. Agora as fases de desânimo são mais longas.","Dr. Felipe: Além disso que me contou, sente algo mais fora desses períodos? Alguma instabilidade emocional?","Maria: Sim, eu me sinto com os nervos à flor da pele, muito instável na realidade, achando que vou ficar sozinha.","Dr. Felipe: Maria, agradeço por ser tão aberta comigo. É importante ressaltar que você não está sozinha. Pelo que você descreveu, tenho algumas ideias do que possa estar acontecendo contigo e vamos iniciar seu tratamento, tudo bem?","Maria: Tudo bem, doutor.","De acordo com a situação apresentada, selecione o diagnóstico mais provável da paciente."],"alternativas":{"A":"Transtorno Afetivo Bipolar.","B":"Transtorno de Personalidade Borderline.","C":"Transtorno de Ansiedade Generalizada.","D":"Transtorno Depressivo Recorrente."},"correta":"A","oficial":{"B":"Alternativa: Transtorno de Personalidade Borderline (TPB) é incorreta.","C":"Alternativa: Transtorno de Ansiedade Generalizada (TAG) é incorreta."},"oficial_extra":["Alternativa: Transtorno Bipolar é correto.","Episódio Maníaco/Hipomaníaco: Maria relata fases de \"muita energia, bem 'elétrica', quase sem dormir\", onde se sente uma \"verdadeira Diva\", compra tudo o que quer","(estourando o crédito do cartão) e tem múltiplos relacionamentos sexuais com desconhecidos. Esses comportamentos sugerem um período de humor elevado e aumento da atividade, com comportamentos de risco e autoestima inflada, característicos de mania ou hipomania. Episódio Depressivo: Maria também descreve \"um período horrível de muito desânimo\", falta de vontade de fazer qualquer coisa, anedonia (nada lhe dá prazer), fadiga extrema e sono excessivo. Esses sintomas são consistentes com um episódio depressivo maior.","Comentário: A alternância entre episódios de mania/hipomania e depressão maior é a marca registrada do Transtorno Bipolar Tipo. Os critérios diagnósticos exigem pelo menos um episódio maníaco para o diagnóstico, o que se encaixa na descrição de Maria.","Instabilidade Emocional: Maria relata sentir-se com \"nervos à flor da pele\" e ter relacionamentos instáveis. Medo de Abandono: Ela menciona \"medo de ficar sozinha\".","Comentário: Embora Maria apresente alguns sintomas característicos do TPB (instabilidade emocional e medo de abandono), a descrição dos episódios distintos de mania/hipomania e depressão maior aponta mais fortemente para o Transtorno Bipolar.","Alternativa: Depressão Maior Recorrente é incorreta.","Episódio Depressivo: Maria descreve um período de desânimo, falta de prazer, fadiga e sono excessivo, o que é compatível com um episódio depressivo maior.","Comentário: A Depressão Maior Recorrente se caracteriza por episódios depressivos sem histórico de mania ou hipomania. A presença dos episódios maníacos/hipomaníacos relatados por Maria exclui este diagnóstico.","O TAG se caracteriza por ansiedade e preocupação excessivas e persistentes sobre diversos eventos ou atividades. Embora Maria mencione sentir-se com \"nervos à flor da pele\", não há informações suficientes para determinar se ela tem ansiedade generalizada que se encaixe nos critérios do TAG. Além disso, o TAG não explica os episódios de mania/hipomania e depressão maior.","Conclusão:","Considerando os sintomas descritos por Maria e os critérios diagnósticos do DSM-V, o diagnóstico mais provável é: Transtorno Bipolar (Tipo I)."],"refs":["SADOCK, Benjamin J.; SADOCK, Virginia A.; RUIZ, Pedro. Compêndio de psiquiatria. 11ª ed. Porto Alegre: ArtMed, 2017. E-book. p. 365. ISBN 9788582713792. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788582713792/. Acesso em: 10 abr. 2025.","LOSCALZO, José; FAUCI, Anthony S. KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21. ed. Porto Alegre: AMGH, 2024. E-book. pág. 3541. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 10 abr. 2025."],"tema":"Transtorno bipolar (caso em diálogo)","conceito":"Fases de 1–2 semanas com energia alta, sono reduzido, grandiosidade, gastos impulsivos e desinibição sexual, alternando com depressão prolongada. Duração e alteração de energia/sono definem o episódio.","alt":{"A":"CORRETA. Episódios sustentados de humor elevado + episódios depressivos = transtorno bipolar.","B":"No borderline a instabilidade é reativa e dura horas; a instabilidade relatada aqui é um traço associado, não o quadro principal.","C":"TAG é preocupação crônica, sem episódios de humor elevado.","D":"Depressivo recorrente exigiria ausência de qualquer episódio de elevação do humor."},"roteiro":[],"takehome":"Duração é o critério: horas = borderline; semanas com sono e energia alterados = bipolar.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":67,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":12},{"prova":"CI 3 2025.1","num":4}],"enunciado":["(UNIREDENTOR) Gestante de 32 anos, com 13 semanas de idade gestacional, dá entrada na maternidade queixando-se de febre, cólicas fortes e sangramento vaginal. Não iniciou pré-natal e relata tentativa de aborto clandestino há 2 dias.","No exame físico, encontra-se febril, com FC 125 bpm e PA 90/60 mmHg. Ao exame especular, visualiza-se colo uterino entreaberto, sangramento vaginal, leucorreia purulenta e laceração cervical.","Baseado no caso acima, responda:","1. Qual é o diagnóstico? (0,5) 2. Qual é a melhor conduta? (2,0)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. Abortamento infectado. (0,5)","O abortamento infectado, principalmente em países em que a lei proíbe a interrupção da gestação, muitas vezes encontra-se intimamente ligado à ilegalidade, sendo sua prática realizada em condições inadequadas. O quadro clínico depende do grau de comprometimento da paciente. Nos casos de endomiometrite, geralmente se observam hipertermia, sangramento vaginal discreto (que pode ser acompanhado de saída de material purulento oriundo do canal cervical), dores abdominais em cólica e útero doloroso à palpação. No toque vaginal, o colo uterino apresenta-se geralmente pérvio e doloroso à mobilização. No exame especular, observa-se saída de material purulento proveniente do canal cervical e podem estar presentes lacerações cervicais denunciadoras de abortamento provocado de forma clandestina. Nos casos mais graves, a paciente pode apresentar peritonite generalizada, sepse, insuficiência renal e coagulopatia.","2. A conduta correta inclui:","1. Estabilização clínica. (0,5) 2. Antibioticoterapia empírica. (0,5) 3. Solicitação de ultrassonografia. (0,5) 4. Correção cirúrgica da laceração (tratamento cirúrgico). (0,5)","O tratamento é clínico e cirúrgico e consiste, principalmente, em tratar a hipovolemia, combater a infecção e reparar cirurgicamente as lesões e lacerações decorrentes do método utilizado para o abortamento.","A antibioticoterapia deve ser abrangente, uma vez que na maioria das vezes a infecção é polimicrobiana, com bactérias aeróbias e anaeróbias provenientes das floras intestinal e genital. As combinações mais comumente utilizadas são clindamicina em associação com gentamicina ou ampicilina/sulbactam.","O tratamento cirúrgico está indicado nas seguintes condições: demonstração de restos ovulares pela ultrassonografia impõe a necessidade de esvaziamento uterino por meio de curetagem ou aspiração manual intrauterina. Nos casos de laceração cervical, pratica-se a sutura do colo uterino e faz-se revisão dos fórnices e das paredes vaginais."],"refs":["ZUGAIB, Marcelo e FRANCISCO, Rossana Pulcineli Vieira. Zugaib, obstetrícia. Barueri, SP: Manole. Acesso em: 15 fev. 2025.","REZENDE FILHO, Jorge de. Obstetrícia. 13. ed. Rio de Janeiro: Guanabara Koogan, 2014. Tratado de Ginecologia FEBRASGO / editores Cesar Eduardo Fernandes, Marcos Felipe Silva de Sá; coordenação Agnaldo Lopes da Silva Filho..[et al]. — 1ª ed. — Rio de Janeiro: Elsevier, 2019.","Federação Brasileira das Associações de Ginecologia e Obstetrícia (FEBRASGO). Aborto: classificação, diagnóstico e conduta. São Paulo: FEBRASGO; 2021. (Protocolo FEBRASGO - Obstetrícia, n° 1/ Comissão Nacional Especializada em Assistência ao Abortamento, Parto e Puerpério)."],"tema":"Abortamento infectado","conceito":"Febre + sangramento + leucorreia purulenta + colo entreaberto + laceração cervical após manipulação = abortamento infectado, geralmente polimicrobiano (aeróbios e anaeróbios da flora intestinal e genital).","alt":{},"roteiro":["1) Abortamento infectado (com sinais de resposta sistêmica: FC 125, PA 90/60).","2) Estabilização clínica: dois acessos calibrosos, cristaloide, monitorização, exames (hemograma, função renal, coagulograma, culturas), profilaxia antitetânica.","Antibioticoterapia empírica de amplo espectro: clindamicina + gentamicina, ou ampicilina/sulbactam.","Ultrassonografia para avaliar restos ovulares.","Esvaziamento uterino (AMIU ou curetagem) — não adie esperando o antibiótico agir, pois o foco é intrauterino.","Correção cirúrgica da laceração cervical, com revisão de fórnices e paredes vaginais. Anti-D se Rh negativo.","Atenção para complicações: sepse, peritonite, insuficiência renal, coagulopatia."],"takehome":"No abortamento infectado, antibiótico sozinho não resolve: o esvaziamento uterino é parte do tratamento.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":68,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":13},{"prova":"CI 3 2025.1","num":13}],"enunciado":["(IESVAP) Homem, 80 anos, professor universitário aposentado, comparece ao ambulatório de clínica médica acompanhado de sua esposa por queixa de comprometimento de memória há 6 meses. O paciente refere que tem apresentado episódios de esquecimento de compromissos marcados, dificuldade em lembrar nomes de conhecidos e onde guardou objetos. No entanto, o paciente continua realizando suas atividades diárias de forma independente, como leitura de livros e jornais, acompanhamento de notícias e participação em grupos de discussão online. Ele também mantém sua rotina de exercícios físicos e atividades sociais. As queixas do paciente, embora sutis, também já foram percebidas pela esposa.","O exame físico não identificou sinais neurológicos focais, também não havia sinais de parkinsonismo. Mini Exame do Estado Mental (MEEM): 24/30 (Valor de referência para escolaridade 26).","Trouxe exames laboratoriais constando hemograma, eletrólitos, função tireoidiana e vitamina B12 normais. Tomografia computadorizada de crânio com leve atrofia de parênquima cerebral difusa, sem preferência lobar, compatível com a idade.","Diante do caso clínico, assinale a alternativa correta."],"alternativas":{"A":"As queixas do paciente, a duração dos sintomas, a presença de fatores de risco direcionam para o diagnóstico diferencial de um quadro confusional agudo (delirium).","B":"O fato de as queixas cognitivas serem sutis e não interferirem na autonomia para realização de suas atividades habituais direciona para o diagnóstico de doença de Alzheimer em fase inicial.","C":"A ausência de atrofia encefálica do lobo temporal medial (sobretudo atrofia hipocampal) descarta o diagnóstico de doença de Alzheimer.","D":"O quadro clínico apresentado com sintomas de perda de memória, associado à pontuação alterada no MEEM, aponta como diagnóstico provável o comprometimento cognitivo leve."},"correta":"D","oficial":{"D":"Correta: O quadro clínico apresentado com sintomas de perda de memória, associado à pontuação normal no MEEM, aponta como diagnóstico provável o comprometimento cognitivo leve.","B":"Incorreta: O fato de as queixas cognitivas serem sutis e não interferirem na autonomia para realização de suas atividades habituais direciona para o diagnóstico de doença de Alzheimer em fase inicial.","A":"Incorreta: As queixas do paciente, a duração dos sintomas, a presença de fatores de risco direcionam para o diagnóstico diferencial de um quadro confusional agudo (delirium).","C":"Incorreta: A ausência de atrofia encefálica do lobo temporal medial (sobretudo atrofia hipocampal) descarta o diagnóstico de doença de Alzheimer."},"oficial_extra":["O paciente mantém suas atividades diárias independentes, o que é característico do comprometimento cognitivo leve. Quando a perda de memória se torna mais evidente para o paciente, familiares e amigos e é confirmada com testes de memória padronizados, é aplicado o termo comprometimento cognitivo leve (CCL).","O fato de o paciente manter sua autonomia nas atividades diárias torna a doença de Alzheimer (DA) em fase inicial menos provável. Na DA, os problemas cognitivos começam a interferir nas atividades diárias, como cuidar das finanças, seguir instruções de trabalho, dirigir, fazer compras e cuidar da casa. Alguns pacientes não percebem essas dificuldades (anosognosia), mas a maioria permanece muito preocupada com seus déficits. Alterações no ambiente (viagens, mudanças, hospitalização) tendem a desestabilizar o paciente. Com o tempo, os pacientes se perdem em caminhadas ou dirigindo. O traquejo social, os comportamentos de rotina e a conversação superficial podem ser surpreendentemente normais, mesmo nos estágios tardios da doença.","O paciente apresenta sintomas crônicos, sem sinais de confusão aguda, o que descarta o delirium. O delirium tem várias manifestações clínicas, mas é definido como declínio relativamente agudo da cognição, que flutua ao longo de horas ou dias. Sua principal característica é o déficit de atenção, embora todos os domínios cognitivos – como a memória, a função executiva, as habilidades visuoespaciais e a linguagem – se mostrem comprometidos de alguma forma. Os sintomas associados que podem estar presentes em alguns casos incluem alterações do ciclo sono-vigília, perturbações da percepção, como alucinações ou delírios, alterações afetivas e achados autonômicos, que incluem instabilidade da frequência cardíaca e da pressão arterial.","A ausência de atrofia hipocampal não descarta a doença de Alzheimer, especialmente em fases iniciais. Os exames de neuroimagem (TC e RM) não mostram um padrão único específico de DA e podem ser normais no início da doença."],"refs":["LOSCALZO, José; FAUCI, Anthony S.; KASPER, Dennis L.; e outros. Medicina Interna de Harrison. 21ª ed. Porto Alegre: AMGH, 2024. E-book. pág. 3540. ISBN 9786558040231. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786558040231/. Acesso em: 10 abr. 2025.","GREENBERG, David A.; AMINOFF, Michael J.; SIMON, Roger P. Neurologia clínica. 8. ed. Porto Alegre: ArtMed, 2014. E-book. p. Capa. ISBN 9788580553550. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788580553550/. Acesso em: 10 abr. 2025."],"tema":"Comprometimento cognitivo leve","conceito":"Mesma lógica da questão 47: déficit objetivo (MEEM 24, corte 26) com autonomia preservada. Note que a alternativa correta tem um erro de digitação da banca ('pontuação normal'), mas é a única com a conclusão certa.","alt":{"A":"Delirium é agudo e flutuante, com alteração do nível de consciência e da atenção — o quadro aqui é de 6 meses, insidioso.","B":"Contradição interna: se NÃO interfere na autonomia, não pode ser demência/Alzheimer.","C":"Ausência de atrofia hipocampal NÃO descarta Alzheimer — a neuroimagem apoia, mas o diagnóstico é clínico.","D":"CORRETA. Déficit cognitivo objetivo sem prejuízo funcional = CCL."},"roteiro":[],"takehome":"Neuroimagem normal não exclui Alzheimer, assim como atrofia não o confirma.","area":"CI · Demências e parkinsonismo"},{"id":69,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":14},{"prova":"CI 3 2025.1","num":1}],"enunciado":["(FIP GUANAMBI) Paciente de 32 anos, G2P1A0, com 10 semanas de gestação pela DUM, comparece à Maternidade com queixa de sangramento vaginal moderado há 01 hora, acompanhado de dor abdominal em cólica de forte intensidade.","Ao exame físico, apresenta-se afebril, com PA de 120/80 mmHg e FC de 92 bpm. No exame especular, observa-se sangramento ativo proveniente do canal cervical. O orifício interno do colo uterino encontra-se dilatado no exame de toque vaginal.","Qual é a hipótese diagnóstica mais provável para essa paciente?"],"alternativas":{"A":"Abortamento completo.","B":"Ameaça de abortamento.","C":"Abortamento em curso.","D":"Abortamento infectado."},"correta":"C","oficial":{"B":"Incorreta: A ameaça de abortamento é uma complicação frequente e ocorre em 15 a 20% das gestações clinicamente diagnosticadas. O quadro clínico caracteriza-se por sangramento vaginal em pequena quantidade, acompanhado ou não de dor em cólica na região hipogástrica. No exame ginecológico, o colo uterino encontra-se fechado e o tamanho do útero é compatível com o atraso menstrual.","A":"Incorreta: Quando o abortamento completo ocorre no primeiro trimestre da gravidez, principalmente nas 10 semanas iniciais, é comum a expulsão completa dos produtos da concepção. Rapidamente, o útero se contrai e o sangramento, juntamente com as cólicas, diminui de intensidade. O orifício interno do colo uterino tende a fechar-se em poucas horas.","C":"Correta: O abortamento em curso é caracterizado clinicamente por sangramento moderado ou intenso, acompanhado de dor abdominal em cólica, geralmente de forte intensidade. No exame físico, dependendo da intensidade da hemorragia, pode-se evidenciar anemia, taquicardia e hipotensão arterial. No exame especular, observa-se sangramento ativo proveniente do canal cervical, geralmente com presença de restos dos produtos da concepção. O orifício interno do colo uterino encontra-se dilatado no exame de toque vaginal.","D":"Incorreta: O abortamento infectado, principalmente em países em que a lei proíbe a interrupção da gestação, muitas vezes encontra-se intimamente ligado à ilegalidade, sendo sua prática realizada em condições inadequadas. O quadro clínico depende do grau de comprometimento da paciente. Nos casos de endomiometrite, geralmente se observam hipertermia, sangramento vaginal discreto (que pode ser acompanhado de saída de material purulento oriundo do canal cervical), dores abdominais em cólica e útero doloroso à palpação. No toque vaginal, o colo uterino apresenta-se geralmente pérvio e doloroso à mobilização. No exame especular, observa-se saída de material purulento proveniente do canal cervical e podem estar presentes lacerações cervicais denunciadoras de abortamento provocado de forma clandestina. Nos casos mais graves, a paciente pode apresentar peritonite generalizada, sepse, insuficiência renal e coagulopatia."},"oficial_extra":["Referência:","ZUGAIB, Marcelo. Zugaib, obstetrícia. 5ª ed. Barueri: Manole, 2023. E-book. pág. 576. ISBN 9786555769340. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786555769340/. Acesso em: 10 abr. 2025."],"refs":[],"tema":"Abortamento em curso","conceito":"Classificação pelo colo e pelo conteúdo: fechado = ameaça, retido, completo; ABERTO = em curso, incompleto, infectado. Aqui: sangramento moderado, cólica forte, orifício interno DILATADO.","alt":{"A":"No completo o útero já se contraiu, o sangramento e a cólica diminuíram e o colo tende a fechar.","B":"Ameaça tem sangramento pequeno e colo FECHADO.","C":"CORRETA. Abortamento em curso (inevitável): colo dilatado com sangramento ativo e cólica intensa.","D":"Infectado teria febre, leucorreia purulenta e útero doloroso à mobilização."},"roteiro":[],"takehome":"O toque que encontra o orifício interno dilatado fecha o diagnóstico — a partir daí a gestação é inviável.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":70,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1 (irreg.)","num":15},{"prova":"CI 3 2025.1","num":15}],"enunciado":["(ITPAC PORTO NACIONAL) RN com IG de 37 semanas de vida, sexo masculino, nascido de parto cesárea por diabetes mellitus gestacional, com 54 horas de vida, com tipagem sanguínea “O negativo”, em aleitamento materno exclusivo, pega adequada e ganho de peso, eliminações fisiológicas. Não há histórico de icterícia entre os irmãos.","Ao ser avaliado para alta hospitalar, foi observada icterícia em zona III de Kramer, sendo coletadas neste momento as bilirrubinas totais e frações com o seguinte resultado: BT 15,5 mg/dl, BI 14,9 mg/dl.","Analisando o risco pelo normograma de Buthani, qual é a conduta médica?"],"alternativas":{"A":"Alta hospitalar com retorno em 48h para reavaliação do quadro de icterícia do recém-nascido.","B":"Adiar alta hospitalar e repetir dosagem de bilirrubinas total e frações em 24 horas.","C":"Adiar a alta hospitalar, observar até o 5º dia de vida, quando ocorre o pico de hiperbilirrubinemia.","D":"Adiar a alta hospitalar e iniciar fototerapia, mantendo a criança no alojamento conjunto."},"correta":"D","oficial":{"D":"Alternativa correta: Adiar a alta hospitalar e iniciar fototerapia, mantendo a criança no alojamento conjunto."},"oficial_extra":["Alternativa incorreta: Alta hospitalar com retorno em 48h para reavaliação.","A alta hospitalar só é indicada para recém-nascidos com bilirrubina dentro de faixas de baixo risco ou risco intermediário-baixo, o que não é o caso. Essa alternativa seria correta para um RN com bilirrubina total inferior a 12 mg/dL neste período de vida. Como o valor de BT está elevado e o RN tem um fator de risco associado (DMG materno), a alta sem intervenção não é segura.","Alternativa incorreta: Adiar a alta hospitalar, observar até o quinto dia de vida, quando ocorre o pico de hiperbilirrubinemia.","O pico fisiológico da bilirrubina ocorre entre 3 e 5 dias de vida, mas um RN com níveis já elevados no segundo dia não deve ficar apenas em observação. Isso atrasaria uma intervenção necessária e poderia levar à progressão da icterícia para níveis neurotóxicos. O correto é iniciar o tratamento imediatamente para evitar complicações como o kernicterus.","Segundo as diretrizes da Sociedade Brasileira de Pediatria (SBP) e o nomograma de Bhutani, um RN com 37 semanas de IG e bilirrubina total de 15,5 mg/dL com 54 horas de vida se enquadra na faixa de necessidade de fototerapia.","Critérios que justificam a fototerapia: idade gestacional de 37 semanas. BT de 15,5 mg/dL está na zona de alto risco. Zona III de Kramer, indicando icterícia já atingindo abdome inferior. DMG materno é um fator de risco, pois pode levar à policitemia e maior produção de bilirrubina.","Portanto, a fototerapia deve ser iniciada imediatamente, tornando essa alternativa correta.","Alternativa incorreta: Adiar alta hospitalar e repetir dosagem de bilirrubinas em 24 horas.","O adiamento da alta sem iniciar a fototerapia não é uma conduta adequada, pois a bilirrubina já se encontra em nível elevado para a idade e faixa de risco. Essa conduta seria adequada se o nível de bilirrubina estivesse próximo ao limite para fototerapia, mas aqui já está indicado o tratamento imediato."],"refs":["Sociedade Brasileira de Pediatria (SBP) – Documento científico - Hiperbilirrubinemia Indireta no Período Neonatal (SBP, 2019).","PEDIATRIA, Sociedade Brasileira de. Tratado de pediatria. 6. ed. Barueri: Manole, 2024. E-book. pág. 843. ISBN 9788520458679. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520458679/. Acesso em: 24 mar. 2025."],"tema":"Icterícia neonatal — quando internar","conceito":"RN de 37 semanas, 54 h de vida, BT 15,5 com BI 14,9, filho de mãe com diabetes gestacional (fator de risco). Valor em faixa de alto risco no nomograma de Bhutani para essa idade pós-natal.","alt":{"A":"Alta só é segura em faixa de baixo ou intermediário-baixo risco.","B":"Repetir em 24 h sem tratar é observar uma bilirrubina que já está em faixa de intervenção.","C":"Esperar o pico é justamente o que se quer evitar.","D":"CORRETA. Adiar a alta e iniciar fototerapia, mantendo o RN em alojamento conjunto para preservar a amamentação."},"roteiro":[],"takehome":"Fototerapia não é motivo para separar mãe e bebê. Filho de mãe diabética tem risco aumentado de icterícia (policitemia).","area":"CI · Icterícia neonatal"},{"id":71,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.1","num":8}],"enunciado":["(UNINOVAFAPI) Paciente do sexo masculino, 23 anos, refere uma torção no tornozelo esquerdo durante partida de futebol, ocorrida há aproximadamente 1 hora. No exame físico, não apresenta equimose perimaleolar e consegue permanecer em ortostase com apoio do membro acometido e deambula com pouca dor durante a avaliação.","Qual é a conduta inicial recomendada no atendimento do paciente?"],"alternativas":{"A":"Gelo local, repouso, bandagem elástica e elevação, sem exame de imagem.","B":"Solicitar radiografia do tornozelo em 3 incidências, com base nos critérios de Ottawa.","C":"Encaminhar para ortopedia ambulatorial em 7 dias para avaliação funcional.","D":"Indicar imobilização gessada imediata por suspeita clínica de fratura instável."},"correta":"A","oficial":{},"oficial_extra":["A alternativa correta é: uso de gelo, repouso, colocação de bota imobilizadora e elevação do membro acometido.","O protocolo PRICE (Proteção, Repouso, Gelo, Compressão, Elevação) é a abordagem aceita para o tratamento inicial de lesões agudas de tornozelo, como as entorses. Durante as primeiras 48-72 horas após o trauma, o protocolo foca no controle da inflamação e na minimização de dor e inchaço.","Justificativa com base nas Regras de Ottawa:","As Regras de Ottawa para avaliação de tornozelo após trauma indicam a necessidade de radiografia apenas quando:","• Há dor na região maleolar (lateral ou medial) e","• sensibilidade à palpação na borda posterior dos maléolos ou","• incapacidade de apoiar o peso do corpo (não conseguir dar 4 passos imediatamente após o trauma ou no serviço de emergência).","No caso apresentado:","• Não há equimose nem dor intensa na região maleolar.","• O paciente consegue permanecer em ortostase e deambula com pouca dor.","• Não há critérios clínicos que justifiquem radiografia, segundo as Regras de Ottawa, portanto o caso é de baixo risco para fratura.","Assim, a conduta conservadora com gelo, repouso, contenção e elevação é apropriada e segura para o manejo inicial."],"refs":["STIELL, I. G. et al. Decision rules for the use of radiography in acute ankle injuries: Refinement and prospective validation. BMJ, v. 313, n. 7070, p. 594–597, 1996.","BMJ BEST PRACTICE. Ankle injuries – assessment and diagnosis. Disponível em: https://bestpractice.bmj.com/topics/en-us/3000102. Acesso em: 05 abr. 2025.","AMERICAN COLLEGE OF EMERGENCY PHYSICIANS. Clinical Policy: Critical Issues in the Evaluation of Adult Patients Presenting to the Emergency Department With Acute Ankle Injury. Ann Emerg Med, 2009.","BRUCKNER, Jesse DeLee; DREZ, David; MILLER, Mark D. Ortopedia de DeLee e Drez: princípios de cirurgia ortopédica. 2ª ed. Rio de Janeiro: Elsevier, 2011.","AZEVEDO, Henrique Murad; MARQUES, Ary Nogueira; VON BAHTEN, Felipe. Ortopedia e traumatologia: princípios e prática. 5ª ed. Rio de Janeiro: Guanabara Koogan, 2021.","HECK, Robert K. Ortopedia: princípios e sua aplicação. Rockwood, Green & Wilkins. 7ª ed. Porto Alegre: AMGH, 2014.","ROCKWOOD, Charles A.; GREEN, David P.; BUCHOLZ, Robert W.; HECKMAN, James D. Rockwood & Green: fraturas em adultos. 8ª ed. Rio de Janeiro: Guanabara Koogan, 2015.","MARTIN, Charles; COLTON, Charles; MCKEE, Michael; STANNARD, John. Manual de AO: princípios do tratamento de fraturas. 3ª ed. Porto Alegre: AMGH, 2016."],"tema":"Entorse leve — conduta inicial","conceito":"Sem equimose, em ortostase, deambulando com pouca dor: nenhum critério de Ottawa preenchido. Conduta clínica sem imagem.","alt":{"A":"CORRETA. Gelo, repouso relativo, compressão elástica e elevação, sem exame de imagem.","B":"Os critérios de Ottawa não estão preenchidos — pedir radiografia contraria a própria regra citada.","C":"Encaminhar sem tratar adia o manejo de uma lesão que se resolve na atenção inicial.","D":"Não há suspeita de fratura, e imobilização gessada piora o desfecho funcional."},"roteiro":[],"takehome":"Ottawa negativo = trate e oriente, sem radiografia.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":72,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":1}],"enunciado":["(UNIFIPMOC) Paciente masculino, 80 anos, procura atendimento acompanhado de sua filha, que relata que ele apresenta esquecimentos progressivos há cerca de 2 anos, dificuldade em lembrar fatos recentes e em realizar atividades instrumentais da vida diária, como lidar com finanças e administrar medicamentos. Não há histórico de AVC prévio, uso de álcool em excesso ou alterações comportamentais abruptas. No Mini Exame do Estado Mental (MEEM), o paciente obteve pontuação 18/30.","Diante desse quadro, o diagnóstico mais provável é:"],"alternativas":{"A":"demência vascular.","B":"comprometimento cognitivo leve.","C":"doença de Alzheimer.","D":"demência frontotemporal."},"correta":"C","oficial":{"B":"A alternativa \"comprometimento cognitivo leve\" está incorreta. O CCL caracteriza- se por queixa de memória ou cognição, porém sem prejuízo funcional significativo nas atividades de vida diária. Neste caso, o paciente apresenta dependência em tarefas instrumentais, o que já caracteriza demência.","A":"A alternativa \"demência vascular\" está incorreta. A demência vascular geralmente está associada a histórico de AVC, déficits neurológicos focais ou declínio cognitivo em degraus. O paciente não tem antecedentes de AVC nem sinais neurológicos focais, tornando essa hipótese menos provável.","C":"A alternativa \"doença de Alzheimer\" está correta. A Doença de Alzheimer é a principal causa de demência em idosos, com instalação insidiosa, progressiva, inicialmente com prejuízo de memória episódica recente e dificuldade em atividades instrumentais da vida diária. O quadro clínico e o MEEM (18/30) são compatíveis.","D":"A alternativa \"demência frontotemporal\" está incorreta. A demência frontotemporal geralmente apresenta alterações precoces de comportamento, desinibição, apatia ou dificuldades de linguagem, mais comum em pacientes mais jovens (50–65 anos). O quadro clínico descrito é diferente."},"oficial_extra":["Referência:","BRUNNER, Lillian Sholtis; SUDDARTH, Doris Smith. Tratado de Enfermagem Médico- Cirúrgica. 14. ed. Rio de Janeiro: Guanabara Koogan, 2019.","NITRINI, R.; BACHESCHI, L. A. Demências. In: NITRINI, R.; BACHESCHI, L. A. (orgs.). A neurologia que todo médico deve saber. 2. ed. São Paulo: Atheneu, 2018."],"refs":[],"tema":"Doença de Alzheimer x outras demências","conceito":"Instalação insidiosa e progressiva, memória episódica recente primeiro, perda de atividades instrumentais, MEEM 18. Vascular tem declínio em degraus com AVC/focalidade; frontotemporal começa por comportamento ou linguagem, em paciente mais jovem (50–65 anos).","alt":{"A":"Sem AVC prévio nem déficit focal, e o declínio é progressivo, não em degraus.","B":"Já há prejuízo em atividades instrumentais (finanças, medicações) — isso é demência, não CCL.","C":"CORRETA. Doença de Alzheimer, a principal causa de demência em idosos.","D":"Frontotemporal traria desinibição, apatia ou afasia precoces, em paciente mais jovem."},"roteiro":[],"takehome":"Memória primeiro e progressão lenta = Alzheimer. Comportamento primeiro = frontotemporal. Degraus com focalidade = vascular.","area":"CI · Demências e parkinsonismo"},{"id":73,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":2}],"enunciado":["(IESVAP) Homem, tabagista de longa data (cerca de 15 cigarros por dia há 25 anos), procurou atendimento médico devido ao início de tosse persistente, perda de peso, dispneia aos esforços e hemoptise há 60 dias. Foi submetido a uma tomografia computadorizada de tórax, que revelou uma lesão peri-hilar à esquerda com envolvimento do brônquio fonte correspondente, o qual apresenta redução de sua luz.","Considerando o histórico clínico e os achados radiológicos descritos, qual é a principal hipótese diagnóstica?"],"alternativas":{"A":"Tuberculose pulmonar.","B":"Câncer de pulmão.","C":"Bronquite crônica.","D":"Doença pulmonar obstrutiva crônica (DPOC)."},"correta":"B","oficial":{"A":"A tuberculose pulmonar acomete frequentemente parênquima e linfonodos mediastinais e hilares, porém sem determinar obstrução brônquica.","C":"A bronquite crônica apresenta-se com aumento do calibre dos brônquios, que podem ter paredes espessadas."},"oficial_extra":["Justificativa: O quadro clínico de tosse persistente, perda de peso, dispneia aos esforços e hemoptise, associado ao histórico de tabagismo de longa data e à lesão peri-hilar com envolvimento do brônquio na tomografia computadorizada de tórax, são características sugestivas de neoplasia pulmonar, especialmente câncer de pulmão, que é comumente relacionado ao tabagismo crônico.","A DPOC apresenta-se na tomografia computadorizada principalmente com os achados de enfisema pulmonar.","Referência:","MARTINS, Mílton de A.; CARRILHO, Flair J.; ALVES, Venâncio Avancini F.; CASTILHO, Euclid. Clínica Médica, Volume 2: Doenças Cardiovasculares, Doenças Respiratórias, Emergências e Terapia Intensiva. 2. ed. Barueri: Manole, 2016. E-book. p.A. ISBN 9788520447727. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788520447727/. Acesso em: 14 mar. 2025."],"refs":[],"tema":"Câncer de pulmão — lesão central","conceito":"Tabagismo pesado + tosse, perda de peso, dispneia e HEMOPTISE + lesão peri-hilar com redução da luz brônquica. Lesão central obstruindo brônquio é padrão de carcinoma (escamoso, tipicamente).","alt":{"A":"TB acomete parênquima e linfonodos, mas não costuma obstruir brônquio; daria cavitação e sintomas consumptivos com febre vespertina.","B":"CORRETA. Câncer de pulmão — hemoptise com massa central em tabagista é a combinação clássica.","C":"Bronquite crônica é diagnóstico clínico (tosse produtiva 3 meses/ano por 2 anos), sem massa.","D":"DPOC mostra enfisema na TC, não lesão obstrutiva focal."},"roteiro":[],"takehome":"Hemoptise em tabagista de longa data é câncer até prova em contrário.","area":"CI · Neoplasias pulmonares"},{"id":74,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":3}],"enunciado":["(FMIT) Paciente, sexo feminino, 43 anos, sofreu uma torção do tornozelo direito ao descer uma escada. Chega ao pronto-socorro com dor intensa, dificuldade para apoiar o pé no chão e inchaço local evidente. No exame físico, apresenta sensibilidade dolorosa à palpação do maléolo lateral e dificuldade para dar mais de quatro passos consecutivos. Não há ferimentos abertos nem sinais de lesão vascular.","Com base na avaliação clínica e nos critérios da Regra de Ottawa, qual é a conduta inicial mais adequada para esse caso?"],"alternativas":{"A":"Solicitar ultrassonografia para avaliar integridade ligamentar, reservando a radiografia apenas para casos com deformidade evidente e edema importante.","B":"Solicitar radiografia do tornozelo em três incidências, pois há dor localizada no maléolo lateral e dificuldade para apoiar o peso corporal após o trauma.","C":"Indicar imobilização com órtese funcional e analgésicos, sem necessidade de exame de imagem, pois não há deformidade visível nem lesões abertas.","D":"Indicar ressonância magnética de tornozelo para confirmar possível fratura oculta e iniciar tratamento conservador com apoio parcial imediato."},"correta":"B","oficial":{"B":"Resposta correta: Solicitar radiografia do tornozelo em três incidências, pois há dor localizada no maléolo lateral e dificuldade para apoiar o peso corporal após o trauma. Segundo a Regra de Ottawa, a indicação de radiografia está presente quando o paciente apresenta dor na região maleolar associada à incapacidade de apoiar o peso corporal por pelo menos quatro passos ou sensibilidade óssea localizada. Neste caso, ambos os critérios estão presentes, justificando o exame.","A":"Solicitar ultrassonografia para avaliar integridade ligamentar, reservando a radiografia apenas para casos com deformidade evidente e edema importante. Incorreta, pois a ultrassonografia não é o exame de escolha inicial para suspeita de fratura. O diagnóstico inicial deve ser guiado pela radiografia convencional, conforme os critérios clínicos.","D":"Indicar ressonância magnética de tornozelo para confirmar possível fratura oculta e iniciar tratamento conservador com apoio parcial imediato. Incorreta, pois a ressonância magnética não é indicada na abordagem inicial de entorses ou fraturas agudas. É reservada para casos crônicos, fraturas ocultas não identificadas na radiografia ou complicações tardias."},"oficial_extra":["Indicar apenas imobilização com órtese funcional e analgésicos, sem necessidade de exame de imagem, pois não há deformidade visível nem lesões abertas. Incorreta, pois a ausência de deformidade não exclui fratura. A sensibilidade no maléolo lateral, associada à dificuldade de apoio, já preenche os critérios para solicitar radiografia.","Referência:","SKINNER, Harry B.; MCMAHON, Patrick J. CURRENT Ortopedia. 5. ed. Porto Alegre: AMGH, 2015. E-book. p.13. ISBN 9788580554366. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788580554366/. Acesso em: 26 ago. 2025."],"refs":[],"tema":"Ottawa — dois critérios presentes","conceito":"Dor à palpação do maléolo lateral E incapacidade de dar 4 passos: dois critérios, radiografia indicada (AP, perfil e oblíqua/mortise).","alt":{"A":"US não é exame inicial para suspeita de fratura.","B":"CORRETA. Radiografia em três incidências pelos critérios de Ottawa.","C":"Ausência de deformidade não exclui fratura — muitas maleolares não desviam.","D":"RM fica para fratura oculta não vista na radiografia, lesão condral ou casos crônicos."},"roteiro":[],"takehome":"Na fase aguda a imagem é radiografia. US e RM têm outro papel.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":75,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":4}],"enunciado":["(AFYA Cruzeiro do Sul) Adolescente de 15 anos, sexo masculino, comparece ao ambulatório de psiquiatria acompanhado da mãe. Ele relata pensamentos recorrentes e intrusivos de contaminação ao tocar em objetos, passando a lavar as mãos repetidamente por mais de 2 horas ao dia. A mãe refere que o comportamento vem prejudicando o desempenho escolar e a socialização do filho. O exame clínico descarta outras comorbidades psiquiátricas graves.","Considerando o diagnóstico de transtorno deste adolescente, assinale a conduta terapêutica mais adequada."],"alternativas":{"A":"Indicar terapia cognitivo-comportamental com uso de inibidor seletivo da recaptação de serotonina.","B":"Prescrever o uso de benzodiazepínico de ação curta.","C":"Iniciar o uso de antipsicóticos típicos em internação psiquiátrica imediata.","D":"Encaminhar para terapia psicanalítica de longo prazo."},"correta":"A","oficial":{},"oficial_extra":["O TOC em adolescentes é caracterizado por obsessões (pensamentos intrusivos, recorrentes e egodistônicos) e compulsões (rituais ou comportamentos repetitivos) que causam prejuízo funcional importante.","De acordo com o DSM-5 e os principais manuais de psiquiatria, o tratamento de primeira linha é a terapia cognitivo-comportamental com técnicas de exposição e prevenção de resposta (EPR) associada a ISRS, especialmente fluoxetina, sertralina ou fluvoxamina.","Benzodiazepínicos podem reduzir sintomas ansiosos inespecíficos, mas não tratam o TOC e não são recomendados como primeira linha.","A psicanálise pode ter papel complementar, mas não apresenta evidência robusta de eficácia para TOC em adolescentes.","O uso de antipsicóticos típicos pode ser cogitado como adjuvante em casos resistentes, mas não constitui primeira linha de tratamento."],"refs":["DALGALARRONDO, P. Psicopatologia e semiologia dos transtornos mentais. Ed. Porto Alegre: Artmed, 2019.","AMERICAN PSYCHIATRIC ASSOCIATION. DSM-5 – Manual Diagnóstico e Estatístico de Transtornos Mentais. Ed. Porto Alegre: Artmed, 2014.","KAPLAN, H. I.; SADOCK, B. J. Compêndio de Psiquiatria: Ciências do comportamento e psiquiatria clínica. Ed. Porto Alegre: Artmed, 2017.","LOUREIRO, C. M. et al. Clínica psiquiátrica. Barueri: Manole, 2020."],"tema":"TOC no adolescente","conceito":"Obsessões de contaminação + compulsões de lavagem > 2 h/dia com prejuízo escolar e social. Primeira linha: TCC com exposição e prevenção de resposta + ISRS (fluoxetina, sertralina, fluvoxamina).","alt":{"A":"CORRETA. TCC-EPR associada a ISRS.","B":"Benzodiazepínico alivia ansiedade inespecífica, não trata TOC, e é especialmente evitado em adolescentes.","C":"Antipsicótico típico e internação são desproporcionais; não há risco agudo nem psicose.","D":"Psicanálise não tem evidência para TOC; a técnica com evidência é a EPR."},"roteiro":[],"takehome":"Não basta dizer 'psicoterapia' — a que funciona no TOC é TCC com exposição e prevenção de resposta.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":76,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":5}],"enunciado":["(UNITPAC) Um homem de 42 anos, professor, procura atendimento devido a rouquidão progressiva há 3 meses. Refere piora após longas aulas e melhora parcial com repouso vocal. Nega tabagismo ou etilismo significativos. Ao exame físico, não há adenomegalias cervicais nem sinais de disfagia ou dispneia. A laringoscopia indireta mostra formações bilaterais, simétricas, de aspecto arredondado e esbranquiçado, localizadas no terço médio das pregas vocais.","Qual é o diagnóstico mais provável?"],"alternativas":{"A":"Nódulos vocais","B":"Carcinoma espinocelular de laringe","C":"Pólipo de prega vocal","D":"Papilomatose laríngea recorrente"},"correta":"B","oficial":{"B":"Carcinoma espinocelular de laringe (A): geralmente associado a tabagismo/etilismo, rouquidão persistente, lesão unilateral, irregular, infiltrativa, podendo haver linfonodomegalia.","C":"Pólipo de prega vocal (D): geralmente unilateral, relacionado a trauma vocal agudo, de aspecto pediculado ou séssil, diferente da apresentação simétrica e bilateral do caso."},"oficial_extra":["Justificativa com evidências","Nódulos vocais:","Lesão benigna mais comum em indivíduos com abuso vocal (professores, cantores, palestradores).","Caracteristicamente bilaterais, simétricos e localizados no terço médio das pregas vocais.","Apresentam rouquidão crônica, piora com uso da voz e melhora com repouso.","Evidência: UpToDate (2024), Sabiston – Cirurgia, capítulo de Otorrinolaringologia; diretriz da American Academy of Otolaryngology (AAO-HNS, 2020).","Papilomatose laríngea (B): causada por HPV, múltiplas formações verrucosas, podendo causar obstrução e estridor; não costuma ser simétrica e restrita ao terço médio.","Referências","American Academy of Otolaryngology – Head and Neck Surgery (AAO-HNS). Clinical practice guideline: Hoarseness (Dysphonia). Otolaryngol Head Neck Surg. 2018.","Townsend CM, Beauchamp RD, Evers BM, Mattox KL. Sabiston Textbook of Surgery . 21st ed. Elsevier; 2021."],"refs":[],"tema":"Questão com gabarito discutível — nódulos x carcinoma","conceito":"Atenção: o enunciado descreve lesões BILATERAIS, SIMÉTRICAS, no terço médio das pregas, em professor sem tabagismo, que melhora com repouso vocal — isso é a descrição clássica de NÓDULOS VOCAIS. O gabarito oficial marcou carcinoma espinocelular, e as próprias justificativas da banca descrevem os nódulos como resposta certa, o que indica erro no gabarito.","alt":{"A":"É o que o quadro descreve: nódulos vocais (bilateral, simétrico, terço médio, profissional da voz, melhora com repouso).","B":"Marcada como correta pela banca, mas o carcinoma seria unilateral, irregular, infiltrativo, em tabagista/etilista, com possível linfonodomegalia — o oposto do descrito.","C":"Pólipo é unilateral, pediculado ou séssil, por trauma vocal agudo.","D":"Papilomatose dá lesões verrucosas múltiplas por HPV, assimétricas."},"roteiro":[],"takehome":"Vale registrar essa como questão passível de recurso. O conceito a levar é o mesmo: bilateral e simétrico = nódulo; unilateral e irregular = investigar câncer.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":77,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":6}],"enunciado":["(FMIT) Uma mulher de 32 anos, gestante de 10 semanas, comparece à Unidade Básica de Saúde (UBS), referindo sangramento vaginal em mínima quantidade, iniciado há cerca de 12 horas, sem coágulos, associado a cólicas leves. Nega febre ou dor intensa. No exame físico, apresenta-se hemodinamicamente estável, com abdome livre e útero compatível com a idade gestacional. No exame especular, há sangramento ativo no canal vaginal, e o toque vaginal revela colo uterino fechado. Com base nos achados clínicos, qual é a principal hipótese diagnóstica?"],"alternativas":{"A":"Abortamento inevitável.","B":"Gravidez ectópica.","C":"Doença trofoblástica gestacional.","D":"Ameaça de abortamento."},"correta":"D","oficial":{"D":"Ameaça de abortamento.","A":"Abortamento inevitável.","B":"Gravidez ectópica.","C":"Doença trofoblástica gestacional."},"oficial_extra":["Comentário: Essa é a alternativa correta, pois o quadro clínico sugere ameaça de abortamento, caracterizada por sangramento vaginal no primeiro trimestre, sem dilatação cervical e com possibilidade de evolução favorável se houver viabilidade fetal.","Comentário: Essa alternativa está incorreta, pois o colo uterino fechado indica que a gestação ainda pode ser viável. O abortamento inevitável ocorre quando há dilatação cervical, indicando perda gestacional irreversível.","Comentário: Embora a gravidez ectópica seja um diagnóstico diferencial importante, a ausência de dor intensa e instabilidade hemodinâmica torna essa hipótese menos provável. O exame clínico e ultrassonografia são fundamentais para a confirmação.","Comentário: A doença trofoblástica gestacional pode causar sangramento no primeiro trimestre, mas geralmente se manifesta com níveis muito elevados de beta-hCG e útero maior do que o esperado para a idade gestacional, o que não foi descrito neste caso.","Referência:","ZUGAIB, Marcelo. Zugaib obstetrícia. 5. ed. Barueri: Manole, 2023. E-book. p. 573. ISBN 9786555769340. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9786555769340/. Acesso em: 22 fev. 2025."],"refs":[],"tema":"Ameaça de abortamento","conceito":"Sangramento pequeno no 1º trimestre, cólica leve, estável, colo FECHADO e útero compatível = ameaça de abortamento (ocorre em 15–20% das gestações clinicamente diagnosticadas).","alt":{"A":"Inevitável/em curso exige colo DILATADO.","B":"Ectópica é o diferencial obrigatório, mas normalmente cursa com dor mais intensa e lateralizada — a US transvaginal é que confirma a tópica.","C":"Mola teria útero maior que o esperado, hiperêmese, beta-hCG muito alto e vesículas à US.","D":"CORRETA. Ameaça de abortamento — conduta expectante, US para vitalidade e sinais de alarme."},"roteiro":[],"takehome":"Colo fechado = ameaça; colo aberto = em curso. Mas peça a US: é ela que exclui ectópica e mola.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":78,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":7}],"enunciado":["(UNISL PORTO VELHO) Paciente do sexo masculino, 45 anos, internado na enfermaria da Cirurgia Plástica após queimadura de 40% da superfície corporal total há 20 dias. Avaliação clínica e antropométrica evidenciou perda ponderal e redução de massa muscular. Exames laboratoriais:","Albumina: 2,6 g/dL","Pré-albumina: 10 mg/dL","Transferrina: 140 mg/dL","Linfócitos totais: 850/mm³","Considerando a avaliação nutricional no paciente queimado, qual a interpretação mais adequada desses achados?"],"alternativas":{"A":"Os valores sugerem apenas repercussão inflamatória transitória, sem impacto clínico relevante sobre o estado nutricional ou o processo de cicatrização.","B":"Os achados laboratoriais podem ser desconsiderados, uma vez que os dados clínicos e antropométricos já demonstraram a presença de desnutrição e a necessidade de suporte especializado.","C":"Os exames revelam parâmetros preservados, já que a hipoalbuminemia ocorre apenas pela inflamação, não refletindo desnutrição nem maior risco de complicações.","D":"Os resultados indicam desnutrição significativa, com hipoproteinemia e imunossupressão, sendo parâmetros úteis para acompanhar risco de infecção e atraso cicatricial."},"correta":"D","oficial":{},"oficial_extra":["Alternativa 1 — CORRETA. Os valores de albumina (2,6 g/dL), pré-albumina (10 mg/dL), transferrina (140 mg/dL) e linfócitos totais (850/mm³) estão consistentemente reduzidos, indicando desnutrição proteico-calórica significativa. Esses achados refletem tanto a perda de proteínas séricas quanto a imunossupressão, fatores críticos em pacientes queimados extensos. A situação aumenta o risco de infecção, complicações metabólicas e atraso na cicatrização, reforçando a necessidade de suporte nutricional especializado imediato.","Alternativa 2 — INCORRETA. Embora a inflamação realmente contribua para a redução de albumina e transferrina, não se pode considerar esse quadro apenas como repercussão transitória. Em queimados graves, inflamação e desnutrição coexistem. Os achados laboratoriais, associados a perda ponderal e redução de massa muscular, têm alto impacto clínico.","Alternativa 3 — INCORRETA. Não se trata de parâmetros preservados. A hipoalbuminemia pode ser influenciada pela inflamação, mas, neste caso, a pré-albumina e a transferrina também estão reduzidas, o que reforça a desnutrição. A linfopenia (<1.000/mm³) é marcador adicional de imunossupressão. Logo, não se trata apenas de inflamação, mas de um estado nutricional gravemente comprometido.","Alternativa 4 — INCORRETA. É verdade que os exames laboratoriais isolados não devem ser usados para diagnosticar desnutrição. No entanto, o enunciado já informa que houve avaliação clínica e antropométrica, que evidenciaram perda de peso e massa muscular. Assim, os exames não podem ser minimizados: eles reforçam e complementam a avaliação clínica, sendo fundamentais para estratificar risco e guiar conduta.","Referência:","TAN, O.; HERNDON, D. N. Nutritional support in burns. In: SABISTON, D. C. Tratado de cirurgia: a base biológica da prática cirúrgica moderna. 21. ed. Rio de Janeiro: Elsevier, 2022."],"refs":[],"tema":"Avaliação nutricional no grande queimado","conceito":"Todos os marcadores reduzidos: albumina 2,6, pré-albumina 10, transferrina 140, linfócitos 850. A inflamação contribui, mas somada à perda ponderal e à redução de massa muscular configura desnutrição com consequências clínicas.","alt":{"A":"'Sem impacto clínico relevante' é falso: a desnutrição atrasa cicatrização e aumenta infecção.","B":"Os laboratoriais não podem ser 'desconsiderados' — servem para monitorar a resposta ao suporte nutricional.","C":"Atribuir tudo à inflamação e chamar de 'preservado' ignora quatro parâmetros alterados.","D":"CORRETA. Desnutrição significativa com hipoproteinemia e imunossupressão, parâmetros úteis para acompanhar risco de infecção e atraso cicatricial."},"roteiro":[],"takehome":"Linfopenia (< 900) é marcador de imunossupressão associada à desnutrição, e no queimado se soma à perda proteica pela ferida.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":79,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":8}],"enunciado":["(UNIGRANRIO Caxias) Mulher de 68 anos procura o ambulatório com queixa de lentidão para realizar atividades cotidianas, associada a rigidez muscular e tremor em repouso no membro superior direito, iniciados há cerca de 1 ano. Refere ainda hipomimia facial e dificuldade progressiva para caminhar. Ao exame, observa-se tremor de repouso unilateral, rigidez plástica e bradicinesia. Nega comorbidades relevantes, exceto depressão tratada com sertralina. Não usa neurolépticos ou metoclopramida.","A hipótese diagnóstica mais provável para essa paciente é parkinsonismo:"],"alternativas":{"A":"atípico.","B":"idiopático.","C":"medicamentoso.","D":"vascular."},"correta":"B","oficial":{},"oficial_extra":["A paciente apresenta síndrome parkinsoniana, definida pela presença de bradicinesia associada a tremor de repouso e/ou rigidez. O quadro descrito tem início insidioso, predominância unilateral no início, tremor de repouso clássico, rigidez plástica e lentificação progressiva — características altamente sugestivas de Doença de Parkinson idiopática (DPI).","O diagnóstico diferencial inclui:","Parkinsonismo medicamentoso: ocorre geralmente após uso de neurolépticos típicos/atípicos ou metoclopramida, cursando com sintomas mais simétricos e sem tremor clássico. Não há essa exposição no caso.","Parkinsonismo vascular: associado a múltiplos acidentes vasculares, com quadro de instalação mais súbita, predomínio em membros inferiores e presença de sinais piramidais. Não há histórico compatível.","Parkinsonismos atípicos (ex.: degeneração corticobasal, paralisia supranuclear progressiva): costumam apresentar evolução rápida, pouca resposta à levodopa e sinais adicionais precoces (instabilidade postural, oftalmoparesias, disautonomia). O caso não sugere essas entidades.","Portanto, a hipótese mais provável é Doença de Parkinson idiopática. A conduta inicial em ambulatório é considerar início de levodopa ou agonistas dopaminérgicos, conforme impacto funcional e idade da paciente. O tratamento precoce melhora sintomas motores, qualidade de vida e retarda complicações secundárias."],"refs":["KATZUNG, B. G. Farmacologia básica e clínica. 14. ed. Porto Alegre: AMGH, 2019.","JANKOVIC, J.; TOLLESON, C. Parkinson’s disease: clinical features and diagnosis. In: HAUSER, S. L.; JOSEPHSON, S. A. (Ed.). Harrison’s neurology in clinical medicine. 4. ed. New York: McGraw-Hill, 2016.","TOLLESON, C. M.; JANKOVIC, J. Parkinson’s disease and other movement disorders. In: JAMESON, J. L. et al. Harrison’s principles of internal medicine. 20. ed. New York: McGraw-Hill, 2018.","BRASIL. Ministério da Saúde. Protocolo clínico e diretrizes terapêuticas – Doença de Parkinson. Brasília: MS, 2017."],"tema":"Síndrome parkinsoniana — doença de Parkinson idiopática","conceito":"Parkinsonismo = bradicinesia + (tremor de repouso e/ou rigidez). Pistas de doença idiopática: início INSIDIOSO, ASSIMÉTRICO/unilateral, tremor de repouso clássico (4–6 Hz, 'contar moedas'), rigidez plástica em roda denteada e boa resposta à levodopa.","alt":{"A":"Atípicos (PSP, atrofia de múltiplos sistemas, degeneração corticobasal, demência por corpos de Lewy) têm red flags: simetria precoce, quedas nos primeiros anos, paralisia do olhar vertical, disautonomia grave, demência precoce e má resposta à levodopa.","B":"CORRETA. Parkinsonismo idiopático (doença de Parkinson).","C":"Medicamentoso é simétrico e sem tremor clássico; exige exposição a neurolépticos, metoclopramida, flunarizina ou cinarizina — negada no enunciado. Atenção: ISRS como a sertralina podem piorar tremor, mas raramente causam parkinsonismo.","D":"Vascular é 'parkinsonismo de membros inferiores': marcha magnética, simétrico, com lesões de substância branca e antecedentes vasculares."},"roteiro":[],"takehome":"Assimetria + tremor de repouso + início insidioso = Parkinson idiopático. Simetria precoce e quedas nos primeiros anos = pense atípico.","area":"CI · Demências e parkinsonismo"},{"id":80,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":9}],"enunciado":["(AFYA Cruzeiro do Sul) Um recém-nascido de 38 semanas, peso adequado para a idade gestacional, em alojamento conjunto, apresenta icterícia visível em face e tronco superior, com bilirrubina total na zona intermediário-baixa do nomograma de Bhutani para 48 horas de vida. Encontra-se em aleitamento materno exclusivo, com sucção eficaz, perda de peso inferior a 7% e sem incompatibilidade ABO/Rh ou sinais de infecção.","Considerando a avaliação clínica e os fatores de risco para icterícia neonatal, assinale a conduta mais adequada em relação à alta hospitalar."],"alternativas":{"A":"Liberar a alta hospitalar com orientação aos pais e agendamento de reavaliação em 24–48 horas.","B":"Manter o recém-nascido internado na unidade hospitalar até a normalização da bilirrubina sérica.","C":"Indicar fototerapia imediata no alojamento conjunto e acompanhar com monograma de Buthani.","D":"Ofertar fórmula láctea suplementar para reduzir o risco de piora da icterícia."},"correta":"A","oficial":{},"oficial_extra":["A Curva de Bhutani permite estratificação do risco de hiperbilirrubinemia em recém- nascidos a termo, de acordo com idade em horas e níveis de bilirrubina sérica.","Em um RN saudável, a termo, sem fatores de risco adicionais (prematuridade, isoimunização, hemólise, sepse, perda ponderal excessiva, aleitamento ineficaz), o achado de bilirrubina na zona intermediário-baixa não indica fototerapia imediata nem prolongamento da internação.","A conduta correta é a alta hospitalar segura, com orientação sobre sinais de alerta (progressão da icterícia, sucção fraca, sonolência excessiva, febre) e garantia de reavaliação precoce em 24–48 horas.","As demais alternativas não se sustentam: fototerapia não é indicada nesse risco, a internação desnecessária aumenta custos e separa mãe-bebê, e a fórmula láctea não deve ser indicada em RN saudável com aleitamento eficaz.","Referência:","BURNS, Dennis A. R.; JÚNIOR, Roberto A.; LÓPEZ, Fernando A. (orgs.). Tratado de Pediatria: Sociedade Brasileira de Pediatria. 5.ª ed. Barueri (SP): Manole, 2021. Capítulo: Icterícia Neonatal."],"refs":[],"tema":"Icterícia neonatal — alta segura","conceito":"Contraponto das questões 48, 49 e 70: RN a termo, sem fator de risco, com bilirrubina em zona intermediário-baixa, mamando bem e perda de peso < 7%. Não há indicação de fototerapia nem de prolongar internação.","alt":{"A":"CORRETA. Alta com orientação de sinais de alerta e reavaliação em 24–48 h.","B":"Internar até 'normalizar' a bilirrubina é desnecessário e prejudica o vínculo e a amamentação.","C":"Fototerapia sem indicação pelo nomograma é sobretratamento.","D":"Fórmula complementar sem indicação prejudica o aleitamento; suplementação só entra se houver perda ponderal excessiva ou desidratação."},"roteiro":[],"takehome":"As quatro questões de icterícia do banco variam só a zona de risco. Decore o raciocínio: horas de vida + bilirrubina + fatores de risco = conduta.","area":"CI · Icterícia neonatal"},{"id":81,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":10}],"enunciado":["(FESAR) Um homem de 60 anos procura atendimento ambulatorial queixando-se de dor progressiva em joelhos e mãos, principalmente ao final do dia, associada a rigidez matinal de cerca de 10 minutos. Ao exame físico, observa-se crepitação nos joelhos, discreta deformidade nas interfalângicas proximais das mãos, sem sinais de inflamação sistêmica. Radiografia recente mostra estreitamento do espaço articular e presença de osteófitos. Estabeleça o diagnóstico mais provável e selecione o plano terapêutico inicial mais adequado, incluindo medidas farmacológicas e não farmacológicas."],"alternativas":{"A":"Gota – iniciar colchicina e dieta hipopurínica, mantendo repouso articular e hidratação adequada.","B":"Osteoartrite – iniciar AINEs conforme necessidade, associando fisioterapia, exercícios de fortalecimento muscular, orientação postural e controle de peso.","C":"Artrite reumatoide – iniciar corticoide oral de baixa dose e recomendar repouso absoluto das articulações afetadas.","D":"Artrite psoriásica – iniciar metotrexato oral e encaminhar para reumatologia, mantendo cuidados com exercícios para evitar deformidade articular."},"correta":"B","oficial":{"A":"Errado: artrite reumatoide – iniciar corticoide oral de baixa dose e recomendar repouso absoluto das articulações afetadas. Certo: osteoartrite – iniciar AINEs conforme necessidade, associando fisioterapia, exercícios de fortalecimento muscular, orientação postural e controle de peso. Errado: gota – iniciar colchicina e dieta hipopurínica, mantendo repouso articular e hidratação adequada. Errado: artrite psoriásica – iniciar metotrexato oral e encaminhar para reumatologia, mantendo cuidados com exercícios para evitar deformidade articular."},"oficial_extra":["Gabarito: O paciente apresenta quadro típico de osteoartrite: dor mecânica (piora ao uso), rigidez matinal curta (<30 min), crepitação, deformidade discreta e alterações radiográficas compatíveis. O plano terapêutico inicial deve ser multimodal: farmacológico: AINEs de uso episódico ou conforme necessidade. Não farmacológico: fisioterapia, exercícios de fortalecimento muscular, orientação postural, controle de peso e adaptação de atividades diárias. Corticoides sistêmicos ou imunossupressores não são indicados na osteoartrite inicial.","Referência:","GOLDMAN, Lee; SCHAFER, Andrew I. Goldman-Cecil Medicine. 26. ed. Rio de Janeiro: Elsevier, 2020."],"refs":[],"tema":"Osteoartrite — diagnóstico + plano","conceito":"Dor mecânica, rigidez de 10 min, crepitação, nódulos de Bouchard (IFP) e radiografia com estreitamento e osteófitos. Plano multimodal.","alt":{"A":"Gota é monoartrite aguda intensa (podagra), com hiperuricemia e cristais de urato — não dor progressiva de meses.","B":"CORRETA. Osteoartrite — AINE conforme necessidade + fisioterapia, fortalecimento, orientação postural e controle de peso.","C":"AR teria rigidez > 1 h, sinais inflamatórios, FR/anti-CCP positivos, e acometeria MCF e punhos. Repouso absoluto é contraindicado.","D":"Artrite psoriásica exigiria psoríase, dactilite ou acometimento de IFD com alterações ungueais."},"roteiro":[],"takehome":"Rigidez matinal é o divisor mais rápido: < 30 min mecânico, > 60 min inflamatório.","area":"CI · Reumatologia (OA e artrites)"},{"id":82,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":11}],"enunciado":["(UNISL PORTO VELHO) Paciente masculino, 68 anos, comparece ao ambulatório com queixa de jato urinário fraco, noctúria três vezes por noite e sensação de esvaziamento incompleto. Relata que os sintomas iniciaram há dois anos e vêm piorando progressivamente. Ao exame físico, observa-se próstata aumentada, lisa, homogênea e sem nodulações ao toque retal. O PSA encontra-se dentro da normalidade para a idade. O paciente não apresenta febre, disúria intensa ou sinais clínicos de infecção urinária.","Dentre as alternativas qual é a conduta inicial mais adequada."],"alternativas":{"A":"Indicar prostatectomia radical com linfadenectomia pélvica, porque o aumento prostático pode representar neoplasia maligna localizada.","B":"Prescrever antibioticoterapia de amplo espectro, pois sintomas urinários progressivos em idosos devem ser tratados inicialmente como prostatite bacteriana crônica.","C":"Solicitar biópsia prostática, considerando a presença de sintomas urinários exacerbados em paciente idoso com aumento prostático.","D":"Iniciar tratamento medicamentoso com alfa-bloqueadores, podendo associar inibidores da 5-alfa-redutase em próstatas volumosas, mantendo seguimento ambulatorial."},"correta":"D","oficial":{"D":"Alternativa correta: Iniciar tratamento medicamentoso com alfa-bloqueadores, podendo associar inibidores da 5-alfa-redutase em próstatas volumosas, mantendo seguimento ambulatorial","C":"- Solicitar biópsia prostática, considerando a presença de sintomas urinários exacerbados em paciente idoso com aumento prostático: não há indicação de biópsia, já que próstata é lisa e PSA está normal.","A":"- Indicar prostatectomia radical com linfadenectomia pélvica, porque o aumento prostático sintomático pode representar neoplasia maligna localizada - a prostatectomia radical está restrita ao câncer de próstata localizado, não à HPB.","B":"- Prescrever antibioticoterapia de amplo espectro, pois sintomas urinários progressivos em idosos devem ser tratados inicialmente como prostatite bacteriana crônica -não há sinais de infecção (ausência de febre, piúria, dor perineal), logo antibióticos não se justificam."},"oficial_extra":["O manejo inicial adequado da hiperplasia prostática benigna sintomática é medicamentoso com alfa-bloqueadores, associados ou não a inibidores da 5-alfa- redutase em próstatas maiores. O seguimento deve ser ambulatorial, avaliando resposta clínica e PSA.","Alternativas incorretas:"],"refs":["BRASIL. Ministério da Saúde. Protocolo Clínico e Diretrizes Terapêuticas – Hiperplasia Prostática","CAMPBELL-WALSH, Urology. 12th ed. Philadelphia: Elsevier, 2021.","SABISTON, D. C. Tratado de Cirurgia: A Base Biológica da Prática Cirúrgica Moderna. 21. ed. Rio de Janeiro: Elsevier, 2022."],"tema":"HPB — conduta inicial","conceito":"Sintomas obstrutivos progressivos, próstata lisa e homogênea, PSA normal, sem sinais de infecção. Tratamento clínico com seguimento.","alt":{"A":"Prostatectomia radical é para câncer localizado, não HPB.","B":"Não há febre, piúria nem dor perineal — antibiótico não se justifica.","C":"Biópsia exige toque suspeito ou PSA alterado; ambos normais.","D":"CORRETA. Alfa-bloqueador, associando 5-ARI se próstata volumosa, com seguimento ambulatorial."},"roteiro":[],"takehome":"Toque liso + PSA normal = HPB. Nódulo ou PSA alterado = investigar câncer.","area":"CI · Urologia (HPB e próstata)"},{"id":83,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":12}],"enunciado":["(UNIGRANRIO Caxias) Menina de 9 anos é levada ao ambulatório pelos pais com quadro de febre diária há 4 semanas, associada a fadiga e inapetência. Em outro serviço, já havia realizado exame de urina, urocultura e radiografia de tórax normais. Na avaliação atual, o hemograma evidencia anemia normocítica (Hb 9,0 g/dL), leucócitos de 3.000/mm³ com 12% de blastos circulantes e plaquetas de 95.000/mm³. VHS e PCR encontram-se elevados. Ao exame físico, apresenta palidez cutâneo-mucosa, linfonodomegalia cervical e hepatoesplenomegalia discreta.","Considerando o quadro clínico e os exames já realizados, o que priorizar para continuar a investigação diagnóstica?"],"alternativas":{"A":"Repetir hemograma e proteína C reativa em 24 horas.","B":"Realizar tomografia computadorizada de tórax e ressonância magnética de crânio.","C":"Manter observação clínica sem solicitar novos exames adicionais no momento.","D":"Solicitar mielograma e ultrassonografia abdominal."},"correta":"D","oficial":{"D":"Portanto, a conduta correta é solicitar mielograma e ultrassonografia abdominal, estabelecendo o diagnóstico definitivo e o estadiamento inicial da paciente."},"oficial_extra":["A paciente apresenta febre prolongada de 4 semanas, associada a sinais clínicos (palidez, linfonodomegalia e hepatoesplenomegalia) e laboratoriais sugestivos de comprometimento hematológico: anemia, leucopenia, plaquetopenia e presença de 12% de blastos circulantes.","Esses achados tornam altamente suspeita uma neoplasia hematológica, principalmente leucemia aguda linfoblástica (LAL), que é a neoplasia maligna mais comum da infância. Nesse cenário, o mielograma é o exame confirmatório, permitindo identificar e caracterizar a população de blastos na medula óssea. Associado a ele, exames complementares de imagem são úteis para avaliação da extensão da doença, sendo a ultrassonografia abdominal indicada inicialmente por ser não invasiva, de fácil acesso e eficaz para avaliar hepatoesplenomegalia e linfonodomegalias profundas.","Outros exames (como tomografia computadorizada ou ressonância magnética) podem ser necessários em fases posteriores, principalmente para avaliação de infiltração em sistema nervoso central ou massas mediastinais, mas não constituem o passo inicial neste caso."],"refs":["BRASIL. Ministério da Saúde. Instituto Nacional de Câncer (INCA). Diretrizes para o diagnóstico e tratamento das leucemias em crianças e adolescentes. Rio de Janeiro: INCA, 2019.","LANE, R. D.; SCHWARTZ, C. L. Leukemia in children. In: KLIEGMAN, R. M. et al. Nelson textbook of pediatrics. 21. ed. Philadelphia: Elsevier, 2020. p. 2523-2541.","PUI, C-H.; ROBISON, L. L.; LOOK, A. T. Acute lymphoblastic leukaemia. The Lancet, v. 371, n. 9617, p. 1030-1043, 2008.","ALVES, A. C. P.; LIMA, S. S. Diagnóstico diferencial de febre prolongada em pediatria. Revista Paulista de Pediatria, v. 36, n. 3, p. 363-371, 2018."],"tema":"Leucemia aguda — próximo passo","conceito":"Febre de 4 semanas + pancitopenia (Hb 9, leucócitos 3.000, plaquetas 95.000) com 12% de BLASTOS circulantes + visceromegalias. Diagnóstico praticamente definido; falta confirmar e estadiar.","alt":{"A":"Repetir hemograma não acrescenta — blastos circulantes já estão documentados.","B":"TC e RM não fecham diagnóstico de leucemia; a RM de crânio não é rotina inicial (a avaliação do SNC é por punção lombar).","C":"Observar diante de blastos é inaceitável.","D":"CORRETA. Mielograma (confirma e caracteriza os blastos, com imunofenotipagem e citogenética) + US abdominal para avaliar visceromegalias e massas."},"roteiro":[],"takehome":"Blasto em sangue periférico = mielograma hoje, não amanhã.","area":"CI · Onco-hematologia pediátrica"},{"id":84,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2025.2","num":13}],"enunciado":["(AFYA Itabuna) Durante o ambulatório de neurologia, os estudantes acompanham a avaliação de uma paciente do sexo feminino, 75 anos, com queixa de comprometimento progressivo da memória há aproximadamente dois anos. A filha relata episódios frequentes de esquecimento de eventos recentes, repetição de perguntas e desorientação esporádica, especialmente em ambientes não familiares. A paciente mantém autonomia para atividades básicas de vida diária (ABVD), porém apresenta dificuldade para realizar atividades instrumentais, como administrar contas, organizar a medicação e utilizar equipamentos eletrônicos.","No exame físico, a paciente encontra-se consciente, cooperativa, sem déficits motores ou sensitivos. O Miniexame do Estado Mental (MEEM) aponta escore de 21/30, compatível com comprometimento cognitivo leve a moderado. Exames laboratoriais (função tireoidiana, vitamina B12, eletrólitos, função renal e hepática) encontram-se dentro da normalidade. A tomografia computadorizada de crânio evidencia atrofia cortical difusa, sem sinais de lesões focais, hidrocefalia ou sangramentos.","Considerando o quadro clínico, a conduta terapêutica inicial mais apropriada para o controle do distúrbio da paciente é a prescrição de:"],"alternativas":{"A":"benzodiazepínico.","B":"memantina.","C":"psicoterapia.","D":"rivastigmina."},"correta":"D","oficial":{"A":"Antipsicóticos e benzodiazepínicos não são indicados de forma preventiva e devem ser usados com cautela, apenas quando há sintomas neuropsiquiátricos refratários (ex: agitação grave, delírios, agressividade), devido ao risco aumentado de quedas, sedação e mortalidade."},"oficial_extra":["A paciente apresenta quadro clínico e funcional compatível com demência provável do tipo Alzheimer, de evolução insidiosa, curso progressivo e prejuízo em múltiplos domínios cognitivos (memória recente, funções executivas e orientação), com repercussão funcional em atividades instrumentais. O tratamento farmacológico de primeira linha consiste no uso de inibidores da colinesterase: rivastigmina, donepezila ou galantamina. Esses fármacos atuam aumentando a disponibilidade de acetilcolina nas sinapses, contribuindo para melhora ou estabilização dos sintomas cognitivos e, em alguns casos, comportamentais.","A memantina é reservada para demência moderada a grave, podendo ser associada a inibidores da colinesterase.","A abordagem não farmacológica, como a psicoterapia, é essencial, mas não substitui o tratamento medicamentoso em casos de demência clinicamente estabelecida com impacto funcional.","Referência:","BRUNWALD, Eugene; FAUCI, Anthony S.; KASPER, Dennis L.; HAUSER, Stephen L.; LONGO, Dan L.; JAMESON, J. Larry. Harrison: Medicina Interna. 21. ed. Porto Alegre: AMGH, 2023. 2 v."],"refs":[],"tema":"Alzheimer — tratamento inicial","conceito":"Demência estabelecida: 2 anos de evolução, perda de atividades instr
