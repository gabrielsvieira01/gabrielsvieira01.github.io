<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado 8º Período — Provas Antigas</title>
<style>
:root{
  --bg:#0e1117; --bg2:#161b24; --bg3:#1e2530; --line:#2a3340;
  --tx:#e6edf3; --tx2:#9aa7b6; --tx3:#6b7887;
  --ac:#4c8dff; --ok:#2ea86a; --okbg:#14301f; --err:#e05260; --errbg:#331519;
  --warn:#d9a441;
  --ci:#8b5cf6; --ham:#ef6c3c; --iesc:#1ea6a6; --cc:#e0567f;
}
:root[data-theme="light"]{
  --bg:#f4f6f9; --bg2:#ffffff; --bg3:#eef1f6; --line:#dbe1ea;
  --tx:#141a21; --tx2:#4c5765; --tx3:#7a8694;
  --okbg:#e3f5ea; --errbg:#fdeaec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header .wrap{padding-bottom:0}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 0 10px;margin-bottom:16px;
}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 span{color:var(--tx3);font-weight:400}
.spacer{flex:1}
.iconbtn{
  background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
  border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;line-height:1.2;
}
.iconbtn:hover{color:var(--tx);border-color:var(--tx3)}

.bar{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.score b{color:var(--ok)} .score s{color:var(--err);text-decoration:none}

/* ---------- filtros ---------- */
#filtros{display:none;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-top:12px}
#filtros.open{display:block}
.fgrp{margin-bottom:12px}
.fgrp:last-child{margin-bottom:0}
.flab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
  padding:5px 11px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.chip:hover{border-color:var(--tx3);color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
select{
  width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--tx);
  padding:8px 10px;border-radius:8px;font-size:13.5px;font-family:inherit;
}
.fcount{font-size:12px;color:var(--tx3);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

/* ---------- card ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.tag{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--bg3);color:var(--tx2);font-weight:500;white-space:nowrap}
.tag.m{color:#fff;font-weight:650}
.tag.CI{background:var(--ci)} .tag.HAM{background:var(--ham)}
.tag.IESC{background:var(--iesc)} .tag.CC{background:var(--cc)}
.tag.p{border:1px solid var(--line);background:transparent}
.tag.d{background:var(--warn);color:#241a05;font-weight:650}
.tema{font-size:12.5px;color:var(--tx3);margin-bottom:12px;font-style:italic}

.enun{font-size:15.5px;line-height:1.65;margin-bottom:6px;white-space:pre-wrap}
.enun p{margin:0 0 10px}
.enun p:last-child{margin-bottom:0}

/* ---------- alternativas ---------- */
.alts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.alt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--bg3);border:1px solid var(--line);color:var(--tx);
  padding:12px 14px;border-radius:10px;cursor:pointer;font:inherit;line-height:1.55;
  transition:border-color .12s,background .12s;
}
.alt:hover:not(:disabled){border-color:var(--ac)}
.alt:disabled{cursor:default}
.ltr{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--bg2);
  border:1px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--tx2);margin-top:1px;
}
.alt.ok{background:var(--okbg);border-color:var(--ok)}
.alt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.bad{background:var(--errbg);border-color:var(--err)}
.alt.bad .ltr{background:var(--err);border-color:var(--err);color:#fff}
.alt.dim{opacity:.55}

/* ---------- comentário ---------- */
.fb{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;display:none}
.fb.show{display:block}
.verdict{font-size:14px;font-weight:650;margin-bottom:14px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--err)}
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
.sech{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700;margin-bottom:7px}
.sec p{margin:0;color:var(--tx);line-height:1.65}
.altcom{display:flex;gap:10px;margin-bottom:9px;font-size:14.2px;line-height:1.6}
.altcom:last-child{margin-bottom:0}
.altcom .k{
  flex:none;width:21px;height:21px;border-radius:5px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:var(--bg3);color:var(--tx2);margin-top:2px;
}
.altcom.c .k{background:var(--ok);color:#fff}
.altcom.c{color:var(--tx)}
.altcom:not(.c){color:var(--tx2)}
.takehome{
  background:var(--bg3);border-left:3px solid var(--ac);border-radius:0 8px 8px 0;
  padding:11px 14px;font-size:14.2px;line-height:1.6;
}
ol.rot{margin:0;padding-left:20px}
ol.rot li{margin-bottom:8px;line-height:1.62}
ol.rot li:last-child{margin-bottom:0}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-size:12.5px;color:var(--tx3);user-select:none;font-weight:600}
summary:hover{color:var(--tx2)}
details .body{margin-top:10px;font-size:13.4px;color:var(--tx2);line-height:1.62}
details .body p{margin:0 0 9px}
details .body p:last-child{margin-bottom:0}
.refs{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.55}

.btn{
  background:var(--ac);border:0;color:#fff;padding:11px 20px;border-radius:9px;
  font:inherit;font-weight:600;font-size:14px;cursor:pointer;
}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--bg3);color:var(--tx2);border:1px solid var(--line)}
.btn.g:hover{color:var(--tx);border-color:var(--tx3);filter:none}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-top:1px solid var(--line);padding:11px 16px;z-index:20;
}
.navin{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:center}
.navin .btn{flex:none}
.pos{flex:1;text-align:center;font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:50px 20px;color:var(--tx3)}
@media (max-width:520px){
  .card{padding:16px}
  .enun{font-size:15px}
  h1{font-size:14.5px}
  .btn{padding:10px 15px;font-size:13.5px}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="hrow">
   <h1>Simulado 8º P <span id="htot"></span></h1>
   <div class="spacer"></div>
   <button class="iconbtn" id="bfil">Filtros</button>
   <button class="iconbtn" id="bshuf">Embaralhar</button>
   <button class="iconbtn" id="bthm">Tema</button>
  </div>
  <div class="bar">
   <div class="prog"><i id="pbar"></i></div>
   <div class="score">✓<b id="sok">0</b> · ✗<s id="serr">0</s> · <span id="spct">—</span></div>
  </div>
  <div id="filtros">
    <div class="fgrp">
      <div class="flab">Matéria</div>
      <div class="chips" id="fmat"></div>
    </div>
    <div class="fgrp">
      <div class="flab">Prova / ano</div>
      <select id="fprova"></select>
    </div>
    <div class="fgrp">
      <div class="flab">Assunto</div>
      <select id="ftema"></select>
    </div>
    <div class="fgrp">
      <div class="flab">Tipo</div>
      <div class="chips" id="ftipo"></div>
    </div>
    <div class="fgrp">
      <div class="flab">Ordem</div>
      <div class="chips" id="fordem"></div>
    </div>
    <div class="fcount" id="fcount"></div>
  </div>
 </div>
</header>

<div class="wrap"><div id="app"></div></div>

<div class="nav"><div class="navin">
  <button class="btn g" id="bprev">‹ Anterior</button>

  <button class="btn" id="bnext">Próxima ›</button>
</div></div>

<script>
const BANCO = [{"id":1,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":1}],"enunciado":["( IESVAP) Uma paciente, 45 anos, hipertensa, com histórico de trombose venosa profunda proximal em membro inferior direito há 8 anos, comparece à Unidade Básica de Saúde para sua consulta de rotina, apresentando edema crônico em perna direita associado a varizes e dermatite ocre. Conforme o caso clínico apresentado, qual a classificação CEAP segundo a clínica e etiologia da doença venosa crônica?"],"alternativas":{"A":"C3 e etiologia primária.","B":"C4 e etiologia secundária.","C":"C3 e etiologia secundária.","D":"C4 e etiologia primária."},"correta":"B","oficial":{},"oficial_extra":["Para determinar a classificação CEAP (Clínica, Etiologia, Anatomia e Patofisiologia) da paciente com base no caso clínico, é necessário analisar cada componente:","1. Clínica (C): Refere-se ao estágio clínico da doença. Os estágios são classificados de acordo com os sinais e sintomas observados na avaliação física. As categorias são:","• C0: Sem sinais visíveis ou palpáveis de doença venosa.","• C1: Telangiectasias ou veias reticulares.","• C2: Varizes.","• C3: Edema.","• C4: Alterações da pele associadas à doença venosa:","• C4a: Alterações da pigmentação (dermatite ocre, hiperpigmentação).","• C4b: Eczemas, lipodermatoesclerose, atrofia branca.","• C5: Úlcera cicatrizada.","• C6: Úlcera ativa.","2. Etiologia (E): Refere-se à causa da doença venosa crônica. As categorias são:","• E0: Etiologia desconhecida.","• E1: Primária (sem causa conhecida, geralmente relacionada a fatores genéticos e ambientais).","• E2: Secundária (resultante de condições ou eventos que afetam as veias, como trombose venosa profunda ou síndrome pós-trombótica).","3. Anatomia (A): Descreve as veias afetadas pela doença. As categorias são:","• A1: Veias superficiais.","• A2: Veias perfurantes.","• A3: Veias profundas.","• A4: Múltiplas veias afetadas (superficiais, perfurantes e profundas).","4. Patofisiologia (P): Indica os mecanismos patológicos subjacentes. As categorias são:","• P1: Refluxo venoso.","• P2: Obstrução venosa.","• P3: Refluxo e obstrução venosa.","Com base na classificação:","1. Clínica (C):","• A paciente apresenta edema crônico, varizes e dermatite ocre em membro inferior direito.","• Com base nesses sinais clínicos, a classificação clínica seria C4a. Esta classificação inclui alterações cutâneas venosas, como dermatite ocre e edema, sem úlcera ativa.","2. Etiologia (E):","• A etiologia é classificada como secundária (Es) devido ao histórico de trombose venosa profunda (TVP) proximal no membro inferior direito.","• A trombose venosa profunda é um fator etiológico secundário comum em doença venosa crônica.","3. Anatomia (A):","• A presença de varizes sugere que há envolvimento de veias superficiais (As), com possível comprometimento das veias perfurantes e profundas, dado o histórico de TVP e o edema crônico.","• Se houver exames complementares, como ultrassonografia Doppler, esses podem confirmar o comprometimento anatômico específico.","4. Fisiopatologia (P):","• A paciente provavelmente apresenta refluxo venoso (Pr), dado o desenvolvimento de varizes e a progressão da dermatite ocre. Também é possível que haja uma obstrução venosa (Po), dada a história de TVP.","Classificação CEAP solicitada da paciente é:","• Clínica (C): C4a (Edema crônico, dermatite ocre, varizes)","• Etiologia (E): Es (Secundária a TVP)","• Anatomia (A): As (Veias superficiais, com possível envolvimento de veias perfurantes e profundas)","• Patofisiologia (P): Pr, Po (Refluxo e Obstrução)","Classificação final: CEAP C4a, Es, As, Pr, Po.","Com base em evidências:","A classificação CEAP é amplamente utilizada para categorizar a gravidade da doença venosa crônica, com base em critérios clínicos, etiológicos, anatômicos e patofisiológicos, conforme recomendado pelas diretrizes internacionais e pela Sociedade Internacional de Flebologia. A presença de edema crônico, dermatite ocre e varizes, associada a um histórico de TVP, são fatores que indicam uma doença venosa crônica avançada, com risco de progressão para úlceras venosas se não tratada adequadamente.","Bibliografia em formato ABNT:","• EKLÖF, Bo; RUTHERFORD, Robert B.; BERGAN, John J.; et al. Revision of the CEAP classification for chronic venous disorders: consensus statement. Journal of Vascular Surgery, St. Louis, v. 40, n. 6, p. 1248-1252, 2004.","• PAPPAS, P.J.; LABROPULOS, N. The CEAP classification system: overview, limitations, and future directions. In: The Venous System in Health and Disease. CRC Press, 2022. p. 132-140.","• SOCIEDADE BRASILEIRA DE ANGIOLOGIA E DE CIRURGIA VASCULAR. Diretrizes para o tratamento da Doença Venosa Crônica. Rio de Janeiro: SBACV, 2021.","A classificação CEAP é importante na conduta do paciente com doença venosa crônica, identificando os sinais de doença mais avançada. Essa classificação engloba 4 itens, sendo eles a clínica, a etiologia, a anatomia (identificação da veia acometida) e a fisiopatologia. A classificação clínica é a mais utilizada, apresentando-se da seguinte forma:","C0 – sem sinais de doença venosa crônica","C1 – Teleangiectasias e/ ou veias reticulares","C2 – Varizes sem edema","C3 – Varizes com edema","C4 – Dermatite ocre ou lipodermatoesclerose","C5 – Úlcera venosa cicatrizada","C6 – Úlcera venosa ativa","A classificação etiológica é definida em primária, secundária (trombose, trauma ou fistula arteriovenosa:) ou idiopática."],"refs":["Cirurgia Vascular: Cirurgia Endovascular – Angiologia, 4ª edição, Editora Thieme Revinter, Rio de Janeiro, 2020;"],"tema":"Doença venosa crônica — CEAP","conceito":"O 'C' é o achado mais avançado presente (C3 edema, C4a dermatite ocre, C5 úlcera cicatrizada, C6 ativa). A etiologia é secundária quando há causa identificável — TVP prévia é o exemplo clássico (síndrome pós-trombótica).","alt":{"A":"Erra nos dois: C3 ignora a dermatite ocre e 'primária' ignora a TVP.","B":"CORRETA. Dermatite ocre = C4a; TVP há 8 anos = etiologia secundária.","C":"Etiologia certa, mas para em C3 e desconsidera a alteração de pele.","D":"C4 certo, mas 'primária' é incompatível com TVP prévia."},"roteiro":[],"takehome":"Ache o achado cutâneo mais avançado (define o C) e o evento prévio (define o E).","area":"CI · Cirurgia vascular"},{"id":2,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2024.2","num":2}],"enunciado":["( UNITPAC) Um paciente do sexo masculino, 60 anos, hipertenso e fumante, foi diagnosticado com um aneurisma da aorta abdominal de 3,5 cm de diâmetro durante um exame de imagem realizado como parte de um check-up de rotina. O paciente não apresenta sintomas relacionados ao aneurisma e, após o diagnóstico, está preocupado com a necessidade de tratamento imediato.","1) Com base nas diretrizes mais atuais, descreva a conduta apropriada para o manejo deste paciente. (1,25 ponto)","2) Inclua em sua resposta o critério para a necessidade de intervenção cirúrgica e a frequência recomendada para o acompanhamento deste tipo de aneurisma. (1,25 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1) Com base nas diretrizes mais atuais, descreva a conduta apropriada para o manejo deste paciente. (1,25 ponto)","Acompanhamento com exames de imagem a cada 12 meses para monitorar o crescimento do aneurisma.","É crucial controlar fatores de risco cardiovasculares, como hipertensão e tabagismo, que podem acelerar a expansão do aneurisma. Para o paciente descrito, que é hipertenso e fumante, deve-se intensificar o controle da pressão arterial com medicação adequada e aconselhar fortemente a cessação do tabagismo, pois ambos os fatores aumentam o risco de expansão e ruptura do aneurisma.","2) Inclua em sua resposta o critério para a necessidade de intervenção cirúrgica. (1,25 ponto)","A intervenção cirúrgica é geralmente recomendada para aneurismas da aorta abdominal quando o diâmetro é igual ou superior a 5,5 cm em homens ou 5,0 cm em mulheres, ou quando o aneurisma está crescendo rapidamente (mais de 0,5 cm em 6 meses ou mais de 1 cm por ano), independentemente do diâmetro. A necessidade de intervenção também é indicada se o paciente apresentar aneurisma sacular ou sintomas atribuíveis ao aneurisma, como dor abdominal ou lombar persistente, que pode sugerir uma expansão iminente ou ruptura."],"refs":["SOCIEDADE BRASILEIRA DE CIRURGIA VASCULAR E ENDOVASCULAR (SBACV). Diretrizes Brasileiras para Tratamento de Aneurisma da Aorta Abdominal. Jornal Vascular Brasileiro, São Paulo, v. 16, n. 2, p. 130-139, 2017.","JOHNSTON, K. W.; RUTHERFORD, R. B.; TILSON, M. D.; SHAH, D. M.; HOLLIER, L.; STANLEY, J. C. Suggested standards for reporting on arterial aneurysms. Journal of Vascular Surgery, Amsterdam, v. 13, n. 3, p. 452-458, 1991.","HIRATZKA, L. F.; BAKRIS, G. L.; BECKMAN, J. A.; BERSIN, R. M.; CARR, V. F.; CASEY, D. E.; AMERICAN COLLEGE OF CARDIOLOGY FOUNDATION (ACCF); AMERICAN HEART ASSOCIATION (AHA). 2010 ACCF/AHA/AATS/ACR/ASA/SCA/SCAI/SIR/STS/SVM Guidelines for the Diagnosis and Management of Patients With Thoracic Aortic Disease. Circulation, Dallas, v. 121, n. 13, p. 266-369, 2010."],"tema":"Aneurisma de aorta abdominal","conceito":"AAA ≥ 3,0 cm. Abaixo do limiar cirúrgico: vigilância por imagem + controle de fatores de risco.","alt":{},"roteiro":["Conduta: não operar. Vigilância com US a cada 12 meses (3,0–3,9 cm).","Controle de risco: cessação do tabagismo (maior impacto na expansão), controle pressórico, estatina.","Critérios de intervenção: ≥ 5,5 cm no homem / ≥ 5,0 cm na mulher; crescimento > 0,5 cm em 6 meses ou > 1 cm/ano; aneurisma sintomático ou sacular."],"takehome":"Decore 5,5 / 5,0 cm e 0,5 cm em 6 meses. Parar de fumar é intervenção, não conselho genérico.","area":"CI · Cirurgia vascular"},{"id":3,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":3}],"enunciado":["( UNIPTAN) Um paciente, de 65 anos, sexo masculino, procura o pronto-socorro com dor intensa e inchaço no pênis, iniciados há cerca de 6 horas após a manipulação do prepúcio durante a higiene íntima. Ele relata que, após retrair o prepúcio, não conseguiu reposicioná-lo sobre a glande, e desde então, o inchaço tem piorado progressivamente. Ao exame físico, observa-se um anel edemaciado de tecido prepucial apertado atrás da glande, que está ingurgitada.","Diante do quadro clínico descrito, indique a conduta mais adequada para este paciente no pronto- socorro."],"alternativas":{"A":"Compressão manual do edema e reposicionamento do prepúcio.","B":"Prescrição de antibióticos e observação.","C":"Realização imediata de postectomia.","D":"Administração de anti-inflamatórios e alta com orientação para retorno."},"correta":"A","oficial":{"A":"A resposta correta é Compressão manual do edema e reposicionamento do prepúcio. A parafimose é uma emergência urológica que ocorre quando o prepúcio retraído não pode ser recolocado sobre a glande, resultando em constrição do fluxo sanguíneo. A conduta inicial é tentar reduzir o edema através de compressão manual e reposicionar o prepúcio. Se essa manobra não for bem-sucedida, pode ser necessária uma intervenção cirúrgica.","B":"Prescrição de antibióticos e observação: Embora infecções possam ocorrer, o tratamento antibiótico não resolve a parafimose e pode retardar a intervenção necessária, exacerbando o quadro.","C":"Realização imediata de postectomia: A postectomia pode ser indicada em alguns casos, especialmente se a redução manual falhar ou se o paciente tiver episódios recorrentes, mas não é a primeira abordagem no pronto-socorro.","D":"Administração de anti-inflamatórios e alta com orientação para retorno: Anti- inflamatórios podem ajudar no controle da dor e inflamação, mas não resolvem o problema mecânico subjacente da parafimose. A alta sem redução do quadro seria inadequada e perigosa."},"oficial_extra":["Por que as outras alternativas estão incorretas:","Referência:","WEIN, Alan J. et al. Campbell-Walsh urologia. Revisão científica e tradução de Wilson F. S. Busato Jr. et al. 11. ed. Rio de Janeiro: Elsevier, 2019."],"refs":[],"tema":"Parafimose","conceito":"Anel constritor atrás da glande → obstrui retorno venoso → edema → aperta mais. Emergência com janela de horas.","alt":{"A":"CORRETA. Redução manual: analgesia, compressão sustentada 5–10 min para espremer o edema e reposicionar o prepúcio.","B":"Antibiótico não desfaz o anel e o tempo perdido leva à necrose.","C":"Postectomia é definitiva/eletiva ou de resgate, não a primeira medida.","D":"AINE ajuda na dor, mas não resolve a constrição; dar alta é perigoso."},"roteiro":[],"takehome":"Parafimose = redução manual imediata; cirurgia só se falhar.","area":"CI · Urologia de emergência e escroto"},{"id":4,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":4}],"enunciado":["( UNITPAC) Um jovem de 14 anos chega ao pronto-socorro com dor intensa e súbita no testículo direito há cerca de 6 horas. Ele descreve a dor como localizada, sem melhora com repouso, e associada a náusea e vômito. Ao exame físico, observa-se o testículo direito elevado, em posição horizontal, com sensibilidade intensa à palpação e ausência do reflexo cremastérico no lado afetado. Qual é a conduta imediata mais adequada para este paciente?"],"alternativas":{"A":"Realizar ultrassonografia com Doppler escrotal para confirmar o diagnóstico.","B":"Encaminhar o paciente imediatamente para exploração cirúrgica.","C":"Administrar analgésicos e observar a evolução clínica por 24 horas.","D":"Solicitar exame de urina e iniciar tratamento com antibióticos."},"correta":"B","oficial":{},"oficial_extra":["A torção testicular é uma emergência urológica que requer intervenção cirúrgica imediata para preservar a viabilidade do testículo. O quadro clínico clássico inclui dor súbita, testículo elevado, ausência de reflexo cremastérico e sintomas sistêmicos como náusea. A confirmação diagnóstica por imagem não deve atrasar o tratamento, sendo a exploração cirúrgica urgente a melhor conduta baseada nas evidências.","BMJ Best Practice. Escroto agudo. 2024","BRODERICK, G. A.; KANOF, P. A. Emergency diagnosis and management of testicular torsion. American Family Physician, [s.l.], v. 90, n. 12, p. 835-840, 2014.","MELTZER, J. A.; GUERDERMAN, C. G. Testicular torsion: Diagnosis, evaluation, and management. Urology Clinics of North America, [s.l.], v. 47, n. 4, p. 623-631, 2020.","WALZ, J. M.; KRITZINGER, K. J.; COST, N. G. Testicular torsion: A review of diagnosis and management in the emergency setting. Journal of Emergency Medicine, [s.l.], v. 59, n. 3, p. 409- 417, 2020.","LIEBERMAN, S.; MELAMED, H. Acute scrotum in children: Overview and management. Pediatric Emergency Care, [s.l.], v. 36, n. 10, p. 1-5, 2020."],"refs":[],"tema":"Torção testicular","conceito":"Escroto agudo em adolescente é torção até prova em contrário: dor súbita, testículo elevado e horizontalizado, reflexo cremastérico ABOLIDO. Janela de salvamento ~6 h.","alt":{"A":"Doppler só quando a suspeita é duvidosa; com quadro clássico, atrasa a cirurgia e pode dar falso-negativo.","B":"CORRETA. Exploração cirúrgica imediata com orquidopexia bilateral.","C":"Observar 24 h condena o testículo.","D":"Trata epididimite — que teria dor gradual, febre, disúria e cremastérico presente."},"roteiro":[],"takehome":"Cremastérico ausente + dor súbita = centro cirúrgico, não ultrassom.","area":"CI · Urologia de emergência e escroto"},{"id":5,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2024.2","num":5}],"enunciado":["( UNITPAC) Um paciente diabético de 70 anos, com histórico de hipertensão e tabagismo, apresenta dor intensa na perna direita que piora ao caminhar e persiste mesmo em repouso. No exame físico, você nota que a perna afetada está fria, pálida e sem pulsos perceptíveis. O paciente também tem uma pequena ferida plantar direita que não cicatriza.","1) Quais são os passos iniciais que você deve seguir para planejar o tratamento deste paciente? (1,25 ponto)","2) Quais são as principais intervenções que você recomendaria para evitar a perda do membro e melhorar a circulação sanguínea? (1,25 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["PADRÃO DE RESPOSTA ESPERADA:","Quais são os passos iniciais que você deve seguir para planejar o tratamento deste paciente? (1,25 ponto)","Avaliação clínica detalhada: A primeira etapa é realizar uma história clínica completa e um exame físico minucioso. Identifique a duração e progressão dos sintomas, o histórico médico completo, incluindo diabetes, hipertensão, tabagismo e possíveis comorbidades. Durante o exame físico, avalie sinais de isquemia crítica, como ausência de pulsos, palidez, frieza, e presença de úlceras que não cicatrizam.","Confirmação do diagnóstico com o Índice Tornozelo-Braquial (ITB): O ITB é um exame não invasivo que compara a pressão arterial no tornozelo com a pressão no braço. O caso sugere um valor < 0,4 que indica isquemia crítica, um estágio avançado da Doença Arterial Periférica (DAP)","e que se confirmado exige intervenção urgente para prevenir a perda do membro.","Estratificação do risco: É crucial determinar o risco de perda do membro e mortalidade. Pacientes com ITB inferior a 0,4 e sintomas como dor em repouso e úlceras isquêmicas estão em alto risco e podem necessitar de intervenções cirúrgicas urgentes, como revascularização. A estratificação ajuda a decidir entre manejo cirúrgico imediato ou abordagem médica inicial intensiva.","Quais são as principais intervenções que você recomendaria para evitar a perda do membro e melhorar a circulação sanguínea? (1,25 ponto)","Terapia médica intensiva:","Controle rigoroso da glicemia: A hiperglicemia piora a DAP e interfere na cicatrização de úlceras. Portanto, é essencial ajustar o tratamento antidiabético para manter a glicemia em níveis-alvo. Terapia antitrombótica: Medicamentos como aspirina ou clopidogrel são recomendados para reduzir o risco de eventos trombóticos e ajudar a manter a circulação sanguínea. Estatinas: O uso de estatinas é indicado para controlar os níveis de colesterol, estabilizar placas ateroscleróticas e reduzir o risco de eventos cardiovasculares. Medicação antihipertensiva: Controlar a pressão arterial é fundamental para prevenir complicações adicionais e melhorar a perfusão sanguínea.","Intervenção cirúrgica:","Revascularização: A revascularização é a intervenção de escolha em casos de isquemia crítica. Procedimentos como angioplastia, endarterectomia ou bypass cirúrgico podem ser necessários para restaurar o fluxo sanguíneo ao membro afetado e prevenir a amputação. Cuidados com a úlcera: A úlcera isquêmica deve ser tratada com cuidados locais adequados, incluindo desbridamento (remoção de tecido morto), uso de curativos especializados, e, se indicado, terapia com oxigênio hiperbárico para promover a cicatrização.","Cessação do tabagismo: Como o tabagismo é um dos principais fatores de risco modificáveis para a DAP, é crucial que o paciente receba apoio para parar de fumar, o que pode reduzir a progressão da doença e melhorar a eficácia do tratamento.","Com base em evidências:","O controle rigoroso da glicemia e o uso de estatinas são recomendados pelas diretrizes internacionais para o manejo da DAP em pacientes diabéticos, com o objetivo de estabilizar a doença e prevenir complicações cardiovasculares adicionais. A revascularização é indicada em casos de isquemia crítica para evitar amputações, conforme estabelecido por estudos clínicos e diretrizes vasculares, que demonstram que intervenções cirúrgicas precoces podem melhorar a perfusão e salvar o membro."],"refs":["SOCIEDADE BRASILEIRA DE DIABETES. Diretrizes da Sociedade Brasileira de Diabetes 2022- 2023. São Paulo: Clannad, 2022.","HIRATA, Marcia Hitomi; CASTRO, Icaro. Abordagem clínica e terapêutica da doença arterial periférica. In: BIBLIOTECA DE DIRETRIZES MÉDICAS. Porto Alegre: Medbook, 2023. p. 58-73.","NORRIS, T.G.; HACKETT, D. Current management strategies for critical limb ischemia. Journal","of Vascular Surgery, St. Louis, v. 70, n. 1, p. 87-95, 2023.","AMERICAN DIABETES ASSOCIATION. Standards of Medical Care in Diabetes—2024. Diabetes Care, Arlington, v. 47, Suplemento 1, p. S34-S45, 2024."],"tema":"Isquemia crítica de membro (DAP)","conceito":"Dor em repouso + úlcera que não cicatriza + pulsos ausentes = isquemia crítica (Fontaine III/IV). Mortalidade cardiovascular em 1 ano de 20–25%.","alt":{},"roteiro":["Passos iniciais: anamnese e exame físico dirigidos; confirmar com ITB (< 0,4 = isquemia crítica).","No diabético o ITB pode estar falsamente normal ou > 1,3 (calcificação) — use índice hálux-braquial ou TcPO2.","Estratificar risco (WIfI) e avaliar infecção/osteomielite; imagem (eco-Doppler, angio-TC ou arteriografia) para planejar.","Terapia clínica: cessar tabagismo, estatina, antiagregante, controle glicêmico e pressórico, cuidado da ferida.","Revascularização é mandatória (endovascular ou bypass) — sem fluxo, úlcera isquêmica não cicatriza.","Amputação só para membro inviável ou falha."],"takehome":"Terapia clínica reduz mortalidade; quem salva a perna é a revascularização.","area":"CI · Cirurgia vascular"},{"id":6,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":6}],"enunciado":["( FESAR) Mulher, de 25 anos, procura a emergência médica de sua cidade com relato de cólica nefrética, náuseas e vômitos com início há 4 horas. Após a realização de um TC de abdome, foi possível constatar um cálculo de 5 mm na região distal do ureter direito e a 1,8 cm da junção ureterovesical, bem como a presença de uma hidronefrose leve. Os exames laboratoriais não detectaram sinais de infecção.","Identifique dentre as alternativas abaixo, a conduta recomendada para o tratamento."],"alternativas":{"A":"Implante de cateter de Duplo-J para resolução da hidronefrose.","B":"Tratamento cirúrgico imediatamente em decorrência ao tamanho do cálculo.","C":"Administrar anti-inflamatório mais terapia expulsiva medicamentosa.","D":"Iniciar analgesia, anti-inflamatório, e antibiótico pelo risco de sepse."},"correta":"C","oficial":{},"oficial_extra":["O tratamento conservador, com o uso de analgésicos e anti-inflamatórios, é a primeira linha de tratamento para cálculos renais menores e em pacientes sem sinais de infecção ou complicações. Os anti-inflamatórios ajudam a reduzir a dor e a inflamação causada pela passagem do cálculo pelos ureteres. O uso de medicamentos que promovem a relaxação do ureter, como os alfa-bloqueadores, pode aumentar as chances de expulsão espontânea do cálculo. Esses medicamentos atuam relaxando a musculatura lisa do ureter, facilitando a passagem do cálculo. Tratamento cirúrgico imediato.","A cirurgia é indicada em casos de falha do tratamento conservador, cálculos muito grandes, obstrução prolongada ou infecção urinária. A realização de um procedimento cirúrgico nesse momento seria precoce e poderia expor a paciente a riscos desnecessários. Antibioticoterapia.","A antibioticoterapia é indicada em casos de infecção urinária. Como os exames de Maria não demonstraram infecção, o uso de antibióticos não é necessário nesse momento.","A hidronefrose leve indica obstrução parcial não havendo necessidade de colocação de cateter de Duplo-J.","Referência:","LOSCALZO, Joseph; FAUCI, Anthony S.; KASPER, Dennis L.; et al. Medicina Interna de Harrison. Porto Alegre: Grupo A, 2024. E-book. ISBN 9786558040231."],"refs":[],"tema":"Cólica nefrética / litíase ureteral","conceito":"Conduta depende de tamanho, localização e complicação. Cálculo ≤ 5 mm distal tem 70–80% de eliminação espontânea.","alt":{"A":"Duplo-J é para desobstruir urgência (infecção, rim único, LRA, dor refratária).","B":"5 mm é justamente a faixa de maior chance de sair sozinho.","C":"CORRETA. AINE (reduz pressão intraluminal) + tansulosina, que relaxa o ureter distal.","D":"Antibiótico não está indicado: exames excluíram infecção."},"roteiro":[],"takehome":"≤ 5 mm distal sem infecção = AINE + alfa-bloqueador. Febre + obstrução = drenagem imediata.","area":"CI · Urologia de emergência e escroto"},{"id":7,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":7}],"enunciado":["( UNITPAC) Um paciente diabético de 65 anos apresenta dor na panturrilha direita ao caminhar curtas distâncias, aliviada com repouso. Relata ainda sensação de frio e formigamento no pé direito, com piora progressiva nas últimas semanas. Ao exame físico, observa-se palidez no pé direito, diminuição dos pelos, pele fria e ausência de pulsos periféricos palpáveis. O índice tornozelo-braquial (ITB) medido foi de 0,4. Qual é a próxima conduta diagnóstica e terapêutica mais adequada?"],"alternativas":{"A":"Encaminhar para reabilitação física e prescrever anti-inflamatórios para alívio da dor.","B":"Orientar o uso de meias compressivas para melhorar a circulação periférica.","C":"Solicitar angiografia para avaliação do fluxo arterial e considerar revascularização.","D":"Iniciar tratamento com antibióticos para prevenir infecção e orientar repouso absoluto."},"correta":"C","oficial":{},"oficial_extra":["De acordo com as diretrizes da SBACV, pacientes com isquemia crítica (ITB < 0,4) e sinais de comprometimento grave, como ausência de pulsos e dor em repouso, são candidatos a uma avaliação mais aprofundada para intervenção revascularizadora. A angiografia (ou angiotomografia, dependendo da disponibilidade) é o exame padrão para mapear a obstrução arterial e planejar a abordagem cirúrgica ou endovascular, visando restabelecer o fluxo arterial e, assim, evitar a perda do membro. Este é o manejo correto com base no quadro clínico e o ITB.","Distratores:","Essa abordagem seria adequada para pacientes com claudicação intermitente leve a moderada, onde o tratamento conservador, como a reabilitação física supervisionada (caminhada controlada) e controle da dor, pode ser eficaz. No entanto, o ITB de 0,4 indica isquemia crítica, que não se beneficia apenas de medidas conservadoras. Anti-inflamatórios não são recomendados para o manejo da dor nesse contexto, uma vez que o problema é vascular e a dor é de origem isquêmica. A intervenção cirúrgica ou endovascular é preferível nesse estágio avançado da doença.","Embora pacientes com isquemia crítica possam estar em risco de infecção em casos de úlceras ou necrose, o paciente apresentado não tem sinais de infecção (ausência de febre, secreção purulenta ou úlceras abertas). Portanto, o uso preventivo de antibióticos não é indicado sem sinais clínicos de infecção. Além disso, o repouso absoluto pode piorar a perfusão, pois o exercício moderado pode ajudar a promover a circulação colateral. A prioridade deve ser revascularização, não o repouso prolongado.","O uso de meias compressivas é contraindicado em pacientes com Doença Arterial Periférica (DAP) avançada, especialmente com ITB abaixo de 0,5. A compressão pode agravar a isquemia ao aumentar a resistência ao fluxo arterial em membros já comprometidos. Meias compressivas são indicadas para condições venosas, como insuficiência venosa crônica, e não para DAP em estágio avançado.","• SOCIEDADE BRASILEIRA DE ANGIOLOGIA E DE CIRURGIA VASCULAR (SBACV). Diretrizes Clínicas para o Diagnóstico e Tratamento da Doença Arterial Obstrutiva Periférica. Revista Brasileira de Angiologia e Cirurgia Vascular, 2015.","BMJ Best Practice. Doença arterial periférica. 2024"],"refs":[],"tema":"DAP com ITB 0,4","conceito":"ITB 0,4 é o limiar da isquemia crítica. Havendo indicação de revascularização, o próximo exame é o que mapeia a anatomia.","alt":{"A":"Exercício supervisionado é para claudicação estável (ITB 0,5–0,9), não isquemia crítica.","B":"Meia compressiva é terapia venosa — contraindicada em isquemia arterial.","C":"CORRETA. Angiografia (ou angio-TC) define nível e extensão e orienta endovascular x bypass.","D":"Não há infecção descrita, e repouso absoluto é contraproducente."},"roteiro":[],"takehome":"ITB ≤ 0,4 muda o plano: mapeamento arterial + revascularização.","area":"CI · Cirurgia vascular"},{"id":8,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":8}],"enunciado":["( AFYA CRUZEIRO DO SUL) Menino, de 6 anos, é levado a uma consulta pelos pais devido a um histórico de sono agitado, roncos intensos e frequentes despertares noturnos. Durante o dia, a criança apresenta sonolência excessiva, dificuldades de concentração na escola e irritabilidade. No exame físico, o médico identifica hipertrofia das adenoides e amígdalas, além de uma leve retração torácica durante a inspiração. Após a realização de uma polissonografia, foi diagnosticada apneia obstrutiva do sono moderada. Diante do quadro clínico e dos achados diagnósticos do menino, qual é a conduta terapêutica mais indicada para o manejo do caso?"],"alternativas":{"A":"Iniciar tratamento com corticosteroides intranasais e acompanhar a evolução clínica por 6 meses antes de considerar cirurgia.","B":"Indicar o uso de pressão positiva contínua nas vias aéreas (CPAP) durante o sono como tratamento inicial de escolha.","C":"Indicar adenotonsilectomia como tratamento de primeira linha, visando a resolução da apneia obstrutiva do sono e das dissonias associadas.","D":"Recomendar mudanças no estilo de vida, como perda de peso e melhora da higiene do sono, como terapia primária."},"correta":"C","oficial":{},"oficial_extra":["Adenotonsilectomia é considerada a terapia de primeira linha para crianças com apneia obstrutiva do sono moderada a grave, especialmente quando associada a hipertrofia das amígdalas e adenoides. Este procedimento é eficaz na resolução da obstrução das vias aéreas superiores, o que melhora significativamente os sintomas respiratórios noturnos e as dissonias, além de prevenir complicações neurocognitivas e comportamentais decorrentes do sono inadequado. As outras alternativas, embora possam ser usadas em casos específicos ou como complementares, não substituem a necessidade de intervenção cirúrgica em um quadro como o apresentado."],"refs":["TOY, Eugene C. et al. Casos clínicos em medicina de família e comunidade. Tradução: Fabiana Buassaly Leistner. Revisão técnica: Carla Helena Augustin Schwanke, Winston Weber Benjamin. Porto Alegre: AMGH, 2015.","BMJ Best Practice. Dissonias em Criança. Última atualização: 14 mar. 2023."],"tema":"SAOS na infância","conceito":"Na criança a causa é anatômica (hipertrofia adenotonsilar); no adulto, obesidade. Por isso criança opera e adulto usa CPAP.","alt":{"A":"Corticoide nasal serve para SAOS leve; esperar 6 meses expõe a repercussão neurocognitiva.","B":"CPAP em criança é 2ª linha (SAOS residual, contraindicação cirúrgica, obesidade/síndromes).","C":"CORRETA. Adenotonsilectomia é primeira linha na SAOS moderada a grave com hipertrofia.","D":"Higiene do sono é coadjuvante; a obstrução aqui é mecânica."},"roteiro":[],"takehome":"Criança com SAOS + amígdalas grandes = cirurgia. CPAP é raciocínio de adulto.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":9,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":9}],"enunciado":["( UNIREDENTOR) Paciente do sexo masculino, 25 anos, comparece a um ambulatório de cirurgia com queixas de aumento progressivo do volume escrotal, há cerca de 5 anos, sem outras queixas associadas. Nega comorbidade e nega fazer uso de medicamentos contínuos. Possui alergia a iodopovidine. Nega tabagismo e etilismo. No exame físico, encontramos aumento do volume escrotal, com massa flutuante e teste da transluminação positiva. Pensando na principal hipótese diagnóstica, qual das seguintes características é mais típica dessa patologia?"],"alternativas":{"A":"Sinais flogísticos locais.","B":"Aumento de volume no escroto que não reduz.","C":"Dor intensa e constante na bolsa escrotal.","D":"Presença de nódulo fixo e duro no testículo acometido."},"correta":"B","oficial":{},"oficial_extra":["A hipótese diagnóstica é de hidrocele, uma patologia que se caracteriza pela presença de aumento da bolsa escrotal que não se reduz a noite, presença de massa flutuante (seria o testículo no meio líquido) e teste da transluminação local positiva.","Referência:","SMITH, Donald R.; TANAGHO, Emil A.; MCANINCH, Jack W. Smith Urologia geral. 13. ed. Rio de Janeiro: Guanabara Koogan, 1994. 559 p. ISBN 8527702738 (broch.)."],"refs":[],"tema":"Massa escrotal — hidrocele","conceito":"Três perguntas: transilumina? reduz? dói? Hidrocele transilumina, não reduz e é indolor. Hérnia reduz; varicocele reduz em decúbito; tumor é duro, fixo e não transilumina.","alt":{"A":"Sinais flogísticos sugerem orquiepididimite, não crescimento indolor de 5 anos.","B":"CORRETA. Aumento que não reduz é característico da hidrocele.","C":"Dor intensa aponta torção, epididimite ou trauma.","D":"Nódulo duro e fixo descreve tumor — cuidado com hidrocele reativa a tumor."},"roteiro":[],"takehome":"Transilumina e não reduz = hidrocele. Hidrocele recente em jovem pede ultrassom.","area":"CI · Urologia de emergência e escroto"},{"id":10,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2024.2","num":10}],"enunciado":["( UNITPAC) Um homem de 65 anos, com histórico de infarto do miocárdio há dois anos, sem novos eventos cardíacos desde então, consulta seu médico por causa de disfunção erétil. O paciente não apresenta sintomas de angina e está estável do ponto de vista cardiovascular, tomando uma estatina e um inibidor da ECA. O médico considera prescrever um inibidor da 5- fosfodiesterase. Qual dos seguintes fatores é mais importante para determinar se o paciente pode iniciar o tratamento com segurança?"],"alternativas":{"A":"Função hepática.","B":"Função renal.","C":"Capacidade funcional cardiovascular.","D":"Nível de testosterona."},"correta":"C","oficial":{"C":"Para pacientes com histórico de doença cardiovascular, como infarto do miocárdio, a avaliação da capacidade funcional cardiovascular é crucial antes de iniciar o tratamento com inibidores da PDE5. O paciente deve ser capaz de realizar atividades físicas de intensidade moderada, como subir dois lances de escada, sem apresentar sintomas de angina ou outros sinais de insuficiência cardíaca. Esta avaliação ajuda a determinar se o coração do paciente pode suportar a atividade sexual, que aumenta a demanda cardíaca."},"oficial_extra":["Bibliografia:","KIRBY, M. et al. Erectile dysfunction and cardiovascular disease: Public health implications. *European Heart Journal*, v. 34, n. 27, p. 2034-2046, 2013."],"refs":[],"tema":"Disfunção erétil e risco cardiovascular","conceito":"DE é marcador de doença endotelial e precede evento coronariano em 2–5 anos. Antes do inibidor de PDE5, avalie se o paciente tolera o esforço sexual (3–5 METs: subir dois lances de escada).","alt":{"A":"Função hepática afeta dose, não a segurança principal.","B":"Idem para função renal.","C":"CORRETA. Capacidade funcional cardiovascular é o que decide.","D":"Testosterona é causa possível de DE, não critério de segurança."},"roteiro":[],"takehome":"PDE5 + nitrato = proibido. Antes disso, cheque se o coração aguenta 3–5 METs.","area":"CI · Urologia de emergência e escroto"},{"id":11,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":1}],"enunciado":["(UNITPAC) Uma paciente de 65 anos, com histórico de tabagismo de 40 maços/ano, apresenta tosse persistente há três meses, acompanhada de perda de peso não intencional de 5 kg e episódios ocasionais de hemoptise. A radiografia de tórax mostra uma massa no lobo superior direito, e a tomografia computadorizada de tórax confirma uma lesão de 3 cm, além de linfonodos mediastinais aumentados.","Diante desse quadro, qual é o próximo exame mais adequado para investigação diagnóstica e estadiamento da doença?"],"alternativas":{"A":"Biópsia pulmonar transtorácica por agulha fina.","B":"PET-CT (Tomografia por Emissão de Pósitrons).","C":"Broncoscopia com biópsia.","D":"Videotoracoscopia com biópsia pulmonar."},"correta":"C","oficial":{},"oficial_extra":["A broncoscopia permite a visualização direta das vias aéreas e a obtenção de biópsias de lesões centrais ou próximas aos brônquios principais. Dada a localização da massa no lobo superior direito e a presença de linfonodos mediastinais aumentados, a broncoscopia é indicada para obter amostras teciduais para diagnóstico histopatológico.","Distratores:","Embora seja útil para lesões periféricas, a biópsia transtorácica apresenta maior risco de complicações, como pneumotórax, especialmente em lesões próximas ao mediastino. Neste caso, a broncoscopia é mais indicada.","O PET-CT é fundamental no estadiamento do câncer de pulmão, avaliando a extensão da doença e a presença de metástases. Contudo, para o diagnóstico histopatológico inicial, métodos que obtenham amostras teciduais, como a broncoscopia, são prioritários.","A videotoracoscopia é uma técnica invasiva, geralmente reservada para casos em que métodos menos invasivos não foram diagnósticos. Dada a acessibilidade da lesão por broncoscopia, esta deve ser a primeira escolha."],"refs":["INSTITUTO NACIONAL DE CÂNCER (INCA). Versão para profissionais de saúde: câncer de pulmão. Disponível em: https://www.gov.br/inca/pt-br/assuntos/cancer/tipos/pulmao/versao-para- profissionais-de-saude. Acesso em: 11 mar. 2025.","FERNANDEZ, Angelo; JATENE, Fabio B.; ZAMBONI, Mauro. Diagnóstico e estadiamento do câncer de pulmão. Jornal Brasileiro de Pneumologia, v. 28, n. 4, p. 219, jul./ago. 2002. Disponível em: https://jbp.org.br/details/460/pt-BR/diagnostico-e-estadiamento-do-cancer-de- pulmao. Acesso em: 11 mar. 2025.","SOCIEDADE BRASILEIRA DE PNEUMOLOGIA E TISIOLOGIA (SBPT). Consensos e Diretrizes da SBPT. Lung cancer screening in Brazil: recommendations from the Brazilian Society of Thoracic Surgery, Brazilian Thoracic Association, and Brazilian College of Radiology and Diagnostic Imaging – 2024. 2024. Disponível em: https://sbpt.org.br/portal/consensos-e-diretrizes-da-sbpt/. Acesso em: 11 mar. 2025."],"tema":"Câncer de pulmão — método de biópsia","conceito":"O método é escolhido pela localização: central/peri-hilar ou linfonodo mediastinal → broncoscopia (± EBUS); periférica → punção transtorácica; inacessível → videotoracoscopia.","alt":{"A":"Punção transtorácica é para lesão periférica; aqui teria menor rendimento e mais pneumotórax.","B":"PET-CT estadia, mas não dá histologia.","C":"CORRETA. Broncoscopia com biópsia — lesão central, e com EBUS estadia o mediastino no mesmo ato.","D":"Videotoracoscopia é mais invasiva; fica para falha dos métodos menores."},"roteiro":[],"takehome":"Central → broncoscopia. Periférica → punção. PET estadia, não diagnostica.","area":"CI · Neoplasias pulmonares"},{"id":12,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":2}],"enunciado":["(FASA VIC) Um homem de 72 anos, sem comorbidades significativas, é atendido no ambulatório de urologia após o diagnóstico de câncer de próstata localizado. O paciente apresenta PSA de 12 ng/mL, escore de Gleason 4+4 (8) na biópsia e estadiamento clínico T2bN0M0 evidenciado na ressonância magnética multiparamétrica. Encontra-se assintomático e deseja saber qual é a melhor opção de tratamento.","Com base nas diretrizes atuais para o manejo do câncer de próstata, qual é a conduta mais adequada para este paciente?"],"alternativas":{"A":"Radioterapia associada à terapia de privação androgênica, pois se trata de um câncer de risco intermediário-alto.","B":"Vigilância ativa, pois ele não apresenta sintomas, e o câncer pode evoluir lentamente.","C":"Terapia hormonal isolada, pois os níveis de PSA estão elevados e indicam disseminação da doença.","D":"Prostatectomia parcial, pois o paciente tem bom estado geral e apresenta um tumor localizado de alto risco."},"correta":"A","oficial":{"A":"Alternativa correta: Radioterapia associada à terapia de privação androgênica, pois se trata de um câncer de risco intermediário-alto. Justificativa: O paciente apresenta um câncer de próstata localizado de alto risco, com PSA de 12 ng/mL, escore de Gleason 4+4 (8) e estadiamento clínico T2bN0M0. De acordo com as diretrizes da Sociedade Brasileira de Urologia (SBU) e das principais sociedades internacionais (NCCN, EAU, AUA), a melhor conduta para tumores de alto risco é radioterapia externa combinada com terapia de privação androgênica (ADT). Essa estratégia demonstrou melhores taxas de controle oncológico e sobrevida."},"oficial_extra":["Análise das alternativas incorretas:","A vigilância ativa é indicada para tumores de baixo risco (PSA <10, Gleason ≤6, estadiamento T1- T2a). Como este caso é de alto risco, a vigilância não é apropriada.","A prostatectomia radical, e não parcial, poderia ser uma opção, mas a abordagem cirúrgica isolada apresenta maior risco de recorrência para tumores de alto risco, muitas vezes necessitando de terapia complementar.","A privação androgênica isolada não é tratamento primário para câncer de próstata localizado. Seu uso isolado não é suficiente para controle oncológico a longo prazo."],"refs":["TOWNSEND, Courtney M.; BEAUCHAMP, R. Daniel; EVERS, B. Mark; MATTOX, Kenneth L. Sabiston Tratado de Cirurgia: a base biológica da prática cirúrgica moderna. Tradução do Colégio Brasileiro de Cirurgiões. 21ª ed. Rio de Janeiro: Guanabara Koogan, 2024. 2128 p. ISBN 978-85- 9515-981-5.","NCCN Clinical Practice Guidelines in Oncology (NCCN Guidelines®): Prostate Cancer, 2023.","SOCIEDADE BRASILEIRA DE UROLOGIA (SBU). Tratado de Urologia. 2ª ed. Rio de Janeiro: Atheneu, 2018."],"tema":"Câncer de próstata localizado — alto risco","conceito":"D'Amico/NCCN: baixo (PSA < 10 E Gleason ≤ 6 E ≤ T2a); intermediário (PSA 10–20 OU Gleason 7 OU T2b); alto (PSA > 20 OU Gleason ≥ 8 OU ≥ T2c). Basta um critério para subir de faixa.","alt":{"A":"CORRETA. Alto risco = prostatectomia radical OU radioterapia + bloqueio androgênico prolongado (18–36 meses).","B":"Vigilância ativa é para baixo risco; Gleason 8 é deixar progredir.","C":"Hormonioterapia isolada não é curativa em doença localizada.","D":"Não existe 'prostatectomia parcial' em oncologia prostática — a cirurgia é radical."},"roteiro":[],"takehome":"Gleason 8 já define alto risco sozinho. Cuidado com o distrator 'prostatectomia parcial'.","area":"CI · Urologia (HPB e próstata)"},{"id":13,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":3}],"enunciado":["(UNITPAC) Um paciente de 45 anos, professor, comparece ao ambulatório com disfonia persistente há 3 meses. Refere que a rouquidão teve início insidioso, sem associação com infecção respiratória, trauma vocal ou exposição a irritantes. Relata também uma sensação de “caroço na garganta” e disfagia leve para líquidos, além de uso frequente da voz no trabalho. No exame físico geral, não há alterações orofaríngeas visíveis.","Com base nas queixas e histórico, qual é a conduta mais adequada neste momento?"],"alternativas":{"A":"Iniciar fonoaudiologia preventiva e reavaliar em 30 dias, considerando o uso vocal excessivo.","B":"Prescrever anti-inflamatórios não esteroidais e inibidor de bomba de prótons por 14 dias.","C":"Acalmar o paciente e orientar hidratação vocal, pois a ausência de tabagismo e dor exclui risco de lesão.","D":"Solicitar videolaringoscopia, pois a disfonia persiste por mais de 2 semanas sem causa definida."},"correta":"D","oficial":{},"oficial_extra":["De acordo com as recomendações do BMJ Best Practice, da Sociedade Brasileira de Otorrinolaringologia e da American Academy of Otolaryngology, a disfonia persistente por mais de 2-3 semanas, sem causa evidente, já é indicação formal de videolaringoscopia. A investigação precoce é essencial para diagnosticar lesões benignas (como nódulos ou pólipos), paralisia de pregas vocais ou até neoplasias iniciais. O paciente também apresenta sinais de alarme, como disfagia associada.","Distratores:","Embora o uso vocal excessivo justifique terapia fonoaudiológica, ela não deve ser iniciada antes da avaliação da laringe, especialmente em disfonia persistente sem diagnóstico. Pode atrasar o diagnóstico de lesões estruturais.","Tratamento empírico com AINEs e IBPs sem exame da laringe não é indicado, pois pode mascarar sintomas ou atrasar o diagnóstico de lesões. Só deve ser considerado após avaliação otorrinolaringológica.","A ausência de fatores de risco clássicos (como tabagismo) não exclui neoplasia ou disfunções vocais estruturais. A disfonia crônica deve ser sempre investigada com videolaringoscopia."],"refs":["SOCIEDADE BRASILEIRA DE OTORRINOLARINGOLOGIA E CIRURGIA CÉRVICO-FACIAL (ABORL-CCF). Tratado de Otorrinolaringologia e Cirurgia Cérvico-Facial. São Paulo: ABORL- CCF, 2017.","BMJ BEST PRACTICE. Hoarseness in adults – assessment and referral criteria. BMJ Publishing Group. Disponível em: https://bestpractice.bmj.com/topics/en-us/3000110. Acesso em: 06 mar. 2025.","PANDOLFI, M.; FUKUSHIRO, A. P. Disfonia – avaliação e conduta. In: RICHTER, M. et al. (Org.). Manual de Otorrinolaringologia da USP. São Paulo: Manole, 2020.","AMERICAN ACADEMY OF OTOLARYNGOLOGY - HEAD AND NECK SURGERY. Clinical Practice Guideline: Hoarseness (Dysphonia) (Update). Otolaryngol Head Neck Surg. 2018;158(1_suppl): S1-S42."],"tema":"Disfonia persistente","conceito":"Rouquidão > 2–3 semanas sem causa evidente exige videolaringoscopia. Não existe tratamento de prova. Sinais de alarme: disfagia, odinofagia, otalgia, massa cervical, tabagismo.","alt":{"A":"Fonoterapia é tratamento — não se trata antes de saber o que é.","B":"AINE + IBP presume refluxo sem diagnóstico; atrasa a investigação.","C":"Falso: ausência de tabagismo não exclui câncer, e tumor inicial de prega vocal é indolor.","D":"CORRETA. Disfonia > 3 semanas + disfagia = videolaringoscopia."},"roteiro":[],"takehome":"Rouquidão > 3 semanas = olhe a laringe.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":14,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":4}],"enunciado":["(UNINOVAFAPI) Uma mulher de 43 anos, sem comorbidades, dá entrada no pronto-socorro após torcer o tornozelo direito ao descer do ônibus há 30 minutos. A paciente refere dor intensa no tornozelo direito, associada a edema, equimose importante e incapacidade de carga (não consegue apoiar o pé no chão para caminhar).","Com base no quadro clínico e na abordagem diagnóstica, assinale a alternativa correta."],"alternativas":{"A":"A radiografia deve ser feita em qualquer caso de torção do tornozelo com edema e equimose.","B":"A radiografia deve ser feita apenas se houver dor na borda posterior do maléolo medial ou lateral.","C":"Solicitar radiografia devido à dor no tornozelo e não conseguir apoiar o pé para caminhar.","D":"A radiografia não é necessária, pois a paciente não apresenta sinais clínicos evidentes de fratura."},"correta":"C","oficial":{},"oficial_extra":["A alternativa correta é:","- As Regras de Ottawa indicam radiografia quando há dor no tornozelo associada a incapacidade de carga ou dor na borda posterior do maléolo medial/lateral.","- Como a paciente não consegue apoiar o pé, a radiografia é necessária.","Distratores:","- A incapacidade de carga é um critério das Regras de Ottawa para solicitar radiografia, então a afirmação é equivocada.","- A dor no maléolo medial/lateral é um dos critérios para indicação da radiografia, mas não é o único. A incapacidade de carga também é suficiente para justificar o exame.","- Edema e equimose isoladamente não são critérios suficientes para solicitar radiografia, pois muitas lesões de partes moles não envolvem fratura."],"refs":["BACHMANN, LM. et al. Accuracy of Ottawa ankle rules to exclude fractures of the ankle and mid- foot: systematic review. BMJ, v. 326, p. 417, 2003. Disponível em: https://www.bmj.com/content/326/7386/417. Acesso em: 05 abr. 2025.","STIELL, IG. et al. Implementation of the Ottawa ankle rules. JAMA, v. 271, n. 11, p. 827-832, 1994.","UP TO DATE. Clinical decision rules for foot and ankle imaging in the emergency department. Disponível em: https://www.uptodate.com. Acesso em: 05 abr. 2025."],"tema":"Regras de Ottawa — tornozelo","conceito":"Radiografia se dor maleolar E um dos três: dor à palpação da borda posterior/ponta do maléolo lateral, do medial, ou incapacidade de dar 4 passos (no trauma e na avaliação).","alt":{"A":"Edema e equimose sozinhos não indicam radiografia — quase toda entorse tem os dois.","B":"O 'apenas' quebra a alternativa: a incapacidade de carga também basta.","C":"CORRETA. Dor maleolar + incapacidade de apoiar o pé = critério preenchido.","D":"Ela tem um sinal relevante: não suporta peso."},"roteiro":[],"takehome":"O critério mais esquecido é a incapacidade de dar 4 passos.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":15,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":5}],"enunciado":["(AFYA PARAÍBA) Um paciente do sexo masculino, 45 anos, está internado na enfermaria para tratamento de queimaduras superficiais extensas. Durante a internação, apresenta perda de peso significativa e fraqueza muscular.","Para avaliar seu estado nutricional, foi solicitado um painel bioquímico.","Com base nos dados clínicos e laboratoriais, assinale a alternativa que apresenta o achado mais indicativo de desnutrição proteico-calórica neste paciente."],"alternativas":{"A":"Linfócitos totais acima de 2.000 células/mm³.","B":"Albumina sérica de 4,2 g/dL.","C":"Creatinina sérica de 0,8 mg/dL.","D":"Transtirretina com valor de 12 mg/dL."},"correta":"D","oficial":{"B":"Albumina sérica de 4,2 g/dL - Valor dentro da faixa normal (3,5–5,0 g/dL).","A":"Linfócitos totais acima de 2.000 células/mm³."},"oficial_extra":["Pré-albumina (transtirretina) é um marcador sensível e precoce do estado nutricional proteico- calórico, especialmente em situações agudas ou de rápida evolução, como no caso de pacientes queimados ou gravemente enfermos.","A pré-albumina tem meia-vida curta (2 a 3 dias), sendo mais útil do que a albumina para detectar mudanças recentes no estado nutricional.","Um valor de 12 mg/dL está abaixo do de referência normal (16–35 mg/dL), indicando desnutrição proteico-calórica moderada a grave.","Está diretamente relacionada à síntese hepática de proteínas e ao catabolismo aumentado comum em pacientes com queimaduras extensas.","Distratores:","A albumina tem meia-vida longa (~20 dias) e pode permanecer normal mesmo em pacientes desnutridos, especialmente em estados inflamatórios ou agudos, onde seu valor pode ser influenciado por resposta de fase aguda, hidratação ou estado hepático, não refletindo bem a desnutrição aguda.","Um número normal ou elevado de linfócitos não indica desnutrição. Na verdade, linfocitopenia (< 1.200) poderia ser um sinal de desnutrição proteico-calórica severa, por comprometimento imunológico.","Portanto, um valor normal não sugere desnutrição.","Creatinina sérica de 0,8 mg/d.","A creatinina é um marcador de função renal e de massa muscular, mas não é específica para avaliação do estado nutricional proteico-calórico.","Em pacientes com queimaduras, a creatinina pode estar normal mesmo com catabolismo importante, especialmente se houver hidratação agressiva, como é comum no manejo inicial das queimaduras."],"refs":["Waitzberg DL. Nutrição oral, enteral e parenteral na prática clínica. 5ª ed. São Paulo: Atheneu; 2021.","Sociedade Brasileira de Nutrição Parenteral e Enteral (BRASPEN). Diretrizes de Terapia Nutricional no Paciente Queimado. 2022."],"tema":"Marcadores nutricionais","conceito":"Meia-vida define o uso: albumina ~20 dias (tardio), transferrina ~8–10 dias, pré-albumina 2–3 dias (precoce). Todas caem na inflamação — interprete com PCR.","alt":{"A":"Linfócitos > 2.000 é normal; desnutrição cursa com linfopenia.","B":"Albumina 4,2 está na faixa normal (3,5–5,0).","C":"Creatinina 0,8 é normal.","D":"CORRETA. Transtirretina 12 (VR 16–35) — única fora da faixa e a mais sensível ao catabolismo agudo."},"roteiro":[],"takehome":"Pré-albumina = agudo; albumina = tardio. Cheque os valores de referência antes do conceito.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":16,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":6}],"enunciado":["(UNITPAC) Uma professora de 34 anos procura atendimento devido a rouquidão progressiva há três meses, associada a fadiga vocal ao longo do dia e sensação de esforço para falar. Relata que não sente dor, mas nota que a voz piora ao final do expediente.","No exame físico, não há linfonodomegalias cervicais palpáveis. A laringoscopia indireta revela lesões bilaterais pequenas e simétricas na borda livre das pregas vocais, associadas a hiperemia leve. O movimento das pregas vocais está preservado e não há sinais de lesão exofítica.","Com base na apresentação clínica e nos achados do exame físico, qual é o diagnóstico mais provável?"],"alternativas":{"A":"Nódulos vocais.","B":"Papilomatose laríngea.","C":"Carcinoma de laringe.","D":"Refluxo laringofaríngeo."},"correta":"A","oficial":{"C":"O carcinoma de laringe geralmente ocorre em pacientes tabagistas e acima de 50 anos. No exame, seria esperado um nódulo exofítico unilateral, fixação da prega vocal e possível linfonodomegalia. O histórico clínico não é compatível com neoplasia maligna."},"oficial_extra":["Os nódulos de cordas vocais são lesões benignas mais comuns em profissionais da voz, como professores, cantores e palestrantes. Associada ao uso excessivo e inadequado da voz (fonotrauma). Caracteriza-se por lesões bilaterais simétricas na borda livre das pregas vocais, geralmente na junção do terço médio com o terço anterior da prega vocal.","Distratores:","Causada pelo Papilomavírus Humano (HPV), apresenta-se com lesões verrucosas ou exofíticas, podendo ser múltiplas. Mais comum na infância ou em adultos jovens com infecção persistente por HPV. O exame não mostra lesões sugestivas de papilomatose.","Pode causar rouquidão persistente, mas geralmente é intermitente, piorando pela manhã. Os achados endoscópicos mais comuns são hiperemia difusa e edema de aritenoides, sem lesões focais bilaterais. O paciente não apresenta queixas gastrointestinais associadas, como pirose ou regurgitação."],"refs":["BMJ Best Practice. Benign vocal fold lesions: diagnosis and management. London: BMJ Publishing Group, 2024. Disponível em: https://bestpractice.bmj.com. Acesso em: 05 abr. 2025.","SOCIEDADE BRASILEIRA DE OTORRINOLARINGOLOGIA E CIRURGIA CÉRVICO-FACIAL (ABORL-CCF). Diretrizes para Diagnóstico e Tratamento de Lesões Benignas da Laringe. 2023. Disponível em: https://www.aborlccf.org.br. Acesso em: 05 abr. 2025."],"tema":"Nódulos vocais","conceito":"Nódulo: bilateral, simétrico, na junção do terço anterior com o médio, por fonotrauma. Pólipo é unilateral; edema de Reinke é difuso e de tabagista; granuloma fica no processo vocal.","alt":{"A":"CORRETA. Professora, fadiga vocal, lesões bilaterais e simétricas, mobilidade preservada. Tratamento é fonoterapia.","B":"Papilomatose (HPV) dá lesões verrucosas, múltiplas e recidivantes.","C":"Carcinoma: mais velho, tabagista, lesão unilateral, fixação da prega.","D":"Refluxo dá edema difuso e espessamento interaritenoideo, não duas lesões simétricas."},"roteiro":[],"takehome":"Bilateral e simétrico = nódulo. Unilateral = investigue.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":17,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":7}],"enunciado":["( FASA VIC) Um homem de 68 anos comparece ao ambulatório com queixa de jato urinário fraco, hesitação miccional e aumento da frequência urinária noturna nos últimos 12 meses. Ele não apresenta hematúria, dor óssea ou perda ponderal. Ao exame físico, a próstata está aumentada, de consistência elástica e sem nodulações palpáveis. O PSA sérico encontra-se em 2,5 ng/mL. A ultrassonografia demonstra resíduo urinário pós-miccional de 50 mL e volume prostático estimado em 40 cm³.","Com base nesse quadro clínico, qual deve ser a conduta inicial mais adequada para esse paciente?"],"alternativas":{"A":"Iniciar inibidor da 5-alfa-redutase como monoterapia, devido ao volume prostático aumentado.","B":"Realizar biópsia prostática para excluir carcinoma prostático.","C":"Prescrever alfa-bloqueador, devido a sintomas moderados com impacto na qualidade de vida.","D":"Indicar prostatectomia radical devido ao aumento prostático e risco oncológico."},"correta":"C","oficial":{"C":"Prescrever alfa-bloqueador, devido a sintomas moderados com impacto na qualidade de vida. (Correta): Os alfa-bloqueadores, como a tansulosina e a doxazosina, são a primeira linha de tratamento para sintomas moderados a graves da hiperplasia prostática benigna (HPB), pois atuam relaxando a musculatura do colo vesical e da próstata, melhorando o fluxo urinário. No caso apresentado, o paciente tem sintomas miccionais sugestivos de HPB sem sinais de malignidade, com PSA dentro da normalidade e próstata de tamanho moderado, tornando essa a melhor conduta inicial.","B":"Realizar biópsia prostática para excluir carcinoma prostático. (Incorreta): A biópsia prostática está indicada quando há suspeita de câncer de próstata, geralmente em pacientes com nódulos prostáticos ao toque retal ou elevação do PSA. O paciente em questão não apresenta esses achados.","D":"Indicar prostatectomia radical devido ao aumento prostático e risco oncológico. (Incorreta): A prostatectomia radical é indicada para câncer de próstata localizado e não para HPB isolada. Esse paciente não tem sinais clínicos ou laboratoriais sugestivos de neoplasia maligna, portanto, essa conduta não é apropriada.","A":"Iniciar inibidor da 5-alfa-redutase como monoterapia, devido ao volume prostático aumentado. (Incorreta): Os inibidores da 5-alfa-redutase, como a finasterida e a dutasterida, reduzem o volume prostático e são indicados para próstatas maiores (>40 cm³), especialmente quando há risco de retenção urinária ou falha com alfa-bloqueadores. No entanto, para sintomas moderados em uma próstata de 40 cm³ sem complicações, a monoterapia com alfa-bloqueadores é preferível inicialmente."},"oficial_extra":[],"refs":["TOWNSEND, Courtney M.; BEAUCHAMP, R. Daniel; EVERS, B. Mark; MATTOX, Kenneth L. Sabiston Tratado de Cirurgia: a base biológica da prática cirúrgica moderna. Tradução do Colégio Brasileiro de Cirurgiões. 21. ed. Rio de Janeiro: Guanabara Koogan, 2024. 2128 p. ISBN 978-85- 9515-981-5.","GOLDMAN, Lee; SCHAFER, Andrew I. Goldman-Cecil Medicina. Grupo GEN, 2022."],"tema":"HPB — tratamento inicial","conceito":"IPSS ≤ 7 sem incômodo: observar. IPSS ≥ 8 com impacto: alfa-bloqueador (age em dias). 5-ARI entra se próstata > 30–40 g (efeito em 6–12 meses e reduz o PSA pela metade). Cirurgia só com complicação.","alt":{"A":"5-ARI isolado demora meses; não alivia agora.","B":"Nada sugere câncer: toque liso, PSA 2,5 normal.","C":"CORRETA. Sintomas moderados com impacto, sem complicação = alfa-bloqueador.","D":"Prostatectomia radical é cirurgia oncológica; na HPB a cirurgia é desobstrutiva."},"roteiro":[],"takehome":"Alfa-bloqueador = alívio rápido; 5-ARI = volume a longo prazo.","area":"CI · Urologia (HPB e próstata)"},{"id":18,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2025.1","num":8}],"enunciado":["(BANCO AFYA) Homem, 27 anos, chega na unidade de pronto atendimento com relato torção do tornozelo direito ao descer uma escada correndo. Ele refere dor lateral imediata, com pouca dificuldade de apoio e leve edema. Ao exame físico, não há sensibilidade à palpação sobre o maléolo lateral, leve edema e hematoma, sem deformidades evidentes. O paciente consegue dar passos com limitação moderada.","a) Quais critérios clínicos devem ser avaliados para definir a necessidade de radiografia no caso descrito?","b) Qual o tratamento conservador inicial mais indicado para este tipo de lesão, segundo diretrizes clínicas?"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Padrão de Resposta Esperado:","a)","Deve-se aplicar a Regra de Ottawa para tornozelo:","• Dor à palpação em qualquer um dos maléolos (lateral ou medial) e","• Incapacidade de suportar peso imediatamente após o trauma e no serviço de saúde (não consegue dar 4 passos).","Se esses critérios forem atendidos, a radiografia é indicada. No caso, como o paciente consegue caminhar e não há dor no maléolo medial, a radiografia pode ser evitada.","b)","O tratamento conservador inicial inclui o protocolo PRICE:","• Proteção da articulação (tornozeleira ou imobilização leve)","• Repouso relativo","• Ice (gelo local por 20 minutos, 3–4x/dia)","• Compressão (com bandagem elástica)","• Elevação do membro afetado","Analgesia com anti-inflamatórios ou analgésicos também pode ser indicada. O início precoce de mobilização leve é importante para prevenir rigidez e promover recuperação funcional.","Bibliografia:","1. HERTZ, B. S.; BENJAMIN, T. & MULLER, M. E. Ortopedia e Traumatologia: Princípios e Prática. 5. ed. Porto Alegre: Artmed, 2020.","2. BRASIL. Ministério da Saúde. Protocolo de Urgência e Emergência em Traumatismos Osteoarticulares. Brasília: MS, 2022.","3. BACHMANN, L. M. et al. Accuracy of Ottawa ankle rules to exclude fractures of the ankle and mid-foot: systematic review. BMJ, v. 326, n. 7386, p. 417, 2003.","4. SOCIEDADE BRASILEIRA DE ORTOPEDIA E TRAUMATOLOGIA (SBOT). Diretrizes para atendimento de lesões ligamentares do tornozelo. São Paulo: SBOT, 2020."],"refs":[],"tema":"Ottawa negativo + tratamento da entorse","conceito":"Aqui os critérios NÃO são preenchidos (sem dor à palpação maleolar, deambula), então dispensa radiografia. A entorse em inversão lesa o ligamento talofibular anterior.","alt":{},"roteiro":["a) Critérios de Ottawa: dor maleolar + (palpação da borda posterior/ponta do maléolo lateral OU medial OU incapacidade de 4 passos). Para o pé: base do 5º metatarso ou navicular.","Aplicação: nenhum critério preenchido → radiografia dispensável.","Limitações: não vale para < 18 anos, intoxicados, déficit sensitivo ou lesão distratora.","b) PRICE/POLICE: proteção, carga precoce conforme a dor, gelo 15–20 min 3–4x/dia por 48–72 h, compressão e elevação.","Analgesia simples ou AINE por curto período; mobilização precoce e propriocepção para prevenir instabilidade crônica.","Imobilização rígida prolongada é proscrita em entorse grau I–II."],"takehome":"Ottawa serve para EXCLUIR radiografia. O tratamento moderno é carga precoce + propriocepção, não gesso.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":19,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.1","num":9},{"prova":"CI 3 2025.1","num":10}],"enunciado":["(UNITPAC) Um paciente do sexo masculino, 63 anos, com antecedente de tabagismo de 40 maços/ano, comparece à unidade de saúde com queixa de tosse seca persistente há 2 meses, perda de peso de 8 kg no período e dispneia progressiva aos esforços. Refere ainda rouquidão recente e dor torácica localizada. Ao exame físico, apresenta hipocratismo digital e estertores finos na base direita.","Foi solicitada radiografia de tórax, que revelou uma massa espiculada no lobo superior direito, associada à redução do volume pulmonar no mesmo hemitórax.","Com base no quadro clínico e radiológico, qual é a hipótese diagnóstica mais provável?"],"alternativas":{"A":"Neoplasia pulmonar primária do tipo não pequenas células.","B":"Tuberculose pulmonar em fase subaguda, com caverna oculta.","C":"Embolia pulmonar com infarto parenquimatoso e resposta inflamatória local.","D":"Pneumonia de lenta resolução com possível abscesso pulmonar."},"correta":"A","oficial":{},"oficial_extra":["A apresentação é clássica de câncer de pulmão não pequenas células (como o adenocarcinoma ou carcinoma escamoso). Sintomas como tosse persistente, perda de peso, dor torácica, rouquidão e hipocratismo digital, associados à imagem de massa espiculada com retração (sinal de desmoplasia tumoral), tornam essa a hipótese mais provável. O tabagismo é o principal fator de risco.","Distratores:","Abscesso pulmonar geralmente se apresenta com tosse produtiva, febre e escarro purulento, e radiologicamente com cavitação com nível hidroaéreo, o que não foi descrito.","Tuberculose pode simular neoplasia, mas geralmente apresenta-se com sintomas sistêmicos (febre, sudorese noturna, tosse com escarro) e acometimento apical. A massa espiculada com retração lobar favorece etiologia tumoral.","Embolia pulmonar pode causar dor torácica e dispneia, mas não está associada a massa espiculada, nem a sintomas de longa duração. Não explicaria perda ponderal progressiva ou hipocratismo."],"refs":["BMJ Best Practice. Non-small cell lung cancer: diagnosis and staging. BMJ Publishing Group. Disponível em: https://bestpractice.bmj.com/topics/en-us/3000116. Acesso em: 06 mar. 2025.","HARRISON, T. R. et al. Princípios de Medicina Interna. 21ª ed. Rio de Janeiro: AMGH, 2022.","SABISTON, D. C. Tratado de Cirurgia: a base biológica da prática cirúrgica moderna. 21. ed. Rio de Janeiro: Elsevier, 2022.","INCA – Instituto Nacional de Câncer. Neoplasias de pulmão: diretrizes diagnósticas e terapêuticas. Rio de Janeiro, 2023."],"tema":"Câncer de pulmão — quadro clínico","conceito":"Tabagista + tosse crônica + perda ponderal + massa espiculada com atelectasia. Rouquidão indica invasão do laríngeo recorrente (doença localmente avançada); hipocratismo é paraneoplásico.","alt":{"A":"CORRETA. Não pequenas células (~85% dos casos).","B":"TB simula, mas daria infiltrado com cavitação, febre vespertina e sudorese.","C":"TEP é evento agudo e não faz massa espiculada.","D":"Abscesso teria febre, escarro purulento e nível hidroaéreo."},"roteiro":[],"takehome":"Rouquidão nesse contexto não é laringite — é invasão do recorrente.","area":"CI · Neoplasias pulmonares"},{"id":20,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2025.1","num":10},{"prova":"CI 3 2025.1","num":12}],"enunciado":["(AFYA PARAÍBA) Na unidade de pronto atendimento, dá entrada uma jovem de 20 anos, com queimaduras, decorrentes de fogos de artifício, ocorridas há cerca de 1 hora. No exame físico, observa-se a presença de lesões em todo o membro superior esquerdo e na região genital. Existem áreas com bolhas rosas e dolorosas e áreas com bolhas secas, brancas e não dolorosas. A jovem pesa 80 kg. Considerando que a queimadura é uma doença grave que necessita de tratamento imediato, responda:","a) Qual é a área de superfície corporal queimada? (1,0)","b) Qual a hidratação a ser realizada, segundo a fórmula de Parkland? (1,5)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Padrão de respostas.","A - 10% (1,0).","O cálculo da superfície corporal queimada é baseado na regra dos 9, sendo no caso 9% de superfície corporal queimada em todo o membro superior esquerdo mais 1% de superfície corporal queimada da região genital, portanto a superfície corporal queimada é de 10%.","B - 2 x 10 x 80 = 1600 ml (0,5).","A paciente deve receber entre 800 ml de Soro Fisiológico nas primeiras 7h (0,5) e depois mais 800 ml de Soro Fisiológico nas outras 16h (0,5).","O cálculo da hidratação pela Fórmula de Parkland é 2 ml x Peso x Porcentagem de superfície corporal queimada.","Sendo 50% nas primeiras 8 hs e os 50% restantes nas 16 hs restantes, devendo ser iniciado nas primeiras 8h a partir da hora da queimadura.","Referência:","DOHERTY, Gerard M. CURRENT Cirurgia. Porto Alegre: Grupo A, 2017. E-book. ISBN 9788580556018. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788580556018/. Acesso em: 07 mar. 2025."],"refs":[],"tema":"Queimaduras — SCQ e Parkland","conceito":"Regra dos 9 no adulto: cabeça 9, cada MMSS 9, cada MMII 18, tronco anterior 18, posterior 18, genitália 1. Só contam 2º e 3º graus. Parkland clássica: 4 mL × peso × %SCQ (esta banca usou 2 mL, padrão ATLS 10/11), metade em 8 h a partir da hora da queimadura.","alt":{},"roteiro":["a) MMSS esquerdo 9% + genitália 1% = 10% de SCQ.","Profundidade: bolha rosada e dolorosa = 2º superficial; bolha seca, branca e indolor = 2º profundo/3º grau.","b) 2 × 80 × 10 = 1.600 mL em 24 h.","800 mL nas primeiras 8 h contadas da queimadura — já passou 1 h, então em 7 h (~114 mL/h); 800 mL nas 16 h seguintes.","Se a banca pedir Parkland clássica: 4 × 80 × 10 = 3.200 mL.","Titule pela diurese: 0,5 mL/kg/h no adulto. Queimadura de genitália é critério de encaminhamento a centro de queimados."],"takehome":"1º grau não entra na conta e o relógio começa na hora da queimadura.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":21,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":1}],"enunciado":["(FIP Guanambi) Paciente do sexo feminino, 35 anos, comparece ao ambulatório de otorrinolaringologia com queixa de disfonia progressiva há 2 meses, acompanhada de rouquidão ao falar e leve disfagia para sólidos. Relata ser cantora amadora, fazendo uso frequente da voz em apresentações. Nega tabagismo, etilismo e antecedentes familiares de câncer. No exame físico, observa-se tensão dos músculos laríngeos. A videolaringoscopia evidencia espessamentos bilaterais simétricos nas bordas livres das pregas vocais, sem sinais de lesão infiltrativa.","Com base no caso clínico, qual é o diagnóstico mais provável?"],"alternativas":{"A":"Paralisia unilateral de prega vocal.","B":"Nódulos vocais bilaterais benignos.","C":"Neoplasia maligna de laringe e pregas vocais.","D":"Laringite crônica com hipertrofia de pregas vocais."},"correta":"B","oficial":{"C":"Neoplasia maligna de laringe e pregas vocais: improvável em paciente jovem, sem fatores de risco (tabagismo/etilismo), com lesão simétrica e superficial, e sem sintomas de alarme, como perda ponderal.","A":"Paralisia unilateral de prega vocal: esperaria-se assimetria, rouquidão súbita, voz soprosa e ausência de movimento em uma das pregas — não condizente com a apresentação."},"oficial_extra":["A presença de disfonia progressiva, associada ao uso excessivo da voz e aos achados na videolaringoscopia de nódulos simétricos nas pregas vocais, é característica de uma lesão laríngea benigna, como nódulos vocais. Esse quadro diferencia-se das causas malignas pela ausência de fatores de risco como tabagismo, etilismo ou sintomas de alarme (dor, emag
