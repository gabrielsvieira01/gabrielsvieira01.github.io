recimento ou massas visíveis).","Quadro clínico típico (mulher jovem, profissional da voz), evolução subaguda e achado de espessamentos simétricos nas pregas vocais são clássicos para nódulos vocais.","Distratores:","Laringite crônica costuma causar edema difuso ou hiperemia, não espessamentos bem localizados e simétricos."],"refs":["Associação Brasileira de Otorrinolaringologia. Tratado de Otorrinolaringologia. 3.ª ed. Rio de Janeiro: GEN Guanabara Koogan, 2017. E-book. p. 1. ISBN 9788595154247. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788595154247/. Acesso em: 25 nov. 2024.","Sociedade Brasileira de Otorrinolaringologia e Cirurgia Cérvico-Facial. Associação Brasileira de Otorrinolaringologia e Cirurgia Cérvico-Facial (ABORL-CCF). Tratado de Otorrinolaringologia e Cirurgia Cérvico-Facial. São Paulo: ABORL-CCF, 2017.","BMJ BEST PRACTICE. Hoarseness in adults – assessment and diagnosis. BMJ Publishing Group. Disponível em: https://bestpractice.bmj.com/topics/en- us/3000110. Acesso em: 25 nov. 2024.","PANDOLFI, M. et al. Manual de Otorrinolaringologia da USP. São Paulo: Manole, 2020."],"tema":"Nódulos vocais (variação)","conceito":"Mesmo raciocínio: profissional da voz, lesões bilaterais e simétricas na borda livre, mobilidade preservada, sem fatores de risco.","alt":{"A":"Paralisia unilateral daria voz soprosa e uma prega imóvel.","B":"CORRETA. Nódulos vocais bilaterais benignos — tratamento é fonoterapia.","C":"Neoplasia exigiria lesão infiltrativa unilateral e fatores de risco.","D":"Laringite crônica dá hiperemia e edema difusos."},"roteiro":[],"takehome":"Tríade de alarme que mudaria tudo: unilateral + fixação da prega + fator de risco.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":22,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":2}],"enunciado":["(AFYA Paraíba) Paciente masculino, 68 anos, chega ao ambulatório queixando-se de dificuldade para urinar, com jato urinário fraco e esforço para iniciar a micção. Refere acordar duas a três vezes por noite para urinar e sensação de esvaziamento incompleto da bexiga. Nega febre, hematúria ou dor lombar. Ao toque retal, apresenta próstata aumentada de volume, fibroelástica, sem nódulos. Exames laboratoriais mostram creatinina normal e PSA dentro dos limites para idade. O exame de ultrassonografia de vias urinárias revela bexiga e rins sem alterações. Deste modo, marque a alternativa que apresenta a conduta inicial mais adequada para este paciente."],"alternativas":{"A":"Realizar uretrocistoscopia, urodinâmica e indicar uso de antibióticos por tempo prolongado.","B":"Iniciar tratamento com bloqueadores alfa-adrenérgicos e inibidores de 5 alfa redutase.","C":"Encaminhar diretamente para tratamento cirúrgico com prostatectomia aberta.","D":"Iniciar fitoterápicos e mudanças de hábitos, como diminuir a ingestão de líquidos e de álcool à noite."},"correta":"B","oficial":{},"oficial_extra":["Alternativa correta:","Iniciar tratamento farmacológico com bloqueadores alfa-adrenérgicos e inibidores de 5-alfa-redutase.","Comentário: O paciente apresenta sintomas urinários obstrutivos típicos de hiperplasia prostática benigna (HPB), sem sinais de complicações (como retenção urinária, hidronefrose ou insuficiência renal). Nesse contexto, o tratamento inicial recomendado é farmacológico. Os bloqueadores alfa-adrenérgicos promovem relaxamento da musculatura lisa prostática e do colo vesical, melhorando o fluxo urinário, e os inibidores da 5-alfa-redutase reduzem o tamanho da glândula – próstata; ambos acabam aliviando os sintomas.","Incorreta – A prostatectomia aberta está indicada em casos graves, geralmente quando a próstata é muito volumosa ou há complicações (retenção urinária recorrente, cálculos vesicais, hidronefrose). Não é a conduta inicial.","Incorreta – O quadro clínico não sugere infecção urinária e não há indicação de uretrocistoscopia ou urodinâmica. O uso de antibióticos não é indicado nesse cenário e poderia expor o paciente a efeitos adversos e resistência bacteriana desnecessária.","Incorreta – mudanças de hábitos e fitoterápicos podem ser utilizados em casos selecionados, mas não são indicados no presente caso, pois o paciente apresenta sintomas moderados. Com indicação de tratamento inicial, deve priorizar drogas com eficácia comprovada, como os alfa-bloqueadores e inibidores da 5-alfa- redutase."],"refs":["Brasil. Ministério da Saúde. Protocolo de Encaminhamento da Atenção Básica para a Atenção Especializada: Urologia. Brasília: Ministério da Saúde, 2016. Disponível em: https://bvsms.saude.gov.br/bvs/publicacoes/protocolos_atencao_basica_especializad a_urologia_v_VI .pdf. Acesso em: 20 ago. 2025.","Sociedade Brasileira de Urologia. Diretrizes Brasileiras de Câncer de Próstata 2020- 2022. Rio de Janeiro: SBU, 2020. Disponível em: https://portaldaurologia.org.br/wp content/uploads/2020/12/Diretrizes-Cancer-de-Prostata-2020-2022.pdf. Acesso em: 20 ago. 2025.","Sociedade Brasileira de Urologia. Diretrizes Brasileiras de Hiperplasia Prostática Benigna 2018-2019. Rio de Janeiro: SBU, 2018. Disponível em: https://portaldaurologia.org.br/wp content/uploads/2018/12/Diretrizes-HPB-2018- 2019.pdf. Acesso em: 20 ago. 2025."],"tema":"HPB — terapia combinada","conceito":"Alfa-bloqueador + 5-ARI é a melhor estratégia a longo prazo em próstata aumentada com risco de progressão (MTOPS/CombAT: reduz retenção e cirurgia).","alt":{"A":"Cistoscopia e urodinâmica são de 2ª linha; antibiótico prolongado não tem indicação.","B":"CORRETA. Sintomas típicos, próstata aumentada, sem complicação = tratamento farmacológico combinado.","C":"Prostatectomia aberta é para próstata > 80–100 g com falha clínica.","D":"Fitoterápico não supera placebo; medidas comportamentais isoladas são insuficientes."},"roteiro":[],"takehome":"Próstata volumosa = alfa-bloqueador (rápido) + 5-ARI (volume).","area":"CI · Urologia (HPB e próstata)"},{"id":23,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":3}],"enunciado":["(UNIGRANRIO Caxias) Mariana, 55 anos, fumante (20 pacotes-ano, parou há 5 anos), apresenta tosse persistente há 3 meses, perda de peso de 5 kg e episódios de dor torácica. Tomografia de tórax evidencia uma lesão pulmonar de 3,5 cm no lobo superior direito, com espessamento pleural adjacente e ausência de linfonodomegalias hilopulmonares evidentes.","Aponte o próximo passo diagnóstico mais apropriado para confirmação histológica da suspeita de neoplasia pulmonar."],"alternativas":{"A":"Realizar biópsia percutânea com agulha guiada por CT da lesão.","B":"Solicitar PET-CT antes da biópsia para melhor caracterização tumoral.","C":"Encaminhar diretamente para ressecção cirúrgica sem confirmação histológica.","D":"Realizar broncoscopia com biópsia endobrônquica."},"correta":"A","oficial":{},"oficial_extra":["Lesões periféricas e próximas à pleura, sem acometimento endobrônquico visível, são mais bem acessadas por biópsia transtorácica guiada por CT, que tem alta sensibilidade e especificidade.","Esta abordagem é minimamente invasiva e permite diagnóstico histopatológico com segurança razoável.","Além disso, deve-se obter o diagnóstico histológico antes de qualquer tratamento definitivo ou estadiamento avançado (ex. PET-CT).","Distratores:","(PET-CT antes da biópsia):","Embora útil para estadiamento e avaliação de metástases, não substitui a confirmação histológica, que deve ser o primeiro passo após imagem sugestiva.","(Ressecção cirúrgica sem confirmação histológica):","Abordagem não indicada, pois exige confirmação diagnóstica antes de qualquer tratamento invasivo.","(Broncoscopia com biópsia endobrônquica):","Indicado preferencialmente para lesões centrais. No caso de lesão periférica, a sensibilidade da broncoscopia é menor.","Referência:","BRASIL. Sociedade Brasileira de Pneumologia e Tisiologia. Diretrizes para diagnóstico e tratamento do câncer de pulmão. J Pneumol, 2024."],"refs":[],"tema":"Biópsia em lesão pulmonar periférica","conceito":"Lesão periférica/subpleural sem componente endobrônquico → punção transtorácica guiada por TC (rendimento ~90% em lesões > 2 cm; pneumotórax em 15–25%). Histologia sempre antes do tratamento.","alt":{"A":"CORRETA. Lesão periférica com espessamento pleural adjacente é alvo ideal para punção guiada por TC.","B":"PET não substitui tecido — inflamação também capta.","C":"Ressecar sem confirmação só em situações muito selecionadas.","D":"Broncoscopia tem baixo rendimento em lesão periférica."},"roteiro":[],"takehome":"Periférica = agulha pela pele. Tecido primeiro, PET depois.","area":"CI · Neoplasias pulmonares"},{"id":24,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":4}],"enunciado":["(UNINOVAFAPI) Homem de 62 anos, tabagista 40 maços-ano, refere dor progressiva no ombro esquerdo há 3 meses, irradiando para a borda ulnar do antebraço e mão, acompanhada de parestesias em 4º e 5º dedos e fraqueza dos interósseos. Nota ptose palpebral discreta e miose ipsilateral; nega febre. Relata ainda tosse pouco produtiva e perda de 6 kg no período. Qual hipótese sindrômica melhor explica o conjunto de sinais e sintomas?"],"alternativas":{"A":"Síndrome da veia cava superior.","B":"Pericardite neoplásica constritiva.","C":"Síndrome de Pancoast-Tobias.","D":"Neuropatia compressiva do túnel cubital."},"correta":"C","oficial":{"A":"Síndrome da veia cava superior cursa com edema/pletora facial, turgência jugular e dilatação venosa torácica; o quadro neurológico ulnar + Horner não é típico."},"oficial_extra":["Dor no ombro irradiando para trajeto ulnar + déficit do plexo braquial inferior (C8– T1) + sinais de Horner (ptose, miose) compõem a síndrome de Pancoast, típica de tumor pulmonar apical com invasão do plexo e do gânglio simpático estrelado, sobretudo em grande tabagista.","Pericardite dá dor torácica pleurítica/posicional e atrito pericárdico; não explica déficits de C8–T1 nem Horner.","Neuropatia ulnar isolada não justificaria dor referida ao ombro nem perda ponderal relevante."],"refs":["NATIONAL COMPREHENSIVE CANCER NETWORK (NCCN). Clinical Practice Guidelines in Oncology: Non-Small Cell Lung Cancer. Version 3.2025.","AMATO, Marcelo C.; AMATO, Valter D. Tratado de Clínica Cirúrgica. 3. ed. São Paulo: Manole, 2015. v. 2, p. 1450-1475.","SABISTON, David C. Sabiston Textbook of Surgery: The Biological Basis of Modern Surgical Practice. 21. ed. Philadelphia: Elsevier, 2022."],"tema":"Síndrome de Pancoast-Tobias","conceito":"Tumor do ápice pulmonar que invade o plexo braquial inferior (C8–T1: dor ulnar, parestesia em 4º/5º dedos, fraqueza de interósseos) e o gânglio estrelado (Horner: ptose, miose, anidrose).","alt":{"A":"Veia cava superior dá edema facial, turgência jugular e circulação colateral.","B":"Pericardite dá dor pleurítica posicional, não déficit de C8–T1.","C":"CORRETA. Dor ulnar + déficit C8–T1 + Horner em tabagista pesado.","D":"Neuropatia ulnar isolada não explica Horner nem perda de 6 kg."},"roteiro":[],"takehome":"Dor de ombro com miose e ptose nunca é ortopédica — olhe o ápice pulmonar.","area":"CI · Neoplasias pulmonares"},{"id":25,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":5}],"enunciado":["(UNITPAC) Um paciente masculino, 40 anos, está internado na UTI para tratamento de queimaduras térmicas de segundo grau, acometendo cerca de 30% da superfície corporal total. Após 7 dias, apresenta perda de peso de 6%, fraqueza muscular e cicatrização lenta das áreas afetadas.","Exames laboratoriais foram solicitados para avaliação nutricional: albumina sérica: 3,2 g/dL (VR: 3,5–5,0 g/dL); pré-albumina (transtirretina): 10 mg/dL (VR: 16–35 mg/dL); linfócitos totais: 1.050 células/mm³ (VR: 1.000–4.800 células/mm³); proteína C reativa (PCR): 24 mg/L (VR: <6 mg/L).","Considerando o contexto clínico e os resultados laboratoriais, qual é a melhor interpretação do estado nutricional desse paciente?"],"alternativas":{"A":"A hipoalbuminemia confirma desnutrição, pois é um marcador confiável mesmo em situações inflamatórias.","B":"A pré-albumina reduzida reflete somente a inflamação e não permite avaliar a condição nutricional atual.","C":"A contagem de linfócitos dentro da normalidade descarta desnutrição, apesar da baixa de proteínas plasmáticas.","D":"A combinação de baixa pré-albumina, PCR elevada e perda de peso indica desnutrição proteico-calórica."},"correta":"D","oficial":{},"oficial_extra":["A pré-albumina baixa, associada à PCR elevada e perda ponderal significativa, aponta para desnutrição proteico-calórica, apesar da resposta inflamatória. A interpretação integrada dos dados clínicos e laboratoriais é essencial em pacientes críticos, como queimados.","Distratores:","A albumina tem meia-vida longa (~20 dias) e sofre interferência de inflamação, hidratação e função hepática. Não é confiável isoladamente em contextos agudos.","Linfócitos totais de 1.050/mm³ estão no limite inferior e podem ser suprimidos por estresse ou infecção. Não excluem desnutrição.","Embora a pré-albumina sofra influência da inflamação, valores persistentemente baixos, associados a dados clínicos, têm alto valor diagnóstico na prática hospitalar."],"refs":["BMJ BEST PRACTICE. Nutritional support in burn patients. BMJ Publishing Group. Disponível em: https://bestpractice.bmj.com. Acesso em: 06 mar. 2025.","UP TO DATE. Nutritional support in burn patients. Waltham, MA: Wolters Kluwer Health, 2024.","TOWNSEND, C. M. et al. Sabiston – Tratado de Cirurgia: a base biológica da prática cirúrgica moderna. 21. ed. Rio de Janeiro: Elsevier, 2022.","BRASIL. Ministério da Saúde. Protocolo Nutricional para Pacientes Queimados. Brasília: MS, 2016."],"tema":"Estado nutricional no crítico","conceito":"Inflamação e desnutrição coexistem no paciente crítico — não são hipóteses concorrentes. O diagnóstico (GLIM) exige um critério fenotípico (perda de peso, massa muscular) + um etiológico (baixa ingesta ou inflamação).","alt":{"A":"Albumina é péssimo marcador isolado: meia-vida longa e cai por inflamação, hemodiluição e exsudação da ferida.","B":"Exagera: a pré-albumina sofre da inflamação, mas com PCR e perda de peso continua útil.","C":"1.050/mm³ está no limite inferior, e linfócitos não confirmam nem excluem desnutrição.","D":"CORRETA. Perda de 6% do peso + pré-albumina 10 + PCR 24 = desnutrição proteico-calórica com inflamação."},"roteiro":[],"takehome":"A alternativa certa costuma ser a que COMBINA dados, não a que se apoia num exame só.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":26,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":6}],"enunciado":["(AFYA Santa Inês) Homem, 72 anos, comparece para retorno no ambulatório de urologia com o resultado de exames solicitados na primeira consulta. Na ocasião inicial, relatou nictúria e jato urinário fraco. O exame de toque retal revelou próstata aumentada e endurecida em um dos lobos, além de apresentar PSA de 9,2 ng/mL.","Agora, retorna com o resultado da biópsia prostática, que confirma adenocarcinoma de próstata com escore de Gleason 7 (3+4). O paciente não possui comorbidades significativas e apresenta expectativa de vida superior a 10 anos.","Considerando as diretrizes atuais para o manejo do câncer de próstata, qual é a conduta mais adequada para este paciente?"],"alternativas":{"A":"Iniciar vigilância ativa, visto que se trata de câncer de próstata localizado em paciente idoso, evitando intervenções desnecessárias.","B":"Indicar radioterapia ou prostatectomia radical, já que o paciente tem boa expectativa de vida e câncer de risco intermediário.","C":"Prescrever bloqueio hormonal isolado, pois a idade avançada contraindica procedimentos cirúrgicos.","D":"Realizar apenas tratamento sintomático para hiperplasia prostática benigna, visto que o PSA está abaixo de 10 ng/mL."},"correta":"B","oficial":{"B":"Alternativa correta: Indicar radioterapia ou prostatectomia radical, já que o paciente tem boa expectativa de vida e câncer de risco intermediário. Pacientes com câncer de próstata localizado, risco intermediário (Gleason 7, PSA entre 10 e 20 ng/mL ou estágio clínico T2b) e expectativa de vida superior a 10 anos devem receber tratamento definitivo com prostatectomia radical ou radioterapia."},"oficial_extra":["Comentário para as demais alternativas:","A vigilância ativa é indicada para baixo risco e tumores indolentes.","O bloqueio hormonal isolado não é recomendado como monoterapia inicial em câncer localizado.","O tratamento apenas da HBP é incorreto, pois já há diagnóstico histológico de câncer."],"refs":["EUROPEAN ASSOCIATION OF UROLOGY. Prostate Cancer Guidelines. 2025. Disponível em: https://uroweb.org/guidelines/prostate-cancer. Acesso em: 28 set. 2025. WEIN, Alan J. Campbell-Walsh Urologia. 11. ed. Rio de Janeiro: GEN Guanabara Koogan, 2018. E-book. ISBN 978-85-951520-38."],"tema":"Câncer de próstata — risco intermediário","conceito":"Gleason 7 = ISUP 2 (3+4, favorável) ou 3 (4+3, desfavorável). O segundo eixo da decisão é a expectativa de vida: tratamento definitivo só faz sentido com > 10 anos.","alt":{"A":"Vigilância ativa é para baixo risco; 'idoso' não é critério — 72 anos saudável tem expectativa > 10 anos.","B":"CORRETA. Risco intermediário + expectativa > 10 anos = prostatectomia radical OU radioterapia (± ADT curta).","C":"Idade não contraindica cirurgia, e ADT isolada não é curativa.","D":"Já há diagnóstico histológico de adenocarcinoma; PSA < 10 não exclui câncer."},"roteiro":[],"takehome":"Duas perguntas decidem: grupo de risco e expectativa de vida.","area":"CI · Urologia (HPB e próstata)"},{"id":27,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":7}],"enunciado":["(AFYA Ipatinga) Você atende em Unidade de Pronto Atendimento um paciente, masculino, 23 anos, previamente hígido, com entorse no tornozelo direito há cerca de uma hora. Refere dor lateral, dificuldade para sustentar o peso e incapacidade de realizar quatro passos completos. Ao exame: edema discreto no maléolo lateral, dor à palpação nos últimos 6 cm da fíbula distal, sem dor no maléolo medial ou na base do quinto metatarso e exame neurovascular preservado. Pelas Regras de Ottawa, foi solicitada radiografia em (03 incidências), sem evidência de fratura ou incongruência articular.","Quais as medidas iniciais adequadas para o manejo desse paciente:"],"alternativas":{"A":"iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão, elevar o membro e indicar imobilização rígida com tala gessada por dez dias.","B":"iniciar anti-inflamatório esteroidal, aplicar gelo, realizar compressão, elevar o membro e orientar repouso relativo com suporte funcional precoce.","C":"iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão e elevar o membro, orientar repouso relativo com suporte funcional precoce.","D":"iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão, elevar o membro e adiar os exercícios de mobilidade por cerca de três semanas."},"correta":"C","oficial":{"A":"Alternativa: Iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão, elevar o membro e indicar imobilização rígida com tala gessada por dez dias.","B":"Alternativa: Iniciar anti-inflamatório esteroidal, aplicar gelo, realizar compressão, elevar o membro e orientar repouso relativo com suporte funcional precoce."},"oficial_extra":["Comentários e fundamentação da questão:","No caso de entorse de tornozelo sem fratura evidenciada ao raio-X, o manejo inicial tem como objetivo controlar a dor, reduzir o processo inflamatório e prevenir complicações funcionais. A radiografia foi solicitada com base nos critérios das Regras de Ottawa, pois o paciente apresentava dor localizada nos últimos 6 cm da fíbula distal, associada à incapacidade de realizar quatro passos completos sem dor, dois achados que, isoladamente ou em conjunto, indicam a necessidade de investigação radiográfica para afastar fratura. Como não houve fratura ou incongruência articular, optou-se por tratamento conservador. O uso de anti- inflamatórios não esteroidais é indicado para analgesia e controle do edema. A aplicação de gelo em ciclos reduz a resposta inflamatória local e proporciona alívio sintomático. A compressão com bandagem auxilia no controle do edema e dá suporte articular. A elevação do membro favorece o retorno venoso e linfático, diminuindo o inchaço. Além disso, a orientação de repouso relativo é fundamental, permitindo a cicatrização dos tecidos lesionados sem impor imobilização prolongada desnecessária, enquanto o estímulo à mobilidade funcional precoce, com suporte adequado, reduz o risco de rigidez articular, atrofia muscular e facilita a recuperação funcional completa.","Análise das alternativas:","Apesar de iniciar corretamente com anti-inflamatórios não esteroidais, gelo, compressão e elevação, erra ao indicar imobilização rígida com tala gessada por dez dias, conduta que não é recomendada para entorses sem fratura, pois favorece rigidez e retarda a reabilitação funcional.","O uso de anti-inflamatórios esteroidais não é indicado no manejo inicial do entorse agudo do tornozelo, uma vez que não têm o mesmo perfil de segurança e eficácia dos anti-inflamatórios não esteroidais; embora o restante da conduta esteja adequado, essa escolha farmacológica invalida a alternativa.","Alternativa: Iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão, elevar o membro e adiar os exercícios de mobilidade por cerca de três semanas.","Inclui corretamente o uso de anti-inflamatórios não esteroidais, gelo, compressão e elevação, mas erra ao adiar os exercícios de mobilidade por cerca de três semanas, já que a mobilização funcional precoce é parte essencial da recuperação e reduz o risco de sequelas.","Alternativa: Iniciar anti-inflamatório não esteroidal, aplicar gelo, realizar compressão e elevar o membro, orientar repouso relativo com suporte funcional precoce.","Está de acordo com a análise inicial, contemplando o uso de anti-inflamatórios não esteroidais, medidas físicas (gelo, compressão e elevação), repouso relativo e estímulo à mobilidade funcional precoce com suporte adequado, configurando a conduta inicial correta.","Referência:","DynaMed. Ankle sprain in adults. Ipswich (MA): EBSCO Information Services. Disponível em: https://www.dynamed.com/condition/ankle-sprain-in-adults#GUID- 1111B540-7974-4013-B9A8-7243EAE0B3F8. Acesso em: 16 ago. 2025."],"refs":[],"tema":"Entorse sem fratura — manejo","conceito":"Sem fratura, o tratamento é funcional (POLICE). Imobilização rígida prolongada causa rigidez, atrofia e instabilidade crônica.","alt":{"A":"Tudo certo até a tala gessada por 10 dias.","B":"O erro é 'anti-inflamatório ESTEROIDAL' — corticoide não tem indicação e prejudica a cicatrização ligamentar.","C":"CORRETA. AINE + gelo + compressão + elevação + suporte funcional precoce.","D":"Adiar mobilidade por 3 semanas é o mesmo erro da A."},"roteiro":[],"takehome":"Em alternativas quase iguais, leia a última cláusula — é onde está o erro.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":28,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2025.2","num":8}],"enunciado":["(FACIMPA) Um homem de 52 anos procura atendimento ambulatorial, relatando rouquidão persistente há cerca de seis semanas, associada a leve dificuldade para engolir alimentos sólidos. Ele nega tabagismo atual, mas relata ter fumado por mais de 20 anos, interrompendo o hábito há cinco anos. Ao exame físico inicial, não há linfonodomegalias palpáveis, e a oroscopia não mostra alterações significativas. Diante do quadro clínico, qual a conduta adequada neste momento?"],"alternativas":{"A":"Solicitar tomografia computadorizada de tórax de rotina para afastar comprometimento pulmonar.","B":"Iniciar tratamento empírico com corticoide oral e reavaliar a resposta clínica em dois meses.","C":"Indicar videolaringoscopia para investigação de possível lesão estrutural ou massa laríngea.","D":"Reforçar medidas de higiene vocal e observar por mais três meses antes de solicitar exames."},"correta":"C","oficial":{},"oficial_extra":["A presença de disfonia persistente superior a quatro semanas deve sempre ser valorizada, principalmente quando acompanhada de sintomas de alarme, como disfagia, odinofagia, estridor, hemoptise ou histórico de tabagismo. Nessas situações, a simples observação clínica pode atrasar o diagnóstico de doenças relevantes, incluindo lesões laríngeas benignas e malignas. A videolaringoscopia é o exame de escolha, pois permite a avaliação direta da laringe, das pregas vocais e da mobilidade glótica, além de possibilitar a identificação precoce de alterações anatômicas e massas laríngeas. O reconhecimento rápido dessas condições é essencial para definir a necessidade de tratamento especializado e para evitar complicações decorrentes do atraso no diagnóstico."],"refs":["BRASIL. Ministério da Saúde. Protocolos de Atenção às Condições Crônicas nas Redes de Atenção à Saúde. Brasília: MS, 2022. Tratado de Medicina de Família e Comunidade. 3ª edição. Artmed, 2020."],"tema":"Disfonia com fator de risco","conceito":"52 anos, ex-tabagista de 20 anos (risco persiste 10–15 anos após cessar) e disfagia. Glótico dá disfonia precoce; supraglótico se manifesta tarde com disfagia e otalgia.","alt":{"A":"TC de tórax não avalia a laringe.","B":"Corticoide empírico por 2 meses é atraso diagnóstico.","C":"CORRETA. Videolaringoscopia; se houver lesão, laringoscopia direta com biópsia.","D":"Observar mais 3 meses em paciente de risco é a pior opção."},"roteiro":[],"takehome":"Oroscopia normal não tranquiliza — a laringe não é vista na oroscopia.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":29,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2025.2","num":9}],"enunciado":["(AFYA Itabuna) Você é o médico residente de plantão na emergência. Uma mulher de 32 anos, pesando 80 kg, foi trazida ao pronto-socorro cerca de 30 minutos após sofrer queimaduras por chama direta em um acidente doméstico.","A paciente encontra-se consciente, orientada e com sinais vitais estáveis , sem evidências de lesão inalatória até o momento.","No exame físico, foram identificadas queimaduras de espessura parcial (2º grau superficial a profundo) distribuídas nas seguintes regiões corporais:","Face anterior do tronco (incluindo tórax e abdome);","Face anterior e posterior do membro inferior esquerdo;","Face anterior do membro superior direito.","Nenhuma outra área corporal apresenta lesões visíveis.","a) Calcule, com base na Regra dos Nove de Wallace, a porcentagem total da área de superfície corporal queimada (TBSA). ( 0,5 ponto)","b) Aplique a fórmula de Parkland para calcular o volume total de reposição com solução de Ringer Lactato nas primeiras 24 horas para este paciente. ( 0,5 ponto)","c) Distribua o volume calculado conforme as diretrizes da fórmula de Parkland. Informe quanto deve ser administrado nas primeiras 8 horas e quanto nas 16 horas seguintes. ( 0,5 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) Regra dos Nove de Wallace – Adulto:","Face anterior do tronco (tórax + abdome): 18%.","Membro inferior esquerdo (anterior + posterior): 9% + 9% = 18%.","Face anterior do membro superior direito: 4,5%.","Total da TBSA queimada = 18% + 18% + 4,5% = 40,5%.","Resposta: 40,5%.","b) Aplicando a fórmula de Parkland:","Volume = 4 × 80 × 40,5 = 12.960 mL de Ringer Lactato.","Resposta: 12.960 ml de Ringer Lactato.","c) Distribuição da reposição:","Primeira metade em 8 horas (a partir do momento da queimadura):","12.960 ÷ 2 = 6.480 mL nas primeiras 8 horas.","Segunda metade nas 16 horas seguintes:","6.480 mL nas 16 horas seguintes.","Resposta: 6.480 mL nas primeiras 8 horas e 6.480 mL nas 16 horas seguintes."],"refs":["AMERICAN COLLEGE OF SURGEONS. Manual do curso: Suporte Avançado de Vida em Trauma – ATLS®. 11. ed. Chicago: American College of Surgeons, 2025.","NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS – NAEMT. PHTLS: Suporte de Vida no Trauma Pré-Hospitalar. 10. ed. [S.l.]: Jones & Bartlett Learning, 2025."],"tema":"Queimaduras — Regra dos Nove e Parkland (4 mL)","conceito":"Atenção: esta banca usou Parkland clássica (4 mL), diferente da questão 20. Regra dos 9: cada membro superior 9% (4,5% anterior + 4,5% posterior); cada inferior 18% (9% + 9%); tronco anterior 18%.","alt":{},"roteiro":["a) Tronco anterior 18% + MMII esquerdo inteiro 18% + MMSS direito anterior 4,5% = 40,5%.","b) 4 × 80 × 40,5 = 12.960 mL de Ringer lactato em 24 h.","c) 6.480 mL nas primeiras 8 h (contadas da queimadura; já passaram 30 min → ~864 mL/h) e 6.480 mL nas 16 h seguintes.","Ringer lactato e não SF: grandes volumes de salina dão acidose hiperclorêmica.","Alvo: diurese 0,5 mL/kg/h (~40 mL/h). Excesso de volume causa 'fluid creep'.","SCQ ≥ 20% já é critério de reposição formal e de centro de queimados."],"takehome":"'Face anterior do membro superior' vale 4,5%, não 9% — é o erro mais comum da conta.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":30,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2025.2","num":10}],"enunciado":["(UNIGRANRIO CAXIAS) Um jogador de futebol de 32 anos chega ao pronto-socorro após torção do tornozelo direito durante uma partida. Relata dor intensa e dificuldade para caminhar. Ao exame, apresenta edema difuso, dor à palpação na borda posterior do maléolo lateral e incapacidade de dar quatro passos, tanto logo após o trauma quanto no pronto-socorro. Não há feridas abertas ou deformidades evidentes.","Com base nas Regras de Ottawa para entorse e fratura de tornozelo e nas melhores evidências:","a) Analise o caso e justifique se há ou não indicação de radiografia do tornozelo, descrevendo os critérios que embasam sua decisão.(1,0 ponto)","b) Explique como a aplicação correta dessas regras pode reduzir exames desnecessários e melhorar a conduta clínica em serviços de urgência.(0,5 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Resposta esperada:","a) “Sim, há indicação de solicitar radiografia, pois o paciente apresenta dor na região maleolar e dor à palpação no maléolo lateral, o que atende aos critérios das Regras de Ottawa para investigação de fratura de tornozelo.” (1,0 ponto)","b) O uso correto das Regras de Ottawa permite selecionar apenas os pacientes com maior probabilidade de fratura, evitando radiografias desnecessárias em entorses simples, o que resulta em redução de custos, menor exposição à radiação e maior eficiência no atendimento de urgência. (0,5 ponto)"],"refs":["Sabiston Cirurgia Geral, 20ª edição, capítulo sobre trauma e fraturas.","Cummings Otawa Ankle Rules in Clinical Practice, 2018), disponível em periódicos de ortopedia, que detalha a aplicação das regras de Otawa.","Cummings Orthopaedic Trauma, 4ª edição, edição atualizada, capítulos de fraturas de tornozelo.","STiELL, I. G. et al. Ottawa ankle rules for the use of radiography in acute ankle injuries. JAMA, 1993.","American College of Radiology. ACR Appropriateness Criteria: Acute Trauma to the Ankle, 2023."],"tema":"Ottawa positivo — justificar a indicação","conceito":"Dois critérios preenchidos. A regra tem sensibilidade ~98–100% e baixa especificidade: serve para EXCLUIR fratura com segurança.","alt":{},"roteiro":["a) SIM. Dois critérios independentes: dor à palpação da borda posterior do maléolo lateral E incapacidade de dar 4 passos no trauma e no atendimento.","Enumere os critérios completos (tornozelo e pé) na resposta — é o que vale ponto.","b) Sensibilidade próxima de 100% permite dispensar 30–40% das radiografias: menos radiação, menos custo, menor tempo na urgência.","Limitações: não validada em < 18 anos, intoxicados, déficit sensitivo, lesão distratora ou trauma > 10 dias."],"takehome":"Em discursiva de regra de decisão, enumere os critérios e aplique um a um — não basta responder 'sim'.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":31,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":1}],"enunciado":["(AFYA PATO BRANCO) Um paciente de 35 anos, professor de canto, procura atendimento médico queixando-se de rouquidão persistente há 3 meses. Ele relata esforço vocal excessivo durante as aulas e sensação de corpo estranho na garganta. Ao exame físico, observa-se hiperemia leve da laringe e presença de pequenas lesões nodulares bilaterais nas pregas vocais, compatíveis com nódulos vocais. Não há outros sinais ou sintomas relevantes.","Analise qual dos seguintes sinais e sintomas deve levantar suspeita de neoplasia maligna, não sendo característico de lesões laríngeas benignas."],"alternativas":{"A":"Sensação de corpo estranho na garganta e esforço vocal excessivo.","B":"Rouquidão persistente com duração superior a 3 semanas.","C":"Presença de lesões nodulares bilaterais nas pregas vocais.","D":"Dor de garganta persistente e unilateral, com irradiação para o ouvido."},"correta":"D","oficial":{"C":"A presença de lesões nodulares bilaterais nas pregas vocais é um achado característico de nódulos vocais, uma condição benigna.","D":"A dor de garganta persistente e unilateral, com irradiação para o ouvido, é um sinal de alerta para neoplasia maligna da laringe, pois pode indicar invasão tumoral de estruturas adjacentes."},"oficial_extra":["A rouquidão persistente, a sensação de corpo estranho e o esforço vocal excessivo são sintomas comuns em lesões laríngeas benignas, como nódulos vocais e laringite.","Referência:","Diretrizes diagnósticas e terapêuticas do câncer de cabeça e pescoço. Rio de Janeiro: INCA, 2022. Disponível em: https://www.inca.gov.br/publicacoes/diretrizes/diretrizes-diagnosticas-e- terapeuticas-do-cancer-de-cabeca-e-pescoco. Acesso em: 19 mar. 2026.","BMJ BEST PRACTICE. Laryngeal cancer. Londres: BMJ Publishing Group, 2024. Disponível em: https://bestpractice.bmj.com/topics/en-gb/3000121. Acesso em: 19 mar. 2026."],"refs":[],"tema":"Sinais de alarme na disfonia","conceito":"Questão invertida: pede o que NÃO é benigno. Red flags: otalgia reflexa, dor unilateral, odinofagia, disfagia, massa cervical, estridor, perda ponderal, lesão unilateral, fixação da prega.","alt":{"A":"Globus e esforço vocal são inespecíficos.","B":"Rouquidão > 3 semanas indica investigar, mas não discrimina benigno de maligno.","C":"Bilateralidade e simetria são assinatura de lesão benigna.","D":"CORRETA. Dor unilateral persistente com otalgia reflexa é alarme de neoplasia."},"roteiro":[],"takehome":"Otalgia com otoscopia normal em adulto de risco é câncer de cabeça e pescoço até prova em contrário.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":32,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":2},{"prova":"CI 3 2026.1","num":1}],"enunciado":["(AFYA ITAJUBÁ) Homem de 60 anos encontra-se internado na enfermaria após cirurgia abdominal por obstrução intestinal. No quarto dia de pós-operatório apresenta distensão abdominal, ausência de eliminação de flatos e persistência de íleo paralítico, impossibilitando alimentação por via oral. O paciente encontra-se hemodinamicamente estável, com trato gastrointestinal potencialmente funcional distalmente. A equipe assistente discute a melhor estratégia de suporte nutricional para evitar desnutrição e complicações associadas à internação prolongada. Considerando os princípios do suporte nutricional em pacientes hospitalizados, qual é a conduta mais adequada neste caso?"],"alternativas":{"A":"Introdução imediata de dieta oral hipercalórica para auxílio na resolução do íleo paralítico pós-operatório.","B":"Nutrição parenteral total administrada precocemente como primeira escolha em pacientes cirúrgicos hospitalizados.","C":"Manutenção apenas de hidratação venosa até retorno completo da função gastrointestinal para iniciar alimentação.","D":"Nutrição enteral por cateter nasoentérico, preferencial quando o trato gastrointestinal encontra-se funcional."},"correta":"D","oficial":{"B":"Nutrição parenteral total administrada precocemente como primeira escolha em pacientes cirúrgicos hospitalizados. Incorreta. A nutrição parenteral é indicada principalmente quando o trato gastrointestinal não pode ser utilizado. Quando há possibilidade de uso do trato digestivo, a nutrição enteral é preferida por ser mais fisiológica e apresentar menor risco de complicações.","C":"Manutenção apenas de hidratação venosa até retorno completo da função gastrointestinal para iniciar alimentação. Incorreta. A manutenção exclusiva de hidratação venosa pode levar à piora do estado nutricional em pacientes hospitalizados. Sempre que possível, deve-se instituir suporte nutricional adequado de forma precoce."},"oficial_extra":["Nutrição enteral por sonda digestiva, preferencial quando o trato gastrointestinal encontra-se funcional. Correta. A nutrição enteral é preferida sempre que o trato gastrointestinal estiver funcional, pois mantém a integridade da mucosa intestinal, apresenta menor risco de complicações infecciosas e contribui para melhor evolução clínica em pacientes hospitalizados.","Introdução imediata de dieta oral hipercalórica, mesmo na presença de íleo paralítico pós-operatório. Incorreta. Na presença de íleo paralítico, a alimentação oral pode agravar distensão abdominal e intolerância alimentar. Nesses casos, deve-se avaliar formas alternativas de suporte nutricional adequadas à condição clínica do paciente.","Referência:","DOHERTY, Gerard M. CURRENT Cirurgia. 14. ed. Porto Alegre: AMGH, 2017. E-book, p. 46. ISBN 9788580556018. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788580556018/. Acesso em: 04 mar. 2026."],"refs":[],"tema":"Suporte nutricional — enteral x parenteral","conceito":"'If the gut works, use it.' A enteral preserva a mucosa e reduz infecção. Íleo pós-operatório não contraindica enteral pós-pilórica: o delgado recupera motilidade em 6–12 h, o estômago em 24–48 h e o cólon em 48–72 h.","alt":{"A":"Dieta oral com íleo causa vômito e risco de aspiração.","B":"NPT como primeira escolha aumenta infecção de cateter, hiperglicemia e disfunção hepática.","C":"Só hidratação prolonga o jejum; o suporte deve começar em 24–48 h.","D":"CORRETA. Nutrição enteral por cateter nasoentérico pós-pilórico, iniciando em baixo volume."},"roteiro":[],"takehome":"Com íleo, a solução é passar o cateter além do piloro — não pular para a parenteral.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":33,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":3},{"prova":"CI 3 2026.1","num":10}],"enunciado":["(AFYA ARAGUAÍNA) Uma mulher de 42 anos procura o pronto atendimento após torção do tornozelo esquerdo ao descer um degrau. Refere dor intensa na região lateral do tornozelo e incapacidade de continuar caminhando após o trauma. Ao exame físico, apresenta edema importante na região maleolar lateral e dor à palpação na borda posterior do maléolo lateral. Não há dor no navicular nem na base do quinto metatarso.","De acordo com a Regra de Ottawa para tornozelo e pé, qual é a conduta mais adequada?"],"alternativas":{"A":"Solicitar radiografia do tornozelo devido à presença de dor à palpação na borda posterior do maléolo lateral.","B":"Não solicitar radiografia, pois a ausência de deformidade evidente reduz a probabilidade de fratura.","C":"Solicitar radiografia do tornozelo devido à presença de dor na região maleolar associada à incapacidade de deambular após o trauma.","D":"Não solicitar radiografia, pois a ausência de dor no navicular e na base do quinto metatarso afasta fratura do tornozelo."},"correta":"A","oficial":{"A":"Solicitar radiografia do tornozelo devido à presença de dor à palpação na borda posterior do maléolo lateral.","C":"Solicitar radiografia do tornozelo devido à presença de dor na região maleolar associada à incapacidade de deambular após o trauma.","B":"Não solicitar radiografia, pois a ausência de deformidade evidente reduz a probabilidade de fratura.","D":"Não solicitar radiografia, pois a ausência de dor no navicular e na base do quinto metatarso afasta fratura do tornozelo."},"oficial_extra":["Fundamentação: Regra de Ottawa (tornozelo);","Indica-se radiografia do tornozelo se houver:","Dor na região maleolar E pelo menos um dos critérios:","Dor à palpação na borda posterior ou ponta do maléolo lateral;","Dor à palpação na borda posterior ou ponta do maléolo medial;","Incapacidade de deambular por 4 passos imediatamente e na avaliação.","✔ Justificativa: A paciente apresenta:","Dor na região maleolar ✔","Dor à palpação na borda posterior do maléolo lateral ✔ (critério direto da regra).","Pela Regra de Ottawa, qualquer um desses critérios isoladamente já indica radiografia, independentemente de outros achados. Trata-se do critério mais específico do caso.","Distratores","✘ Justificativa: Embora a incapacidade de deambular seja um critério da regra, ela deve ser definida como:","Incapacidade de dar 4 passos, imediatamente e no atendimento.","O enunciado descreve incapacidade inicial, mas não confirma o critério formal dos “4 passos”. Além disso, essa alternativa não utiliza o achado mais objetivo e específico presente no caso (dor óssea maleolar posterior).","Portanto, apesar de plausível, não é a melhor resposta.","✘ Justificativa:","A Regra de Ottawa:","Não utiliza deformidade como critério diagnóstico.","Fraturas podem ocorrer sem deformidade visível, especialmente as não desviadas. A decisão deve ser baseada em:","dor óssea localizada;","incapacidade funcional.","Logo, a alternativa ignora os critérios validados da regra.","✘ Justificativa: Esses pontos anatômicos:","navicular.","base do 5º metatarso.","Pertencem à Regra de Ottawa para o pé, e não para o tornozelo.","A paciente apresenta critério positivo para tornozelo (dor maleolar posterior), o que indica radiografia independentemente da avaliação do pé.","Portanto, há erro conceitual na aplicação da regra."],"refs":["BRASIL. Ministério da Saúde. Protocolos de atenção à urgência e emergência. Brasília: Ministério da Saúde, 2014.","STIELL, Ian G. et al. Decision rules for the use of radiography in acute ankle injuries. JAMA, 1993.","Tintinalli's Emergency Medicine: A Comprehensive Study Guide.","Rosen's Emergency Medicine: Concepts and Clinical Practice."],"tema":"Ottawa — identificar o critério certo","conceito":"A banca testa QUAL critério o caso preenche. O enunciado não afirma incapacidade de 4 passos na avaliação, mas a dor à palpação da borda posterior do maléolo lateral está explícita.","alt":{"A":"CORRETA. Dor maleolar + palpação da borda posterior do maléolo lateral = critério direto.","B":"Ausência de deformidade não afasta fratura.","C":"A conduta coincide, mas a justificativa está errada: o critério de carga exige incapacidade no trauma E na avaliação.","D":"Navicular e base do 5º metatarso são critérios do PÉ, não do tornozelo."},"roteiro":[],"takehome":"Desconfie da alternativa cuja conduta está certa mas o motivo está errado.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":34,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":4},{"prova":"CI 3 2026.1","num":8}],"enunciado":["(AFYA SÃO JOÃO DEL-REI) Homem de 68 anos, em acompanhamento ambulatorial, refere jato fraco, hesitação miccional, sensação de esvaziamento incompleto e noctúria 3 vezes por noite há cerca de 1 ano. Nega hematúria ou febre. PSA dentro da normalidade para a faixa etária. No toque retal: próstata pouco aumentada, fibroelástica, sem nódulos. Foi aplicado o IPSS (International Prostate Symptom Score), com o seguinte resultado: sensação de esvaziamento incompleto: 3; frequência urinária aumentada: 2; intermitência: 3; urgência: 2; jato fraco: 4; esforço miccional: 2; noctúria: 3 — total IPSS = 19 pontos.","Considerando as diretrizes da Sociedade Brasileira de Urologia para HPB, assinale a alternativa que indica a conduta mais adequada para o paciente."],"alternativas":{"A":"Encaminhar para tratamento cirúrgico imediato.","B":"Conduta expectante com reavaliação em 12 meses.","C":"Iniciar inibidor da 5-alfa-redutase como monoterapia imediata.","D":"Iniciar alfa-bloqueador como primeira linha terapêutica."},"correta":"D","oficial":{},"oficial_extra":["Justificativa: IPSS = 19 → Sintomas moderados (8–19 pontos). Para sintomas moderados com repercussão funcional, a recomendação é iniciar tratamento farmacológico, sendo os alfa-bloqueadores a primeira linha.","Justificativa das erradas:","Conduta expectante - Indicada apenas para sintomas leves (IPSS 0–7) ou moderados sem impacto funcional significativo.","Inibidor da 5-alfa-redutase isolado - Tem início de ação lento (3–6 meses) e é mais indicado quando próstata aumentada (>30–40 g) e risco de progressão. Não é a melhor escolha para alívio sintomático imediato.","Tratamento cirúrgico imediato - Indicado apenas em casos de complicações (retenção urinária recorrente, ITU recorrente, insuficiência renal, hematúria refratária, falha terapêutica).","Referência:","WEIN, Alan J. Campbell-Walsh Urologia. 11.ª ed. Rio de Janeiro: GEN Guanabara Koogan, 2018. E-book. p.i. ISBN 9788595152038. Disponível em: https://integrada.minhabiblioteca.com.br/reader/books/9788595152038/. Acesso em: 12 fev. 2026."],"refs":[],"tema":"HPB pelo IPSS","conceito":"IPSS: 0–7 leve, 8–19 moderado, 20–35 grave, mais a pergunta separada de qualidade de vida. Aqui a próstata está POUCO aumentada — isso tira a indicação de 5-ARI.","alt":{"A":"Sem critério cirúrgico: sem retenção, ITU de repetição, cálculo, hematúria ou lesão renal.","B":"Expectante é para IPSS 0–7 ou moderado sem incômodo.","C":"5-ARI depende de próstata aumentada (> 30–40 g), que não é o caso.","D":"CORRETA. Alfa-bloqueador, com melhora em 1–2 semanas."},"roteiro":[],"takehome":"Efeitos adversos que fazem abandonar: hipotensão postural, ejaculação retrógrada e íris flácida (avise o oftalmologista).","area":"CI · Urologia (HPB e próstata)"},{"id":35,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":5},{"prova":"CI 3 2026.1","num":6}],"enunciado":["(AFYA ARAGUAÍNA) Uma mulher de 28 anos, cantora amadora, procura atendimento por disfonia progressiva há 3 meses. Relata esforço vocal intenso devido a ensaios frequentes e uso excessivo da voz no trabalho. Nega tabagismo, etilismo ou perda de peso. No exame, apresenta voz rouca, mas sem disfagia ou odinofagia. A laringoscopia evidencia pequenas lesões bilaterais simétricas nas pregas vocais, arredondadas, de superfície lisa. Qual é o diagnóstico mais provável para esse paciente?"],"alternativas":{"A":"Nódulos vocais.","B":"Laringite crônica hipertrófica.","C":"Carcinoma espinocelular de laringe.","D":"Papilomatose laríngea."},"correta":"A","oficial":{"C":"Carcinoma espinocelular de laringe - Incorreta: Carcinoma laríngeo costuma ocorrer em indivíduos mais velhos, tabagistas/etilistas, com lesão única, irregular, de crescimento progressivo e sintomas de alarme (disfagia, odinofagia, perda de peso).","D":"Papilomatose laríngea - Incorreta: Papilomatose laríngea pode causar lesões múltiplas e irregulares, geralmente de aspecto verrucoso, relacionadas ao HPV, não descritas neste caso.","B":"Laringite crônica hipertrófica - Incorreta: Laringite crônica hipertrófica está associada a irritantes (fumo, refluxo), causa espessamento difuso da mucosa laríngea, não nódulos bilaterais bem delimitados."},"oficial_extra":["Nódulos vocais - Correta: Nódulos vocais são lesões benignas, bilaterais, simétricas, arredondadas e relacionadas a abuso vocal, comuns em jovens adultos e profissionais da voz."],"refs":["CUMMINGS, Charles W. et al. Cummings Otolaryngology: Head and Neck Surgery. 7. ed. Philadelphia: Elsevier, 2021.","PAPARELLA, Michael M.; SHUMRICK, Donald A. Otorrinolaringologia. 4. ed. Rio de Janeiro: Revinter, 2018."],"tema":"Nódulos vocais (terceira variação)","conceito":"Bilateral, simétrico, arredondado e de superfície LISA — a superfície lisa afasta papilomatose (verrucosa) e carcinoma (irregular).","alt":{"A":"CORRETA. Nódulos vocais; tratamento é fonoterapia e higiene vocal.","B":"Laringite hipertrófica dá espessamento difuso.","C":"Carcinoma: lesão única, irregular, com red flags — que o enunciado nega.","D":"Papilomatose dá lesões verrucosas múltiplas."},"roteiro":[],"takehome":"Profissional da voz + bilateral + simétrico + liso, sem red flag = nódulo.","area":"CI · Otorrinolaringologia (disfonia)"},{"id":36,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":6}],"enunciado":["(AFYA ITAPERUNA) Paciente do sexo masculino, 68 anos, procura ambulatório de urologia com queixa de jato urinário fraco, hesitação miccional, noctúria (3 episódios/noite) e sensação de esvaziamento incompleto há cerca de 1 ano, com piora progressiva. Nega hematúria ou perda ponderal. Refere impacto moderado na qualidade de vida. No exame físico, bom estado geral. Toque retal: próstata aumentada de volume, fibroelástica, superfície lisa, sem nódulos palpáveis. PSA total: 3,8 ng/mL (valor prévio há 2 anos: 3,5 ng/mL). Creatinina normal. Ultrassonografia: próstata com 52 g, resíduo pós-miccional discreto (60 mL).","Considerando o quadro clínico, a diferenciação diagnóstica e o manejo inicial mais adequado, assinale a alternativa correta."],"alternativas":{"A":"Indicar biópsia prostática imediata antes do tratamento dos sintomas urinários.","B":"Iniciar alfa-bloqueador, podendo associar inibidor da 5-alfa-redutase, com reavaliação clínica.","C":"Indicar tratamento cirúrgico imediato por ressecção transuretral da próstata.","D":"Iniciar apenas inibidor da 5-alfa-redutase para controle inicial dos sintomas."},"correta":"B","oficial":{},"oficial_extra":["O quadro é típico de HPB sintomática moderada, com:","Sintomas obstrutivos e irritativos progressivos; Próstata aumentada (52 g); PSA compatível com volume prostático; Resíduo pós-miccional discreto; Impacto moderado na qualidade de vida.","Conduta adequada:","Alfa-bloqueador (ex.: tamsulosina) → melhora rápida dos sintomas por relaxamento da musculatura lisa prostá. Inibidor da 5-alfa-redutase (ex.: finasterida ou dutasterida) → indicado quando próstata > 40 g, reduz progressão e risco de retenção urinária e cirurgia. Acompanhamento clínico periódico com reavaliação sintomática e laboratorial.","Distratores:","O PSA de 3,8 ng/mL em paciente de 68 anos está dentro de faixa compatível com a idade e apresenta estabilidade temporal. O toque retal mostra próstata aumentada, lisa e fibroelástica, sem nódulos suspeitos. Não há elementos clínicos ou laboratoriais que indiquem biópsia imediata.","Os inibidores da 5-alfa-redutase não promovem melhora sintomática rápida; seu efeito ocorre após meses. São mais indicados quando há próstata volumosa, mas, isoladamente, não oferecem alívio imediato significativo.","Tratamento cirúrgico (como RTU de próstata) está indicado em:","Falha do tratamento clínico; Retenção urinária recorrente; ITU de repetição; Litíase vesical; Insuficiência renal obstrutiva; Sintomas graves refratários.","Não é o caso apresentado. A abordagem deve iniciar com tratamento farmacológico.","Referência:","PARTIN, Alan W. et al. Campbell-Walsh-Wein Urology. 12. ed. Philadelphia: Elsevier, 2021."],"refs":[],"tema":"HPB com próstata volumosa","conceito":"Próstata de 52 g coloca o paciente no grupo de risco de PROGRESSÃO, que é quem se beneficia do 5-ARI. Preditores: volume > 30–40 g, PSA > 1,4, idade > 62, Qmax baixo, resíduo elevado.","alt":{"A":"Nada justifica biópsia: toque liso, PSA 3,8 estável (velocidade 0,15/ano, limiar 0,75).","B":"CORRETA. Alfa-bloqueador + 5-ARI pela próstata > 40 g, com reavaliação.","C":"RTU-P sem tentativa clínica é sobretratamento.","D":"5-ARI isolado deixa o paciente sintomático por meses; lembre que ele corta o PSA pela metade."},"roteiro":[],"takehome":"Compare 34 e 36: o volume prostático é o que decide entre monoterapia e combinação.","area":"CI · Urologia (HPB e próstata)"},{"id":37,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":7}],"enunciado":["(AFYA SÃO JOÃO DEL-REI) Paciente masculino, 60 anos, comparece à UBS com queixa de dispneia progressiva há três semanas e dor torácica ventilatório- dependente à direita. Refere perda ponderal de 6 kg nos últimos dois meses e história de tabagismo de 40 maços-ano. Ao exame físico, apresenta diminuição do frêmito toracovocal, macicez à percussão e murmúrio vesicular reduzido em base pulmonar direita. Radiografia de tórax evidencia derrame pleural moderado à direita. Realizada toracocentese diagnóstica, com os seguintes resultados: proteína sérica: 6,8 g/dL; proteína no líquido pleural: 4,2 g/dL; LDH sérico: 180 U/L; LDH no líquido pleural: 320 U/L; limite superior da normalidade do LDH sérico: 250 U/L.","Com base nos critérios de Light e nos dados apresentados, qual é a classificação do derrame pleural e a etiologia mais provável no contexto clínico descrito?"],"alternativas":{"A":"Exsudato, sugerindo etiologia neoplásica ou infecciosa como hipótese prioritária.","B":"Exsudato, sugerindo etiologia exclusivamente relacionada a doença renal crônica.","C":"Transudato, sugerindo hipoalbuminemia secundária à doença hepática crônica.","D":"Transudato, sugerindo insuficiência cardíaca congestiva como causa mais provável."},"correta":"A","oficial":{},"oficial_extra":["Explicação: Pelos critérios de Light, o derrame é classificado como exsudato quando pelo menos um dos seguintes está presente:","Relação proteína pleural/proteína sérica > 0,5 → 4,2/6,8 = 0,62","Relação LDH pleural/LDH sérico > 0,6 → 320/180 = 1,77","LDH pleural > 2/3 do limite superior da normalidade sérica → 2/3 de 250 = 166; valor pleural = 320","O paciente preenche todos os critérios para exsudato. No contexto clínico de perda ponderal, tabagismo importante e dor pleurítica, as etiologias prioritárias incluem neoplasia pulmonar e infecção (como tuberculose), orientando investigação complementar dirigida.","Referência:","TOWNSEND, Courtney M. et al. Sabiston – Tratado de Cirurgia: a base biológica da prática cirúrgica moderna. 21. ed. Rio de Janeiro: Elsevier, 2022."],"refs":[],"tema":"Derrame pleural — critérios de Light","conceito":"É exsudato se UM critério: proteína pleural/sérica > 0,5; LDH pleural/sérico > 0,6; LDH pleural > 2/3 do LSN sérico. Aqui: 0,62; 1,78; 320 > 166 — os três positivos.","alt":{"A":"CORRETA. Exsudato; com tabagismo, perda de 6 kg e dor pleurítica, pense neoplasia e infecção (inclusive TB — peça ADA).","B":"Doença renal dá transudato, e 'exclusivamente' já condena a alternativa.","C":"As contas apontam exsudato; hepatopatia dá transudato.","D":"ICC é a principal causa de transudato, mas os números não fecham."},"roteiro":[],"takehome":"Faça as três contas antes de olhar as alternativas. Em ICC com diurético, use o gradiente de albumina (> 1,2 = transudato).","area":"CI · Neoplasias pulmonares"},{"id":38,"materia":"CC 4","tipo":"objetiva","provas":[{"prova":"CC 4 2026.1","num":8},{"prova":"CI 3 2026.1","num":9}],"enunciado":["(AFYA IPATINGA) Paciente, 68 anos, sexo masculino, estrato funcional 2 do Índice de Vulnerabilidade Clínico-Funcional-20 (IVCF-20), tabagista ativo (50 maços/ano), apresenta tosse persistente e perda ponderal de 6 kg em dois meses. A Tomografia Computadorizada de Tórax revelou massa espiculada de 3,5 cm localizada no segmento apical do lobo inferior direito, com sinais de retração pleural. A Tomografia por Emissão de Pósitrons/Tomografia Computadorizada (PET-CT) evidenciou hipermetabolismo na lesão primária (Standardized Uptake Value (SUV) max: 9,2; valor de referência (VR) < 2,5) e captação em linfonodo da cadeia 10R (SUV max: 7,5; VR < 2,5). A broncoscopia identificou infiltração submucosa e estreitamento da luz do brônquio segmentar correspondente, sem lesões vegetantes endobronquiais evidentes.","Com base nos achados de localização e nos métodos diagnósticos apresentados, qual a conduta adequada para a obtenção de amostragem tecidual visando o diagnóstico histopatológico e molecular?"],"alternativas":{"A":"Pleuroscopia com biópsia pleural, visto a retração pleural descrita na TC.","B":"Citologia oncótica do escarro, dispensando procedimentos invasivos imediatos.","C":"Biópsia transbrônquica guiada por broncoscopia convencional.","D":"Punção aspirativa por agulha fina guiada por ultrassonografia endoscópica."},"correta":"C","oficial":{},"oficial_extra":["O caso descreve uma lesão pulmonar com alta probabilidade de malignidade, baseada em achados clínicos (tabagismo intenso, perda ponderal), radiológicos (massa espiculada com retração pleural) e metabólicos (SUV elevado no PET-CT). Além disso, a broncoscopia revelou infiltração submucosa e estreitamento do brônquio segmentar, o que indica acessibilidade direta da lesão pela via endobrônquica.","Nesse contexto, a biópsia transbrônquica guiada por broncoscopia é o método mais apropriado, pois permite obtenção de material adequado para diagnóstico histopatológico e análise molecular (como EGFR, ALK e PD-L1), essenciais no manejo do câncer de pulmão de não pequenas células. A presença de alteração endobrônquica aumenta significativamente o rendimento diagnóstico do procedimento, tornando-o a estratégia inicial mais eficiente e menos invasiva.","Distratores:","Embora tecnicamente plausível em outros cenários, a punção aspirativa guiada por ultrassonografia endoscópica (EUS) ou ultrassonografia endobrônquica (EBUS) é particularmente útil para avaliação e amostragem de linfonodos mediastinais ou lesões adjacentes ao esôfago. No entanto, neste caso, a lesão primária é acessível por broncoscopia e há evidência direta de comprometimento endobrônquico, o que torna a biópsia transbrônquica mais direta, resolutiva e com maior rendimento inicial. O EBUS poderia ser complementar para estadiamento linfonodal, mas não é a primeira escolha para a lesão primária neste cenário.","A citologia oncótica do escarro apresenta baixa sensibilidade, especialmente para lesões periféricas ou sem componente endobrônquico exofítico evidente. Embora possa ter algum valor em tumores centrais, não é suficiente como método diagnóstico inicial em um paciente com alta suspeita de neoplasia pulmonar. Além disso, não fornece material adequado para análise molecular, o que limita sua utilidade na prática oncológica atual.","A indicação de pleuroscopia com biópsia pleural pressupõe suspeita de doença pleural, como derrame pleural maligno ou espessamento pleural significativo. A retração pleural descrita na tomografia é um achado secundário à lesão pulmonar e não indica, por si só, comprometimento pleural direto que justifique abordagem invasiva da pleura. Assim, esse método não é apropriado como estratégia inicial para obtenção de diagnóstico.","Síntese do raciocínio: A escolha do método diagnóstico em câncer de pulmão deve considerar localização da lesão, acessibilidade anatômica e rendimento diagnóstico, priorizando técnicas menos invasivas e que permitam obtenção de material suficiente para análise histológica e molecular. Neste caso, a presença de achado brôncoscópico direciona claramente para a biópsia transbrônquica como método de escolha inicial."],"refs":["DEVITA, V. T.; LAWRENCE, T. S.; ROSENBERG, S. A. Cancer: Principles & Practice of Oncology. 12. ed. Philadelphia: Wolters Kluwer, 2023.","CÂNCER de pulmão no Brasil. Jornal Brasileiro de Pneumologia, v. 44, n. 1, jan./fev. 2018. Disponível em: https://doi.org/10.1590/S1806-37562017000000135. Acesso em: 21 mar. 2026.","HENDRIKS, L. E. L.; REMON, J.; FAIVRE-FINN, C. et al. Non-small-cell lung cancer. Nature Reviews Disease Primers, v. 10, p. 71, 2024. Disponível em: https://doi.org/10.1038/s41572-024-00551-9. Acesso em: 21 mar. 2026."],"tema":"Amostragem tecidual guiada pelo achado da broncoscopia","conceito":"A broncoscopia já mostrou infiltração submucosa com estreitamento do brônquio segmentar — a lesão é acessível pela via endobrônquica. A amostra precisa servir para histologia E painel molecular (EGFR, ALK, ROS1, PD-L1).","alt":{"A":"A 'retração pleural' é desmoplasia tumoral, não acometimento pleural.","B":"Citologia de escarro tem sensibilidade ~20–30% e não serve para molecular.","C":"CORRETA. Biópsia transbrônquica — lesão acessível, baixo risco, fragmento adequado.","D":"EUS (via esôfago) alcança estações 7, 8 e 9; o linfonodo aqui é 10R, território de EBUS."},"roteiro":[],"takehome":"Se a broncoscopia já viu a lesão, biopsie por ali. EBUS = 2, 4, 7, 10, 11; EUS = 7, 8, 9.","area":"CI · Neoplasias pulmonares"},{"id":39,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2026.1","num":9},{"prova":"CI 3 2026.1","num":15}],"enunciado":["(AFYA PATO BRANCO) Paciente feminina, 34 anos, 62 kg, previamente hígida, é admitida na sala de emergência aproximadamente 40 minutos após explosão de panela de pressão em ambiente domiciliar. Apresenta queimaduras térmicas de 2º grau envolvendo todo o membro superior direito, cabeça e pescoço e face anterior do membro inferior esquerdo. Observam-se ainda lesões de 1º grau no tronco anterior.","Na admissão, é realizado atendimento inicial conforme as recomendações do Advanced Trauma Life Support, com avaliação primária sistematizada, monitorização, oxigenoterapia, obtenção de dois acessos venosos periféricos calibrosos e início de reposição volêmica com solução de Ringer lactato.","Com base nesse caso clínico, responda de forma objetiva:","a) Considerando apenas as áreas indicadas para cálculo de reposição volêmica, qual é a superfície corporal queimada (SCQ) estimada pela Regra dos 9 de Wallace? (0,75 ponto)","b) De acordo com as recomendações do ATLS (11.ª edição), qual é o volume total de reposição volêmica nas primeiras 24 horas para essa paciente? (0,75 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) Consideram-se apenas as áreas com queimaduras de 2º grau (1º grau não entra no cálculo para reposição volêmica).","Distribuição clássica (adulto):","Cabeça e pescoço → 9%","Cada membro superior → 9% (total 18%)","Tronco anterior → 18%","Tronco posterior → 18%","Cada membro inferior → 18% (total 36%)","Períneo/genitália → 1%","Pela Regra dos 9 de Wallace:","Membro superior direito completo = 9%","Cabeça e pescoço completos = 9%.","Face anterior do membro inferior esquerdo = 9%.","SCQ total = 27%","Resposta esperada: 27% de superfície corporal queimada.","b) De acordo com o Advanced Trauma Life Support (11.ª edição), a reposição volêmica inicial no paciente queimado não deve mais ser iniciada rotineiramente com 4 mL/kg/%SCQ (como na fórmula clássica de Parkland), mas sim com 2 mL/kg por porcentagem de superfície corporal queimada, a fim de reduzir o risco de hiperressuscitação, devendo o volume ser posteriormente ajustado conforme a resposta clínica, especialmente pelo débito urinário (meta de 0,5 mL/kg/h em adultos). No caso da paciente descrita, com 62 kg e 27% de SCQ, o volume inicial calculado é de 2 × 62 × 27, totalizando 3.348 mL de Ringer lactato.","Resposta esperada: 3.348 mL.","Referência:","AMERICAN COLLEGE OF SURGEONS. Advanced Trauma Life Support (ATLS): student course manual. 11. ed. Chicago: American College of Surgeons, 2025."],"refs":[],"tema":"Queimaduras — ATLS 11ª edição (2 mL)","conceito":"Duas armadilhas juntas: 1º grau não entra na SCQ, e o ATLS 11 usa 2 mL/kg/%SCQ no adulto (criança 3 mL; elétrica de alta voltagem 4 mL).","alt":{},"roteiro":["a) MMSS direito 9% + cabeça e pescoço 9% + face anterior do MMII esquerdo 9% = 27%. As lesões de 1º grau do tronco ficam FORA.","b) 2 × 62 × 27 = 3.348 mL de Ringer lactato em 24 h.","1.674 mL nas primeiras 8 h a partir da queimadura (já passaram 40 min → ~228 mL/h) e 1.674 mL nas 16 h seguintes.","Diurese-alvo 0,5 mL/kg/h (~31 mL/h).","Queimadura de cabeça e pescoço em ambiente fechado: reavaliar via aérea e considerar intubação precoce antes do edema."],"takehome":"Diga sempre qual referência está usando: 2 mL (ATLS 11) ou 4 mL (Parkland clássica).","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":40,"materia":"CC 4","tipo":"discursiva","provas":[{"prova":"CC 4 2026.1","num":10}],"enunciado":["(AFYA ARAGUAÍNA) Homem de 23 anos dá entrada no pronto atendimento após entorse de tornozelo direito durante partida de futebol, ocorrida há aproximadamente duas horas.","No exame físico, não há deformidades visíveis; há presença de edema no tornozelo, envolvendo as regiões maleolares medial e lateral; dor moderada no maléolo medial; ausência de dor à palpação óssea direta nas bordas maleolares; e capacidade de deambular com apoio total, realizando mais de 10 passos, apesar da dor.","a) Com base na avaliação clínica apresentada, aplique os critérios de Ottawa para tornozelo na condução do plano diagnóstico. (0,75 ponto)","b) Considerando o diagnóstico mais provável, elabore o plano terapêutico inicial recomendado. (0,75 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) Diagnóstico:","Aplicação dos critérios de Ottawa para tornozelo;","Não há indicação de radiografia, pois:","Ausência de dor à palpação óssea nas bordas maleolares;","Capacidade de deambulação (>4 passos);","Diagnóstico provável: entorse de tornozelo (lesão ligamentar), sem evidência clínica de fratura.","b) Tratamento:","Protocolo PRICE / POLICE:","Proteção;","Repouso relativo;","Gelo;","Compressão;","Elevação.","Analgesia:","AINEs ou analgésicos simples.","Conduta funcional:","Mobilização precoce conforme tolerância;","Evitar imobilização prolongada.","Orientações:","Sinais de alarme;","Retorno se piora;","Reavaliação se não houver melhora."],"refs":["DynaMed. Ankle Sprain in Adults. Disponível em: https://www.dynamed.com/condition/ankle-sprain-in-adults. Acesso em: 27 jul. 2025.","Stiell IG et al. Implementation of the Ottawa Ankle Rules. JAMA. 1994; 271(11):827- 832."],"tema":"Ottawa negativo + plano terapêutico","conceito":"Nenhum critério preenchido. Detalhe: dor em partes moles não é o mesmo que dor à palpação ÓSSEA nos pontos definidos pela regra.","alt":{},"roteiro":["a) Dor maleolar presente, mas sem dor à palpação óssea nas bordas/pontas dos maléolos e com capacidade de dar > 4 passos → radiografia NÃO indicada. Também não há critério para o pé.","Diagnóstico: entorse ligamentar de tornozelo, sem evidência clínica de fratura.","b) PRICE/POLICE: proteção com órtese, carga conforme tolerância, gelo, compressão, elevação.","Analgesia simples ou AINE curto; mobilização precoce e treino proprioceptivo.","Sinais de alarme: piora da dor, incapacidade progressiva de apoio, parestesia ou frieza; reavaliar em 5–7 dias se não melhorar (fratura oculta, lesão osteocondral do tálus, sindesmose)."],"takehome":"A dor precisa ser na palpação ÓSSEA dos pontos definidos — é isso que a questão mede.","area":"CI · Ortopedia (entorses e fraturas)"},{"id":41,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":1}],"enunciado":["( UNIREDENTOR) O Sr. Paulo de 80 anos foi levado a consulta psiquiátrica pelo seu filho. No exame psiquiátrico o médico observou alterações cognitivas como perda da memória recente, dificuldade de nomeação de objetos, redução da fluência verbal e dificuldade de cálculos. Ao término da anamnese e do exame físico o diagnóstico foi de Doença de Alzheimer em estágio inicial.","Dentre as opções abaixo, qual o melhor esquema terapêutico farmacológico para o caso apresentado?"],"alternativas":{"A":"Donepezila 10mg associada a Memantina 10mg, uma vez ao dia.","B":"Memantina 10mg, associada a Ganlantamina 8mg, duas vezes ao dia.","C":"Memantina 10mg, um comprimido, de 12/12 horas.","D":"Rivastigmina 1,5mg, um comprimido, de 12/12 horas."},"correta":"D","oficial":{"B":"Para tratamento de doença de Alzheimer em quadro inicial leve devemos utilizar as drogas que atuam nas vias colinérgicas como a donepezila 5mg uma vez ao dia, rivastigmina 1,2mg 2 vezes ao dia e galantamina 8mg uma vez ao dia. Está incorreta a utilização da memantina como a sua dosagem que seria melhor utilizada na fase mais avançada, a alternativa Donepezila 10mg associada a Memantina 10mg, uma vez ao dia o que está errado é o uso combinado na fase inicial, pois esse esquema devemos utilizar em casos mais graves sem ganho terapêutico em fase inicial, a alternativa Memantina 10mg, associada a Ganlantamina 8mg, duas vezes ao dia, são 2 medicamentos que tem o mesmo princípio terapêutico dessa forma não tem ganho terapêutico para o paciente ."},"oficial_extra":["Referência:","Tratado de Neurologia, da Academia Brasileira de Neurologia."],"refs":[],"tema":"Tratamento da doença de Alzheimer","conceito":"Anticolinesterásicos (donepezila, rivastigmina, galantamina) da fase leve à moderada, sempre com titulação lenta. Memantina na moderada a grave. Doses iniciais: donepezila 5 mg/dia, rivastigmina 1,5 mg 2x/dia, galantamina 8 mg/dia.","alt":{"A":"Combinação é para doença moderada a grave, e 10 mg já é dose de manutenção.","B":"Memantina não é droga de fase inicial e as posologias estão trocadas.","C":"Memantina isolada não tem benefício na fase leve.","D":"CORRETA. Rivastigmina 1,5 mg 12/12 h é a dose inicial correta, com titulação a cada 2–4 semanas."},"roteiro":[],"takehome":"Na prova, o erro costuma estar na DOSE, não na droga. Cuidado com bradiarritmia (contraindicação relativa).","area":"CI · Demências e parkinsonismo"},{"id":42,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2024.2","num":2}],"enunciado":["( UNIDEP) Paciente do sexo masculino, 27 anos, é encaminhado ao Ambulatório Escola Afya de Psiquiatria devido quadro clínico caracterizado por hipersonia (dormindo 14 horas/por dia), ganho de peso, diminuição de libido, ausência de volição e humor deprimido. Em sua história pregressa, paciente refere que já fez tratamento devido transtorno depressivo por aproximadamente 6 anos, com refratariedade ao uso de escitalopram e sertralina. Refere também que nas últimas semanas, diferente das anteriores, se sentiu bem em 04 dias, tendo disposição para as atividades diárias, dormindo apenas 2 horas no período noturno. Relata também que nesses dias conseguiu frequentar festas com os amigos e até consumiu álcool, substância que raramente faz uso.","Em relação ao quadro clínico da paciente, responda as questões abaixo:","a) Qual a hipótese diagnóstica mais provável?","b) Visando proporcionar ao paciente um tratamento de primeira linha, com nível 1 de evidência, qual medicação você prescreveria?","c) Levando em conta a medicação prescrita na alternativa B, a que classe de medicações essa droga pertence?"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["a) Transtorno afetivo bipolar tipo II.","b) Hemifumarato de Quetiapina.","c) Antipsicótico atípico.","O TB tipo II é confirmado quando há a presença de pelo menos um episódio hipomaníaco e um episódio depressivo ao longo da vida. O TB tipo I é caracterizado pela presença de pelo menos um episódio maníaco ao longo da vida. Cabe destacar que esse episódio pode ter sido ou não acompanhado por um episódio depressivo ao longo da vida.","Em suma, um episódio maníaco, marco do transtorno bipolar tipo 1, é caracterizado por euforia (ou irritabilidade) associada a um estado de aumento de energia, redução da necessidade do sono, euforia, impulsividade, desinibição social ou sexual, pensamento acelerados, fala rápida e diminuição da capacidade crítica, podendo estar presentes pensamentos grandiosos ou delirantes, devendo ocorrer em pelo menos 7 dias (normalmente durando alguns meses).","Caso os sintomas ocorram em ao menos 4 dias (normalmente durando algumas semanas) e sua intensidade não seja alta, daremos o diagnóstico de hipomania.","Logo, Transtorno bipolar tipo 1 = mania // transtorno bipolar tipo 2 = depressão + hipomania // estado misto = depressão e mania. O paciente do caso apresenta história de depressão e sintomas condizentes com hipomania, e não mania.","Em relação ao tratamento do transtorno afetivo bipolar tipo 2, sabemos que uma série de medicações podem ser utilizadas, como quetiapina, lítio e lamotrigina (ambas são medicações de primeira linha). Porém se sabe, que de acordo com Yatham e colaboradores, principal publicação sobre a terapêutica em questão, apenas a quetiapina é considerada droga de nível 1 de evidência, pertencendo as drogas de primeira linha. A quetipiana faz parte dos antipsicóticos atípicos."],"refs":["ASSOCIATION, American P. Manual Diagnóstico e Estatístico de Transtornos Mentais - DSM-5- TR: Texto Revisado. Porto Alegre: Grupo A, 2023. E-book. ISBN 9786558820949. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786558820949/. Acesso em: 15 ago. 2024.","GUIMARÃES-FERNANDES, Flávio; et al. Clínica psiquiátrica: guia prático 2a ed.. Barueri: Editora Manole, 2021. E-book. ISBN 9786555769876. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786555769876/. Acesso em: 15 ago. 2024.","NARDI, Antonio E.; SILVA, Antônio G.; QUEVEDO, João. Tratado de psiquiatria da associação brasileira de psiquiatria. Porto Alegre: Grupo A, 2021. E-book. ISBN 9786558820345. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786558820345/. Acesso em: 15 ago. 2024.","SADOCK, Benjamin J.; SADOCK, Virginia A.; RUIZ, Pedro. Compêndio de psiquiatria. Porto Alegre: Grupo A, 2017. E-book. ISBN 9788582713792. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788582713792/. Acesso em: 15 ago. 2024.","SALLET, Paulo C.; ASCIUTTI, Antonio Paulo R.; MACAYA, Daniela Andrea M.; et al. Manual do residente de psiquiatria. Barueri: Editora Manole, 2023. E-book. ISBN 9788520464649. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788520464649/. Acesso em: 15 ago. 2024.","YATHAM, Lakshmi N. et al. Canadian Network for Mood and Anxiety Treatments (CANMAT) and International Society for Bipolar Disorders (ISBD) 2018 guidelines for the management of patients with bipolar disorder. Bipolar disorders, v. 20, n. 2, p. 97-170, 2018."],"tema":"Transtorno bipolar tipo II","conceito":"Depressão atípica (hipersonia, ganho de peso) refratária a dois ISRS + 4 dias de humor elevado com sono reduzido. Mania: ≥ 7 dias com prejuízo marcado. Hipomania: ≥ 4 dias, sem prejuízo marcado nem psicose.","alt":{},"roteiro":["a) Transtorno afetivo bipolar tipo II, em episódio depressivo — o episódio de 4 dias preenche hipomania, não mania.","b) Hemifumarato de quetiapina (300 mg/dia na depressão bipolar).","c) Antipsicótico atípico.","Por que quetiapina: pelas diretrizes CANMAT/ISBD é a única com nível 1 de evidência como primeira linha na depressão do TB II (lítio e lamotrigina são primeira linha com evidência inferior).","Antidepressivo em monoterapia é contraindicado no bipolar — risco de virada e ciclagem rápida. Isso explica a 'refratariedade' aos ISRS."],"takehome":"Depressão que não responde a vários antidepressivos merece a pergunta: já houve hipomania?","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":43,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":3}],"enunciado":["(AFYA PALMAS) Um menino de 8 anos é levado à consulta com história de febre prolongada há mais de duas semanas, acompanhada de fraqueza, cansaço fácil e perda de apetite. Ao exame físico, observa-se palidez cutânea, hepatoesplenomegalia, linfonodos cervicais aumentados e amigdalas aumentadas de tamanho com exudado acinzentado em toda sua superfície.","Quais exames complementares são mais indicados para o diagnóstico inicial desta criança?"],"alternativas":{"A":"Ultrassonografia cervical e sorologia para Coxsackie vírus.","B":"Proteína C Reativa e teste tuberculínico.","C":"Coagulograma e provas de função hepática.","D":"Hemograma e sorologia para Epstein-Barr."},"correta":"D","oficial":{"D":"Hemograma e sorologia para Epstein-Barr: CORRETA. O hemograma completo é essencial para avaliar infecções ou neoplasias. A sorologia para Epstein-Barr é relevante, pois o vírus pode causar febre prolongada associada a linfadenopatia e esplenomegalia.","A":"Ultrassonografia cervical e sorologia para Coxsackie vírus. INCORRETA. Estes exames não são de escolha inicial para investigação de febre prolongada, e o Coxsackie vírus, não corresponde ao vírus da doença em questão.","C":"Coagulograma e provas de função hepática. INCORRETA. Nenhum desses exames é prioritário na investigação de febre prolongada. São exames inespecíficos."},"oficial_extra":["Justificativa: Hemograma e teste tuberculínico: INCORRETA. A Proteína C Reativa é fundamental para investigar infecções, porém trata-se de um exame inespecífico e apenas colabora com outros exames como o hemograma. O teste tuberculínico não prioritário neste contexto, devido ao tempo de evolução (menor) que três semanas).","Referência Bibliográfica:","JÚNIOR, Dioclécio C.; BURNS, Dennis Alexander R.; LOPEZ, Fábio A. Tratado de pediatria. 5ª edição. Barueri -SP: editora Manole, 2021. E-book. ISBN 9786555767476"],"refs":[],"tema":"Febre prolongada na criança","conceito":"Febre > 7 dias com palidez, hepatoesplenomegalia e linfonodomegalia exige duas linhas simultâneas: infecciosa (EBV, CMV, TB) e neoplásica (leucemia, linfoma). O hemograma é o que separa as duas.","alt":{"A":"Coxsackie dá herpangina/mão-pé-boca, autolimitadas.","B":"PCR é inespecífica e o PPD não é prioritário aqui.","C":"Coagulograma e função hepática são complementares, não de triagem.","D":"CORRETA. Hemograma (linfócitos atípicos, citopenias, blastos) + sorologia para EBV — o monoteste tem baixa sensibilidade em menores de 4 anos."},"roteiro":[],"takehome":"Na mononucleose confirmada: sem esporte de contato por 3–4 semanas (ruptura esplênica) e evite amoxicilina (rash).","area":"CI · Onco-hematologia pediátrica"},{"id":44,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2024.2","num":4}],"enunciado":["( UNISL PORTO VELHO) Uma mulher, de 65 anos, foi diagnosticada com osteoartrite há aproximadamente dois anos, com predominância nas articulações dos joelhos e mãos. Recentemente, ela relatou um agravamento dos sintomas, incluindo dor crônica no joelho direito e rigidez matinal que persiste por cerca de 30 minutos. Esses sintomas têm prejudicado suas atividades diárias, como subir escadas e manipular objetos pequenos. A paciente tem hipertensão controlada por losartana, com IMC de 35, sem histórico de diabetes ou problemas renais. O exame físico revela dor à palpação nas articulações dos joelhos e mãos, com uma redução na amplitude de movimento. Radiografias indicam estreitamento do espaço articular e osteófitos, características típicas de osteoartrite.","Baseado no quadro clínico e nas diretrizes terapêuticas para osteoartrite, identifique o plano terapêutico inicial mais adequado para o tratamento, incluindo abordagens farmacológicas e não farmacológicas?"],"alternativas":{"A":"Iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) para controle da dor e inflamação, considerar suplementação com glucosamina e condroitina, incluir exercícios físicos supervisionados.","B":"Prescrever paracetamol para alívio da dor, iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) se necessário, recomendar o uso de dispositivos de apoio e incluir exercícios físicos leves conforme tolerado.","C":"Iniciar tratamento com paracetamol para alívio da dor, anti-inflamatórios não esteroidais (AINEs) apenas se necessário, incluir programa de fisioterapia e recomendar perda de peso para reduzir a carga sobre as articulações.","D":"Prescrever opioides para controle da dor intensa, utilizar corticosteroides injetáveis para articulações afetadas, recomendar repouso absoluto e restrição de atividades físicas para evitar o agravamento da condição."},"correta":"C","oficial":{"C":"Resposta correta: Iniciar tratamento com paracetamol para alívio da dor, anti-inflamatórios não esteroidais (AINEs) apenas se necessário, incluir programa de fisioterapia e recomendar perda de peso para reduzir a carga sobre as articulações.","A":"Iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) para controle da dor e inflamação, considerar suplementação com glucosamina e condroitina, incluir exercícios físicos supervisionados. Embo
