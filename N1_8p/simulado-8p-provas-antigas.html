umentais (ABVD preservadas), MEEM 21, laboratório normal e atrofia cortical difusa. Fase leve a moderada = anticolinesterásico.","alt":{"A":"Benzodiazepínico é contraindicado no idoso com demência: quedas, sedação, piora cognitiva e aumento de mortalidade.","B":"Memantina é para fase moderada a grave (MEEM ≤ 15–18), isolada ou associada.","C":"Psicoterapia e estimulação cognitiva são coadjuvantes, não o tratamento farmacológico de primeira linha pedido.","D":"CORRETA. Rivastigmina (ou donepezila/galantamina), inibidor da colinesterase, primeira linha na fase leve a moderada."},"roteiro":[],"takehome":"Perder atividade INSTRUMENTAL (contas, medicação) já é demência; perder a BÁSICA (banho, vestir) é fase mais avançada.","area":"CI · Demências e parkinsonismo"},{"id":85,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2025.2","num":14}],"enunciado":["(UNITPAC) Uma mulher de 32 anos, 70 kg, vítima de explosão de gás, apresenta queimaduras de segundo grau profundas em todo o tórax anterior, abdome anterior, face anterior de ambos os braços e face anterior dos membros inferiores. Ela chega ao pronto-socorro 1 hora após o acidente, consciente, taquicárdica (120 bpm) e com PA 100×65 mmHg.","Seguindo a 11ª edição do ATLS 2025","a) Calcule a área de superfície corporal queimada (SCQ) pelo método da Regra dos Nove de Wallace. (1,25 ponto)","b) Estime o volume e tempo total de reposição hídrica utilizando a Fórmula de Parkland Modificada. (1,25 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Padrão de resposta:","Cálculo da SCQ (Regra dos 9):","Tórax anterior = 18%","Abdome anterior = 0% (já incluso no tronco anterior)","Braço anterior direito = 4,5%","Braço anterior esquerdo = 4,5%","Face anterior do membro inferior direito = 9%","Face anterior do membro inferior esquerdo = 9%","Total = 45% da superfície corporal queimada (SCQ)","Cálculo pela Fórmula de Parkland:","Recomendação oficial (ATLS): iniciar com 2 mL/kg/%SCQ, mas ajustar de acordo com a resposta clínica (débito urinário 0,5/kg/h em adultos).","Fórmula: 2 mL × peso (kg) × %SCQ","2 × 70 × 45 = 6.300 mL em 16h","As principais atualizações no manejo de queimados na 11ª edição do ATLS para tratamento de queimaduras:","Reposição volêmica no pré-hospitalar:","A infusão de Ringer Lactato pode ser iniciada antes mesmo de o paciente chegar ao hospital em casos de queimaduras graves, utilizando taxas específicas para diferentes faixas etárias (crianças menores de 5 anos, 6 a 13 anos e pacientes a partir de 14 anos).","Fórmula de Parkland modificada:","A quantidade total de líquido a ser administrada em 24 horas permanece com a fórmula clássica: 2 ml x Peso (kg) x % SCQ, com Ringer Lactato como solução de escolha. A grande mudança está na distribuição: o volume total calculado deve ser administrado uniformemente ao longo das 16 horas após a lesão, e não mais dividido em 50% nas primeiras 8 horas e 50% nas 16 horas seguintes.","Remoção de bolhas (flictenas):","A nova orientação é remover as bolhas em ambiente estéril para permitir uma melhor avaliação da profundidade da queimadura e evitar diagnósticos imprecisos.","Ajuste do volume de fluidos:","Após o período inicial de 16 horas, a quantidade de fluidos deve ser ajustada a cada hora com base na diurese do paciente. Meta de diurese: 0,5 mL/kg/h em adultos e 1 mL/kg/h em","crianças com menos de 30kg. Se a diurese for inferior à meta, aumenta-se a taxa em 10-30%; se for superior, reduz-se.","Referências :","ATLS 11a Edição - 2025.","AMERICAN BURN ASSOCIATION. Burn Shock Resuscitation. J Burn Care Res. 2020;41(1):112–125.","BRUNNER, Lillian Sholtis; SUDDARTH, Doris Smith. Tratado de Enfermagem Médico- Cirúrgica . 14ª ed. Rio de Janeiro: Guanabara Koogan, 2018.","KASPER, D.; FAUCI, A.; HAUSER, S.; LONGO, D.; JAMESON, J. Harrison – Medicina Interna, 21ª ed. McGraw-Hill, 2022."],"refs":[],"tema":"Queimaduras — Parkland MODIFICADA (ATLS 11)","conceito":"Mudança importante do ATLS 11: mantém 2 mL/kg/%SCQ, mas o volume total passa a ser infundido UNIFORMEMENTE ao longo de 16 h após a lesão, em vez de 50% em 8 h + 50% em 16 h.","alt":{},"roteiro":["a) Tronco anterior (tórax + abdome) = 18%; braço direito anterior 4,5% + esquerdo anterior 4,5% = 9%; face anterior de cada MMII = 9% + 9% = 18%. Total = 45%.","Cuidado: abdome anterior NÃO soma separado — já está dentro dos 18% do tronco anterior.","b) 2 × 70 × 45 = 6.300 mL de Ringer lactato, distribuídos ao longo de 16 h (~394 mL/h), contadas a partir da queimadura.","Após as 16 h, ajuste horário pela diurese: meta 0,5 mL/kg/h no adulto (~35 mL/h); abaixo disso, aumente a taxa em 10–30%; acima, reduza.","Outras novidades do ATLS 11 que cabem na resposta: reposição pode começar no pré-hospitalar e as flictenas devem ser removidas em ambiente estéril para avaliar a profundidade.","SCQ de 45% com taquicardia = grande queimado; encaminhar a centro de queimados."],"takehome":"Duas armadilhas: abdome anterior já está no tronco, e o esquema '50/50' saiu — agora é infusão uniforme em 16 h.","area":"CI · Queimaduras e nutrição cirúrgica"},{"id":86,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2025.2","num":15}],"enunciado":["(UNIPTAN) Durante consulta puerperal na unidade básica de saúde, a mãe de um recém-nascido de 5 dias de vida relata que o bebê está “mais amarelado” desde ontem. A anamnese apresenta RN a termo (39 semanas), parto vaginal sem intercorrências, bom vigor ao nascimento, peso adequado para a idade gestacional. Está em aleitamento materno exclusivo, com boa pega, mamando a cada 2–3 h. Eliminações estão presentes (urina clara, fezes amareladas, várias evacuações diárias) e está sem febre ou letargia. A mãe tem tipo sanguíneo A positivo. Ao exame físico, encontra-se ativo; zonas de Kramer III; peso de 3.250g (perda < 10% do peso de nascimento). Bom estado geral, sem visceromegalias ou outras alterações. Exames coletados hoje: Bilirrubina total: 10 mg/dL (fração indireta predominante); tipo sanguíneo do RN: A positivo.","Considerando os dados clínicos, indique o diagnóstico mais provável desse recém- nascido e a conduta a ser indicada.","(2,5 pontos)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Gabarito: O quadro é compatível com icterícia neonatal fisiológica e a conduta correta é: tranquilizar e orientar a família; manter e reforçar aleitamento materno exclusivo, em livre demanda; acompanhar evolução clínica em UBS, reavaliando cor da pele, sucção, peso e eliminação; não havendo indicação de fototerapia no momento.","Referência:","Sociedade Brasileira de Pediatria. Tratado de Pediatria. 5ª edição. Barueri: Manole, 2022. Capítulo: Icterícia Neonatal"],"refs":[],"tema":"Icterícia fisiológica — conduta na UBS","conceito":"Tudo favorece fisiológica: RN a termo, início após 24 h, pico entre o 3º e 5º dia, BT 10 com predomínio indireto, sem incompatibilidade (mãe e RN A+), mamando bem, perda < 10%, sem visceromegalias e sem letargia.","alt":{},"roteiro":["Diagnóstico: icterícia neonatal fisiológica (hiperbilirrubinemia indireta).","Conduta: tranquilizar a família; manter e reforçar o aleitamento materno exclusivo em livre demanda (mamadas frequentes aumentam o trânsito intestinal e reduzem a circulação êntero-hepática da bilirrubina).","Acompanhamento na UBS: reavaliar cor da pele, sucção, peso e eliminações.","Não há indicação de fototerapia, de suplementação com fórmula nem de banho de sol.","Sinais de alerta a orientar: progressão para membros, palmas e plantas; letargia; sucção fraca; febre; fezes claras ou urina escura (sugerem colestase).","Se houver progressão ou dúvida, dosar bilirrubina e plotar em Bhutani."],"takehome":"Icterícia fisiológica se trata com amamentação e reavaliação. Jejum e fórmula pioram; sol não trata.","area":"CI · Icterícia neonatal"},{"id":87,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":2}],"enunciado":["(AFYA ARAGUAÍNA) Um homem de 60 anos procura a Unidade Básica de Saúde com queixa de dor em joelhos há dois anos, com piora progressiva nos últimos seis meses. Refere rigidez matinal inferior a 30 minutos e dor que se intensifica ao subir escadas. Possui hipertensão arterial sistêmica controlada com losartana e antecedente de gastrite erosiva. Ao exame físico, apresenta crepitação à mobilização dos joelhos, sem sinais flogísticos.","Considerando o quadro clínico e as comorbidades apresentadas, assinale a alternativa que corresponde ao plano terapêutico inicial indicado para esse paciente."],"alternativas":{"A":"Prescrever anti-inflamatório não esteroidal em menor dose efetiva, com monitoramento clínico periódico.","B":"Orientar medidas não farmacológicas associadas a analgésico simples e acompanhamento clínico regular.","C":"Encaminhar para fisioterapia motora e adiar introdução de tratamento farmacológico até nova avaliação clínica.","D":"Iniciar anti-inflamatório não esteroidal seletivo para COX-2 e avaliar necessidade de manutenção conforme evolução clínica."},"correta":"B","oficial":{"B":"A alternativa “Orientar medidas não farmacológicas associadas a analgésico simples e acompanhamento clínico regular” está correta, pois o tratamento inicial da osteoartrite deve priorizar intervenções não farmacológicas, como perda ponderal, fortalecimento muscular e exercícios supervisionados. Analgésicos simples podem ser utilizados para controle sintomático inicial. Em pacientes com hipertensão arterial e antecedente de doença gastrointestinal, o uso de anti- inflamatórios não esteroides deve ser criterioso, considerando o aumento do risco cardiovascular e gastrointestinal associado a esses fármacos.","A":"A alternativa “Prescrever anti-inflamatório não esteroidal em menor dose efetiva, com monitoramento clínico periódico” está incorreta, pois, embora a redução de dose possa mitigar riscos, a introdução de anti-inflamatório sistêmico não constitui etapa inicial antes da implementação estruturada de medidas conservadoras.","D":"A alternativa “Iniciar anti-inflamatório não esteroidal seletivo para COX-2 e avaliar necessidade de manutenção conforme evolução clínica” está incorreta, pois os inibidores seletivos reduzem risco gastrointestinal relativo, mas mantêm risco cardiovascular e não substituem a abordagem inicial conservadora recomendada nas diretrizes.","C":"A alternativa “Encaminhar para fisioterapia motora e adiar introdução de tratamento farmacológico até nova avaliação clínica” está incorreta, pois contempla intervenção não farmacológica isolada, sem associação inicial de analgésico simples para controle sintomático, que compõe parte do manejo recomendado."},"oficial_extra":["O plano terapêutico da osteoartrite deve ser progressivo, individualizado e fundamentado na relação risco-benefício, especialmente em pacientes com comorbidades."],"refs":["BRASIL. Ministério da Saúde. Protocolo Clínico e Diretrizes Terapêuticas da Osteoartrite. Brasília: Ministério da Saúde, 2022. Disponível em: https://www.gov.br/saude.","KOLASINSKI, Sharon L. et al. 2019 American College of Rheumatology/Arthritis Foundation Guideline for the Management of Osteoarthritis. Arthritis Care & Research, v. 72, n. 2, p. 149–162, 2020. Disponível em: https://acrjournals.onlinelibrary.wiley.com.","SOCIEDADE BRASILEIRA DE REUMATOLOGIA. Diretrizes para o tratamento da osteoartrite. São Paulo: SBR, 2021. Disponível em: https://www.reumatologia.org.br."],"tema":"Osteoartrite com comorbidades","conceito":"Quinta questão de OA do banco, agora com o detalhe que decide: HAS + gastrite erosiva. Isso empurra o AINE sistêmico para o fim da fila, mesmo o seletivo.","alt":{"A":"Mesmo em dose menor, AINE sistêmico não é a etapa INICIAL antes de medidas conservadoras estruturadas.","B":"CORRETA. Medidas não farmacológicas + analgésico simples + acompanhamento regular.","C":"Fisioterapia isolada, adiando qualquer analgesia, deixa o paciente com dor sem necessidade.","D":"Coxibe reduz risco gastrointestinal, mas mantém (e até aumenta) o risco cardiovascular em hipertenso."},"roteiro":[],"takehome":"Em prova de OA, leia as comorbidades: elas é que decidem se o AINE entra ou não.","area":"CI · Reumatologia (OA e artrites)"},{"id":88,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":3}],"enunciado":["(AFYA MANACAPURU) J.M., 80 anos, sexo masculino, 4 anos de escolaridade, é trazido ao ambulatório pela ﬁlha, que relata esquecimentos progressivos há aproximadamente 8 meses. O paciente repete perguntas recentes, esquece compromissos e necessita de anotações para lembrar tarefas do dia. Permanece independente para atividades básicas de vida diária (higiene, alimentação e vestuário). Mantém atividades instrumentais como uso de transporte público e pequenas compras, porém a ﬁlha passou a auxiliá-lo na organização das ﬁnanças após erros recentes no pagamento de contas. Nega alterações comportamentais, alucinações, quedas ou ﬂutuação do nível de consciência. Antecedentes de hipertensão arterial e dislipidemia controladas. Exame físico: lúcido, orientado, sem déficits neurológicos focais, marcha preservada, sem sinais extrapiramidais.","Mini-Exame do Estado Mental (MEEM): 22 pontos.","Considerando a análise integrada da queixa cognitiva, do desempenho funcional e da pontuação no MEEM ajustada à escolaridade, qual é o diagnóstico sindrômico mais provável?"],"alternativas":{"A":"Demência em fase inicial, definida por prejuízo cognitivo mensurável associado a comprometimento funcional progressivo.","B":"Comprometimento cognitivo leve, caracterizado por declínio cognitivo objetivo com preservação relativa da independência funcional.","C":"Envelhecimento cognitivo esperado para a idade, sem critérios para transtorno neurocognitivo estabelecido.","D":"Transtorno neurocognitivo de provável etiologia vascular, em razão dos fatores de risco cardiovasculares e da progressão insidiosa."},"correta":"B","oficial":{"C":"Envelhecimento cognitivo esperado para a idade, sem critérios para transtorno neurocognitivo estabelecido. Incorreta. O envelhecimento cognitivo ﬁsiológico pode cursar com lapsos leves de memória, porém não apresenta declínio progressivo mensurável nem impacto funcional observável por informante conﬁável. Neste caso, há relato consistente de piora cognitiva nos últimos 8 meses, necessidade de anotações para tarefas e erros no manejo ﬁnanceiro, além de pontuação no MEEM abaixo do esperado para a faixa etária e escolaridade, afastando a hipótese de envelhecimento normal.","B":"Comprometimento cognitivo leve, caracterizado por declínio cognitivo objetivo com preservação relativa da independência funcional. Correta. O paciente apresenta declínio cognitivo progressivo conﬁrmado por familiar e desempenho abaixo do esperado no MEEM, porém mantém independência nas atividades básicas e relativa autonomia nas instrumentais, necessitando apenas de apoio parcial. A preservação funcional global, mesmo com pequenas diﬁculdades, caracteriza comprometimento cognitivo leve, que exige prejuízo cognitivo objetivo sem perda signiﬁcativa da independência.","A":"Demência em fase inicial, deﬁnida por prejuízo cognitivo mensurável associado a comprometimento funcional progressivo. Incorreta. O diagnóstico sindrômico de demência exige comprometimento cognitivo associado à perda signiﬁcativa da autonomia funcional. Apesar de diﬁculdades leves no gerenciamento ﬁnanceiro, o paciente mantém independência nas atividades básicas e na maior parte das instrumentais, o que não conﬁgura comprometimento funcional suﬁciente para demência.","D":"Transtorno neurocognitivo de provável etiologia vascular, em razão dos fatores de risco cardiovasculares e da progressão insidiosa. Incorreta. A questão solicita diagnóstico sindrômico, não etiológico. Além disso, não há evidência de padrão evolutivo escalonado, déﬁcits neurológicos focais ou alterações de marcha que sustentem hipótese vascular. A presença isolada de fatores de risco cardiovasculares não permite definir etiologia."},"oficial_extra":[],"refs":["DYNAMED. Dementia evaluation. Ipswich, MA: EBSCO Information Services, [s.d.]. Disponível em: https://www.dynamed.com/evaluation/dementia-evaluation. Acesso em: 21 mar. 2026.","DYNAMED. Alzheimer dementia. Ipswich, MA: EBSCO Information Services, [s.d.]. Disponível em: https://www.dynamed.com/condition/alzheimer-dementia. Acesso em: 21 mar. 2026."],"tema":"CCL x demência inicial","conceito":"O ponto fino: o paciente precisa de AJUDA PARCIAL nas finanças, mas mantém as demais instrumentais (transporte, compras) e todas as básicas. Apoio parcial em uma atividade não é perda significativa de autonomia. MEEM 22 com 4 anos de escolaridade (corte ~25) está alterado.","alt":{"A":"Demência exige perda significativa de autonomia funcional, não apenas apoio pontual em uma tarefa.","B":"CORRETA. Declínio cognitivo objetivo com preservação relativa da independência = CCL.","C":"Envelhecimento normal não tem declínio progressivo mensurável nem MEEM abaixo do corte.","D":"A pergunta é pelo diagnóstico SINDRÔMICO, não etiológico; e não há degraus, focalidade ou alteração de marcha que sustentem causa vascular."},"roteiro":[],"takehome":"Leia se a questão pede diagnóstico sindrômico ou etiológico — a alternativa D erra exatamente por pular essa etapa.","area":"CI · Demências e parkinsonismo"},{"id":89,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":4}],"enunciado":["(AFYA PALMAS) Recém-nascido com 48 horas de vida, idade gestacional de 37 semanas, peso ao nascer 2.450 g, em alojamento conjunto. Apresenta icterícia até zona 3 de Kramer e bilirrubina total de 12 mg/dL às 48 horas, situada em zona de risco intermediário na Curva de Bhutani. A mãe é O positivo e o RN, A positivo. Há aleitamento materno exclusivo com sucção ineficaz nas primeiras 24 horas e perda ponderal de 9%. Sem sinais clínicos de sepse.","Considerando idade gestacional, peso, fatores de risco associados e a Curva de Bhutani, qual é a conduta mais adequada quanto à alta hospitalar?"],"alternativas":{"A":"Manter observação hospitalar ou programar reavaliação em até 24 horas, considerando prematuridade limítrofe, incompatibilidade ABO e dificuldade no aleitamento como fatores de risco para hiperbilirrubinemia grave.","B":"Manter internação hospitalar apenas para observação clínica, sem necessidade de reavaliação laboratorial precoce.","C":"Conceder alta hospitalar com orientação para retorno ambulatorial em 24 a 48 horas, considerando a zona intermediária da Curva de Bhutani e a presença de fatores de risco associados.","D":"Conceder alta hospitalar com orientação para retorno em 7 dias, considerando ausência de indicação formal de fototerapia no momento atual."},"correta":"A","oficial":{"C":"\"Conceder alta hospitalar com orientação para retorno ambulatorial em 24 a 48 horas, considerando a zona intermediária da Curva de Bhutani e a presença de fatores de risco associados.\" Embora proponha retorno precoce, não considera adequadamente o conjunto de fatores de risco presentes.","D":"\"Conceder alta hospitalar com orientação para retorno em 7 dias, considerando ausência de indicação formal de fototerapia no momento atual.\" Retorno em 7 dias é inadequado diante da presença de múltiplos fatores de risco.","B":"\"Manter internação hospitalar apenas para observação clínica, sem necessidade de reavaliação laboratorial precoce.\" A conduta é incompleta, pois não prevê reavaliação laboratorial e acompanhamento estruturado.","A":"\"Manter observação hospitalar ou programar reavaliação em até 24 horas, considerando prematuridade limítrofe, incompatibilidade ABO e dificuldade no aleitamento como fatores de risco para hiperbilirrubinemia grave.\" A presença de prematuridade limítrofe, incompatibilidade ABO, perda ponderal significativa e dificuldade no aleitamento contraindica alta simples, exigindo observação ou retorno muito precoce."},"oficial_extra":[],"refs":["JÚNIOR, Dioclécio C.; BURNS, Dennis A. R. LOPEZ, Fábio A. Tratado de Pediatria, v. 1. Barueri: Manole, 2021.","SOCIEDADE BRASILEIRA DE PEDIATRIA. Manual de Diagnóstico e Tratamento da Icterícia Neonatal. 2021.","BRASIL. Ministério da Saúde. Atenção à Saúde do Recém-Nascido: Guia para os profissionais de saúde. Brasília: MS, 2011."],"tema":"Icterícia — soma de fatores de risco","conceito":"Aqui a bilirrubina está em zona INTERMEDIÁRIA (não indica fototerapia por si), mas somam-se quatro fatores de risco: 37 semanas (prematuridade limítrofe), baixo peso, incompatibilidade ABO (mãe O, RN A) e perda ponderal de 9% com sucção ineficaz.","alt":{"A":"CORRETA. Manter observação ou garantir reavaliação em até 24 h, justamente pelo conjunto de fatores de risco.","B":"Observação sem recontrole laboratorial é conduta incompleta.","C":"Retorno em 24–48 h é frouxo demais para esse conjunto de riscos, e depende de o retorno realmente acontecer.","D":"Sete dias é claramente inadequado — o pico ainda está por vir."},"roteiro":[],"takehome":"A conduta na icterícia não sai só do número: é bilirrubina + horas de vida + fatores de risco. Acumulou risco, encurte o intervalo.","area":"CI · Icterícia neonatal"},{"id":90,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":5}],"enunciado":["(AFYA REDENÇÃO) Uma paciente de 17 anos, solteira, procura atendimento queixando-se de que gasta cerca de 3 a 4 horas por dia verificando se as portas de sua casa estão trancadas e se o gás está desligado. Ela relata que, se não realizar essas verificações em uma sequência específica (múltiplos de três), sente uma ansiedade insuportável e uma convicção de que algo catastrófico acontecerá com sua família. Recentemente, passou a chegar atrasada no trabalho e a evitar sair de casa. Ela reconhece que esses pensamentos são excessivos, mas não consegue ignorá-los. Nega outras comorbidades psiquiátricas, uso de substâncias ou condições médicas prévias.","Com base no quadro clínico e nas diretrizes atuais (DSM-5-TR e protocolos de tratamento), avalie a alternativa correta sobre o diagnóstico e a abordagem terapêutica."],"alternativas":{"A":"O tratamento de escolha combina ISRS em doses altas e TCC com foco em Exposição e Prevenção de Resposta (EPR), apresentando uma latência de melhora mais prolongada, geralmente entre 8 a 12 semanas de terapia.","B":"O tratamento envolve o uso de ISRS em doses baixas associado à psicoterapia de apoio, visando fortalecer o ego da paciente e reduzir a ansiedade de forma rápida, com resposta clínica esperada em até 4 semanas.","C":"O tratamento consiste na prescrição de benzodiazepínicos isolados para controle dos rituais, somado à TCC de orientação analítica, focando na resolução de conflitos simbólicos da infância que geram as compulsões atuais.","D":"O tratamento inicial deve focar em antipsicóticos de segunda geração associados à TCC de relaxamento guiado, técnica de primeira linha para reduzir a rigidez do pensamento obsessivo e a tensão muscular dos rituais."},"correta":"A","oficial":{"B":"Incorreta: O tratamento envolve o uso de ISRS em doses baixas associado à psicoterapia de apoio, visando fortalecer o ego da paciente e reduzir a ansiedade de forma rápida, com resposta clínica esperada em até 4 semanas. No TOC, os ISRS geralmente precisam ser utilizados em doses mais altas, não em doses baixas. Além disso, psicoterapia de apoio isolada não é tratamento de primeira linha. A resposta clínica também costuma ocorrer mais lentamente, geralmente após 8–12 semanas, e não em apenas 4 semanas.","A":"Correta: O tratamento de escolha combina ISRS em doses altas e TCC com foco em Exposição e Prevenção de Resposta (EPR), apresentando uma latência de melhora mais prolongada, geralmente entre 8 a 12 semanas de terapia. O tratamento de primeira linha para TOC envolve ISRS em doses elevadas associados à TCC com Exposição e Prevenção de Resposta (EPR). A latência terapêutica é mais longa, com melhora clínica geralmente observada após 8 a 12 semanas.","C":"Incorreta: O tratamento consiste na prescrição de benzodiazepínicos isolados para controle dos rituais, somado à TCC de orientação analítica, focando na resolução de conflitos simbólicos da infância que geram as compulsões atuais. Benzodiazepínicos não são tratamento de primeira linha para TOC, pois não atuam nos mecanismos centrais do transtorno e apresentam risco de dependência. Além disso, TCC de orientação analítica ou abordagens psicodinâmicas não têm evidência robusta para tratamento do TOC comparadas à EPR.","D":"Incorreta: O tratamento inicial deve focar em antipsicóticos de segunda geração associados à TCC de relaxamento guiado, técnica de primeira linha para reduzir a rigidez do pensamento obsessivo e a tensão muscular dos rituais. Antipsicóticos de segunda geração não são tratamento inicial para TOC. Eles podem ser utilizados como estratégia de potencialização (augmentation) em pacientes refratários aos ISRS. Técnicas de relaxamento também não são consideradas tratamento principal, pois não atuam diretamente nos rituais compulsivos."},"oficial_extra":[],"refs":["AMERICAN PSYCHIATRIC ASSOCIATION. Diagnostic and Statistical Manual of Mental Disorders: DSM-5-TR. 5. ed. rev. Washington, DC: American Psychiatric Publishing, 2022.","KATZMAN, Martin A. et al. Canadian clinical practice guidelines for the management of obsessive-compulsive disorder. BMC Psychiatry, Londres, v. 14, supl. 1, 2014.","SADOCK, Benjamin J.; SADOCK, Virginia A.; RUIZ, Pedro. Kaplan & Sadock: compêndio de psiquiatria. 11. ed. Porto Alegre: Artmed, 2017."],"tema":"TOC — detalhes do tratamento","conceito":"Três detalhes que a questão cobra: ISRS em doses ALTAS, TCC especificamente com EPR, e latência longa de 8 a 12 semanas.","alt":{"A":"CORRETA. ISRS em dose alta + TCC com EPR, com melhora esperada em 8–12 semanas.","B":"Erra em três pontos: dose baixa, psicoterapia de apoio e resposta em 4 semanas.","C":"Benzodiazepínico isolado não trata TOC; abordagem analítica não tem evidência comparável à EPR.","D":"Antipsicótico de 2ª geração é potencialização em refratários, e relaxamento não atua sobre os rituais."},"roteiro":[],"takehome":"Se a alternativa prometer resposta rápida no TOC, desconfie: a latência é de 8 a 12 semanas.","area":"CI · Psiquiatria (TOC, ansiedade, humor)"},{"id":91,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":7}],"enunciado":["(AFYA ABAETETUBA) Uma paciente de 58 anos, com diagnóstico de Transtorno Esquizoafetivo há 15 anos, em uso regular de Haloperidol (5 mg/dia) e Risperidona (2 mg/dia), é encaminhada ao ambulatório de neurologia por apresentar tremor nas mãos e lentidão de movimentos com início há cerca de 4 meses. A acompanhante relata que a paciente \"anda mais devagar\" e apresenta face inexpressiva.","No exame físico:","Fácies: Hipomimia facial acentuada.","Tonus: Rigidez em \"roda denteada\" presente em punhos e cotovelos, de forma simétrica bilateralmente.","Tremor: Tremor de repouso e postural moderado, observado em ambas as mãos simultaneamente desde o início do quadro.","Marcha: Passos curtos, sem instabilidade postural importante; reflexo de retropulsão negativo.","Oculomotricidade: Movimentos oculares extrínsecos preservados, sem limitação do olhar vertical.","Diante do quadro clínico e do histórico da paciente, qual a principal hipótese diagnóstica e a conduta inicial mais adequada?"],"alternativas":{"A":"Parkinsonismo vascular; solicitar tomografia de crânio para identificar infartos lacunares em núcleos da base e prescrever AAS e estatina.","B":"Paralisia Supranuclear Progressiva (PSP); solicitar ressonância magnética para avaliar o sinal do \"beija-flor\" no mesencéfalo e iniciar Amantadina.","C":"Parkinsonismo Farmacológico; considerar, em conjunto com a psiquiatria, a redução dos neurolépticos típicos ou a substituição por antipsicóticos atípicos com menor perfil extrapiramidal (como a Quetiapina ou Clozapina).","D":"Doença de Parkinson Idiopática; iniciar Levodopa/Benserazida em baixas doses e realizar ressonância magnética de crânio."},"correta":"C","oficial":{},"oficial_extra":["Justificativa da Resposta Correta:","A alternativa está correta. O diagnóstico de Parkinsonismo Farmacológico é a principal hipótese devido a dois fatores fundamentais:","Nexo causal: Uso crônico e atual de neurolépticos de alta potência (Haloperidol) e um antipsicótico atípico que também possui bloqueio dopaminérgico significativo (Risperidona).","Apresentação Clínica Simétrica: Diferente da Doença de Parkinson Idiopática, que classicamente inicia de forma assimétrica (unilateral), o parkinsonismo induzido por drogas costuma apresentar-se de forma simétrica desde o início, com rigidez e tremor em ambos os dimídios. Conduta: A primeira medida é a tentativa de retirada ou substituição da droga causadora (bloqueadores de receptores D2 de dopamina) por fármacos com menor afinidade por receptores dopaminérgicos na via nigroestriatal.","Análise das Alternativas Incorretas (Distratores):","A Doença de Parkinson Idiopática geralmente começa de forma unilateral e assimétrica. Além disso, prescrever Levodopa para um paciente que usa bloqueadores dopaminérgicos potentes (neurolépticos) terá pouco efeito terapêutico e pode exacerbar sintomas psicóticos, então essa questão está incorreta.","A PSP é um parkinsonismo atípico que se manifesta com quedas precoces e, crucialmente, paralisia do olhar vertical, que está preservada nesta paciente, então essa questão está incorreta.","O parkinsonismo vascular geralmente afeta predominantemente os membros inferiores (\"parkinsonismo da parte inferior do corpo\"), com marcha magnética e sem tremor de repouso típico, além de histórico de eventos cerebrovasculares, então essa questão está incorreta."],"refs":["NITRINI, R.; BACHESCHI, L. A. A neurologia que todo médico deve saber. 3.ª ed. São Paulo: Atheneu, 2015. (Capítulo sobre Distúrbios do Movimento).","BRASIL. Ministério da Saúde. Protocolo Clínico e Diretrizes Terapêuticas (PCDT) - Doença de Parkinson. Brasília, 2017 (atualizado em 2022).","ACADEMIA BRASILEIRA DE NEUROLOGIA (ABN). Consenso Nacional sobre o Diagnóstico da Doença de Parkinson.","CAMPBELL, W. W. De Jong : O Exame Neurológico. 7.ª ed. Rio de Janeiro: Guanabara Koogan, 2014."],"tema":"Parkinsonismo farmacológico","conceito":"Contraponto da questão 79. Aqui tudo aponta para causa medicamentosa: uso de haloperidol (neuroléptico típico, alta potência) + risperidona, quadro SIMÉTRICO desde o início, tremor de repouso E postural, sem instabilidade postural e sem alteração do olhar vertical.","alt":{"A":"Vascular teria marcha magnética de predomínio em membros inferiores e lesões vasculares; e a simetria aqui se explica pelo fármaco.","B":"PSP cursa com quedas precoces, instabilidade postural e paralisia do olhar vertical — explicitamente ausentes no exame.","C":"CORRETA. Parkinsonismo farmacológico; conduta é discutir com a psiquiatria a redução do típico ou troca por atípico de menor perfil extrapiramidal (quetiapina ou clozapina).","D":"Parkinson idiopático é ASSIMÉTRICO no início, e iniciar levodopa sem antes rever o neuroléptico é tratar o efeito sem remover a causa."},"roteiro":[],"takehome":"Simetria desde o início + neuroléptico em uso = parkinsonismo farmacológico. Pode levar meses (até 6–12) para regredir após a suspensão.","area":"CI · Demências e parkinsonismo"},{"id":92,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":11}],"enunciado":["(AFYA ITACOATIARA) Uma menina de 7 anos é levada ao ambulatório pediátrico pela mãe com queixa de febre há mais de 14 dias, com picos diários acima de 38,5°C. A criança também apresenta perda ponderal de aproximadamente 2 kg nos últimos 20 dias. A mãe relata que a febre não responde adequadamente aos antitérmicos e que a criança está mais pálida e cansada que o habitual. No exame físico, você encontra: palidez de mucosas, hepatomegalia discreta (fígado palpável 2 cm abaixo do rebordo costal), ausência de esplenomegalia, sem linfadenopatia cervical, axilar ou inguinal. Não há sinais de inflamação nas vias aéreas superiores, ouvidos ou pele. A ausculta pulmonar e cardíaca está normal. Os exames laboratoriais iniciais mostram:","• Hemograma: hemoglobina 9,5 g/dL, hematócrito 28%, VCM 72 fL (microcítico), leucócitos 7.500/μL (normal), plaquetas 450.000/μL (elevadas);","• Proteína C-reativa (PCR): 12 mg/dL (elevada);","• Velocidade de hemossedimentação (VHS): 68 mm/h (muito elevada);","• Hemoculturas: negativas (2 amostras);","• Sorologia para EBV, CMV e toxoplasmose: negativas;","• Teste tuberculínico (Mantoux): negativo;","• Radiografia de tórax: normal;","Considerando o quadro clínico de febre prolongada, perda ponderal, palidez, hepatomegalia, anemia microcítica e marcadores inflamatórios elevados, qual é o próximo passo diagnóstico mais apropriado para orientar a investigação?"],"alternativas":{"A":"Realizar tomografia de abdômen com contraste para avaliar hepatomegalia e descartar massas abdominais, seguido de mielograma se houver suspeita de doença hematológica.","B":"Solicitar cintilografia óssea para descartar metástases ósseas e avaliar atividade inflamatória sistêmica.","C":"Realizar hemograma com contagem diferencial detalhada e mielograma para avaliar a série vermelha, série branca e série megacariocitária, buscando evidências de infiltração medular ou discrasia sanguínea.","D":"Solicitar imediatamente ressonância magnética de abdômen e pelve para melhor caracterização de possíveis lesões, pois oferece melhor resolução de partes moles."},"correta":"C","oficial":{"C":"- Realizar hemograma com contagem diferencial detalhada e mielograma para avaliar a série vermelha, série branca e série megacariocitária, buscando evidências de infiltração medular ou discrasia sanguínea.","A":"- Realizar tomografia de abdômen com contraste para avaliar hepatomegalia e descartar massas abdominais, seguido de mielograma se houver suspeita de doença hematológica.","D":"- Solicitar imediatamente ressonância magnética de abdômen e pelve para melhor caracterização de possíveis lesões, pois oferece melhor resolução de partes moles.","B":"- Solicitar cintilografia óssea para descartar metástases ósseas e avaliar atividade inflamatória sistêmica."},"oficial_extra":["Esta alternativa está correta. O caso apresenta características que levantam suspeita de malignidade hematológica, particularmente leucemia aguda, como primeira hipótese no diagnóstico diferencial de febre prolongada em pediatria:","1. Febre prolongada (>14 dias): sugestiva de processo sistêmico crônico ou maligno.","2. Perda ponderal: indicador de consumo energético aumentado, comum em neoplasias.","3. Palidez: sugestiva de anemia, que pode ser secundária à infiltração medular.","4. Anemia microcítica: O padrão microcítico pode representar anemia de doença crônica ou infiltração medular por células leucêmicas, afetando a produção de hemácias normais.","5. Trombocitose: plaquetas elevadas (450.000/μL) podem representar reação a inflamação crônica ou, alternativamente, ser parte de um padrão de discrasia sanguínea.","6. Hepatomegalia: comum em leucemias agudas pela infiltração de células blásticas.","7. Marcadores inflamatórios elevados (PCR e VHS): refletem atividade inflamatória ou processo maligno.","8. Ausência de linfadenopatia: não exclui leucemia; muitos casos de leucemia aguda não apresentam linfadenopatia periférica evidente.","9. Hemoculturas negativas e sorologia negativa: afastam infecções bacterianas e virais comuns, reforçando a suspeita de etiologia não infecciosa. Estratégia","Diagnóstico Apropriado: a próxima etapa deve ser a realização de mielograma (aspirado de medula óssea), precedida por um hemograma com contagem diferencial detalhada. Essa abordagem é fundamentada em:","1. Hemograma com diferencial: permite avaliar se há presença de células blásticas circulantes, que seriam altamente sugestivas de leucemia aguda. Também fornece informações sobre a série branca (contagem e tipo de leucócitos) e série megacariocitária.","2. Mielograma: É o exame definitivo para diagnosticar discrasia sanguínea, permitindo:","• Avaliação da celularidade medular; • Identificação de células blásticas; • Diagnóstico de leucemia aguda.","• Avaliação de infiltração medular por outras neoplasias;","• Diagnóstico de outras doenças hematológicas (anemia aplástica, síndrome mielodisplásica, etc.). Por que as outras alternativas estão incorretas:","Esta alternativa está incorreta. Embora a tomografia seja útil para caracterizar massas abdominais, ela não é o próximo passo mais apropriado. O mielograma deve preceder a tomografia, pois é mais específico para diagnosticar malignidades hematológicas e é menos invasivo. A tomografia pode ser indicada posteriormente se o mielograma for normal e houver suspeita de tumor sólido.","Esta alternativa está incorreta. A ressonância magnética, embora ofereça excelente resolução de partes moles, não é o próximo passo apropriado. Ela seria indicada após o mielograma, se necessária melhor caracterização de lesões específicas. Além disso, é um exame mais demorado e custoso.","Esta alternativa está incorreta. A cintilografia óssea é útil para avaliar metástases ósseas e atividade inflamatória, mas não é o próximo passo mais apropriado em um caso com suspeita de malignidade hematológica. Seria indicada após confirmação diagnóstica e estadiamento."],"refs":["BURNS, Dennis Alexander Rabelo et al. Tratado de Pediatria: Sociedade Brasileira de Pediatria. 4. ed. Vols. 1 e 2. Barueri, SP: Manole, 2017.","STAHL, Stephen M. Psicofarmacologia: bases neurocientíficas e aplicações práticas / Stephen M. Stahl, 4.ª ed. Rio de Janeiro: Guanabara Koogan, 2020.","ZUGAIB, Marcelo. Obstetrícia 4.ª ed. Barueri – São Paulo: Manole, 2020."],"tema":"Febre de origem indeterminada na criança","conceito":"Febre > 14 dias, perda ponderal, palidez, hepatomegalia, anemia, VHS 68 e PCR alta, com investigação infecciosa negativa (hemoculturas, EBV, CMV, toxoplasmose, PPD, radiografia). Mesmo com leucócitos e plaquetas normais, a leucemia pode se apresentar SEM blastos circulantes (forma aleucêmica) — por isso o mielograma.","alt":{"A":"A TC pode vir depois; começar por imagem e deixar o mielograma condicional inverte a prioridade.","B":"Cintilografia óssea não é etapa inicial na investigação de febre prolongada na criança.","C":"CORRETA. Hemograma com diferencial detalhado + mielograma, avaliando as três séries e procurando infiltração medular.","D":"RM de abdome e pelve não responde à principal hipótese e atrasa o diagnóstico."},"roteiro":[],"takehome":"Hemograma normal NÃO exclui leucemia. Com febre prolongada e investigação infecciosa negativa, o mielograma é o exame que fecha.","area":"CI · Onco-hematologia pediátrica"},{"id":93,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":12}],"enunciado":["(AFYA MARABÁ) E.R. L., 75 anos, sexo feminino, acompanhada no ambulatório de Geriatria, apresenta diagnóstico estabelecido há um ano de comprometimento cognitivo progressivo, com prejuízo predominante de memória episódica, desorientação espacial e dificuldade para manejo de finanças e medicações. A família refere piora gradual nos últimos 12 meses. Apresenta dependência parcial para atividades instrumentais da vida diária e independência preservada para atividades básicas. Mini-Exame do Estado Mental: 19/30.","Comorbidades: hipertensão arterial sistêmica e diabetes mellitus tipo 2 controlados.","Medicações em uso: losartana, metformina e hidroclorotiazida.","Exames laboratoriais recentes sem alterações metabólicas ou deficiência vitamínica. Ressonância magnética de encéfalo evidencia atrofia cortical difusa com predomínio temporoparietal bilateral.","A família relata episódios ocasionais de agitação no final do dia, sem agressividade, e dificuldade crescente para organização da rotina.","Diante do quadro apresentado, indique a melhor estratégia terapêutica global neste momento."],"alternativas":{"A":"Prescrever antidepressivo tricíclico para melhora cognitiva, associando reposição vitamínica empírica e reavaliação em seis meses.","B":"Iniciar inibidor de acetilcolinesterase, associar intervenções não farmacológicas estruturadas, otimizar controle de fatores cardiovasculares e orientar cuidador quanto à progressão da doença.","C":"Introduzir antipsicótico atípico em dose baixa como terapia de base, suspender medicações anti-hipertensivas e iniciar benzodiazepínico para controle comportamental contínuo.","D":"Iniciar memantina em monoterapia, sem necessidade de intervenções psicossociais adicionais, mantendo apenas acompanhamento anual."},"correta":"B","oficial":{"B":"Correta: Iniciar inibidor de acetilcolinesterase, associar intervenções não farmacológicas estruturadas, otimizar controle de fatores cardiovasculares e orientar cuidador quanto à progressão da doença. O caso descreve quadro compatível com estágio leve a moderado de transtorno neurocognitivo degenerativo (Doença de Alzheimer), com prejuízo funcional instrumental e MEEM 19/30. As diretrizes recomendam como primeira linha os inibidores de acetilcolinesterase (donepezila, rivastigmina ou galantamina) para estágios leve a moderado, visando estabilização cognitiva e funcional.","C":"Incorreta: Introduzir antipsicótico atípico em dose baixa como terapia de base, suspender medicações anti-hipertensivas e iniciar benzodiazepínico para controle comportamental contínuo. Antipsicóticos não são terapia de base e devem ser reservados para sintomas comportamentais graves com risco, devido ao aumento de eventos adversos (AVC e mortalidade). Benzodiazepínicos aumentam risco de quedas e piora cognitiva. Suspensão injustificada de anti-hipertensivos pode agravar risco vascular.","D":"Incorreta: Iniciar memantina em monoterapia, sem necessidade de intervenções psicossociais adicionais, mantendo apenas acompanhamento anual. A memantina é indicada principalmente em estágio moderado a grave ou em associação com inibidor de acetilcolinesterase. A monoterapia nesta fase não é a estratégia inicial preferencial. Além disso, acompanhamento anual é insuficiente; o seguimento deve ser periódico.","A":"Incorreta: Prescrever antidepressivo tricíclico para melhora cognitiva, associando reposição vitamínica empírica e reavaliação em seis meses. Antidepressivos tricíclicos possuem efeito anticolinérgico e podem piorar cognição. Reposição vitamínica empírica sem deficiência comprovada não é recomendada. Não há evidência de benefício cognitivo nessa estratégia."},"oficial_extra":["Além do tratamento farmacológico, a abordagem deve ser multidimensional, incluindo:","Intervenções não farmacológicas (estimulação cognitiva, organização ambiental, rotina estruturada);","Controle rigoroso de fatores de risco cardiovasculares;","Educação e suporte ao cuidador;","Planejamento antecipado de cuidados.","Essa estratégia global está alinhada às melhores evidências para retardar declínio funcional e melhorar qualidade de vida.","Referência:","LOPES, Antonio C. Manual de Clínica Médica. Rio de Janeiro: Guanabara Koogan, 2020; AMERICAN PSYCHIATRIC ASSOCIATION. Manual diagnóstico e estatístico de transtornos mentais: DSM-5. 5. ed. Porto Alegre: Artmed, 2014."],"refs":[],"tema":"Alzheimer — estratégia global","conceito":"Demência leve a moderada (MEEM 19, dependência instrumental, atrofia temporoparietal). A resposta certa é a que trata em várias frentes, não só com fármaco. O 'sundowning' (agitação no fim do dia) se maneja com medidas ambientais primeiro.","alt":{"A":"Tricíclico é anticolinérgico e PIORA a cognição; reposição vitamínica empírica sem deficiência não se justifica.","B":"CORRETA. Anticolinesterásico + intervenções não farmacológicas estruturadas + controle de fatores cardiovasculares + orientação ao cuidador.","C":"Antipsicótico como terapia de base aumenta AVC e mortalidade em idosos com demência; benzodiazepínico contínuo aumenta quedas; suspender anti-hipertensivo é injustificado.","D":"Memantina é para moderada a grave ou em associação, e 'sem intervenções psicossociais, com acompanhamento anual' torna a alternativa errada mesmo se o fármaco fosse adequado."},"roteiro":[],"takehome":"Nas questões de demência, a alternativa correta quase sempre é a MULTIDIMENSIONAL: fármaco + não farmacológico + risco vascular + cuidador.","area":"CI · Demências e parkinsonismo"},{"id":94,"materia":"CI 3","tipo":"objetiva","provas":[{"prova":"CI 3 2026.1","num":13}],"enunciado":["(AFYA BRAGANÇA) Uma mulher de 26 anos, G1P0, com aproximadamente 9 semanas de gestação confirmada por teste laboratorial, procura a Unidade Básica de Saúde (UBS) relatando sangramento vaginal de pequena quantidade iniciado há cerca de 6 horas, associado a leve cólica em baixo ventre. Nega febre, eliminação de tecidos ou dor abdominal intensa. Ao exame físico, apresenta sinais vitais estáveis, abdome sem sinais de irritação peritoneal e toque vaginal evidenciando colo uterino fechado, com pequeno sangramento em fundo de saco vaginal. Diante do quadro clínico, o médico deve considerar os principais diagnósticos diferenciais do sangramento no primeiro trimestre da gestação. Com base nesse cenário clínico, assinale a alternativa que apresenta o diagnóstico mais provável e um importante diagnóstico diferencial que deve ser sempre considerado nessa situação."],"alternativas":{"A":"Placenta prévia como hipótese mais provável e mola hidatiforme como diagnóstico diferencial principal.","B":"Trabalho de parto prematuro como hipótese mais provável e gravidez ectópica rota como diagnóstico diferencial.","C":"Ameaça de abortamento como hipótese mais provável e gravidez ectópica como diagnóstico diferencial relevante.","D":"Abortamento inevitável como hipótese mais provável e descolamento prematuro de placenta como diagnóstico diferencial."},"correta":"C","oficial":{"A":"As alternativas \"Abortamento inevitável como hipótese mais provável e descolamento prematuro de placenta como diagnóstico diferencial.\", \"Placenta prévia como hipótese mais provável e mola hidatiforme como diagnóstico diferencial principal.\" e \"Trabalho de parto prematuro como hipótese mais provável e gravidez ectópica rota como diagnóstico diferencial.\" estão incorretas porque incluem diagnósticos mais comuns em períodos gestacionais posteriores, como placenta prévia, descolamento prematuro de placenta e trabalho de parto prematuro, condições que não fazem parte do diagnóstico diferencial típico do primeiro trimestre."},"oficial_extra":["O sangramento vaginal no primeiro trimestre da gestação é uma queixa relativamente frequente na prática clínica e exige avaliação cuidadosa para diferenciar causas benignas de condições potencialmente graves.","No caso apresentado, alguns elementos clínicos são fundamentais:","Gestação com 9 semanas (primeiro trimestre);","Sangramento vaginal discreto;","Cólica leve;","Colo uterino fechado ao toque vaginal;","Estabilidade hemodinâmica.","Esses achados são típicos de ameaça de abortamento, condição em que ocorre sangramento uterino antes de 20 semanas de gestação, com colo uterino fechado e sem eliminação de produtos da concepção. Nessa situação, a gestação ainda pode evoluir normalmente.","Entretanto, todo sangramento no início da gestação exige a exclusão de diagnósticos diferenciais importantes, principalmente:","Gravidez ectópica, especialmente quando há dor abdominal ou instabilidade hemodinâmica.","Abortamento em curso ou inevitável, quando há dilatação cervical.","Abortamento completo ou incompleto, quando ocorre eliminação de tecidos.","Mola hidatiforme, geralmente associada a sangramento, aumento uterino desproporcional e níveis muito elevados de β-hCG.","Assim, na atenção primária, diante de um quadro como esse, a conduta inclui avaliação clínica, dosagem de β-hCG e ultrassonografia obstétrica, além de orientação e acompanhamento da paciente."],"refs":["BEREK, Jonathan S.; BEREK, Deborah L. Berek & Novak. Tratado de Ginecologia. 16. ed. Rio de Janeiro: Guanabara Koogan, 2016.","CENDOROGLO, Maysa S. Guia de Geriatria e Gerontologia. Ed. Manole, 2011. E- book. ISBN 9788520451908. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788520451908/. Acesso em: 12 maio 2025."],"tema":"Sangramento no 1º trimestre — diferenciais","conceito":"A questão testa se você sabe quais diagnósticos pertencem a cada metade da gestação. Primeira metade: abortamento (em suas formas), gestação ectópica e doença trofoblástica. Segunda metade: placenta prévia, descolamento prematuro de placenta, rotura uterina e trabalho de parto prematuro.","alt":{"A":"Placenta prévia é da segunda metade (sangramento indolor, vermelho vivo, recorrente).","B":"Trabalho de parto prematuro é a partir de 20–22 semanas.","C":"CORRETA. Ameaça de abortamento (colo fechado, sangramento pequeno, estável) com gestação ectópica como diferencial obrigatório.","D":"Inevitável exigiria colo dilatado, e DPP é da segunda metade."},"roteiro":[],"takehome":"Antes de escolher, pergunte: esse diagnóstico existe com 9 semanas? Isso elimina três alternativas de uma vez.","area":"CI · Sangramentos da 1ª metade da gestação"},{"id":95,"materia":"CI 3","tipo":"discursiva","provas":[{"prova":"CI 3 2026.1","num":14}],"enunciado":["(AFYA PARAÍBA) Durante uma consulta de revisão do recém-nascido na Unidade Básica de Saúde, uma médica da Estratégia Saúde da Família avalia um lactente de 3 dias de vida, nascido a termo, por parto vaginal, com peso adequado para a idade gestacional e Apgar 8/9, sem intercorrências neonatais. A mãe relata que o bebê encontra-se em aleitamento materno exclusivo, com boa sucção e intervalos regulares entre as mamadas.","Durante a anamnese, a mãe informa que percebeu coloração amarelada da pele desde o segundo dia de vida, com discreta progressão. Ao exame físico, o recém- nascido apresenta bom estado geral, está ativo, hidratado, com frequência cardíaca e respiratória dentro da normalidade. Observa-se icterícia cutânea em face e tronco superior, correspondente aproximadamente à zona II de Kramer, sem presença de icterícia em membros inferiores ou palmas e plantas. Não há sinais de hepatomegalia, esplenomegalia ou alteração do nível de consciência.","Considerando o quadro clínico apresentado, responda:","a) Qual é o diagnóstico mais provável para este recém-nascido? (1,25 ponto)","b) Considerando a idade do recém-nascido e a zona de Kramer observada, qual é a conduta adequada neste caso? (1,25 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Justificativa:","1. Diagnóstico","O diagnóstico mais provável é icterícia neonatal fisiológica.","A icterícia fisiológica apresenta características típicas:","início após 24 horas de vida;","pico entre 3º e 5º dias em recém-nascidos a termo;","progressão cefalocaudal, descrita pelas zonas de Kramer;","ausência de sinais clínicos de gravidade;","recém-nascido em bom estado geral.","2. Conduta esperada","A conduta esperada inclui:","manter o aleitamento materno em livre demanda;","realizar avaliação clínica seriada da icterícia;","considerar dosagem de bilirrubina sérica ou transcutânea, especialmente se houver progressão da icterícia ou fatores de risco;","orientar os responsáveis sobre sinais de alerta (letargia, dificuldade de sucção, progressão da icterícia para membros inferiores, alteração de comportamento);","programar reavaliação clínica precoce na APS.","A investigação adicional ou encaminhamento hospitalar pode ser considerado caso ocorram:","aparecimento de icterícia nas primeiras 24 horas de vida;","progressão rápida da icterícia;","níveis elevados de bilirrubina para a idade em horas;","sinais de doença sistêmica."],"refs":["JÚNIOR, Dioclécio C. BURNS, Dennis Alexander R.. LOPEZ, Fábio A. Tratado de pediatria, v. 1. Editora Manole, 2021. E-book. ISBN 9786555767476. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9786555767476/. Acesso em: 28 mar. 2023.","Sociedade Brasileira de Pediatria (SBP) – Manual de Diagnóstico e Tratamento da Icterícia Neonatal. 2021.","Sociedade Brasileira de Pediatria (SBP) – Hiperbilirrubinemia indireta no período neonatal. 2021.","Ministério da Saúde – Atenção à Saúde do Recém-Nascido: Guia para os profissionais de saúde. Vol. 1 e 2. Brasília: 2011."],"tema":"Icterícia fisiológica — zona II de Kramer","conceito":"Critérios de fisiológica todos presentes: início após 24 h (2º dia), progressão céfalo-caudal lenta, RN a termo em bom estado geral, sem visceromegalias e mamando bem.","alt":{},"roteiro":["a) Icterícia neonatal fisiológica.","Sustente com: início após 24 h de vida, pico esperado entre o 3º e o 5º dia no termo, progressão cefalocaudal (zona II = face + tronco superior, BI ~5–12 mg/dL), bom estado geral e ausência de sinais de gravidade.","b) Conduta: manter aleitamento em livre demanda; avaliação clínica seriada da icterícia.","Considerar bilirrubina sérica ou transcutânea se houver progressão ou fatores de risco, plotando em Bhutani.","Orientar sinais de alerta: letargia, sucção fraca, progressão para membros inferiores, palmas e plantas, alteração de comportamento.","Programar reavaliação precoce na APS (até o 5º dia de vida). Encaminhar se icterícia nas primeiras 24 h, progressão rápida ou sinais sistêmicos."],"takehome":"Três perguntas fecham o caso: começou depois de 24 h? O bebê está bem e mamando? Há fator de risco? Três 'sim/não' favoráveis = fisiológica.","area":"CI · Icterícia neonatal"},{"id":96,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":1}],"enunciado":["( AFYA IPATINGA) Vítima de atropelamento por carro, 9 anos, sem perda de consciência imediata, referindo dor abdominal intensa durante atendimento pré-hospitalar evolui com rebaixamento de nível de consciência (Glasgow 6) e pressão arterial inaudível, abdome tenso e equimose periumbilical.","Identifique a sequência correta de medidas recomendadas no atendimento pré-hospitalar dessa criança."],"alternativas":{"A":"Abertura de vias aéreas, colocação de colar cervical, aquisição de acesso venoso periférico calibroso, intubação orotraqueal, administração de cristalóide e infusão de drogas vasoativas, transporte rápido para unidade de pronto-atendimento.","B":"Abertura de vias aéreas, colocação de colar cervical, intubação orotraqueal, aquisição de acesso venoso periférico calibroso, administração de colóide, transporte rápido para unidade de pronto- atendimento.","C":"Aquisição de acesso venoso periférico calibroso, administração de cristalóide, abertura de vias aéreas, intubação orotraqueal, colocação de colar cervical e transporte rápido para centro hospitalar de trauma.","D":"Abertura de vias aéreas, colocação de colar cervical, intubação orotraqueal, aquisição de acesso venoso periférico calibroso, administração de cristalóide, transporte rápido para centro hospitalar de trauma."},"correta":"D","oficial":{"C":"Aquisição de acesso venoso periférico calibroso, administração de cristaloide, abertura de vias aéreas, intubação orotraqueal, colocação de colar cervical e transporte rápido para centro hospitalar de trauma. Incorreta: ordem das intervenções é inadequada. A abertura das vias aéreas e a proteção da coluna cervical devem preceder o acesso venoso e a administração de fluidos."},"oficial_extra":["O mnemônico XABCDE deve ser lembrado para a realização sequencial do atendimento pré- hospitalar de politraumatizados, onde X caracteriza o controle de hemorragias externas exsanguinantes, A o manejo das vias áreas com imobilização adequada de coluna cervical, B a identificação e manejo de situações que comprometem a ventilação e oxigenação pulmonar, C a identificação e manejo de situações que comprometem a perfusão e causam hemorragias, D a identificação e manejo de situações que comprometem a função cerebral e E a identificação e manejo de situações que gerem hipotermia e lesões ocultas.","No caso exposto, trata-se de uma criança que evolui rapidamente para choque hemorrágico com rebaixamento de consciência evidenciando a necessidade de abertura de vias aéreas com a realização de uma via aérea definitiva por intubação orotraqueal mantendo a imobilização da coluna cervical devido ao mecanismo de trauma contuso por atropelamento e impossibilidade de se descartar lesão cervical no momento do atendimento. Apesar de nem sempre indicada, a administração de solução cristaloide no pré-hospitalar pode ser valiosa em pacientes com evidência de traumatismos cranioencefálico e hipotensão aguda.","E por último, o tratamento do choque hemorrágico grave requer recursos normalmente não disponíveis no pré-hospitalar (sala cirúrgica, hemoderivados) portanto é importante o transporte rápido para um local com recursos adequados para o tratamento definitivo da lesão, ou seja, um centro hospitalar de trauma mais próximo.","Administração de coloide: Incorreto. O uso de coloides não é recomendado de rotina no trauma pediátrico. A reposição volêmica inicial deve ser feita com solução cristaloide (como soro fisiológico ou Ringer lactato), que é mais segura e amplamente utilizada.","A infusão de drogas vasoativas não é recomendada no atendimento inicial pré-hospitalar para este paciente, a menos que haja sinais de choque refratário à reposição volêmica.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. 10a ed., 2023."],"refs":[],"tema":"Trauma pediátrico — sequência do atendimento","conceito":"A ordem é o XABCDE: X hemorragia exsanguinante, A via aérea com proteção cervical, B ventilação, C circulação, D neurológico, E exposição. Criança com Glasgow 6 precisa de via aérea definitiva; a hipotensão na criança é sinal TARDIO (compensa por vasoconstrição e taquicardia até perder ~30–45% da volemia). Equimose periumbilical com abdome tenso sugere lesão de víscera — o destino tem que ser centro de trauma.","alt":{"A":"Inverte a ordem (acesso antes da via aérea definitiva), usa droga vasoativa, que não trata choque hemorrágico, e leva a pronto-atendimento em vez de centro de trauma.","B":"Ordem correta, mas erra no fluido: a reposição inicial no trauma é com CRISTALOIDE (Ringer lactato), 20 mL/kg na criança, e depois hemoderivados — coloide não é indicado. E o destino está errado.","C":"Começa pelo acesso venoso, violando a sequência ABCDE.","D":"CORRETA. Via aérea + colar cervical → intubação → acesso venoso calibroso → cristaloide → transporte rápido para CENTRO DE TRAUMA."},"roteiro":[],"takehome":"Duas coisas decidem a alternativa: a ordem do ABCDE e o destino. Criança grave com abdome agudo traumático vai para centro de trauma, não para o pronto-atendimento mais próximo.","area":"HAM · Atendimento ao politraumatizado"},{"id":97,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":2}],"enunciado":["( AFYA PARAÍBA) Um jovem, de 15 anos, foi encontrado flutuando em um rio por uma equipe de resgate e foi retirado da água. Quando a equipe de atendimento médico pré-hospitalar chega ao local, o paciente está inconsciente, sem respiração espontânea, com pulso carotídeo presente.","Qual a classificação e o manejo adequado inicial para este paciente afogado?"],"alternativas":{"A":"Grau 4 de afogamento, deve iniciar a monitorização do ritmo cardíaco e avaliar a necessidade de desfibrilação precoce, enquanto oferece oxigênio suplementar com máscara facial a 15l/min.","B":"Grau 5 de afogamento, deve receber suporte de ventilação assistida com bolsa-válvula-máscara (BVM) com oxigênio em alto fluxo, priorizando a correção da hipóxia e considerar a intubação orotraqueal.","C":"Grau 4 de afogamento, deve posicionar o paciente em decúbito lateral esquerdo para drenar a água dos pulmões antes de iniciar qualquer outra intervenção.","D":"Grau 5 de afogamento, deve realizar compressões torácicas imediatamente, seguido de ventilação com oxigênio a 15 L/min com bolsa-válvula-máscara, independente da presença de pulso, considerando a possibilidade de hipóxia severa."},"correta":"B","oficial":{},"oficial_extra":["Para um paciente afogado que está inconsciente, sem respiração espontânea, mas com pulso presente, é classificado como grau 5 no sistema de avaliação e o manejo inicial deve priorizar a correção da hipóxia. A ventilação assistida com bolsa-válvula-máscara (BVM) deve ser iniciada imediatamente com oxigênio em alto fluxo, considerando a intubação orotraqueal com ventilação mecânica. A prioridade é restaurar a oxigenação e evitar a progressão para parada cardíaca devido à hipóxia.","Referência:","PHTLS - Atendimento pré-hospitalar ao traumatizado. 9. ed. Burlington: Jones & Bartlett Learning, 2020."],"refs":[],"tema":"Afogamento — classificação de Szpilman","conceito":"Graus: 1 tosse sem espuma; 2 pouca espuma em boca/nariz; 3 muita espuma com PULSO presente; 4 muita espuma com hipotensão/choque; 5 PARADA RESPIRATÓRIA com pulso presente; 6 parada cardiorrespiratória. O afogamento é uma parada por HIPÓXIA — por isso começa com 5 ventilações de resgate, não com compressões.","alt":{"A":"Grau 4 tem respiração presente com hipotensão; e desfibrilação não é a prioridade num paciente com pulso.","B":"CORRETA. Grau 5 (apneia com pulso): ventilação com BVM e oxigênio em alto fluxo, corrigindo a hipóxia, considerando intubação.","C":"Manobra para 'drenar água' está PROSCRITA: não há água a drenar em quantidade relevante, e a manobra atrasa a ventilação e provoca vômito/aspiração.","D":"Compressão torácica com pulso presente é erro — o paciente precisa de ventilação, não de RCP."},"roteiro":[],"takehome":"No afogamento, o A e o B mandam. Grau 5 = ventilar; grau 6 = RCP começando por ventilações.","area":"HAM · Queimaduras e trauma ambiental"},{"id":98,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":3}],"enunciado":["( UNINOVAFAPI) Um homem de 45 anos, foi envolvido em um acidente automobilístico frontal. Ele apresenta sinais de dor em várias áreas do corpo e tem uma história de perda de consciência breve após o impacto. Ele não apresenta sinais visíveis de hemorragia externa grave, mas relata dor no peito e no abdômen. A avaliação primária do paciente não revelou sinais de obstrução das vias aéreas ou de choque evidente. Decide-se prosseguir com a avaliação secundária.","Sobre a avaliação e gestão dos cuidados com este paciente, deve-se:"],"alternativas":{"A":"executar a avaliação secundária imediatamente após a avaliação primária, incluindo a coleta do histórico SAMPLE, um exame físico completo e a mensuração dos sinais vitais para identificar lesões não evidentes inicialmente.","B":"adiar a avaliação secundária até que o paciente esteja estabilizado. Inicialmente, concentrar apenas no tratamento de lesões visíveis e no gerenciamento da dor.","C":"concentrar na avaliação secundária se o paciente evoluir com sinais de comprometimento hemodinâmico. A avaliação deve se limitar à mensuração dos sinais vitais e à verificação de possíveis sangramentos externos.","D":"realizar a avaliação secundária somente se a avaliação primária não revelar lesões críticas, focando na verificação rápida dos sinais vitais e na coleta do histórico médico."},"correta":"A","oficial":{"D":"realizar a avaliação secundária somente se a avaliação primária não revelar lesões críticas, focando na verificação rápida dos sinais vitais e na coleta do histórico médico.","A":"executar a avaliação secundária imediatamente após a avaliação primária, incluindo a coleta do histórico SAMPLE, um exame físico completo e a mensuração dos sinais vitais para identificar lesões não evidentes inicialmente.","B":"adiar a avaliação secundária até que o paciente esteja estabilizado. Inicialmente, concentrar apenas no tratamento de lesões visíveis e no gerenciamento da dor.","C":"concentrar na avaliação secundária se o paciente evoluir com sinais de comprometimento hemodinâmico. A avaliação deve se limitar à mensuração dos sinais vitais e à verificação de possíveis sangramentos externos."},"oficial_extra":["Incorreta. A avaliação secundária é uma parte crucial do manejo de pacientes politraumatizados, independentemente das condições iniciais reveladas pela avaliação primária. Ela deve incluir um exame físico completo e a coleta do histórico SAMPLE para identificar lesões não imediatamente evidentes.","Correta. A avaliação secundária é essencial para detectar lesões que podem não ser visíveis durante a avaliação primária. Inclui a coleta do histórico SAMPLE, a realização de um exame físico detalhado e a mensuração dos sinais vitais, garantindo uma abordagem abrangente e sistemática do paciente.","Incorreta. A avaliação secundária não deve ser adiada. Ela é importante para a identificação de lesões que não são imediatamente visíveis e deve ser realizada assim que possível após a avaliação primária e a estabilização inicial do paciente.","Incorreta. A avaliação secundária deve ser realizada independentemente dos sinais de choque e inclui mais do que a mensuração dos sinais vitais e a verificação de sangramentos externos. O objetivo é identificar todas as lesões possíveis e garantir um manejo completo."],"refs":["STEWART, Ronald M. ATLS: advanced trauma life support. 10a ed. 2018. American College of Surgeons.","Advanced Trauma Life Support (ATLS) Program: Diretrizes para a avaliação secundária de pacientes politraumatizados. Disponível em: ATLS","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado.10a ed., 2023."],"tema":"Avaliação secundária no trauma","conceito":"A avaliação secundária vem imediatamente após a primária estar completa e o paciente estabilizado, e consiste em história SAMPLE (Sintomas, Alergias, Medicações, Passado médico, Líquidos/última refeição, Eventos), exame céfalo-podálico completo e sinais vitais seriados. Se o paciente deteriorar, você VOLTA para a primária.","alt":{"A":"CORRETA. Secundária logo após a primária, com SAMPLE, exame completo e sinais vitais, para achar lesões não evidentes.","B":"Adiar a secundária e tratar só lesões visíveis é como se perdem lesões ocultas (que são a maioria no trauma fechado).","C":"Limitar a secundária a sinais vitais e sangramento externo descaracteriza o exame.","D":"Condicionar a secundária à ausência de lesões críticas é errado: ela é parte obrigatória do atendimento."},"roteiro":[],"takehome":"Primária acha o que mata agora; secundária acha o que mata depois. Deteriorou? Reinicie pelo A.","area":"HAM · Atendimento ao politraumatizado"},{"id":99,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":4}],"enunciado":["( AFYA PARAÍBA) Um jovem de 25 anos, vítima de um acidente automobilístico de alta velocidade, é atendido pela equipe do serviço de emergência médica pré-hospitalar. Ele estava no banco do passageiro e não usava cinto de segurança. No local, apresenta-se inconsciente, com respiração ruidosa e irregular.","Qual deve ser a abordagem inicial mais adequada para garantir a permeabilidade das vias aéreas e a estabilização inicial do paciente?"],"alternativas":{"A":"Intubação orotraqueal imediata, independentemente da posição cervical, para garantir a proteção das vias aéreas e evitar a aspiração.","B":"Aplicação imediata de uma cânula orofaríngea e ventilação com máscara de válvula e reservatório, seguido de monitorização dos sinais vitais e imobilização de possíveis fraturas.","C":"Manobra de tração mandibular com controle da coluna cervical para abrir as vias aéreas e, se necessário, aspiração e ventilação assistida com bolsa-válvula-máscara.","D":"Realização de uma cricotireoidostomia de emergência devido à provável obstrução das vias aéreas superiores."},"correta":"C","oficial":{"C":"Manobra de tração mandibular com controle da coluna cervical para abrir as vias aéreas e, se necessário, aspiração e ventilação assistida com bolsa-válvula-máscara."},"oficial_extra":["Justificativa: No cenário descrito, em conformidade com o PHTLS 10ª edição, a prioridade durante a avaliação primária é garantir a permeabilidade das vias aéreas com a menor mobilização possível da coluna cervical, pois o paciente pode ter uma lesão cervical devido ao acidente automobilístico. A manobra de tração mandibular é indicada porque permite abrir as vias aéreas sem mover a coluna cervical, minimizando o risco de lesão adicional. Se houver necessidade, a ventilação assistida pode ser realizada com bolsa-válvula-máscara. A intubação orotraqueal deve ser considerada, mas somente após a estabilização inicial e com precauções para proteção da coluna cervical.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. 10a ed., 2023."],"refs":[],"tema":"Via aérea no trauma — manobra inicial","conceito":"Inconsciente com respiração ruidosa = obstrução de via aérea, quase sempre pela queda da língua. Em trauma, a abertura se faz com TRAÇÃO MANDIBULAR (jaw thrust) ou elevação do mento sem extensão, nunca com hiperextensão cervical.","alt":{"A":"Intubar 'independentemente da posição cervical' é erro: mesmo na intubação se mantém estabilização cervical em linha. E antes de intubar, abre-se e limpa-se a via aérea.","B":"Cânula orofaríngea e ventilação podem vir, mas depois da manobra de abertura; ventilar sem desobstruir empurra secreção e insufla o estômago.","C":"CORRETA. Tração mandibular com controle cervical, aspiração se necessário e ventilação assistida com BVM.","D":"Cricotireoidostomia é resgate para falha de intubação ou trauma facial que impeça o acesso — não é conduta inicial."},"roteiro":[],"takehome":"Trauma: jaw thrust, nunca chin lift com hiperextensão. Abra, aspire, ventile — nessa ordem.","area":"HAM · Via aérea e ventilação"},{"id":100,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2024.2","num":5}],"enunciado":["( FASA VIC) Um médico faz parte de uma equipe de atendimento pré-hospitalar que responde ao chamado para socorrer vítimas em um incêndio em um prédio residencial. Ao chegar ao local, a equipe encontra várias vítimas, incluindo:","1. Um homem de 35 anos com queimaduras extensas na face, pescoço e parte superior do tórax, apresentando rouquidão, estridor e tosse produtiva com fuligem. 2. Um idoso de 70 anos com queimaduras nas costas e pernas, inconsciente, com respiração superficial e lenta.","Descreva para cada paciente com base no PHTLS:","A) a classificação dos tipos de queimaduras observadas. (Valor: 0,5 pontos).","B) o risco de lesão de via aérea. (Valor: 1,0 pontos).","C) sinais indicativos e condutas da insuficiência respiratória. (Valor: 1,0 pontos)."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. Homem de 35 anos:","A) Classificação das queimaduras: Queimaduras de primeiro e segundo grau na face, pescoço e parte superior do tórax.","B) Risco de lesão de via aérea: Elevado. Os sinais de rouquidão, estridor e tosse produtiva com fuligem indicam lesão térmica das vias aéreas superiores e possível edema da laringe, que pode progredir para obstrução completa.","C) Sinais de insuficiência respiratória: Estridor e respiração laboriosa são indicativos de insuficiência respiratória iminente. Conduta: A prioridade é a proteção das vias aéreas. Se disponível, considerar a intubação precoce para prevenir obstrução completa devido ao edema progressivo. O paciente deve ser transportado imediatamente para um centro especializado em queimaduras com suporte avançado de vida.","2. Idoso de 70 anos:","A) Classificação das queimaduras: Queimaduras de segundo e terceiro grau nas costas e pernas.","B) Risco de lesão de via aérea: Alto. A inconsciência e respiração superficial sugerem comprometimento grave, possivelmente devido à inalação de fumaça ou intoxicação por monóxido de carbono.","C) Sinais de insuficiência respiratória: A respiração superficial e lenta é um sinal claro de insuficiência respiratória, provavelmente exacerbada pela inalação de fumaça e possível intoxicação.","D) Conduta: A prioridade é assegurar uma via aérea patente e fornecer suporte ventilatório, incluindo ventilação assistida se necessário. O transporte imediato para um centro de trauma ou queimaduras é essencial, com suporte avançado de vida durante o transporte.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. 10a ed., 2023."],"refs":[],"tema":"Queimados em incêndio — lesão inalatória","conceito":"A principal causa de morte em incêndio é a fumaça, não a queimadura. Sinais de lesão inalatória: queimadura de face/pescoço, vibrissas chamuscadas, rouquidão, estridor, escarro carbonáceo, dispneia, ambiente fechado e rebaixamento de consciência. Atenção ao monóxido de carbono: a oximetria de pulso é FALSAMENTE NORMAL (a carboxi-hemoglobina é lida como oxi-hemoglobina) — trate com O2 a 100%.","alt":{},"roteiro":["Paciente 1 (35 anos) — A) Queimaduras de 1º e 2º graus em face, pescoço e tórax superior.","B) Risco de via aérea ELEVADO: rouquidão, estridor e tosse com fuligem indicam lesão térmica e edema laríngeo progressivo.","C) Estridor e esforço respiratório = insuficiência respiratória iminente. Conduta: intubação orotraqueal PRECOCE, antes que o edema inviabilize o acesso (a janela é de horas), com tubo de calibre adequado; O2 a 100%; transporte para centro de queimados.","Paciente 2 (70 anos) — A) Queimaduras de 2º e 3º graus em dorso e pernas (3º grau: escara branca/marrom, seca, indolor).","B) Risco alto: inconsciência e respiração superficial sugerem inalação de fumaça e/ou intoxicação por CO ou cianeto.","C) Bradipneia e respiração superficial = insuficiência respiratória instalada. Conduta: garantir via aérea (intubação), ventilação assistida, O2 a 100% (reduz a meia-vida da carboxi-hemoglobina de ~4 h para ~1 h), considerar hidroxocobalamina se suspeita de cianeto, e transporte com suporte avançado.","Nos dois: avaliar SCQ, iniciar reposição volêmica, analgesia e proteção contra hipotermia."],"takehome":"Em queimadura de face com rouquidão, intube ANTES de precisar — depois do edema instalado, pode não haver mais via aérea. E não confie no oxímetro na intoxicação por CO.","area":"HAM · Queimaduras e trauma ambiental"},{"id":101,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":6}],"enunciado":["( ITPAC CRUZEIRO DO SUL) Um médico recém-formado, atuando pelo SAMU, é convocado para atender em uma área de triagem após um acidente aéreo. Ao chegar ao local, ele realiza uma avaliação rápida dos sobreviventes, determinando as condições dos pacientes e estabelecendo prioridades para atendimento posterior.","Nesse contexto, indique o paciente que deve ser avaliado com prioridade."],"alternativas":{"A":"Paciente D: criança em decúbito ventral, imóvel e sem sinais evidentes de movimento, sem pulso e não responde a estímulos.","B":"Paciente C: homem adulto, deitado em uma poça de sangue, com a perna esquerda encharcada de sangue, consciente e respondendo a estímulos.","C":"Paciente A: jovem de 18 anos, consciente, gritando por socorro, queixa-se de dor intensa no braço e de ter perdido seu celular.","D":"Paciente B: homem de meia-idade, consciente, com cianose, respiração ruidosa e irregular, e taquipneia."},"correta":"D","oficial":{"D":"Resposta correta: Paciente B – Homem de meia-idade, consciente, com cianose, respiração ruidosa e irregular, e taquipneia."},"oficial_extra":["Comentário:","Realizar o ABCDE do trauma.","Paciente A: A jovem está consciente, orientada e verbalizando, o que sugere que sua condição não é imediatamente ameaçadora à vida. Embora esteja em dor, ela não apresenta sinais de comprometimento vital iminente. Paciente B: O paciente apresenta cianose, respiração ruidosa e irregular, e taquipneia, sinais de comprometimento respiratório severo. A dificuldade respiratória associada à cianose indica um risco iminente de parada cardiorrespiratória, o que justifica a prioridade máxima para intervenção imediata. Paciente C: Apesar da hemorragia significativa, o paciente está consciente e responde a estímulos. Embora a perda de sangue seja preocupante, a condição respiratória crítica do Paciente B ainda representa uma ameaça mais imediata à vida. Paciente D: A criança em decúbito ventral e sem sinais de movimento precisa ser avaliada rapidamente para determinar a presença de pulso e respiração, é possível que ele esteja morto. Infelizmente, devemos dar prioridade aos pacientes que estão interagindo e temos certeza de que estão vivos, por enquanto.","Portanto, a prioridade inicial recai sobre o Paciente B devido aos sinais evidentes de comprometimento respiratório agudo."],"refs":["Stewart, Ronald M. ATLS: advanced trauma life support. 10a ed. 2018. American College of Surgeons.","ABIB, Simone de Campos V.; PERFEITO, João Aléssio J. Guia de Trauma. Barueri: Editora Manole, 2012. E-book. ISBN 9788520437933. Disponível em: https://integrada.minhabiblioteca.com.br/#/books/9788520437933/. Acesso em: 23 set. 2024."],"tema":"Triagem em múltiplas vítimas","conceito":"Na triagem, prioridade máxima (vermelho) é quem tem ameaça iminente à vida MAS é recuperável. A ordem segue o ABC: problema de via aérea/respiração vem antes de circulação, que vem antes de dor. Vítima sem pulso e sem resposta em incidente de múltiplas vítimas é classificada como preta (expectante), porque ressuscitá-la consumiria recursos de vários recuperáveis.","alt":{"A":"Criança sem pulso e sem resposta = categoria expectante nesse contexto. Doloroso, mas é a lógica da triagem em massa.","B":"Hemorragia é prioridade alta, mas o paciente está consciente e respondendo — vem depois do problema respiratório.","C":"Consciente, gritando e se preocupando com o celular: a via aérea está pérvia e o estado mental preservado. Classificação amarela/verde.","D":"CORRETA. Cianose, respiração ruidosa e taquipneia = comprometimento respiratório grave e recuperável = prioridade máxima."},"roteiro":[],"takehome":"Quem grita está respirando e perfundindo o cérebro. Quem está cianótico e com respiração ruidosa é quem morre nos próximos minutos.","area":"HAM · Atendimento ao politraumatizado"},{"id":102,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":7}],"enunciado":["( FMIT) Em um incêndio em uma boate com múltiplas vítima, uma equipe do SAMU é direcionada para uma vítima do sexo masculino, de 20 anos de idade, triada como prioridade imediata (vermelho). Ele está no solo, consciente; porém, desorientado e agitado. Apresenta queimaduras nos supercílios, na barba, no tórax e no abdome. Está com saturação periférica de O2 (SpO2) de 99%, taquipneico, respiração regular e não ruidosa. Segundo a equipe que realizou a triagem START, esse paciente foi retirado de dentro do estabelecimento enquanto tentava ajudar no socorro de outras vítimas.","Após análise do caso, assinale a alternativa correta em relação às prioridades de atendimento."],"alternativas":{"A":"Essa vítima deve ser retirada imediatamente do local, deve receber oxigênio por máscara com a maior fração inspirada possível (FiO2), e a extensão das lesões deve ser avaliadas após exposição e proteção contra hipotermia. A cena implica perigo para a equipe e para a vítima.","B":"Reanimação volêmica (C) é prioridade de atendimento nesse caso. As lesões devem ser avaliadas quanto à sua profundidade e quanto à sua extensão, determinando a área de superfície corpórea queimada (ASCQ) e utilizando a fórmula de Parkland para guiar essa conduta.","C":"A agitação e desorientação não têm relação com o incidente de queimadura e uma outra causa deve ser pensada (trauma craniano, condições pré-existentes). A disfunção neurológica (D) deve ser avaliada sempre após avaliação de via aérea, respiração e circulação.","D":"A boa saturação periférica de O2 (99%) revela uma estabilidade ventilatória (A) e respiratória (B). Apesar de a vítima apresentar sinais de alerta para queimaduras de via aérea, como presença de pelos queimados na face, não apresenta respiração ruidosa, com estridor."},"correta":"A","oficial":{},"oficial_extra":["Incidentes com queimaduras são uma causa comum de atendimento e
