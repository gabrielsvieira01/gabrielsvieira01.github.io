m cenários pré- hospitalares, e não é incomum a presença de múltiplas vítimas em espaços confinados, o que agrava o caso devido à associação com inalação de fumaça e intoxicação por gases tóxicos, sendo o mais comum o monóxido de carbono (CO). A principal causa de morte em vítimas de queimaduras é a inalação de fumaça tóxica, e não a queimadura direta. Pacientes com queimaduras em ambientes confinados apresentam uma mortalidade de 12%, enquanto em outros ambientes essa taxa cai para 4%. Dessa forma, os sinais de intoxicação pelo principal gás, o monóxido de carbono, devem sempre ser investigados.","O monóxido de carbono é um gás inodoro, sendo subproduto da queima de hidrocarbonetos. Ele apresenta uma afinidade pela hemoglobina muito maior do que a do oxigênio (200-250 vezes), formando o complexo carboxiemoglobina, e se liga de forma irreversível ao componente férrico da hemoglobina. A monitorização por oxímetro de pulso tradicional não é adequada, pois esse dispositivo detecta qualquer gás ligado à hemoglobina, não determinando se é oxigênio ou monóxido de carbono. Atualmente, existem no mercado oxímetros específicos para monóxido de carbono, que mostram com eficácia a saturação da hemoglobina por esse gás, que deve estar entre 0-2%. Em cenários de incêndio e confinamento, a leitura do oxímetro de pulso convencional não pode ser considerada confiável. A sintomatologia da intoxicação é proporcional à intensidade desta, podendo variar desde sintomas leves (cefaleia, fadiga, náuseas), moderados (vômitos, confusão, sonolência, taquipneia e taquicardia) até graves (convulsão, coma, morte). Acredita-se que níveis de saturação de monóxido de carbono superiores a 30% já possam provocar sintomas graves.","Na literatura, é comum associar como sinal o aspecto de pele vermelho-cereja, mas esse sinal é frequentemente observado em necrópsias, sendo um achado tardio.","Pacientes com intoxicação por monóxido de carbono devem ser retirados imediatamente do local devido ao risco de aumento da exposição, assim como as equipes de atendimento, que devem sempre priorizar a segurança da cena e nem sempre dispõem de máscaras de proteção contra gases tóxicos. A oferta de oxigênio em alta concentração deve sempre ser a primeira conduta, independentemente dos valores mostrados pelo oxímetro.","Outro complicador de queimaduras ocorre quando há acometimento das vias aéreas. São sinais de suspeita a queimadura de pelos faciais e hiperemia dos lábios, mucosa nasal e ocular. A presença de estridores também é altamente sugestiva.","Todas as vestimentas devem ser removidas, pois os tecidos podem perpetuar as queimaduras. Nesse caso, a proteção contra hipotermia deve ser realizada após a cobertura com curativo estéril e seco e cobertores térmicos.","Toda vítima deve ser tratada seguindo as prioridades estabelecidas pelo PHTLS. Assim, sempre, em qualquer situação, devemos seguir a mnemônica da avaliação primária XABCDE, independentemente do cenário.","Referência:","SUPORT, Prehospital Trauma Life. Atendimento pré-hospitalar ao traumatizado. Tradução Da 9ª Edição. São Paulo. Artmed Editora, 2019."],"refs":[],"tema":"Queimadura em ambiente confinado","conceito":"Espaço confinado + queimadura de supercílios e barba + agitação e desorientação = suspeita forte de intoxicação por monóxido de carbono. A SpO2 de 99% NÃO tranquiliza: o oxímetro não distingue carboxi-hemoglobina de oxi-hemoglobina. Agitação e confusão no queimado devem ser lidas como hipóxia/intoxicação até prova em contrário.","alt":{"A":"CORRETA. Retirar da cena (segurança da equipe e da vítima), O2 na maior FiO2 possível, expor para avaliar as lesões e proteger contra hipotermia.","B":"Circulação não é a prioridade aqui; a fórmula de Parkland vem depois. A prioridade é oxigenação.","C":"Errado no conteúdo: a agitação TEM relação direta com o incidente (intoxicação por CO/hipóxia).","D":"Erro clássico: usar SpO2 99% como prova de boa oxigenação em intoxicação por CO. Além disso, ausência de estridor não exclui lesão inalatória em evolução."},"roteiro":[],"takehome":"Pelo facial queimado + confusão + espaço confinado = O2 a 100% já, mesmo com oxímetro 'normal'.","area":"HAM · Queimaduras e trauma ambiental"},{"id":103,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":8}],"enunciado":["( FASA VIC) Um interno, no estágio do SAMU, está atendendo a um acidente de trânsito com múltiplas vítimas, incluindo uma criança de 7 anos e um idoso de 75 anos. Durante a avaliação primária e secundária, é fundamental considerar as diferenças anatômicas e fisiológicas entre essas faixas etárias para determinar a abordagem adequada.","Assinale a alternativa que descreve a conduta mais apropriada durante a avaliação e o manejo inicial dessas duas vítimas, considerando as características específicas de cada faixa etária."],"alternativas":{"A":"Na avaliação primária do idoso, focar na avaliação do ABC (vias aéreas, respiração e circulação) de forma padrão; na criança, realizar a ventilação manual com volumes maiores devido à maior complacência torácica, garantindo uma oxigenação eficaz sendo que também pode incorrer na hipotermia.","B":"Realizar a avaliação primária do idoso priorizando a imobilização cervical, devido ao alto risco de lesão cervical e comprometimento prévio das vias aéreas; priorizar, em ambos, a proteção térmica, pois a superfície corporal maior da criança em relação ao peso corporal a torna mais suscetível à hipotermia e o idoso devido à uma menor capacidade de regulação térmica.","C":"Realizar a avaliação primária do idoso com foco na investigação de fraturas pélvicas, que são comuns nessa faixa etária; na criança, priorizar a avaliação da cabeça e do abdome, pois a cabeça grande em relação ao corpo e a maior complacência abdominal aumentam o risco de lesões internas.","D":"Na avaliação primária, tanto no idoso quanto na criança, deve-se priorizar a avaliação da via aérea; no idoso, realizar ventilação com alta pressão devido à menor complacência pulmonar, enquanto na criança, utilizar a técnica de tração mandibular sem imobilização cervical, já que a flexibilidade da coluna minimiza o risco de lesões."},"correta":"B","oficial":{"B":"Correta: Realizar a avaliação primária do idoso priorizando a imobilização cervical, devido ao alto risco de lesão cervical e comprometimento prévio das vias aéreas; priorizar, em ambos, a proteção térmica, pois a superfície corporal maior da criança em relação ao peso corporal a torna mais suscetível à hipotermia e o idoso devido a uma menor capacidade de regulação térmica também pode incorrer na hipotermia.","A":"Incorreta: Na avaliação primária do idoso, focar na avaliação do ABC (vias aéreas, respiração e circulação) de forma padrão; na criança, realizar a ventilação manual com volumes maiores devido à maior complacência torácica, garantindo uma oxigenação eficaz.","C":"Incorreta: Realizar a avaliação primária do idoso com foco na investigação de fraturas pélvicas, que são comuns nessa faixa etária; na criança, priorizar a avaliação da cabeça e do abdome, pois a cabeça grande em relação ao corpo e a maior complacência abdominal aumentam o risco de lesões internas.","D":"Incorreta: Na avaliação primária, tanto no idoso quanto na criança, deve-se priorizar a avaliação da via aérea; no idoso, realizar ventilação com alta pressão devido à menor complacência pulmonar, enquanto na criança, utilizar a técnica de tração mandibular sem imobilização cervical, já que a flexibilidade da coluna minimiza o risco de lesões."},"oficial_extra":["Idoso: A imobilização cervical é crucial devido à maior fragilidade óssea e ao risco aumentado de lesões cervicais, como fraturas ou subluxações, especialmente com a presença de osteoporose. Priorizar, também a proteção térmica pois o idoso tem a uma menor capacidade de regulação térmica. Criança: A maior superfície corporal em relação ao peso torna as crianças mais suscetíveis à perda de calor, o que pode levar rapidamente à hipotermia, afetando o metabolismo e a resposta ao trauma.","Idoso: Avaliar o ABC é fundamental, mas não leva em consideração as peculiaridades do idoso, como a maior suscetibilidade a lesões cervicais. Criança: A ventilação com volumes maiores não é adequada; a complacência torácica aumenta o risco de barotrauma. Deve-se ajustar o volume corrente para evitar lesões pulmonares.","Idoso: Embora fraturas pélvicas sejam comuns, a avaliação primária e secundária deve focar primeiramente em lesões que ameaçam a vida, como problemas de via aérea e respiratórios. Criança: A cabeça grande e o abdome mais complacente são fatores de risco, mas a alternativa falha em mencionar a importância de proteger a via aérea e a coluna cervical na avaliação primária.","Idoso: Ventilação com alta pressão pode causar danos pulmonares, especialmente em idosos com doenças pulmonares crônicas. Criança: A técnica de tração mandibular sem imobilização cervical não é adequada; a proteção da coluna cervical é crucial, mesmo que as crianças tenham maior flexibilidade.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. 10ª ed., 2023."],"refs":[],"tema":"Trauma nos extremos de idade","conceito":"Criança: maior relação superfície/peso (hipotermia rápida), cabeça proporcionalmente maior, coluna mais flexível (pode haver SCIWORA — lesão medular sem alteração radiográfica, logo a imobilização é obrigatória), complacência torácica alta (lesão interna sem fratura de costela) e hipotensão tardia. Idoso: osteoporose e artrose cervical (alto risco de fratura), menor reserva fisiológica, uso de betabloqueador mascara taquicardia, anticoagulantes aumentam sangramento e a termorregulação é pior.","alt":{"A":"Ventilar criança com volumes MAIORES causa barotrauma e insuflação gástrica — o correto é volume adequado ao peso.","B":"CORRETA. Imobilização cervical prioritária no idoso (fragilidade óssea) e proteção térmica em ambos, por razões diferentes.","C":"Fratura pélvica não é o foco da primária no idoso, e o texto sobre a criança, embora tenha elementos verdadeiros, não descreve a conduta prioritária.","D":"Dois erros graves: 'ventilação com alta pressão' no idoso (causa barotrauma) e dispensar imobilização cervical na criança (é justamente onde há risco de SCIWORA)."},"roteiro":[],"takehome":"Nunca dispense colar cervical em criança pela 'flexibilidade da coluna' — é exatamente o oposto do que ela significa.","area":"HAM · Atendimento ao politraumatizado"},{"id":104,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2024.2","num":9}],"enunciado":["( UNINOVAFAPI) Durante uma tempestade em um campo de futebol, um raio atinge um campo de futebol. O cenário é uma emergência em que várias vítimas foram atingidas pelo raio, apresentando diferentes níveis de gravidade nas lesões e sintomas. Um médico em treinamento, deve responder sobre a triagem e o manejo desses pacientes.","A) Descreva os tipos de lesões que podem ocorrer nessas vítimas e os mecanismos pelos quais o raio pode causar danos. (Valor: 1,25 pontos).","B) Explique a importância da triagem “reversa” e como ela pode beneficiar o manejo dessas vítimas. (Valor: 1,25 pontos)."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. Riscos e Lesões Associadas a Acidente com Raio:","Riscos e Lesões:","Queimaduras: A descarga elétrica do raio pode causar queimaduras severas, que geralmente são de natureza superficial e resultam de contato direto com a pele. Lesões de Campo Elétrico: A passagem da corrente elétrica pelo corpo pode resultar em lesões internas, como queimaduras profundas e danos aos tecidos e órgãos. Lesões Neurológicas: O impacto do raio pode causar lesões neurológicas devido à alteração da atividade elétrica no sistema nervoso central e periférico. Isso pode levar a convulsões, perda de consciência, e distúrbios neurológicos. Parada Cardíaca e Arritmias: O choque elétrico pode interferir no ritmo cardíaco e provocar parada cardíaca ou arritmias. Lesões Traumáticas Secundárias: As vítimas podem sofrer lesões secundárias causadas pela queda ou por objetos projetados pela força do impacto do raio.","Mecanismos de Dano:","Descarga Elétrica: A corrente elétrica do raio passa pelo corpo, causando danos aos tecidos e órgãos internos, além de lesionar o sistema nervoso e cardiovascular. Efeito de Ondas de Choque: A expansão rápida do ar ao redor do raio pode causar ondas de choque, resultando em lesões físicas e contusões. Queimaduras de Superfície: A alta temperatura do raio pode causar queimaduras superficiais, especialmente nas áreas de contato direto.","2. Triagem “Reversa” para Múltiplas Vítimas de Raios:","O que é a Triagem “Reversa”?","A triagem “reversa” é um método de triagem em situações de múltiplas vítimas onde o atendimento inicial é direcionado para as vítimas com sinais vitais comprometidos e potencialmente recuperáveis, em vez de começar com as vítimas com ferimentos menos graves.","Aplicação e Importância:","Identificação de Vítimas Críticas: Em um cenário com múltiplas vítimas de raios, a triagem “reversa” permite a identificação rápida de vítimas que necessitam de intervenção imediata para sobrevivência, como aquelas com parada cardíaca ou comprometimento respiratório severo. Uso Eficiente de Recursos: Esse método ajuda a alocar recursos limitados de forma mais eficaz, garantindo que as vítimas com maior probabilidade de sobrevivência recebam atendimento prioritário. Benefícios: A triagem “reversa” é crucial para garantir que as vítimas mais graves, que podem ter menos tempo de sobrevivência se não forem tratadas rapidamente, recebam atendimento adequado o mais rápido possível. Também auxilia na organização da equipe de emergência e no manejo eficiente de situações caóticas.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. 10a ed., 2023."],"refs":[],"tema":"Lesão por raio e triagem reversa","conceito":"A fulguração é o único cenário em que a triagem se INVERTE: atende-se primeiro quem está em parada. A parada por raio é primariamente RESPIRATÓRIA (paralisia do centro respiratório bulbar), com o coração frequentemente retomando ritmo sozinho — se a vítima for ventilada, a sobrevida é alta. Quem está consciente vai muito provavelmente sobreviver sem intervenção imediata.","alt":{},"roteiro":["A) Mecanismos de lesão: golpe direto; contato (a corrente passa por objeto em contato com a vítima); corrente lateral/splash (salta de um objeto próximo); corrente de terra/step voltage (mais comum em grupos); trauma contuso pela onda de choque ou pela queda/projeção.","Lesões: cardíacas — assistolia, fibrilação, arritmias, alterações no ECG; respiratórias — parada respiratória por paralisia do centro bulbar (é o que mata se não houver ventilação).","Neurológicas — perda de consciência, convulsões, amnésia, keraunoparalisia (paralisia transitória com extremidades frias, pálidas e sem pulso, geralmente reversível).","Cutâneas — figuras de Lichtenberg (patognomônicas, arboriformes, não são queimadura verdadeira) e queimaduras geralmente superficiais, ao contrário da eletricidade industrial.","Outras: rotura timpânica, catarata tardia, lesões oculares, contusões e fraturas por trauma secundário.","B) Triagem reversa: em vítimas de raio, prioriza-se quem está em parada respiratória ou cardiorrespiratória — o oposto da triagem convencional, em que o 'preto' é deixado por último.","Justificativa: a parada é hipóxica e reversível com ventilação precoce; quem está consciente e falando tem excelente prognóstico e pode esperar.","Lembre ainda: a vítima NÃO retém carga elétrica — é seguro tocá-la; e vítimas de raio podem ter parada prolongada com boa recuperação, então a RCP deve ser mantida por mais tempo."],"takehome":"Raio é a exceção da triagem: trate os aparentemente mortos primeiro, porque só precisam de ventilação.","area":"HAM · Queimaduras e trauma ambiental"},{"id":105,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2024.2","num":10}],"enunciado":["( AFYA ITABUNA) Durante uma maratona realizada em um dia de calor intenso, um corredor apresenta sinais de exaustão pelo calor, incluindo tontura, sudorese profusa e câimbras musculares.","Para a prevenção do quadro descrito, qual das estratégias seria a mais indicada para evitar a progressão para insolação?"],"alternativas":{"A":"Oferecer pequenas quantidades de soluções eletrolíticas isotônicas em intervalos regulares, para manter o equilíbrio hídrico e evitar hiponatremia.","B":"Fornecer água gelada para consumo rápido, a fim de baixar a temperatura corporal e prevenir insolação.","C":"Incentivar a ingestão de grandes volumes de água pura, para compensar rapidamente a perda de líquidos e prevenir a desidratação.","D":"Administrar suplementos de sódio imediatamente para evitar a hiponatremia associada ao exercício intenso."},"correta":"A","oficial":{"C":"Incentivar a ingestão de grandes volumes de água pura, para compensar rapidamente a perda de líquidos e prevenir a desidratação. Incorreta: A ingestão de grandes volumes de água pura pode levar à diluição dos eletrólitos no sangue, aumentando o risco de hiponatremia, o que pode ser perigoso em ambientes quentes.","A":"Oferecer pequenas quantidades de soluções eletrolíticas isotônicas em intervalos regulares, para manter o equilíbrio hídrico e evitar hiponatremia. Correta: A administração de pequenas quantidades de soluções eletrolíticas isotônicas em intervalos regulares é a abordagem mais segura e eficaz para manter a hidratação adequada e prevenir tanto a desidratação quanto a hiponatremia, conforme as diretrizes do PHTLS (10ª edição).","B":"Fornecer água gelada para consumo rápido, a fim de baixar a temperatura corporal e prevenir insolação. Incorreta: Embora a ingestão de água gelada possa ajudar a reduzir a temperatura corporal, a estratégia principal deve focar na reposição equilibrada de líquidos e eletrólitos, especialmente em condições de calor extremo.","D":"Administrar suplementos de sódio imediatamente para evitar a hiponatremia associada ao exercício intenso. Incorreta: A administração imediata de suplementos de sódio não é a primeira linha de intervenção; o foco deve ser na hidratação equilibrada com soluções isotônicas para prevenir tanto a desidratação quanto a hiponatremia."},"oficial_extra":[],"refs":["PHTLS - 10 Edição.","National Association of Emergency Medical Technicians. (NAEMT). PHTLS: Atendimento Pré-Hospitalar ao Traumatizado. 9a ed., 2020."],"tema":"Doenças relacionadas ao calor","conceito":"Espectro: câimbras por calor → exaustão pelo calor (temperatura < 40 °C, sudorese preservada, ESTADO MENTAL NORMAL) → intermação/insolação (temperatura > 40 °C com ALTERAÇÃO DO ESTADO MENTAL — é emergência, tratada com resfriamento agressivo por imersão em água gelada). Na hidratação durante exercício prolongado, o risco dos dois lados é real: desidratação e hiponatremia associada ao exercício (por ingestão excessiva de água pura).","alt":{"A":"CORRETA. Pequenos volumes de solução isotônica em intervalos regulares repõem água E eletrólitos, evitando os dois extremos.","B":"Água gelada 'para baixar a temperatura' não é estratégia de prevenção; o resfriamento eficaz é externo (imersão), não pela ingestão.","C":"Grandes volumes de água pura são justamente o mecanismo da hiponatremia do exercício — que pode causar edema cerebral e convulsão.","D":"Suplemento de sódio isolado não é primeira linha e não corrige o déficit de volume."},"roteiro":[],"takehome":"O que separa exaustão de insolação é o ESTADO MENTAL. E na maratona, beber demais água pura é tão perigoso quanto beber de menos.","area":"HAM · Queimaduras e trauma ambiental"},{"id":106,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":1}],"enunciado":["(UNIPTAN) Um paciente de 30 anos sofreu um acidente de moto em alta velocidade e foi encontrado inconsciente pela equipe de atendimento pré-hospitalar. Ele apresentava sinais de múltiplos traumas, incluindo fraturas expostas nos membros inferiores, pneumotórax e sinais de choque hipovolêmico. A equipe realizou intubação orotraqueal, drenagem torácica e administrou fluidos intravenosos. O paciente foi imobilizado com colar cervical e colocado em uma prancha rígida para transporte ao hospital. Durante o transporte, o monitoramento revelou hipotensão persistente, taquicardia e saturação de oxigênio em 85%.","Qual das alternativas descreve a resposta orgânica fisiológica ao politrauma, considerando o quadro clínico e as intervenções realizadas?"],"alternativas":{"A":"A intubação orotraqueal causa uma resposta vagal que resulta em bradicardia e hipertensão transitória, estabilizando o quadro hemodinâmico do paciente.","B":"O pneumotórax provoca uma diminuição da pressão intratorácica, facilitando a ventilação e oxigenação adequadas sem necessidade de drenagem torácica.","C":"A administração de fluidos intravenosos leva à normalização imediata da pressão arterial e estabilização dos sinais vitais, sem necessidade de intervenções adicionais.","D":"A ativação do eixo hipotálamo-hipófise-adrenal resulta na liberação de catecolaminas, causando taquicardia e vasoconstrição periférica para manter a perfusão dos órgãos vitais."},"correta":"D","oficial":{"D":"A ativação do eixo hipotálamo-hipófise-adrenal resulta na liberação de catecolaminas, causando taquicardia e vasoconstrição periférica para manter a perfusão dos órgãos vitais.","C":"A administração de fluidos intravenosos leva à normalização imediata da pressão arterial e estabilização dos sinais vitais, sem necessidade de intervenções adicionais.","B":"O pneumotórax provoca uma diminuição da pressão intratorácica, facilitando a ventilação e oxigenação adequadas sem necessidade de drenagem torácica.","A":"A intubação orotraqueal causa uma resposta vagal que resulta em bradicardia e hipertensão transitória, estabilizando o quadro hemodinâmico do paciente."},"oficial_extra":["Essa resposta é correta porque descreve um dos principais mecanismos fisiológicos de resposta ao trauma grave. A ativação do eixo hipotálamo-hipófise-adrenal (HPA) leva à liberação de catecolaminas, como adrenalina e noradrenalina, que causam taquicardia (aumento da frequência cardíaca) e vasoconstrição periférica (contração dos vasos sanguíneos) para manter a perfusão dos órgãos vitais, como coração e cérebro. Essas respostas são cruciais para a sobrevivência em situações de politrauma, pois ajudam a manter a pressão arterial e a circulação sanguínea eficaz.","Essa alternativa está incorreta porque, embora a administração de fluidos intravenosos seja uma parte importante do manejo do choque hipovolêmico, ela pode não ser suficiente para normalizar a pressão arterial e estabilizar os sinais vitais imediatamente. Em casos de trauma grave, pode ser necessário um manejo mais agressivo, incluindo transfusões de sangue e intervenções cirúrgicas para controlar hemorragias.","Essa alternativa está incorreta porque o pneumotórax, na verdade, aumenta a pressão intratorácica, dificultando a ventilação e a oxigenação adequadas. A drenagem torácica é frequentemente necessária para aliviar a pressão e permitir a expansão pulmonar, melhorando assim a ventilação e a oxigenação.","Essa alternativa está incorreta porque a intubação orotraqueal pode provocar uma resposta vagal, mas essa resposta é mais comumente associada à bradicardia (redução da frequência cardíaca) e hipotensão (pressão arterial baixa), não hipertensão (pressão arterial alta). Além disso, a resposta vagal durante a intubação não estabiliza necessariamente o quadro hemodinâmico do paciente, sendo necessário monitoramento contínuo e intervenções adicionais.","Referência:","Atendimento Pré-Hospitalar ao Traumatizado, 9ª Edição. Comitê Nacional de Trauma da National Association of Emergency Medical Technicians (NAEMT) em colaboração com o Colégio Americano de Cirurgiões (ACS)."],"refs":[],"tema":"Resposta orgânica ao trauma","conceito":"O trauma dispara resposta neuroendócrina: eixo hipotálamo-hipófise-adrenal, catecolaminas (taquicardia, vasoconstrição periférica, redistribuição de fluxo para coração e cérebro), cortisol, ADH e sistema renina-angiotensina-aldosterona (retenção de sódio e água). Isso mantém a PA até a perda de ~30% da volemia — daí a hipotensão ser sinal TARDIO.","alt":{"A":"Falso: a intubação pode até ter resposta vagal, mas não 'estabiliza o quadro hemodinâmico'; e a resposta dominante no trauma é adrenérgica.","B":"Falso e perigoso: pneumotórax AUMENTA a pressão intratorácica e prejudica ventilação e retorno venoso; exige drenagem.","C":"Falso: fluido não normaliza imediatamente nada em sangramento ativo — o tratamento é controlar a hemorragia (a hipotensão persistente aqui indica sangramento não controlado).","D":"CORRETA. Ativação do eixo HPA com liberação de catecolaminas, produzindo taquicardia e vasoconstrição para preservar a perfusão de órgãos vitais."},"roteiro":[],"takehome":"Taquicardia e extremidades frias não são 'efeito colateral': são o organismo compensando. Quando a PA cai, a compensação já falhou.","area":"HAM · Choque e resposta ao trauma"},{"id":107,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":2}],"enunciado":["(AFYA PALMAS) Durante um atendimento em via pública, uma equipe de emergência se depara com um homem de 45 anos, inconsciente após uma colisão automobilística. O paciente apresenta respiração irregular e ruidosa, cianose perioral, retrações intercostais e uso evidente de musculatura acessória. Está impossibilitado de verbalizar e não responde a estímulos verbais. A ausculta pulmonar revela murmúrio vesicular globalmente diminuído, e há suspeita de trauma cranioencefálico. A equipe nota acúmulo de secreção em cavidade oral, sem vômitos ou sangramentos ativos.","Qual conduta inicial está mais alinhada ao manejo adequado da via aérea neste paciente?"],"alternativas":{"A":"Aplicar ventilação com bolsa-válvula-máscara imediatamente, com pressão positiva, para expandir os alvéolos e melhorar a troca gasosa.","B":"Realizar tração mandibular associada à aspiração das vias aéreas superiores, visando desobstrução e manutenção da patência.","C":"Iniciar oxigenoterapia por máscara com reservatório de alta concentração para corrigir a hipoxemia antes de intervir na via aérea.","D":"Introduzir cânula orofaríngea e aguardar melhora da respiração espontânea antes de realizar intervenções adicionais."},"correta":"B","oficial":{"B":"Realizar tração mandibular associada à aspiração das vias aéreas superiores, visando desobstrução e manutenção da patência. Correta. O paciente apresenta obstrução parcial de via aérea (respiração ruidosa, esforço respiratório, cianose, secreção visível) e está inconsciente com possível trauma cervical, o que contraindica a hiperextensão do pescoço. A manobra de tração mandibular (jaw thrust) é a mais segura para abrir a via aérea em trauma, e a aspiração de secreções deve ser feita de imediato para remover a obstrução física. Trata-se de um passo essencial do protocolo A – Airway, conforme o PHTLS e o suporte básico de vida (SBV/ATLS).","C":"Iniciar oxigenoterapia por máscara com reservatório de alta concentração para corrigir a hipoxemia antes de intervir na via aérea. Incorreta. Embora a oxigenoterapia seja importante, ela não corrige a hipoxemia se houver obstrução mecânica. A aplicação de oxigênio em uma via aérea obstruída é ineficaz até que a desobstrução seja realizada.","A":"Aplicar ventilação com bolsa-válvula-máscara imediatamente, com pressão positiva, para expandir os alvéolos e melhorar a troca gasosa. Incorreta. Ventilar com bolsa-válvula sem antes garantir a desobstrução da via aérea pode empurrar secreções mais profundamente e causar insuflação gástrica ou ineficiência ventilatória. A sequência correta é: abrir e limpar a via aérea, depois ventilar.","D":"Introduzir cânula orofaríngea e aguardar melhora da respiração espontânea antes de realizar intervenções adicionais. Incorreta. A introdução da cânula orofaríngea pode ser indicada em pacientes inconscientes sem reflexo de vômito, mas não substitui a necessidade de aspiração e manobra de abertura da via aérea. Além disso, aguardar melhora espontânea é inadequado diante de sinais claros de obstrução e hipoxemia."},"oficial_extra":[],"refs":["National Association of Emergency Medical Technicians (NAEMT). PHTLS: Suporte Pré- Hospitalar no Trauma. 9ª ed. São Paulo: Elsevier; 2020.","Advanced Trauma Life Support (ATLS). Manual do Curso Avançado de Trauma para Médicos. 10ª ed. Chicago: American College of Surgeons; 2018."],"tema":"Via aérea obstruída por secreção","conceito":"Respiração ruidosa é sinônimo de obstrução. A sequência é sempre: ABRIR (tração mandibular no trauma) → LIMPAR (aspirar) → depois ventilar/oxigenar. Nenhuma oferta de oxigênio funciona através de uma via obstruída.","alt":{"A":"Ventilar com BVM antes de desobstruir empurra a secreção para baixo e insufla o estômago.","B":"CORRETA. Tração mandibular + aspiração das vias aéreas superiores.","C":"Oxigênio não vence obstrução mecânica.","D":"Cânula orofaríngea ajuda depois, mas 'aguardar melhora espontânea' em paciente cianótico e obstruído é inaceitável."},"roteiro":[],"takehome":"Toda vez que a questão descrever 'respiração ruidosa', a resposta está no A: abra e aspire antes de qualquer outra coisa.","area":"HAM · Via aérea e ventilação"},{"id":108,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":3}],"enunciado":["(UNISL PORTO VELHO) Um homem de 45 anos, com histórico de trauma cranioencefálico grave há 1 hora, chega ao pronto-socorro trazido pelo serviço de atendimento médico de urgência (SAMU). Ele apresenta Glasgow Coma Scale (GCS) de 6, esforço respiratório intenso, estridor e hipoxemia progressiva (SatO₂ 80% em ar ambiente). No atendimento inicial, foi realizada ventilação com bolsa-válvula-máscara (BVM) com oxigênio a 100%, porém sem melhora significativa da saturação. O exame físico revela agitação psicomotora intercalada com períodos de apneia, cianose labial e retrações intercostais acentuadas, sinais de lesão facial traumática com hematoma periorbitário bilateral (\"sinal de guaxinim\") e equimose retroauricular unilateral (\"sinal de Battle\"), sugerindo fratura de base de crânio.","Qual é a conduta imediata para o manejo da via aérea desse paciente?"],"alternativas":{"A":"Realizar intubação orotraqueal com sequência rápida, utilizando a ordem correta dos medicamentos: agente de indução, sedativo e, por último, bloqueador neuromuscular.","B":"Proceder diretamente à cricotireoidostomia ou traqueostomia devido à presença de estridor e suspeita de obstrução de vias aéreas superiores, o que contraindica a intubação.","C":"Manter ventilação com bolsa-válvula-máscara e tentar um dispositivo supraglótico (ex.: máscara laríngea) para evitar elevação da pressão intracraniana e passar sonda nasoenteral.","D":"Realizar intubação nasotraqueal, pois causa menos estímulo do que a via orotraqueal em pacientes com TCE, mantendo a sequência de medicamentos pré conforme protocolo."},"correta":"A","oficial":{"D":"Realizar intubação nasotraqueal, pois causa menos estímulo do que a via orotraqueal em pacientes com TCE, mantendo a sequência de medicamentos pré conforme protocolo. Incorreta – Embora a intubação nasotraqueal possa ser uma opção em alguns casos, ela é contraindicada em fratura de base de crânio, pois o tubo pode penetrar a cavidade intracraniana através de uma fratura no osso etmoide. Além disso, a RSI envolve bloqueio neuromuscular total, tornando a intubação nasotraqueal impraticável. A intubação orotraqueal é a abordagem mais segura.","C":"Manter ventilação com bolsa-válvula-máscara e tentar um dispositivo supraglótico (ex.: máscara laríngea) para evitar elevação da pressão intracraniana e passar sonda nasoenteral.","B":"Proceder diretamente à cricotireoidostomia ou traqueostomia devido à presença de estridor e suspeita de obstrução de vias aéreas superiores, o que contraindica a intubação. Incorreta – A cricotireoidostomia é indicada apenas em falha da intubação ou quando esta é impossível (ex.: trauma facial extenso, obstrução completa da via aérea). Neste caso, não há evidência de obstrução completa que impeça a passagem do tubo. A primeira escolha continua sendo a sequência rápida com intubação orotraqueal."},"oficial_extra":["Alternativas de Resposta (Balanceadas em Tamanho e Clareza)","Realizar intubação orotraqueal com sequência rápida (RSI), seguindo a ordem correta dos medicamentos: agente de indução, sedativo e, por último, bloqueador neuromuscular. Correta – A intubação orotraqueal com sequência rápida (RSI) é o padrão-ouro para controle definitivo da via aérea em pacientes com TCE e GCS ≤ 8. A sequência correta dos medicamentos (agente de indução → sedativo → bloqueador neuromuscular) evita paralisia consciente (\"síndrome do prisioneiro\"). A intubação orotraqueal é preferida em casos de fratura de base de crânio, pois a via nasotraqueal pode levar à passagem do tubo para a cavidade intracraniana por um defeito na base do crânio.","Incorreta – Dispositivos supraglóticos, como a máscara laríngea, são soluções temporárias e não protegem contra aspiração, especialmente em pacientes com GCS baixo e alto risco de regurgitação/vômito. Podem ser usados como resgate se a intubação falhar, mas não devem substituir a RSI quando a intubação está indicada. A sonda nasoenteral está incorreta devido a possível fratura da base do crânio.","Referência:","National Association of Emergency Medical Technicians. PHTLS - Atendimento pré-hospitalar ao traumatizado. 9. ed. Burlington: Jones & Bartlett Learning, 2020."],"refs":[],"tema":"Via aérea definitiva no TCE","conceito":"Glasgow ≤ 8 é indicação clássica de via aérea definitiva. O padrão é a intubação orotraqueal em sequência rápida, com estabilização cervical em linha. Ponto-chave da questão: o sinal do guaxinim e o sinal de Battle indicam FRATURA DE BASE DE CRÂNIO, que contraindica qualquer dispositivo NASAL (tubo nasotraqueal, cânula nasofaríngea, sonda nasogástrica) pelo risco de passagem intracraniana pela lâmina crivosa.","alt":{"A":"CORRETA. Intubação orotraqueal em sequência rápida. A lógica da ordem dos fármacos é sedar/induzir ANTES de paralisar, para não deixar o paciente consciente e paralisado.","B":"Cricotireoidostomia é resgate para falha ou impossibilidade de intubação, não a primeira escolha aqui.","C":"Máscara laríngea é dispositivo temporário e não protege contra aspiração; e o enunciado ainda inclui sonda nasoenteral, contraindicada na fratura de base.","D":"Nasotraqueal está formalmente contraindicada na fratura de base de crânio — e é incompatível com bloqueio neuromuscular."},"roteiro":[],"takehome":"Guaxinim + Battle = nada pelo nariz. E Glasgow ≤ 8 = intube.","area":"HAM · Via aérea e ventilação"},{"id":109,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2025.1","num":4}],"enunciado":["(FASA VIC) Um médico faz parte de uma equipe de atendimento pré-hospitalar e é acionado para socorrer um motociclista de 30 anos que sofreu um acidente em uma rodovia. No local, o paciente está confuso, pálido e apresenta sudorese intensa. Seus sinais vitais são: FC 130 bpm, PA 90x60 mmHg, FR 26 irpm e SpO₂ de 91% em ar ambiente. Há um sangramento ativo no membro inferior esquerdo.","1. Liste as etapas da avaliação primária e as intervenções imediatas compatíveis com os achados clínicos do paciente. 2. Classifique o tipo de choque apresentado e fundamente sua resposta com base nos mecanismos fisiológicos envolvidos. 3. Indique as condutas pré-hospitalares adicionais para garantir um transporte seguro até a unidade de referência."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["1. Liste as etapas da avaliação primária e as intervenções imediatas compatíveis com os achados clínicos do paciente.","(Valor: 1,0 ponto)","Pontuaçã Elemento esperado o","A – Airway (via aérea) com proteção cervical. 0,2","B – Breathing: avaliação + oxigenoterapia, se indicada. 0,2","C – Circulation: controle de sangramento externo 0,3 (compressão/torniquete).","Acesso venoso + início de reposição volêmica com cristaloide. 0,3","2. Classifique o tipo de choque apresentado e fundamente sua resposta com base nos mecanismos fisiológicos envolvidos.","(Valor: 0,8 ponto)","Elemento esperado Pontuação Choque hipovolêmico hemorrágico. 0,3 Fundamentação fisiopatológica (perda de volume, hipoperfusão, resposta 0,5 simpática)","3. Indique as condutas pré-hospitalares adicionais para garantir um transporte seguro até a unidade de referência.","(Valor: 0,7 ponto)","Elemento esperado Pontuação Imobilização adequada do membro inferior com tala. 0,2 Monitorização contínua dos sinais vitais. 0,2 Transporte com proteção da coluna + oxigenoterapia mantida. 0,3","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Suporte Pré- Hospitalar no Trauma. 9ª ed. São Paulo: Elsevier; 2020."],"refs":[],"tema":"Choque hemorrágico — avaliação primária","conceito":"Confuso, pálido, sudoreico, FC 130, PA 90x60 com sangramento ativo = choque hemorrágico classe III (perda de 30–40%). Confusão indica hipoperfusão cerebral. No PHTLS a sequência é XABCDE — hemorragia exsanguinante ANTES da via aérea.","alt":{},"roteiro":["1) Avaliação primária: X — controle da hemorragia externa (compressão direta, torniquete se em jato ou incontrolável, agente hemostático).","A — via aérea com restrição de movimento cervical; B — ventilação e oxigenoterapia (SpO2 91% justifica O2 suplementar); C — dois acessos calibrosos e reposição com cristaloide aquecido, idealmente hemoderivados; D — avaliação neurológica (Glasgow, pupilas); E — exposição com prevenção de hipotermia.","2) Choque hipovolêmico hemorrágico. Fisiopatologia: perda de volume → queda do retorno venoso e do débito cardíaco → hipoperfusão tecidual → metabolismo anaeróbio com acúmulo de lactato e acidose; resposta simpática com taquicardia, vasoconstrição periférica (palidez, sudorese, extremidades frias) e redistribuição de fluxo para coração e cérebro.","3) Transporte: imobilizar a fratura com tala (reduz sangramento e dor), monitorização contínua, proteção da coluna, oxigenoterapia mantida, prevenção da tríade letal (hipotermia, acidose, coagulopatia) e transporte rápido para centro de trauma.","Mencione hipotensão permissiva (PAS-alvo ~80–90 mmHg enquanto a hemorragia não é controlada) e ácido tranexâmico nas primeiras 3 h."],"takehome":"No PHTLS atual, o X vem antes do A: hemorragia exsanguinante mata em minutos.","area":"HAM · Choque e resposta ao trauma"},{"id":110,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":5}],"enunciado":["(AFYA PALMAS) Após uma colisão automobilística, um homem de 42 anos é atendido pela equipe do serviço de emergência. Ele encontra-se consciente, orientado, com sinais vitais estáveis e sem evidência de ameaças imediatas à vida durante a avaliação primária, que foi completada com sucesso. A equipe segue, então, com a próxima etapa do atendimento, conforme os princípios do PHTLS.","Qual das condutas é apropriada para a etapa subsequente do atendimento pré-hospitalar?"],"alternativas":{"A":"Intubação orotraqueal com proteção cervical.","B":"Colocação de acesso venoso calibroso para reposição volêmica.","C":"Exame físico completo da cabeça aos pés e coleta da história SAMPLA.","D":"Drenagem torácica em selo d’água."},"correta":"C","oficial":{"A":"Intubação orotraqueal com proteção cervical. (Incorreta)","B":"Colocação de acesso venoso calibroso para reposição volêmica. (Incorreta)","D":"Drenagem torácica em selo d’água. (Incorreta)"},"oficial_extra":["A intubação é uma intervenção da avaliação primária, indicada quando há risco iminente à via aérea (rebaixamento de consciência, insuficiência respiratória, TCE grave). Não faz parte da avaliação secundária, que só é realizada após garantir as funções vitais.","Essa é uma medida pertencente à etapa “C” da avaliação primária (Circulation). O acesso venoso periférico de grande calibre e a administração de fluidos são essenciais para tratar ou prevenir choque hipovolêmico, e devem ser realizados precocemente.","Assim como a intubação, a drenagem torácica é uma intervenção da avaliação primária, indicada em casos de pneumotórax hipertensivo, hemotórax ou lesões torácicas graves. Não é realizada rotineiramente na fase secundária.","Exame físico completo da cabeça aos pés e coleta da história AMPLA. (Correta)","O paciente encontra-se estável e sem risco imediato à vida. Portanto, o atendimento segue para a avaliação secundária, que inclui exame físico detalhado e coleta da história AMPLA. As demais opções são medidas da avaliação primária ou indicadas apenas na presença de sinais de gravidade.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Suporte Pré- Hospitalar no Trauma. 9ª ed. São Paulo: Elsevier; 2020."],"refs":[],"tema":"Etapa seguinte à avaliação primária","conceito":"Primária completa e sem ameaças à vida → avaliação secundária: exame céfalo-podálico completo + história SAMPLE/SAMPLA + sinais vitais.","alt":{"A":"Intubação é intervenção do A da primária.","B":"Acesso venoso é intervenção do C da primária.","C":"CORRETA. Exame físico completo da cabeça aos pés e história SAMPLA.","D":"Drenagem torácica é intervenção do B da primária."},"roteiro":[],"takehome":"A questão só testa se você sabe o que pertence a cada etapa: três alternativas são intervenções da PRIMÁRIA.","area":"HAM · Atendimento ao politraumatizado"},{"id":111,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":6}],"enunciado":["(UNIREDENTOR) Paciente masculino, 41 anos, é resgatado após afogamento por submersão em cachoeira. Ao ser socorrido pela equipe do SAMU, encontra-se consciente, apresentando tosse com muita espuma e hipotensão arterial. ACV: RCR 2T BNF; FC: 112 bpm; PA: 86x51 mmHg, sem pulso radial palpável, com presença de pulso carotídeo. AR: Murmúrio vesicular diminuído em bases e com estertores crepitantes difusos; FR: 32 irpm; SpO2: 89 % ABD: Flácido, depressível, indolor, peristalse presente MMII: Sem edemas; Panturrilhas flácidas.","Qual é o grau de afogamento da vítima?"],"alternativas":{"A":"5","B":"4","C":"2","D":"3"},"correta":"A","oficial":{},"oficial_extra":["Classificação de Szpilman:","Gra Características principais u","1 Tosse leve, sem alteração respiratória ou circulatória.","2 Dispneia leve, ausculta normal ou com poucos estertores.","3 Dispneia moderada a grave, estertores difusos, hipoxemia, sem alteração hemodinâmica.","Insuficiência respiratória grave, hipoxemia, necessidade de suporte ventilatório, mas sem 4 choque.","5 Insuficiência respiratória com choque circulatório, ainda consciente.","6 Parada cardiorrespiratória (PCR).","Consciente.","Tosse com espuma (aspiração de líquido).","Hipotensão arterial (PA 86x51 mmHg).","Sem pulso radial palpável (perfusão central mantida).","FC 112 bpm, FR 32 irpm, SpO2 89% → hipoxemia moderada.","Estertores difusos e murmúrio diminuído em bases. Trata-se de um quadro de insuficiência respiratória associada a instabilidade hemodinâmica (choque compensado), sem parada cardiorrespiratória.","Justificativas das alternativas:","Grau 2 – Incorreta.","O grau 2 envolve dispneia leve, ausculta quase normal, sem hipóxia significativa, e sem comprometimento hemodinâmico. O paciente deste caso apresenta estertores difusos, taquipneia, hipoxemia e hipotensão — incompatível com grau 2.","Grau 3 – Incorreta.","No grau 3, há dispneia moderada a intensa, estertores e hipoxemia, mas sem alterações circulatórias importantes. O paciente aqui apresenta hipotensão, pulso radial ausente e perfusão central compensada, o que ultrapassa esse grau.","Grau 4 – Incorreta.","O grau 4 é caracterizado por insuficiência respiratória grave, com hipoxemia importante, mas sem choque. Neste caso, há sinais de choque (PA baixa, pulso radial ausente), o que o classifica como grau mais grave.","Grau 5 – Correta.","O grau 5 é definido por:","Insuficiência respiratória grave.","Presença de choque circulatório (hipotensão, má perfusão periférica).","Paciente ainda consciente. O paciente se enquadra perfeitamente neste grau, sem critérios de PCR (que caracterizaria grau 6).","Referência:","Fonte: PHTLS: Prehospital Trauma Life Support. 10ª edição, publicada pela National Association of Emergency Medical Technicians (NAEMT)."],"refs":[],"tema":"Afogamento — grau 5","conceito":"Szpilman: 1 tosse; 2 pouca espuma; 3 muita espuma sem hipotensão; 4 muita espuma COM hipotensão/choque; 5 parada respiratória com pulso; 6 PCR. Atenção: a classificação usada nesta questão (e na 97) varia um pouco entre as fontes — o critério prático é combinar ausculta/espuma + estado hemodinâmico + consciência.","alt":{"A":"CORRETA pelo gabarito. Paciente consciente com edema pulmonar (espuma, crepitantes difusos), hipoxemia e CHOQUE (PA 86x51, sem pulso radial).","B":"Grau 4 na tabela apresentada pela banca seria insuficiência respiratória grave SEM choque — aqui há hipotensão e pulso radial ausente.","C":"Grau 2 é dispneia leve com ausculta quase normal.","D":"Grau 3 tem estertores difusos mas SEM alteração hemodinâmica."},"roteiro":[],"takehome":"O divisor entre 3, 4 e 5 é a hemodinâmica: sem alteração / insuficiência grave / choque. Pulso radial ausente com carotídeo presente = PAS em torno de 70–80 mmHg.","area":"HAM · Queimaduras e trauma ambiental"},{"id":112,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":7}],"enunciado":["(FIP GUANAMBI) Uma equipe de emergência é acionada para atender um incêndio em uma boate com dezenas de vítimas. No local, encontram-se várias pessoas com queimaduras de diferentes graus, além de sintomas respiratórios. Entre os pacientes, destacam-se os seguintes casos:","Paciente 1: Homem, 25 anos, com queimaduras de segundo grau em aproximadamente 20% da superfície corporal (membros superiores e tronco anterior), apresentando rouquidão e dispneia leve.","Paciente 2: Mulher, 30 anos, com queimaduras de terceiro grau extensas (>40% da superfície corporal), inconsciente, com sinais de choque hipovolêmico.","Paciente 3: Homem, 40 anos, sem queimaduras aparentes, mas com confusão mental e saturação de O₂ em 88%, após inalação de fumaça.","Com base no atendimento a múltiplas vítimas queimadas, qual deve ser a conduta inicial da equipe de emergência?"],"alternativas":{"A":"Intubar precocemente o paciente 1 devido ao risco de obstrução de vias aéreas, iniciar hidratação venosa e administrar oxigenoterapia de alto fluxo para o paciente 3.","B":"Monitorar o paciente 3 antes de qualquer outra conduta, pois a confusão mental pode indicar lesão neurológica grave que precisa ser avaliada.","C":"Priorizar a ressuscitação volêmica do paciente 2, pois é a vítima com as queimaduras mais extensas e risco iminente de morte.","D":"Realizar curativos com pomada antibiótica para os queimados, administrar corticoides para os pacientes com sintomas respiratórios e iniciar analgesia para todos."},"correta":"A","oficial":{},"oficial_extra":["A presença de rouquidão e dispneia sugere lesão inalatória, exigindo intubação precoce para evitar obstrução da via aérea. A reposição volêmica é essencial para os queimados, e a oxigenoterapia é a principal conduta para vítimas de inalação de fumaça.","O paciente 2 apresenta queimaduras extensas e sinais de choque, tendo um prognóstico reservado. Em triagem de múltiplas vítimas, prioriza-se aqueles com maior chance de sobrevivência com tratamento imediato.","O uso de pomadas antibióticas não é a prioridade no atendimento inicial. Além disso, corticoides não são recomendados para lesão inalatória. O manejo correto inclui suporte ventilatório e oxigenoterapia.","A confusão mental pode ser resultado de intoxicação por monóxido de carbono ou cianeto, sendo essencial iniciar oxigenoterapia de alto fluxo imediatamente, em vez de apenas monitoramento.","Referência:","ADVANCED TRAUMA LIFE SUPPORT (ATLS). Manual do Curso ATLS: Suporte Avançado de Vida no Trauma. 10ª ed. Chicago: American College of Surgeons, 2018. BRASIL. Ministério da Saúde. Diretrizes para o Atendimento Inicial ao Paciente Queimado. Brasília: Ministério da Saúde, 2012."],"refs":[],"tema":"Múltiplas vítimas de incêndio — prioridades","conceito":"Duas lógicas se combinam: quem tem via aérea ameaçada mas ainda patente precisa ser intubado ANTES do edema fechar (paciente 1), e em triagem de catástrofe recursos vão para quem tem maior chance de sobreviver — 3º grau em > 40% com choque e inconsciência tem prognóstico reservado (paciente 2).","alt":{"A":"CORRETA. Intubar precocemente o paciente 1 (rouquidão = edema laríngeo em evolução), hidratação venosa e O2 de alto fluxo para o paciente 3 (provável intoxicação por CO).","B":"Monitorar o paciente 3 'antes de tudo' e atribuir a confusão a lesão neurológica ignora a causa mais provável: intoxicação por CO, que se trata com O2 a 100%.","C":"Concentrar recursos na vítima de pior prognóstico é o oposto da lógica de triagem em massa.","D":"Curativo e pomada não são prioridade inicial, e corticoide NÃO é recomendado em lesão inalatória."},"roteiro":[],"takehome":"Rouquidão em queimado = intube agora. Confusão + SpO2 baixa após fumaça = O2 a 100% para CO.","area":"HAM · Queimaduras e trauma ambiental"},{"id":113,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":8}],"enunciado":["(AFYA PALMAS) Um jovem de 17 anos é atendido por equipe pré-hospitalar após sofrer uma queda de motocicleta em alta velocidade. Encontra-se consciente, porém confuso, com pele fria e úmida, extremidades pálidas e pulsos filiformes. A pressão arterial é de 90/60 mmHg e a frequência cardíaca é de 138 bpm. Apresenta fratura exposta em fêmur esquerdo com sangramento ativo. A gasometria venosa mostra pH 7,20, bicarbonato de 16 mEq/L e lactato elevado.","Qual das alternativas a seguir está mais diretamente relacionada ao quadro apresentado?"],"alternativas":{"A":"A fratura de fêmur, por ser localizada, não causa repercussão significativa sobre o estado hemodinâmico geral.","B":"O estado ácido-base permanece estável, sendo a gasometria compatível com função celular preservada.","C":"A perda volêmica compromete a perfusão tecidual, levando à acidose metabólica por metabolismo anaeróbico.","D":"A hiperventilação causada pela dor intensa leva à alcalose metabólica, justificando a alteração do pH observada."},"correta":"C","oficial":{"C":"A perda volêmica compromete a perfusão tecidual, levando à acidose metabólica por metabolismo anaeróbico. Correta. O paciente apresenta sinais clássicos de choque hipovolêmico traumático, com taquicardia, hipotensão, pele fria, confusão mental e fratura de fêmur com sangramento — que pode resultar em perda significativa de volume (até 1,5 L). A hipoperfusão leva à ativação do metabolismo anaeróbico, com produção de lactato e instalação de acidose metabólica. Essa é a base fisiopatológica essencial do choque traumático, segundo o PHTLS.","D":"A hiperventilação causada pela dor intensa leva à alcalose metabólica, justificando a alteração do pH observada. Incorreta. A dor pode levar à hiperventilação, sim, mas essa causaria alcalose respiratória, e não alcalose metabólica como mencionado. Além disso, a gasometria mostra acidose metabólica clara, incompatível com a alternativa.","A":"A fratura de fêmur, por ser localizada, não causa repercussão significativa sobre o estado hemodinâmico geral. Incorreta. A fratura de fêmur é uma fonte importante de perda volêmica em traumas. Sua contribuição para a instabilidade hemodinâmica é significativa, sendo reconhecida como uma das principais causas de choque hemorrágico interno em traumas fechados.","B":"O estado ácido-base permanece estável, sendo a gasometria compatível com função celular preservada. Incorreta. O pH ácido, o bicarbonato baixo e o lactato elevado são indicadores objetivos de comprometimento sistêmico e acidose metabólica. Essa alternativa desconsidera os achados laboratoriais e clínicos importantes para a avaliação do choque."},"oficial_extra":["Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Suporte Pré- Hospitalar no Trauma. 9ª ed. São Paulo: Elsevier; 2020."],"refs":[],"tema":"Choque hemorrágico e acidose lática","conceito":"Fratura de fêmur pode sequestrar 1–1,5 L de sangue (tíbia ~750 mL, pelve até 3 L ou mais). Hipoperfusão → metabolismo anaeróbio → lactato → acidose metabólica com ânion gap aumentado (pH 7,20, HCO3 16).","alt":{"A":"Falso: fratura de fêmur é fonte importante de perda volêmica.","B":"Falso: pH baixo, bicarbonato baixo e lactato alto são acidose metabólica evidente.","C":"CORRETA. Perda volêmica → hipoperfusão → metabolismo anaeróbio → acidose metabólica.","D":"Dois erros: hiperventilação causaria alcalose RESPIRATÓRIA (não metabólica), e a gasometria mostra acidose."},"roteiro":[],"takehome":"Lactato é termômetro de perfusão. Memorize o sangramento oculto por osso: tíbia 750 mL, fêmur 1,5 L, pelve 3 L+.","area":"HAM · Choque e resposta ao trauma"},{"id":114,"materia":"HAM 8","tipo":"discursiva","provas":[{"prova":"HAM 8 2025.1","num":9}],"enunciado":["(AFYA IPATINGA) O serviço de atendimento de urgência (SAMU) recebeu um chamado para socorro de um homem jovem, vítima de acidente motociclístico em via de alta velocidade. Ao chegar ao local, a equipe se depara com a vítima caída ao solo próxima à moto, em decúbito dorsal, sem capacete, não responsiva, pálida e com sangramento ativo em jato volumoso na perna esquerda.","Aplicando seus conhecimentos sobre atendimento inicial ao politraumatizado, responda às questões que se seguem.","a) Cite as três prioridades imediatas na chegada ao local do acidente (0,5 ponto).","b) Ao iniciar a avaliação primária deste paciente, descreva o primeiro passo a ser adotado para a condução do caso, incluindo medidas terapêuticas pertinentes (0,5 ponto).","c) Após realizadas as medidas descritas no item anterior, esquematize resumidamente as etapas subsequentes a serem adotadas na avaliação primária deste paciente (0,5 ponto).","d) Justifique de forma sucinta e objetiva a necessidade de transporte rápido para uma unidade hospitalar deste paciente (0,5 ponto)."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["A) As três prioridades imediatas na chegada ao local de atendimento são: avaliação da segurança do local e uso de equipamentos de proteção individual (segurança); identificação da necessidade de recursos adicionais (cena/scene); avaliação de pacientes de forma individual priorizando a sequência: condições que podem resultar na perda de vida, condições que podem resultar na perda de membro, todas as outras condições que não ameaçam a vida ou o membro (situação).","B) A hemorragia externa arterial exsanguinante deve ser controlada antes mesmo da avaliação da via aérea. Ela é melhor tratada colocando-se imediatamente um torniquete o mais proximal possível (próximo à virilha) na extremidade afetada. Outras medidas de controle de sangramento, como compressão direta e agentes hemostáticos, também podem ser utilizadas, mas não devem retardar ou substituir a colocação do torniquete nestes casos.","C) As etapas subsequentes ao controle da hemorragia exsanguinante (X) da avaliação primária do paciente traumatizado podem ser lembradas usando o mnemônico: A - manejo de vias aéreas e restrição de movimentos da coluna vertebral; B - respiração (ventilação e oxigenação); C - circulação (perfusão e outras hemorragias); D - incapacidade; E - exposição/ambiente.","D) O paciente apresenta uma condição, à avaliação primária, que coloca em risco sua vida, portanto, o transporte para o local apropriado mais rápido possível se justifica.","Referência:","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Atendimento Pré- Hospitalar ao Traumatizado. Avaliação e manejo do paciente. 10ª ed., 2023, cap. 6."],"refs":[],"tema":"Politrauma — prioridades na cena e XABCDE","conceito":"O PHTLS 10ª edição colocou o X (hemorragia exsanguinante) antes do A. Sangramento em jato volumoso = torniquete imediato, sem perder tempo tentando compressão primeiro.","alt":{},"roteiro":["a) Três prioridades na chegada: SEGURANÇA (da cena, da equipe e da vítima, com EPI); avaliação da CENA (mecanismo de trauma, número de vítimas, necessidade de recursos adicionais); e avaliação da SITUAÇÃO, priorizando condições que ameaçam a vida, depois o membro, depois as demais.","b) Primeiro passo: controle da hemorragia exsanguinante (X), ANTES da via aérea. Torniquete o mais proximal possível no membro afetado, apertado até cessar o sangramento; anote o horário. Compressão direta e agentes hemostáticos são complementares, não substitutos, e não devem atrasar o torniquete.","c) Etapas subsequentes: A — via aérea com restrição de movimento da coluna; B — ventilação e oxigenação; C — circulação (perfusão e demais hemorragias); D — disfunção neurológica (Glasgow, pupilas, glicemia); E — exposição e controle do ambiente/hipotermia.","d) Justificativa do transporte rápido: há condição que ameaça a vida identificada na avaliação primária (hemorragia grave com paciente não responsivo). O controle definitivo é cirúrgico e só existe no hospital — aplica-se a 'golden hour' e o conceito de carga e arranca (load and go), com as intervenções feitas a caminho."],"takehome":"Sangramento em jato = torniquete antes do A. E o tratamento definitivo do sangramento interno é o centro cirúrgico, não a ambulância.","area":"HAM · Atendimento ao politraumatizado"},{"id":115,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.1","num":10}],"enunciado":["(AFYA PALMAS) Um homem de 34 anos, previamente hígido, sofre um acidente automobilístico com colisão frontal em alta velocidade. No atendimento pré-hospitalar, apresenta-se confuso, pálido, diaforético, com pulsos finos e frequentes. Os sinais vitais são: frequência cardíaca de 135 bpm, pressão arterial de 85/50 mmHg, frequência respiratória de 28 irpm e saturação periférica de oxigênio de 93% em ar ambiente. O exame físico revela extremidades frias e tempo de enchimento capilar de 5 segundos.","Assinale a alternativa correta."],"alternativas":{"A":"O paciente apresenta choque hipovolêmico, e deve-se focar na expansão volêmica, controle da hemorragia e reposição guiada por parâmetros clínicos.","B":"O quadro clínico é compatível com pneumotórax hipertensivo e deve ser procedida a toracocentese de alívio no quinto espaço intercostal.","C":"O paciente apresenta choque distributivo, com indicação de início imediato de droga vasopressora endovenosa.","D":"O uso de inotrópicos deve ser a primeira medida terapêutica, pois o paciente apresenta provável choque cardiogênico devido à contusão miocárdica."},"correta":"A","oficial":{"C":"O paciente apresenta choque distributivo, com indicação de início imediato de droga vasopressora endovenosa.","D":"O uso de inotrópicos deve ser a primeira medida terapêutica, pois o paciente apresenta provável choque cardiogênico devido à contusão miocárdica.","B":"O quadro clínico é compatível com pneumotórax hipertensivo e deve ser procedida a toracocentese de alívio no quinto espaço intercostal."},"oficial_extra":["O paciente apresenta choque hipovolêmico, cujo tratamento deve ser focado na expansão volêmica, controle da hemorragia e reposição guiada por parâmetros clínicos.","Justificativa: Esta alternativa está correta. O quadro clínico do paciente, que inclui pressão arterial baixa (85/50 mmHg), frequência cardíaca elevada (135 bpm), sinais de hipoperfusão (pulsos finos, extremidades frias e enchimento capilar prolongado), sugere um choque hipovolêmico. O tratamento adequado envolve a rápida expansão volêmica e controle da hemorragia.","Justificativa: Esta opção é incorreta. O choque distributivo, como o choque séptico, é caracterizado por hipotensão, mas frequentemente tem outros sinais clínicos como febre ou eritema. O quadro apresentado é mais sugestivo de um choque hipovolêmico, não indicando a necessidade de vasopressores imediatamente.","Justificativa: Esta alternativa é errada. O choque cardiogênico é caracterizado por sinais de insuficiência cardíaca e não é a explicação mais provável neste caso. A primeira abordagem em choque hipovolêmico é a expansão volêmica, não o uso de inotrópicos, que é mais apropriado em casos reconhecidos de choque cardiogênico.","Justificativa: Esta opção é incorreta. Embora o pneumotórax hipertensivo possa causar choque e hipotensão, o paciente não apresenta sinais clássicos como desvio de traqueia ou hipofonese à ausculta. O quadro se encaixa mais em choque hipovolêmico; a abordagem prioritária deve ser a estabilização volêmica.","Referência:","Prehospital Trauma Life Support (PHTLS) – 10ª edição, 2024."],"refs":[],"tema":"Identificação do tipo de choque","conceito":"Pele fria e pálida, enchimento capilar > 3 s, taquicardia e hipotensão = choque FRIO (hipovolêmico ou cardiogênico). Choque distributivo (séptico, anafilático, neurogênico) costuma ter extremidades quentes e vasodilatação. O neurogênico tem a pista de bradicardia com hipotensão.","alt":{"A":"CORRETA. Choque hipovolêmico: controle da hemorragia + expansão volêmica guiada por parâmetros clínicos (nível de consciência, enchimento capilar, diurese, lactato).","B":"Pneumotórax hipertensivo teria desvio de traqueia, turgência jugular, hipertimpanismo e ausência de murmúrio unilateral. Detalhe: a descompressão hoje é no 5º EIC na linha axilar média (ou 2º EIC na hemiclavicular), mas o quadro não é esse.","C":"Distributivo teria extremidades quentes; e vasopressor em hipovolemia não corrigida piora a perfusão.","D":"Contusão miocárdica é possível em colisão frontal, mas é diagnóstico de exclusão — a primeira hipótese no trauma com hipotensão é sempre hemorragia."},"roteiro":[],"takehome":"No trauma, todo choque é hemorrágico até prova em contrário. Extremidade fria = hipovolêmico ou cardiogênico; quente = distributivo.","area":"HAM · Choque e resposta ao trauma"},{"id":116,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":1}],"enunciado":["(FASA VIC) Um homem de 28 anos, vítima de acidente motociclístico, é encontrado inconsciente na cena, sem capacete, apresentando respiração ruidosa e esforço respiratório ineficaz. A avaliação inicial mostra FC 120 bpm, PA 90/60 mmHg, FR 8 irpm, SpO₂ 82%. Observa-se sangramento oral moderado e suspeita de fratura cervical (mecanismo de alta energia).","Com base no PHTLS, qual a conduta mais adequada para desobstrução e manejo inicial das vias aéreas desse paciente?"],"alternativas":{"A":"Inserir cânula nasofaríngea e realizar ventilação com máscara-valva imediatamente, sem necessidade de imobilização cervical.","B":"Realizar chin-lift, aspirar secreções e ventilar com pressão positiva com máscara e cânula orofaríngea.","C":"Aplicar manobra de “jaw thrust” modificada, aspiração de secreções e oxigenação suplementar, com preparo para intubação orotraqueal em ambiente controlado.","D":"Realizar hiperextensão cervical, aspiração de secreções, oxigenação suplementar e intubação orotraqueal imediata no local do acidente."},"correta":"C","oficial":{"D":"Realizar hiperextensão cervical, aspiração de secreções, oxigenação suplementar e intubação orotraqueal imediata no local do acidente. Incorreta: A hiperextensão cervical está contraindicada em suspeita de lesão de coluna cervical. A intubação orotraqueal pode ser necessária, mas deve ser feita com imobilização cervical e, de preferência, em ambiente hospitalar com equipe preparada, não no atendimento pré-hospitalar imediato em condições precárias.","A":"Inserir cânula nasofaríngea e realizar ventilação com máscara-valva imediatamente, sem necessidade de imobilização cervical. Incorreta: A cânula nasofaríngea pode ser usada em pacientes inconscientes sem fratura de base de crânio suspeita, mas não substitui a proteção cervical e nem o manejo definitivo. Além disso, o paciente está gravemente hipoxêmico e instável, exigindo preparo rápido para via aérea definitiva.","B":"Realizar chin-lift, aspirar secreções e ventilar com pressão positiva com máscara e cânula orofaríngea. Incorreta: O chin-lift (elevação do queixo) é contraindicado em pacientes com suspeita de trauma cervical — como é o caso aqui. A técnica recomendada é o jaw thrust (manobra de tração da mandíbula), que mantém o alinhamento da coluna. Já o restante da conduta seria possível, já que é parte essencial da abordagem de pacientes com secreções em vias aéreas."},"oficial_extra":["Aplicar manobra de tração mandibular (“jaw thrust”), aspiração de secreções e oxigenação suplementar, com preparo para intubação orotraqueal em ambiente controlado. Correta: O PHTLS recomenda, na suspeita de trauma cervical, a manobra de tração mandibular em vez da hiperextensão, associada à aspiração das vias aéreas e oxigenação. Deve-se preparar para intubação orotraqueal precoce, pois o paciente está inconsciente e hipoxêmico.","Referência: NATIONAL ASSOCIATION OF EMERGENCY MEDICAL TECHNICIANS PHTLS: Atendimento pré-hospitalar ao traumatizado. 10. ed. Rio de Janeiro: Elsevier, 2023."],"refs":[],"tema":"Via aérea com suspeita de lesão cervical","conceito":"FR 8 com SpO2 82% é hipoventilação grave que exige ventilação assistida. Com mecanismo de alta energia, a manobra é jaw thrust, nunca chin lift com extensão nem hiperextensão.","alt":{"A":"Cânula nasofaríngea é contraindicada se houver suspeita de fratura de base de crânio (trauma craniano sem capacete), e dispensar imobilização cervical é erro.","B":"O erro é o chin-lift: contraindicado na suspeita de trauma cervical. O restante da conduta estaria correto — distrator bem montado.","C":"CORRETA. Jaw thrust modificado + aspiração + oxigenação, preparando a intubação orotraqueal.","D":"Hiperextensão cervical é formalmente contraindicada."},"roteiro":[],"takehome":"Leia procurando a manobra: jaw thrust = certo; chin lift ou hiperextensão em trauma = errado.","area":"HAM · Via aérea e ventilação"},{"id":117,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":2}],"enunciado":["(FMIT) Um médico está de plantão no Instituto Médico Legal e recebe uma vítima de acidente automobilístico para realização de necropsia. Consta na ficha da equipe de atendimento pré-hospitalar que essa vítima já se encontrava sem vida no local. A perícia no local identificou colisão frontal de automóvel contra objeto fixo, no caso, um poste. Verificou ainda que o veículo não possui sistema de air bag, ou se tinha, não foi acionado. O corpo estava com cinto de três pontas e projetado para cima e sobre o volante. O velocímetro travado acusava uma velocidade de 180km/h.","Qual o padrão de lesão predominante você espera encontrar em seu exame de necrópsia?"],"alternativas":{"A":"Fratura de crânio, da clavícula, com fratura de arcos costais e de fêmur, todas acompanhando um único lado.","B":"Traumatismo craniano associado a traumatismo torácico com fraturas de costelas e ruptura de vísceras ocas no abdome por compressão.","C":"Luxação dos joelhos com lesão vascular grave (ruptura traumática da artéria poplítea) associada a fratura bilateral do acetábulo.","D":"Lesão de chicote em região cervical devido a cisalhamento e estiramento de ligamentos e estruturas de fixação do pescoço."},"correta":"B","oficial":{},"oficial_extra":["Incidentes envolvendo veículos automotores são divididos em 5 tipos, de acordo com os padrões de lesões que causam e, apesar de sofrerem certa variação, mantêm semelhança nas lesões mais graves. São eles: impacto frontal, impacto traseiro, impacto lateral, impacto rotacional e capotagem. Todos os impactos têm relação direta com a velocidade de impacto, principal constante física do trauma na transferência de energia (cinética), e todos os danos são reduzidos, ao menos em parte, por dispositivos de segurança como cinto de três pontas e airbag.","Os impactos frontais seguem dois padrões: quando o corpo se projeta para cima e sobre o volante e quando se projeta para baixo e sob o volante. No primeiro caso, o traumatismo craniano é a lesão frequentemente encontrada, por choque contra o para-brisas, seguido de grave lesão torácica, direta e por compressão das estruturas do abdome, podendo levar a ruptura de vísceras ocas por sobre pressão do diafragma. No segundo caso, as lesões predominam em membros inferiores, com fraturas de tornozelos e joelhos, geralmente associadas a lesões vasculares graves da artéria poplítea. Outro setor acometido é a pelve, por projeção do fêmur sobre o acetábulo, lesando graves lesões nesse segmento.","Os impactos traseiros acometem mais frequentemente a região das vértebras cervicais com lesões medulares graves (síndrome da medula anterior), principalmente em veículos sem encosto de cabeça ou com este em posição inadequada.","Os impactos laterais geralmente acometem um padrão de lesões com múltiplas fraturas de segmentos do mesmo lado, podendo atingir cabeça, pescoço, clavícula, tórax, abdome e pelve.","Já os impactos rotacionais incluem padrões de lesões que combinam lesões vistas nos impactos frontais e nos impactos laterais.","Na capotagem, os impactos são múltiplos, combinados e em diversos ângulos. Vítimas sem cinto de segurança sofrem as lesões mais graves, além do risco de projeção para fora do veículo.","Referência:","SUPORT, Prehospital Trauma Life. Atendimento pré-hospitalar ao traumatizado. Tradução da 9ª edição. São Paulo. Artmed Editora, 2019."],"refs":[],"tema":"Cinemática do trauma — impacto frontal","conceito":"No impacto frontal o corpo segue uma de duas trajetórias. 'Para cima e por cima' do volante: cabeça e tórax batem primeiro (TCE, fraturas de costelas, contusão pulmonar e cardíaca, lesão de aorta por desaceleração, ruptura de vísceras por compressão). 'Para baixo e por baixo': joelhos contra o painel (luxação de joelho com lesão poplítea, fratura de fêmur, luxação posterior de quadril e acetábulo).","alt":{"A":"Lesões todas de um lado descrevem impacto LATERAL.","B":"CORRETA. O enunciado diz explicitamente 'projetado para cima e sobre o volante' = trajetória up-and-over: TCE + trauma torácico com fraturas de costelas + ruptura de vísceras por compressão.","C":"Esse é o padrão down-and-under, que o enunciado descarta.","D":"Lesão em chicote é típica do impacto TRASEIRO."},"roteiro":[],"takehome":"A trajetória do corpo, descrita no enunciado, entrega a resposta. Decore os cinco padrões: frontal (up-over e down-under), traseiro, lateral, rotacional e capotagem.","area":"HAM · Física do trauma e cinemática"},{"id":118,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":3}],"enunciado":["(UNITPAC) Um paciente do sexo masculino, 50 anos, é trazido à emergência após um acidente automobilístico (colisão entre automóvel e motocicleta), no qual foi ejetado do veículo. Na admissão, apresenta-se cianótico, com respiração ruidosa e estridor, associado a esforço respiratório intenso, evidenciado por uso de musculatura acessória, tiragem intercostal e batimento de asas do nariz. Além disso, exibe comprometimento ventilatório progressivo, sugerido por taquipneia importante e fala entrecortada.","Qual deve ser o plano de abordagem de vias aéreas, incluindo o uso de drogas na ventilação mecânica assistida?"],"alternativas":{"A":"Realizar intubação orotraqueal com indução de sequência rápida (RSI) utilizando um hipnótico sedativo de ação ultrarrápida e bloqueador neuromuscular.","B":"Iniciar ventilação mecânica com pressão positiva contínua nas vias aéreas (CPAP) e administrar adrenalina intravenosa.","C":"Administrar oxigênio a 100% por máscara facial e realizar uma tomografia computadorizada de crânio, tendo em vista a cinética do trauma.","D":"Administrar três ciclos de broncodilatadores e corticosteroides, concomitantemente, antes de proceder com a sequência rápida de intubação."},"correta":"A","oficial":{"C":"A alternativa \"Administrar oxigênio a 100% por máscara facial e realizar uma tomograﬁa computadorizada de crânio, tendo em vista a cinética do trauma.\" está incorreta, pois administrar oxigênio a 100% é essencial no manejo inicial, mas realizar uma tomograﬁa computadorizada não é uma prioridade imediata em uma situação de obstrução de vias aéreas em que a intubação é necessária.","B":"A alternativa \"Iniciar ventilação mecânica com pressão positiva contínua nas vias aéreas (CPAP) e administrar adrenalina intravenosa.\" também é incorreta. A ventilação mecânica com CPAP pode ser útil em algumas situações respiratórias, mas, em casos de obstrução de vias aéreas superiores graves, a intubação é preferível. A administração de adrenalina é indicada em reações anaﬁláticas, não sendo a primeira escolha nesta situação (Urman, 2018).","A":"A alternativa \"Realizar intubação orotraqueal com indução de sequência rápida (RSI) utilizando um hipnótico sedativo de ação ultrarrápida e bloqueador neuromuscular.\" é a correta, pois a intubação orotraqueal com indução de sequência rápida (RSI) utilizando um agente de indução hipnótico, como etomidato, por exemplo, e um agente paralisante, bloqueador neuromuscular, como a succinilcolina (Urman, 2018), é a abordagem mais indicada para garantir a via aérea e permitir a ventilação mecânica assistida em pacientes com obstrução grave das vias aéreas superiores (American College of Surgeons, 2018).","D":"A alternativa \"Administrar três ciclos de broncodilatadores e corticosteroides, concomitantemente, antes de proceder com a sequência rápida de intubação.\" encontra-se equivocada, pois broncodilatadores e corticosteroides podem ser úteis em condições obstrutivas como asma e DPOC, mas a intubação não deve ser adiada se houver comprometimento agudo das vias aéreas superiores (Tavares, 2019)."},"oficial_extra":[],"refs":["AMERICAN COLLEGE OF SURGEONS. Advanced Trauma Life Support (ATLS). 10. ed. Chicago: American College of Surgeons, 2018.","URMAN, Richard D. Manual de Anestesia de Bolso. 6.ª ed. Ed. Thieme Revinter, 2018.","TAVARES, Jairo. Manual de Ventilação Mecânica. 1.ª ed. Editora dos Editores, 2019."],"tema":"Obstrução de via aérea superior — RSI","conceito":"Estridor + cianose + uso de musculatura acessória + fala entrecortada = obstrução grave e iminente falência ventilatória. Conduta: via aérea definitiva por sequência rápida (pré-oxigenação, indução com hipnótico como etomidato ou cetamina, bloqueio neuromuscular com succinilcolina ou rocurônio), com estabilização cervical e plano de resgate cirúrgico pronto.","alt":{"A":"CORRETA. Intubação orotraqueal com sequência rápida (hipnótico + bloqueador neuromuscular).","B":"CPAP não vence obstrução alta, e adrenalina é para anafilaxia — que não é o quadro.","C":"Oxigênio é necessário, mas TC de crânio em paciente com via aérea ameaçada é levar o paciente ao 'túnel da morte' antes de estabilizar.","D":"Broncodilatador e corticoide tratam obstrução BAIXA (asma, DPOC); aqui a obstrução é ALTA e não se adia a intubação."},"roteiro":[],"takehome":"Estridor = obstrução alta; sibilo = obstrução baixa. A primeira intuba, a segunda broncodilata.","area":"HAM · Via aérea e ventilação"},{"id":119,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":4},{"prova":"HAM 8 2026.1","num":8}],"enunciado":["(AFYA Palmas) Durante atendimento pré-hospitalar a um acidente automobilístico com capotamento, um homem de 22 anos é encontrado consciente, porém letárgico, com extremidades frias e sudoréticas e pulso de difícil palpação. Relata dor abdominal difusa e apresenta distensão abdominal progressiva. Os sinais vitais mostram frequência cardíaca de 142 bpm, pressão arterial de 84×58 mmHg e frequência respiratória de 28 irpm. A gasometria arterial revela pH 7,18 (VR: 7,35– 7,45), bicarbonato 15 mEq/L (VR: 22–26 mEq/L) e aumento importante de lactato (VR: <2,0 mmol/L).","Com base no quadro clínico e laboratorial apresentado, qual alteração fisiológica justifica os achados descritos?"],"alternativas":{"A":"A distensão abdominal progressiva indica alcalose metabólica compensatória secundária à hipoperfusão esplâncnica mantida.","B":"A acidose respiratória, provocada por hipoventilação secundária ao trauma, é responsável pela queda da pressão arterial e do nível de consciência.","C":"A dor abdominal intensa gera resposta adrenérgica com hiperventilação, elevando o pH e caracterizando alcalose respiratória compensatória.","D":"O choque hemorrágico leva à queda da perfusão tecidual, com acúmulo de lactato e instalação de acidose metabólica grave."},"correta":"D","oficial":{"D":"Gabarito: O choque hemorrágico leva à queda da perfusão tecidual, com acúmulo de lactato e instalação de acidose metabólica grave.","B":"A acidose respiratória, provocada por hipoventilação secundária ao trauma, é responsável pela queda da pressão arterial e do nível de consciência. Justificativa: A gasometria revela acidose metabólica (pH baixo, bicarbonato reduzido e lactato elevado), e não respiratória. A ventilação está aumentada (FR = 28 irpm), afastando hipoventilação.","A":"A distensão abdominal progressiva indica alcalose metabólica compensatória secundária à hipoperfusão esplâncnica mantida. Justificativa: O mecanismo fisiopatológico do choque é a acidose metabólica por hipoperfusão e acúmulo de ácido láctico. A alternativa descreve uma condição que não condiz com os achados laboratoriais.","C":"A dor abdominal intensa gera resposta adrenérgica com hiperventilação, elevando o pH e caracterizando alcalose respiratória compensatória. Justificativa: O pH ácido (7,18) contradiz a hipótese de alcalose. Embora a dor possa gerar hiperventilação, a gasometria revela acidose metabólica, incompatível com a explicação apresentada."},"oficial_extra":["O choque hemorrágico leva à queda da perfusão tecidual, com acúmulo de lactato e instalação de acidose metabólica grave. Justificativa: Os dados clínicos e laboratoriais são compatíveis com hipoperfusão tecidual grave secundária a hemorragia interna. Isso leva à acidose metabólica, evidenciada pelo pH baixo, bicarbonato reduzido e lactato elevado."],"refs":["AMERICAN COLLEGE OF SURGEONS. Advanced Trauma Life Support: Student Course Manual. 10. ed. Chicago: ACS, 2018.","BRASIL. Ministério da Saúde. Diretrizes de atenção ao politraumatizado em serviços de urgência e emergência. Brasília: MS, 2022.","National Association of Emergency Medical Technicians (NAEMT). PHTLS: Suporte Pré-Hospitalar no Trauma. 9ª ed. São Paulo: Elsevier; 2020."],"tema":"Choque hemorrágico interno — gasometria","conceito":"Capotamento + letargia + extremidades frias + distensão abdominal progressiva = hemorragia intra-abdominal. Gasometria: pH 7,18, HCO3 15, lactato alto = acidose metabólica por hipoperfusão. A FR de 28 é compensação respiratória (respiração de Kussmaul), não a causa.","alt":{"A":"Não há alcalose alguma — o pH é 7,18.","B":"Acidose respiratória exigiria hipoventilação e PaCO2 alta; o paciente está hiperventilando.","C":"A hiperventilação aqui é compensatória de uma acidose metabólica, e o pH ácido derruba a hipótese de alcalose.","D":"CORRETA. Choque hemorrágico → hipoperfusão → lactato → acidose metabólica grave."},"roteiro":[],"takehome":"Distensão abdominal progressiva com choque no trauma = sangramento intraperitoneal; o destino é o centro cirúrgico (ou FAST/laparotomia), não mais volume.","area":"HAM · Choque e resposta ao trauma"},{"id":120,"materia":"HAM 8","tipo":"objetiva","provas":[{"prova":"HAM 8 2025.2","num":5}],"enunciado":["(ITPAC Porto Nacional) Um jovem de 17 anos é retirado de uma cachoeira após episódio de afogamento por submersão em água doce. Ele foi encontrado inconsciente, respirando de forma irregular e com pulso central palpável. No local, familiares relatam que houve submersão por cerca de 3 minutos até o resgate.","No atendimento inicial, ainda no ambiente da cachoeira, qual deve ser a conduta
