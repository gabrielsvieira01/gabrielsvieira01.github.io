úde."},"correta":"A","oficial":{},"oficial_extra":["PPA, LDO e LOA são instrumentos de planejamento do governo como um todo, previstos na Constituição, mas não são os instrumentos específicos do SUS, embora devam ser compatibilizados com o planejamento em saúde.","O Plano de Saúde, a Programação Anual de Saúde (PAS) e o Relatório de Gestão são os três instrumentos oficiais do processo cíclico de planejamento e gestão do SUS. Eles se articulam entre si, garantindo definição de metas, execução anual e avaliação dos resultados alcançados.","O Plano Diretor de Regionalização e o Relatório Detalhado Quadrimestral existem como ferramentas complementares, mas não são considerados os instrumentos centrais do planejamento do SUS.","O Plano Nacional de Saúde, o Termo de Compromisso de Gestão e o COAP são dispositivos relevantes em algumas esferas, mas não substituem o tripé central (Plano de Saúde, PAS e Relatório de Gestão).","Referência:","CONSELHO NACIONAL DE SECRETÁRIOS DE SAÚDE (CONASS). A gestão do SUS. Brasília: CONASS, 2015. Capítulo 2 – Gestão e Planejamento. p. 37-41. Disponível em: https://www.conass.org.br/biblioteca/. Acesso em: 21 set. 2025."],"refs":[],"tema":"Instrumentos oficiais de planejamento","conceito":"Os três instrumentos do ciclo de planejamento do SUS: Plano de Saúde (4 anos), Programação Anual de Saúde e Relatório (Anual) de Gestão. O PPA/LDO/LOA são instrumentos orçamentários de TODO o governo — devem ser compatibilizados com o planejamento da saúde, mas não são instrumentos do SUS.","alt":{"A":"CORRETA. Plano de Saúde, PAS e Relatório de Gestão.","B":"PPA, LDO e LOA são orçamentários gerais, não específicos do SUS.","C":"Termo de Compromisso de Gestão (Pacto pela Saúde) e COAP são instrumentos de pactuação, não o ciclo de planejamento local.","D":"PDR e RDQA são complementares; 'Programa Nacional de Saúde' não é instrumento."},"roteiro":[],"takehome":"Cuidado com a pegadinha PPA/LDO/LOA: são de finanças públicas em geral, não do SUS.","area":"IESC · Planejamento e gestão no SUS"},{"id":160,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":6}],"enunciado":["(UNIGRANRIO Barra) Uma Unidade Básica de Saúde (UBS) de um município de médio porte enfrenta um aumento expressivo na demanda por exames especializados (ressonâncias magnéticas, exames laboratoriais de alta complexidade e ultrassonografias específicas), que não são ofertados no serviço público local. A gestão municipal decide articular convênios com serviços privados para suprir a demanda, garantindo o acesso da população.","Considerando os processos de regulação em saúde e contratualização de serviços privados no SUS, analise as afirmativas:","I. A contratualização com serviços privados deve respeitar os princípios do SUS, como universalidade, integralidade e equidade, além de atender a requisitos legais, técnicos e de transparência. II. O processo de regulação deve priorizar a organização da fila de espera com base em critérios clínicos e de vulnerabilidade social, buscando assegurar justiça e eficácia no acesso. III. A ampliação da oferta de serviços via convênios privados deve estar inserida em planejamento integrado da Rede de Atenção à Saúde (RAS), garantindo que não haja fragmentação do cuidado. IV. A avaliação periódica dos contratos e dos serviços ofertados não é necessária na APS, pois o monitoramento é atribuição exclusiva do gestor estadual. V. A contratualização pode ser usada como estratégia temporária para suprir lacunas assistenciais, mas deve ser acompanhada de ações de fortalecimento da rede pública de serviços especializados.","Assinale a alternativa correta."],"alternativas":{"A":"Apenas I, II, III e IV estão corretas.","B":"Apenas I, II, IV e V estão corretas.","C":"Apenas II, III, IV e V estão corretas.","D":"Apenas I, II, III e V estão corretas."},"correta":"D","oficial":{},"oficial_extra":["I – Correta. A contratualização com serviços privados deve respeitar princípios constitucionais do SUS e requisitos de legalidade, qualidade e transparência (MS, 2016; CONASEMS, 2021).","II – Correta. A regulação do acesso deve organizar filas com base em critérios clínicos e sociais, priorizando equidade (MS, 2021; CONASS, 2018).","III – Correta. A ampliação da oferta precisa estar articulada à Rede de Atenção à Saúde (RAS), evitando fragmentação e promovendo integralidade (CONASS, 2018).","IV – Incorreta. A avaliação e monitoramento dos contratos é responsabilidade também do gestor municipal e da equipe da APS, não apenas da esfera estadual (CONASEMS, 2021).","V – Correta. O convênio com serviços privados pode ser usado como medida estratégica temporária, mas deve vir acompanhado de esforços para ampliar a capacidade do SUS e reduzir dependência da rede privada (MS, 2016; CONASS, 2018)."],"refs":["Brasil. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. Curso básico de regulação do Sistema Único de Saúde – SUS [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção à Saúde, Departamento de Regulação, Avaliação e Controle de Sistemas. – Brasília: Ministério da Saúde, 2016. 227 p.: il. P 179-225 Acesso em: 07 mai. 2025.","Brasil. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde. Departamento: conhecer e debater sobre os fluxos do sistema de regulação do município. Adquirir capacidade de análise de situação para posterior tomada de decisão. Análise/associações, informações sintetizadas na Matriz SWOT e principais pontos de atenção na regulação do município, sob a ótica de identificar ou não algum ponto crítico passível de intervenção. MANU 18 de Regulação, Avaliação e Controle. Curso I: Regulação de Sistemas de Saúde do SUS: aula 4: Redes de Atenção à Saúde [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção Especializada à Saúde, Departamento de Regulação, Avaliação e Controle – Brasília: Ministério da Saúde, 2021. 40 p. il. Acesso em: 07 maio 2025.","CONASEMS. Manual do(a) gestor(a) municipal do SUS - diálogos no cotidiano, 2.ª edição digital - revisada e ampliada – 2021. 440 p. Disponível em: https://www.conasems.org.br/wp- content/uploads/2021/02/manual_do_gestor_2021_F02-1.pdf. Acesso em: 07 maio 2025. CONSELHO NACIONAL DE SECRETÁRIOS DE SAÚDE (Brasil).","Planificação da atenção à saúde: um instrumento de gestão e organização da atenção primária e da atenção ambulatorial especializada nas redes de atenção à saúde. Brasília: CONASS, 2018. 301 p. (CONASS documenta, 31). Disponível em: https://www.conass.org.br/biblioteca/cadernoconass-documenta-n-31/. Acesso em: 07 maio 2025."],"tema":"Contratualização e RAS","conceito":"Contratar privado é medida COMPLEMENTAR e transitória: enquanto vigora, o gestor municipal monitora, avalia e audita; em paralelo, fortalece a rede pública. Nada disso é atribuição exclusiva do estado.","alt":{"A":"Inclui a IV, que atribui o monitoramento exclusivamente ao gestor estadual — falso, a responsabilidade é compartilhada e o município contratante monitora.","B":"Inclui a IV, falsa.","C":"Inclui a IV, falsa.","D":"CORRETA. I, II, III e V."},"roteiro":[],"takehome":"Palavras como 'exclusiva', 'não é necessária' e 'apenas' são as marcas do item falso nessas listas.","area":"IESC · Gestão privada e empreendedorismo"},{"id":161,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":7}],"enunciado":["(FASA VIC) O município de Santa Esperança, com população em condições socioeconômicas desfavoráveis, enfrentou dificuldades de financiamento durante a vigência do modelo Previne Brasil. Com a implantação do novo modelo de financiamento da Atenção Primária à Saúde (APS), o gestor municipal passou a observar maior previsibilidade nos repasses e a possibilidade de recomposição dos recursos.","Considerando esse cenário e as mudanças promovidas pelo novo modelo de financiamento da APS, assinale a alternativa que apresenta uma diferença relevante em relação ao modelo anterior (Previne Brasil)."],"alternativas":{"A":"Ao contrário do modelo atual, o Previne Brasil previa a recomposição dos valores por equipe, favorecendo municípios com maior cobertura de eSF.","B":"O novo modelo inclui o componente de equidade (fixo), com base no Índice de Vulnerabilidade Social (IVS), enquanto o Previne Brasil utilizava a capitação ponderada, calculada pelo número de pessoas cadastradas.","C":"No modelo anterior, Previne Brasil, o foco era na atuação das equipes de saúde da família (eSF), enquanto o modelo atual , a prioridade recai sobre o indivíduo e o repasse considera o número total de cadastros do município.","D":"O modelo atual extinguiu o financiamento com base na população cadastrada, adotando exclusivamente critérios demográficos gerais para a alocação de recursos."},"correta":"B","oficial":{"D":"Alternativa: O modelo atual extinguiu o financiamento com base na população cadastrada, adotando exclusivamente critérios demográficos gerais para a alocação de recursos. Incorreta. O modelo atual não extinguiu totalmente o critério de cadastro populacional — ele apenas o reorganizou. O foco agora está nas faixas de cadastro por equipe e não mais no total de cadastros por município. Além disso, o critério demográfico não é o único utilizado: o Índice de Vulnerabilidade Social (IVS) do Instituto de Pesquisa Econômica Aplicada (IPEA) passou a ser um componente relevante na classificação dos municípios.","C":"Alternativa: No modelo anterior, Previne Brasil, o foco era na atuação das equipes de saúde da família (eSF), enquanto no modelo atual a prioridade recai sobre o indivíduo e o repasse considera o número total de cadastros do município. Incorreta. Essa alternativa inverte as características dos modelos. O Previne Brasil tinha como foco o indivíduo e o número de cadastros vinculados, enquanto o modelo atual prioriza a atuação das equipes de saúde da família (eSF), com financiamento baseado na estrutura das equipes e em faixas de cadastro.","A":"Alternativa: Ao contrário do modelo atual, o Previne Brasil previa a recomposição dos valores por equipe, favorecendo municípios com maior cobertura de eSF. Incorreta. No modelo atual, os valores podem ser recompostos por equipe, o que valoriza a presença e o trabalho das eSF. Já no Previne Brasil, a recomposição dos valores era feita com base em aumentos no cadastro populacional total do município, o que não necessariamente refletia a atuação das equipes."},"oficial_extra":["Alternativa: O novo modelo inclui o componente de equidade, com base no Índice de Vulnerabilidade Social (IVS), enquanto o Previne Brasil utilizava a capitação ponderada, calculada pelo número de pessoas cadastradas. Correta: Essa alternativa expressa com precisão duas mudanças importantes: o novo modelo introduziu um componente de equidade, o que contribui para maior previsibilidade no repasse dos recursos, e passou a usar o IVS do IPEA para classificar os municípios, enquanto o Previne Brasil utilizava a capitação ponderada, calculada pelo número de pessoas cadastradas."],"refs":["BRASIL. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85-8071-027-4 – capítulos 1 e 2.","BRASIL. Ministério da Saúde. Portaria nº 2.979, de 12 de novembro de 2019. Institui o Programa Previne Brasil. Diário Oficial da União, Brasília, DF, 13 nov. 2019.","BRASIL. Ministério da Saúde. Portaria GM/MS nº 3.493, de 10 de abril de 2024. Dispõe sobre a nova metodologia de cofinanciamento federal do Piso de Atenção Primária à Saúde no âmbito do Sistema Único de Saúde (SUS). Diário Oficial da União, Brasília, DF, 10 abr. 2024.","BRASIL. Ministério da Saúde. A Portaria GM/MS nº 7.799, de 20 de agosto de 2025.Altera a Portaria de Consolidação GM/MS nº 6, de 28 de setembro de 2017, e a Portaria GM/MS nº 3.493, de 10 de abril de 2024, bem como revoga a Portaria GM/MS nº 5.668, de 1º de novembro de 2024, para dispor sobre a metodologia de cofinanciamento federal do Piso de Atenção Primária à Saúde - APS. Diário Oficial da União, Brasília, DF, 10 ago 2025."],"tema":"Novo financiamento da APS — componente de equidade","conceito":"Complementa a questão 146. Duas mudanças-chave: (1) entra um componente FIXO por equipe, com valores diferenciados por EQUIDADE segundo o Índice de Vulnerabilidade Social (IVS/IPEA); (2) sai a dependência da capitação ponderada pelo número de cadastrados como eixo central. O foco se desloca do indivíduo cadastrado para a EQUIPE e o território.","alt":{"A":"Invertida: é o modelo ATUAL que recompõe valores por equipe; o Previne recompunha por cadastro.","B":"CORRETA. Componente de equidade (fixo) com base no IVS no novo modelo, versus capitação ponderada por cadastrados no Previne Brasil.","C":"Inverte de novo: o Previne focava no indivíduo/cadastro; o atual foca na equipe.","D":"Exagera: o cadastro não foi extinto, foi reorganizado em faixas por equipe, e o IVS entrou como critério adicional."},"roteiro":[],"takehome":"Resuma a mudança em uma frase: do 'quantos você cadastrou' para 'quantas equipes você tem e em que território elas atuam'.","area":"IESC · Financiamento da APS"},{"id":162,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":8}],"enunciado":["(FMIT) Durante uma mudança de gestão em um município, o novo secretário de saúde questionou a necessidade de manter o Conselho Municipal de Saúde, alegando que poderia gerir os recursos sem a participação da comunidade.","Considerando o caso acima, analise:","Asserção (A): O Conselho Municipal de Saúde é um espaço deliberativo e permanente, com composição paritária entre usuários, trabalhadores e gestores, sendo essencial para a participação social no SUS.","Razão (R): A Lei nº 8.142/1990 regulamenta a participação da comunidade na gestão do SUS e estabelece que a existência e o funcionamento dos conselhos de saúde são condições obrigatórias para o repasse de recursos do Fundo Nacional de Saúde.","Assinale a alternativa correta."],"alternativas":{"A":"A e R são verdadeiras, e R justifica A.","B":"A é verdadeira, e R é falsa.","C":"A e R são verdadeiras, mas R não justifica A.","D":"A é falsa, e R é verdadeira."},"correta":"A","oficial":{},"oficial_extra":["Asserção (A) é verdadeira.","O Conselho Municipal de Saúde tem caráter deliberativo e permanente, previsto na Lei nº 8.142/1990. Ele deve ter composição paritária (50% de usuários, 25% de trabalhadores da saúde e 25% de gestores/prestadores) e é uma das principais formas de assegurar o controle social no SUS.","Razão (R) é verdadeira.","A Lei nº 8.142/1990 é responsável por regulamentar a participação da comunidade no SUS. Ela determina que os conselhos e conferências de saúde são condições obrigatórias para que estados e municípios recebam recursos do Fundo Nacional de Saúde.","R justifica A.","A asserção descreve a natureza e a função do Conselho de Saúde (espaço deliberativo, permanente e essencial para a participação social).","A Razão explica por que o Conselho tem essa importância e obrigatoriedade, mostrando que sua existência não é facultativa, mas exigida em lei como condição para financiamento do SUS.","Ou seja: o Conselho é deliberativo e essencial porque a lei garante sua existência obrigatória e vinculada ao financiamento federal.","A Lei nº 8.142/1990 garante legalmente a participação social e a obrigatoriedade dos conselhos, justificando a função deliberativa e permanente descrita em A.","Relação entre A e R: A razão explica corretamente a asserção, pois mostra o fundamento legal que obriga a existência e funcionamento dos conselhos, justificando a sua importância para a participação social e gestão do SUS."],"refs":["BRASIL. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85-8071-027-4 – capítulos 1 e 2. Disponível em: https://www.conass.org.br/biblioteca/pdf/A-GESTAO-DO-SUS.pdf. Acesso em: 29 nov. 2024.","BRASIL. Conselho Nacional de Secretários de Saúde. Para entender a gestão do SUS / Conselho Nacional de Secretários de Saúde. - Brasília: CONASS, 2003. 248 p. Capítulos II e III. Disponível em: https://bvsms.saude.gov.br/bvs/publicacoes/para_entender_gestao.pdf. Acesso em: 29 nov. 2024.","BRASIL. Constituição da República Federativa do Brasil, 1988.","BRASIL. Lei nº 8.142, de 28 de dezembro de 1990."],"tema":"Conselho Municipal de Saúde","conceito":"Conselho de Saúde: permanente, DELIBERATIVO, com composição PARITÁRIA — 50% usuários, 25% trabalhadores, 25% gestores e prestadores. A Lei 8.142/1990 condiciona o recebimento de recursos do Fundo Nacional de Saúde à existência de conselho e fundo de saúde, plano de saúde, relatório de gestão, contrapartida orçamentária e comissão de elaboração do plano de carreira. Ou seja: sem conselho, não há repasse — a razão sustenta diretamente a asserção.","alt":{"A":"CORRETA. A e R verdadeiras, e R justifica A: a obrigatoriedade legal e a condição para repasse explicam por que o conselho não pode ser extinto.","B":"R é verdadeira.","C":"R justifica sim: é exatamente o fundamento legal da permanência do conselho.","D":"A é verdadeira."},"roteiro":[],"takehome":"Paridade no conselho é 50/25/25, e é sempre 50% de usuários — número que cai direto. Conferência: a cada 4 anos; conselho: permanente.","area":"IESC · SUS: origens e legislação"},{"id":163,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2025.2","num":9}],"enunciado":["(AFYA Ipatinga) Dona Arlete, 65 anos, com diabetes mellitus há 18 anos, é acompanhada pela Equipe de Saúde da Família de sua UBS de referência. Por ausência no fornecimento de insulina pelo município, permaneceu três semanas sem obtenção regular do medicamento. Além disso, aguarda há três meses consulta com endocrinologista, devido à labilidade glicêmica, porque o município está com falhas na regulação para especialistas. Sem acompanhamento adequado e oportuno, evoluiu com cetoacidose diabética, necessitando de internação de urgência.","Com base na Lei 8.080/90, responda:","a) Quais princípios do SUS (organizativos ou doutrinários) foram fragilizados nesse caso? (0,7 ponto)","b) Proponha duas ações de gestão para garantir o cuidado adequado a essa paciente. (0,8 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Os princípios doutrinários do SUS são universalidade, integralidade da assistência e equidade. Já os princípios organizativos são: descentralização político-administrativa, regionalização e hierarquização da rede de serviços e participação da comunidade.","De acordo com o caso apresentado, percebe-se fragilidade dos seguintes princípios:","Doutrinários:","Integralidade → a paciente não teve acesso ao cuidado de forma contínua e articulada (falta de insulina e demora para atendimento especializado).","Universalidade, um dos princípios doutrinários do SUS, significa que todas as pessoas têm direito ao acesso às ações e serviços de saúde, em todos os níveis de atenção, sem discriminação.","No caso da Dona Arlete:","O direito formal de acesso existe (ela está cadastrada na UBS, acompanhada pela equipe e deveria ter acesso a medicamentos e especialista).","O problema foi na garantia prática desse direito: falhas no fornecimento de insulina e na regulação para o especialista impediram que a universalidade se concretizasse plenamente.","Ou seja: pode-se considerar que houve fragilização da universalidade, porque, embora o SUS assegure o direito a todos, na prática, ela não teve acesso integral e oportuno ao que precisava.","Organizativo:","Hierarquização e regionalização → não houve fluxo efetivo para o nível especializado (endocrinologista), com demora de três meses.","Valor: 0,7 pontos.","2. Ações que poderiam ser implementadas para garantir a continuidade e a integralidade do cuidado a essa paciente seriam:","Garantia de acesso contínuo a medicamentos essenciais.","Fortalecer o planejamento e a logística da Assistência Farmacêutica Municipal (programação,","aquisição e dispensação da insulina), utilizando sistemas como o Hórus e controle de estoque em tempo real.","Criar fluxos de reposição emergencial em caso de desabastecimento, evitando descontinuidade.","Aprimoramento da regulação e do acesso ao especialista.","Implementar protocolos de regulação mais ágeis para condições crônicas descompensadas (como diabetes instável).","Estabelecer linhas de cuidado (doença crônica/diabetes), integrando APS e atenção especializada, com apoio matricial quando não houver endocrinologista suficiente.","Contratação de pessoal para a ampliação da oferta de consultas especializadas.","Valor: 0,8 pontos.","Referência:","Brasil. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85-8071-027-4 – capítulos 1 e 2."],"refs":[],"tema":"Princípios do SUS fragilizados","conceito":"Doutrinários: universalidade, integralidade, equidade. Organizativos: descentralização, regionalização e hierarquização, participação da comunidade (alguns autores incluem resolutividade e complementaridade do privado). O caso mostra falha em ter acesso oportuno ao medicamento e ao especialista.","alt":{},"roteiro":["a) INTEGRALIDADE (doutrinário): o cuidado não foi contínuo nem articulado — faltou insulina e faltou acesso ao especialista, quebrando a assistência em todos os níveis.","UNIVERSALIDADE (doutrinário): o direito formal existia, mas não se concretizou na prática; o acesso oportuno falhou.","REGIONALIZAÇÃO e HIERARQUIZAÇÃO (organizativos): o fluxo entre APS e atenção especializada não funcionou — três meses de espera com doença descompensada.","Pode-se citar ainda a resolutividade e a fragilidade da assistência farmacêutica como eixo transversal.","b) Ação 1 — Assistência farmacêutica: fortalecer programação, aquisição e logística (previsão de consumo, estoque mínimo, sistema Hórus, controle em tempo real) e criar fluxo de reposição emergencial para evitar desabastecimento de medicamento essencial.","Ação 2 — Regulação e integração da rede: protocolos de regulação com priorização por risco clínico (diabetes lábil descompensada como prioridade), linha de cuidado do diabetes integrando APS e especializada, apoio matricial/telessaúde com endocrinologia e ampliação da oferta de consultas.","Pode-se acrescentar: busca ativa pela equipe, plano de autocuidado e monitoramento por indicadores."],"takehome":"Nomeie o princípio E explique por que ele foi ferido no caso concreto — respostas que só listam princípios perdem metade da nota.","area":"IESC · SUS: origens e legislação"},{"id":164,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2025.2","num":10}],"enunciado":["(FACIMPA) Dona Maria, 58 anos, hipertensa e diabética, procura a UBS de seu bairro, mas encontra dificuldade em marcar consulta de retorno, enfrenta longas filas de espera e percebe falta de integração entre os profissionais que a acompanham. Além disso, a comunidade tem feito críticas à demora nos atendimentos e à desorganização do serviço.","Considerando os princípios da gestão em saúde, descreva estratégias que podem ser adotadas para melhorar o gerenciamento dessa UBS e explique a importância dessas medidas para tornar o serviço mais eficiente e resolutivo. (1,5 pontos)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Para melhorar a gestão da UBS, é essencial adotar estratégias que integrem as ações clínicas e administrativas, otimizem processos e melhorem a satisfação dos usuários (1,5).","1. Integração das Ações Clínicas e Administrativas: Melhorar a comunicação entre setores, utilizar o Prontuário Eletrônico do Cidadão (PEC) e implementar fluxos organizados para otimizar o atendimento. 2. Uso de Ferramentas de Gestão: Aplicar indicadores de desempenho, mapeamento de processos e Ciclo PDCA para monitorar e aperfeiçoar os serviços (por ex.: Cobertura vacinal → verificar se a equipe está atingindo as metas de imunização da comunidade, observar ou Processo de encaminhamento para especialidades → permite verificar onde ocorrem atrasos (ex.: demora na regulação). 3. Capacitação da equipe: Oferecer treinamentos regulares, reuniões de equipe e supervisão para melhorar a qualidade do atendimento e o engajamento dos profissionais. 4. Foco na Qualidade e Satisfação do Paciente: Criar canais de escuta, reduzir tempo de espera e fortalecer o vínculo com a comunidade para garantir um serviço mais humanizado e resolutivo.","Com essas estratégias, a UBS se torna mais eficiente, organizada e centrada no usuário, melhorando a assistência à população."],"refs":["LOCH, S. et al. Gestão da Unidade de Saúde. In: GUSSO, Gustavo. et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2.ª ed. Grupo A, 2019. Cap. 46. Disponível em: Minha Biblioteca. Acesso em: 29 nov. 2024.","GUSSO, G. NETO, P.P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2.ª ed. Grupo A, 2019. Cap. 25. Disponível em: Minha Biblioteca. Acesso em: 29 nov. 2024."],"tema":"Gestão da UBS — estratégias","conceito":"Mesmo eixo das questões 135 e 154. Os três problemas do caso (dificuldade de marcação, fila, falta de integração) mapeiam diretamente para três soluções: organização da agenda/acolhimento, ferramentas de gestão e trabalho em equipe.","alt":{},"roteiro":["1) Integração clínica e administrativa: prontuário eletrônico (PEC/e-SUS), fluxos definidos de acolhimento e encaminhamento, comunicação entre setores, reunião de equipe semanal.","2) Organização do acesso: acolhimento com classificação de risco, agenda mista (programada + demanda espontânea), agendamento de retorno já na saída da consulta, busca ativa dos faltosos — ataca a fila e a dificuldade de marcar retorno.","3) Ferramentas de gestão: indicadores (tempo de espera, absenteísmo, cobertura vacinal, controle de HAS/DM), mapeamento de processos e ciclo PDCA para testar e corrigir mudanças.","4) Educação permanente e capacitação: treinamentos, supervisão, discussão de casos — melhora qualidade e engajamento.","5) Qualidade e satisfação: canais de escuta e ouvidoria, conselho local de saúde, comunicação clara com a comunidade, humanização do atendimento.","Importância: reduz espera e retrabalho, aumenta resolutividade e adesão, fortalece o vínculo e a confiança da população no serviço, e diminui a procura desnecessária pela urgência."],"takehome":"Estruture a resposta em 'problema do enunciado → estratégia → por que funciona'. É o formato que a banca pontua.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":165,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":1}],"enunciado":["(AFYA PARAÍBA) Em uma Unidade Básica de Saúde (UBS), a gerência identifica entraves críticos no processo de trabalho: a enfermeira relata sobrecarga no acolhimento; o médico demonstra resistência em realizar o pré-natal de baixo risco, alegando preferência das usuárias por outro profissional; e o dentista apresenta atrasos sistemáticos devido à incompatibilidade entre a agenda oficial e o fluxo espontâneo da comunidade local.","Considerando as diretrizes de Gestão Participativa e Organização do Trabalho previstas na Política Nacional de Atenção Básica (PNAB), assinale a alternativa que apresenta a estratégia de gestão mais adequada para o caso."],"alternativas":{"A":"Centralizar o planejamento da agenda na gerência da unidade, estabelecendo horários fixos e inflexíveis para cada categoria profissional, visando eliminar as variações de fluxo causadas pela demanda espontânea local.","B":"Remanejar as competências clínicas entre os profissionais de acordo com as afinidades individuais relatadas, priorizando a satisfação da equipe como estratégia principal para a manutenção do clima organizacional da UBS.","C":"Implementar o monitoramento individual de produtividade e o cumprimento estrito das atribuições previstas no contrato de trabalho, utilizando o regimento interno para a aplicação imediata de sanções administrativas.","D":"Instituir espaços de gestão colegiada para a análise coletiva dos processos de trabalho, utilizando a mediação de conflitos e a educação permanente para pactuar as atribuições das categorias e o fluxo de acesso."},"correta":"D","oficial":{"D":"Alternativa: Instituir espaços de gestão colegiada para a análise coletiva dos processos de trabalho, utilizando a mediação de conflitos e a educação permanente para pactuar as atribuições das categorias e o fluxo de acesso.","C":"Alternativa: Implementar o monitoramento individual de produtividade e o cumprimento estrito das atribuições previstas no contrato de trabalho, utilizando o regimento interno para a aplicação imediata de sanções administrativas.","A":"Alternativa: Centralizar o planejamento da agenda na gerência da unidade, estabelecendo horários fixos e inflexíveis para cada categoria profissional, visando eliminar as variações de fluxo causadas pela demanda espontânea local.","B":"Alternativa: Remanejar as competências clínicas entre os profissionais de acordo com as afinidades individuais relatadas, priorizando a satisfação da equipe como estratégia principal para a manutenção do clima organizacional da UBS."},"oficial_extra":["Resposta Comentada (Correta): Esta opção fundamenta-se nos princípios da Gestão Participativa e da Educação Permanente em Saúde (EPS), conforme a PNAB (2017). O gerenciamento de conflitos na APS deve ocorrer de forma coletiva (colegiados), em que as resistências individuais e a sobrecarga de trabalho são analisadas como problemas do processo de trabalho da equipe. A pactuação de atribuições garante que as normas legais (como a obrigatoriedade do pré-natal pelo médico) sejam cumpridas por meio do entendimento mútuo e da reorganização dos fluxos de acesso.","Resposta Comentada (Incorreta): Embora o monitoramento seja necessário, a aplicação de sanções imediatas sem a análise prévia dos nós críticos do processo de trabalho contraria a diretriz de Cogestão e Humanização. O foco exclusivo na \"gestão punitiva\" não resolve causas estruturais (como a sobrecarga da enfermeira ou a inadequação da agenda do dentista), tendendo a piorar o clima organizacional e a aumentar o absenteísmo e a rotatividade de profissionais na UBS.","Resposta Comentada (Incorreta): Esta alternativa fere o princípio da Acessibilidade e Equidade. A PNAB orienta que a organização da agenda deve ser flexível para acolher a demanda espontânea e as especificidades do território. Impor rigidez e centralização na gerência ignora a realidade epidemiológica e social da população (citada no caso do dentista), criando barreiras de acesso e ineficiência no uso dos recursos da unidade.","Resposta Comentada (Incorreta): Esta opção comete o erro técnico de confundir \"clima organizacional\" com \"abdicação de atribuições profissionais\". O médico de família e comunidade possui a atribuição normativa de realizar o pré-natal de baixo risco. Permitir a recusa por \"preferência individual\" sobrecarrega outras categorias, descaracteriza a equipe multiprofissional e compromete a integralidade do cuidado ao usuário, ferindo as normas de responsabilidade técnica das profissões de saúde."],"refs":["BRASIL. Ministério da Saúde. Política Nacional de Atenção Básica (PNAB). Brasília: Ministério da Saúde, 2017.","GUSSO, G. NETO, P. P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2.ª ed. Grupo A, 2019. Cap. 25."],"tema":"Gestão participativa na PNAB","conceito":"Os três problemas do caso são de PROCESSO DE TRABALHO, não de caráter individual: sobrecarga no acolhimento, recusa a uma atribuição legal (o pré-natal de baixo risco é atribuição do médico da eSF) e incompatibilidade entre agenda e fluxo real da comunidade. A PNAB responde com gestão colegiada, educação permanente e pactuação coletiva.","alt":{"A":"Centralizar e engessar a agenda ignora a demanda espontânea, que é característica da APS, e exclui a equipe da decisão.","B":"Distribuir atribuições por 'afinidade' fere atribuições legais e normativas — o pré-natal de baixo risco não é opcional.","C":"Monitoramento individual com sanção imediata trata sintoma e destrói o clima organizacional.","D":"CORRETA. Gestão colegiada, análise coletiva do processo de trabalho, mediação de conflitos e educação permanente para pactuar atribuições e fluxos."},"roteiro":[],"takehome":"Na PNAB, problema de equipe se resolve em colegiado. Sanção e centralização nunca são a resposta certa.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":166,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":2}],"enunciado":["(AFYA PALMAS) Durante uma reunião de Colegiado Gestor, o Secretário Municipal de Saúde de um município de pequeno porte expressa preocupação com a sustentabilidade financeira das 10 Equipes de Saúde da Família (eSF) locais. Ele relata que, no modelo de financiamento anterior (Previne Brasil), o repasse mensal sofria variações bruscas devido à flutuação no cadastro de usuários e à dificuldade de manter o alcance de 100% dos indicadores de desempenho em todos os meses, gerando insegurança no pagamento da folha salarial. O gestor solicita que a equipe de planejamento analise como a transição para a metodologia instituída pela Portaria GM/MS n.º 3.493/2024 e detalhada pelo FAQ/SAPS 2025 impactará a previsibilidade orçamentária do município.","Com base no cenário apresentado e nas regras de cofinanciamento vigentes, a análise técnica deve indicar que:"],"alternativas":{"A":"o impacto orçamentário será negativo, pois o novo modelo extinguiu o valor fixo por equipe, condicionando a totalidade do repasse federal ao alcance de metas de produtividade e ao número de consultas médicas registradas (pagamento por produção).","B":"a estabilidade mencionada só será alcançada se o município optar pelo modelo de \"Piso de Atenção Básica Fixo\" (PAB Fixo), que é a única modalidade prevista na Portaria para municípios com menos de 20 mil habitantes, desvinculando o recurso da existência de equipes.","C":"a nova metodologia favorece a estabilidade financeira do município ao instituir um Componente Fixo por Equipe, que independe da volatilidade mensal do cadastro, somado ao Vínculo Territorial, que protege o custeio básico das eSF implantadas.","D":"a insegurança financeira persistirá, uma vez que a Portaria 3.493/2024 manteve a \"Capitação Ponderada\" como critério único de transferência, penalizando municípios que possuam população com perfil demográfico jovem e baixa vulnerabilidade social."},"correta":"C","oficial":{"C":"Alternativa (correta): A nova metodologia favorece a estabilidade financeira do município ao instituir um Componente Fixo por Equipe, que independe da volatilidade mensal do cadastro, somado ao Vínculo Territorial, que protege o custeio básico das eSF implantadas.","A":"Alternativa (incorreta): O impacto orçamentário será negativo, pois o novo modelo extinguiu o valor fixo por equipe, condicionando a totalidade do repasse federal ao alcance de metas de produtividade e ao número de consultas médicas registradas (pagamento por produção).","D":"Alternativa (incorreta): A insegurança financeira persistirá, uma vez que a Portaria 3.493/2024 manteve a \"Capitação Ponderada\" como critério único de transferência, penalizando municípios que possuam população com perfil demográfico jovem e baixa vulnerabilidade social.","B":"Alternativa (incorreta): A estabilidade mencionada só será alcançada se o município optar pelo modelo de \"Piso de Atenção Básica Fixo\" (PAB Fixo), que é a única modalidade prevista na Portaria para municípios com menos de 20 mil habitantes, desvinculando o recurso da existência de equipes."},"oficial_extra":["A mudança fundamental da Portaria 3.493/2024 foi justamente a criação de um valor fixo por equipe (eSF, eAP, eSB e eMulti). Isso garante que, se a equipe existe e está cadastrada no SCNES, o recurso base está garantido, resolvendo o problema de \"insegurança\" relatado no texto-base. O Vínculo Territorial complementa esse valor com base na população sob responsabilidade.","O modelo atual fez exatamente o oposto: ele criou o componente fixo e não adota o pagamento por produção (fee-for-service).","O termo \"Capitação Ponderada\" e seus pesos socioeconômicos e demográficos (fórmulas complexas do Previne Brasil) foram substituídos pela nova lógica de Valor Fixo + Vínculo Territorial.","O PAB Fixo é um modelo extinto há anos. O FAQ/SAPS (2025) deixa claro que o financiamento atual é vinculado às equipes e ao território, sem distinção de modalidade \"fixa populacional\" por tamanho de município."],"refs":["BRASIL. PORTARIA GM/MS Nº 3.493, DE 10 DE ABRIL DE 2024. Disponível em: https://bvsms.saude.gov.br/bvs/saudelegis/gm/2024/prt3493_11_04_2024.html. Acesso em: 22 out. 2025.","BRASIL. Ministério da Saúde. Secretaria de Atenção Primária à Saúde. Coordenação- Geral de Programação de Financiamento da Atenção Primária. Novo Modelo de Cofinanciamento Federal da APS: FAQ [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção Primária à Saúde. Coordenação-Geral de Programação de Financiamento da Atenção Primária. – Brasília: Ministério da Saúde, 2025. 16 p.: il. Disponível em: https://bvsms.saude.gov.br/bvs/publicacoes/novo_modelo_cofinanciamento_federal_f aq.pdf. Acesso em: 22 out. 2025."],"tema":"Portaria 3.493/2024 — previsibilidade orçamentária","conceito":"Terceira questão do banco sobre o novo financiamento (ver 146 e 161). A mensagem central: o componente FIXO por equipe garante o custeio desde que a equipe exista e esteja cadastrada no SCNES, independentemente da flutuação mensal de cadastro e do alcance de indicadores. O vínculo e acompanhamento territorial complementa com base na população sob responsabilidade.","alt":{"A":"Faz o oposto do que a portaria fez: ela CRIOU o componente fixo e não adotou pagamento por produção.","B":"O PAB Fixo é o modelo ANTIGO (pré-Previne) e não é 'a única modalidade' para pequenos municípios.","C":"CORRETA. Componente fixo por equipe + vínculo territorial = previsibilidade e proteção do custeio.","D":"A capitação ponderada deixou de ser o critério único; o modelo passou a ser multicomponente."},"roteiro":[],"takehome":"Se a equipe existe e está no SCNES, o recurso base está garantido — essa é a frase que resume a mudança de 2024.","area":"IESC · Financiamento da APS"},{"id":167,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":3}],"enunciado":["(AFYA ARAGUAÍNA) A gestão municipal de saúde, ao organizar o planejamento de uma Unidade Básica de Saúde (UBS), deve pautar-se pelo Sistema de Planejamento do SUS (PlanejaSUS). Este sistema visa articular o planejamento nas três esferas de governo, garantindo que as metas e ações locais estejam em consonância com as diretrizes orçamentárias e as necessidades epidemiológicas da população.","Com base na Lei Complementar n.º 141/2012 e no Decreto n.º 7.508/2011, que dispõem sobre o planejamento da saúde e a transparência na gestão do SUS, são considerados instrumentos obrigatórios de planejamento e gestão:","I. Plano de Saúde (PS).","II. Programação Anual de Saúde (PAS).","III. Relatório Detalhado do Quadrimestre Anterior (RDQA) e Relatório Anterior de Gestão (RAG).","IV. Contrato Organizativo de Ação Pública da Saúde (COAP).","Assinale a alternativa correta."],"alternativas":{"A":"Apenas os itens I e II estão corretos.","B":"Apenas os itens I, II, III e IV estão corretos.","C":"Apenas os itens II, III e IV estão corretos.","D":"Apenas os itens I, II e III estão corretos."},"correta":"B","oficial":{},"oficial_extra":["Item I – Plano de Saúde (PS): Correto. É o instrumento de gestão fundamental que estabelece as diretrizes, objetivos e metas para um período de quatro anos. Sua obrigatoriedade e função estão previstas na Lei n.º 8.142/1990 e detalhadas na Portaria de Consolidação n.º 1/2017. É a base para a execução e o acompanhamento das ações de saúde em qualquer nível de gestão (Municipal, Estadual ou Federal).","Item II – Programação Anual de Saúde (PAS): Correto. Trata-se do instrumento que operacionaliza as intenções do Plano de Saúde. A PAS identifica as ações que serão realizadas em cada ano, define as metas anuais e prevê a alocação dos recursos financeiros. Conforme a Lei Complementar n.º 141/2012, a PAS é essencial para garantir a transparência e a aplicação mínima de recursos em saúde.","Item III – Relatório Detalhado do Quadrimestre Anterior (RDQA) e Relatório Anterior de Gestão (RAG): Correto. O RDQA é uma ferramenta de monitoramento apresentada ao Conselho de Saúde e ao Poder Legislativo a cada quatro meses (conforme o Art. 36 da LC 141/2012). O RAG é o instrumento de comprovação anual de que a PAS foi executada, apresentando os resultados alcançados e eventuais desvios. Ambos são pilares do controle social e da fiscalização orçamentária.","Item IV – Contrato Organizativo de Ação Pública da Saúde (COAP): Correto. Introduzido pelo Decreto n.º 7.508/2011, o COAP é o acordo de colaboração firmado entre entes federativos (Municípios, Estados e União) para organizar a rede de atenção à saúde. Ele define responsabilidades, indicadores e metas de desempenho, sendo um instrumento formal de planejamento regionalizado no SUS."],"refs":["BRASIL. Ministério da Saúde. Secretaria de Gestão. Instrumentos de Planejamento e Gestão no SUS. Brasília: Ministério da Saúde, 2014.","CONASS. Conselho Nacional das Secretarias de Saúde. Capítulo 2: \"Instrumentos de Planejamento e Gestão\". In: Relatório de Gestão do SUS. Brasília: CONASS, 2020.","PAIM, J. et al. Sistemas de Saúde no Brasil. Rio de Janeiro: Fiocruz, 2011.","BRASIL. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85- 8071-027-4 – capítulo 2. Disponível em: https://www.conass.org.br/biblioteca/pdf/A- GESTAO-DO-SUS.pdf. Acesso em: 22 out. 2025."],"tema":"Instrumentos obrigatórios — LC 141/2012 e Decreto 7.508/2011","conceito":"Cuidado: esta questão é mais ampla que a 159. Além do trio Plano/PAS/RAG, a Lei Complementar 141/2012 tornou obrigatório o Relatório Detalhado do Quadrimestre Anterior (RDQA), apresentado em audiência pública até o fim dos meses de maio, setembro e fevereiro; e o Decreto 7.508/2011 instituiu o COAP (Contrato Organizativo da Ação Pública da Saúde), acordo entre os entes para organizar a região de saúde.","alt":{"A":"Incompleta: deixa de fora RDQA e COAP.","B":"CORRETA. I, II, III e IV — o enunciado ancora justamente na LC 141/2012 (RDQA) e no Decreto 7.508/2011 (COAP).","C":"Omite o Plano de Saúde, que é a base de tudo.","D":"Omite o COAP, previsto no Decreto 7.508/2011 citado no enunciado."},"roteiro":[],"takehome":"Compare 159 e 167: a resposta muda conforme a norma citada no enunciado. Leia qual legislação a questão está usando antes de escolher.","area":"IESC · Planejamento e gestão no SUS"},{"id":168,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":4}],"enunciado":["(AFYA SANTA INÊS) Um médico recém-formado planeja a abertura de um consultório particular. Com base no modelo de gestão e empreendedorismo em saúde discutido por Terrim et al. (2015), o sucesso da iniciativa depende de um planejamento estruturado que minimize riscos financeiros e operacionais.","Avalie as etapas propostas para a viabilização deste empreendimento:","I. Realizar a análise de mercado para identificar a segmentação de clientes e o posicionamento da concorrência local.","II. Elaborar o Plano de Negócios integrando a análise de viabilidade econômico- financeira e o desenho dos processos operacionais.","III. Priorizar o investimento em ativos fixos tangíveis (equipamentos de alta tecnologia) como estratégia primária de diferenciação, independentemente do ponto de equilíbrio (break-even) projetado.","IV. Definir a Proposta de Valor e as estratégias de marketing de serviços visando à captação e à fidelização ética de pacientes.","V. Delegar o planejamento estratégico e a definição da missão organizacional exclusivamente à equipe multiprofissional após a inauguração.","Quais dessas etapas são consideradas essenciais e tecnicamente adequadas para a gestão inicial do consultório?"],"alternativas":{"A":"Apenas I, III e V.","B":"Apenas I, II e IV.","C":"Apenas II, III e IV.","D":"Apenas I, II e V."},"correta":"B","oficial":{},"oficial_extra":["I. Análise de Mercado: Correta.","Conforme Terrim et al. (2015), o empreendedorismo em saúde exige o entendimento do cenário externo. Identificar a \"segmentação\" (quem é o público) e o \"posicionamento\" (como se diferenciar da concorrência) é o primeiro passo para evitar a ociosidade do serviço.","II. Plano de Negócios: Correta.","O Plano de Negócios é o mapa do empreendimento. Incluir a \"viabilidade econômico-financeira\" (custos, projeção de lucro) e o \"desenho de processos\" (como o serviço será entregue) é essencial para a sustentabilidade do consultório a curto e longo prazo.","III. Priorizar Ativos Fixos Tangíveis: Incorreta.","Um erro clássico no empreendedorismo médico é investir alto em equipamentos (ativos tangíveis) antes de conhecer o \"ponto de equilíbrio\" (break-even point). Segundo a literatura de gestão, o investimento deve ser escalonado e justificado pela demanda prevista, sob risco de insolvência financeira precoce.","IV. Proposta de Valor e Marketing: Correta.","O marketing em saúde, quando ético, é uma ferramenta de gestão necessária para comunicar o diferencial do médico ao público-alvo. A \"Proposta de Valor\" define por que o paciente escolheria aquele consultório em vez de outro, sendo vital para a fidelização.","V. Delegar Planejamento e Missão: Incorreta.","A definição da Missão, Visão e Valores, bem como o Planejamento Estratégico, são competências do gestor/proprietário. Embora a equipe participe da execução, delegar a \"identidade organizacional\" exclusivamente a terceiros e somente após a inauguração indica falta de liderança e ausência de diretriz estratégica inicial."],"refs":["CONSELHO FEDERAL DE MEDICINA (CFM). Manual de Procedimentos Administrativos: Pessoa Jurídica. Brasília: CFM, 2022. Disponível em: https://portal.cfm.org.br/images/mpa_pj.pdf. Acesso em: 07 maio 2025.","MORELLE, Alessandra et al. O Novo Mind7 Médico: empreendedorismo e transformação digital na saúde. Porto Alegre: Grupo A, 2022. (Série Minha Biblioteca).","TERRIM, S.; MELO, A.; JÁCOMO, A. Empreendedorismo em saúde: relato de um modelo de empresa júnior em Medicina. Revista de Medicina, São Paulo, v. 94, n. 2, p. 94-98, 2015. DOI: https://doi.org/10.11606/issn.1679-9836.v94i2p94-98. Acesso em: 22 out. 2025."],"tema":"Empreendedorismo — etapas adequadas","conceito":"Quarta questão do banco sobre abertura de consultório. Aqui há dois itens claramente errados, o que facilita: investir em equipamento caro ignorando o ponto de equilíbrio, e delegar o planejamento estratégico para depois da inauguração.","alt":{"A":"Inclui III e V, ambos errados.","B":"CORRETA. I (análise de mercado), II (plano de negócios com viabilidade econômico-financeira e desenho de processos) e IV (proposta de valor e marketing ético).","C":"Inclui III, que ignora o break-even.","D":"Inclui V, que adia o planejamento estratégico para depois da abertura."},"roteiro":[],"takehome":"Nas quatro questões de empreendedorismo do banco, o padrão é o mesmo: planejar antes de gastar, e planejamento estratégico é do dono, desde o início.","area":"IESC · Gestão privada e empreendedorismo"},{"id":169,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":5}],"enunciado":["(AFYA REDENÇÃO) Um município de médio porte apresenta um gargalo assistencial em exames de imagem, com filas de espera que comprometem o diagnóstico tempestivo. A Secretaria Municipal de Saúde planeja a contratação de serviços da iniciativa privada para suprir essa demanda de forma complementar. Considerando as diretrizes do Curso Básico de Regulação do SUS (MS, 2016) e o Manual do Gestor (CONASEMS, 2021), analise as assertivas abaixo:","I. A participação complementar da iniciativa privada deve ser formalizada mediante contrato de direito público ou convênio, observando-se a necessidade de chamamento público para garantir a isonomia e a transparência no processo de credenciamento.","II. Para otimizar a fila de espera, a classificação de prioridade clínica e o agendamento podem ser delegados ao prestador privado contratado, desde que este siga os protocolos de Manchester ou similares.","III. A regulação do acesso aos serviços contratados deve ser exercida pela autoridade pública, sendo a Central de Regulação o órgão responsável por ordenar o fluxo assistencial com base em critérios de equidade e necessidade.","IV. Na organização da rede, o gestor deve dar preferência a entidades filantrópicas e sem fins lucrativos para a contratação complementar, mantendo o controle e a avaliação sobre a qualidade dos serviços prestados.","É correto o que se afirma apenas em:"],"alternativas":{"A":"II e IV.","B":"I, III e IV.","C":"I, II e III.","D":"I e III, apenas."},"correta":"B","oficial":{},"oficial_extra":["Assertiva I (Correta): Baseada na Lei 8.080/90 e nos manuais do CONASEMS. O chamamento público garante que todos os prestadores aptos possam participar, evitando o favorecimento ilícito.","Assertiva II (Incorreta): De acordo com o Curso de Regulação do MS (2016), a regulação assistencial é uma função de governo. Delegar a classificação de prioridade ao privado fere a autonomia pública e abre margem para que o prestador direcione a fila por interesses próprios.","Assertiva III (Correta): A regulação é o \"filtro\" da equidade. Sem o controle da Central de Regulação sobre o prestador conveniado, perde-se a capacidade de planejar a rede e de garantir que o paciente mais grave seja atendido primeiro.","Assertiva IV (Correta): É o preceito constitucional (Art. 199) e legal. As entidades filantrópicas possuem natureza jurídica que as torna parceiras prioritárias na execução de serviços de saúde no SUS."],"refs":["BRASIL. Ministério da Saúde. Curso básico de regulação do Sistema Único de Saúde – SUS. Brasília: Ministério da Saúde, 2016.","CONASEMS. Manual do(a) gestor(a) municipal do SUS. 2. ed. Brasília: CONASEMS, 2021.","CONASS. Planificação da atenção à saúde. Brasília: CONASS, 2018."],"tema":"Regulação e contratualização do privado","conceito":"A regulação assistencial é FUNÇÃO DE GOVERNO e não se delega ao prestador — quem ordena a fila é a Central de Regulação, com critério clínico e de equidade. A contratação complementar exige contrato de direito público ou convênio, com chamamento público, e tem preferência para entidades filantrópicas e sem fins lucrativos (CF, art. 199).","alt":{"A":"Inclui a II, que delega a classificação de prioridade ao prestador privado — conflito de interesse e perda da autonomia pública.","B":"CORRETA. I, III e IV.","C":"Inclui a II, falsa.","D":"Omite a IV, que está correta (preferência para filantrópicas)."},"roteiro":[],"takehome":"Quem contrata regula; quem é contratado executa. Delegar a fila ao prestador é sempre item falso.","area":"IESC · Gestão privada e empreendedorismo"},{"id":170,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":6}],"enunciado":["(AFYA GUANAMBI) Um paciente de 65 anos com DPOC e hipertensão apresenta um histórico de \"porta giratória\" em unidades de Pronto Atendimento devido a exacerbações evitáveis. A equipe de saúde da família, ao aplicar a metodologia do PlanificaSUS, identifica que a fragmentação entre a Atenção Primária e a Rede de Atenção às Urgências (RUE) compromete a estabilização clínica do usuário e sobrecarrega os leitos hospitalares.","Considerando as diretrizes de integração de rede previstas no Manual do Gestor (CONASEMS, 2021) e na Planificação da Atenção (CONASS, 2018), a estratégia prioritária para articular esses pontos de atenção deve ser:"],"alternativas":{"A":"a transferência da coordenação do cuidado crônico para as unidades de Pronto Atendimento, visando centralizar o manejo medicamentoso e o monitoramento epidemiológico em pontos de atenção 24 horas.","B":"a implementação da gestão de casos para pacientes de alto risco, utilizando o plano de cuidado como instrumento de comunicação entre a UBS e a urgência para evitar reinternações desnecessárias.","C":"estabelecimento de protocolos de triagem administrativa que impeçam o atendimento desse perfil de paciente em unidades de urgência, condicionando o cuidado exclusivamente ao agendamento prévio na UBS.","D":"a marcação compulsória de consultas com especialistas focais como única via de redução de demanda na urgência, desonerando a APS da responsabilidade de monitorar as exacerbações clínicas no território."},"correta":"B","oficial":{"B":"Alternativa (correta): A implementação da gestão de casos para pacientes de alto risco, utilizando o plano de cuidado como instrumento de comunicação entre a UBS e a urgência para evitar reinternações desnecessárias.","C":"Alternativa (incorreta): O estabelecimento de protocolos de triagem administrativa que impeçam o atendimento desse perfil de paciente em unidades de urgência, condicionando o cuidado exclusivamente ao agendamento prévio na UBS.","A":"Alternativa (incorreta): A transferência da coordenação do cuidado crônico para as unidades de pronto atendimento, visando centralizar o manejo medicamentoso e o monitoramento epidemiológico em pontos de atenção 24 horas.","D":"Alternativa (incorreta): A marcação compulsória de consultas com especialistas focais como única via de redução de demanda na urgência, desonerando a APS da responsabilidade de monitorar as exacerbações clínicas no território."},"oficial_extra":["Está em total consonância com o CONASS (2018). A Planificação busca organizar a rede para que a APS coordene o cuidado de modo a reduzir exacerbações que geram idas à urgência A gestão de casos e o compartilhamento de informações (plano de cuidado) são essenciais para essa integração.","Fere o princípio da Universalidade. Conforme o CONASEMS (2021), nenhuma unidade de urgência pode negar atendimento com base em critérios administrativos de \"falta de agendamento\".","Contraria a PNAB (2017) e o Manual do Gestor. A urgência é um ponto de atenção pontual; a coordenação e o monitoramento longitudinal são competências exclusivas da APS.","Representa a visão fragmentada que o PlanificaSUS visa superar. O especialista é um apoio matricial, mas a responsabilidade pelo monitoramento no território permanece com a APS."],"refs":["CONASEMS. Manual do(a) gestor(a) municipal do SUS. 2. ed. Brasília: CONASEMS, 2021.","CONASS. Planificação da atenção à saúde: um instrumento de gestão e organização. Brasília: CONASS, 2018. (CONASS documenta, 31).","BRASIL. Ministério da Saúde. Curso I: Regulação de Sistemas de Saúde do SUS: aula 4: Redes de Atenção à Saúde. Brasília: MS, 2021."],"tema":"Integração APS–urgência (gestão de casos)","conceito":"O fenômeno da 'porta giratória' é indicador de falha de coordenação. A resposta da Planificação da Atenção é a GESTÃO DE CASOS: para os usuários de alto risco, designa-se um profissional responsável, constrói-se um plano de cuidado compartilhado e garante-se comunicação entre a UBS e os demais pontos — inclusive contato pós-alta e busca ativa.","alt":{"A":"A urgência é ponto de atenção pontual; ela não coordena cuidado longitudinal.","B":"CORRETA. Gestão de casos para alto risco, com o plano de cuidado como instrumento de comunicação entre UBS e urgência.","C":"Barrar atendimento na urgência por critério administrativo fere a universalidade — nenhuma unidade de urgência pode negar atendimento.","D":"Marcação compulsória com especialista não substitui a coordenação pela APS e desonera indevidamente a equipe do território."},"roteiro":[],"takehome":"Contra reinternação evitável: estratificar, nomear um responsável, escrever o plano de cuidado e fazer contato pós-alta.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":171,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":7}],"enunciado":["(AFYA PORTO NACIONAL) Um paciente de 62 anos dá entrada em uma Unidade de Pronto Atendimento (UPA) com quadro de Infarto Agudo do Miocárdio (IAM) em evolução. Após a estabilização inicial, a equipe médica identifica a necessidade imediata de transferência para um leito de UTI coronariana e realização de cineangiocoronariografia. A família informa que o paciente possui plano de saúde de abrangência nacional, mas solicita que a transferência seja feita para o hospital público de referência regional, alegando confiança na rede pública e proximidade da residência.","Considerando as diretrizes do Manual do Gestor (CONASEMS, 2021) e o fluxo de Regulação de Urgência e Emergência (MS, 2016), a análise técnica da conduta correta indica que:"],"alternativas":{"A":"o paciente deve ser inserido na Central de Regulação de Urgência, garantindo a vaga em prestador público ou conveniado conforme a prioridade clínica (vaga zero), independentemente da cobertura suplementar, assegurando o direito universal ao atendimento de emergência.","B":"a transferência deve ser aprovada apenas se o paciente for classificado como \"risco baixo\", reservando-se as vagas de UTI e procedimentos de alta complexidade do SUS exclusivamente para usuários que não possuam registro ativo na Agência Nacional de Saúde.","C":"a solicitação de leito via SUS deve ser condicionada à apresentação de termo de renúncia ao plano de saúde privado, visando evitar o uso de recursos públicos por cidadãos com contrato de assistência particular, garantindo a reserva de leitos para os usuários dependentes.","D":"a inserção no sistema de regulação pública deve ser negada, orientando-se a família a realizar o transporte via ambulância do plano de saúde, uma vez que o SUS é legalmente impedido de regular leitos de alta complexidade para beneficiários da rede suplementar."},"correta":"A","oficial":{"A":"Alternativa (correta): O paciente deve ser inserido na Central de Regulação de Urgência, garantindo a vaga em prestador público ou conveniado conforme a prioridade clínica (vaga zero), independentemente da cobertura suplementar, assegurando o direito universal ao atendimento de emergência.","C":"Alternativa (incorreta): A solicitação de leito via SUS deve ser condicionada à apresentação de termo de renúncia ao plano de saúde privado, visando evitar o uso de recursos públicos por cidadãos com contrato de assistência particular, garantindo a reserva de leitos para os usuários dependentes.","D":"Alternativa (incorreta): A inserção no sistema de regulação pública deve ser negada, orientando-se a família a realizar o transporte via ambulância do plano de saúde, uma vez que o SUS é legalmente impedido de regular leitos de alta complexidade para beneficiários da rede suplementar.","B":"Alternativa (incorreta): A transferência deve ser aprovada apenas se o paciente for classificado como \"risco baixo\", reservando-se as vagas de UTI e procedimentos de alta complexidade do SUS exclusivamente para usuários que não possuam registro ativo na Agência Nacional de Saúde."},"oficial_extra":["Atende aos princípios da Universalidade e Equidade. Conforme o Manual do Gestor (CONASEMS, 2021), o acesso às urgências é direito de todo cidadão. A regulação baseia-se na Gravidade Clínica (Prioridade Zero). A posse de plano não impede o acesso; a cobrança posterior (ressarcimento ao SUS) é um trâmite entre Estado e operadora que não deve barrar o atendimento.","Exigir \"termo de renúncia\" é inconstitucional. O SUS é universal e a posse de contrato privado não anula o direito à rede pública.","O sistema público não é impedido de regular leitos para usuários de planos. Em urgências, a responsabilidade de garantir a vida é do Estado por meio do Complexo Regulador.","Inverte a lógica regulatória, que deve priorizar casos graves. Além disso, discriminar o acesso à alta complexidade com base em dados da ANS fere o princípio da igualdade."],"refs":["BRASIL. Ministério da Saúde. Curso básico de regulação do Sistema Único de Saúde – SUS. Brasília: Ministério da Saúde, 2016.","CONASEMS. Manual do(a) gestor(a) municipal do SUS: diálogos no cotidiano. 2. ed. Brasília: CONASEMS, 2021.","CONASS. Planificação da atenção à saúde: um instrumento de gestão e organização. Brasília: CONASS, 2018."],"tema":"Vaga zero e universalidade na urgência","conceito":"Na urgência vale a 'vaga zero': o regulador pode determinar o encaminhamento imediato do paciente grave para o serviço de referência ainda que não haja vaga formal — a gravidade clínica se sobrepõe à disponibilidade. Ter plano de saúde não retira o direito; o ressarcimento ao SUS pela operadora (via ANS) é trâmite posterior e nunca condiciona o atendimento.","alt":{"A":"CORRETA. Inserir na Central de Regulação de Urgência, com vaga conforme prioridade clínica (vaga zero), independentemente da cobertura suplementar.","B":"Inverte a lógica: risco ALTO é que tem prioridade; e excluir quem tem plano fere a universalidade.","C":"Termo de renúncia ao plano é inconstitucional.","D":"Falso: o SUS não é impedido de regular leitos para beneficiários de planos."},"roteiro":[],"takehome":"Duas palavras para guardar: vaga zero (a gravidade cria a vaga) e ressarcimento ao SUS (o acerto é entre operadora e ANS, nunca com o paciente).","area":"IESC · SUS: origens e legislação"},{"id":172,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2026.1","num":8}],"enunciado":["(AFYA TERESINA) A trajetória do Sistema Único de Saúde (SUS) reflete a transição de um modelo excludente e meritocrático para um sistema baseado na Seguridade Social. O relato do Sr. Roberto exemplifica a ruptura com o sistema previdenciário anterior ao advento da Constituição Federal de 1988. Sobre este processo de implantação e sua base legal, analise as asserções a seguir e a relação proposta entre elas:","I. A Constituição Federal de 1988 estabeleceu a saúde como direito de todos e dever do Estado, rompendo com a lógica do modelo previdenciário que condicionava a assistência médica à contribuição formal para o INPS/INAMPS.","Porque","II. A Lei n.º 8.080/1990 e a Lei n.º 8.142/1990 regulamentaram as diretrizes constitucionais ao definir a organização, a participação social e o financiamento do sistema, garantindo a sua operacionalização em todo o território nacional.","Assinale a alternativa correta."],"alternativas":{"A":"A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","B":"A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","C":"As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","D":"As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I."},"correta":"D","oficial":{},"oficial_extra":["Análise da Asserção I: verdadeira. Representa o ganho do movimento da Reforma Sanitária consolidado no Artigo 196 da CF/88. Antes, quem não tinha carteira assinada era \"indigente\" do sistema de saúde.","Análise da Asserção II: verdadeira. A Constituição dá a diretriz política, mas são as Leis Orgânicas que dão a estrutura jurídica e administrativa (o \"corpo\" do SUS).","Análise da Relação: Correta. A regulamentação (II) é a razão pela qual o direito garantido no papel (I) pôde se transformar em serviços reais, financiamento e gestão municipalizada, efetivando a implantação do sistema."],"refs":["BRASIL. Constituição da República Federativa do Brasil. Brasília: Senado Federal, 1988. (Art. 196).","BRASIL. Lei n.º 8.080, de 19 de setembro de 1990. Brasília, 1990.","BRASIL. Lei n.º 8.142, de 28 de dezembro de 1990. Brasília, 1990.","PAIM, J. S. O que é o SUS? Rio de Janeiro: Editora Fiocruz, 2009."],"tema":"História do SUS — da meritocracia à seguridade","conceito":"Antes de 1988, o acesso à assistência médica previdenciária (CAPs → IAPs → INPS → INAMPS) dependia de vínculo formal de trabalho; quem estava fora era atendido como 'indigente' pela filantropia. A CF/88, fruto da Reforma Sanitária e da 8ª Conferência Nacional de Saúde (1986), rompeu com isso ao instituir a saúde como direito de todos e dever do Estado, dentro da Seguridade Social (saúde, previdência e assistência).","alt":{"A":"A II é verdadeira.","B":"A I é verdadeira.","C":"A II JUSTIFICA a I: sem as leis orgânicas, o direito constitucional não se operacionalizaria.","D":"CORRETA. As duas são verdadeiras e a II justifica a I."},"roteiro":[],"takehome":"Compare com a questão 139: lá as asserções eram verdadeiras mas apenas complementares; aqui há nexo real (a regulamentação é o que efetiva o direito). Avalie o 'PORQUE' caso a caso.","area":"IESC · SUS: origens e legislação"},{"id":173,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2026.1","num":9}],"enunciado":["(AFYA MARABÁ) Maria L., 62 anos, hipertensa e diabética há 15 anos, residente em município de médio porte, é acompanhada irregularmente pela Unidade de Saúde da Família. Nos últimos dois anos, houve alta rotatividade de médicos na equipe, desabastecimento intermitente de medicamentos anti-hipertensivos e falhas na marcação de consultas especializadas via sistema municipal de regulação.","A paciente apresentou piora progressiva do controle glicêmico e pressórico, evoluindo com acidente vascular cerebral isquêmico. Durante a internação hospitalar, identificou-se ausência de acompanhamento contínuo na Atenção Primária, falhas no sistema de referência e contrarreferência e inexistência de protocolos municipais atualizados para manejo de doenças crônicas.","O caso gerou debate na Comissão Intergestores Municipal sobre a responsabilidade da gestão local na organização da rede de atenção.","Com base na Lei n.º 8.080/1990 e na organização do Sistema Único de Saúde, responda:","a) Analise o caso apresentado e identifique dois princípios do SUS fragilizados na situação descrita, justificando sua resposta. (0,75 ponto)","b) Relacione as falhas de gestão municipal apresentadas no caso com os mecanismos de organização e financiamento do SUS, discutindo como a gestão poderia ter evitado o desfecho clínico. (0,75 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Subitem (a) – 0,75 ponto.","O estudante deve identificar dois princípios estruturantes previstos na Lei nº 8.080/1990 e justificar sua fragilização no caso. Entre os esperados:","Integralidade da assistência: houve falha na articulação entre atenção primária, atenção especializada e hospitalar, evidenciada pela ausência de continuidade do cuidado e falhas na referência e contrarreferência.","Universalidade: embora o acesso formal exista, o desabastecimento de medicamentos e dificuldades na regulação comprometem o acesso efetivo e oportuno aos serviços.","Equidade (caso argumentado adequadamente): paciente crônica, com maior vulnerabilidade clínica, não recebeu acompanhamento proporcional às suas necessidades.","Descentralização com comando único: fragilidade da gestão municipal na organização da rede e na garantia da assistência contínua.","Pontuação sugerida:","Identificação correta de cada princípio: 0,5 ponto.","Justificativa coerente e fundamentada: 0,25 ponto.","Subitem (b) – 0,75 ponto.","O estudante deve demonstrar compreensão da relação entre gestão e financiamento no SUS, podendo abordar:","Responsabilidade do gestor municipal na organização da Atenção Primária como coordenadora do cuidado.","Planejamento inadequado da assistência farmacêutica.","Fragilidade na pactuação interfederativa e na regulação assistencial.","Necessidade de aplicação eficiente dos recursos do Piso da Atenção Básica (PAB).","Importância do planejamento ascendente e da Programação Pactuada e Integrada (PPI).","Falta de protocolos clínicos municipais como falha na governança.","Pontuação sugerida:","Relação adequada entre gestão e organização da rede: 0,5 ponto.","Discussão fundamentada sobre financiamento e responsabilidade municipal: 0,25 ponto."],"refs":["BRASIL. Lei n.º 8.080, de 19 de setembro de 1990. Dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes. Diário Oficial da União: Brasília, 1990.","BRASIL. Ministério da Saúde. Política Nacional de Atenção Básica. Brasília: Ministério da Saúde, 2017."],"tema":"Falhas de gestão e princípios do SUS","conceito":"Caso semelhante ao 163, com mais camadas de falha: rotatividade médica (perda de longitudinalidade e vínculo), desabastecimento (assistência farmacêutica), regulação falha (referência e contrarreferência) e ausência de protocolos (governança clínica). O desfecho — AVC isquêmico — é um evento evitável por atenção primária adequada.","alt":{},"roteiro":["a) Dois princípios (nomeie e justifique com o caso):","INTEGRALIDADE: ausência de articulação entre APS, especializada e hospitalar; referência e contrarreferência falhas; cuidado descontínuo.","UNIVERSALIDADE: o acesso formal existia, mas o desabastecimento e a falha de regulação impediram o acesso efetivo e oportuno.","Alternativas igualmente aceitáveis: EQUIDADE (paciente de alto risco não recebeu acompanhamento proporcional à necessidade) e DESCENTRALIZAÇÃO COM COMANDO ÚNICO (fragilidade da gestão municipal em organizar a rede).","b) Relação entre gestão e desfecho: a APS é a coordenadora do cuidado — a alta rotatividade médica quebra a longitudinalidade e o vínculo; a solução passa por política de fixação de profissionais (carreira, contratação estável, programas de provimento).","Assistência farmacêutica: planejamento de aquisição e logística (programação com base no consumo histórico, estoque mínimo, sistema de controle, fluxo de reposição emergencial) evitaria a interrupção do anti-hipertensivo.","Regulação e pactuação: protocolos de priorização por risco, linha de cuidado de HAS/DM, apoio matricial e telessaúde, pactuação interfederativa (CIB/CIR e PPI) para garantir a oferta de especializada na região.","Financiamento: uso eficiente dos recursos da APS (componente fixo por equipe, vínculo territorial e qualidade, no modelo atual), com planejamento ascendente refletido no Plano Municipal de Saúde e na PAS e prestação de contas no RAG.","Governança clínica: elaboração e atualização de protocolos municipais de doenças crônicas, com monitoramento por indicadores.","Conclusão: com acompanhamento contínuo, medicação garantida e acesso oportuno ao especialista, o controle pressórico e glicêmico seria mantido e o AVC — condição sensível à atenção primária — provavelmente evitado."],"takehome":"Amarre sempre falha de gestão → princípio ferido → desfecho clínico. E use o termo 'condição sensível à atenção primária': é exatamente o conceito que o caso ilustra.","area":"IESC · SUS: origens e legislação"},{"id":174,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2026.1","num":10}],"enunciado":["(AFYA GARANHUNS) A gestão de uma Unidade Básica de Saúde (UBS) exige a aplicação de ferramentas diagnósticas e organizativas para garantir a eficiência do cuidado. No contexto do planejamento estratégico e da Política Nacional de Atenção Básica (PNAB), a organização da agenda e a integração de fluxos são determinantes para a resolutividade.","Com base nos marcos técnicos da Atenção Primária à Saúde (APS), responda:","a) Nomeie duas estratégias de organização da agenda recomendadas pelo Ministério da Saúde para reduzir o tempo de espera e garantir o acesso oportuno. (0,75 ponto)","b) Indique dois elementos da gestão administrativa que, quando integrados à prática clínica, aumentam a resolutividade da unidade (capacidade de solucionar o problema do paciente no local). (0,75 ponto)"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["O corretor deve considerar apenas a presença dos termos técnicos abaixo. Não deve haver pontuação para respostas baseadas em adjetivos ou opiniões.","Item A: Estratégias de Agenda (0,375 cada)","Aceitam-se exclusivamente dois dos seguintes itens:","1. Acesso Avançado (ou Advanced Access / Agenda Aberta).","2. Acolhimento com Classificação de Risco (ou Escuta Qualificada com priorização).","3. Agenda Multiprofissional (ou Compartilhada).","4. Blocos de horários para demanda espontânea.","Item B: Elementos Administrativos para Resolutividade (0,375 cada)","Aceitam-se exclusivamente dois dos seguintes itens:","1. Prontuário Eletrônico (compartilhamento de dados).","2. Protocolos Clínicos/Diretrizes Terapêuticas (padronização de condutas).","3. Fluxograma de Atendimento/Acolhimento (organização da recepção).","4. Sistema de Regulação/Referência e Contrarreferência (coordenação do cuidado).","Referência:","GUSSO, G. NETO, P. P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2.ª ed. Grupo A, 2019. Cap. 25."],"refs":[],"tema":"Organização da agenda e resolutividade","conceito":"Questão de resposta objetiva: a banca avisa que só pontua TERMO TÉCNICO, não opinião. Vale decorar as listas.","alt":{},"roteiro":["a) Duas estratégias de organização da agenda (cite os nomes exatos):","ACESSO AVANÇADO (advanced access / agenda aberta): a maior parte da agenda fica livre para o dia, atendendo 'o problema de hoje hoje' e reduzindo a lista de espera.","ACOLHIMENTO COM CLASSIFICAÇÃO DE RISCO (escuta qualificada com priorização): ordena o atendimento por necessidade, não por ordem de chegada.","Outras aceitas: AGENDA MULTIPROFISSIONAL (compartilhada) e BLOCOS DE HORÁRIO para demanda espontânea.","b) Dois elementos de gestão administrativa que aumentam a resolutividade:","PRONTUÁRIO ELETRÔNICO (PEC/e-SUS): compartilhamento de dados entre os profissionais e continuidade da informação.","PROTOCOLOS CLÍNICOS E DIRETRIZES TERAPÊUTICAS: padronizam condutas e permitem que a equipe resolva no próprio serviço.","Outros aceitos: FLUXOGRAMA DE ATENDIMENTO/ACOLHIMENTO e SISTEMA DE REGULAÇÃO com REFERÊNCIA E CONTRARREFERÊNCIA.","Escreva os nomes técnicos em destaque e, se sobrar espaço, acrescente uma linha de explicação — mas o nome é o que pontua."],"takehome":"Quando o enunciado diz 'nomeie', responda com o nome técnico em primeiro lugar. Aqui, 'acesso avançado' e 'acolhimento com classificação de risco' valem ponto; 'organizar melhor a agenda' vale zero.","area":"IESC · Gerenciamento da unidade de saúde"}];

/* ---------------- estado ---------------- */
const F = { mat:new Set(), prova:'', tema:'', tipo:'', ordem:'aleatoria' };
let lista = [], idx = 0;
const resp = {};           // id -> letra marcada
const revelada = new Set(); // discursivas abertas

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = m => m.split(' ')[0];           // "CI 3" -> "CI"
const provaOf = q => q.provas.map(p=>p.prova);

/* ---------------- filtros ---------------- */
function build(){
  const mats = [...new Set(BANCO.map(q=>q.materia))].sort();
  document.getElementById('fmat').innerHTML = mats.map(m=>
    `<button class="chip" data-m="${esc(m)}">${esc(m)}</button>`).join('');

  const provas = [...new Set(BANCO.flatMap(provaOf))].sort();
  document.getElementById('fprova').innerHTML =
    `<option value="">Todas as provas (${provas.length})</option>` +
    provas.map(p=>{
      const n = BANCO.filter(q=>provaOf(q).includes(p)).length;
      return `<option value="${esc(p)}">${esc(p)} — ${n} questões</option>`;
    }).join('');

  const areas = [...new Set(BANCO.map(q=>q.area))].sort((a,b)=>a.localeCompare(b,'pt'));
  const grupos = {};
  areas.forEach(a=>{
    const [g, nome] = a.split(' · ');
    (grupos[g] = grupos[g] || []).push([a, nome]);
  });
  document.getElementById('ftema').innerHTML =
    `<option value="">Todos os assuntos (${areas.length})</option>` +
    Object.keys(grupos).map(g =>
      `<optgroup label="${esc(g)}">` + grupos[g].map(([a,nome])=>{
        const n = BANCO.filter(q=>q.area===a).length;
        return `<option value="${esc(a)}">${esc(nome)} (${n})</option>`;
      }).join('') + `</optgroup>`
    ).join('');

  document.getElementById('ftipo').innerHTML =
    `<button class="chip on" data-t="">Todas</button>
     <button class="chip" data-t="objetiva">Objetivas</button>
     <button class="chip" data-t="discursiva">Discursivas</button>`;

  document.getElementById('fordem').innerHTML =
    `<button class="chip on" data-o="aleatoria">Aleatória</button>
     <button class="chip" data-o="prova">Ordem da prova</button>`;

  document.getElementById('htot').textContent = '· ' + BANCO.length + ' questões';
}

function aplica(){
  let L = BANCO.filter(q =>
    (F.mat.size===0 || F.mat.has(q.materia)) &&
    (!F.prova || provaOf(q).includes(F.prova)) &&
    (!F.tema  || q.area===F.tema) &&
    (!F.tipo  || q.tipo===F.tipo)
  );
  if (F.ordem==='prova'){
    L.sort((a,b)=>{
      const pa = F.prova ? a.provas.find(p=>p.prova===F.prova) : a.provas[0];
      const pb = F.prova ? b.provas.find(p=>p.prova===F.prova) : b.provas[0];
      return pa.prova.localeCompare(pb.prova,'pt') || pa.num - pb.num;
    });
  } else {
    for(let i=L.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[L[i],L[j]]=[L[j],L[i]];}
  }
  lista = L; idx = 0;
  document.getElementById('fcount').textContent =
    lista.length + (lista.length===1 ? ' questão' : ' questões') + ' no filtro atual';
  render();
}

/* ---------------- placar ---------------- */
function placar(){
  let ok=0, err=0;
  for (const q of BANCO){
    const r = resp[q.id];
    if (r===undefined) continue;
    if (r===q.correta) ok++; else err++;
  }
  const feitas = ok+err;
  document.getElementById('sok').textContent = ok;
  document.getElementById('serr').textContent = err;
  document.getElementById('spct').textContent = feitas ? Math.round(ok/feitas*100)+'%' : '—';
  const alvo = lista.filter(q=>q.tipo==='objetiva').length || 1;
  const feitasNaLista = lista.filter(q=>resp[q.id]!==undefined).length;
  document.getElementById('pbar').style.width = Math.min(100, feitasNaLista/alvo*100) + '%';
}

/* ---------------- render ---------------- */
function paras(arr){
  return (Array.isArray(arr)?arr:[arr]).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('');
}

function render(){
  const app = document.getElementById('app');
  if (!lista.length){
    app.innerHTML = `<div class="empty">Nenhuma questão com esses filtros.<br>Ajuste os filtros acima.</div>`;
    document.getElementById('pos').textContent = '';
    placar(); return;
  }
  if (idx >= lista.length) idx = lista.length-1;
  if (idx < 0) idx = 0;
  const q = lista[idx];
  const marcada = resp[q.id];
  const disc = q.tipo === 'discursiva';
  const aberta = revelada.has(q.id);

  const tags = [
    `<span class="tag m ${key(q.materia)}">${esc(q.materia)}</span>`,
    ...q.provas.map(p=>`<span class="tag p">${esc(p.prova)} · Q${p.num}</span>`),
    disc ? `<span class="tag d">Discursiva</span>` : ''
  ].join('');

  let alts = '';
  if (!disc){
    const letras = Object.keys(q.alternativas).sort();
    alts = `<div class="alts">` + letras.map(L=>{
      let cls='';
      if (marcada!==undefined){
        if (L===q.correta) cls=' ok';
        else if (L===marcada) cls=' bad';
        else cls=' dim';
      }
      return `<button class="alt${cls}" data-l="${L}" ${marcada!==undefined?'disabled':''}>
        <span class="ltr">${L}</span><span>${esc(q.alternativas[L])}</span></button>`;
    }).join('') + `</div>`;
  }

  /* --- bloco de comentário --- */
  let fb = '';
  const mostrar = disc ? aberta : (marcada!==undefined);
  if (mostrar){
    let head = '';
    if (!disc){
      const acertou = marcada === q.correta;
      head = `<div class="verdict ${acertou?'ok':'bad'}">${acertou
        ? '✓ Você acertou'
        : `✗ Você marcou ${marcada} — a correta é ${q.correta}`}</div>`;
    }

    const conceito = q.conceito
