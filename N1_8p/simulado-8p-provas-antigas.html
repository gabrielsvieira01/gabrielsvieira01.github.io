te no hospital, orientando a equipe do SAMU a buscar outro hospital que possa atender o caso, sem fazer a comunicação com a regulação de leitos.","B":"Encaminhar o paciente para um leito de enfermaria comum, sem consultar a regulação de leitos, até que a condição do paciente melhore e um leito de UTI fique disponível.","C":"Administrar os cuidados iniciais ao paciente, enquanto aciona imediatamente o sistema de regulação de leitos para transferi-lo a outro hospital que tenha vaga disponível na UTI.","D":"Manter o paciente na sala de emergência do hospital, administrando os cuidados iniciais, sem ativar a regulação de leitos, esperando até que um leito de UTI fique disponível no próprio hospital."},"correta":"C","oficial":{},"oficial_extra":["De acordo com o Curso básico de regulação do Sistema Único de Saúde – SUS, em situações de urgência onde a capacidade de leitos de UTI está esgotada, o médico deve imediatamente acionar o sistema de regulação de leitos. O objetivo é garantir a transferência do paciente para uma unidade de saúde que tenha disponibilidade de leitos de UTI, assegurando a continuidade do atendimento especializado. A conduta correta envolve a administração dos cuidados iniciais para estabilizar o paciente enquanto se realiza a transferência, respeitando o princípio da integralidade do SUS e garantindo o acesso oportuno ao cuidado necessário.","Referência:","Brasil. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. Curso básico de regulação do Sistema Único de Saúde – SUS [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção à Saúde, Departamento de Regulação, Avaliação e Controle de Sistemas. – Brasília: Ministério da Saúde, 2016. 227 p. : il."],"refs":[],"tema":"Regulação de leitos","conceito":"A regulação do acesso é uma das funções centrais do SUS: garante que o paciente certo chegue ao serviço certo no tempo certo, por meio das centrais de regulação (leitos, urgência, consultas e exames). Nenhum serviço pode recusar atendimento a paciente grave — estabiliza-se primeiro e regula-se a transferência em seguida.","alt":{"A":"Negar admissão e devolver o paciente ao SAMU sem regulação é recusa de atendimento — infração ética e legal.","B":"Colocar paciente com IAM em enfermaria comum 'até melhorar' é subtratamento; e ignorar a regulação impede a transferência.","C":"CORRETA. Estabilizar (MOV, AAS, antiagregante, analgesia, ECG em até 10 min, considerar trombólise se a angioplastia não for viável em tempo hábil) enquanto aciona a central de regulação para transferência.","D":"Esperar passivamente um leito no próprio hospital, sem acionar a regulação, é omissão."},"roteiro":[],"takehome":"A dupla certa é sempre a mesma: estabilizar + acionar a regulação. Nunca 'transferir sem estabilizar' nem 'estabilizar sem regular'.","area":"IESC · Regulação em saúde"},{"id":139,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":5}],"enunciado":["( AFYA IPATINGA) A Constituição Federal de 1988 marcou um importante avanço na saúde pública brasileira ao estabelecer a saúde como um direito de todos e um dever do Estado, garantindo o acesso universal e igualitário às ações e serviços de saúde por meio do Sistema Único de Saúde (SUS). Para regulamentar esses princípios constitucionais, foram criadas as leis 8.080/1990 e 8.142/1990.","Considerando as informações apresentadas, avalie as asserções a seguir e a relação proposta entre elas.","A Lei 8.142/1990 regulamentou a participação popular na gestão e estabeleceu os mecanismos de controle social, promovendo a inclusão da sociedade no processo decisório do SUS.","PORQUE","A Lei nº 8.080/90 dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes.","A respeito dessas asserções, assinale a opção correta."],"alternativas":{"A":"A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","B":"As asserções I e II são proposições falsas.","C":"As asserções I e II são proposições verdadeiras.","D":"A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."},"correta":"C","oficial":{},"oficial_extra":["Enquanto a Lei 8.080/1990 cria a base estrutural e organizacional do SUS, a Lei 8.142/1990 complementa essa estrutura ao garantir a participação social e regulamentar o financiamento do sistema. As duas leis se complementam ao assegurar que o SUS funcione de maneira democrática, com participação popular e garantia de recursos, o que é fundamental para a sustentabilidade e efetividade do sistema. Ambas as leis reforçam os princípios e diretrizes do SUS, garantindo que o sistema de saúde pública atue de forma integrada, participativa e financeiramente sustentável."],"refs":["BRASIL. Lei 8.080, de 19 de setembro de 1990. Dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes e dá outras providências. Diário Oficial da União, Brasília, DF, 19 set. 1990.","BRASIL. Lei 8.142, de 28 de dezembro de 1990. Dispõe sobre a participação da comunidade na gestão do Sistema Único de Saúde (SUS} e sobre as transferências intergovernamentais de recursos financeiros na área da saúde e dá outras providências. Diário Oficial da União, Brasília, DF, 31 dez. 1990."],"tema":"Leis orgânicas da saúde","conceito":"Lei 8.080/1990: dispõe sobre condições para promoção, proteção e recuperação da saúde, organização e funcionamento dos serviços; define princípios (universalidade, integralidade, equidade, descentralização, regionalização, hierarquização) e competências das esferas. Lei 8.142/1990: participação da comunidade (Conferências de Saúde a cada 4 anos e Conselhos de Saúde permanentes e deliberativos, com composição PARITÁRIA — 50% de usuários) e transferências intergovernamentais de recursos.","alt":{"A":"A II é verdadeira.","B":"As duas são verdadeiras.","C":"CORRETA. Ambas as asserções são verdadeiras. Atenção ao detalhe da questão de asserção: elas são verdadeiras, mas a II não é JUSTIFICATIVA da I — são leis complementares, não causais. Nesta prova a alternativa não exigia julgar o nexo.","D":"A I é verdadeira."},"roteiro":[],"takehome":"Memorize o par: 8.080 = organização do sistema; 8.142 = participação social + dinheiro. Em questão de asserção, avalie primeiro cada frase isolada e só depois o 'PORQUE'.","area":"IESC · SUS: origens e legislação"},{"id":140,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":6}],"enunciado":["(FMIT) Em sua UBS, a equipe está enfrentando desafios significativos relacionados a conflitos interpessoais entre os membros. Esses conflitos estão começando a afetar a eficiência do atendimento e o ambiente de trabalho. Como gestor da UBS, você precisa adotar estratégias para mediar esses conflitos e melhorar a dinâmica da equipe.","Com base no contexto apresentado, assinale a alternativa que demonstra uma abordagem eficaz para mediar conflitos interpessoais na equipe da UBS e promover um ambiente de trabalho mais colaborativo."],"alternativas":{"A":"Aplicar sanções disciplinares imediatas aos membros da equipe envolvidos nos conflitos para desestimular comportamentos indesejados.","B":"Promover reuniões regulares para discussão de problemas e incentivar a comunicação aberta, diálogo, empatia e escuta ativa entre os membros da equipe.","C":"Permitir que os conflitos se resolvam naturalmente sem intervenção da gestão, a fim de não sobrecarregar a administração com questões pessoais.","D":"Focar exclusivamente em recompensar o desempenho individual para motivar a equipe e minimizar a ocorrência de conflitos."},"correta":"B","oficial":{"B":"Promover reuniões regulares para discussão de problemas e incentivar a comunicação aberta, diálogo, empatia e escuta ativa entre os membros da equipe é a abordagem mais eficaz para mediar conflitos interpessoais na equipe da UBS e promover um ambiente de trabalho colaborativo. Essa estratégia permite que os membros da equipe expressem suas preocupações e frustrações em um ambiente seguro e controlado. As reuniões regulares oferecem uma plataforma para que os problemas sejam abordados de maneira construtiva, evitando que os conflitos se agravem ou que sejam ignorados. Além disso, ao incentivar a comunicação aberta e o diálogo, o gestor promove a compreensão mútua e fortalece o espírito de equipe. A empatia e a escuta ativa são fundamentais para que os membros da equipe se sintam ouvidos e valorizados, o que contribui para a resolução pacífica de conflitos e a melhoria do ambiente de trabalho. Diferente das outras opções, que propõem ações que podem ignorar a raiz dos conflitos, promover punições ou focar excessivamente em desempenho individual, a opção correta visa criar um espaço de diálogo que favorece a cooperação e o entendimento mútuo, fatores essenciais para uma equipe funcional e eficiente."},"oficial_extra":["Referência:","GUSSO, Gustavo; LOPES, José M C.; DIAS, Lêda C. Tratado de medicina de família e comunidade - 2 volumes: princípios, formação e prática. Porto Alegre: Grupo A, 2019. Pág. 205- 211."],"refs":[],"tema":"Mediação de conflitos na equipe","conceito":"Conflito em equipe de saúde costuma nascer de processo de trabalho mal definido, sobrecarga e falta de espaço de fala — não de má índole. A gestão participativa (roda de conversa, reunião de equipe, educação permanente, apoio matricial) é a ferramenta recomendada.","alt":{"A":"Punir sem apurar a causa reprime o sintoma e piora o clima.","B":"CORRETA. Reuniões regulares, comunicação aberta, diálogo, empatia e escuta ativa.","C":"Omissão da gestão: conflito não resolvido escala e contamina o atendimento.","D":"Recompensa individual em equipe multiprofissional estimula competição e pode aprofundar o conflito."},"roteiro":[],"takehome":"Em gestão de pessoas na APS, a resposta certa quase sempre envolve diálogo estruturado e espaço coletivo — nunca punição nem omissão.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":141,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":7}],"enunciado":["(AFYA PALMAS) A Secretaria Municipal de Saúde de um pequeno município está em processo de revisão do seu Plano de Saúde para os próximos quatro anos. Durante uma reunião com a equipe gestora, foram discutidos os instrumentos essenciais para o planejamento e a gestão no âmbito do Sistema Único de Saúde (SUS). Considerando esse contexto, analise as afirmações abaixo:","I. O Plano de Saúde é um documento estratégico que define as diretrizes, objetivos e metas para a saúde de uma população ao longo de um período de quatro anos. II. A Programação Anual de Saúde é o instrumento que operacionaliza as intenções expressas no Plano de Saúde e tem por objetivo anualizar as metas do Plano de Saúde e prever a alocação dos recursos orçamentários a serem executados. III. O Relatório de Gestão é um documento que deve ser elaborado anualmente e apresenta uma análise detalhada da execução das ações e dos recursos utilizados, além de avaliar o cumprimento das metas estabelecidas. IV. A Programação Anual de Saúde é o principal documento utilizado para o planejamento estratégico de longo prazo, enquanto o Plano de Saúde é um documento de curto prazo que orienta as ações imediatas.","Quanto aos instrumentos acima, é correto o que se afirma em:"],"alternativas":{"A":"I, II, III e IV estão corretas.","B":"apenas III e IV estão corretas.","C":"apenas I e III estão corretas.","D":"apenas I, II e III estão corretas."},"correta":"D","oficial":{},"oficial_extra":["- Correto. O Plano de Saúde é um documento estratégico que define diretrizes, objetivos e metas para um período de quatro anos.","- Correto. PAS é o instrumento que operacionaliza as intenções expressas no Plano de Saúde e tem por objetivo anualizar as metas do Plano de Saúde e prever a alocação dos recursos orçamentários a serem executados.","- Correto. O Relatório de Gestão é um documento anual que avalia a execução das ações e os recursos utilizados","- Errado. A Programação Anual de Saúde é um documento de curto prazo, enquanto o Plano de Saúde orienta o planejamento estratégico de ,médio/longo prazo.","Referência:","Brasil. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85-8071-027-4 – capítulo 2."],"refs":[],"tema":"Instrumentos de planejamento do SUS","conceito":"A tríade: PLANO DE SAÚDE (quadrienal, estratégico, com diretrizes, objetivos e metas — base de todo o planejamento); PROGRAMAÇÃO ANUAL DE SAÚDE (PAS, anualiza as metas do Plano e prevê a alocação orçamentária); RELATÓRIO ANUAL DE GESTÃO (RAG, presta contas do que foi executado e é submetido ao Conselho de Saúde). Todos são elaborados de forma ascendente, do município para a União.","alt":{"A":"IV é falsa.","B":"IV é falsa.","C":"Omite a II, que está correta.","D":"CORRETA. I, II e III estão certas; IV inverte os papéis (o Plano é o de médio/longo prazo, a PAS é a de curto prazo)."},"roteiro":[],"takehome":"Plano = 4 anos (o quê); PAS = 1 ano (como e com quanto); RAG = prestação de contas (o que saiu). A alternativa que inverter Plano e PAS está errada.","area":"IESC · Planejamento e gestão no SUS"},{"id":142,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":8}],"enunciado":["(AFYA IPATINGA Homem de 45 anos foi atendido na Unidade Básica de Saúde (UBS) devido a uma dor torácica intensa que começou há cerca de uma hora. Após a avaliação inicial, o médico da UBS suspeitou de um Infarto Agudo do Miocárdio (IAM) e decidiu encaminhá-lo imediatamente para um hospital para realização de exames mais avançados e possível intervenção. Paciente informou que possui plano de saúde particular com cobertura de atendimento em hospitais privados.","Em relação ao encaminhamento do paciente pode-se afirmar que ele:"],"alternativas":{"A":"deverá seguir o protocolo do SUS e ser encaminhado para o hospital público de referência, pois o paciente não tem direito de utilizar seu plano de saúde particular após ser atendido na UBS.","B":"poderá ser encaminhado formalmente pelo médico para o hospital privado do plano de saúde do paciente ou para o hospital público do Sistema Único de Saúde (SUS).","C":"deverá ser encaminhado formalmente para um hospital público, cabendo ao paciente a decisão de utilizar o encaminhamento para o SUS ou procurar o hospital privado do seu plano de saúde.","D":"deverá ser encaminhado formalmente para o hospital privado do plano de saúde do paciente, pois tem o direito de escolher onde quer ser atendido, mesmo sendo inicialmente atendido na UBS."},"correta":"C","oficial":{},"oficial_extra":["O encaminhamento formal de pacientes dentro do Sistema Único de Saúde (SUS) deve ser direcionado para serviços públicos ou conveniados, de acordo com os princípios e diretrizes estabelecidos pela legislação que rege o SUS. A Constituição Federal de 1988, em seu artigo 198 estabelece que as ações e serviços públicos de saúde integram uma rede regionalizada e hierarquizada e constituem um sistema único, organizado de acordo com as diretrizes de descentralização, atendimento integral e participação da comunidade. A Lei 8.080/1990, no artigo 7 define os princípios do SUS, incluindo a universalidade do acesso aos serviços de saúde em todos os níveis de assistência e a integralidade da assistência, ou seja, o atendimento deve ser completo e oferecido dentro da rede do SUS. Essas legislações e diretrizes do SUS estabelecem que o sistema deve ser universal, integral e hierarquizado, com o encaminhamento formal de pacientes sendo feito dentro da própria rede pública ou conveniada, para garantir o acesso equitativo aos serviços de saúde. Encaminhar pacientes diretamente para serviços privados, de forma formal e com recursos do SUS, violaria os princípios da equidade e universalidade que são pilares do sistema público de saúde brasileiro. Portanto, o encaminhamento formal de pacientes para serviços privados pelo SUS não é permitido, pois isso poderia comprometer a organização do sistema e desviar recursos e responsabilidades que são atribuídas ao SUS conforme a legislação vigente."],"refs":["BRASIL. Lei 8.080, de 19 de setembro de 1990. Dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes e dá outras providências. Diário Oficial da União, Brasília, DF, 19 set. 1990ª.","BRASIL. . Lei 8.142, de 28 de dezembro de 1990. Dispõe sobre a participação da comunidade na gestão do Sistema Único de Saúde (SUS} e sobre as transferências intergovernamentais de recursos financeiros na área da saúde e dá outras providências. Diário Oficial da União, Brasília, DF, 31 dez. 1990b.","BRASIL. Constituição da República Federativa do Brasil de 1988. Brasília, DF: Presidente da República, [2016].","CASTILHO C.M. Medicina privada. IN.: GUSSO, Gustavo. et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 66. Disponível em: Minha Biblioteca."],"tema":"Encaminhamento SUS x saúde suplementar","conceito":"O médico da UBS atua dentro do SUS e encaminha formalmente pela rede pública, respeitando regionalização e hierarquização. Isso não restringe o direito do paciente: ele pode, por decisão própria, procurar a rede do seu plano. O que o profissional não faz é encaminhar formalmente, em nome do SUS, para um serviço privado não conveniado.","alt":{"A":"Falso dizer que o paciente 'não tem direito' de usar o plano — o acesso à saúde suplementar é livre.","B":"O médico do SUS não emite encaminhamento formal para serviço privado não conveniado.","C":"CORRETA. Encaminhamento formal para o hospital público, cabendo ao paciente decidir se usa o SUS ou procura seu plano.","D":"Encaminhar formalmente para o privado inverte a lógica do sistema público."},"roteiro":[],"takehome":"Separe as duas coisas: o encaminhamento formal segue a rede pública; a escolha do paciente é dele. Em caso de urgência, isso não pode atrasar a estabilização e a transferência.","area":"IESC · SUS: origens e legislação"},{"id":143,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2024.2","num":9}],"enunciado":["(UNIPTAN) Um médico assume a gestão da saúde municipal em uma cidade que enfrenta diversos desafios na Unidade Básica de Saúde (UBS). Entre os problemas identificados estão a alta taxa de doenças crônicas não transmissíveis, a dificuldade de acesso a serviços especializados e a insatisfação da população com os atendimentos. Com base nisso, responda a seguinte questão abaixo:","Cite e descreva quais etapas do planejamento no SUS que o médico deve seguir para enfrentar os desafios identificados na UBS e como cada uma delas contribui para a melhoria da saúde local (1,5)."],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Resposta: As etapas do planejamento no SUS que o médico deve seguir incluem (1,0):","Diagnóstico Situacional: Levantamento de dados sobre a saúde da população, identificando as principais doenças e necessidades. Definição de Prioridades: Seleção das questões mais críticas a serem abordadas, como a alta incidência de doenças crônicas. Elaboração de Plano de Ação: Desenvolvimento de estratégias específicas para atender as prioridades definidas, como campanhas de prevenção. Execução: Implementação das ações planejadas, envolvendo a equipe de saúde e a comunidade. Monitoramento e Avaliação: Acompanhamento dos resultados das ações e ajustes necessários para garantir a efetividade das intervenções.","Cada uma dessas etapas contribui para uma gestão mais eficaz e direcionada às reais necessidades da população, resultando em melhorias nos serviços de saúde(0,5)."],"refs":["BRASIL. Ministério da Saúde. Diretrizes para o planejamento no SUS. Brasília: Ministério da Saúde, 2021.","BRASIL. Ministério da Saúde. Política Nacional de Saúde. Brasília: Ministério da Saúde, 2020."],"tema":"Etapas do planejamento em saúde","conceito":"O planejamento no SUS é ascendente, participativo e cíclico. Na prática, o ciclo é: diagnóstico → priorização → plano de ação → execução → monitoramento e avaliação, realimentando o diagnóstico.","alt":{},"roteiro":["1) Diagnóstico situacional: levantar dados do território (perfil demográfico e epidemiológico, cadastro das famílias, indicadores de doenças crônicas, cobertura, dados do e-SUS), ouvindo também a comunidade e o conselho local. Contribuição: revela o problema real em vez do suposto.","2) Definição de prioridades: hierarquizar por magnitude, gravidade, vulnerabilidade e viabilidade de intervenção — aqui, doenças crônicas e acesso a especializada. Contribuição: concentra recursos escassos no que mais impacta.","3) Elaboração do plano de ação: definir objetivos, metas mensuráveis, estratégias, responsáveis, prazos e recursos (o quê, quem, quando, com quê). Ex.: linha de cuidado para HAS e DM, grupos de autocuidado, agenda programada, regulação e matriciamento para reduzir a fila da especializada. Contribuição: transforma intenção em ação verificável.","4) Execução: implementar com a equipe multiprofissional e a comunidade, articulando com a gestão municipal e com a rede (referência e contrarreferência). Contribuição: é onde o plano vira serviço.","5) Monitoramento e avaliação: indicadores de processo e resultado, reuniões periódicas, Relatório de Gestão, ajustes de rota. Contribuição: corrige o que não funciona e sustenta o que funciona.","Relacione com os instrumentos formais: o diagnóstico e as prioridades alimentam o Plano Municipal de Saúde; as metas anuais viram a PAS; o monitoramento gera o Relatório Anual de Gestão."],"takehome":"Para a insatisfação da população, a medida mais citada e mais cobrável é acolhimento com classificação de risco — cite nominalmente.","area":"IESC · Planejamento e gestão no SUS"},{"id":144,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2024.2","num":10}],"enunciado":["( AFYA PALMAS) Um médico está participando de uma auditoria no Sistema Único de Saúde (SUS) para avaliar a qualidade e a eficiência dos serviços prestados em um hospital. Para garantir uma auditoria eficaz, é essencial revisar e considerar diversos componentes do processo. Sobre os componentes essenciais para a realização de uma auditoria no âmbito da saúde pública, considere as seguintes afirmações:","I. Revisar os registros médicos e administrativos é fundamental para garantir que os processos e os procedimentos estejam sendo realizados de acordo com os padrões estabelecidos e identificar possíveis falhas ou irregularidades. II. A análise dos dados financeiros e orçamentários é crucial para verificar a conformidade com as normas de gestão financeira e assegurar que os recursos estão sendo utilizados de forma eficiente e transparente. III. Realizar entrevistas com os pacientes é uma prática comum na auditoria para obter feedback direto sobre a qualidade do atendimento recebido, mas não é essencial para o processo de auditoria.","Marque a alternativa que aponte as afirmativas corretas sobre os componentes essenciais da auditoria no SUS."],"alternativas":{"A":"I, II e III estão corretas.","B":"Apenas II e III estão corretas.","C":"Apenas I e III estão corretas.","D":"Apenas I e II estão corretas."},"correta":"D","oficial":{},"oficial_extra":["Correto. A revisão dos registros médicos e administrativos é essencial para garantir a conformidade com os padrões e identificar possíveis falhas.","Correto. A análise dos dados financeiros e orçamentários é crucial para verificar a gestão eficiente dos recursos.","Incorreto. Embora entrevistas com pacientes possam fornecer informações valiosas, não são um componente essencial para o processo de auditoria, que foca mais em registros e dados objetivos.","REFERÊNCIAS","TANAKA, L.C.T. Auditoria em serviços e sistemas de saúde. IN: KUAZAQUI, Edmir.; TANAKA, Luiz Carlos Takeshi. Marketing e gestão estratégica de serviços em saúde. Cengage Learning Brasil, 2007. Cap. 6. Disponível em: Minha Biblioteca.","CASTILHO C.M. Medicina privada. IN.: GUSSO, Gustavo. et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 66. Disponível em: Minha Biblioteca."],"refs":[],"tema":"Auditoria no SUS","conceito":"A auditoria do SUS (SNA — Sistema Nacional de Auditoria, Lei 8.689/1993) avalia a conformidade técnica, contábil, financeira e patrimonial dos serviços. Trabalha com evidência documental objetiva: prontuários, registros administrativos, faturamento, dados dos sistemas de informação e verificação in loco. Não confunda auditoria com pesquisa de satisfação nem com ouvidoria.","alt":{"A":"III é falsa ao ser classificada como essencial.","B":"III não é componente essencial.","C":"III não é componente essencial.","D":"CORRETA. I (registros médicos e administrativos) e II (dados financeiros e orçamentários) são os componentes essenciais."},"roteiro":[],"takehome":"Auditoria se apoia em documento e dado. Feedback do usuário é importante para a qualidade, mas pertence à ouvidoria e à avaliação de satisfação, não ao núcleo da auditoria.","area":"IESC · Planejamento e gestão no SUS"},{"id":145,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":1}],"enunciado":["(FIP GUANAMBI) Um médico de plantão recebe em um Hospital Regional (SUS) um paciente com suspeita de Infarto Agudo do Miocárdio (IAM). No entanto, o hospital está com a capacidade de leitos de UTI esgotada. O médico precisa tomar uma decisão que garanta o atendimento especializado de urgência ao paciente.","Com base no caso e nos princípios da regulação em saúde, assinale a alternativa que corresponde à ação apropriada a ser executada pelo médico."],"alternativas":{"A":"Realizar a estabilização clínica inicial do paciente e acionar a Central de Regulação para identificar e transferir o paciente para um hospital com leitos de UTI disponíveis.","B":"Informar o paciente e sua família sobre a falta de leitos disponíveis e sugerir que procurem um hospital privado para atendimento imediato.","C":"Encaminhar o paciente diretamente para o hospital mais próximo com UTI, sem consulta prévia à Central de Regulação, para otimizar o tempo de atendimento.","D":"Manter o paciente em observação na enfermaria, até que um leito da Unidade de Terapia Intensiva seja desocupado, no mesmo hospital."},"correta":"A","oficial":{},"oficial_extra":["A regulação em saúde tem como um de seus pilares a articulação entre unidades de saúde para garantir o acesso oportuno e equitativo ao atendimento especializado, como leitos de UTI.","A estabilização clínica inicial é essencial para garantir a segurança do paciente enquanto se organiza a transferência.","Acionar a Central de Regulação é obrigatório, pois ela coordena a alocação de recursos, como leitos, de forma transparente e eficiente.","Desconsiderar a regulação formal e indicar local privado para atendimento imediato, pode comprometer a saúde do paciente e retardar o atendimento, além de violar o princípio da universalidade do SUS.","Referência:","BRASIL. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. *Curso básico de regulação do Sistema Único de Saúde – SUS* [recurso eletrônico]. Brasília: Ministério da Saúde, 2016. 227 p.: il."],"refs":[],"tema":"Regulação de leitos — IAM sem UTI","conceito":"Mesmo cenário da questão 138. A Central de Regulação organiza o acesso com base em critério clínico e disponibilidade da rede, garantindo equidade. Estabilizar primeiro, regular em seguida.","alt":{"A":"CORRETA. Estabilização clínica inicial + acionar a Central de Regulação para transferência.","B":"Empurrar o paciente para o setor privado é negar o atendimento devido pelo SUS.","C":"Transferir por conta própria, sem regulação, pode levar a um serviço sem vaga e gera transferência irregular.","D":"Esperar passivamente um leito vagar compromete o prognóstico do IAM, que é tempo-dependente."},"roteiro":[],"takehome":"Regulação não é burocracia: é o que garante que o leito exista quando a ambulância chegar.","area":"IESC · Regulação em saúde"},{"id":146,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2025.1","num":2}],"enunciado":["(UNIDEP) Uma Unidade Básica de Saúde (UBS) atende uma população de 10.000 habitantes, sendo que 7.000 estão cadastrados no sistema de informação da APS. O município onde a UBS está localizada conta com três equipes de Saúde da Família (eSF) e uma equipe de Atenção Primária (eAP). O gestor municipal, preocupado com a sustentabilidade financeira dos serviços, precisa avaliar como o modelo de financiamento da APS impacta os repasses recebidos e a organização do cuidado.","Considerando essa situação, compare o modelo Previne Brasil (portaria nº 2.979/2019) com as diretrizes estabelecidas pela Portaria GM/MS nº 3.493, de 10 de abril de 2024, e responda:","a) Como cada modelo define a distribuição financeira para o município, em termos de critérios de repasse de recurso/componentes do financiamento?"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["Critérios de repasse de recursos.","No Previne Brasil, o financiamento da APS é baseado em três componentes principais: capitação ponderada, pagamento por desempenho e incentivos para ações estratégicas. A capitação ponderada considera o número de pessoas cadastradas na APS, ponderando fatores como vulnerabilidade socioeconômica. O pagamento por desempenho avalia indicadores de saúde, como cobertura vacinal e controle de doenças crônicas. Já os incentivos estratégicos englobam ações prioritárias, como saúde indígena e populações ribeirinhas. (0,75).","Já a portaria GM/MS nº 3.493/2024 traz alterações importantes, ampliando os critérios de financiamento para fortalecer a universalidade do acesso e a equidade. A nova regra busca garantir uma base fixa de financiamento, reduzindo a dependência exclusiva do número de cadastrados e do desempenho. Assim, municípios que apresentam dificuldades de cadastramento ou que atendem populações não registradas no sistema têm maior previsibilidade de recursos.","\"Art. 9º O cofinanciamento federal de apoio à manutenção da Atenção Primária à Saúde (APS) será constituído por:","I - componente fixo para manutenção das equipes de Saúde da Família - eSF e das equipes de Atenção Primária - eAP e recurso de implantação para eSF, eAP, equipes de Saúde Bucal - eSB e equipes Multiprofissionais - eMulti;","II - componente de vínculo e acompanhamento territorial para as eSF e eAP;","III - componente de qualidade para as eSF, eAP, eSB e eMulti;","IV - componente para implantação e manutenção de programas, serviços, profissionais e outras composições de equipes que atuam na APS;","V - componente para Atenção à Saúde Bucal; e","VI - componente per capita de base populacional para ações no âmbito da APS. (0,75)."],"refs":["BRASIL. Ministério da Saúde. Portaria GM/MS nº 3.493, de 10 de abril de 2024. Altera normas de financiamento da Atenção Primária à Saúde no âmbito do SUS. Diário Oficial da União: seção 1, Brasília, DF, 2024. Acesso em: 24 mar. 2025.","BRASIL. Ministério da Saúde. Portaria nº 2.979, de 12 de novembro de 2019. Institui o Programa Previne Brasil, que estabelece novo modelo de financiamento de custeio da Atenção Primária à Saúde no âmbito do SUS. Diário Oficial da União: seção 1, Brasília, DF, 2019. Acesso em: 24 mar. 2025."],"tema":"Financiamento da APS — Previne Brasil x Portaria 3.493/2024","conceito":"O Previne Brasil (Portaria 2.979/2019) substituiu o PAB fixo/variável por um modelo baseado em cadastro e desempenho, o que penalizava municípios com dificuldade de cadastramento. A Portaria GM/MS 3.493/2024 recompõe um componente FIXO e amplia os eixos, dando previsibilidade e reforçando a universalidade.","alt":{},"roteiro":["Previne Brasil (2019) — três componentes: (1) CAPITAÇÃO PONDERADA, pelo número de pessoas CADASTRADAS, ponderado por vulnerabilidade socioeconômica, perfil etário e tipologia rural-urbana; (2) PAGAMENTO POR DESEMPENHO, por indicadores (pré-natal, citopatológico, vacinação, controle de HAS e DM); (3) INCENTIVOS PARA AÇÕES ESTRATÉGICAS (saúde indígena, ribeirinha, Saúde na Hora, informatização etc.).","Problema do modelo para o caso: a UBS tem 10.000 habitantes e apenas 7.000 cadastrados — 3.000 pessoas ficam fora da capitação, ainda que sejam atendidas. O repasse fica abaixo da necessidade real.","Portaria 3.493/2024 — seis componentes (art. 9º): I) componente FIXO para manutenção das eSF e eAP, mais recurso de implantação para eSF, eAP, eSB e eMulti; II) componente de VÍNCULO E ACOMPANHAMENTO TERRITORIAL; III) componente de QUALIDADE; IV) componente para implantação e manutenção de programas, serviços e equipes; V) componente para ATENÇÃO À SAÚDE BUCAL; VI) componente PER CAPITA DE BASE POPULACIONAL.","Comparação a fazer explicitamente: o novo modelo reduz a dependência exclusiva do cadastro e do desempenho, reintroduz base fixa por equipe e acrescenta um per capita POPULACIONAL (pela população do IBGE, não pelos cadastrados) — o que beneficia diretamente um município como o do caso.","Efeito na organização do cuidado: com previsibilidade financeira, a equipe pode planejar a médio prazo em vez de perseguir indicadores; o eixo 'vínculo e acompanhamento territorial' valoriza adscrição e longitudinalidade em lugar de produtividade pontual."],"takehome":"Guarde a lógica da mudança: de 'paga quem cadastra e atinge meta' para 'base fixa por equipe + população total + vínculo + qualidade'.","area":"IESC · Financiamento da APS"},{"id":147,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":3}],"enunciado":["(AFYA PALMAS) O Dr. João, recém-formado em Medicina, decidiu abrir seu próprio consultório médico. Para garantir o sucesso do empreendimento, ele começou a planejar cuidadosamente as etapas necessárias para viabilizar sua clínica. Ao estudar sobre empreendedorismo na área da saúde, ele identificou que algumas etapas são essenciais para a abertura de um consultório médico de forma estruturada e sustentável.","Com base no processo de abertura de um consultório/clínica médica particular, analise os itens a seguir.","I. Elaborar um plano de negócios, definindo os serviços oferecidos, público-alvo, custos e projeções financeiras. II. Escolher a localização adequada, considerando fatores como acessibilidade, demanda local e concorrência. III. Realizar marketing e divulgação, criando identidade visual, presença digital e estratégias de captação de pacientes.","Assinale a alternativa que apresenta a combinação correta dos itens mencionados."],"alternativas":{"A":"Apenas os itens I e III estão corretos.","B":"Os itens I, II e III estão corretos.","C":"Apenas os itens II e III estão corretos.","D":"Apenas os itens I e II estão corretos."},"correta":"B","oficial":{"B":"Os itens I, II e III estão corretos."},"oficial_extra":["Justificativa:","Todos os três itens são fundamentais para a abertura e o sucesso de um consultório/clínica médica particular:","Item I - Correto: elaboração de um plano de negócios é essencial para estruturar o empreendimento, prever desafios e garantir a sustentabilidade financeira do consultório. Item II - Correto: a escolha da localização é um dos fatores mais importantes para o sucesso da clínica, pois influencia a acessibilidade dos pacientes, concorrência e demanda local. Item III - Correto: estratégias de marketing e divulgação são indispensáveis para atrair e fidelizar pacientes, seja por meio de identidade visual, presença digital ou ações de captação de público.","Referência:","TERRIM, Sara; MELO, Adler Araújo Ribeiro; JÁCOMO, Alfredo Luiz. Empreendedorismo em saúde: relato de um modelo de Empresa Júnior em Medicina. Revista de Medicina, v. 94, n. 2, p. 94-98, 2015."],"refs":[],"tema":"Empreendedorismo — etapas do consultório","conceito":"Variação da questão 137. Todos os itens são válidos. Sobre o marketing médico, lembre do limite ético: o CFM (Resolução 2.336/2023) permite divulgação informativa e educativa, mas veda sensacionalismo, autopromoção, divulgação de antes e depois, promessa de resultado e concorrência desleal.","alt":{"A":"Omite a localização, que é fator crítico de viabilidade.","B":"CORRETA. Plano de negócios, localização e marketing são todos essenciais.","C":"Omite o plano de negócios, que é a base de tudo.","D":"Omite marketing e divulgação, indispensáveis para captação inicial."},"roteiro":[],"takehome":"Marketing médico é permitido — desde que informativo. 'Antes e depois' e promessa de resultado são vedados pelo CFM.","area":"IESC · Gestão privada e empreendedorismo"},{"id":148,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":4}],"enunciado":["(UNIPTAN) Uma Unidade Básica de Saúde (UBS) está enfrentando desafios relacionados a conflitos interpessoais entre os profissionais da equipe multiprofissional. Alguns membros relatam dificuldades na comunicação e percebem uma falta de espaço para expressar suas preocupações, enquanto outros mencionam que a sobrecarga de trabalho tem contribuído para tensões no ambiente. O gestor da UBS busca implementar estratégias eficazes para lidar com os conflitos e melhorar a colaboração entre os profissionais.","Diante desse cenário, qual das estratégias a seguir é a mais adequada para promover a mediação dos conflitos interpessoais na equipe da UBS?"],"alternativas":{"A":"Estabelecer um rodízio de funções na equipe, reduzindo a permanência prolongada dos profissionais nos mesmos setores para evitar tensões interpessoais.","B":"Implementar reuniões estruturadas de equipe, com a mediação da gestão, para discutir dificuldades do ambiente de trabalho, incentivar a escuta ativa e buscar soluções colaborativas.","C":"Criar um canal anônimo para que os profissionais relatem insatisfações e direcionar as decisões sobre os conflitos exclusivamente à coordenação da unidade.","D":"Priorizar a divisão formal de tarefas, delimitando rigorosamente o papel de cada profissional e reduzindo a necessidade de interações no ambiente de trabalho."},"correta":"B","oficial":{"B":"Implementar reuniões estruturadas de equipe, com a mediação da gestão, para discutir dificuldades do ambiente de trabalho, incentivar a escuta ativa e buscar soluções colaborativas.","C":"Criar um canal anônimo para que os profissionais relatem insatisfações e direcionar as decisões sobre os conflitos exclusivamente à coordenação da unidade. Incorreta - Embora um canal anônimo possa permitir queixas, ele não promove o diálogo direto entre os envolvidos e pode dificultar a construção de soluções compartilhadas.","A":"Estabelecer um rodízio de funções na equipe, reduzindo a permanência prolongada dos profissionais nos mesmos setores para evitar tensões interpessoais. Incorreta. O rodízio de funções pode ser útil em algumas situações, mas não resolve os conflitos interpessoais, podendo apenas deslocá-los para outros setores da unidade.","D":"Priorizar a divisão formal de tarefas, delimitando rigorosamente o papel de cada profissional e reduzindo a necessidade de interações no ambiente de trabalho. Incorreta. A delimitação rígida das funções pode reduzir a interação entre os profissionais, mas não soluciona a origem dos conflitos e pode comprometer o trabalho em equipe."},"oficial_extra":["O uso de reuniões estruturadas com mediação adequada permite que os profissionais expressem suas preocupações e participem ativamente da resolução de conflitos. A escuta ativa e a comunicação aberta são fundamentais para fortalecer o trabalho em equipe e criar um ambiente mais colaborativo e produtivo.","Explicação das alternativas incorretas:","Referência:","LOCH, S. et al. Gestão da Unidade de Saúde. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 46."],"refs":[],"tema":"Mediação de conflitos (variação)","conceito":"Mesmo princípio da questão 140, com uma pista extra no enunciado: os profissionais citam 'falta de espaço para expressar preocupações' e sobrecarga. A solução tem que criar esse espaço e revisar o processo de trabalho.","alt":{"A":"Rodízio apenas desloca o conflito; não trata a causa.","B":"CORRETA. Reuniões estruturadas mediadas pela gestão, com escuta ativa e construção coletiva de soluções.","C":"Canal anônimo pode ajudar como complemento, mas concentrar a decisão na coordenação impede o diálogo direto entre os envolvidos.","D":"Delimitar rigidamente funções e reduzir interação é o oposto do trabalho multiprofissional e fragmenta o cuidado."},"roteiro":[],"takehome":"Se o enunciado diz 'falta espaço para falar', a resposta certa é a que cria esse espaço.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":149,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":5}],"enunciado":["(UNINOVAFAPI) Durante reunião com o conselho municipal de saúde do município Felicidade, o gestor municipal apresentou os instrumentos para o planejamento e a gestão do Sistema Único de Saúde (SUS). Entre esses, o gestor comentou sobre o instrumento de gestão que orienta o planejamento da saúde pública por quatro anos. Ele é a base para as atividades e a programação do SUS em cada esfera de governo e descreve os compromissos do governo para o setor saúde a partir das necessidades de saúde da população e as peculiaridades próprias de cada esfera.","Diante do exposto, marque o instrumento de gestão tratado no enunciado."],"alternativas":{"A":"Relatório de gestão.","B":"Plano de saúde.","C":"Prestação de contas.","D":"Programação anual de saúde."},"correta":"B","oficial":{"D":"Incorreta: relatório de gestão é o instrumento de administração com elaboração anual que permite ao gestor apresentar os resultados alcançados com a execução da programação anual de saúde e orienta eventuais redirecionamentos que se fizerem necessários no plano de saúde.","C":"Incorreta: prestação de contas é o demonstrativo das despesas com saúde integrante do relatório resumido da execução orçamentária."},"oficial_extra":["Correta: plano de saúde representa o instrumento central de planejamento para definição e implementação de todas as iniciativas no âmbito da saúde de cada esfera da gestão do SUS para o período de quatro anos. Ele explicita os compromissos do governo para o setor saúde e reflete, a partir da análise situacional, as necessidades de saúde da população e as peculiaridades próprias de cada esfera. A elaboração do plano de saúde deve ser orientada pelas necessidades de saúde da população.","Incorreta: programação anual de saúde é o instrumento que operacionaliza as intenções expressas no plano de saúde e tem por objetivo anualizar as metas do plano de saúde e prever a alocação dos recursos orçamentários a serem executados.","Referência:","BRASIL. Conselho Nacional de Secretários de Saúde. A Gestão do SUS / Conselho Nacional de Secretários de Saúde. – Brasília: CONASS, 2015. 133 p. ISBN 978-85-8071-027-4 – capítulo 2."],"refs":[],"tema":"Plano de Saúde","conceito":"Quatro anos + diretrizes, objetivos e metas + base para a programação = Plano de Saúde. É elaborado no primeiro ano de gestão, vale para os quatro anos seguintes e deve ser aprovado pelo Conselho de Saúde.","alt":{"A":"Relatório de gestão é anual e avalia o que foi executado.","B":"CORRETA. Plano de Saúde.","C":"Prestação de contas é o demonstrativo das despesas, integrante do relatório resumido da execução orçamentária.","D":"PAS é anual e operacionaliza o Plano."},"roteiro":[],"takehome":"A palavra 'quatro anos' no enunciado entrega a resposta: só o Plano de Saúde tem essa periodicidade.","area":"IESC · Planejamento e gestão no SUS"},{"id":150,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":6}],"enunciado":["(UNIDEP) O Dr. Pedro, médico especialista em saúde pública, foi designado para participar de uma auditoria no Sistema Único de Saúde (SUS) de uma cidade de médio porte. O hospital municipal, referência para diversos municípios vizinhos, tem enfrentado uma série de desafios relacionados à gestão de recursos e à qualidade da assistência prestada à população. A auditoria foi solicitada devido à suspeita de falhas na utilização de recursos financeiros e materiais, além de possíveis problemas na qualidade do atendimento médico.","Com base nesse cenário, assinale a alternativa que reflete as principais ações que Dr. Pedro deve adotar durante sua participação na auditoria."],"alternativas":{"A":"Dr. Pedro deve entrevistar os pacientes e a equipe de saúde, sem necessidade de revisar os registros médicos ou administrativos, já que a percepção dos usuários é o principal indicador da qualidade do serviço prestado.","B":"Dr. Pedro deve realizar uma análise dos processos administrativos, revisando a alocação de recursos financeiros, bem como realizar entrevistas com os pacientes sobre os tratamentos, visto que somente o médico que foi responsável por cada caso é quem tem acesso ao prontuário.","C":"Dr. Pedro deve examinar os registros médicos para verificar a conformidade dos tratamentos realizados, mas também revisar a alocação de recursos financeiros e materiais, como forma de garantir a correta utilização dos recursos do hospital e a transparência nos processos administrativos.","D":"Dr. Pedro deve realizar uma revisão detalhada dos registros médicos dos pacientes, sem considerar a análise dos processos administrativos, pois a auditoria do SUS foca exclusivamente na qualidade do atendimento médico."},"correta":"C","oficial":{},"oficial_extra":["Justificativa: a auditoria do SUS deve ser uma avaliação abrangente e multidimensional. Para garantir a eficácia do sistema, Dr. Pedro precisa verificar tanto a qualidade do atendimento (por meio dos registros médicos e tratamentos realizados) quanto a adequação da gestão de recursos (como a alocação de materiais e a utilização de verbas financeiras). A análise dos processos administrativos, como a gestão de escalas e compras, também é essencial para assegurar que o hospital está funcionando de maneira eficiente e em conformidade com as normas do SUS. A auditoria precisa considerar todos esses aspectos para identificar pontos de melhoria e assegurar a transparência na gestão pública. Além disso, o médico auditor deve ter acesso ao prontuário médico.","Referência:","BRASIL. Ministério da Saúde. Secretaria de Gestão Estratégica e Participativa. Departamento Nacional de Auditoria do SUS. Princípios, diretrizes e regras da auditoria do SUS no âmbito do Ministério da Saúde [recurso eletrônico] / Brasília: Ministério da Saúde, 2017. 48 p. : il. Modo de acesso: World Wide Web: http://bvsms.saude.gov.br/bvs/publicacoes/principios_diretrizes_regras_auditoria_SUS.pdf."],"refs":[],"tema":"Auditoria — escopo abrangente","conceito":"Complementa a questão 144: a auditoria do SUS é ao mesmo tempo ASSISTENCIAL (conformidade técnica dos procedimentos, prontuários, protocolos) e ADMINISTRATIVO-FINANCEIRA (alocação de recursos, faturamento, contratos, compras). Uma sem a outra é auditoria incompleta.","alt":{"A":"Dispensar registros médicos e administrativos esvazia a auditoria; percepção do usuário não é o principal indicador.","B":"Contém um erro factual: o auditor do SUS TEM acesso legal ao prontuário no exercício da função (com sigilo preservado). Dizer que só o médico assistente acessa é falso.","C":"CORRETA. Examinar registros médicos (conformidade assistencial) e revisar a alocação de recursos financeiros e materiais (transparência administrativa).","D":"Restringir à qualidade assistencial ignora o eixo de gestão de recursos, que motivou a auditoria."},"roteiro":[],"takehome":"Auditoria do SUS tem duas pernas: assistência e recursos. A alternativa que amputa uma delas está errada.","area":"IESC · Planejamento e gestão no SUS"},{"id":151,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":7}],"enunciado":["(UNIDEP) Um médico de um hospital público atende um paciente idoso, J.P., com insuficiência cardíaca descompensada, que foi admitido na emergência e necessita de internação para estabilização do quadro. Durante a anamnese, foi informado pelos cuidadores que J.P. possui um plano de saúde suplementar. Considerando os princípios do SUS assinale a alternativa que representa uma conduta correta do médico."],"alternativas":{"A":"Solicitar que a família assine um termo de responsabilidade declarando que abrirão mão do atendimento pelo SUS e buscarão internação em um hospital privado.","B":"Encaminhar imediatamente o paciente para um hospital privado conveniado ao seu plano de saúde, pois ele não tem direito à internação no SUS.","C":"Atender o paciente apenas na emergência, estabilizá-lo e orientá-lo a buscar internação junto ao seu plano de saúde, pois o SUS não deve assumir custos de internação.","D":"Internar o paciente no hospital público caso haja indicação clínica, garantindo o tratamento necessário, independentemente da existência de um plano de saúde."},"correta":"D","oficial":{},"oficial_extra":["O SUS é um sistema universal, e todos os cidadãos têm direito ao atendimento, independentemente de possuírem plano de saúde suplementar. A internação em hospital público deve ocorrer sempre que houver indicação médica, respeitando os critérios clínicos e administrativos do SUS. O paciente não pode ser recusado ou ter seu atendimento negado pelo fato de ter plano de saúde, conforme as diretrizes do Ministério da Saúde (BRASIL, 2017).","Referência:","Ministério da Saúde. Secretaria de Gestão Estratégica e Participativa. Departamento Nacional de Auditoria do SUS. Princípios, diretrizes e regras da auditoria do SUS no âmbito do Ministério da Saúde [recurso eletrônico] / Brasília: Ministério da Saúde, 2017. 48 p. : il. Modo de acesso: World Wide Web: http://bvsms.saude.gov.br/bvs/publicacoes/principios_diretrizes_regras_auditoria_SUS.pdf."],"refs":[],"tema":"Universalidade — paciente com plano de saúde","conceito":"A universalidade é princípio doutrinário do SUS: o acesso independe de contribuição, renda ou existência de plano privado. Havendo indicação clínica, interna-se. Quem faz o acerto financeiro depois é o sistema (a ANS prevê ressarcimento ao SUS pelas operadoras quando seus beneficiários usam a rede pública) — isso nunca recai sobre o paciente nem condiciona o atendimento.","alt":{"A":"Exigir termo de renúncia ao SUS é ilegal.","B":"Falso: ter plano não retira o direito ao SUS.","C":"Estabilizar e mandar o paciente 'resolver com o plano' é negar a internação indicada.","D":"CORRETA. Internar no hospital público havendo indicação clínica, independentemente do plano."},"roteiro":[],"takehome":"Universalidade não admite exceção por plano de saúde. O ressarcimento ao SUS é assunto entre a operadora e a ANS.","area":"IESC · SUS: origens e legislação"},{"id":152,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":8}],"enunciado":["Banco AFYA. Sobre a estruturação do Sistema Único de Saúde (SUS), analise as afirmações a seguir:","I. A Constituição Federal de 1988 estabeleceu a saúde como um direito de todos e dever do Estado, o que foi fundamental para a criação do SUS. II. A Lei 8.080/90 regulamentou a organização do SUS, definindo suas diretrizes, como a universalidade, a integralidade e a equidade no atendimento. III. A Lei 8.142/90 se refere à participação popular, por meio de conselhos e conferências de saúde.","A respeito dessas afirmações, é correto o que se afirma em:"],"alternativas":{"A":"I e II.","B":"I e III.","C":"II e III.","D":"I, II e III."},"correta":"D","oficial":{},"oficial_extra":["Todas as alternativas estão corretas, visto que a Constituição Federal de 1988 foi um marco na saúde pública e estabeleceu a saúde como um direito de todos e dever do Estado. E as leis 8.080/90 e 8.142/90 são as bases jurídicas do SUS, trazendo a regulamentação do SUS e a participação popular."],"refs":["BRASIL, Lei n. 8080 de 19 de setembro de 1990. BRASIL, Lei n. 8142 de 28 de dezembro de 1990."],"tema":"Marcos legais do SUS","conceito":"CF/1988 (arts. 196 a 200): saúde como direito de todos e dever do Estado, cria o SUS. Lei 8.080/1990: organização, direção, competências e princípios. Lei 8.142/1990: conselhos e conferências + transferências de recursos.","alt":{"A":"Omite a III, correta.","B":"Omite a II, correta.","C":"Omite a I, correta.","D":"CORRETA. As três afirmações estão certas."},"roteiro":[],"takehome":"Detalhe fino que outras provas cobram: a participação da comunidade é DIRETRIZ na CF (art. 198) e foi regulamentada pela 8.142.","area":"IESC · SUS: origens e legislação"},{"id":153,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.1","num":9}],"enunciado":["(FIP GUANAMBI) Uma Unidade Básica de Saúde (UBS) do município de Guanambi - BA está enfrentando um aumento significativo no número de pacientes que necessitam de exames especializados, os quais não estão disponíveis na UBS. Para atender à demanda crescente, a gestão da cidade está articulando a utilização de convênios com serviços privados, visando melhorar a oferta e garantir o acesso equitativo e eficaz aos usuários do sistema. Considerando a situação desta UBS, analise as ações abaixo.","I. A gestão deve estabelecer critérios claros e transparentes para a contratualização com os serviços privados, incluindo a definição de metas de desempenho e qualidade. II. A gestão deve monitorar regularmente os serviços contratados, avaliando indicadores de eficácia, eficiência e satisfação dos usuários. III. A gestão deve priorizar o acesso com base na capacidade de pagamento dos pacientes, otimizando os recursos disponíveis para a UBS. IV. A gestão deve realizar auditorias periódicas nos serviços privados contratados, visando identificar possíveis inconsistências ou ineficiências.","Quais das ações acima são corretas?"],"alternativas":{"A":"Apenas as ações II e III.","B":"Ações I, II, III e IV.","C":"Apenas as ações I, II e IV.","D":"Apenas as ações I e IV."},"correta":"C","oficial":{},"oficial_extra":["I. A gestão deve estabelecer critérios claros e transparentes para a contratualização com os serviços privados, incluindo a definição de metas de desempenho e qualidade.","Correta: essa ação é essencial para garantir que os serviços contratados atendam aos padrões necessários de qualidade e eficiência. A definição de critérios claros também assegura transparência no processo e facilita a avaliação dos resultados alcançados. Isso está alinhado ao objetivo de garantir um acesso equitativo e eficaz aos usuários.","II. A gestão deve monitorar regularmente os serviços contratados, avaliando indicadores de eficácia, eficiência e satisfação dos usuários.","Correta: o monitoramento contínuo permite que a gestão identifique e corrija eventuais problemas nos serviços prestados, garantindo a manutenção da qualidade e a satisfação dos usuários. Avaliar indicadores é uma prática essencial para assegurar que os recursos sejam bem aplicados e que as necessidades da população sejam atendidas.","III. A gestão deve priorizar o acesso com base na capacidade de pagamento dos pacientes, otimizando os recursos disponíveis para a UBS.","Incorreta: priorizar o acesso com base na capacidade de pagamento viola os princípios de equidade e universalidade do Sistema Único de Saúde (SUS), que garantem que todos os usuários tenham o mesmo direito de acesso, independentemente de sua condição financeira. Essa prática seria contrária ao objetivo de garantir equidade no sistema.","IV. A gestão deve realizar auditorias periódicas nos serviços privados contratados, visando identificar possíveis inconsistências ou ineficiências.","Correta: auditorias são fundamentais para assegurar a transparência e a eficácia dos serviços contratados, ajudando a identificar e corrigir eventuais inconsistências ou ineficiências. Essa prática também aumenta a responsabilidade dos prestadores de serviços e contribui para uma melhor utilização dos recursos públicos."],"refs":["Brasil. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. Curso básico de regulação do Sistema Único de Saúde – SUS [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção à Saúde, Departamento de Regulação, Avaliação e Controle de Sistemas. – Brasília: Ministério da Saúde, 2016. Pág. 179- 225.","Brasil. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde. Departamento de Regulação, Avaliação e Controle. Curso I: Regulação de Sistemas de Saúde do SUS: aula 4: Redes de Atenção à Saúde [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção Especializada à Saúde, Departamento de Regulação, Avaliação e Controle – Brasília: Ministério da Saúde, 2021. 40 p. il."],"tema":"Contratualização e monitoramento do privado","conceito":"Contratar serviço privado complementar exige critérios transparentes, metas de qualidade, monitoramento por indicadores e auditoria periódica. O que jamais pode entrar é critério econômico de acesso — isso violaria a universalidade e a equidade.","alt":{"A":"Inclui a III, que é frontalmente contrária aos princípios do SUS.","B":"Inclui a III, falsa.","C":"CORRETA. I, II e IV.","D":"Omite a II (monitoramento regular), que está correta."},"roteiro":[],"takehome":"Qualquer item que condicione acesso à capacidade de pagamento é falso por definição numa questão de SUS.","area":"IESC · Gestão privada e empreendedorismo"},{"id":154,"materia":"IESC 8","tipo":"discursiva","provas":[{"prova":"IESC 8 2025.1","num":10}],"enunciado":["(UNIPTAN) Você é um médico recém-nomeado para a coordenação de uma Unidade Básica de Saúde (UBS) em uma região urbana de médio porte. Ao assumir o cargo, percebe desafios na organização dos atendimentos, tempo excessivo de espera para consultas, falta de integração entre os profissionais de saúde e dificuldades no gerenciamento de insumos. Além disso, há queixas frequentes dos usuários sobre a qualidade do atendimento. Diante desse cenário, sua função envolve tanto a assistência clínica quanto a gestão dos processos da unidade, visando otimizar a oferta de serviços e melhorar a experiência dos pacientes.","Com base no texto apresentado, responda às questões a seguir.","A. Quais são os princípios fundamentais para o gerenciamento eficaz de uma UBS, considerando a necessidade de integração entre ações clínicas e administrativas? B. De que forma a utilização de ferramentas de gestão pode contribuir para a melhoria do atendimento e da satisfação do paciente na UBS?"],"alternativas":{},"correta":null,"oficial":{},"oficial_extra":["A. O gerenciamento eficaz de uma UBS deve estar fundamentado na integração entre as ações clínicas e administrativas, assegurando que a organização do trabalho seja voltada para a qualidade do atendimento e a resolutividade dos serviços. Para isso, é essencial adotar um modelo de gestão baseado na coordenação do cuidado, no trabalho multiprofissional e na utilização racional dos recursos. Além disso, a implementação de processos organizacionais que favoreçam a acessibilidade, a continuidade do cuidado e a humanização dos serviços são princípios fundamentais. (0,75).","B. As ferramentas de gestão, como protocolos clínicos, indicadores de desempenho e planejamento estratégico, possibilitam a otimização dos fluxos de atendimento e a alocação eficiente de recursos. A adoção de tecnologias da informação, como prontuários eletrônicos, facilita a comunicação entre os profissionais e melhora o acompanhamento dos pacientes. A gestão participativa, com envolvimento da equipe e dos usuários, também favorece um ambiente mais colaborativo e melhora a percepção de qualidade dos serviços oferecidos. (0,75).","Referência:","GUSSO, G.; NETO, P.P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2ª ed. Grupo A, 2018. Cap. 25."],"refs":[],"tema":"Gestão da UBS — integração clínica e administrativa","conceito":"Complementa a questão 135. A ideia central é 'gestão da clínica': organizar o processo de trabalho para que a assistência seja acessível, contínua, resolutiva e humanizada — não separar 'o médico que atende' do 'gestor que administra'.","alt":{},"roteiro":["A) Princípios fundamentais: integração entre ações clínicas e administrativas, com o gestor-clínico organizando o trabalho em função da resolutividade.","Coordenação do cuidado e trabalho multiprofissional: a UBS como ordenadora da rede, com referência e contrarreferência funcionando.","Acessibilidade e acolhimento com classificação de risco, substituindo a fila por ordem de chegada — resposta direta ao 'tempo excessivo de espera'.","Longitudinalidade e continuidade do cuidado: adscrição de clientela, agenda que reserve espaço para demanda espontânea e para consultas programadas.","Humanização e uso racional de recursos (gestão de insumos com previsão de consumo e estoque mínimo, evitando falta e desperdício).","Gestão participativa: reuniões de equipe, educação permanente e envolvimento do conselho local.","B) Ferramentas de gestão e seu efeito: protocolos clínicos e linhas de cuidado padronizam condutas e reduzem variabilidade; indicadores de desempenho (tempo de espera, absenteísmo, cobertura, satisfação) permitem medir e corrigir.","Planejamento estratégico e PDCA organizam metas e revisões periódicas; matriz de priorização ajuda a escolher onde atuar primeiro.","Tecnologia da informação: prontuário eletrônico e e-SUS melhoram comunicação entre profissionais, seguimento dos pacientes e produção de dados; agendamento eletrônico reduz espera e faltas.","Gestão de insumos com curva ABC e estoque mínimo; gestão participativa e ouvidoria para captar a percepção do usuário.","Resultado esperado: fluxos mais claros, menos espera, equipe integrada e maior satisfação do usuário."],"takehome":"Toda vez que o enunciado citar espera longa, insumo faltando e equipe desintegrada, as três palavras que pontuam são: acolhimento com classificação de risco, indicadores e reunião de equipe.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":155,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":1}],"enunciado":["(UNIDEP) Um médico recém-formado, com CRM, decidiu abrir uma clínica médica particular em sua cidade. Inicialmente, realizou a abertura de CNPJ e buscou orientações sobre a obtenção de alvará e licença da Vigilância Sanitária. Durante o planejamento inicial, percebeu que seria necessário organizar o processo em etapas para garantir a viabilidade do negócio e a qualidade do serviço prestado à população. Considerando as boas práticas de gestão e empreendedorismo em saúde, assinale a alternativa que apresenta a sequência mais adequada para a abertura de uma clínica médica."],"alternativas":{"A":"Adquirir equipamentos → contratar equipe → realizar estudo de mercado → desenvolver plano de negócios → escolher localização.","B":"Realizar estudo de mercado → escolher a localização → desenvolver plano de negócios → adquirir equipamentos → contratar equipe → realizar marketing e divulgação.","C":"Definir estratégias de marketing e divulgação → contratar equipe → escolher a localização → desenvolver plano de negócios → adquirir equipamentos.","D":"Desenvolver plano de negócios → adquirir equipamentos → escolher localização → contratar equipe → realizar marketing e divulgação."},"correta":"B","oficial":{"B":"Alternativa correta: “Realizar estudo de mercado → escolher a localização → desenvolver plano de negócios → adquirir equipamentos → contratar equipe → realizar marketing e divulgação.”","C":"“Definir estratégias de marketing e divulgação → contratar equipe → escolher a localização → desenvolver plano de negócios → adquirir equipamentos.”","D":"“Desenvolver plano de negócios → adquirir equipamentos → escolher localização → contratar equipe → realizar marketing e divulgação.”","A":"“Adquirir equipamentos → contratar equipe → realizar estudo de mercado → desenvolver plano de negócios → escolher localização.”"},"oficial_extra":["Justificativa: A abertura de uma clínica exige planejamento estruturado.","Estudo de mercado: identifica demanda, perfil dos pacientes, concorrência e viabilidade financeira.","Escolha da localização: deve ser feita considerando o acesso do público identificado na análise de mercado.","Plano de negócios: organiza custos, receitas, estratégias e projeções.","Aquisição de equipamentos: ocorre após o planejamento, garantindo compatibilidade com os serviços definidos.","Contratação da equipe: deve estar alinhada ao perfil da clínica e ao modelo de atendimento planejado.","Marketing e divulgação: é a etapa final, realizada apenas quando a clínica está preparada para receber os pacientes.","Erradas:","Erro: começa pelo marketing, o que não faz sentido sem clínica estruturada. A ordem inverte o planejamento lógico: divulgar antes de existir inviabiliza a estratégia.","Erro: coloca o plano de negócios antes da análise de mercado e da escolha da localização. Um plano de negócios feito sem diagnóstico prévio pode ser inadequado.","Erro: inverte completamente a lógica. Coloca gastos pesados (equipamentos e equipe) antes do planejamento, o que representa um risco de inviabilidade e desperdício."],"refs":["Manual de Procedimentos administrativos https://portal.cfm.org.br/images/mpa_pj.pdf. Acesso em: 07 mai. 2025.","Terrim S, Melo A, Jácomo A. Empreendedorismo em saúde: relato de um modelo de Empresa Júnior em Medicina. Rev. Med (São Paulo). 2015; 94(2): 94-8. doi: https://doi.org/10.11606/issn.1679-9836.v94i2p94-98. Acesso em: 07 mai. 2025."],"tema":"Sequência de abertura de clínica","conceito":"A lógica é: primeiro entender o mercado, depois decidir onde, depois planejar formalmente (o plano de negócios consolida os dados anteriores), só então investir em equipamento e equipe, e por fim divulgar. Investir antes de planejar é o erro clássico do empreendedor iniciante.","alt":{"A":"Começa comprando equipamento e contratando, antes mesmo de estudar o mercado — inversão total.","B":"CORRETA. Estudo de mercado → localização → plano de negócios → equipamentos → equipe → marketing.","C":"Começa por marketing, divulgando um serviço que ainda não existe.","D":"Compra equipamentos antes de escolher a localização, o que pode gerar incompatibilidade de espaço e de serviços."},"roteiro":[],"takehome":"Nas questões de sequência, a regra é: planejar → estruturar → operar → divulgar. Qualquer alternativa que comece gastando dinheiro está errada.","area":"IESC · Gestão privada e empreendedorismo"},{"id":156,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":2}],"enunciado":["(UNIREDENTOR) Um médico plantonista de um hospital público recebe um paciente do SUS com suspeita de infarto agudo do miocárdio (IAM). Após a avaliação inicial e a estabilização do quadro, o profissional verifica que a unidade hospitalar onde atua não possui leitos de UTI disponíveis para internação. Diante da necessidade de encaminhamento do paciente para um serviço com suporte adequado, qual deve ser a conduta correta, considerando o processo de regulação de leitos no SUS?"],"alternativas":{"A":"Transferir o paciente imediatamente para o hospital privado mais próximo, independentemente da disponibilidade de contrato com o SUS, para garantir assistência rápida.","B":"Manter o paciente na unidade hospitalar atual até que um leito de UTI seja disponibilizado, sem necessidade de contato com a regulação, pois a equipe médica deve garantir a vaga por conta própria.","C":"Solicitar que a família do paciente busque um hospital que possua vaga de UTI disponível, pois a transferência não é responsabilidade do serviço de origem.","D":"Acionar a Central de Regulação de Urgências, informando o quadro clínico do paciente e solicitando a alocação em um leito de UTI disponível na rede hospitalar referenciada."},"correta":"D","oficial":{},"oficial_extra":["A transferência para um hospital privado só pode ocorrer se houver contratualização prévia com o SUS. Além disso, a regulação de leitos deve ser feita por meio do sistema oficial de regulação de urgências.","A Central de Regulação de Urgências é responsável por avaliar a disponibilidade de leitos na rede e encaminhar o paciente para o serviço adequado, garantindo equidade e otimização dos recursos hospitalares.","O médico deve acionar a regulação, pois manter um paciente em ambiente inadequado pode comprometer seu prognóstico. A regulação é essencial para garantir o encaminhamento ágil e eficiente.","A busca por um leito adequado deve ser feita por meio da regulação oficial do SUS, e não pela família, garantindo que a alocação ocorra de maneira justa e organizada."],"refs":["Brasil. Ministério da Saúde. Secretaria de Atenção à Saúde. Departamento de Regulação, Avaliação e Controle de Sistemas. Curso básico de regulação do Sistema Único de Saúde – SUS [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção à Saúde, Departamento de Regulação, Avaliação e Controle de Sistemas. – Brasília: Ministério da Saúde, 2016. 227 p.: il. P. 179-225. Acesso em: 07 maio 2025.","Brasil. Ministério da Saúde. Secretaria de Atenção Especializada à Saúde. Departamento de Regulação, Avaliação e Controle. Curso I: Regulação de Sistemas de Saúde do SUS: aula 4: Redes de Atenção à Saúde [recurso eletrônico] / Ministério da Saúde, Secretaria de Atenção Especializada à Saúde, Departamento de Regulação, Avaliação e Controle – Brasília: Ministério da Saúde, 2021. 40 p. il. Acesso em: 07 maio 2025."],"tema":"Central de Regulação de Urgências","conceito":"Terceira questão do banco sobre o mesmo tema (ver 138 e 145) — o que mostra que a regulação é cobrança certa. O serviço de origem é responsável pelo paciente até a transferência efetiva, e a transferência se faz pela central, com transporte adequado e contato médico-a-médico.","alt":{"A":"Transferir para privado sem contratualização com o SUS é irregular.","B":"Garantir vaga 'por conta própria', sem a regulação, gera transferência sem respaldo e pode deixar o paciente sem destino.","C":"Transferir para a família a busca por vaga é omissão: a responsabilidade é do serviço de origem.","D":"CORRETA. Acionar a Central de Regulação de Urgências informando o quadro e solicitando leito de UTI na rede referenciada."},"roteiro":[],"takehome":"Três questões, um só gabarito: estabilizar + acionar a central. Não existe transferência regular fora da regulação.","area":"IESC · Regulação em saúde"},{"id":157,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":3}],"enunciado":["(AFYA Ipatinga) Em uma Unidade Básica de Saúde localizada em área urbana, a Equipe de Saúde da Família vem enfrentando dificuldades relacionadas à comunicação entre seus membros. Durante as reuniões semanais, alguns profissionais interrompem falas dos colegas, outros evitam expor suas opiniões por medo de conflitos, e já houve situações em que divergências pessoais impactaram a organização do fluxo de atendimentos. Esse cenário tem prejudicado o clima organizacional e a gestão do cuidado ofertado à população.","Diante dessa situação, considere as possíveis estratégias de mediação de conflitos:","I. Praticar a escuta ativa, garantindo que todos se sintam ouvidos nas decisões e resolução de problemas.","II. Evitar o diálogo sobre os conflitos, mantendo o foco exclusivo nas demandas assistenciais.","III. Promover reuniões periódicas da equipe para discutir problemas e alinhar estratégias coletivas.","IV. Substituir imediatamente os profissionais envolvidos em conflitos, sem investir em mediação ou educação permanente.","Após análise das assertivas acima, assinale a alternativa que contenha apenas as corretas."],"alternativas":{"A":"I e III, apenas.","B":"III e IV, apenas.","C":"I e II, apenas.","D":"I, II e III, apenas."},"correta":"A","oficial":{},"oficial_extra":["A escuta ativa é uma excelente ferramenta de gestão, pois coloca os pares para diálogo sobre os problemas que impactam o cotidiano do trabalho. Por isso a alternativa I está correta.","Evitar o diálogo sobre os conflitos não é uma atitude recomendada do ponto de vista da gestão, pois impede que as pessoas relatem os problemas e busquem soluções conjuntas. Por isso essa alternativa II está incorreta.","Promover reuniões periódicas de equipe para discutir problemas e alinhar estratégias de forma coletiva é uma excelente ferramenta para diálogo e tomadas de decisão compartilhadas. Por isso a alternativa III é correta.","Substituir imediatamente os profissionais envolvidos em conflitos por novos membros não seria a melhor estratégia. É necessário investir na qualificação dos profissionais, reforçando a importância da empatia e do trabalho em equipe. A substituição de profissionais seria sugerida somente caso não houvesse mudanças de comportamento dos integrantes após a utilização de diferentes ações de boas práticas. Por isso, alternativa IV incorreta.","Referência:","GUSSO, G. NETO, P.P. Gestão da clínica. In: GUSSO, Gustavo, et al. Tratado de Medicina de Família e Comunidade: Princípios, Formação e Prática. 2.ª ed. Grupo A, 2018. Cap. 25. Disponível em: Minha Biblioteca."],"refs":[],"tema":"Mediação de conflitos — itens","conceito":"Terceira questão do banco sobre conflito em equipe (ver 140 e 148). O par correto é sempre escuta ativa + espaço coletivo estruturado. Os itens falsos são sempre os de omissão ou punição.","alt":{"A":"CORRETA. I (escuta ativa) e III (reuniões periódicas).","B":"IV propõe substituir profissionais sem mediação — punição pura, contrária à educação permanente.","C":"II propõe evitar o diálogo, o que perpetua o conflito.","D":"Inclui a II, falsa."},"roteiro":[],"takehome":"Nessas questões, marque escuta ativa e reunião de equipe; descarte omissão, punição e demissão.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":158,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":4}],"enunciado":["(UNIDEP) Um paciente de 58 anos, portador de DPOC e diabetes mellitus, tem procurado repetidamente os serviços de urgência devido a crises de dispneia e descompensação glicêmica. Nos últimos seis meses, não compareceu a consultas agendadas na Atenção Primária à Saúde (APS) e, agora, retorna à Unidade Básica de Saúde (UBS) após novo episódio de instabilidade clínica.","Considerando as diretrizes do PlanificaSUS e o papel da APS na coordenação do cuidado de condições crônicas, assinale a alternativa que corresponde à conduta mais adequada que deve ser adotada pela equipe."],"alternativas":{"A":"Direcionar o paciente exclusivamente para acompanhamento ambulatorial especializado em pneumologia e endocrinologia, transferindo a responsabilidade de seguimento da APS.","B":"Inserir o paciente em protocolo de estratificação de risco, com acompanhamento multiprofissional contínuo, organização de linha de cuidado e articulação com a Atenção Especializada quando necessário.","C":"Limitar a atuação da APS a consultas de rotina para renovação de receitas e exames, entendendo que o seguimento longitudinal deve ser prioritariamente realizado pela atenção secundária e terciária.","D":"Manter o atendimento episódico na UBS, com foco na resolução imediata da queixa atual, reforçando apenas orientações de retorno espontâneo em caso de novos sintomas."},"correta":"B","oficial":{"B":"Inserir o paciente em protocolo de estratificação de risco, com acompanhamento multiprofissional contínuo, organização de linha de cuidado e articulação com a Atenção Especializada quando necessário. Correto. Essa é a conduta preconizada pelo PlanificaSUS, que reforça o papel da APS como ordenadora do cuidado, garantindo vínculo, longitudinalidade, acompanhamento multiprofissional e integração com outros pontos da rede. O manejo das condições crônicas exige essa abordagem planejada, não apenas ações pontuais.","D":"Manter o atendimento episódico na UBS, com foco na resolução imediata da queixa atual, reforçando apenas orientações de retorno espontâneo em caso de novos sintomas. Incorreto. Esse modelo fragmentado de cuidado não resolve a fragilidade da continuidade e reforça o uso inadequado da rede de urgência. O PlanificaSUS justamente busca superar a lógica de pronto-atendimento, fortalecendo o seguimento organizado e contínuo na APS.","A":"Direcionar o paciente exclusivamente para acompanhamento ambulatorial especializado em pneumologia e endocrinologia, transferindo a responsabilidade de seguimento da APS. Incorreto. Embora a Atenção Especializada possa ser necessária em determinados momentos, a APS não pode se eximir de seu papel de coordenadora do cuidado. Transferir totalmente a responsabilidade rompe a integralidade e a lógica das Redes de Atenção à Saúde.","C":"Limitar a atuação da APS a consultas de rotina para renovação de receitas e exames, entendendo que o seguimento longitudinal deve ser prioritariamente realizado pela atenção secundária e terciária. Incorreto. Essa conduta reduz a APS a um espaço burocrático e de baixo impacto clínico. O PlanificaSUS enfatiza que é justamente na APS que deve ocorrer o acompanhamento longitudinal e a coordenação do cuidado dos pacientes com condições crônicas."},"oficial_extra":[],"refs":["CONSELHO NACIONAL DE SECRETÁRIOS DE SAÚDE (Brasil). Planificação da atenção à saúde: um instrumento de gestão e organização da atenção primária e da atenção ambulatorial especializada nas redes de atenção à saúde. Brasília: CONASS, 2018. 301 p. (CONASS documenta, 31). Disponível em: https://www.conass.org.br/biblioteca/caderno-conass- documenta-n-31/. Acesso em: 07 maio 2025."],"tema":"Coordenação do cuidado em condições crônicas (PlanificaSUS)","conceito":"O paciente do caso é o retrato do modelo fragmentado: usa a urgência repetidamente e falta às consultas programadas. O PlanificaSUS reorganiza o cuidado de condições crônicas na lógica do Modelo de Atenção às Condições Crônicas: estratificação de risco, linha de cuidado, plano de cuidado compartilhado, atendimento multiprofissional, grupos e apoio ao autocuidado, com a APS como coordenadora e ordenadora da rede.","alt":{"A":"Transferir totalmente para a especializada rompe a coordenação do cuidado; a APS não se exime.","B":"CORRETA. Estratificação de risco, acompanhamento multiprofissional contínuo, linha de cuidado e articulação com a atenção especializada quando necessário.","C":"Reduzir a APS a renovar receita é justamente o que o PlanificaSUS combate.","D":"Atendimento episódico perpetua o ciclo de descompensação e uso da urgência."},"roteiro":[],"takehome":"Paciente crônico que vive na urgência é falha de coordenação, não 'falta de adesão'. A resposta certa sempre envolve estratificar e vincular.","area":"IESC · Gerenciamento da unidade de saúde"},{"id":159,"materia":"IESC 8","tipo":"objetiva","provas":[{"prova":"IESC 8 2025.2","num":5}],"enunciado":["(AFYA Itabuna) Um novo gestor municipal de saúde precisa estruturar o processo de planejamento da secretaria. Ele sabe que o planejamento no SUS deve ser ascendente e integrado, e que existem instrumentos oficiais que norteiam a gestão e a alocação de recursos. Sua equipe, entretanto, está em dúvida sobre quais documentos devem ser elaborados e utilizados para planejar, executar e avaliar as ações de saúde no município.","Diante disso, assinale a alternativa que apresenta instrumentos específicos e oficiais de planejamento e gestão do SUS que devem ser elaborados para garantir a operacionalização do sistema em cada esfera de governo."],"alternativas":{"A":"Plano de Saúde, Programação Anual de Saúde (PAS) e Relatório de Gestão.","B":"Plano Plurianual (PPA), Lei de Diretrizes Orçamentárias (LDO) e Lei Orçamentária Anual (LOA).","C":"Plano Nacional de Saúde, Termo de Compromisso de Gestão e Contrato Organizativo de Ação Pública da Saúde.","D":"Plano Diretor de Regionalização, Relatório Detalhado Quadrimestral e Programa Nacional de Sa
