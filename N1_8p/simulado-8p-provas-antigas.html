      ? `<div class="sec"><div class="sech">Conceito-chave</div><p>${esc(q.conceito)}</p></div>` : '';

    let porAlt = '';
    if (!disc && q.alt && Object.keys(q.alt).length){
      porAlt = `<div class="sec"><div class="sech">Alternativa por alternativa</div>` +
        Object.keys(q.alt).sort().map(L=>
          `<div class="altcom ${L===q.correta?'c':''}"><span class="k">${L}</span><span>${esc(q.alt[L])}</span></div>`
        ).join('') + `</div>`;
    }

    let roteiro = '';
    if (q.roteiro && q.roteiro.length){
      roteiro = `<div class="sec"><div class="sech">${disc?'Roteiro de resposta':'Desenvolvimento'}</div>
        <ol class="rot">${q.roteiro.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;
    }

    const take = q.takehome
      ? `<div class="sec"><div class="takehome">${esc(q.takehome)}</div></div>` : '';

    const ofic = [];
    if (q.oficial && Object.keys(q.oficial).length)
      ofic.push(...Object.keys(q.oficial).sort().map(L=>`(${L}) ${q.oficial[L]}`));
    if (q.oficial_extra && q.oficial_extra.length) ofic.push(...q.oficial_extra);
    const oficHtml = ofic.length
      ? `<details><summary>Ver gabarito comentado original da prova</summary>
          <div class="body">${paras(ofic)}
          ${q.refs && q.refs.length ? `<div class="refs"><b>Referências:</b> ${esc(q.refs.join(' | '))}</div>`:''}
          </div></details>` : '';

    fb = `<div class="fb show">${head}${conceito}${porAlt}${roteiro}${take}${oficHtml}</div>`;
  } else if (disc){
    fb = `<div style="margin-top:18px"><button class="btn" id="breveal">Ver resposta comentada</button></div>`;
  }

  app.innerHTML = `<div class="card">
    <div class="tags">${tags}</div>
    ${q.tema?`<div class="tema">${esc(q.area.split(' · ')[1] || q.area)} › ${esc(q.tema)}</div>`:''}
    <div class="enun">${paras(q.enunciado)}</div>
    ${alts}
    ${fb}
  </div>`;

  app.querySelectorAll('.alt:not(:disabled)').forEach(b=>{
    b.onclick = () => { resp[q.id] = b.dataset.l; render(); };
  });
  const rv = document.getElementById('breveal');
  if (rv) rv.onclick = () => { revelada.add(q.id); render(); };

  document.getElementById('pos').textContent = (idx+1) + ' / ' + lista.length;
  document.getElementById('bprev').disabled = idx===0;
  document.getElementById('bnext').textContent = idx===lista.length-1 ? 'Recomeçar' : 'Próxima ›';
  placar();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------------- eventos ---------------- */
document.getElementById('bfil').onclick = () =>
  document.getElementById('filtros').classList.toggle('open');

document.getElementById('bshuf').onclick = () => { F.ordem='aleatoria';
  document.querySelectorAll('#fordem .chip').forEach(c=>c.classList.toggle('on', c.dataset.o==='aleatoria'));
  aplica(); };

document.getElementById('bthm').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
};

document.getElementById('fmat').onclick = e => {
  const c = e.target.closest('.chip'); if(!c) return;
  const m = c.dataset.m;
  F.mat.has(m) ? F.mat.delete(m) : F.mat.add(m);
  c.classList.toggle('on');
  aplica();
};
document.getElementById('ftipo').onclick = e => {
  const c = e.target.closest('.chip'); if(!c) return;
  F.tipo = c.dataset.t;
  document.querySelectorAll('#ftipo .chip').forEach(x=>x.classList.toggle('on', x===c));
  aplica();
};
document.getElementById('fordem').onclick = e => {
  const c = e.target.closest('.chip'); if(!c) return;
  F.ordem = c.dataset.o;
  document.querySelectorAll('#fordem .chip').forEach(x=>x.classList.toggle('on', x===c));
  aplica();
};
document.getElementById('fprova').onchange = e => { F.prova = e.target.value; aplica(); };
document.getElementById('ftema').onchange  = e => { F.tema  = e.target.value; aplica(); };

document.getElementById('bprev').onclick = () => { if(idx>0){idx--;render();} };
document.getElementById('bnext').onclick = () => {
  if (idx < lista.length-1) idx++; else idx = 0;
  render();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') document.getElementById('bnext').click();
  if (e.key === 'ArrowLeft')  document.getElementById('bprev').click();
  const q = lista[idx];
  if (q && q.tipo==='objetiva' && resp[q.id]===undefined){
    const L = e.key.toUpperCase();
    if (q.alternativas[L]!==undefined){ resp[q.id]=L; render(); }
  }
});

build(); aplica();
</script>
</body>
</html>
