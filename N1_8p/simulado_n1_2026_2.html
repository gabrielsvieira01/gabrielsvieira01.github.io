<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado N1 2026.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1f; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
  --line:rgba(167,139,250,.22); --text:#e8eaf8; --muted:#a4aacd; --soft:#c9cdea;
  --pri:#9f7bff; --ci:#b99cff; --ham:#ff9d5c; --iesc:#5ee6d0;
  --ok:#4ade80; --okbg:rgba(74,222,128,.10); --bad:#ff6b8b; --badbg:rgba(255,107,139,.10); --warn:#fbbf24;
  --ff-head:Outfit,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--text); font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;
  background:
    radial-gradient(900px 520px at 0% -8%, rgba(98,54,214,.45), transparent 62%),
    radial-gradient(760px 480px at 100% 4%, rgba(20,110,160,.30), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, rgba(120,40,160,.25), transparent 60%),
    var(--bg);
  background-attachment:fixed; min-height:100vh;
}
button{font:inherit; color:inherit}
.wrap{max-width:780px; margin:0 auto; padding:22px 16px 120px}
h1{font-family:var(--ff-head); font-weight:800; letter-spacing:-.02em; line-height:1.05; margin:0 0 4px;
  font-size:clamp(1.8rem,6.5vw,2.6rem);
  background:linear-gradient(95deg,#d9c9ff 0%,#9f7bff 45%,#5ee6d0 100%); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{color:var(--muted); margin:0 0 16px; font-size:.95rem}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 40px rgba(6,0,30,.35)}
.filters{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.row .lbl{font-size:.78rem; color:var(--muted); margin-right:4px; min-width:52px}
.chipbtn{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:.86rem; font-weight:600; cursor:pointer}
.chipbtn[aria-pressed="true"]{background:rgba(159,123,255,.22); border-color:var(--pri); color:#fff}
.chipbtn:focus-visible,.btn:focus-visible,.alt:focus-visible,.dot:focus-visible{outline:2px solid var(--pri); outline-offset:2px}
.status{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.9rem; color:var(--soft); margin:6px 0 8px}
.status b{color:#fff; font-family:var(--ff-head)}
.bar{height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:14px}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#9f7bff,#5ee6d0); border-radius:99px; transition:width .25s}
.qcard{padding:18px}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.tag{font-size:.74rem; font-weight:600; padding:2px 9px; border-radius:999px; border:1px solid currentColor; line-height:1.55; white-space:nowrap}
.tag.CI{color:var(--ci)} .tag.HAM{color:var(--ham)} .tag.IESC{color:var(--iesc)}
.tag.t{color:var(--soft); border-color:rgba(201,205,234,.35)}
.tag.o{color:var(--muted); border-style:dashed; border-color:rgba(164,170,205,.45)}
.enun{white-space:pre-line; margin:0 0 16px; font-size:1.01rem}
.alts{display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none}
.alt{display:flex; gap:12px; width:100%; text-align:left; padding:12px 14px; border-radius:14px; cursor:pointer;
  background:var(--card2); border:1.5px solid rgba(167,139,250,.18); transition:border-color .15s, background .15s}
.alt:hover{border-color:rgba(159,123,255,.55)}
.alt .L{flex:0 0 30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--ff-head); font-weight:700;
  background:rgba(159,123,255,.16); border:1px solid var(--line); font-size:.9rem}
.alt .x{flex:1; padding-top:3px}
.alt[aria-checked="true"]{border-color:var(--pri); background:rgba(159,123,255,.14)}
.alt[aria-checked="true"] .L{background:var(--pri); color:#fff}
.alt.done{cursor:default}
.alt.right{border-color:var(--ok); background:var(--okbg)}
.alt.right .L{background:var(--ok); color:#06210f; border-color:var(--ok)}
.alt.wrong{border-color:var(--bad); background:var(--badbg)}
.alt.wrong .L{background:var(--bad); color:#2a0610; border-color:var(--bad)}
.why{margin-top:8px; font-size:.92rem; color:var(--soft)}
.why strong{font-weight:600}
.why .ok{color:var(--ok)} .why .no{color:var(--bad)}
.feedback{margin:0 0 14px; padding:12px 14px; border-radius:14px; font-weight:600; display:flex; gap:10px; align-items:center}
.feedback.ok{background:var(--okbg); border:1px solid rgba(74,222,128,.4); color:#c9f7da}
.feedback.no{background:var(--badbg); border:1px solid rgba(255,107,139,.4); color:#ffd3dc}
.feedback svg{flex:0 0 22px}
.box{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--card2); border-left:4px solid var(--c,var(--pri)); font-size:.95rem}
.box h3{margin:0 0 4px; font-family:var(--ff-head); font-size:.95rem; color:#fff}
.box p{margin:0}
.box.note{--c:var(--warn)}
.actions{margin-top:16px; display:flex; gap:10px}
.btn{border:1px solid var(--line); background:var(--card2); border-radius:12px; padding:11px 16px; font-weight:600; cursor:pointer; min-height:46px}
.btn.primary{background:linear-gradient(95deg,#8b62ff,#6f4ae8); border-color:transparent; color:#fff; flex:1}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.navbar{position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,11,31,.2),rgba(7,11,31,.95) 35%); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.navin{max-width:780px; margin:0 auto; display:flex; gap:10px}
.navin .btn{flex:1}
details.map{margin-top:14px; padding:0}
details.map summary{cursor:pointer; padding:12px 16px; font-family:var(--ff-head); font-weight:600; list-style:none; display:flex; justify-content:space-between}
details.map summary::-webkit-details-marker{display:none}
details.map summary::after{content:"+"; color:var(--pri); font-size:1.2rem; line-height:1}
details.map[open] summary::after{content:"−"}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; padding:0 16px 16px}
.dot{height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card2); font-size:.82rem; font-weight:600; cursor:pointer}
.dot.r{background:var(--okbg); border-color:var(--ok); color:var(--ok)}
.dot.w{background:var(--badbg); border-color:var(--bad); color:var(--bad)}
.dot.cur{outline:2px solid #fff; outline-offset:1px}
.legend{font-size:.8rem; color:var(--muted); padding:0 16px 12px}
.result{padding:20px}
.big{font-family:var(--ff-head); font-size:3rem; font-weight:800; line-height:1}
.blocks{display:grid; gap:10px; margin:16px 0}
.bl{display:grid; grid-template-columns:56px 1fr 96px; gap:10px; align-items:center; font-size:.92rem}
.bl .track{height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.bl .track i{display:block; height:100%; border-radius:99px}
.misses{list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:6px}
.misses button{width:100%; text-align:left; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 12px; cursor:pointer; font-size:.92rem}
.misses small{color:var(--muted)}
.kbd{font-size:.78rem; color:var(--muted); margin-top:14px; text-align:center}
.empty{padding:22px; text-align:center; color:var(--soft)}
@media (max-width:520px){ body{font-size:15.5px} .qcard{padding:15px} .kbd{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <h1>Simulado N1 2026.2</h1>
  <p class="sub" id="sub"></p>

  <div class="filters card" style="padding:12px 14px">
    <div class="row" role="group" aria-label="Bloco"><span class="lbl">Bloco</span>
      <button class="chipbtn" data-f="b" data-v="all">Todos</button>
      <button class="chipbtn" data-f="b" data-v="CI">CI</button>
      <button class="chipbtn" data-f="b" data-v="HAM">HAM</button>
      <button class="chipbtn" data-f="b" data-v="IESC">IESC</button>
    </div>
    <div class="row" role="group" aria-label="Origem"><span class="lbl">Origem</span>
      <button class="chipbtn" data-f="o" data-v="all">Todas</button>
      <button class="chipbtn" data-f="o" data-v="prova">Provas antigas</button>
      <button class="chipbtn" data-f="o" data-v="nova">Inéditas e adaptadas</button>
    </div>
  </div>

  <div id="app"></div>

  <details class="map card" id="mapbox">
    <summary><span>Mapa das questões</span></summary>
    <div class="legend">Verde acertou, vermelho errou. Toque para ir à questão.</div>
    <div class="grid" id="grid"></div>
  </details>
  <p class="kbd">Atalhos: A–D ou 1–4 marcam · Enter confirma ou avança · ← → navegam</p>
</main>

<nav class="navbar" aria-label="Navegação entre questões">
  <div class="navin">
    <button class="btn" id="prev">← Anterior</button>
    <button class="btn" id="next">Próxima →</button>
  </div>
</nav>

<script>
const DATA = [{"id": "CI_2024_2_1", "b": "CI", "t": "Icterícia neonatal", "o": "CI 24.2 Q1", "e": "Recém-nascido (RN), a termo, 36h de vida, parto normal. Mãe está aguardando a alta hospitalar junto com o bebê. Nega intercorrências na gestação. Ao examinar o RN, percebe-se que o mesmo encontra-se ictérico (zona III de Kramer). Solicita-se os seguintes exames laboratoriais: bilirrubina total de 13 mg/dl, bilirrubina indireta de 12 mg/dl e bilirrubina direta de 1 mg/dl. Tipagem sanguínea do RN A positivo, tipagem sanguínea da mãe: O positivo. Baseando-se no exame físico do RN, nos exames laboratoriais e no nomograma de Bhutani, sua conduta é:\n(Na prova original havia a figura do nomograma de Bhutani.)", "a": [{"x": "alta hospitalar, e solicitar que o recém-nascido retorne ao serviço em 48h para reavaliação.", "ok": false, "w": "Alta com bilirrubina acima do P95 às 36 h e provável incompatibilidade ABO é insegura: o RN pode atingir nível neurotóxico antes do retorno."}, {"x": "contraindicar a alta, e inicia fototerapia imediatamente, com reavaliação clínica em 12h.", "ok": false, "w": "A fototerapia está certa, mas no risco alto a bilirrubina precisa ser dosada de novo em poucas horas; reavaliar só clinicamente em 12 h é insuficiente."}, {"x": "alta; solicitar retorno em 72 horas, com bilirrubinas total e frações, hemograma e reticulócitos.", "ok": false, "w": "Dar alta com retorno em 72 h ignora o risco alto e o pico que ainda está por vir (3º–5º dia)."}, {"x": "contraindicar a alta, e inicia fototerapia imediatamente, com reavaliação das bilirrubinas em 4-8h.", "ok": true, "w": "BT 13 mg/dL com 36 h fica acima do P95 (risco alto), com mãe O e RN A: suspende a alta, inicia fototerapia e repete a bilirrubina em 4–8 h."}], "k": "Icterícia importante nas primeiras 36–48 h com mãe O e RN A ou B: pensar em incompatibilidade ABO e não dar alta.", "n": null}, {"id": "CI_2024_2_2", "b": "CI", "t": "Neoplasias na infância", "o": "CI 24.2 Q2", "e": "Uma mãe traz seu filho de 7 anos à consulta, preocupada com um nódulo na região do pescoço, que notou há uma semana. A criança não apresenta febre, perda de peso ou sudorese noturna, mas teve uma amigdalite recentemente. O médico solicitou um hemograma, cujo resultado mostra: leucócitos 9.500/mm³ (normal: 4.000-11.000/mm³), hemoglobina 12 g/dL (normal: 11-14 g/dL), plaquetas 300.000/mm³ (normal: 150.000-450.000/mm³) e linfócitos 45% (normal: 25-45%). Ao exame físico, há uma linfonodomegalia cervical móvel e dolorosa. Qual é a hipótese diagnóstica mais provável para este caso?", "a": [{"x": "Linfonodomegalia reacional.", "ok": true, "w": "Nódulo recente após amigdalite, sem febre, perda de peso ou sudorese e com hemograma normal é o quadro típico de linfonodo reacional; a conduta é observar."}, {"x": "Leucemia Linfoblástica Aguda (LLA).", "ok": false, "w": "LLA vem com citopenias ou blastos, palidez, petéquias e dor óssea; hemograma normal praticamente afasta."}, {"x": "Linfoma de Hodgkin.", "ok": false, "w": "Hodgkin é mais de adolescente, com linfonodo endurecido, indolor, persistente e sintomas B ou massa mediastinal."}, {"x": "Anemia aplástica", "ok": false, "w": "Anemia aplástica é pancitopenia e não causa linfonodomegalia."}], "k": "Linfonodo pequeno, móvel, após infecção e com hemograma normal: observar por 2–4 semanas.", "n": null}, {"id": "CI_2024_2_4", "b": "CI", "t": "Sangramento 1ª metade", "o": "CI 24.2 Q4", "e": "A.S.L., 17 anos de idade, primigesta, procura a emergência obstétrica devido a sangramento vaginal e dor intensa em andar inferior do abdome, sobretudo à esquerda. Ainda não iniciou o pré-natal, não possui nenhum exame laboratorial ou de imagem, exceto beta HCG que realizou há 07 dias e encontra-se reator. Refere última menstruação há 02 meses. Ao exame físico, apresenta intensa palidez cutâneo mucosa, pressão arterial de 80x50 mmHg e frequência cardíaca de 135 bpm. Abdome doloroso à palpação superficial e profunda, sobretudo em fossa ilíaca esquerda. Realizada culdocentese com extração de fluido sanguinolento. Dentre as afirmativas abaixo, marque a conduta mais adequada.", "a": [{"x": "Realizar laparotomia para identificar foco de sangramento e controle do mesmo.", "ok": true, "w": "Atraso menstrual, dor em fossa ilíaca, β-hCG positivo, choque e culdocentese com sangue indicam ectópica rota; paciente instável vai direto para cirurgia."}, {"x": "Aguardar realização de exame de imagem, principalmente ultrassonografia transvaginal para confirmação diagnóstica antes do tratamento cirúrgico.", "ok": false, "w": "Esperar USG em paciente chocada atrasa o controle de uma hemorragia que mata."}, {"x": "Iniciar uterotônicos para expulsão de restos ovulares antes da curetagem ou aspiração manual intrauterina.", "ok": false, "w": "Uterotônico e esvaziamento uterino tratam abortamento, não gravidez ectópica."}, {"x": "Realizar laparoscopia para anexectomia e controle do sangramento.", "ok": false, "w": "Laparoscopia exige estabilidade e equipe preparada, e anexectomia só resolveria se o implante fosse tubário ou ovariano, o que ainda não se sabe."}], "k": "Ectópica com instabilidade hemodinâmica = cirurgia imediata, sem esperar exame de imagem.", "n": null}, {"id": "CI_2024_2_6", "b": "CI", "t": "Icterícia neonatal", "o": "CI 24.2 Q6", "e": "A médica da Estratégia de Saúde da Família realiza a visita domiciliar de um recém-nascido de três dias. O bebê apresenta icterícia neonatal, com coloração amarelada evidente na face e no tronco, estendendo-se até a região umbilical, correspondendo à zona 3 de Kramer. A mãe relata que o bebê está amamentando bem, com seis episódios de diurese e três de evacuação nas últimas 24 horas. Não há histórico de doenças na família, e o parto foi cesáreo, sem intercorrências. O bebê nasceu com 36 semanas. O exame físico não mostra alterações além da icterícia. Com base nesses dados, qual a conduta correta?", "a": [{"x": "Encaminhar para hospitalização e possíveis transfusões de troca, considerando a extensão da icterícia.", "ok": false, "w": "Exsanguineotransfusão depende do valor da bilirrubina e de sinais neurológicos, não da extensão visual; o RN está bem."}, {"x": "Solicitar Bilirrubina sérica total e, se valor do normograma de Bhutani estiver acima do percentil 75, iniciar fototerapia.", "ok": true, "w": "A extensão da icterícia só estima a bilirrubina: é preciso dosá-la e aplicar o nomograma antes de decidir fototerapia."}, {"x": "Iniciar fototerapia intensiva imediatamente na unidade de saúde, sem necessidade de exames adicionais.", "ok": false, "w": "Fototerapia intensiva sem dosar bilirrubina é tratar às cegas, e não é feita na UBS."}, {"x": "Realizar banhos de sol em domicílio por 30 minutos diários, expondo tronco em membros e reavaliar em 48 horas.", "ok": false, "w": "Banho de sol não trata icterícia e expõe o RN a queimadura e hipotermia."}], "k": "Kramer não substitui a dosagem de bilirrubina.", "n": null}, {"id": "CI_2024_2_7", "b": "CI", "t": "Demências", "o": "CI 24.2 Q7", "e": "O Sr. Paulo de 80 anos foi levado a consulta psiquiátrica pelo seu filho. No exame psiquiátrico o médico observou alterações cognitivas como perda da memória recente, dificuldade de nomeação de objetos, redução da fluência verbal e dificuldade de cálculos. Ao término da anamnese e do exame físico o diagnóstico foi de Doença de Alzheimer em estágio inicial. Dentre as opções abaixo, qual o melhor esquema terapêutico farmacológico para o caso apresentado?", "a": [{"x": "Memantina 10mg, associada a Ganlantamina 8mg, duas vezes ao dia.", "ok": false, "w": "Memantina é para fase moderada a grave; associá-la na fase inicial não traz benefício."}, {"x": "Memantina 10mg, um comprimido, de 12/12 horas.", "ok": false, "w": "Memantina isolada não é a primeira escolha na doença de Alzheimer leve."}, {"x": "Rivastigmina 1,5mg, um comprimido, de 12/12 horas.", "ok": true, "w": "Alzheimer leve: inibidor da acetilcolinesterase. Rivastigmina começa com 1,5 mg de 12/12 h e sobe gradualmente."}, {"x": "Donepezila 10mg associada a Memantina 10mg, uma vez ao dia.", "ok": false, "w": "Donepezila + memantina é esquema da fase moderada a grave, e a donepezila começa com 5 mg."}], "k": "Leve a moderada = inibidor da colinesterase; memantina entra na moderada a grave.", "n": null}, {"id": "CI_2024_2_9", "b": "CI", "t": "Sangramento 1ª metade", "o": "CI 24.2 Q9", "e": "Maria, 25 anos, G1P0, está com 10 semanas de gestação confirmada por ultrassonografia realizada há três semanas. Ela comparece à Unidade Básica de Saúde (UBS) relatando sangramento vaginal leve, de coloração marrom, iniciado há um dia, associado a leve dor abdominal em cólica. Não apresenta febre, e sua pressão arterial está normal (120/80 mmHg). Durante o exame físico, observa-se que o colo uterino está fechado, sem sinais de dilatação. Não há sinais de infecção ou outras anormalidades. Diante desse quadro, identifique a alternativa que apresenta a conduta mais adequada para Maria considerando os achados do exame físico.", "a": [{"x": "Encaminhar a paciente imediatamente para o serviço de urgência e emergência para realização de curetagem uterina.", "ok": false, "w": "Curetagem com colo fechado e sem saber se o embrião está vivo é conduta errada."}, {"x": "Recomendar repouso absoluto em casa, sem necessidade de exames complementares, e agendar retorno em uma semana.", "ok": false, "w": "Repouso absoluto não muda a evolução, e a USG não pode ser dispensada: ela confirma vitalidade e localização."}, {"x": "Encaminhar a paciente para internação hospitalar devido ao risco iminente de aborto.", "ok": false, "w": "Sangramento leve, colo fechado e paciente estável não exigem internação."}, {"x": "Solicitar ultrassonografia obstétrica transvaginal para avaliação da gestação e liberar a paciente para repouso domiciliar, caso não haja sinais de complicações.", "ok": true, "w": "Ameaça de abortamento: USG transvaginal para ver vitalidade e localização e acompanhamento ambulatorial com sinais de alerta."}], "k": "Colo fechado + sangramento leve = ameaça: USG e conduta ambulatorial.", "n": null}, {"id": "CI_2024_2_10", "b": "CI", "t": "Artropatias", "o": "CI 24.2 Q10", "e": "Uma mulher, de 65 anos, foi diagnosticada com osteoartrite há aproximadamente dois anos, com predominância nas articulações dos joelhos e mãos. Recentemente, ela relatou um agravamento dos sintomas, incluindo dor crônica no joelho direito e rigidez matinal que persiste por cerca de 30 minutos. Esses sintomas têm prejudicado suas atividades diárias, como subir escadas e manipular objetos pequenos. A paciente tem hipertensão controlada por losartana, com IMC de 35, sem histórico de diabetes ou problemas renais. O exame físico revela dor à palpação nas articulações dos joelhos e mãos, com uma redução na amplitude de movimento. Radiografias indicam estreitamento do espaço articular e osteófitos, características típicas de osteoartrite. Baseado no quadro clínico e nas diretrizes terapêuticas para osteoartrite, identifique o plano terapêutico inicial mais adequado para o tratamento, incluindo abordagens farmacológicas e não farmacológicas?", "a": [{"x": "Iniciar tratamento com paracetamol para alívio da dor, anti-inflamatórios não esteroidais (AINEs) apenas se necessário, incluir programa de fisioterapia e recomendar perda de peso para reduzir a carga sobre as articulações.", "ok": true, "w": "Plano do gabarito: analgesia escalonada, fisioterapia e perda de peso, que reduz a carga sobre o joelho. Hoje o AINE tópico no joelho e nas mãos também é opção de primeira linha."}, {"x": "Iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) para controle da dor e inflamação, considerar suplementação com glucosamina e condroitina, incluir exercícios físicos supervisionados.", "ok": false, "w": "Glucosamina e condroitina não têm benefício consistente e não fazem parte do tratamento recomendado."}, {"x": "Prescrever opioides para controle da dor intensa, utilizar corticosteroides injetáveis para articulações afetadas, recomendar repouso absoluto e restrição de atividades físicas para evitar o agravamento da condição.", "ok": false, "w": "Opioide e repouso absoluto pioram função e trazem riscos; infiltração com corticoide é para crises, não a base do tratamento."}, {"x": "Prescrever paracetamol para alívio da dor, iniciar tratamento com anti-inflamatórios não esteroidais (AINEs) se necessário, recomendar o uso de dispositivos de apoio e incluir exercícios físicos leves conforme tolerado.", "ok": false, "w": "Parece próxima, mas deixa de fora a perda de peso e o fortalecimento, que são o núcleo do tratamento da osteoartrite."}], "k": "Osteoartrite = exercício + perda de peso + analgesia; repouso e opioide são sinais de alternativa errada.", "n": null}, {"id": "CI_2024_2_11", "b": "CI", "t": "Artropatias", "o": "CI 24.2 Q11", "e": "Maria das Graças, 54 anos, procura atendimento referindo dor e deformidades nas mãos, com evolução de dois anos. A dor surge quando realiza trabalhos manuais e utiliza o computador e está associada à rigidez matinal de cerca de 15 minutos. Descreve como intensidade 4/10 pela escala visual analógica de dor. Ao exame físico: dor à palpação de interfalangeanas distais e proximais, com aumento discreto de volume local, ausência de calor e hiperemia. Tendo em vista a principal hipótese diagnóstica, assinale a alternativa correta em relação aos exames complementares.", "a": [{"x": "Associa-se a elevação da velocidade de hemossedimentação, fator reumatóide e anti CCP positivo.", "ok": false, "w": "VHS elevada, fator reumatoide e anti-CCP apontam artrite reumatoide; na osteoartrite o laboratório é normal."}, {"x": "Quanto aos aspectos radiológicos é observado aumento do espaço intra-articular e formações de osteófitos.", "ok": false, "w": "Na osteoartrite o espaço articular diminui, não aumenta."}, {"x": "A radiografia convencional é o método de imagem mais utilizado para o diagnóstico e avaliação da progressão da doença.", "ok": true, "w": "A radiografia simples é o exame de imagem padrão: redução do espaço articular, osteófitos, esclerose e cistos subcondrais."}, {"x": "A análise do líquido sinovial caracteriza-se como líquido tipicamente inflamatório e contagem de leucócitos superior a 50.000 células/mm3.", "ok": false, "w": "O líquido sinovial da osteoartrite é não inflamatório (menos de 2.000 leucócitos/mm³); acima de 50.000 sugere artrite séptica."}], "k": "Rigidez curta + interfalangeanas distais e proximais sem inflamação = osteoartrite, com laboratório normal.", "n": null}, {"id": "CI_2024_2_12", "b": "CI", "t": "TOC e ansiedade", "o": "CI 24.2 Q12", "e": "Um adolescente, de 15 anos, comparece para atendimento após familiares notarem feridas nas mãos dele. Paciente relata que precisa lavar as mãos várias vezes ao dia e que seus banhos possuem duração de aproximadamente 3 horas. Ele explica: “Tenho pensamentos de que estou coberto de germes e de que se não me lavar ficarei doente. Quando estou no banho, preciso me lavar em uma ordem específica. Se não fizer isso, preciso recomeçar, e isso leva horas. E se eu não me lavar, sinto muita ansiedade e tenho a sensação de algo ruim possa acontecer. A minha pele está ferida e sangrando por eu passar tantas horas me lavando. Sei que não faz sentido, mas não consigo me controlar.” Com base neste caso clínico, o tratamento de primeira linha é:", "a": [{"x": "uso de inibidores seletivos da recaptação de serotonina, associado opcionalmente a um psicoestimulante, com duração de 6 meses.", "ok": false, "w": "Psicoestimulante não trata TOC, e 6 meses é pouco: mantém-se o tratamento por 1–2 anos após a resposta."}, {"x": "terapia cognitivo comportamental associada ao uso de inibidores seletivos da recaptação de serotonina.", "ok": true, "w": "TOC: terapia cognitivo-comportamental com exposição e prevenção de resposta + ISRS."}, {"x": "encaminhamento para neurocirurgia pois o caso é grave e refratário a tratamento.", "ok": false, "w": "Neurocirurgia é exceção para casos extremamente refratários, após várias linhas de tratamento."}, {"x": "acompanhamento psicológico associado ao uso de benzodiazepínicos para auxiliar na ansiedade.", "ok": false, "w": "Benzodiazepínico alivia ansiedade inespecífica, mas não trata obsessões nem compulsões."}], "k": "TOC = TCC + ISRS em dose adequada, com resposta lenta (8–12 semanas).", "n": null}, {"id": "CI_2024_2_13", "b": "CI", "t": "Neoplasias na infância", "o": "CI 24.2 Q13", "e": "Um menino de 8 anos é levado à consulta com história de febre prolongada há mais de duas semanas, acompanhada de fraqueza, cansaço fácil e perda de apetite. Ao exame físico, observa-se palidez cutânea, hepatoesplenomegalia, linfonodos cervicais aumentados e amigdalas aumentadas de tamanho com exudado acinzentado em toda sua superfície. Quais exames complementares são mais indicados para o diagnóstico inicial desta criança?", "a": [{"x": "Proteína C Reativa e teste tuberculínico.", "ok": false, "w": "PCR e teste tuberculínico investigam tuberculose, que não explica faringite exsudativa com hepatoesplenomegalia."}, {"x": "Coagulograma e provas de função hepática.", "ok": false, "w": "Coagulograma e função hepática podem estar alterados, mas não fazem o diagnóstico."}, {"x": "Ultrassonografia cervical e sorologia para Coxsackie vírus.", "ok": false, "w": "Coxsackie causa herpangina e mão-pé-boca, não esse quadro; USG cervical não define a causa."}, {"x": "Hemograma e sorologia para Epstein-Barr.", "ok": true, "w": "Febre, amigdalite com exsudato, linfonodos e hepatoesplenomegalia = mononucleose: hemograma (linfócitos atípicos e exclusão de leucemia) + sorologia para Epstein-Barr."}], "k": "Na criança pequena o teste heterófilo falha; a sorologia específica confirma mononucleose.", "n": null}, {"id": "CI_2024_2_15", "b": "CI", "t": "Demências", "o": "CI 24.2 Q15", "e": "Médico de 80 anos comparece a consulta devido a quadro de esquecimento iniciado há 6 meses. Relata que sente dificuldade para se lembrar de eventos cotidianos, como onde guardou um prontuário ou se desligou os equipamentos eletrônicos ao sair de seu consultório. Deixa claro no seu relato que esses eventos apesar de incomodarem, não interferem em suas atividades sociais ou profissionais. Essas informações são confirmadas pela sua filha que acompanha a consulta. Realizado alguns testes com os seguintes resultados: teste de fluência verbal 14 animais/minuto; miniexame do estado mental 23 pontos. Dentre as opções apresentadas, o diagnóstico mais provável é:", "a": [{"x": "Envelhecimento cerebral normal.", "ok": false, "w": "Mudança perceptível, confirmada por familiar e com teste alterado, nunca deve ser atribuída só à idade."}, {"x": "Síndrome demencial.", "ok": false, "w": "Síndrome demencial exige prejuízo funcional, que o paciente não tem."}, {"x": "Doença de Alzheimer.", "ok": false, "w": "Alzheimer é uma causa de demência e também exige perda funcional."}, {"x": "Comprometimento cognitivo leve.", "ok": true, "w": "Queixa confirmada pela filha e MEEM abaixo do corte, com vida profissional e social preservada = comprometimento cognitivo leve."}], "k": "A funcionalidade separa CCL de demência.", "n": null}, {"id": "CI_2025_1_1", "b": "CI", "t": "Neoplasias na infância", "o": "CI 25.1 Q1", "e": "Menino, 4 anos, natural e residente em São Paulo – SP. É trazido ao pronto-socorro com queixa de febre contínua há 30 dias, astenia, dor nos membros inferiores e petéquias. Sem antecedentes pessoais relevantes e não tem histórico recente de viagens. Não há história de contato com animais ou exposição a ambientes endêmicos. Ao exame físico, apresenta como alterações febre (39°C), palidez, petéquias e regular estado geral. Presença de linfonodomegalias em região auricular posterior, epitroclear e supraclavicular. Hepatoesplenomegalia moderada. De acordo com o caso apresentado, assinale a alternativa que apresenta a hipótese diagnóstica mais provável e que exame deve ser solicitado para o diagnóstico.", "a": [{"x": "Febre reumática. Solicitar fator reumatoide.", "ok": false, "w": "Febre reumática não se diagnostica por fator reumatoide e não explica petéquias com febre de 30 dias."}, {"x": "Linfoma de Hodgkin. Solicitar ressonância nuclear magnética.", "ok": false, "w": "Hodgkin é de adolescente, com linfonodo indolor; ressonância não é o exame diagnóstico."}, {"x": "Leucemia linfoblástica aguda. Solicitar mielograma.", "ok": true, "w": "Criança de 4 anos com febre prolongada, dor em membros, palidez e petéquias = LLA até prova em contrário; o mielograma confirma."}, {"x": "Malária. Solicitar gota espessa.", "ok": false, "w": "Sem viagem ou exposição a área endêmica, malária é improvável."}], "k": "Febre + dor óssea + sinais de falência medular na infância → mielograma.", "n": null}, {"id": "CI_2025_1_3", "b": "CI", "t": "Demências", "o": "CI 25.1 Q3", "e": "Homem, 80 anos, professor universitário aposentado, comparece ao ambulatório de clínica médica acompanhado de sua esposa por queixa de comprometimento de memória há 6 meses. O paciente refere que tem apresentado episódios de esquecimento de compromissos marcados, dificuldade em lembrar nomes de conhecidos e onde guardou objetos. No entanto, o paciente continua realizando suas atividades diárias de forma independente, como leitura de livros e jornais, acompanhamento de notícias e participação em grupos de discussão online. Ele também mantém sua rotina de exercícios físicos e atividades sociais. As queixas do paciente, embora sutis, também já foram percebidas pela esposa. O exame físico não identificou sinais neurológicos focais, também não havia sinais de parkinsonismo. Mini Exame do Estado Mental (MEEM): 24/30 (Valor de referência para escolaridade 26). Trouxe exames laboratoriais constando hemograma, eletrólitos, função tireoidiana e vitamina B12 normais. Tomografia computadorizada de crânio com leve atrofia de parênquima cerebral difusa, sem preferência lobar, compatível com a idade. Diante do caso clínico, assinale a alternativa correta.", "a": [{"x": "O quadro clínico apresentado com sintomas de perda de memória, associado à pontuação alterada no MEEM, aponta como diagnóstico provável o comprometimento cognitivo leve.", "ok": true, "w": "Queixa percebida pela esposa, MEEM abaixo da referência para a escolaridade e total independência = comprometimento cognitivo leve."}, {"x": "A ausência de atrofia encefálica do lobo temporal medial (sobretudo atrofia hipocampal) descarta o diagnóstico de doença de Alzheimer.", "ok": false, "w": "A ausência de atrofia hipocampal não exclui Alzheimer, principalmente no início."}, {"x": "O fato de as queixas cognitivas serem sutis e não interferirem na autonomia para realização de suas atividades habituais direciona para o diagnóstico de doença de Alzheimer em fase inicial.", "ok": false, "w": "Queixa sem prejuízo funcional é justamente o que afasta demência, inclusive Alzheimer."}, {"x": "As queixas do paciente, a duração dos sintomas, a presença de fatores de risco direcionam para o diagnóstico diferencial de um quadro confusional agudo (delirium).", "ok": false, "w": "Delirium é agudo e flutuante, com desatenção; 6 meses de evolução estável não é delirium."}], "k": "Neuroimagem apoia, mas quem define demência é o prejuízo funcional.", "n": null}, {"id": "CI_2025_1_4", "b": "CI", "t": "Artropatias", "o": "CI 25.1 Q4", "e": "Uma menina de 5 anos é levada à consulta devido a dor articular há 7 semanas, principalmente nas articulações dos joelhos e tornozelos. Além da dor, a mãe relata que a criança tem febre baixa intermitente e cansaço. Nega outros sintomas. Não há história de trauma, de outras doenças pregressas e de uso de medicamentos. Ao exame físico, apresenta como alterações leve inchaço nas articulações afetadas e mobilidade limitada, sem sinais de infecção local. Considerando o quadro clínico, assinale a alternativa que apresenta o diagnóstico mais provável nesse caso.", "a": [{"x": "Lúpus eritematoso sistêmico.", "ok": false, "w": "Lúpus costuma trazer manifestações cutâneas, renais ou hematológicas e é raro aos 5 anos."}, {"x": "Artrite idiopática juvenil.", "ok": true, "w": "Artrite em menor de 16 anos por mais de 6 semanas, sem outra causa = artrite idiopática juvenil."}, {"x": "Febre reumática.", "ok": false, "w": "Febre reumática tem artrite migratória, que dura dias e responde rápido a AINE, após faringite."}, {"x": "Leucemia linfoide aguda.", "ok": false, "w": "LLA entra no diferencial, mas viria com dor óssea intensa e noturna e citopenias, não descritas."}], "k": "AIJ: mais de 6 semanas, antes dos 16 anos, diagnóstico de exclusão.", "n": null}, {"id": "CI_2025_1_5", "b": "CI", "t": "Neoplasias na infância", "o": "CI 25.1 Q5", "e": "Uma mãe leva seu filho de 10 anos ao ambulatório pediátrico para avaliação de uma massa palpável na região cervical. A mãe relata que notou um aumento no tamanho do linfonodo há cerca de uma semana. O menino não apresenta febre, fadiga ou perda de apetite. Ao exame físico, apresenta como alteração linfonodo cervical aumentado (aproximadamente 2 cm), elástico, móvel e indolor, sem sinais de infecção local. Um hemograma completo foi solicitado e os resultados mostram: Hemoglobina: 12 g/dL, Contagem de leucócitos: 8.000/mm³, Contagem de plaquetas: 250.000/mm³, Linfócitos: 60% (valor normal: 20% a 50% do total de leucócitos) e Neutrófilos: 30% (valor normal: 40% a 70% do total de leucócitos). Com base na história clínica e nos resultados do hemograma, qual é a hipótese mais apropriada para este caso?", "a": [{"x": "Linfadenopatia reacional.", "ok": true, "w": "Linfonodo de ~2 cm, elástico e móvel, sem sintomas sistêmicos e sem citopenias (a linfocitose relativa sugere processo viral) = linfadenopatia reacional; observar e reavaliar."}, {"x": "Leucemia linfoblástica aguda.", "ok": false, "w": "LLA teria febre, palidez, sangramentos e citopenias."}, {"x": "Linfoma não-Hodgkin.", "ok": false, "w": "Linfoma não Hodgkin cresce muito rápido, com massa abdominal ou mediastinal e sintomas."}, {"x": "Linfoma de Hodgkin.", "ok": false, "w": "Hodgkin: linfonodo endurecido, indolor, persistente, frequentemente supraclavicular, com sintomas B."}], "k": "Investigar linfonodo que ultrapassa 2 cm e persiste ou cresce após 2–4 semanas, supraclavicular, endurecido, aderido ou com sintomas B.", "n": null}, {"id": "CI_2025_1_6", "b": "CI", "t": "Artropatias", "o": "CI 25.1 Q6", "e": "Um homem de 60 anos comparece ao ambulatório com queixas de dor nas articulações, especialmente nos joelhos e nas mãos. Ele relata que a dor piora ao realizar atividades diárias, como subir escadas e abrir frascos, e melhora com o repouso. O paciente também menciona rigidez matinal que dura cerca de 20 minutos. Ao exame físico, apresenta como alteração a diminuição leve da amplitude de movimento. Considerando o quadro clínico apresentado, assinale a alternativa que contém o plano terapêutico inicial adequado para este paciente.", "a": [{"x": "Educação do paciente, exercícios físicos, controle do peso e prescrição de paracetamol.", "ok": true, "w": "Educação, exercício, controle de peso e analgésico simples formam a base do tratamento da osteoartrite."}, {"x": "Uso exclusivo de AINEs, sem necessidade de intervenções não farmacológicas.", "ok": false, "w": "AINE exclusivo, sem medidas não farmacológicas, deixa de fora o que mais funciona e aumenta o risco de efeitos adversos."}, {"x": "Fisioterapia intensiva e uso de corticosteroides injetáveis.", "ok": false, "w": "Infiltração com corticoide é para crises; não é tratamento inicial."}, {"x": "Recomendações para repouso absoluto e uso de opioides para controle da dor.", "ok": false, "w": "Repouso absoluto e opioide pioram a função e trazem riscos."}], "k": "Palavras como 'exclusivo', 'repouso absoluto' e 'opioide' marcam alternativa errada em osteoartrite.", "n": null}, {"id": "CI_2025_1_7", "b": "CI", "t": "Demências", "o": "CI 25.1 Q7", "e": "Mulher de 75 anos, funcionária pública aposentada, comparece ao ambulatório de Geriatria, acompanhada da filha. A filha relata que, nos últimos 18 meses, a paciente tem apresentado episódios de esquecimento frequente de eventos recentes, dificuldade em encontrar palavras para se expressar e repetição de perguntas já respondidas. A paciente também tem apresentado dificuldades em realizar tarefas domésticas que antes eram rotineiras, como cozinhar e organizar a casa. Negam alterações do humor. O exame físico não mostrou alterações neurológicas focais. Mini Exame do Estado Mental (MEEM): 22/30 (valor de referência para a escolaridade: 26). Realizou exames laboratoriais, incluindo hemograma, eletrólitos, função tireoidiana e vitamina B12, sem alterações. Ressonância magnética de crânio com atrofia hipocampal bilateral, além de atrofia encefálica difusa. Qual é o tratamento mais adequado para essa paciente?", "a": [{"x": "Orientar paciente e família sobre a importância de manter atividades físicas e mentais regulares.", "ok": false, "w": "Medidas não farmacológicas são importantes, mas sozinhas não bastam em demência com perda funcional."}, {"x": "Iniciar tratamento com antidepressivo, preferencialmente inibidor da recaptação de serotonina.", "ok": false, "w": "Humor preservado e atrofia hipocampal não sustentam depressão como causa."}, {"x": "Iniciar tratamento com donepezila, um inibidor da acetilcolinesterase.", "ok": true, "w": "Demência com memória recente, linguagem e perda funcional, mais atrofia hipocampal = Alzheimer: inibidor da acetilcolinesterase."}, {"x": "Iniciar tratamento com amantadina, um antagonista do receptor NMDA com efeito dopaminérgico.", "ok": false, "w": "Amantadina é antiparkinsoniano e não trata Alzheimer."}], "k": "Alzheimer leve a moderado: donepezila, rivastigmina ou galantamina.", "n": null}, {"id": "CI_2025_1_9", "b": "CI", "t": "Neoplasias pulmonares", "o": "CI 25.1 Q9", "e": "Um paciente do sexo masculino, 63 anos, com antecedente de tabagismo de 40 maços/ano, comparece à unidade de saúde com queixa de tosse seca persistente há 2 meses, perda de peso de 8 kg no período e dispneia progressiva aos esforços. Refere ainda rouquidão recente e dor torácica localizada. Ao exame físico, apresenta hipocratismo digital e estertores finos na base direita. Foi solicitada radiografia de tórax, que revelou uma massa espiculada no lobo superior direito, associada à redução do volume pulmonar no mesmo hemitórax. Com base no quadro clínico e radiológico, qual é a hipótese diagnóstica mais provável?", "a": [{"x": "Neoplasia pulmonar primária do tipo não pequenas células.", "ok": true, "w": "Tabagista pesado com perda de peso, rouquidão, baqueteamento e massa espiculada com perda de volume = câncer de pulmão de não pequenas células."}, {"x": "Tuberculose pulmonar em fase subaguda, com caverna oculta.", "ok": false, "w": "Tuberculose traria febre, sudorese e escarro, com lesões apicais; espiculação com retração favorece tumor."}, {"x": "Pneumonia de lenta resolução com possível abscesso pulmonar.", "ok": false, "w": "Abscesso tem febre, escarro purulento e cavidade com nível hidroaéreo."}, {"x": "Embolia pulmonar com infarto parenquimatoso e resposta inflamatória local.", "ok": false, "w": "TEP não forma massa espiculada nem explica 2 meses de perda de peso e baqueteamento."}], "k": "Rouquidão em tabagista com massa pulmonar: invasão do nervo laríngeo recorrente.", "n": null}, {"id": "CI_2025_1_10", "b": "CI", "t": "Sangramento 1ª metade", "o": "CI 25.1 Q10", "e": "Paciente de 32 anos, G2P1A0, com 10 semanas de gestação pela DUM, comparece à Maternidade com queixa de sangramento vaginal moderado há 01 hora, acompanhado de dor abdominal em cólica de forte intensidade. Ao exame físico, apresenta-se afebril, com PA de 120/80 mmHg e FC de 92 bpm. No exame especular, observa-se sangramento ativo proveniente do canal cervical. O orifício interno do colo uterino encontra-se dilatado no exame de toque vaginal. Qual é a hipótese diagnóstica mais provável para essa paciente?", "a": [{"x": "Abortamento infectado.", "ok": false, "w": "Abortamento infectado teria febre, secreção purulenta e útero doloroso."}, {"x": "Abortamento em curso.", "ok": true, "w": "Sangramento moderado, cólica forte e orifício interno dilatado = abortamento em curso."}, {"x": "Ameaça de abortamento.", "ok": false, "w": "Na ameaça de abortamento o colo está fechado."}, {"x": "Abortamento completo.", "ok": false, "w": "No abortamento completo o sangramento e a cólica diminuem e o colo se fecha."}], "k": "Colo aberto com sangramento ativo = em curso ou incompleto; fechado = ameaça, completo ou retido.", "n": null}, {"id": "CI_2025_1_11", "b": "CI", "t": "TOC e ansiedade", "o": "CI 25.1 Q11", "e": "Paciente do sexo masculino, 15 anos, procura atendimento ambulatorial com queixa de obsessões e compulsões que têm prejudicado significativamente seu desempenho escolar e social. O paciente relata pensamentos intrusivos constantes, relacionados à contaminação por germes, o que o leva a realizar repetidas lavagens de mãos, chegando a gastar mais de uma hora por dia nesse comportamento. Além disso, ele se sente angustiado quando não consegue realizar essas práticas, e as suas atividades diárias estão sendo afetadas. O paciente não apresenta comorbidades e não tem histórico de uso de medicamentos nem drogas. Diante do quadro clínico, você resolve iniciar, além da terapia, um tratamento farmacológico de primeira linha. Selecione esse medicamento.", "a": [{"x": "Sertralina.", "ok": true, "w": "ISRS é a primeira linha; a sertralina tem boa evidência e segurança no adolescente."}, {"x": "Clomipramina.", "ok": false, "w": "Clomipramina é eficaz, mas é segunda linha pelos efeitos anticolinérgicos e cardíacos."}, {"x": "Risperidona.", "ok": false, "w": "Risperidona é potencializadora em casos refratários, não primeira linha."}, {"x": "Diazepam.", "ok": false, "w": "Diazepam não trata TOC."}], "k": "Primeira linha farmacológica no TOC: ISRS.", "n": null}, {"id": "CI_2025_1_12", "b": "CI", "t": "Icterícia neonatal", "o": "CI 25.1 Q12", "e": "RN com IG de 37 semanas de vida, sexo masculino, nascido de parto cesárea por diabetes mellitus gestacional, com 54 horas de vida, com tipagem sanguínea “O negativo”, em aleitamento materno exclusivo, pega adequada e ganho de peso, eliminações fisiológicas. Não há histórico de icterícia entre os irmãos. Ao ser avaliado para alta hospitalar, foi observada icterícia em zona III de Kramer, sendo coletadas neste momento as bilirrubinas totais e frações com o seguinte resultado: BT 15,5 mg/dl, BI 14,9 mg/dl. Analisando o risco pelo nomograma de Bhutani, qual é a conduta médica?", "a": [{"x": "Adiar a alta hospitalar, observar até o 5º dia de vida, quando ocorre o pico de hiperbilirrubinemia.", "ok": false, "w": "Esperar o pico com a bilirrubina já elevada atrasa um tratamento necessário."}, {"x": "Alta hospitalar com retorno em 48h para reavaliação do quadro de icterícia do recém-nascido.", "ok": false, "w": "Alta com bilirrubina nessa faixa é insegura."}, {"x": "Adiar alta hospitalar e repetir dosagem de bilirrubinas total e frações em 24 horas.", "ok": false, "w": "Repetir só em 24 h, sem tratar, deixa o RN exposto a subida rápida."}, {"x": "Adiar a alta hospitalar e iniciar fototerapia, mantendo a criança no alojamento conjunto.", "ok": true, "w": "BT 15,5 mg/dL com 54 h, 37 semanas e mãe diabética: adiar a alta e iniciar fototerapia no alojamento conjunto."}], "k": "Idade gestacional abaixo de 38 semanas e mãe diabética são fatores de risco que baixam o limiar para fototerapia.", "n": null}, {"id": "CI_2025_1_14", "b": "CI", "t": "Fraturas, entorses e luxações", "o": "CI 25.1 Q14", "e": "Paciente do sexo masculino, 23 anos, refere uma torção no tornozelo esquerdo durante partida de futebol, ocorrida há aproximadamente 1 hora. No exame físico, não apresenta equimose perimaleolar e consegue permanecer em ortostase com apoio do membro acometido e deambula com pouca dor durante a avaliação. Qual é a conduta inicial recomendada no atendimento do paciente?", "a": [{"x": "Indicar imobilização gessada imediata por suspeita clínica de fratura instável.", "ok": false, "w": "Gesso imediato sem critério de fratura é exagero: o paciente apoia e caminha."}, {"x": "Solicitar radiografia do tornozelo em 3 incidências, com base nos critérios de Ottawa.", "ok": false, "w": "Não há critério de Ottawa: nem dor à palpação dos maléolos nem incapacidade de dar 4 passos."}, {"x": "Encaminhar para ortopedia ambulatorial em 7 dias para avaliação funcional.", "ok": false, "w": "Adiar por 7 dias sem orientar tratamento inicial não é conduta."}, {"x": "Gelo local, repouso, bandagem elástica e elevação, sem exame de imagem.", "ok": true, "w": "Sem critério de Ottawa: gelo, repouso relativo, compressão e elevação, sem imagem."}], "k": "Ottawa negativo = sem radiografia.", "n": null}, {"id": "CI_2025_1_15", "b": "CI", "t": "TOC e ansiedade", "o": "CI 25.1 Q15", "e": "Mulher de 45 anos comparece à Unidade Básica de Saúde (UBS) relatando episódios recorrentes de taquicardia, sudorese intensa, sensação de falta de ar e medo iminente de morte. Refere que os sintomas iniciaram há cerca de seis meses, sem fator desencadeante claro, ocorrendo de forma abrupta e com resolução espontânea em aproximadamente 20 minutos. Nega eventos semelhantes prévios, transtornos psiquiátricos conhecidos ou uso de substâncias psicoativas. No exame físico, não há achados relevantes. Qual é o diagnóstico mais provável?", "a": [{"x": "Transtorno de Ansiedade Social.", "ok": false, "w": "Ansiedade social é medo de avaliação negativa em situações sociais, com gatilho claro."}, {"x": "Transtorno de Pânico.", "ok": true, "w": "Crises abruptas, com sintomas autonômicos e medo de morrer, sem gatilho e resolvendo em minutos = transtorno de pânico."}, {"x": "Transtorno de Ansiedade Generalizada (TAG).", "ok": false, "w": "TAG é preocupação contínua e difusa por 6 meses, não crises."}, {"x": "Transtorno de Estresse Pós-Traumático (TEPT).", "ok": false, "w": "TEPT exige exposição a trauma."}], "k": "Crise episódica sem gatilho = pânico; preocupação contínua = TAG.", "n": null}, {"id": "CI_3__2025_2_1", "b": "CI", "t": "Demências", "o": "CI 25.2 Q1", "e": "Paciente masculino, 80 anos, procura atendimento acompanhado de sua filha, que relata que ele apresenta esquecimentos progressivos há cerca de 2 anos, dificuldade em lembrar fatos recentes e em realizar atividades instrumentais da vida diária, como lidar com finanças e administrar medicamentos. Não há histórico de AVC prévio, uso de álcool em excesso ou alterações comportamentais abruptas. No Mini Exame do Estado Mental (MEEM), o paciente obteve pontuação 18/30. Diante desse quadro, o diagnóstico mais provável é:", "a": [{"x": "demência vascular.", "ok": false, "w": "Demência vascular exige AVC, déficit focal ou piora em degraus."}, {"x": "comprometimento cognitivo leve.", "ok": false, "w": "CCL não tem dependência nas atividades instrumentais."}, {"x": "doença de Alzheimer.", "ok": true, "w": "Declínio insidioso de 2 anos, memória recente e perda das atividades instrumentais em idoso = doença de Alzheimer."}, {"x": "demência frontotemporal.", "ok": false, "w": "Frontotemporal começa com alteração de comportamento ou linguagem, geralmente antes dos 65 anos."}], "k": "Alzheimer: insidioso, progressivo, memória recente primeiro.", "n": null}, {"id": "CI_3__2025_2_2", "b": "CI", "t": "Neoplasias pulmonares", "o": "CI 25.2 Q2", "e": "Homem, tabagista de longa data (cerca de 15 cigarros por dia há 25 anos), procurou atendimento médico devido ao início de tosse persistente, perda de peso, dispneia aos esforços e hemoptise há 60 dias. Foi submetido a uma tomografia computadorizada de tórax, que revelou uma lesão peri-hilar à esquerda com envolvimento do brônquio fonte correspondente, o qual apresenta redução de sua luz. Considerando o histórico clínico e os achados radiológicos descritos, qual é a principal hipótese diagnóstica?", "a": [{"x": "Tuberculose pulmonar.", "ok": false, "w": "Tuberculose não costuma obstruir o brônquio fonte."}, {"x": "Câncer de pulmão.", "ok": true, "w": "Tabagista com hemoptise, perda de peso e lesão peri-hilar reduzindo a luz brônquica = câncer de pulmão."}, {"x": "Bronquite crônica.", "ok": false, "w": "Bronquite crônica não forma lesão peri-hilar obstrutiva nem causa perda de peso importante."}, {"x": "Doença pulmonar obstrutiva crônica (DPOC).", "ok": false, "w": "DPOC na tomografia mostra enfisema, não massa."}], "k": "Lesão central obstruindo brônquio em tabagista: carcinoma escamoso ou de pequenas células.", "n": null}, {"id": "CI_3__2025_2_3", "b": "CI", "t": "Fraturas, entorses e luxações", "o": "CI 25.2 Q3", "e": "Paciente, sexo feminino, 43 anos, sofreu uma torção do tornozelo direito ao descer uma escada. Chega ao pronto-socorro com dor intensa, dificuldade para apoiar o pé no chão e inchaço local evidente. No exame físico, apresenta sensibilidade dolorosa à palpação do maléolo lateral e dificuldade para dar mais de quatro passos consecutivos. Não há ferimentos abertos nem sinais de lesão vascular. Com base na avaliação clínica e nos critérios da Regra de Ottawa, qual é a conduta inicial mais adequada para esse caso?", "a": [{"x": "Solicitar ultrassonografia para avaliar integridade ligamentar, reservando a radiografia apenas para casos com deformidade evidente e edema importante.", "ok": false, "w": "USG não é o exame inicial para excluir fratura, e deformidade não é critério de Ottawa."}, {"x": "Solicitar radiografia do tornozelo em três incidências, pois há dor localizada no maléolo lateral e dificuldade para apoiar o peso corporal após o trauma.", "ok": true, "w": "Dor no maléolo lateral + incapacidade de dar 4 passos = critério de Ottawa: radiografia do tornozelo."}, {"x": "Indicar imobilização com órtese funcional e analgésicos, sem necessidade de exame de imagem, pois não há deformidade visível nem lesões abertas.", "ok": false, "w": "Havendo critério de Ottawa, a radiografia é necessária mesmo sem deformidade."}, {"x": "Indicar ressonância magnética de tornozelo para confirmar possível fratura oculta e iniciar tratamento conservador com apoio parcial imediato.", "ok": false, "w": "Ressonância não é exame inicial."}], "k": "Ottawa positivo = radiografia.", "n": null}, {"id": "CI_3__2025_2_4", "b": "CI", "t": "TOC e ansiedade", "o": "CI 25.2 Q4", "e": "Adolescente de 15 anos, sexo masculino, comparece ao ambulatório de psiquiatria acompanhado da mãe. Ele relata pensamentos recorrentes e intrusivos de contaminação ao tocar em objetos, passando a lavar as mãos repetidamente por mais de 2 horas ao dia. A mãe refere que o comportamento vem prejudicando o desempenho escolar e a socialização do filho. O exame clínico descarta outras comorbidades psiquiátricas graves. Considerando o diagnóstico de transtorno deste adolescente, assinale a conduta terapêutica mais adequada.", "a": [{"x": "Indicar terapia cognitivo-comportamental com uso de inibidor seletivo da recaptação de serotonina.", "ok": true, "w": "TOC: TCC com exposição e prevenção de resposta + ISRS."}, {"x": "Prescrever o uso de benzodiazepínico de ação curta.", "ok": false, "w": "Benzodiazepínico não trata TOC."}, {"x": "Iniciar o uso de antipsicóticos típicos em internação psiquiátrica imediata.", "ok": false, "w": "Antipsicótico típico e internação não são primeira linha; antipsicótico só potencializa casos refratários."}, {"x": "Encaminhar para terapia psicanalítica de longo prazo.", "ok": false, "w": "Psicanálise não tem evidência robusta de eficácia no TOC."}], "k": "Benzodiazepínico e psicanálise são distratores clássicos no TOC.", "n": null}, {"id": "CI_3__2025_2_5", "b": "CI", "t": "Disfonia", "o": "CI 25.2 Q5", "e": "Um homem de 42 anos, professor, procura atendimento devido a rouquidão progressiva há 3 meses. Refere piora após longas aulas e melhora parcial com repouso vocal. Nega tabagismo ou etilismo significativos. Ao exame físico, não há adenomegalias cervicais nem sinais de disfagia ou dispneia. A laringoscopia indireta mostra formações bilaterais, simétricas, de aspecto arredondado e esbranquiçado, localizadas no terço médio das pregas vocais. Qual é o diagnóstico mais provável?", "a": [{"x": "Nódulos vocais", "ok": true, "w": "Professor com rouquidão que piora com uso e melhora com repouso, lesões bilaterais, simétricas e no terço médio = nódulos vocais."}, {"x": "Carcinoma espinocelular de laringe", "ok": false, "w": "Carcinoma é de tabagista e etilista, com lesão unilateral e irregular; o paciente nega os dois fatores."}, {"x": "Pólipo de prega vocal", "ok": false, "w": "Pólipo costuma ser unilateral, após fonotrauma agudo."}, {"x": "Papilomatose laríngea recorrente", "ok": false, "w": "Papilomatose tem lesões verrucosas múltiplas, é mais comum em crianças e pode causar estridor."}], "k": "Bilateral e simétrico no profissional da voz = nódulo; unilateral irregular no tabagista = câncer.", "n": "Gabarito corrigido: o relatório da prova marcou carcinoma espinocelular, mas o próprio comentário da prova justifica nódulos vocais."}, {"id": "CI_3__2025_2_6", "b": "CI", "t": "Sangramento 1ª metade", "o": "CI 25.2 Q6", "e": "Uma mulher de 32 anos, gestante de 10 semanas, comparece à Unidade Básica de Saúde (UBS), referindo sangramento vaginal em mínima quantidade, iniciado há cerca de 12 horas, sem coágulos, associado a cólicas leves. Nega febre ou dor intensa. No exame físico, apresenta-se hemodinamicamente estável, com abdome livre e útero compatível com a idade gestacional. No exame especular, há sangramento ativo no canal vaginal, e o toque vaginal revela colo uterino fechado. Com base nos achados clínicos, qual é a principal hipótese diagnóstica?", "a": [{"x": "Abortamento inevitável.", "ok": false, "w": "No abortamento inevitável o colo está aberto."}, {"x": "Gravidez ectópica.", "ok": false, "w": "Ectópica traria dor intensa ou instabilidade; paciente estável com útero compatível torna improvável (a USG confirma)."}, {"x": "Doença trofoblástica gestacional.", "ok": false, "w": "Mola cursa com útero maior que a idade gestacional e β-hCG muito elevado."}, {"x": "Ameaça de abortamento.", "ok": true, "w": "Sangramento mínimo, cólica leve, colo fechado e útero compatível = ameaça de abortamento."}], "k": "Ameaça: colo fechado e útero compatível com a idade gestacional.", "n": null}, {"id": "CI_3__2025_2_7", "b": "CI", "t": "Queimaduras e nutrição", "o": "CI 25.2 Q7", "e": "Paciente do sexo masculino, 45 anos, internado na enfermaria da Cirurgia Plástica após queimadura de 40% da superfície corporal total há 20 dias. Avaliação clínica e antropométrica evidenciou perda ponderal e redução de massa muscular. Exames laboratoriais: Albumina: 2,6 g/dL Pré-albumina: 10 mg/dL Transferrina: 140 mg/dL Linfócitos totais: 850/mm³ Considerando a avaliação nutricional no paciente queimado, qual a interpretação mais adequada desses achados?", "a": [{"x": "Os valores sugerem apenas repercussão inflamatória transitória, sem impacto clínico relevante sobre o estado nutricional ou o processo de cicatrização.", "ok": false, "w": "Queda de todos os marcadores com perda de peso e de massa muscular não é só inflamação transitória."}, {"x": "Os achados laboratoriais podem ser desconsiderados, uma vez que os dados clínicos e antropométricos já demonstraram a presença de desnutrição e a necessidade de suporte especializado.", "ok": false, "w": "Os exames não se descartam: servem para acompanhar a resposta ao suporte nutricional."}, {"x": "Os exames revelam parâmetros preservados, já que a hipoalbuminemia ocorre apenas pela inflamação, não refletindo desnutrição nem maior risco de complicações.", "ok": false, "w": "Pré-albumina e transferrina também baixas mostram desnutrição, não apenas efeito da inflamação."}, {"x": "Os resultados indicam desnutrição significativa, com hipoproteinemia e imunossupressão, sendo parâmetros úteis para acompanhar risco de infecção e atraso cicatricial.", "ok": true, "w": "Albumina, pré-albumina, transferrina e linfócitos baixos = desnutrição com hipoproteinemia e imunossupressão, com mais risco de infecção e atraso cicatricial."}], "k": "Pré-albumina (meia-vida de ~2 dias) é o melhor marcador para acompanhar a terapia nutricional.", "n": null}, {"id": "CI_3__2025_2_8", "b": "CI", "t": "Síndrome parkinsoniana", "o": "CI 25.2 Q8", "e": "Mulher de 68 anos procura o ambulatório com queixa de lentidão para realizar atividades cotidianas, associada a rigidez muscular e tremor em repouso no membro superior direito, iniciados há cerca de 1 ano. Refere ainda hipomimia facial e dificuldade progressiva para caminhar. Ao exame, observa-se tremor de repouso unilateral, rigidez plástica e bradicinesia. Nega comorbidades relevantes, exceto depressão tratada com sertralina. Não usa neurolépticos ou metoclopramida. A hipótese diagnóstica mais provável para essa paciente é parkinsonismo:", "a": [{"x": "atípico.", "ok": false, "w": "Parkinsonismo atípico traz quedas precoces, paralisia do olhar vertical, disautonomia, evolução rápida e simetria."}, {"x": "idiopático.", "ok": true, "w": "Início unilateral, tremor de repouso, rigidez plástica e bradicinesia, sem fármaco causador = doença de Parkinson idiopática."}, {"x": "medicamentoso.", "ok": false, "w": "Sertralina raramente causa parkinsonismo; o medicamentoso vem de neurolépticos, metoclopramida ou flunarizina e é simétrico."}, {"x": "vascular.", "ok": false, "w": "Parkinsonismo vascular predomina em membros inferiores, com AVCs e sinais piramidais."}], "k": "Assimetria + tremor de repouso + boa resposta à levodopa = Parkinson idiopático.", "n": null}, {"id": "CI_3__2025_2_9", "b": "CI", "t": "Icterícia neonatal", "o": "CI 25.2 Q9", "e": "Um recém-nascido de 38 semanas, peso adequado para a idade gestacional, em alojamento conjunto, apresenta icterícia visível em face e tronco superior, com bilirrubina total na zona intermediário-baixa do nomograma de Bhutani para 48 horas de vida. Encontra-se em aleitamento materno exclusivo, com sucção eficaz, perda de peso inferior a 7% e sem incompatibilidade ABO/Rh ou sinais de infecção. Considerando a avaliação clínica e os fatores de risco para icterícia neonatal, assinale a conduta mais adequada em relação à alta hospitalar.", "a": [{"x": "Liberar a alta hospitalar com orientação aos pais e agendamento de reavaliação em 24–48 horas.", "ok": true, "w": "RN a termo, sem fator de risco, mamando bem e em zona intermediária baixa: alta com orientação e reavaliação em 24–48 h."}, {"x": "Manter o recém-nascido internado na unidade hospitalar até a normalização da bilirrubina sérica.", "ok": false, "w": "Internação até normalizar a bilirrubina é desnecessária e separa mãe e bebê."}, {"x": "Indicar fototerapia imediata no alojamento conjunto e acompanhar com monograma de Buthani.", "ok": false, "w": "Fototerapia não está indicada nessa zona sem fatores de risco."}, {"x": "Ofertar fórmula láctea suplementar para reduzir o risco de piora da icterícia.", "ok": false, "w": "Fórmula não é indicada quando o aleitamento é eficaz."}], "k": "Zona baixa ou intermediária baixa sem fatores de risco = alta com retorno precoce.", "n": null}, {"id": "CI_3__2025_2_10", "b": "CI", "t": "Artropatias", "o": "CI 25.2 Q10", "e": "Um homem de 60 anos procura atendimento ambulatorial queixando-se de dor progressiva em joelhos e mãos, principalmente ao final do dia, associada a rigidez matinal de cerca de 10 minutos. Ao exame físico, observa-se crepitação nos joelhos, discreta deformidade nas interfalângicas proximais das mãos, sem sinais de inflamação sistêmica. Radiografia recente mostra estreitamento do espaço articular e presença de osteófitos. Estabeleça o diagnóstico mais provável e selecione o plano terapêutico inicial mais adequado, incluindo medidas farmacológicas e não farmacológicas.", "a": [{"x": "Gota – iniciar colchicina e dieta hipopurínica, mantendo repouso articular e hidratação adequada.", "ok": false, "w": "Gota se apresenta em crises agudas de monoartrite (clássico no hálux), não como dor mecânica crônica."}, {"x": "Osteoartrite – iniciar AINEs conforme necessidade, associando fisioterapia, exercícios de fortalecimento muscular, orientação postural e controle de peso.", "ok": true, "w": "Dor mecânica em joelhos e mãos, rigidez curta, crepitação, osteófitos e redução do espaço = osteoartrite: analgesia, exercício, fortalecimento e controle de peso."}, {"x": "Artrite reumatoide – iniciar corticoide oral de baixa dose e recomendar repouso absoluto das articulações afetadas.", "ok": false, "w": "Artrite reumatoide é simétrica em pequenas articulações com rigidez longa; repouso absoluto também é errado."}, {"x": "Artrite psoriásica – iniciar metotrexato oral e encaminhar para reumatologia, mantendo cuidados com exercícios para evitar deformidade articular.", "ok": false, "w": "Artrite psoriásica exige psoríase, dactilite ou alterações ungueais, ausentes aqui."}], "k": "Osteófito + espaço articular reduzido + rigidez curta = osteoartrite.", "n": null}, {"id": "CI_3__2025_2_11", "b": "CI", "t": "HPB e próstata", "o": "CI 25.2 Q11", "e": "Paciente masculino, 68 anos, comparece ao ambulatório com queixa de jato urinário fraco, noctúria três vezes por noite e sensação de esvaziamento incompleto. Relata que os sintomas iniciaram há dois anos e vêm piorando progressivamente. Ao exame físico, observa-se próstata aumentada, lisa, homogênea e sem nodulações ao toque retal. O PSA encontra-se dentro da normalidade para a idade. O paciente não apresenta febre, disúria intensa ou sinais clínicos de infecção urinária. Dentre as alternativas qual é a conduta inicial mais adequada.", "a": [{"x": "Indicar prostatectomia radical com linfadenectomia pélvica, porque o aumento prostático pode representar neoplasia maligna localizada.", "ok": false, "w": "Prostatectomia radical trata câncer de próstata localizado, não hiperplasia benigna."}, {"x": "Prescrever antibioticoterapia de amplo espectro, pois sintomas urinários progressivos em idosos devem ser tratados inicialmente como prostatite bacteriana crônica.", "ok": false, "w": "Sem febre ou disúria não há prostatite; antibiótico não trata HPB."}, {"x": "Solicitar biópsia prostática, considerando a presença de sintomas urinários exacerbados em paciente idoso com aumento prostático.", "ok": false, "w": "Próstata lisa e PSA normal não indicam biópsia."}, {"x": "Iniciar tratamento medicamentoso com alfa-bloqueadores, podendo associar inibidores da 5-alfa-redutase em próstatas volumosas, mantendo seguimento ambulatorial.", "ok": true, "w": "HPB sintomática: alfabloqueador, associando inibidor da 5-alfa-redutase se a próstata for volumosa, com seguimento."}], "k": "Alfabloqueador alivia rápido; inibidor da 5-alfa-redutase reduz volume e corta o PSA pela metade.", "n": null}, {"id": "CI_3__2025_2_12", "b": "CI", "t": "Neoplasias na infância", "o": "CI 25.2 Q12", "e": "Menina de 9 anos é levada ao ambulatório pelos pais com quadro de febre diária há 4 semanas, associada a fadiga e inapetência. Em outro serviço, já havia realizado exame de urina, urocultura e radiografia de tórax normais. Na avaliação atual, o hemograma evidencia anemia normocítica (Hb 9,0 g/dL), leucócitos de 3.000/mm³ com 12% de blastos circulantes e plaquetas de 95.000/mm³. VHS e PCR encontram-se elevados. Ao exame físico, apresenta palidez cutâneo-mucosa, linfonodomegalia cervical e hepatoesplenomegalia discreta. Considerando o quadro clínico e os exames já realizados, o que priorizar para continuar a investigação diagnóstica?", "a": [{"x": "Repetir hemograma e proteína C reativa em 24 horas.", "ok": false, "w": "Repetir exames atrasa o diagnóstico quando já há blastos circulantes."}, {"x": "Realizar tomografia computadorizada de tórax e ressonância magnética de crânio.", "ok": false, "w": "Tomografia e ressonância não são o passo inicial; o diagnóstico vem da medula óssea."}, {"x": "Manter observação clínica sem solicitar novos exames adicionais no momento.", "ok": false, "w": "Observar uma criança com blastos e citopenias é inaceitável."}, {"x": "Solicitar mielograma e ultrassonografia abdominal.", "ok": true, "w": "Blastos + citopenias + febre prolongada: mielograma para diagnóstico e USG abdominal para avaliar vísceras."}], "k": "Blasto no sangue periférico de criança → mielograma.", "n": null}, {"id": "CI_3__2025_2_13", "b": "CI", "t": "Demências", "o": "CI 25.2 Q13", "e": "Durante o ambulatório de neurologia, os estudantes acompanham a avaliação de uma paciente do sexo feminino, 75 anos, com queixa de comprometimento progressivo da memória há aproximadamente dois anos. A filha relata episódios frequentes de esquecimento de eventos recentes, repetição de perguntas e desorientação esporádica, especialmente em ambientes não familiares. A paciente mantém autonomia para atividades básicas de vida diária (ABVD), porém apresenta dificuldade para realizar atividades instrumentais, como administrar contas, organizar a medicação e utilizar equipamentos eletrônicos. No exame físico, a paciente encontra-se consciente, cooperativa, sem déficits motores ou sensitivos. O Miniexame do Estado Mental (MEEM) aponta escore de 21/30, compatível com comprometimento cognitivo leve a moderado. Exames laboratoriais (função tireoidiana, vitamina B12, eletrólitos, função renal e hepática) encontram-se dentro da normalidade. A tomografia computadorizada de crânio evidencia atrofia cortical difusa, sem sinais de lesões focais, hidrocefalia ou sangramentos. Considerando o quadro clínico, a conduta terapêutica inicial mais apropriada para o controle do distúrbio da paciente é a prescrição de:", "a": [{"x": "benzodiazepínico.", "ok": false, "w": "Benzodiazepínico piora a cognição e aumenta quedas no idoso."}, {"x": "memantina.", "ok": false, "w": "Memantina é para fase moderada a grave; a paciente ainda mantém as atividades básicas."}, {"x": "psicoterapia.", "ok": false, "w": "Psicoterapia não trata o déficit cognitivo da demência."}, {"x": "rivastigmina.", "ok": true, "w": "Alzheimer leve a moderado: inibidor da acetilcolinesterase, como a rivastigmina."}], "k": "Primeira linha no Alzheimer leve a moderado: inibidor da colinesterase.", "n": null}, {"id": "HAM_2024_2_1", "b": "HAM", "t": "Atendimento inicial", "o": "HAM 24.2 Q1", "e": "Vítima de atropelamento por carro, 9 anos, sem perda de consciência imediata, referindo dor abdominal intensa durante atendimento pré-hospitalar evolui com rebaixamento de nível de consciência (Glasgow 6) e pressão arterial inaudível, abdome tenso e equimose periumbilical. Identifique a sequência correta de medidas recomendadas no atendimento pré-hospitalar dessa criança.", "a": [{"x": "Abertura de vias aéreas, colocação de colar cervical, aquisição de acesso venoso periférico calibroso, intubação orotraqueal, administração de cristalóide e infusão de drogas vasoativas, transporte rápido para unidade de pronto-atendimento.", "ok": false, "w": "Droga vasoativa não trata choque hemorrágico, e unidade de pronto-atendimento não resolve sangramento abdominal."}, {"x": "Abertura de vias aéreas, colocação de colar cervical, intubação orotraqueal, aquisição de acesso venoso periférico calibroso, administração de colóide, transporte rápido para unidade de pronto-atendimento.", "ok": false, "w": "Coloide não é o fluido inicial, e o destino também está errado: a criança precisa de centro de trauma."}, {"x": "Aquisição de acesso venoso periférico calibroso, administração de cristalóide, abertura de vias aéreas, intubação orotraqueal, colocação de colar cervical e transporte rápido para centro hospitalar de trauma.", "ok": false, "w": "Acesso venoso antes da via aérea inverte a ordem numa criança com Glasgow 6."}, {"x": "Abertura de vias aéreas, colocação de colar cervical, intubação orotraqueal, aquisição de acesso venoso periférico calibroso, administração de cristalóide, transporte rápido para centro hospitalar de trauma.", "ok": true, "w": "Via aérea com proteção cervical, intubação (Glasgow 6), acesso calibroso, cristaloide e transporte rápido para centro de trauma."}], "k": "Choque hemorrágico abdominal precisa de cirurgia: transportar para centro de trauma, não para a UPA.", "n": null}, {"id": "HAM_2024_2_2", "b": "HAM", "t": "Afogamento", "o": "HAM 24.2 Q2", "e": "Um jovem, de 15 anos, foi encontrado flutuando em um rio por uma equipe de resgate e foi retirado da água. Quando a equipe de atendimento médico pré-hospitalar chega ao local, o paciente está inconsciente, sem respiração espontânea, com pulso carotídeo presente. Qual a classificação e o manejo adequado inicial para este paciente afogado?", "a": [{"x": "Grau 4 de afogamento, deve iniciar a monitorização do ritmo cardíaco e avaliar a necessidade de desfibrilação precoce, enquanto oferece oxigênio suplementar com máscara facial a 15l/min.", "ok": false, "w": "No grau 4 o paciente ainda respira; aqui há apneia com pulso."}, {"x": "Grau 5 de afogamento, deve receber suporte de ventilação assistida com bolsa-válvula-máscara (BVM) com oxigênio em alto fluxo, priorizando a correção da hipóxia e considerar a intubação orotraqueal.", "ok": true, "w": "Apneia com pulso carotídeo = grau 5: ventilar imediatamente com bolsa-válvula-máscara e O₂, considerando intubação."}, {"x": "Grau 4 de afogamento, deve posicionar o paciente em decúbito lateral esquerdo para drenar a água dos pulmões antes de iniciar qualquer outra intervenção.", "ok": false, "w": "Não se drena água dos pulmões; posicionar e esperar atrasa a ventilação, que é a prioridade."}, {"x": "Grau 5 de afogamento, deve realizar compressões torácicas imediatamente, seguido de ventilação com oxigênio a 15 L/min com bolsa-válvula-máscara, independente da presença de pulso, considerando a possibilidade de hipóxia severa.", "ok": false, "w": "Com pulso presente não se fazem compressões torácicas."}], "k": "Grau 5 = apneia com pulso → ventilar. Grau 6 = PCR → RCP começando pelas ventilações.", "n": null}, {"id": "HAM_2024_2_3", "b": "HAM", "t": "Atendimento inicial", "o": "HAM 24.2 Q3", "e": "Um homem de 45 anos, foi envolvido em um acidente automobilístico frontal. Ele apresenta sinais de dor em várias áreas do corpo e tem uma história de perda de consciência breve após o impacto. Ele não apresenta sinais visíveis de hemorragia externa grave, mas relata dor no peito e no abdômen. A avaliação primária do paciente não revelou sinais de obstrução das vias aéreas ou de choque evidente. Decide-se prosseguir com a avaliação secundária. Sobre a avaliação e gestão dos cuidados com este paciente, deve-se:", "a": [{"x": "executar a avaliação secundária imediatamente após a avaliação primária, incluindo a coleta do histórico SAMPLE, um exame físico completo e a mensuração dos sinais vitais para identificar lesões não evidentes inicialmente.", "ok": true, "w": "Completada a avaliação primária, segue-se a secundária: SAMPLA, exame da cabeça aos pés e sinais vitais para achar lesões ocultas."}, {"x": "adiar a avaliação secundária até que o paciente esteja estabilizado. Inicialmente, concentrar apenas no tratamento de lesões visíveis e no gerenciamento da dor.", "ok": false, "w": "Adiar indefinidamente a avaliação secundária deixa lesões ocultas passarem."}, {"x": "concentrar na avaliação secundária se o paciente evoluir com sinais de comprometimento hemodinâmico. A avaliação deve se limitar à mensuração dos sinais vitais e à verificação de possíveis sangramentos externos.", "ok": false, "w": "Se o paciente piora hemodinamicamente, volta-se à avaliação primária, não à secundária."}, {"x": "realizar a avaliação secundária somente se a avaliação primária não revelar lesões críticas, focando na verificação rápida dos sinais vitais e na coleta do histórico médico.", "ok": false, "w": "Lesões críticas são tratadas na primária; controladas, a secundária é feita do mesmo jeito."}], "k": "Piorou? Volte ao xABCDE. Estabilizou? Siga para a secundária com SAMPLA.", "n": null}, {"id": "HAM_2024_2_4", "b": "HAM", "t": "Via aérea e ventilação", "o": "HAM 24.2 Q4", "e": "Um jovem de 25 anos, vítima de um acidente automobilístico de alta velocidade, é atendido pela equipe do serviço de emergência médica pré-hospitalar. Ele estava no banco do passageiro e não usava cinto de segurança. No local, apresenta-se inconsciente, com respiração ruidosa e irregular. Qual deve ser a abordagem inicial mais adequada para garantir a permeabilidade das vias aéreas e a estabilização inicial do paciente?", "a": [{"x": "Intubação orotraqueal imediata, independentemente da posição cervical, para garantir a proteção das vias aéreas e evitar a aspiração.", "ok": false, "w": "Intubar 'independentemente da posição cervical' viola a proteção da coluna, e o primeiro passo é abrir a via aérea."}, {"x": "Aplicação imediata de uma cânula orofaríngea e ventilação com máscara de válvula e reservatório, seguido de monitorização dos sinais vitais e imobilização de possíveis fraturas.", "ok": false, "w": "Cânula e ventilação sem antes desobstruir e sem proteger a coluna pulam a manobra básica."}, {"x": "Manobra de tração mandibular com controle da coluna cervical para abrir as vias aéreas e, se necessário, aspiração e ventilação assistida com bolsa-válvula-máscara.", "ok": true, "w": "Inconsciente com respiração ruidosa: tração da mandíbula com controle cervical, aspiração se necessário e ventilação assistida."}, {"x": "Realização de uma cricotireoidostomia de emergência devido à provável obstrução das vias aéreas superiores.", "ok": false, "w": "Cricotireoidostomia é para falha de intubação e ventilação, não a primeira medida."}], "k": "No trauma, abrir via aérea com tração da mandíbula, nunca hiperextensão do pescoço.", "n": null}, {"id": "HAM_2024_2_7", "b": "HAM", "t": "Queimaduras", "o": "HAM 24.2 Q7", "e": "Em um incêndio em uma boate com múltiplas vítima, uma equipe do SAMU é direcionada para uma vítima do sexo masculino, de 20 anos de idade, triada como prioridade imediata (vermelho). Ele está no solo, consciente; porém, desorientado e agitado. Apresenta queimaduras nos supercílios, na barba, no tórax e no abdome. Está com saturação periférica de O2 (SpO2) de 99%, taquipneico, respiração regular e não ruidosa. Segundo a equipe que realizou a triagem START, esse paciente foi retirado de dentro do estabelecimento enquanto tentava ajudar no socorro de outras vítimas. Após análise do caso, assinale a alternativa correta em relação às prioridades de atendimento.", "a": [{"x": "Essa vítima deve ser retirada imediatamente do local, deve receber oxigênio por máscara com a maior fração inspirada possível (FiO2), e a extensão das lesões deve ser avaliadas após exposição e proteção contra hipotermia. A cena implica perigo para a equipe e para a vítima.", "ok": true, "w": "Cena perigosa: retirar a vítima. Pelos da face queimados e agitação após fumaça sugerem inalação e CO → O₂ na maior FiO₂; expor e proteger contra hipotermia."}, {"x": "Reanimação volêmica (C) é prioridade de atendimento nesse caso. As lesões devem ser avaliadas quanto à sua profundidade e quanto à sua extensão, determinando a área de superfície corpórea queimada (ASCQ) e utilizando a fórmula de Parkland para guiar essa conduta.", "ok": false, "w": "Volume não vem antes de via aérea e oxigenação, e o cálculo por Parkland é feito depois."}, {"x": "A agitação e desorientação não têm relação com o incidente de queimadura e uma outra causa deve ser pensada (trauma craniano, condições pré-existentes). A disfunção neurológica (D) deve ser avaliada sempre após avaliação de via aérea, respiração e circulação.", "ok": false, "w": "Agitação após fumaça em ambiente fechado é intoxicação por CO ou cianeto até prova em contrário."}, {"x": "A boa saturação periférica de O2 (99%) revela uma estabilidade ventilatória (A) e respiratória (B). Apesar de a vítima apresentar sinais de alerta para queimaduras de via aérea, como presença de pelos queimados na face, não apresenta respiração ruidosa, com estridor.", "ok": false, "w": "O oxímetro não distingue carboxi-hemoglobina: SpO₂ 99% não afasta intoxicação nem lesão inalatória."}], "k": "Vítima de incêndio confusa com SpO₂ normal: pensar em monóxido de carbono e dar O₂ a 100%.", "n": null}, {"id": "HAM_2024_2_8", "b": "HAM", "t": "Atendimento inicial", "o": "HAM 24.2 Q8", "e": "Um interno, no estágio do SAMU, está atendendo a um acidente de trânsito com múltiplas vítimas, incluindo uma criança de 7 anos e um idoso de 75 anos. Durante a avaliação primária e secundária, é fundamental considerar as diferenças anatômicas e fisiológicas entre essas faixas etárias para determinar a abordagem adequada. Assinale a alternativa que descreve a conduta mais apropriada durante a avaliação e o manejo inicial dessas duas vítimas, considerando as características específicas de cada faixa etária.", "a": [{"x": "Na avaliação primária do idoso, focar na avaliação do ABC (vias aéreas, respiração e circulação) de forma padrão; na criança, realizar a ventilação manual com volumes maiores devido à maior complacência torácica, garantindo uma oxigenação eficaz.", "ok": false, "w": "Volumes maiores na criança causam barotrauma; o volume deve ser adequado ao peso."}, {"x": "Realizar a avaliação primária do idoso priorizando a imobilização cervical, devido ao alto risco de lesão cervical e comprometimento prévio das vias aéreas; priorizar, em ambos, a proteção térmica, pois a superfície corporal maior da criança em relação ao peso corporal a torna mais suscetível à hipotermia e o idoso devido à uma menor capacidade de regulação térmica.", "ok": true, "w": "Idoso tem mais risco de lesão cervical com pouca energia; criança e idoso perdem calor com facilidade, então proteção térmica em ambos."}, {"x": "Realizar a avaliação primária do idoso com foco na investigação de fraturas pélvicas, que são comuns nessa faixa etária; na criança, priorizar a avaliação da cabeça e do abdome, pois a cabeça grande em relação ao corpo e a maior complacência abdominal aumentam o risco de lesões internas.", "ok": false, "w": "Fratura pélvica não é prioridade da avaliação prim
