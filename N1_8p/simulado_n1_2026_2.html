ária no idoso; a coluna cervical é."}, {"x": "Na avaliação primária, tanto no idoso quanto na criança, deve-se priorizar a avaliação da via aérea; no idoso, realizar ventilação com alta pressão devido à menor complacência pulmonar, enquanto na criança, utilizar a técnica de tração mandibular sem imobilização cervical, já que a flexibilidade da coluna minimiza o risco de lesões.", "ok": false, "w": "Retirar a proteção cervical na criança é errado, assim como ventilar o idoso com alta pressão."}], "k": "Idoso: coluna cervical frágil e betabloqueador mascarando taquicardia. Criança: hipotermia rápida e hipotensão tardia.", "n": null}, {"id": "HAM_2024_2_10", "b": "HAM", "t": "Calor", "o": "HAM 24.2 Q10", "e": "Durante uma maratona realizada em um dia de calor intenso, um corredor apresenta sinais de exaustão pelo calor, incluindo tontura, sudorese profusa e câimbras musculares. Para a prevenção do quadro descrito, qual das estratégias seria a mais indicada para evitar a progressão para insolação?", "a": [{"x": "Oferecer pequenas quantidades de soluções eletrolíticas isotônicas em intervalos regulares, para manter o equilíbrio hídrico e evitar hiponatremia.", "ok": true, "w": "Exaustão pelo calor com consciência preservada: solução eletrolítica isotônica em pequenas quantidades e intervalos regulares."}, {"x": "Fornecer água gelada para consumo rápido, a fim de baixar a temperatura corporal e prevenir insolação.", "ok": false, "w": "Água gelada rápida não repõe eletrólitos e não é a estratégia principal."}, {"x": "Incentivar a ingestão de grandes volumes de água pura, para compensar rapidamente a perda de líquidos e prevenir a desidratação.", "ok": false, "w": "Grandes volumes de água pura diluem o sódio e causam hiponatremia associada ao exercício."}, {"x": "Administrar suplementos de sódio imediatamente para evitar a hiponatremia associada ao exercício intenso.", "ok": false, "w": "Suplemento de sódio isolado e imediato não é a primeira medida."}], "k": "Exaustão: menos de 40 °C e SNC normal. Intermação: 40 °C ou mais com alteração neurológica → resfriar já.", "n": null}, {"id": "HAM_2025_1_1", "b": "HAM", "t": "Via aérea e ventilação", "o": "HAM 25.1 Q1", "e": "Durante um atendimento em via pública, uma equipe de emergência se depara com um homem de 45 anos, inconsciente após uma colisão automobilística. O paciente apresenta respiração irregular e ruidosa, cianose perioral, retrações intercostais e uso evidente de musculatura acessória. Está impossibilitado de verbalizar e não responde a estímulos verbais. A ausculta pulmonar revela murmúrio vesicular globalmente diminuído, e há suspeita de trauma cranioencefálico. A equipe nota acúmulo de secreção em cavidade oral, sem vômitos ou sangramentos ativos. Qual conduta inicial está mais alinhada ao manejo adequado da via aérea neste paciente?", "a": [{"x": "Iniciar oxigenoterapia por máscara com reservatório de alta concentração para corrigir a hipoxemia antes de intervir na via aérea.", "ok": false, "w": "O₂ não chega aos pulmões com a via aérea obstruída por secreção e queda da língua; primeiro desobstruir."}, {"x": "Aplicar ventilação com bolsa-válvula-máscara imediatamente, com pressão positiva, para expandir os alvéolos e melhorar a troca gasosa.", "ok": false, "w": "Ventilar com pressão positiva antes de aspirar empurra secreção para os pulmões."}, {"x": "Realizar tração mandibular associada à aspiração das vias aéreas superiores, visando desobstrução e manutenção da patência.", "ok": true, "w": "Inconsciente com gorgolejo: tração da mandíbula com proteção cervical e aspiração para desobstruir."}, {"x": "Introduzir cânula orofaríngea e aguardar melhora da respiração espontânea antes de realizar intervenções adicionais.", "ok": false, "w": "Colocar cânula sem aspirar e 'aguardar melhora' mantém a obstrução."}], "k": "Gorgolejo = líquido → aspirar. Ronco = língua → tração da mandíbula.", "n": null}, {"id": "HAM_2025_1_4", "b": "HAM", "t": "Choque", "o": "HAM 25.1 Q4", "e": "Um homem de 34 anos, previamente hígido, sofre um acidente automobilístico com colisão frontal em alta velocidade. No atendimento pré-hospitalar, apresenta-se confuso, pálido, diaforético, com pulsos finos e frequentes. Os sinais vitais são: frequência cardíaca de 135 bpm, pressão arterial de 85/50 mmHg, frequência respiratória de 28 irpm e saturação periférica de oxigênio de 93% em ar ambiente. O exame físico revela extremidades frias e tempo de enchimento capilar de 5 segundos. Assinale a alternativa correta.", "a": [{"x": "O paciente apresenta choque distributivo, com indicação de início imediato de droga vasopressora endovenosa.", "ok": false, "w": "Choque distributivo teria pele quente; vasopressor piora o choque hemorrágico."}, {"x": "O uso de inotrópicos deve ser a primeira medida terapêutica, pois o paciente apresenta provável choque cardiogênico devido à contusão miocárdica.", "ok": false, "w": "Choque cardiogênico traria turgência jugular e congestão; inotrópico não é primeira medida."}, {"x": "O quadro clínico é compatível com pneumotórax hipertensivo e deve ser procedida a toracocentese de alívio no quinto espaço intercostal.", "ok": false, "w": "Pneumotórax hipertensivo exigiria murmúrio abolido, hipertimpanismo e jugulares túrgidas, não descritos."}, {"x": "O paciente apresenta choque hipovolêmico, e deve-se focar na expansão volêmica, controle da hemorragia e reposição guiada por parâmetros clínicos.", "ok": true, "w": "Pele fria, pulsos finos, enchimento lento, taquicardia e hipotensão após colisão = choque hipovolêmico: controlar sangramento e repor volume."}], "k": "No trauma, choque é hemorrágico até prova em contrário.", "n": null}, {"id": "HAM_2025_1_5", "b": "HAM", "t": "Via aérea e ventilação", "o": "HAM 25.1 Q5", "e": "Um homem de 45 anos, com histórico de trauma cranioencefálico grave há 1 hora, chega ao pronto-socorro trazido pelo serviço de atendimento médico de urgência (SAMU). Ele apresenta Glasgow Coma Scale (GCS) de 6, esforço respiratório intenso, estridor e hipoxemia progressiva (SatO₂ 80% em ar ambiente). No atendimento inicial, foi realizada ventilação com bolsa-válvula-máscara (BVM) com oxigênio a 100%, porém sem melhora significativa da saturação. O exame físico revela agitação psicomotora intercalada com períodos de apneia, cianose labial e retrações intercostais acentuadas, sinais de lesão facial traumática com hematoma periorbitário bilateral (\"sinal de guaxinim\") e equimose retroauricular unilateral (\"sinal de Battle\"), sugerindo fratura de base de crânio. Qual é a conduta imediata para o manejo da via aérea desse paciente?", "a": [{"x": "Proceder diretamente à cricotireoidostomia ou traqueostomia devido à presença de estridor e suspeita de obstrução de vias aéreas superiores, o que contraindica a intubação.", "ok": false, "w": "Estridor não contraindica intubação, e o ATLS 11 nem considera traqueostomia via de emergência."}, {"x": "Realizar intubação nasotraqueal, pois causa menos estímulo do que a via orotraqueal em pacientes com TCE, mantendo a sequência de medicamentos pré conforme protocolo.", "ok": false, "w": "Intubação nasotraqueal é contraindicada com sinais de fratura de base de crânio (e em apneia)."}, {"x": "Realizar intubação orotraqueal com sequência rápida, utilizando a ordem correta dos medicamentos: agente de indução, sedativo e, por último, bloqueador neuromuscular.", "ok": true, "w": "Glasgow 6 com estridor = via aérea definitiva orotraqueal em sequência rápida, sedando antes de paralisar."}, {"x": "Manter ventilação com bolsa-válvula-máscara e tentar um dispositivo supraglótico (ex.: máscara laríngea) para evitar elevação da pressão intracraniana e passar sonda nasoenteral.", "ok": false, "w": "Supraglótico não é via aérea definitiva, e sonda nasal é contraindicada com fratura de base de crânio."}], "k": "Olhos de guaxinim ou sinal de Battle: nada pelo nariz (nem tubo, nem sonda).", "n": "A alternativa correta fala em 'agente de indução, sedativo e bloqueador'. Indução e sedação são a mesma etapa; o que importa é sedar antes de paralisar."}, {"id": "HAM_2025_1_6", "b": "HAM", "t": "Atendimento inicial", "o": "HAM 25.1 Q6", "e": "Após uma colisão automobilística, um homem de 42 anos é atendido pela equipe do serviço de emergência. Ele encontra-se consciente, orientado, com sinais vitais estáveis e sem evidência de ameaças imediatas à vida durante a avaliação primária, que foi completada com sucesso. A equipe segue, então, com a próxima etapa do atendimento, conforme os princípios do PHTLS. Qual das condutas é apropriada para a etapa subsequente do atendimento pré-hospitalar?", "a": [{"x": "Colocação de acesso venoso calibroso para reposição volêmica.", "ok": false, "w": "Sem sinais de choque, não há indicação imediata de reposição volêmica."}, {"x": "Drenagem torácica em selo d’água.", "ok": false, "w": "Dreno torácico sem pneumotórax ou hemotórax não tem indicação."}, {"x": "Intubação orotraqueal com proteção cervical.", "ok": false, "w": "Paciente consciente, orientado e estável não precisa de via aérea definitiva."}, {"x": "Exame físico completo da cabeça aos pés e coleta da história SAMPLA.", "ok": true, "w": "Avaliação primária sem alterações: seguir para a secundária com exame da cabeça aos pés e SAMPLA."}], "k": "SAMPLA: sintomas, alergias, medicamentos, passado médico, líquidos e última refeição, ambiente e eventos.", "n": null}, {"id": "HAM_2025_1_7", "b": "HAM", "t": "Queimaduras", "o": "HAM 25.1 Q7", "e": "Uma equipe de emergência é acionada para atender um incêndio em uma boate com dezenas de vítimas. No local, encontram-se várias pessoas com queimaduras de diferentes graus, além de sintomas respiratórios. Entre os pacientes, destacam-se os seguintes casos: Paciente 1: Homem, 25 anos, com queimaduras de segundo grau em aproximadamente 20% da superfície corporal (membros superiores e tronco anterior), apresentando rouquidão e dispneia leve. Paciente 2: Mulher, 30 anos, com queimaduras de terceiro grau extensas (>40% da superfície corporal), inconsciente, com sinais de choque hipovolêmico. Paciente 3: Homem, 40 anos, sem queimaduras aparentes, mas com confusão mental e saturação de O₂ em 88%, após inalação de fumaça. Com base no atendimento a múltiplas vítimas queimadas, qual deve ser a conduta inicial da equipe de emergência?", "a": [{"x": "Intubar precocemente o paciente 1 devido ao risco de obstrução de vias aéreas, iniciar hidratação venosa e administrar oxigenoterapia de alto fluxo para o paciente 3.", "ok": true, "w": "Rouquidão + dispneia = via aérea ameaçada por edema → intubar cedo. Confusão com SpO₂ 88% após fumaça → O₂ de alto fluxo."}, {"x": "Realizar curativos com pomada antibiótica para os queimados, administrar corticoides para os pacientes com sintomas respiratórios e iniciar analgesia para todos.", "ok": false, "w": "Corticoide não é indicado na lesão inalatória, e pomada não é prioridade no atendimento inicial."}, {"x": "Monitorar o paciente 3 antes de qualquer outra conduta, pois a confusão mental pode indicar lesão neurológica grave que precisa ser avaliada.", "ok": false, "w": "Apenas monitorar atrasa O₂ numa provável intoxicação por CO ou cianeto."}, {"x": "Priorizar a ressuscitação volêmica do paciente 2, pois é a vítima com as queimaduras mais extensas e risco iminente de morte.", "ok": false, "w": "Mais de 40% de 3º grau em choque tem prognóstico reservado; a prioridade vai para quem mais se beneficia de intervenção imediata."}], "k": "Rouquidão ou estridor em queimado: intubar antes que o edema feche a via aérea.", "n": null}, {"id": "HAM_2025_1_8", "b": "HAM", "t": "Choque", "o": "HAM 25.1 Q8", "e": "Um paciente de 30 anos sofreu um acidente de moto em alta velocidade e foi encontrado inconsciente pela equipe de atendimento pré-hospitalar. Ele apresentava sinais de múltiplos traumas, incluindo fraturas expostas nos membros inferiores, pneumotórax e sinais de choque hipovolêmico. A equipe realizou intubação orotraqueal, drenagem torácica e administrou fluidos intravenosos. O paciente foi imobilizado com colar cervical e colocado em uma prancha rígida para transporte ao hospital. Durante o transporte, o monitoramento revelou hipotensão persistente, taquicardia e saturação de oxigênio em 85%. Qual das alternativas descreve a resposta orgânica fisiológica ao politrauma, considerando o quadro clínico e as intervenções realizadas?", "a": [{"x": "A intubação orotraqueal causa uma resposta vagal que resulta em bradicardia e hipertensão transitória, estabilizando o quadro hemodinâmico do paciente.", "ok": false, "w": "Intubação não estabiliza choque; resposta vagal causaria bradicardia e hipotensão."}, {"x": "A ativação do eixo hipotálamo-hipófise-adrenal resulta na liberação de catecolaminas, causando taquicardia e vasoconstrição periférica para manter a perfusão dos órgãos vitais.", "ok": true, "w": "A resposta ao trauma libera catecolaminas → taquicardia e vasoconstrição periférica para preservar coração e cérebro."}, {"x": "O pneumotórax provoca uma diminuição da pressão intratorácica, facilitando a ventilação e oxigenação adequadas sem necessidade de drenagem torácica.", "ok": false, "w": "Pneumotórax prejudica a ventilação e, se hipertensivo, precisa de descompressão."}, {"x": "A administração de fluidos intravenosos leva à normalização imediata da pressão arterial e estabilização dos sinais vitais, sem necessidade de intervenções adicionais.", "ok": false, "w": "Volume não normaliza tudo de imediato; é preciso controlar a fonte e dar sangue."}], "k": "Choque compensado: taquicardia e vasoconstrição vêm antes da hipotensão.", "n": "Tecnicamente, as catecolaminas vêm do sistema simpático e da medula adrenal; o eixo hipotálamo-hipófise-adrenal libera cortisol. A alternativa ainda é a melhor."}, {"id": "HAM_2025_1_9", "b": "HAM", "t": "Choque", "o": "HAM 25.1 Q9", "e": "Um jovem de 17 anos é atendido por equipe pré-hospitalar após sofrer uma queda de motocicleta em alta velocidade. Encontra-se consciente, porém confuso, com pele fria e úmida, extremidades pálidas e pulsos filiformes. A pressão arterial é de 90/60 mmHg e a frequência cardíaca é de 138 bpm. Apresenta fratura exposta em fêmur esquerdo com sangramento ativo. A gasometria venosa mostra pH 7,20, bicarbonato de 16 mEq/L e lactato elevado. Qual das alternativas a seguir está mais diretamente relacionada ao quadro apresentado?", "a": [{"x": "A hiperventilação causada pela dor intensa leva à alcalose metabólica, justificando a alteração do pH observada.", "ok": false, "w": "Hiperventilação causaria alcalose respiratória, não metabólica, e o pH está ácido."}, {"x": "O estado ácido-base permanece estável, sendo a gasometria compatível com função celular preservada.", "ok": false, "w": "pH 7,20, bicarbonato 16 e lactato alto mostram acidose metabólica, não estabilidade."}, {"x": "A perda volêmica compromete a perfusão tecidual, levando à acidose metabólica por metabolismo anaeróbico.", "ok": true, "w": "Hipoperfusão → metabolismo anaeróbico → lactato → acidose metabólica."}, {"x": "A fratura de fêmur, por ser localizada, não causa repercussão significativa sobre o estado hemodinâmico geral.", "ok": false, "w": "Fratura de fêmur pode sangrar 1 a 1,5 L e contribuir muito para o choque."}], "k": "Lactato alto e déficit de base são marcadores de hipoperfusão no choque.", "n": null}, {"id": "HAM_2025_1_10", "b": "HAM", "t": "Afogamento", "o": "HAM 25.1 Q10", "e": "Paciente masculino, 41 anos, é resgatado após afogamento por submersão em cachoeira. Ao ser socorrido pela equipe do SAMU, encontra-se consciente, apresentando tosse com muita espuma e hipotensão arterial. ACV: RCR 2T BNF; FC: 112 bpm; PA: 86x51 mmHg, sem pulso radial palpável, com presença de pulso carotídeo. AR: Murmúrio vesicular diminuído em bases e com estertores crepitantes difusos; FR: 32 irpm; SpO2: 89 % ABD: Flácido, depressível, indolor, peristalse presente MMII: Sem edemas; Panturrilhas flácidas. Qual é o grau de afogamento da vítima?", "a": [{"x": "5", "ok": false, "w": "Grau 5 é parada respiratória isolada com pulso; o paciente está consciente e respirando."}, {"x": "3", "ok": false, "w": "Grau 3 tem edema pulmonar com pulso radial presente e sem hipotensão."}, {"x": "2", "ok": false, "w": "Grau 2 tem pouca espuma e estertores só em alguns campos."}, {"x": "4", "ok": true, "w": "Muita espuma (edema pulmonar) + hipotensão e pulso radial ausente = grau 4 de Szpilman."}], "k": "Grau 3 × 4: o pulso radial e a pressão separam.", "n": "Gabarito corrigido: o relatório da prova marcou grau 5 usando uma tabela de Szpilman errada."}, {"id": "IESC_2024_2_1", "b": "IESC", "t": "Participação complementar", "o": "IESC 24.2 Q1", "e": "O Dr. José, médico de uma Unidade Básica de Saúde (UBS), está enfrentando um aumento significativo no número de pacientes que necessitam de exames especializados que não são oferecidos pela UBS. Para lidar com essa demanda crescente, a gestão da UBS decidiu recorrer aos serviços privados de saúde para garantir que os pacientes recebam o atendimento necessário sem sobrecarregar a unidade. Diante disso, analise as afirmativas abaixo quanto a participação complementar dos Serviços de Saúde privados no Sistema Único de Saúde (SUS).\nI. Para a efetiva participação dos serviços privados no SUS podem ser utilizados os convênios ou contratos como instrumentos contratuais.\nII. Devem ser contratualizados diretamente os serviços privados mais próximos da UBS, sem a necessidade de avaliação da qualidade, para garantir maior agilidade no atendimento dos pacientes.\nIII. Deve ser feita uma análise da capacidade técnica e a qualidade dos serviços privados antes da contratualização.\nIV. Devem ser priorizados os serviços que tenham contratos antigos com o SUS, sem nova avaliação.\nÉ correto o que se afirma em", "a": [{"x": "I, II, III e IV.", "ok": false, "w": "II e IV estão erradas: contratar sem avaliar qualidade ou manter contrato antigo sem reavaliar contraria as normas do SUS."}, {"x": "II, III e IV.", "ok": false, "w": "II e IV são falsas."}, {"x": "III e IV.", "ok": false, "w": "IV é falsa, e I, que é verdadeira, ficou de fora."}, {"x": "I e III.", "ok": true, "w": "Convênio ou contrato são os instrumentos corretos (I), e capacidade técnica e qualidade são avaliadas antes de contratar (III)."}], "k": "Privado complementar: só quando a rede pública é insuficiente, com avaliação prévia, monitoramento e auditoria.", "n": null}, {"id": "IESC_2024_2_3", "b": "IESC", "t": "Auditoria", "o": "IESC 24.2 Q3", "e": "Um médico está participando de uma auditoria no Sistema Único de Saúde (SUS) para avaliar a qualidade e a eficiência dos serviços prestados em um hospital. Para garantir uma auditoria eficaz, é essencial revisar e considerar diversos componentes do processo. Sobre os componentes essenciais para a realização de uma auditoria no âmbito da saúde pública, considere as seguintes afirmações:\nI. Revisar os registros médicos e administrativos é fundamental para garantir que os processos e os procedimentos estejam sendo realizados de acordo com os padrões estabelecidos e identificar possíveis falhas ou irregularidades.\nII. A análise dos dados financeiros e orçamentários é crucial para verificar a conformidade com as normas de gestão financeira e assegurar que os recursos estão sendo utilizados de forma eficiente e transparente.\nIII. Realizar entrevistas com os pacientes é uma prática comum na auditoria para obter feedback direto sobre a qualidade do atendimento recebido, mas não é essencial para o processo de auditoria.\nMarque a alternativa que aponte as afirmativas corretas sobre os componentes essenciais da auditoria no SUS.", "a": [{"x": "Apenas I e II estão corretas.", "ok": true, "w": "Registros médicos e administrativos e dados financeiros são componentes essenciais; entrevista com usuário ajuda, mas é complementar."}, {"x": "Apenas I e III estão corretas.", "ok": false, "w": "A análise financeira (II) é essencial e ficou de fora."}, {"x": "Apenas II e III estão corretas.", "ok": false, "w": "A revisão de registros (I) é essencial e ficou de fora."}, {"x": "I, II e III estão corretas.", "ok": false, "w": "A questão considerou a entrevista (III) complementar, não essencial."}], "k": "Auditoria do SUS olha conformidade da assistência e uso dos recursos.", "n": null}, {"id": "IESC_2024_2_4", "b": "IESC", "t": "Gerenciamento da UBS", "o": "IESC 24.2 Q4", "e": "Em sua UBS, a equipe está enfrentando desafios significativos relacionados a conflitos interpessoais entre os membros. Esses conflitos estão começando a afetar a eficiência do atendimento e o ambiente de trabalho. Como gestor da UBS, você precisa adotar estratégias para mediar esses conflitos e melhorar a dinâmica da equipe. Com base no contexto apresentado, assinale a alternativa que demonstra uma abordagem eficaz para mediar conflitos interpessoais na equipe da UBS e promover um ambiente de trabalho mais colaborativo.", "a": [{"x": "Aplicar sanções disciplinares imediatas aos membros da equipe envolvidos nos conflitos para desestimular comportamentos indesejados.", "ok": false, "w": "Punição imediata não trata a causa e piora o clima da equipe."}, {"x": "Permitir que os conflitos se resolvam naturalmente sem intervenção da gestão, a fim de não sobrecarregar a administração com questões pessoais.", "ok": false, "w": "Omissão da gestão deixa o conflito crescer e afetar o atendimento."}, {"x": "Focar exclusivamente em recompensar o desempenho individual para motivar a equipe e minimizar a ocorrência de conflitos.", "ok": false, "w": "Foco só no desempenho individual estimula competição, não colaboração."}, {"x": "Promover reuniões regulares para discussão de problemas e incentivar a comunicação aberta, diálogo, empatia e escuta ativa entre os membros da equipe.", "ok": true, "w": "Reuniões regulares com comunicação aberta, escuta ativa e empatia tratam a causa do conflito."}], "k": "Conflito na UBS: espaço de diálogo mediado pela gestão.", "n": null}, {"id": "IESC_2024_2_5", "b": "IESC", "t": "Origens do SUS", "o": "IESC 24.2 Q5", "e": "A Constituição Federal de 1988 marcou um importante avanço na saúde pública brasileira ao estabelecer a saúde como um direito de todos e um dever do Estado, garantindo o acesso universal e igualitário às ações e serviços de saúde por meio do Sistema Único de Saúde (SUS). Para regulamentar esses princípios constitucionais, foram criadas as leis 8.080/1990 e 8.142/1990. Considerando as informações apresentadas, avalie as asserções a seguir e a relação proposta entre elas.\nI. A Lei 8.142/1990 regulamentou a participação popular na gestão e estabeleceu os mecanismos de controle social, promovendo a inclusão da sociedade no processo decisório do SUS.\nPORQUE\nII. A Lei nº 8.080/90 dispõe sobre as condições para a promoção, proteção e recuperação da saúde, a organização e o funcionamento dos serviços correspondentes.\nA respeito dessas asserções, assinale a opção correta.", "a": [{"x": "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "ok": false, "w": "A II também é verdadeira: a Lei 8.080 trata das condições de promoção, proteção e recuperação da saúde e da organização dos serviços."}, {"x": "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "ok": false, "w": "A I também é verdadeira: a Lei 8.142 trata da participação da comunidade e das transferências de recursos."}, {"x": "As asserções I e II são proposições verdadeiras.", "ok": true, "w": "As duas asserções descrevem corretamente as leis orgânicas da saúde."}, {"x": "As asserções I e II são proposições falsas.", "ok": false, "w": "As duas estão corretas."}], "k": "8.080: organização e funcionamento. 8.142: participação social e financiamento.", "n": null}, {"id": "IESC_2024_2_6", "b": "IESC", "t": "Planejamento no SUS", "o": "IESC 24.2 Q6", "e": "A Secretaria Municipal de Saúde de um pequeno município está em processo de revisão do seu Plano de Saúde para os próximos quatro anos. Durante uma reunião com a equipe gestora, foram discutidos os instrumentos essenciais para o planejamento e a gestão no âmbito do Sistema Único de Saúde (SUS). Considerando esse contexto, analise as afirmações abaixo:\nI. O Plano de Saúde é um documento estratégico que define as diretrizes, objetivos e metas para a saúde de uma população ao longo de um período de quatro anos.\nII. A Programação Anual de Saúde é o instrumento que operacionaliza as intenções expressas no Plano de Saúde e tem por objetivo anualizar as metas do Plano de Saúde e prever a alocação dos recursos orçamentários a serem executados.\nIII. O Relatório de Gestão é um documento que deve ser elaborado anualmente e apresenta uma análise detalhada da execução das ações e dos recursos utilizados, além de avaliar o cumprimento das metas estabelecidas.\nIV. A Programação Anual de Saúde é o principal documento utilizado para o planejamento estratégico de longo prazo, enquanto o Plano de Saúde é um documento de curto prazo que orienta as ações imediatas.\nQuanto aos instrumentos acima, é correto o que se afirma em:", "a": [{"x": "apenas I e III estão corretas.", "ok": false, "w": "A II também está correta: a programação anual operacionaliza o plano."}, {"x": "I, II, III e IV estão corretas.", "ok": false, "w": "A IV inverte os prazos dos instrumentos."}, {"x": "apenas I, II e III estão corretas.", "ok": true, "w": "I, II e III descrevem corretamente plano, programação anual e relatório de gestão."}, {"x": "apenas III e IV estão corretas.", "ok": false, "w": "A IV é falsa, e I e II, verdadeiras, ficaram de fora."}], "k": "Plano de Saúde = 4 anos; Programação Anual = anual; Relatório Anual de Gestão = resultados.", "n": null}, {"id": "IESC_2024_2_7", "b": "IESC", "t": "Saúde suplementar e SUS", "o": "IESC 24.2 Q7", "e": "Homem de 45 anos foi atendido na Unidade Básica de Saúde (UBS) devido a uma dor torácica intensa que começou há cerca de uma hora. Após a avaliação inicial, o médico da UBS suspeitou de um Infarto Agudo do Miocárdio (IAM) e decidiu encaminhá-lo imediatamente para um hospital para realização de exames mais avançados e possível intervenção. Paciente informou que possui plano de saúde particular com cobertura de atendimento em hospitais privados. Em relação ao encaminhamento do paciente pode-se afirmar que ele:", "a": [{"x": "poderá ser encaminhado formalmente pelo médico para o hospital privado do plano de saúde do paciente ou para o hospital público do Sistema Único de Saúde (SUS).", "ok": false, "w": "A partir da UBS o encaminhamento formal é dentro da rede SUS; o médico do SUS não encaminha formalmente ao hospital privado."}, {"x": "deverá ser encaminhado formalmente para o hospital privado do plano de saúde do paciente, pois tem o direito de escolher onde quer ser atendido, mesmo sendo inicialmente atendido na UBS.", "ok": false, "w": "O paciente pode escolher usar o plano, mas o encaminhamento formal do SUS não é para o hospital privado."}, {"x": "deverá ser encaminhado formalmente para um hospital público, cabendo ao paciente a decisão de utilizar o encaminhamento para o SUS ou procurar o hospital privado do seu plano de saúde.", "ok": true, "w": "Encaminhamento formal para o hospital público; o paciente decide se usa esse encaminhamento ou procura o plano."}, {"x": "deverá seguir o protocolo do SUS e ser encaminhado para o hospital público de referência, pois o paciente não tem direito de utilizar seu plano de saúde particular após ser atendido na UBS.", "ok": false, "w": "Ele não perde o direito de usar o plano por ter sido atendido no SUS."}], "k": "Ter plano não tira o direito ao SUS, e usar o SUS não tira o direito ao plano.", "n": null}, {"id": "IESC_2024_2_8", "b": "IESC", "t": "Empreendedorismo", "o": "IESC 24.2 Q8", "e": "João, um recém-formado em Medicina, decidiu abrir seu próprio consultório particular. Ele tem pouco conhecimento sobre o processo de abertura de uma clínica e está buscando orientações sobre quais etapas devem ser seguidas para garantir que sua clínica seja aberta de forma legal e eficiente. Diante disso, analise as afirmativas abaixo quanto as etapas que João deve seguir para abrir seu consultório médico/clínica médica particular.\nI. Planejamento financeiro e aquisição de equipamentos.\nII. Escolha da localização do consultório.\nIII. Registro no Conselho Regional de Medicina.\nIV. Obtenção do alvará de funcionamento.\nEstá correto o que se afirma em:", "a": [{"x": "I, II, IV.", "ok": false, "w": "O item III também é etapa obrigatória e ficou de fora."}, {"x": "III. IV.", "ok": false, "w": "Faltam I e II, que também são etapas necessárias."}, {"x": "I, II, III, IV.", "ok": true, "w": "Planejamento financeiro, localização, registro no CRM e alvará são todos necessários para abrir o consultório."}, {"x": "I, II.", "ok": false, "w": "Faltam III e IV, que tornam o funcionamento legal."}], "k": "Nas questões de IESC, itens que descrevem boa prática costumam estar todos certos.", "n": null}, {"id": "IESC_2024_2_10", "b": "IESC", "t": "Regulação", "o": "IESC 24.2 Q10", "e": "O Dr. João, médico de plantão em um hospital público, recebe um paciente trazido pelo SAMU com suspeita de infarto agudo do miocárdio (IAM). Ao avaliar a situação, ele descobre que a capacidade de leitos de UTI do hospital está completamente esgotada. Considerando a urgência do caso, assinale a alternativa que representa a conduta do Dr. João para garantir o atendimento especializado adequado ao paciente.", "a": [{"x": "Manter o paciente na sala de emergência do hospital, administrando os cuidados iniciais, sem ativar a regulação de leitos, esperando até que um leito de UTI fique disponível no próprio hospital.", "ok": false, "w": "Esperar vaga no próprio hospital sem regular atrasa o tratamento do IAM."}, {"x": "Encaminhar o paciente para um leito de enfermaria comum, sem consultar a regulação de leitos, até que a condição do paciente melhore e um leito de UTI fique disponível.", "ok": false, "w": "Enfermaria sem regulação não garante o cuidado intensivo necessário."}, {"x": "Administrar os cuidados iniciais ao paciente, enquanto aciona imediatamente o sistema de regulação de leitos para transferi-lo a outro hospital que tenha vaga disponível na UTI.", "ok": true, "w": "Cuidados iniciais e acionamento imediato da regulação para transferir a um hospital com vaga."}, {"x": "Negar a admissão do paciente no hospital, orientando a equipe do SAMU a buscar outro hospital que possa atender o caso, sem fazer a comunicação com a regulação de leitos.", "ok": false, "w": "Negar atendimento e mandar o SAMU procurar outro hospital é omissão."}], "k": "Sem vaga: estabilizar e acionar a Central de Regulação.", "n": null}, {"id": "IESC_2025_1_2", "b": "IESC", "t": "Planejamento no SUS", "o": "IESC 25.1 Q2", "e": "Durante reunião com o conselho municipal de saúde do município Felicidade, o gestor municipal apresentou os instrumentos para o planejamento e a gestão do Sistema Único de Saúde (SUS). Entre esses, o gestor comentou sobre o instrumento de gestão que orienta o planejamento da saúde pública por quatro anos. Ele é a base para as atividades e a programação do SUS em cada esfera de governo e descreve os compromissos do governo para o setor saúde a partir das necessidades de saúde da população e as peculiaridades próprias de cada esfera. Diante do exposto, marque o instrumento de gestão tratado no enunciado.", "a": [{"x": "Plano de saúde.", "ok": true, "w": "O Plano de Saúde tem vigência de 4 anos e é a base de toda a programação, construído a partir da análise situacional."}, {"x": "Prestação de contas.", "ok": false, "w": "Prestação de contas é o demonstrativo de despesas dentro do relatório de gestão."}, {"x": "Programação anual de saúde.", "ok": false, "w": "A Programação Anual de Saúde é anual e operacionaliza o plano."}, {"x": "Relatório de gestão.", "ok": false, "w": "O Relatório de Gestão é anual e apresenta resultados."}], "k": "Instrumento de 4 anos = Plano de Saúde.", "n": null}, {"id": "IESC_2025_1_3", "b": "IESC", "t": "Origens do SUS", "o": "IESC 25.1 Q3", "e": "Sobre a estruturação do Sistema Único de Saúde (SUS), analise as afirmações a seguir:\nI. A Constituição Federal de 1988 estabeleceu a saúde como um direito de todos e dever do Estado, o que foi fundamental para a criação do SUS.\nII. A Lei 8.080/90 regulamentou a organização do SUS, definindo suas diretrizes, como a universalidade, a integralidade e a equidade no atendimento.\nIII. A Lei 8.142/90 se refere à participação popular, por meio de conselhos e conferências de saúde.\nA respeito dessas afirmações, é correto o que se afirma em:", "a": [{"x": "I, II e III.", "ok": true, "w": "As três afirmações estão corretas."}, {"x": "II e III.", "ok": false, "w": "A I também é verdadeira."}, {"x": "I e III.", "ok": false, "w": "A II também é verdadeira."}, {"x": "I e II.", "ok": false, "w": "A III também é verdadeira."}], "k": "Constituição de 1988 cria o SUS; Leis 8.080 e 8.142 de 1990 o regulamentam.", "n": null}, {"id": "IESC_2025_1_4", "b": "IESC", "t": "Participação complementar", "o": "IESC 25.1 Q4", "e": "Uma Unidade Básica de Saúde (UBS) do município de Guanambi - BA está enfrentando um aumento significativo no número de pacientes que necessitam de exames especializados, os quais não estão disponíveis na UBS. Para atender à demanda crescente, a gestão da cidade está articulando a utilização de convênios com serviços privados, visando melhorar a oferta e garantir o acesso equitativo e eficaz aos usuários do sistema. Considerando a situação desta UBS, analise as ações abaixo.\nI. A gestão deve estabelecer critérios claros e transparentes para a contratualização com os serviços privados, incluindo a definição de metas de desempenho e qualidade.\nII. A gestão deve monitorar regularmente os serviços contratados, avaliando indicadores de eficácia, eficiência e satisfação dos usuários.\nIII. A gestão deve priorizar o acesso com base na capacidade de pagamento dos pacientes, otimizando os recursos disponíveis para a UBS.\nIV. A gestão deve realizar auditorias periódicas nos serviços privados contratados, visando identificar possíveis inconsistências ou ineficiências.\nQuais das ações acima são corretas?", "a": [{"x": "Apenas as ações II e III.", "ok": false, "w": "A III é falsa, e I e IV, verdadeiras, ficaram de fora."}, {"x": "Ações I, II, III e IV.", "ok": false, "w": "A III é falsa: priorizar acesso pela capacidade de pagamento fere universalidade e equidade."}, {"x": "Apenas as ações I, II e IV.", "ok": true, "w": "I, II e IV descrevem avaliação prévia, monitoramento e regras corretas de contratação."}, {"x": "Apenas as ações I e IV.", "ok": false, "w": "A II, sobre monitoramento, também está correta."}], "k": "Acesso pela capacidade de pagamento é sempre errado no SUS.", "n": null}, {"id": "IESC_2025_1_5", "b": "IESC", "t": "Gerenciamento da UBS", "o": "IESC 25.1 Q5", "e": "Uma Unidade Básica de Saúde (UBS) está enfrentando desafios relacionados a conflitos interpessoais entre os profissionais da equipe multiprofissional. Alguns membros relatam dificuldades na comunicação e percebem uma falta de espaço para expressar suas preocupações, enquanto outros mencionam que a sobrecarga de trabalho tem contribuído para tensões no ambiente. O gestor da UBS busca implementar estratégias eficazes para lidar com os conflitos e melhorar a colaboração entre os profissionais. Diante desse cenário, qual das estratégias a seguir é a mais adequada para promover a mediação dos conflitos interpessoais na equipe da UBS?", "a": [{"x": "Priorizar a divisão formal de tarefas, delimitando rigorosamente o papel de cada profissional e reduzindo a necessidade de interações no ambiente de trabalho.", "ok": false, "w": "Reduzir interação isola a equipe e prejudica o trabalho multiprofissional."}, {"x": "Implementar reuniões estruturadas de equipe, com a mediação da gestão, para discutir dificuldades do ambiente de trabalho, incentivar a escuta ativa e buscar soluções colaborativas.", "ok": true, "w": "Reuniões estruturadas com mediação, escuta ativa e soluções colaborativas tratam a causa do conflito."}, {"x": "Criar um canal anônimo para que os profissionais relatem insatisfações e direcionar as decisões sobre os conflitos exclusivamente à coordenação da unidade.", "ok": false, "w": "Canal anônimo pode complementar, mas decisão exclusiva da coordenação exclui a equipe da solução."}, {"x": "Estabelecer um rodízio de funções na equipe, reduzindo a permanência prolongada dos profissionais nos mesmos setores para evitar tensões interpessoais.", "ok": false, "w": "Rodízio evita o problema sem tratar a causa."}], "k": "Conflito na UBS: diálogo mediado e construção coletiva.", "n": null}, {"id": "IESC_2025_1_6", "b": "IESC", "t": "Empreendedorismo", "o": "IESC 25.1 Q6", "e": "O Dr. João, recém-formado em Medicina, decidiu abrir seu próprio consultório médico. Para garantir o sucesso do empreendimento, ele começou a planejar cuidadosamente as etapas necessárias para viabilizar sua clínica. Ao estudar sobre empreendedorismo na área da saúde, ele identificou que algumas etapas são essenciais para a abertura de um consultório médico de forma estruturada e sustentável. Com base no processo de abertura de um consultório/clínica médica particular, analise os itens a seguir.\nI. Elaborar um plano de negócios, definindo os serviços oferecidos, público-alvo, custos e projeções financeiras.\nII. Escolher a localização adequada, considerando fatores como acessibilidade, demanda local e concorrência.\nIII. Realizar marketing e divulgação, criando identidade visual, presença digital e estratégias de captação de pacientes.\nAssinale a alternativa que apresenta a combinação correta dos itens mencionados.", "a": [{"x": "Apenas os itens II e III estão corretos.", "ok": false, "w": "O item I também é essencial."}, {"x": "Os itens I, II e III estão corretos.", "ok": true, "w": "Os três itens descrevem etapas corretas do planejamento do consultório."}, {"x": "Apenas os itens I e II estão corretos.", "ok": false, "w": "O item III também faz parte."}, {"x": "Apenas os itens I e III estão corretos.", "ok": false, "w": "O item II também é essencial."}], "k": "Abrir consultório: plano de negócios, localização, formalização, CRM, alvarás e marketing ético.", "n": null}, {"id": "IESC_2025_1_7", "b": "IESC", "t": "Auditoria", "o": "IESC 25.1 Q7", "e": "O Dr. Pedro, médico especialista em saúde pública, foi designado para participar de uma auditoria no Sistema Único de Saúde (SUS) de uma cidade de médio porte. O hospital municipal, referência para diversos municípios vizinhos, tem enfrentado uma série de desafios relacionados à gestão de recursos e à qualidade da assistência prestada à população. A auditoria foi solicitada devido à suspeita de falhas na utilização de recursos financeiros e materiais, além de possíveis problemas na qualidade do atendimento médico. Com base nesse cenário, assinale a alternativa que reflete as principais ações que Dr. Pedro deve adotar durante sua participação na auditoria.", "a": [{"x": "Dr. Pedro deve entrevistar os pacientes e a equipe de saúde, sem necessidade de revisar os registros médicos ou administrativos, já que a percepção dos usuários é o principal indicador da qualidade do serviço prestado.", "ok": false, "w": "Ignorar registros e dados financeiros contraria o objetivo da auditoria."}, {"x": "Dr. Pedro deve examinar os registros médicos para verificar a conformidade dos tratamentos realizados, mas também revisar a alocação de recursos financeiros e materiais, como forma de garantir a correta utilização dos recursos do hospital e a transparência nos processos administrativos.", "ok": true, "w": "Examinar registros médicos (conformidade) e a alocação de recursos financeiros e materiais (uso correto e transparência)."}, {"x": "Dr. Pedro deve realizar uma revisão detalhada dos registros médicos dos pacientes, sem considerar a análise dos processos administrativos, pois a auditoria do SUS foca exclusivamente na qualidade do atendimento médico.", "ok": false, "w": "A auditoria do SUS também avalia recursos e processos administrativos."}, {"x": "Dr. Pedro deve realizar uma análise dos processos administrativos, revisando a alocação de recursos financeiros, bem como realizar entrevistas com os pacientes sobre os tratamentos, visto que somente o médico que foi responsável por cada caso é quem tem acesso ao prontuário.", "ok": false, "w": "Auditores têm acesso aos prontuários; a justificativa é falsa."}], "k": "Auditoria = assistência + recursos.", "n": null}, {"id": "IESC_2025_1_8", "b": "IESC", "t": "Regulação", "o": "IESC 25.1 Q8", "e": "Um médico de plantão recebe em um Hospital Regional (SUS) um paciente com suspeita de Infarto Agudo do Miocárdio (IAM). No entanto, o hospital está com a capacidade de leitos de UTI esgotada. O médico precisa tomar uma decisão que garanta o atendimento especializado de urgência ao paciente. Com base no caso e nos princípios da regulação em saúde, assinale a alternativa que corresponde à ação apropriada a ser executada pelo médico.", "a": [{"x": "Informar o paciente e sua família sobre a falta de leitos disponíveis e sugerir que procurem um hospital privado para atendimento imediato.", "ok": false, "w": "Sugerir hospital privado transfere ao paciente uma responsabilidade que é do SUS."}, {"x": "Encaminhar o paciente diretamente para o hospital mais próximo com UTI, sem consulta prévia à Central de Regulação, para otimizar o tempo de atendimento.", "ok": false, "w": "Transferir sem regulação pode levar o paciente a outro hospital também sem vaga."}, {"x": "Manter o paciente em observação na enfermaria, até que um leito da Unidade de Terapia Intensiva seja desocupado, no mesmo hospital.", "ok": false, "w": "Esperar em enfermaria atrasa o cuidado intensivo."}, {"x": "Realizar a estabilização clínica inicial do paciente e acionar a Central de Regulação para identificar e transferir o paciente para um hospital com leitos de UTI disponíveis.", "ok": true, "w": "Estabilizar e acionar a Central de Regulação para transferir a um hospital com leito de UTI."}], "k": "Nunca negar, nunca transferir por conta própria, nunca empurrar para o privado.", "n": null}, {"id": "IESC_2025_1_10", "b": "IESC", "t": "Saúde suplementar e SUS", "o": "IESC 25.1 Q10", "e": "Um médico de um hospital público atende um paciente idoso, J.P., com insuficiência cardíaca descompensada, que foi admitido na emergência e necessita de internação para estabilização do quadro. Durante a anamnese, foi informado pelos cuidadores que J.P. possui um plano de saúde suplementar. Considerando os princípios do SUS assinale a alternativa que representa uma conduta correta do médico.", "a": [{"x": "Internar o paciente no hospital público caso haja indicação clínica, garantindo o tratamento necessário, independentemente da existência de um plano de saúde.", "ok": true, "w": "Universalidade: com indicação clínica, o paciente interna no SUS; a operadora pode depois ressarcir o SUS."}, {"x": "Atender o paciente apenas na emergência, estabilizá-lo e orientá-lo a buscar internação junto ao seu plano de saúde, pois o SUS não deve assumir custos de internação.", "ok": false, "w": "O SUS não se limita à emergência para quem tem plano."}, {"x": "Encaminhar imediatamente o paciente para um hospital privado conveniado ao seu plano de saúde, pois ele não tem direito à internação no SUS.", "ok": false, "w": "Ter plano de saúde não retira o direito ao SUS."}, {"x": "Solicitar que a família assine um termo de responsabilidade declarando que abrirão mão do atendimento pelo SUS e buscarão internação em um hospital privado.", "ok": false, "w": "Não existe renúncia ao SUS; exigir termo constrange o paciente e não tem base legal."}], "k": "Lei 9.656/1998, art. 32: ressarcimento ao SUS pela operadora.", "n": null}, {"id": "AD_CI_OA", "b": "CI", "t": "Artropatias", "o": "Adaptada de CI 24.2 Q5", "e": "Mulher de 60 anos, com sobrepeso, refere dor em joelhos e mãos há 3 anos, que piora ao longo do dia e com atividade, com rigidez matinal de cerca de 15 minutos. Ao exame, nódulos nas interfalangeanas distais, crepitação nos joelhos e ausência de sinais inflamatórios. Qual plano inicial é mais adequado?", "a": [{"x": "Exercício de fortalecimento, perda de peso, educação e analgesia sob demanda com AINE tópico ou paracetamol.", "ok": true, "w": "É o núcleo do tratamento da osteoartrite: medidas não farmacológicas sempre, com analgesia sob demanda."}, {"x": "Repouso articular com imobilização dos joelhos nas crises e opioide fraco de uso contínuo para controle da dor.", "ok": false, "w": "Repouso e imobilização pioram força e função; opioide não é tratamento de base."}, {"x": "Glucosamina e condroitina como base do tratamento, com exercício adiado até que a dor esteja controlada.", "ok": false, "w": "Suplementos não têm benefício consistente, e exercício é tratamento, não recompensa pela melhora."}, {"x": "Infiltração mensal de corticoide nos joelhos e metotrexato semanal para reduzir a progressão nas mãos.", "ok": false, "w": "Metotrexato é para artrite inflamatória; infiltração com corticoide é pontual, não mensal de rotina."}], "k": "Osteoartrite: exercício e perda de peso são tratamento, não coadjuvantes.", "n": null}, {"id": "AD_CI_ABORT", "b": "CI", "t": "Sangramento 1ª metade", "o": "Adaptada de CI 25.1 Q2", "e": "Mulher de 24 anos, 12 semanas de atraso menstrual, relata manipulação uterina há 4 dias. Chega com febre de 38,9 °C, dor pélvica, secreção vaginal fétida e sangramento. PA 100x60 mmHg, FC 112 bpm. Ao toque, colo pérvio com laceração e útero doloroso. Qual a conduta mais adequada?", "a": [{"x": "Estabilizar, iniciar clindamicina + gentamicina, USG para restos e esvaziar o útero após o antibiótico, suturando a laceração.", "ok": true, "w": "Abortamento infectado: suporte + antibiótico que cubra aeróbios e anaeróbios + tratamento cirúrgico do foco."}, {"x": "Curetagem uterina imediata, antes de qualquer antibiótico, para retirar o foco, com alta hospitalar no mesmo dia.", "ok": false, "w": "Esvaziar sem cobertura antibiótica aumenta bacteremia, e paciente séptica não recebe alta."}, {"x": "Antibiótico oral com amoxicilina-clavulanato, analgesia e retorno ambulatorial em 48 horas para reavaliar a febre.", "ok": false, "w": "Febre, taquicardia e restos infectados exigem internação e antibiótico venoso."}, {"x": "Misoprostol vaginal para expulsão dos restos e observação domiciliar, reservando antibiótico se a febre persistir.", "ok": false, "w": "Com infecção instalada, o foco precisa de esvaziamento rápido sob antibiótico."}], "k": "Abortamento infectado = estabilizar + antibiótico + esvaziar.", "n": null}, {"id": "AD_CI_QSCQ", "b": "CI", "t": "Queimaduras e nutrição", "o": "Adaptada de CI 25.1 Q13", "e": "Homem de 80 kg sofreu queimadura por líquido quente há 1 hora, com bolhas e dor em todo o membro superior esquerdo (faces anterior e posterior) e na genitália. Qual a superfície corporal queimada e a conduta quanto ao local de tratamento?", "a": [{"x": "10%; encaminhar a centro de referência em queimados, pelo acometimento da genitália.", "ok": true, "w": "Membro superior inteiro 9% + genitália 1% = 10%. Queimadura de genitália, face, mãos, pés, períneo ou grandes articulações é critério de encaminhamento."}, {"x": "10%; curativo com sulfadiazina e alta, porque a área queimada é menor que 20%.", "ok": false, "w": "A área está certa, mas a localização em genitália indica centro de queimados independentemente da extensão."}, {"x": "18%; hidratação venosa com 4 mL × kg × %SCQ nas primeiras 24 horas.", "ok": false, "w": "Membro superior inteiro vale 9%, não 18%; e 4 mL é fórmula antiga (ou da queimadura elétrica)."}, {"x": "5,5%; tratamento domiciliar com pomada e reavaliação na UBS em 48 horas.", "ok": false, "w": "Contou só uma face do braço; bolhas em todo o membro somam 9%."}], "k": "Regra dos 9: membro superior 9, membro inferior 18, tronco anterior 18, genitália 1.", "n": null}, {"id": "AD_CI_PARK", "b": "CI", "t": "Queimaduras e nutrição", "o": "Adaptada de CI 25.2 Q14", "e": "Homem de 70 kg com queimaduras de 2º grau profundo em tórax e abdome anteriores, face anterior dos dois braços e face anterior das duas pernas. Segundo o ATLS 11, qual a superfície corporal queimada e a hidratação inicial?", "a": [{"x": "45%; 6.300 mL de Ringer lactato como estimativa, iniciando ~394 mL/h e ajustando pela diurese a cada hora.", "ok": true, "w": "Tronco anterior 18 + braços 4,5 + 4,5 + pernas 9 + 9 = 45%. 2 × 70 × 45 = 6.300 mL ÷ 16 ≈ 394 mL/h, com meta de diurese de 0,5 mL/kg/h."}, {"x": "45%; 12.600 mL de Ringer lactato, com metade infundida nas primeiras 8 horas após a queimadura.", "ok": false, "w": "4 mL × kg × %SCQ é a Parkland original, abandonada; o ATLS usa 2 mL no adulto."}, {"x": "36%; 5.040 mL de Ringer lactato distribuídos igualmente ao longo das primeiras 24 horas.", "ok": false, "w": "Esqueceu a face anterior dos dois braços (9%)."}, {"x": "45%; 6.300 mL de Ringer lactato, sendo 3.150 mL nas primeiras 8 h e 3.150 mL nas 16 h seguintes.", "ok": false, "w": "O volume está certo, mas a divisão 8 h/16 h é do ATLS 10; o ATLS 11, cobrado na prova de 2025.2, ajusta o ritmo pela diurese."}], "k": "ATLS 11: 2 × kg × %SCQ ÷ 16 = mL/h inicial; ajustar pela diurese.", "n": null}, {"id": "AD_CI_ICTFIS", "b": "CI", "t": "Icterícia neonatal", "o": "Adaptada de CI 25.2 Q15", "e": "RN de 5 dias, termo, em aleitamento materno exclusivo, mamando bem, com urina clara e fezes amareladas, ganhando peso. Icterícia até o abdome. Bilirrubina total de 10 mg/dL, indireta predominante. Mãe e RN com tipagem compatível. Qual a conduta na UBS?", "a": [{"x": "Tranquilizar a família, manter aleitamento exclusivo em livre demanda e reavaliar em poucos dias.", "ok": true, "w": "Início após 24 h, pico no 5º dia, bilirrubina indireta abaixo da linha de tratamento, RN bem = icterícia fisiológica."}, {"x": "Iniciar fototerapia domiciliar com lâmpada comum e repetir a bilirrubina total em 24 horas.", "ok": false, "w": "O valor não indica fototerapia, e lâmpada comum não é tratamento."}, {"x": "Suspender o aleitamento materno por 48 horas e oferecer fórmula para reduzir a bilirrubina.", "ok": false, "w": "Suspender o leite materno prejudica o aleitamento e não é necessário."}, {"x": "Encaminhar ao hospital para exsanguineotransfusão e investigação de doença hemolítica.", "ok": false, "w": "Exsanguineotransfusão é para valores muito altos ou encefalopatia; o RN está bem."}], "k": "Sinais de patológica: antes de 24 h, subida rápida, bilirrubina direta alta, mais de 2 semanas, acolia ou colúria.", "n": null}, {"id": "AD_HAM_INAL", "b": "HAM", "t": "Queimaduras", "o": "Adaptada de HAM 24.2 Q5", "e": "Incêndio em prédio. Homem de 35 anos resgatado do interior com queimaduras em face e pescoço, sobrancelhas chamuscadas, fuligem na boca, rouquidão progressiva e estridor leve. Consciente, SpO₂ 95%. Qual a conduta prioritária?", "a": [{"x": "Via aérea definitiva precoce por intubação orotraqueal, antes que o edema progrida.", "ok": true, "w": "Rouquidão e estridor em queimado indicam edema de via aérea em evolução; esperar pode tornar a intubação impossível."}, {"x": "O₂ por máscara e reavaliar em 1 hora, já que a saturação está boa.", "ok": false, "w": "SpO₂ não mede o edema da laringe, e em 1 hora a via aérea pode fechar."}, {"x": "Iniciar hidratação pela fórmula antes de abordar a via aérea.", "ok": false, "w": "A via aérea vem antes da circulação no xABCDE."}, {"x": "Corticoide venoso e nebulização com adrenalina para evitar intubação.", "ok": false, "w": "Corticoide não é indicado na lesão inalatória e não substitui a via aérea definitiva."}], "k": "Queimado com rouquidão ou estridor: intubar cedo.", "n": null}, {"id": "AD_HAM_RAIO", "b": "HAM", "t": "Raio", "o": "Adaptada de HAM 24.2 Q9", "e": "Durante tempestade em um campo de futebol, um raio atinge um grupo. Há 5 vítimas: 3 conscientes com dor e queimaduras superficiais e 2 inconscientes, sem respiração e sem pulso. Há apenas uma equipe no local. Qual a prioridade?", "a": [{"x": "Iniciar RCP e ventilação nas vítimas em parada, pois têm boa chance de reverter e as conscientes tendem a sobreviver.", "ok": true, "w": "Triagem reversa: em vítimas de raio, quem parece morto recebe prioridade."}, {"x": "Aplicar o START, classificar as vítimas sem respiração e sem pulso como óbito e atender as conscientes.", "ok": false, "w": "O START inverte a lógica correta para raio; aqui a PCR é potencialmente reversível."}, {"x": "Atender primeiro as vítimas conscientes com queimaduras mais extensas, que têm maior risco de choque.", "ok": false, "w": "As queimaduras por raio costumam ser superficiais, e essas vítimas não correm risco imediato."}, {"x": "Atender pela ordem de proximidade da equipe, para reduzir o tempo total de atendimento de todas as vítimas.", "ok": false, "w": "Critério de proximidade ignora quem mais se beneficia de intervenção imediata."}], "k": "Raio: o coração pode voltar sozinho, mas a apneia persiste; ventilação precoce salva.", "n": null}, {"id": "AD_HAM_XABC", "b": "HAM", "t": "Atendimento inicial", "o": "Adaptada de HAM 25.1 Q2", "e": "Motociclista de 28 anos após colisão, com sangramento arterial em jato por ferimento na coxa esquerda. FC 130 bpm, PA 90x60 mmHg, SpO₂ 91%, confuso, pele fria. Qual a primeira medida e o tipo de choque?", "a": [{"x": "Controlar o sangramento com compressão ou torniquete, depois via aérea com proteção cervical e O₂; choque hemorrágico.", "ok": true, "w": "xABCDE: hemorragia exsanguinante externa vem antes da via aérea. Taquicardia, pele fria e sangramento = choque hemorrágico."}, {"x": "Garantir via aérea definitiva e oxigenação antes de abordar o sangramento da coxa; choque hemorrágico.", "ok": false, "w": "O tipo de choque está certo, mas a ordem está errada: sangramento em jato mata antes."}, {"x": "Obter acesso venoso e iniciar vasopressor para elevar a pressão arterial; choque distributivo.", "ok": false, "w": "Não há vasodilatação; vasopressor piora o choque hemorrágico."}, {"x": "Imobilizar em prancha e transportar rapidamente sem intervenções na cena; choque cardiogênico.", "ok": false, "w": "Nada sugere falha de bomba, e transportar sangrando sem controle é fatal."}], "k": "ATLS 11: xABCDE, com torniquete 5–8 cm acima da lesão.", "n": null}, {"id": "AD_HAM_CENA", "b": "HAM", "t": "Atendimento inicial", "o": "Adaptada de HAM 25.1 Q3", "e": "Equipe do SAMU chega a uma colisão entre carro e moto em rodovia movimentada. O motociclista, sem capacete, não responde e tem sangramento em jato na perna. Qual a sequência correta?", "a": [{"x": "Segurança da cena → sangramento em jato → via aérea com proteção cervical → ventilação → circulação.", "ok": true, "w": "Primeiro proteger a equipe; depois xABCDE, começando pela hemorragia exsanguinante."}, {"x": "Via aérea com proteção cervical → controle do sangramento em jato → segurança da cena → ventilação.", "ok": false, "w": "Sem cena segura, a equipe vira vítima; e o sangramento em jato vem antes da via aérea."}, {"x": "Segurança da cena → via aérea com proteção cervical → ventilação → controle do sangramento em jato.", "ok": false, "w": "No ATLS 11 e PHTLS, a hemorragia exsanguinante externa vem antes do A."}, {"x": "Controle do sangramento em jato → segurança da cena → via aérea com proteção cervical → ventilação.", "ok": false, "w": "Entrar em cena insegura expõe a equipe; segurança é sempre o primeiro passo."}], "k": "Cena segura primeiro, depois xABCDE.", "n": null}, {"id": "AD_IESC_PLAN", "b": "IESC", "t": "Planejamento no SUS", "o": "Adaptada de IESC 24.2 Q2", "e": "Um município quer reorganizar a atenção primária. Qual a ordem correta das etapas do planejamento em saúde?", "a": [{"x": "Diagnóstico situacional → priorização → plano de ação → execução → monitoramento e avaliação.", "ok": true, "w": "Conhecer a realidade, escolher o que atacar, organizar a resposta, executar e medir para replanejar."}, {"x": "Plano de ação → diagnóstico situacional → execução → priorização → monitoramento e avaliação.", "ok": false, "w": "Planejar antes de conhecer a realidade leva a ações sem foco."}, {"x": "Execução → monitoramento e avaliação → diagnóstico situacional → priorização → plano de ação.", "ok": false, "w": "Inverte o ciclo: não se monitora o que não foi planejado."}, {"x": "Priorização → execução → diagnóstico situacional → plano de ação → monitoramento e avaliação.", "ok": false, "w": "A priorização depende do diagnóstico prévio."}], "k": "Planejamento: diagnóstico, prioridade, plano, execução, avaliação.", "n": null}, {"id": "AD_IESC_GER", "b": "IESC", "t": "Gerenciamento da UBS", "o": "Adaptada de IESC 24.2 Q9", "e": "Uma nova gerente assume uma UBS com filas, reclamações e equipe desmotivada. Qual conjunto de práticas representa gerenciamento adequado?", "a": [{"x": "Diagnóstico situacional, escuta da equipe e dos usuários, acolhimento com classificação de risco e uso de indicadores.", "ok": true, "w": "Reúne planejamento, liderança, organização do acesso, monitoramento e desenvolvimento da equipe."}, {"x": "Centralizar as decisões na coordenação e cobrar metas individuais de produção de cada profissional da equipe.", "ok": false, "w": "Centralização e foco só em produção afastam a equipe e não resolvem o acesso."}, {"x": "Suspender as reuniões de equipe para liberar agenda e aumentar o número de consultas ofertadas por dia.", "ok": false, "w": "Reuniões são onde fluxos e conflitos se resolvem; cortá-las piora a organização."}, {"x": "Restringir o atendimento à demanda agendada, eliminando a demanda espontânea para acabar com as filas.", "ok": false, "w": "Fechar a porta para demanda espontânea fere o acesso e a APS como porta de entrada."}], "k": "Gerente de UBS: planejar, ouvir, organizar o acesso, medir e formar.", "n": null}, {"id": "AD_IESC_FERR", "b": "IESC", "t": "Gerenciamento da UBS", "o": "Adaptada de IESC 25.1 Q1", "e": "A equipe de uma UBS quer melhorar a satisfação dos usuários. Qual associação entre ferramenta de gestão e uso está correta?", "a": [{"x": "PDCA para melhoria contínua, 5W2H para detalhar o plano de ação e Ishikawa para mapear causas.", "ok": true, "w": "As três ferramentas estão associadas ao uso correto."}, {"x": "Pareto para distribuir as tarefas igualmente e PDCA para registrar as reclamações dos usuários.", "ok": false, "w": "Pareto mostra que poucas causas explicam a maior parte dos problemas, sem distribuir tarefas; PDCA é ciclo de melhoria, não registro de queixas."}, {"x": "Matriz GUT para entrevistar usuários e 5W2H para medir a satisfação ao final de cada consulta.", "ok": false, "w": "A matriz GUT prioriza problemas por gravidade, urgência e tendência, e o 5W2H detalha planos; nenhum dos dois mede satisfação."}, {"x": "Ishikawa para montar a escala da equipe e Pareto para definir o horário de funcionamento da UBS.", "ok": false, "w": "Ishikawa mapeia causa e efeito e Pareto prioriza causas; nenhum organiza escala ou horário."}], "k": "PDCA melhora, 5W2H planeja, Ishikawa explica causas, Pareto prioriza, GUT ordena.", "n": null}, {"id": "AD_IESC_FIN", "b": "IESC", "t": "Financiamento da APS", "o": "Adaptada de IESC 25.1 Q9", "e": "Um município de 10.000 habitantes tem 7.000 pessoas cadastradas em suas equipes de Saúde da Família. Comparando o Previne Brasil (2019) com o cofinanciamento da Portaria GM/MS 3.493/2024, qual afirmação é correta?", "a": [{"x": "No Previne, a capitação considerava só os cadastrados; na Portaria 3.493/2024 há componentes fixo, de vínculo, de qualidade e per capita populacional.", "ok": true, "w": "Os 3.000 não cadastrados não geravam capitação no Previne; o novo modelo tem base fixa por equipe e per capita pela população total."}, {"x": "Os dois modelos repassam recursos apenas pela população estimada pelo IBGE, sem considerar cadastro, equipes ou qualidade.", "ok": false, "w": "O Previne dependia do cadastro, não da população do IBGE."}, {"x": "A Portaria 3.493/2024 manteve a capitação ponderada e o pagamento por desempenho como seus principais componentes de repasse.", "ok": false, "w": "O novo modelo extinguiu capitação ponderada e pagamento por desempenho."}, {"x": "No Previne, o repasse era fixo por equipe homologada, independentemente do número de pessoas cadastradas no território.", "ok": false, "w": "Isso descreve melhor o componente fixo do novo modelo, não o Previne."}], "k": "Previne = cadastro + desempenho + ações estratégicas. 3.493/2024 = 6 componentes com índice de equidade.", "n": null}, {"id": "IN_HAM_FIS1", "b": "HAM", "t": "Física do trauma", "o": "Inédita", "e": "Motorista sem cinto sofre colisão frontal e chega com o joelho direito escoriado e o membro inferior direito encurtado, fletido, aduzido e em rotação interna. Qual lesão deve ser suspeitada pelo mecanismo?", "a": [{"x": "Luxação posterior do quadril.", "ok": true, "w": "Trajetória 'por baixo do painel': o joelho bate e a força é transmitida pelo fêmur, luxando o quadril para trás."}, {"x": "Fratura de Chance lombar.", "ok": false, "w": "Chance é lesão de flexão-distração pelo cinto abdominal mal posicionado."}, {"x": "Lesão cervical por hiperextensão.", "ok": false, "w": "Hiperextensão cervical é típica da colisão traseira com encosto mal ajustado."}, {"x": "Ruptura esplênica isolada.", "ok": false, "w": "Baço é mais lesado em impacto lateral esquerdo ou no tronco; não explica o membro encurtado e em rotação interna."}], "k": "Joelho no painel → patela, fêmur, quadril e acetábulo.", "n": null}, {"id": "IN_HAM_FIS2", "b": "HAM", "t": "Física do trauma", "o": "Inédita", "e": "Dois carros de mesma massa colidem contra um muro: um a 40 km/h e outro a 80 km/h. Em relação à energia cinética dissipada, é correto afirmar que o segundo carro:", "a": [{"x": "Dissipa cerca de quatro vezes mais energia.", "ok": true, "w": "Energia cinética = ½ × m × v²: dobrar a velocidade quadruplica a energia."}, {"x": "Dissipa o dobro da energia.", "ok": false, "w": "Seria verdade se a energia fosse proporcional à velocidade, mas ela depende do quadrado."}, {"x": "Dissipa a mesma energia, porque a massa é igual.", "ok": false, "w": "A velocidade entra ao quadrado na fórmula."}, {"x": "Dissipa oito vezes mais energia.", "ok": false, "w": "Oito vezes seria velocidade ao cubo."}], "k": "Velocidade pesa mais que massa na energia do trauma.", "n": null}, {"id": "IN_HAM_FIS3", "b": "HAM", "t": "Física do trauma", "o": "Inédita", "e": "Criança de 7 anos é atropelada por carro em velocidade moderada. Pelo mecanismo, qual conjunto de lesões deve ser ativamente procurado?", "a": [{"x": "Fratura de fêmur, lesão torácica ou abdominal e trauma cranioencefálico.", "ok": true, "w": "Tríade de Waddell: para-choque no fêmur, capô no tronco e cabeça no chão."}, {"x": "Fraturas de tíbia e fíbula isoladas, pelo impacto do para-choque nas pernas.", "ok": false, "w": "No adulto o para-choque atinge as pernas; na criança, mais baixa, atinge fêmur e pelve."}, {"x": "Fraturas de calcâneo bilaterais e fratura por compressão da coluna lombar.", "ok": false, "w": "Esse padrão é de queda de altura em pé."}, {"x": "Fraturas de punho e clavícula pela queda com os braços estendidos.", "ok": false, "w": "Lesões de membro superior não são o padrão principal do atropelamento infantil."}], "k": "Criança atropelada: tríade de Waddell.", "n": null}, {"id": "IN_HAM_CHQ", "b": "HAM", "t": "Choque", "o": "Inédita", "e": "Politraumatizado com FC 128 bpm, PA 84x50 mmHg, confuso, diurese mínima e déficit de base de −12. Pela classificação do ATLS 11, qual a gravidade da hemorragia e a conduta?", "a": [{"x": "Hemorragia grave: controle da fonte e protocolo de transfusão maciça.", "ok": true, "w": "FC acima de 120, PAS abaixo de 90 e déficit de base menor que −10 definem hemorragia grave."}, {"x": "Hemorragia leve: observar e manter hidratação oral enquanto aguarda exames.", "ok": false, "w": "Leve tem sinais vitais normais."}, {"x": "Hemorragia moderada: 2 L de cristaloide rápido e reavaliação em 30 minutos.", "ok": false, "w": "Moderada não tem hipotensão, e grandes volumes de cristaloide pioram coagulopatia."}, {"x": "Choque neurogênico: iniciar noradrenalina após 1 L de cristaloide.", "ok": false, "w": "Neurogênico cursa com bradicardia e pele quente; aqui há taquicardia e hipoperfusão, e vasopressor piora o choque hemorrágico."}], "k": "ATLS 11: grave = FC acima de 120, PAS abaixo de 90, déficit de base menor que −10.", "n": null}, {"id": "IN_HAM_PNX", "b": "HAM", "t": "Via aérea e ventilação", "o": "Inédita", "e": "Vítima de trauma torácico com dispneia intensa, murmúrio vesicular abolido à direita, hipertimpanismo, jugulares túrgidas e PA 80x40 mmHg. Qual a conduta imediata?", "a": [{"x": "Punção de alívio imediata, sem esperar radiografia, e depois dreno no 5º espaço intercostal.", "ok": true, "w": "Pneumotórax hipertensivo é diagnóstico clínico. O ATLS 11 aceita punção no 2º espaço na linha hemiclavicular ou no 4º–5º espaço entre as axilares."}, {"x": "Radiografia de tórax à beira do leito para confirmar o diagnóstico antes de qualquer punção.", "ok": false, "w": "Esperar exame em pneumotórax hipertensivo leva à parada."}, {"x": "Pericardiocentese de urgência, pela associação de hipotensão com turgência jugular.", "ok": false, "w": "Turgência com murmúrio abolido e hipertimpanismo aponta para pneumotórax, não tamponamento."}, {"x": "Intubação orotraqueal e ventilação com pressão positiva antes de descomprimir o tórax.", "ok": false, "w": "Pressão positiva aumenta a tensão do pneumotórax e piora o choque."}], "k": "Pneumotórax hipertensivo: tratar antes de fotografar.", "n": null}, {"id": "IN_HAM_HIPO", "b": "HAM", "t": "Frio", "o": "Inédita", "e": "Morador de rua encontrado em madrugada fria, sonolento, sem tremores, com FC 48 bpm e temperatura central de 30 °C. Qual a conduta mais adequada?", "a": [{"x": "Manipular com cuidado, retirar roupas molhadas e fazer reaquecimento ativo externo com fluidos aquecidos.", "ok": true, "w": "Hipotermia moderada (28–32 °C): tremor cessa e há bradicardia; reaquecimento ativo externo, fluidos aquecidos e manipulação delicada pelo risco de fibrilação ventricular."}, {"x": "Esfregar vigorosamente os membros e oferecer bebida quente para ativar a circulação periférica.", "ok": false, "w": "Manipulação brusca pode desencadear fibrilação ventricular, e paciente sonolento não deve beber."}, {"x": "Cobrir com cobertor e apenas observar, pois a bradicardia é resposta fisiológica esperada ao frio.", "ok": false, "w": "Isso seria suficiente na hipotermia leve; a 30 °C é preciso reaquecimento ativo."}, {"x": "Administrar atropina imediatamente para corrigir a bradicardia antes de iniciar o reaquecimento.", "ok": false, "w": "A bradicardia é consequência do frio e melhora com o reaquecimento."}], "k": "Hipotermia: leve 32–35, moderada 28–32, grave abaixo de 28 °C.", "n": null}, {"id": "IN_HAM_MERG", "b": "HAM", "t": "Mergulho", "o": "Inédita", "e": "Mergulhador sobe rapidamente de 30 metros sem paradas. Duas horas depois apresenta dor intensa no cotovelo e ombro, prurido cutâneo e parestesias nas pernas. Qual o diagnóstico e a conduta?", "a": [{"x": "Doença descompressiva: O₂ a 100%, paciente deitado, hidratação e encaminhamento para câmara hiperbárica.", "ok": true, "w": "Subida rápida libera bolhas de nitrogênio (lei de Henry): dor articular e sintomas neurológicos em horas; recompressão é o tratamento definitivo."}, {"x": "Barotrauma de ouvido médio: descongestionante e observação.", "ok": false, "w": "Barotrauma de ouvido dá otalgia e hipoacusia, não dor articular e parestesias."}, {"x": "Narcose por nitrogênio: observar, pois resolve na superfície.", "ok": false, "w": "Narcose ocorre em profundidade e passa ao subir; não surge horas depois."}, {"x": "Embolia gasosa arterial: posição de Trendelenburg e transporte aéreo em alta altitude.", "ok": false, "w": "Trendelenburg não é mais recomendado e altitude piora as bolhas; além disso, o quadro de horas com dor articular é doença descompressiva."}], "k": "Boyle = barotrauma e embolia. Henry = doença descompressiva.", "n": null}, {"id": "IN_HAM_ALT", "b": "HAM", "t": "Altitude", "o": "Inédita", "e": "Montanhista a 4.200 m, no 2º dia de subida rápida, apresenta cefaleia intensa, confusão e marcha atáxica. Qual a conduta prioritária?", "a": [{"x": "Descida imediata, O₂ e dexametasona.", "ok": true, "w": "Ataxia e confusão indicam edema cerebral de altitude; descer é o tratamento definitivo."}, {"x": "Repouso na mesma altitude e analgésico comum.", "ok": false, "w": "Isso vale para mal agudo da montanha leve, não para edema cerebral."}, {"x": "Continuar a subida lentamente para aclimatar.", "ok": false, "w": "Subir com edema cerebral pode ser fatal."}, {"x": "Nifedipino isolado e aguardar 24 h.", "ok": false, "w": "Nifedipino é para edema pulmonar de altitude, e aguardar atrasa a descida."}], "k": "Edema cerebral ou pulmonar de altitude: descer.", "n": null}, {"id": "IN_HAM_INTER", "b": "HAM", "t": "Calor", "o": "Inédita", "e": "Soldado em treinamento sob calor intenso colapsa, está confuso e agitado, com temperatura retal de 41,2 °C e pele quente. Qual a conduta mais adequada?", "a": [{"x": "Resfriamento imediato no local, idealmente por imersão em água gelada, antes do transporte.", "ok": true, "w": "Temperatura de 40 °C ou mais com alteração neurológica = intermação; cada minuto de hipertermia aumenta a lesão."}, {"x": "Dipirona venosa para baixar a febre e transporte imediato ao hospital mais próximo.", "ok": false, "w": "Antitérmico não age na intermação, porque o termostato hipotalâmico não está alterado."}, {"x": "Hidratação oral com água gelada e liberação quando a confusão mental melhorar.", "ok": false, "w": "Paciente confuso não pode beber e precisa de resfriamento ativo imediato."}, {"x": "Transporte rápido ao hospital, iniciando o resfriamento somente na sala de emergência.", "ok": false, "w": "Na intermação, resfriar primeiro e transportar depois."}], "k": "Intermação: resfriar primeiro, trans const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNova = q => /^(Inédita|Adaptada)/.test(q.o);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const S = { fb:'all', fo:'all', list:[], altOrder:{}, idx:0, ans:{}, pick:{}, view:'q' };

function build(pool){
  S.list = shuffle(pool);
  S.list.forEach(q => { S.altOrder[q.id] = shuffle(q.a.map((_,i)=>i)); });
  S.idx = 0; S.view = 'q';
}
function filtered(){
  return DATA.filter(q => (S.fb==='all'||q.b===S.fb) && (S.fo==='all'||(S.fo==='nova')===isNova(q)));
}
function setFilter(f,v){
  if(f==='b') S.fb=v; else S.fo=v;
  syncChips(); build(filtered()); render();
}
function syncChips(){
  document.querySelectorAll('.chipbtn').forEach(b => {
    const cur = b.dataset.f==='b' ? S.fb : S.fo;
    b.setAttribute('aria-pressed', String(b.dataset.v===cur));
  });
}

const svgOk = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const svgNo = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

function stats(){
  const ids = new Set(S.list.map(q=>q.id));
  let done=0, right=0;
  for(const id of ids){ const a=S.ans[id]; if(a){ done++; if(a.ok) right++; } }
  return {done,right,total:ids.size};
}

function render(){
  const st = stats();
  $('#sub').textContent = `${DATA.length} questões no banco · ordem das questões e das alternativas sorteada a cada abertura`;
  const app = $('#app');
  if(!S.list.length){ app.innerHTML = '<div class="card empty">Nenhuma questão com esse filtro.</div>'; $('#grid').innerHTML=''; navState(); return; }
  if(S.view==='r'){ renderResult(st); renderGrid(); navState(); return; }

  const q = S.list[S.idx], order = S.altOrder[q.id], a = S.ans[q.id], pick = a ? a.sel : S.pick[q.id];
  const correctPos = order.findIndex(i => q.a[i].ok);
  let html = `
  <div class="status"><span>Questão <b>${S.idx+1}</b> de ${st.total}</span><span>Acertos <b>${st.right}</b> de ${st.done} respondidas</span></div>
  <div class="bar"><i style="width:${st.total? (st.done/st.total*100):0}%"></i></div>
  <article class="card qcard" aria-live="polite">
    <div class="meta"><span class="tag ${q.b}">${q.b}</span><span class="tag t">${esc(q.t)}</span><span class="tag o">${esc(q.o)}</span></div>
    <p class="enun">${esc(q.e)}</p>`;
  if(a){
    html += a.ok
      ? `<div class="feedback ok">${svgOk}<span>Você acertou. A explicação de cada alternativa está abaixo.</span></div>`
      : `<div class="feedback no">${svgNo}<span>Você marcou ${'ABCDE'[order.indexOf(a.sel)]}. A correta é ${'ABCDE'[correctPos]}.</span></div>`;
  }
  html += `
    <div class="alts" role="radiogroup" aria-label="Alternativas">`;
  order.forEach((orig,pos) => {
    const alt = q.a[orig], L = 'ABCDE'[pos];
    let cls = 'alt';
    if(a){ cls += ' done'; if(alt.ok) cls += ' right'; else if(orig===a.sel) cls += ' wrong'; }
    const checked = pick===orig;
    html += `<button class="${cls}" role="radio" aria-checked="${checked}" data-orig="${orig}" ${a?'aria-disabled="true"':''}>
      <span class="L">${L}</span><span class="x">${esc(alt.x)}${a ? `<div class="why"><strong class="${alt.ok?'ok':'no'}">${alt.ok?'Correta':'Errada'}.</strong> ${esc(alt.w)}</div>` : ''}</span></button>`;
  });
  html += `</div>`;
  if(a){
    html += `<div class="box"><h3>Ponto-chave</h3><p>${esc(q.k)}</p></div>`;
    if(q.n) html += `<div class="box note"><h3>Atenção</h3><p>${esc(q.n)}</p></div>`;
  } else {
    html += `<div class="actions"><button class="btn primary" id="confirm" ${pick===undefined?'disabled':''}>Confirmar resposta</button></div>`;
  }
  html += `</article>`;
  app.innerHTML = html;

  app.querySelectorAll('.alt').forEach(b => b.addEventListener('click', () => { if(!S.ans[q.id]) { S.pick[q.id] = +b.dataset.orig; render(); } }));
  const c = $('#confirm'); if(c) c.addEventListener('click', confirmAns);
  renderGrid(); navState();
}

function confirmAns(){
  const q = S.list[S.idx]; const sel = S.pick[q.id];
  if(sel===undefined || S.ans[q.id]) return;
  S.ans[q.id] = { sel, ok: !!q.a[sel].ok };
  render();
}

function renderGrid(){
  const g = $('#grid');
  g.innerHTML = S.list.map((q,i) => {
    const a = S.ans[q.id]; let c='dot'; if(a) c += a.ok?' r':' w'; if(S.view==='q' && i===S.idx) c+=' cur';
    return `<button class="${c}" data-i="${i}" aria-label="Questão ${i+1}${a?(a.ok?', acertou':', errou'):''}">${i+1}</button>`;
  }).join('');
  g.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => { S.view='q'; S.idx=+d.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
}

function navState(){
  const p=$('#prev'), n=$('#next');
  if(S.view==='r' || !S.list.length){ p.disabled = !S.list.length; p.textContent='← Voltar às questões'; n.style.display='none'; return; }
  n.style.display=''; p.textContent='← Anterior';
  p.disabled = S.idx===0;
  n.textContent = S.idx===S.list.length-1 ? 'Ver resultado' : 'Próxima →';
}

function go(d){
  if(S.view==='r'){ S.view='q'; render(); return; }
  const ni = S.idx + d;
  if(ni<0) return;
  if(ni>=S.list.length){ S.view='r'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  S.idx = ni; render(); window.scrollTo({top:0,behavior:'smooth'});
}

function renderResult(st){
  const pct = st.done ? Math.round(st.right/st.done*100) : 0;
  const by = {}; S.list.forEach(q => { by[q.b] = by[q.b] || {t:0,d:0,r:0}; by[q.b].t++; const a=S.ans[q.id]; if(a){ by[q.b].d++; if(a.ok) by[q.b].r++; } });
  const colors = {CI:'var(--ci)',HAM:'var(--ham)',IESC:'var(--iesc)'};
  const misses = S.list.map((q,i)=>({q,i})).filter(({q}) => S.ans[q.id] && !S.ans[q.id].ok);
  const pending = st.total - st.done;
  let html = `<section class="card result">
    <div class="status" style="margin-top:0"><span>Resultado</span><span>${st.done} de ${st.total} respondidas</span></div>
    <div class="big">${pct}%</div>
    <p class="sub" style="margin:6px 0 0">${st.right} acertos em ${st.done} respondidas${pending?` · ${pending} sem resposta`:''}</p>
    <div class="blocks">`;
  for(const b of ['CI','HAM','IESC']) if(by[b]){
    const x=by[b], p = x.d ? Math.round(x.r/x.d*100) : 0;
    html += `<div class="bl"><span class="tag ${b}" style="text-align:center">${b}</span><div class="track"><i style="width:${p}%;background:${colors[b]}"></i></div><span>${x.r}/${x.d} · ${p}%</span></div>`;
  }
  html += `</div>`;
  if(misses.length){
    html += `<h3 style="font-family:var(--ff-head);margin:8px 0 0">Para revisar</h3><ul class="misses">` +
      misses.map(({q,i}) => `<li><button data-i="${i}">Questão ${i+1} · ${esc(q.t)} <small>· ${esc(q.o)}</small></button></li>`).join('') + `</ul>`;
  }
  html += `<div class="actions" style="flex-wrap:wrap">
      <button class="btn primary" id="again">Refazer em nova ordem</button>
      ${misses.length?'<button class="btn" id="wrongs" style="flex:1">Refazer só as erradas</button>':''}
    </div></section>`;
  $('#app').innerHTML = html;
  $('#app').querySelectorAll('.misses button').forEach(b => b.addEventListener('click', () => { S.view='q'; S.idx=+b.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'}); }));
  $('#again').addEventListener('click', () => { S.list.forEach(q => { delete S.ans[q.id]; delete S.pick[q.id]; }); build(filtered()); render(); window.scrollTo({top:0}); });
  const w = $('#wrongs'); if(w) w.addEventListener('click', () => { const pool = misses.map(m=>m.q); pool.forEach(q => { delete S.ans[q.id]; delete S.pick[q.id]; }); build(pool); render(); window.scrollTo({top:0}); });
}

document.querySelectorAll('.chipbtn').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.f, b.dataset.v)));
$('#prev').addEventListener('click', () => go(-1));
$('#next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('summary')) return;
  if(S.view!=='q' || !S.list.length){ if(e.key==='ArrowLeft') go(-1); return; }
  const q = S.list[S.idx];
  const k = e.key.toUpperCase();
  const map = {A:0,B:1,C:2,D:3,E:4,'1':0,'2':1,'3':2,'4':3,'5':4};
  if(k in map && !S.ans[q.id]){ const pos=map[k]; const order=S.altOrder[q.id]; if(pos<order.length){ S.pick[q.id]=order[pos]; render(); } }
  else if(e.key==='Enter'){ e.preventDefault(); if(!S.ans[q.id]) confirmAns(); else go(1); }
  else if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
});

syncChips(); build(filtered()); render();
</script>
</body>
</html>
