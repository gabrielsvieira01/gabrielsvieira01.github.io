<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Vivo — Recife Orgânico & Dunas Douradas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020B18;
            --text-primary: #F0F6FC;
            --text-secondary: #94A3B8;
            --accent-teal: #2DD4BF;
            --accent-coral: #FF6B81;
            --accent-gold: #F59E0B;
            --glass-bg: rgba(4, 18, 38, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #world-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #stage-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform-origin: center center;
            will-change: transform;
        }

        #world-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 2.5rem;
            pointer-events: none;
        }

        .ui-overlay * {
            pointer-events: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            color: var(--accent-coral);
        }

        .brand-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #FFFFFF;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 2.25rem;
        }

        .timer-compact {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0.5rem 0.75rem 0.5rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .timer-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .time-display {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #FFFFFF;
        }

        .session-label {
            font-size: 0.62rem;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 0.2rem;
        }

        .progress-mini-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-coral), var(--accent-teal), var(--accent-gold));
            transition: width 0.2s ease-out;
        }

        .controls-mini {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #FFFFFF;
            color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-primary-mini:hover {
            transform: scale(1.08);
            background: #F1F5F9;
        }

        .btn-secondary-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-secondary-mini:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        .footer-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .eco-status {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .status-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-teal);
        }

        .status-key {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .status-divider {
            width: 1px;
            height: 12px;
            background: var(--glass-border);
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="world-canvas"></canvas>

        <div id="stage-viewport">

                    <linearGradient id="dune-back-grad" x1="0%" y1="0%" x2="0%" y2="100%">

                    <linearGradient id="dune-mid-grad" x1="0%" y1="0%" x2="0%" y2="100%">

                        <stop offset="50%" stop-color="#7C5D38"/>

    <script>
        class ProceduralTerrain {
            constructor() {
                this.regenerate();
            }

            regenerate() {
                this.back = { base: 770, a1: 35 + Math.random()*25, f1: 0.002, p1: Math.random()*10, a2: 20, f2: 0.005, p2: Math.random()*10 };
                this.mid  = { base: 840, a1: 40 + Math.random()*30, f1: 0.0025, p1: Math.random()*10, a2: 25, f2: 0.006, p2: Math.random()*10 };
                this.front= { base: 920, a1: 45 + Math.random()*35, f1: 0.003, p1: Math.random()*10, a2: 20, f2: 0.004, p2: Math.random()*10 };

                this.cliffSeeds = {
                    leftWidth: 260 + Math.random() * 160,
                    rightWidth: 280 + Math.random() * 180,
                    freq1: 0.008 + Math.random() * 0.008,
                    freq2: 0.015 + Math.random() * 0.015,
                    phaseLeft: Math.random() * 10,
                    phaseRight: Math.random() * 10,
                    centerHeight: 400 + Math.random() * 200,
                    centerLeft: 350 + Math.random() * 200,
                    centerRight: 1350 + Math.random() * 200
                };
            }

            getSandHeight(x, layer = 'front') {
                const p = layer === 'back' ? this.back : (layer === 'mid' ? this.mid : this.front);
                return p.base - Math.sin(x * p.f1 + p.p1) * p.a1 - Math.cos(x * p.f2 + p.p2) * p.a2;
            }

            generateDunePath(layer = 'front') {
                let d = `M -100,1080 L -100,${this.getSandHeight(-100, layer)}`;
                for (let x = -50; x <= 2020; x += 40) {
                    d += ` L ${x},${Math.round(this.getSandHeight(x, layer))}`;
                }
                d += ` L 2020,1080 Z`;
                return d;
            }

            generateCliffLayerPath(isMid = false) {
                const hShift = isMid ? (30 + Math.random() * 25) : 0;
                const wShift = isMid ? 45 : 0;
                const s = this.cliffSeeds;
                
                let pathLeft = `M -100,1080 L -100,${220 + hShift} `;
                for (let y = 220 + hShift; y <= 880; y += 50) {
                    const bumpX = (s.leftWidth + wShift) 
                        + Math.sin(y * s.freq1 + s.phaseLeft) * 85 
                        + Math.cos(y * s.freq2) * 40;
                    pathLeft += `Q ${bumpX + 35},${y - 25} ${bumpX},${y} `;
                }
                pathLeft += `L -100,880 Z`;

                let pathRight = `M 2020,1080 L 2020,180 `;
                for (let y = 180; y <= 900; y += 60) {
                    const bumpX = 1920 - ((s.rightWidth + wShift) 
                        + Math.cos(y * s.freq1 + s.phaseRight) * 95 
                        + Math.sin(y * s.freq2) * 45);
                    pathRight += `Q ${bumpX - 45},${y - 30} ${bumpX},${y} `;
                }
                pathRight += `L 2020,900 Z`;

                const centerPeak = s.centerHeight + (isMid ? 45 : 0);
                const centerBump = `M ${s.centerLeft - 120},850 Q ${s.centerLeft + 250},${centerPeak} ${s.centerRight},850 Z`;

                return `${pathLeft} ${pathRight} ${centerBump}`;
            }
        }

        class CanvasRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this._initParticles();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }

            _initParticles() {
                this.particles = [];
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        radius: Math.random() * 2.2 + 0.5,
                        alpha: Math.random() * 0.5 + 0.2,
                        speedY: -(Math.random() * 0.3 + 0.08),
                        driftSpeed: Math.random() * 0.002 + 0.001,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            render(time) {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;

                ctx.clearRect(0, 0, w, h);

                const oceanGrad = ctx.createLinearGradient(0, 0, 0, h);
                oceanGrad.addColorStop(0, '#0D3862');
                oceanGrad.addColorStop(0.45, '#061D35');
                oceanGrad.addColorStop(1, '#020B18');
                ctx.fillStyle = oceanGrad;
                ctx.fillRect(0, 0, w, h);

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const rayGrad = ctx.createLinearGradient(w * 0.3, 0, w * 0.6, h);
                rayGrad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
                rayGrad.addColorStop(0.5, 'rgba(45, 212, 191, 0.06)');
                rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                const shift = Math.sin(time * 0.3) * 35;
                ctx.moveTo(w * 0.15 + shift, 0);
                ctx.lineTo(w * 0.5 + shift, 0);
                ctx.lineTo(w * 0.85, h);
                ctx.lineTo(w * 0.25, h);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.save();
                for (let p of this.particles) {
                    p.y += p.speedY;
                    p.x += Math.sin(time * p.driftSpeed + p.phase) * 0.4;

                    if (p.y < -10) {
                        p.y = h + 10;
                        p.x = Math.random() * w;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(186, 230, 253, ${p.alpha * (0.6 + Math.sin(time * 2 + p.phase) * 0.4)})`;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Camera {
            constructor(viewport) {
                this.viewport = viewport;
                this.targetX = 0; this.targetY = 0;
                this.currentX = 0; this.currentY = 0;

                window.addEventListener('mousemove', (e) => {
                    const nx = (e.clientX / window.innerWidth) - 0.5;
                    const ny = (e.clientY / window.innerHeight) - 0.5;
                    this.targetX = nx * -24;
                    this.targetY = ny * -14;
                });
            }

            update(time) {
                const driftX = Math.sin(time * 0.25) * 10;
                const driftY = Math.cos(time * 0.18) * 6;

                this.currentX += ((this.targetX + driftX) - this.currentX) * 0.04;
                this.currentY += ((this.targetY + driftY) - this.currentY) * 0.04;

                this.viewport.style.transform = `translate3d(${this.currentX}px, ${this.currentY}px, 0)`;
            }
        }

        class Rock {
            constructor(rockParentEl, shadowParentEl, { x, y, scale = 1, rx = 40, ry = 24, fill = 'url(#rock-grad-warm)' }) {
                this.x = x; this.y = y; this.scale = scale;

                this.shadowElement = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                this.shadowElement.setAttribute('cx', x);
                this.shadowElement.setAttribute('cy', y + (ry * scale * 0.3));
                this.shadowElement.setAttribute('rx', rx * scale * 1.4);
                this.shadowElement.setAttribute('ry', ry * scale * 0.55);
                this.shadowElement.setAttribute('fill', 'url(#rock-shadow-grad)');
                this.shadowElement.setAttribute('filter', 'url(#soft-shadow-filter)');
                shadowParentEl.appendChild(this.shadowElement);

                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.element.setAttribute('transform', `translate(${x}, ${y}) scale(${scale})`);

                this.element.innerHTML = `
                    <path d="M ${-rx},0 Q ${-rx*0.85},${-ry*1.3} 0,${-ry*1.15} Q ${rx*0.85},${-ry*1.2} ${rx},0 Q ${rx*0.6},${ry*0.5} 0,${ry*0.4} Q ${-rx*0.7},${ry*0.5} ${-rx},0 Z" fill="${fill}"/>
                    <path d="M ${-rx*0.65},${-ry*0.4} Q 0,${-ry*0.95} ${rx*0.55},${-ry*0.35}" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none" stroke-linecap="round"/>
                `;
                rockParentEl.appendChild(this.element);
            }
        }

        class Coral {
            constructor(parentEl, { x, y, scale = 1, gradientId = 'url(#coral-pink)', branches = 5 }) {
                this.x = x; this.y = y; this.maxScale = scale;
                this.gradientId = gradientId; this.branchesCount = branches;
                this.growthProgress = 0;

                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) scale(0)`);
                
                let pathsHTML = '';
                const baseWidth = 20;
                for (let i = 0; i < this.branchesCount; i++) {
                    const angle = (-82 + (164 / (this.branchesCount - 1)) * i) * (Math.PI / 180);
                    const length = 90 + Math.sin(i * 1.4) * 26;
                    const cx1 = Math.cos(angle) * (length * 0.5) + (i % 2 === 0 ? 10 : -10);
                    const cy1 = -Math.abs(Math.sin(angle)) * (length * 0.5);
                    const ex = Math.cos(angle) * length;
                    const ey = -Math.abs(Math.sin(angle)) * length;

                    pathsHTML += `
                        <path d="M 0,0 C ${cx1},${cy1} ${ex * 0.7},${ey * 0.8} ${ex},${ey}" 
                              fill="none" stroke="${this.gradientId}" 
                              stroke-width="${baseWidth - i * 1.6}" stroke-linecap="round" />
                        <circle cx="${ex}" cy="${ey}" r="${(baseWidth - i * 1.6) * 0.45}" fill="${this.gradientId}" />
                    `;
                }
                this.element.innerHTML = pathsHTML;
                parentEl.appendChild(this.element);
            }

            setGrowth(progress) {
                this.growthProgress = progress;
            }

            animateSway(time, index) {
                if (this.growthProgress <= 0) return;
                const sway = Math.sin(time * 1.3 + index) * 2.5;
                const currentScale = Math.pow(this.growthProgress, 0.8) * this.maxScale;
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) scale(${currentScale}) rotate(${sway})`);
            }
        }

        class Anemone {
            constructor(parentEl, { x, y, scale = 1, tentacleCount = 10 }) {
                this.x = x; this.y = y; this.targetScale = scale;
                this.tentacleCount = tentacleCount;
                this.growthProgress = 0;
                this.tentacles = [];

                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) scale(0)`);

                const base = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                base.setAttribute('cx', '0'); base.setAttribute('cy', '0');
                base.setAttribute('rx', '28'); base.setAttribute('ry', '9');
                base.setAttribute('fill', 'url(#anemone-grad)');
                this.element.appendChild(base);

                for (let i = 0; i < this.tentacleCount; i++) {
                    const angle = (-140 + (280 / (this.tentacleCount - 1)) * i) * (Math.PI / 180);
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke', 'url(#anemone-grad)');
                    path.setAttribute('stroke-width', '5.5');
                    path.setAttribute('stroke-linecap', 'round');
                    this.element.appendChild(path);

                    this.tentacles.push({ element: path, angle, length: 48 + Math.random() * 18, phase: i * 0.4 });
                }
                parentEl.appendChild(this.element);
            }

            setGrowth(progress) {
                this.growthProgress = progress;
            }

            update(time) {
                if (this.growthProgress <= 0) return;
                const s = Math.pow(this.growthProgress, 0.85) * this.targetScale;
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) scale(${s})`);

                for (let t of this.tentacles) {
                    const wave = Math.sin(time * 2.2 + t.phase) * 12;
                    const tipX = Math.cos(t.angle) * t.length + wave;
                    const tipY = -Math.abs(Math.sin(t.angle)) * t.length - 6;
                    t.element.setAttribute('d', `M 0,-3 C ${tipX*0.5 + wave},${tipY*0.5} ${tipX*0.8},${tipY*0.8} ${tipX},${tipY}`);
                }
            }
        }

        class SeaweedCluster {
            constructor(parentEl, { x, y, count = 4, baseHeight = 220 }) {
                this.x = x; this.y = y;
                this.growthProgress = 0;
                this.blades = [];

                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                for (let i = 0; i < count; i++) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('fill', 'url(#seaweed-grad)');
                    path.setAttribute('opacity', (0.7 + Math.random() * 0.3).toFixed(2));
                    this.element.appendChild(path);

                    this.blades.push({
                        element: path,
                        offsetX: (i - (count - 1) / 2) * (8 + Math.random() * 6),
                        heightFactor: 0.65 + Math.random() * 0.7,
                        swayOffset: Math.random() * Math.PI * 2,
                        width: 6 + Math.random() * 5,
                        baseHeight: baseHeight
                    });
                }
                parentEl.appendChild(this.element);
            }

            setGrowth(progress) {
                this.growthProgress = progress;
            }

            update(time) {
                if (this.growthProgress <= 0) {
                    this.blades.forEach(b => b.element.setAttribute('d', ''));
                    return;
                }

                const growthFactor = Math.pow(this.growthProgress, 0.9);

                this.blades.forEach(b => {
                    const h = b.baseHeight * b.heightFactor * growthFactor;
                    const bx = this.x + b.offsetX;
                    const sway1 = Math.sin(time * 1.2 + b.swayOffset) * (15 + h * 0.08);
                    const sway2 = Math.cos(time * 0.95 + b.swayOffset) * (20 + h * 0.1);
                    const w = b.width * Math.min(1.6, 0.4 + growthFactor * 0.7);

                    b.element.setAttribute('d', `
                        M ${bx - w},${this.y}
                        Q ${bx + sway1},${this.y - h * 0.5} ${bx + sway2},${this.y - h}
                        Q ${bx + sway1 + w},${this.y - h * 0.5} ${bx + w},${this.y} Z
                    `);
                });
            }
        }

        // NOVO: Classe de Peixes com Múltiplas Espécies, Tamanhos e Animação de Entrada
        class Fish {
            constructor(parentEl, { type = 0, gradientId, scale = 1, yBounds = [160, 780], speed = 1 }) {
                this.type = type;
                this.gradientId = gradientId;
                this.scale = scale;
                this.yBounds = yBounds;
                this.speed = speed;
                
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.x = this.direction === 1 ? -120 : 2040;
                this.y = yBounds[0] + Math.random() * (yBounds[1] - yBounds[0]);
                this.phase = Math.random() * Math.PI * 2;
                
                this.active = false;
                this.hasEntered = false;

                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.element.setAttribute('opacity', '0');
                this._buildFishSVG();
                parentEl.appendChild(this.element);
            }

            _buildFishSVG() {
                let bodyHTML = '';
                // Tipo 0: Peixe-Anjo / Borboleta (Alto, discoide com barbatanas pontiagudas)
                if (this.type === 0) {
                    bodyHTML = `
                        <path d="M -20,0 C -10,-28 15,-25 25,0 C 15,25 -10,28 -20,0 Z" fill="${this.gradientId}"/>
                        <path d="M 0,-22 L -8,-40 L 8,-20 Z" fill="${this.gradientId}" opacity="0.9"/>
                        <path d="M 0,22 L -8,40 L 8,20 Z" fill="${this.gradientId}" opacity="0.9"/>
                        <path d="M -18,0 L -32,-14 L -26,0 L -32,14 Z" fill="${this.gradientId}"/>
                        <path d="M 2,-8 C 5,-12 12,-10 6,0 Z" fill="rgba(255,255,255,0.4)"/>
                        <line x1="5" y1="-18" x2="5" y2="18" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
                        <circle cx="15" cy="-4" r="2.2" fill="#020B18"/>
                        <circle cx="15.8" cy="-4.5" r="0.8" fill="#FFFFFF"/>
                    `;
                } 
                // Tipo 1: Peixe-Palhaço / Tang (Oval suave com listras)
                else if (this.type === 1) {
                    bodyHTML = `
                        <path d="M -22,0 C -12,-14 18,-12 28,0 C 18,12 -12,14 -22,0 Z" fill="${this.gradientId}"/>
                        <path d="M -20,0 L -34,-10 L -28,0 L -34,10 Z" fill="${this.gradientId}"/>
                        <path d="M 2,-8 C 10,-18 16,-16 12,-6 Z" fill="${this.gradientId}" opacity="0.85"/>
                        <path d="M -2,-10 Q 3,0 -2,10 Q 3,0 -2,-10 Z" fill="#FFFFFF" opacity="0.9"/>
                        <path d="M 12,-7 Q 16,0 12,7 Q 16,0 12,-7 Z" fill="#FFFFFF" opacity="0.9"/>
                        <circle cx="18" cy="-3" r="2.2" fill="#020B18"/>
                        <circle cx="18.8" cy="-3.5" r="0.8" fill="#FFFFFF"/>
                    `;
                } 
                // Tipo 2: Chromis / Tetra (Aerodinâmico e ágil com cauda bifurcada)
                else if (this.type === 2) {
                    bodyHTML = `
                        <path d="M -25,0 C -12,-10 15,-8 30,0 C 15,8 -12,10 -25,0 Z" fill="${this.gradientId}"/>
                        <path d="M -22,0 L -40,-16 L -28,-2 L -40,12 Z" fill="${this.gradientId}"/>
                        <path d="M -5,-7 L 2,-16 L 10,-5 Z" fill="${this.gradientId}" opacity="0.8"/>
                        <circle cx="20" cy="-2" r="2" fill="#020B18"/>
                        <circle cx="20.6" cy="-2.4" r="0.7" fill="#FFFFFF"/>
                    `;
                } 
                // Tipo 3: Peixe-Balão / Pequeno Espécime Arredondado
                else {
                    bodyHTML = `
                        <circle cx="0" cy="0" r="16" fill="${this.gradientId}"/>
                        <path d="M 12,-2 C 18,-8 22,0 16,4 Z" fill="${this.gradientId}"/>
                        <path d="M -14,0 L -26,-8 L -22,0 L -26,8 Z" fill="${this.gradientId}"/>
                        <path d="M -2,-12 C 2,-18 8,-12 4,-8 Z" fill="${this.gradientId}" opacity="0.8"/>
                        <circle cx="8" cy="-5" r="2.5" fill="#020B18"/>
                        <circle cx="8.8" cy="-5.8" r="0.9" fill="#FFFFFF"/>
                    `;
                }
                this.element.innerHTML = bodyHTML;
            }

            spawn() {
                this.hasEntered = true;
                this.active = true;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.x = this.direction === 1 ? -120 : 2040;
                this.element.setAttribute('opacity', '1');
            }

            reset() {
                this.hasEntered = false;
                this.active = false;
                this.element.setAttribute('opacity', '0');
            }

            update(time, deltaSec) {
                if (!this.active) return;

                this.x += this.direction * this.speed * 65 * deltaSec;
                this.y += Math.sin(time * 2.2 + this.phase) * 0.5;

                // Transição contínua fora da tela após ter entrado
                if (this.direction === 1 && this.x > 2060) {
                    this.x = -100;
                    this.y = this.yBounds[0] + Math.random() * (this.yBounds[1] - this.yBounds[0]);
                } else if (this.direction === -1 && this.x < -100) {
                    this.x = 2060;
                    this.y = this.yBounds[0] + Math.random() * (this.yBounds[1] - this.yBounds[0]);
                }

                const sx = this.direction * this.scale;
                const sy = this.scale;
                this.element.setAttribute('transform', 
                    `translate(${this.x.toFixed(1)}, ${this.y.toFixed(1)}) scale(${sx.toFixed(2)}, ${sy.toFixed(2)}) rotate(${(Math.sin(time*3 + this.phase)*3).toFixed(1)})`
                );
            }
        }

        class MantaRay {
            constructor(parentEl) {
                this.x = -500; this.y = 320; this.active = false;
                this.element = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.element.setAttribute('opacity', '0.85');

                this.element.innerHTML = `
                    <g transform="rotate(90)">
                        <path d="M 0,-55 C 55,-28 125,15 170,55 C 70,42 28,28 0,80 C -28,28 -70,42 -170,55 C -125,15 -55,-28 0,-55 Z" fill="#0C2340" stroke="#1E3A5F" stroke-width="2"/>
                        <path d="M 0,-40 C 30,-15 70,15 90,40 C 40,30 15,20 0,50 C -15,20 -40,30 -90,40 C -70,15 -30,-15 0,-40 Z" fill="#143154" opacity="0.6"/>
                        <path d="M 0,75 Q 0,160 8,210" stroke="#0C2340" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                    </g>
                `;
                parentEl.appendChild(this.element);
            }

            spawn() { this.x = -500; this.y = 180 + Math.random() * 300; this.active = true; }

            update(time, deltaSec) {
                if (!this.active) return;
                this.x += 80 * deltaSec;
                this.y += Math.sin(time * 0.7) * 0.5;
                const wing = Math.sin(time * 1.3) * 0.18 + 0.82;
                
                this.element.setAttribute('transform', `translate(${this.x}, ${this.y}) scale(2.2, ${wing * 2.2})`);
                if (this.x > 2400) this.active = false;
            }
        }

        class RecifeTheme {
            constructor() {
                this.layers = {
                    cliffsFar: document.getElementById('layer-cliffs-far'),
                    cliffsMid: document.getElementById('layer-cliffs-mid'),
                    dunesBack: document.getElementById('layer-dunes-back'),
                    vegBack: document.getElementById('layer-veg-back'),
                    shadowsBack: document.getElementById('layer-shadows-back'),
                    rocksBack: document.getElementById('layer-rocks-back'),
                    dunesMid: document.getElementById('layer-dunes-mid'),
                    vegMid: document.getElementById('layer-veg-mid'),
                    shadowsMid: document.getElementById('layer-shadows-mid'),
                    rocksMid: document.getElementById('layer-rocks-mid'),
                    dunesFront: document.getElementById('layer-dunes-front'),
                    vegFront: document.getElementById('layer-veg-front'),
                    shadowsFront: document.getElementById('layer-shadows-front'),
                    rocksFront: document.getElementById('layer-rocks-front'),
                    rareFauna: document.getElementById('layer-rare-fauna'),
                    fauna: document.getElementById('layer-fauna')
                };

                this.terrain = new ProceduralTerrain();
                this.components = [];
                this.fauna = [];
                this.manta = new MantaRay(this.layers.rareFauna);
                this.stats = { structures: 0, fauna: 0 };

                this.generateRandomScene();
            }

            _shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            generateRandomScene() {
                this.terrain.regenerate();

                Object.keys(this.layers).forEach(k => { if (k !== 'rareFauna') this.layers[k].innerHTML = ''; });
                this.components = [];
                this.fauna = [];

                // Paredões Rochosos
                const cliffFar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                cliffFar.setAttribute('d', this.terrain.generateCliffLayerPath(false));
                cliffFar.setAttribute('fill', 'url(#cliff-far-grad)');
                this.layers.cliffsFar.appendChild(cliffFar);

                const cliffMid = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                cliffMid.setAttribute('d', this.terrain.generateCliffLayerPath(true));
                cliffMid.setAttribute('fill', 'url(#cliff-mid-grad)');
                this.layers.cliffsMid.appendChild(cliffMid);

                // Dunas
                ['back', 'mid', 'front'].forEach(layer => {
                    const dunePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    dunePath.setAttribute('d', this.terrain.generateDunePath(layer));
                    dunePath.setAttribute('fill', `url(#dune-${layer}-grad)`);
                    const parent = layer === 'back' ? this.layers.dunesBack : (layer === 'mid' ? this.layers.dunesMid : this.layers.dunesFront);
                    parent.appendChild(dunePath);
                });

                // Gerar Rochas
                const rockCenters = [];
                const numRocks = 14 + Math.floor(Math.random() * 6);
                
                for (let i = 0; i < numRocks; i++) {
                    const x = 60 + Math.random() * 1800;
                    const layerType = Math.random() < 0.35 ? 'back' : (Math.random() < 0.7 ? 'mid' : 'front');
                    
                    const sandY = this.terrain.getSandHeight(x, layerType);
                    const rx = 30 + Math.random() * 35;
                    const ry = 18 + Math.random() * 20;
                    const scale = layerType === 'back' ? (0.7 + Math.random()*0.3) : (layerType === 'mid' ? (0.9 + Math.random()*0.3) : (1.1 + Math.random()*0.4));
                    const fill = layerType === 'back' ? 'url(#rock-grad-dark)' : 'url(#rock-grad-warm)';
                    
                    const rockParent = layerType === 'back' ? this.layers.rocksBack : (layerType === 'mid' ? this.layers.rocksMid : this.layers.rocksFront);
                    const shadowParent = layerType === 'back' ? this.layers.shadowsBack : (layerType === 'mid' ? this.layers.shadowsMid : this.layers.shadowsFront);

                    new Rock(rockParent, shadowParent, { x, y: sandY + (ry * scale * 0.25), scale, rx, ry, fill });

                    rockCenters.push({ x, radius: rx * scale * 0.35 });
                }

                // Pontos de Ancoragem da Vegetação
                const floraAnchors = [];
                for (let x = 40; x <= 1880; x += 22 + Math.random() * 20) {
                    const centerOverlap = rockCenters.some(rock => Math.abs(x - rock.x) < rock.radius);

                    if (!centerOverlap) {
                        const layerType = Math.random() < 0.3 ? 'back' : (Math.random() < 0.65 ? 'mid' : 'front');
                        const y = this.terrain.getSandHeight(x, layerType);
                        floraAnchors.push({ x, y, layerType });
                    }
                }

                this._shuffle(floraAnchors);

                const coralGradients = ['url(#coral-magenta)', 'url(#coral-orange)', 'url(#coral-teal)', 'url(#coral-pink)'];
                const fishGradients = [
                    'url(#fish-clown)', 'url(#fish-blue)', 'url(#fish-yellow)', 
                    'url(#fish-violet)', 'url(#fish-emerald)', 'url(#fish-crimson)'
                ];

                const totalElements = floraAnchors.length;
                const growthThresholds = this._shuffle(Array.from({length: totalElements}, (_, i) => 0.02 + (i / Math.max(1, totalElements)) * 0.95));

                floraAnchors.forEach((anchor, index) => {
                    const threshold = growthThresholds[index];
                    const randType = Math.random();

                    // Associar o elemento ao grupo de vegetação do SEU RESPECTIVO NÍVEL
                    const vegParent = anchor.layerType === 'back' 
                        ? this.layers.vegBack 
                        : (anchor.layerType === 'mid' ? this.layers.vegMid : this.layers.vegFront);

                    if (randType < 0.38) {
                        const grad = coralGradients[Math.floor(Math.random() * coralGradients.length)];
                        const coral = new Coral(vegParent, {
                            x: anchor.x, y: anchor.y,
                            scale: 0.8 + Math.random() * 0.6,
                            gradientId: grad,
                            branches: 4 + Math.floor(Math.random() * 4)
                        });
                        this.components.push({ instance: coral, threshold });
                    } else if (randType < 0.82) {
                        const clusterCount = 3 + Math.floor(Math.random() * 4);
                        const cluster = new SeaweedCluster(vegParent, { 
                            x: anchor.x, 
                            y: anchor.y, 
                            count: clusterCount,
                            baseHeight: 180 + Math.random() * 140 
                        });
                        this.components.push({ instance: cluster, threshold });
                    } else {
                        const anemone = new Anemone(vegParent, { x: anchor.x, y: anchor.y, scale: 0.8 + Math.random() * 0.4 });
                        this.components.push({ instance: anemone, threshold });
                    }
                });

                // Criar Cardume Variado (Espécies, Tamanhos e Tempos de Entrada)
                const numFish = 18 + Math.floor(Math.random() * 8);
                for (let i = 0; i < numFish; i++) {
                    const type = Math.floor(Math.random() * 4);
                    const grad = fishGradients[Math.floor(Math.random() * fishGradients.length)];
                    const scale = 0.35 + Math.random() * 0.95; // Ampla variedade de tamanhos
                    
                    const fish = new Fish(this.layers.fauna, {
                        type,
                        gradientId: grad,
                        scale,
                        speed: 0.6 + Math.random() * 0.9,
                        yBounds: [140 + (i % 5) * 120, 780]
                    });
                    
                    this.fauna.push({ instance: fish, minProgress: 0.04 + (i * 0.038) });
                }
            }

            updateGrowth(progress) {
                let activeStructs = 0;
                this.components.forEach(item => {
                    if (progress >= item.threshold) {
                        const localP = (progress - item.threshold) / (1.0 - item.threshold);
                        item.instance.setGrowth(localP);
                        activeStructs++;
                    } else {
                        item.instance.setGrowth(0);
                    }
                });
                this.stats.structures = activeStructs;
            }

            render(time, deltaSec, progress) {
                this.components.forEach((item, i) => {
                    if (item.instance.update) item.instance.update(time, i);
                    else if (item.instance.animateSway) item.instance.animateSway(time, i);
                });

                let activeFauna = 0;
                this.fauna.forEach(f => {
                    if (progress >= f.minProgress) {
                        if (!f.instance.hasEntered) {
                            f.instance.spawn();
                        }
                        f.instance.update(time, deltaSec);
                        activeFauna++;
                    } else if (f.instance.hasEntered) {
                        f.instance.reset();
                    }
                });
                this.stats.fauna = activeFauna;

                this.manta.update(time, deltaSec);
            }
        }

        class App {
            constructor() {
                this.timeDisplay = document.getElementById('time-display');
                this.progressFill = document.getElementById('progress-fill');
                this.btnToggle = document.getElementById('btn-toggle');
                this.btnReset = document.getElementById('btn-reset');
                this.iconPlay = this.btnToggle.querySelector('.icon-play');
                this.iconPause = this.btnToggle.querySelector('.icon-pause');
                this.statsCorals = document.getElementById('stats-corals');
                this.statsFauna = document.getElementById('stats-fauna');

                this.duration = 45;
                this.remaining = this.duration;
                this.progress = 0;
                this.elapsedTime = 0;
                this.isRunning = false;
                this.lastTime = 0;

                this.canvasRenderer = new CanvasRenderer(document.getElementById('world-canvas'));
                this.camera = new Camera(document.getElementById('stage-viewport'));
                this.theme = new RecifeTheme();

                this.init();
            }

            init() {
                this.btnToggle.addEventListener('click', () => this.toggle());
                this.btnReset.addEventListener('click', () => this.reset());

                this.lastTime = performance.now();
                requestAnimationFrame((t) => this.loop(t));

                this.updateUI();
                this.theme.updateGrowth(0);
            }

            toggle() {
                if (this.remaining <= 0) this.reset();

                this.isRunning = !this.isRunning;
                if (this.isRunning) {
                    this.iconPlay.classList.add('hidden');
                    this.iconPause.classList.remove('hidden');
                    this.lastTime = performance.now();
                } else {
                    this.iconPlay.classList.remove('hidden');
                    this.iconPause.classList.add('hidden');
                }
            }

            reset() {
                this.isRunning = false;
                this.remaining = this.duration;
                this.progress = 0;
                this.elapsedTime = 0;
                this.iconPlay.classList.remove('hidden');
                this.iconPause.classList.add('hidden');
                
                this.theme.generateRandomScene();
                this.theme.updateGrowth(0);
                this.updateUI();
            }

            loop(currentTime) {
                const deltaSec = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                if (this.isRunning && this.remaining > 0) {
                    this.remaining = Math.max(0, this.remaining - deltaSec);
                    this.elapsedTime += deltaSec;
                    this.progress = this.elapsedTime / this.duration;

                    if (this.remaining <= 0) {
                        this.isRunning = false;
                        this.iconPlay.classList.remove('hidden');
                        this.iconPause.classList.add('hidden');
                        this.theme.manta.spawn();
                    }

                    this.updateUI();
                    this.theme.updateGrowth(this.progress);
                }

                const timeSec = currentTime * 0.001;
                this.canvasRenderer.render(timeSec);
                this.camera.update(timeSec);
                this.theme.render(timeSec, deltaSec, this.progress);

                requestAnimationFrame((t) => this.loop(t));
            }

            updateUI() {
                const totalSec = Math.ceil(this.remaining);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                this.timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                this.progressFill.style.width = `${(Math.min(1, this.progress) * 100).toFixed(2)}%`;
                this.statsCorals.textContent = this.theme.stats.structures;
                this.statsFauna.textContent = this.theme.stats.fauna;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
