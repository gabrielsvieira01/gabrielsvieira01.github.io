<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Revisão</title>
<style>
:root{--bg:#e4ebe6;--panel:#fff;--ink:#14231d;--mute:#5b6e65;--line:#c8d4cc;--felt:#14503c;--felt2:#0d3a2b;--rail:#3a2416;--brass:#c79a2e;--bad:#c7392b;--mid:#c27a0a;--good:#1f8a52;--s:#2b2f33;--h:#d02b2b;--d:#1f5fd0;--c:#1f8a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1512;--panel:#12211c;--ink:#ecf1ed;--mute:#93a79d;--line:#24372f;--brass:#e0b552;--bad:#ef6a5b;--mid:#f0a93b;--good:#5fd391;--s:#cfd5d9;--h:#ff6b6b;--d:#6aa6ff;--c:#5fd391}}
:root[data-theme="dark"]{--bg:#0b1512;--panel:#12211c;--ink:#ecf1ed;--mute:#93a79d;--line:#24372f;--brass:#e0b552;--bad:#ef6a5b;--mid:#f0a93b;--good:#5fd391;--s:#cfd5d9;--h:#ff6b6b;--d:#6aa6ff;--c:#5fd391}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Segoe UI",system-ui,sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:14px;padding:14px;min-height:100vh;max-width:1500px;margin:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.list{display:flex;flex-direction:column;max-height:calc(100vh - 28px);position:sticky;top:14px}
.list header{padding:14px 14px 8px}.list h1{font-size:20px}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px;padding:0 14px 10px}
.tabs button{flex:1;border:1px solid var(--line);background:none;border-radius:6px;padding:4px 2px;font-size:12.5px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{overflow:auto;border-top:1px solid var(--line);flex:1}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px}
.it[aria-current=true]{background:color-mix(in srgb,var(--brass) 18%,transparent);box-shadow:inset 3px 0 var(--brass)}
.it b{font-weight:600}.it .t{font-size:12px;color:var(--mute)}
.pl{color:var(--good)}.mi{color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.st-erro{background:var(--bad)}.st-marginal{background:var(--mid)}.st-ok{background:var(--good)}
.stage{padding:14px;display:flex;flex-direction:column;gap:12px}
.rail{background:var(--rail);border-radius:999px/50%;padding:16px;box-shadow:inset 0 0 0 2px #0006}
.table{position:relative;aspect-ratio:16/12.4;border-radius:999px/50%;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2));box-shadow:inset 0 0 0 3px #0005,inset 0 0 60px #0007}
.center{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:52%}
.board{display:flex;gap:6px;min-height:calc(var(--cw)*1.39)}
.pot{color:#f4e9c4;font-family:"Segoe UI",sans-serif;font-weight:700;font-size:15px;background:#0006;padding:2px 12px;border-radius:99px}
.table{container-type:inline-size}.center{--cw:clamp(32px,9cqw,96px)}
.card{width:var(--cw);aspect-ratio:240/334;display:block;border-radius:5px;box-shadow:0 2px 5px #0008}
.back{background:repeating-linear-gradient(45deg,#7a1f2b 0 4px,#611722 4px 8px);border:2px solid #f1e8d0}
.ph{border:1.5px dashed #ffffff30;box-shadow:none;border-radius:5px}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:max(96px,13%)}
.hole{display:flex;gap:3px;margin-bottom:-6px}.hole .card{--cw:clamp(40px,11cqw,110px)}.seat:not(.hero) .hole .card{--cw:clamp(30px,7cqw,76px)}
.plate{z-index:2;background:#0a1511f0;color:#ecf1ed;border:1.5px solid #ffffff22;border-radius:8px;padding:3px 8px;text-align:center;min-width:86px;position:relative;font-size:12px;line-height:1.3}
.plate b{display:block;font-size:12.5px}
.seat.act .plate{border-color:var(--brass);box-shadow:0 0 0 2px #c79a2e66}
.seat.fold{opacity:.38}.seat.hero .plate{border-color:#9fe0bb}
.bet{z-index:3;position:absolute;color:#fff;background:#0009;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--brass)}
.btn{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:#f4e9c4;color:#222;font-weight:800;font-size:11px;display:grid;place-items:center}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 14px;min-width:44px}
.ctrl button:hover{border-color:var(--brass)}.ctrl .sp{flex:1}
.log{display:flex;flex-direction:column;gap:2px;max-height:210px;overflow:auto;font-size:14px}
.log button{text-align:left;background:none;border:0;border-radius:6px;padding:3px 8px;display:flex;gap:8px}
.log button[aria-current=true]{background:color-mix(in srgb,var(--brass) 20%,transparent);font-weight:600}
.log .s{color:var(--mute);min-width:52px;font-size:12.5px;padding-top:1px}
.fb{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.badge{display:inline-flex;align-items:center;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 11px 2px 9px;width:max-content}
.fb h2{font-size:21px}.fb p{margin:0}.fb .ideal{border-left:3px solid var(--brass);padding:2px 0 2px 10px}
.fb h3{font-size:14px;color:var(--mute);font-weight:700}
.fb ul{margin:0;padding-left:18px}.fb li{margin:3px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}.stat b{font-family:"Segoe UI",sans-serif;font-size:21px;display:block}
.stat span{font-size:12px;color:var(--mute)}
.sf{display:inline-block}.sf.s{color:var(--s)}.sf.h{color:var(--h)}.sf.d{color:var(--d)}.sf.c{color:var(--c)}

@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) 330px}.list{grid-column:1/-1;position:static;max-height:240px}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);padding:8px}.fb,.list{position:static;max-height:none}.list{max-height:260px}.rail{padding:8px}.plate{min-width:70px;font-size:11px}.seat{width:84px}}
/*dense*/.table.dense .seat{width:max(78px,10%)}.table.dense .seat:not(.hero) .hole .card{--cw:clamp(24px,5.2cqw,60px)}.table.dense .plate{white-space:nowrap;min-width:68px;font-size:11px;padding:2px 5px}
@media (prefers-reduced-motion:no-preference){.seat,.bet{transition:opacity .2s}}

.load{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.lb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.lb:hover{border-color:var(--brass)}
#msg{padding-bottom:2px}
.auto{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.auto select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.kv span:nth-child(even){text-align:right;font-weight:600}
.dec{width:100%;border-collapse:collapse;font-size:12.5px}
.dec th{text-align:left;color:var(--mute);font-weight:600;padding:2px 4px}
.dec td{padding:5px 4px;border-top:1px solid var(--line)}
.dec tr[data-i]{cursor:pointer}.dec tr[data-i]:hover{background:color-mix(in srgb,var(--brass) 14%,transparent)}
.fb a{color:inherit;text-decoration:underline dotted;cursor:pointer}
</style>
</head>
<body>
<div class="app">
 <aside class="col list" aria-label="Mãos da sessão">
  <header><h1>Mesa de Revisão</h1><div class="sub" id="meta"></div><div class="load"><label class="lb">📂 Carregar histórico<input type="file" id="fh" accept=".txt,text/plain" multiple hidden></label><label class="lb">📝 Importar feedback<input type="file" id="ff" accept=".json,application/json" hidden></label><button class="lb" id="clr">Limpar</button></div><div class="sub" id="msg">Arraste o .txt do GGPoker aqui ou use os botões. Funciona 100% offline.</div></header>
  <div class="tabs" id="tabs"></div>
  <div class="items" id="items"></div>
 </aside>
 <main class="col stage">
  <div class="rail"><div class="table" id="table"></div></div>
  <div class="ctrl">
   <button id="first" aria-label="Início">⏮</button><button id="prev" aria-label="Anterior">◀</button><button id="next" aria-label="Próxima ação">▶</button><button id="last" aria-label="Final">⏭</button>
   <span class="sp"></span><span class="sub" id="hh"></span>
  </div>
  <div class="log" id="log" role="list"></div>
 </main>
 <aside class="col fb" id="fb" aria-live="polite"></aside>
</div>

 const f=x=>Math.round(x/n*100)+'%',sg=x=>x>=0?'+':'−',net=H.reduce((a,h)=>a+h.net,0),allT=H.every(h=>h.tour);
 const cash=H.filter(h=>!h.tour&&h.bb),bbs=cash.reduce((a,h)=>a+h.net/h.bb,0);
 const nm=allT?sg(net)+Math.abs(net).toLocaleString('pt-BR'):sg(net)+'$'+Math.abs(net).toFixed(2).replace('.',',');
 const gap=(v-p)/n*100,byPos={};H.forEach(h=>{byPos[h.pos]=(byPos[h.pos]||0)+h.net});
 const pl=h=>`<a data-h="${h.id}">${h.hero.map(fc).join(' ')} ${h.pos} (${sg(h.net)}${money(Math.abs(h.net),h.tour)})</a>`;
 const bl=[...H].filter(h=>h.net<0).sort((a,b)=>a.net-b.net).slice(0,4),bw=[...H].filter(h=>h.net>0).sort((a,b)=>b.net-a.net).slice(0,3);
 const blocks=[['Panorama',[`${n} mãos: VPIP ${f(v)}, PFR ${f(p)}, 3-bet em ${t} mão${t===1?'':'s'}.`,
  gap>10?'Gap VPIP–PFR grande: muitos calls pré-flop. Revise defesa de blinds e calls contra 3-bet.':'Gap VPIP–PFR saudável.']],
  ['Resultado por posição',[Object.entries(byPos).map(([k,x])=>`${k} ${sg(x)}${money(Math.abs(x),allT)}`).join(' · ')]]];
 if(bl.length)blocks.push(['Maiores perdas (revise primeiro)',bl.map(pl)]);
 if(bw.length)blocks.push(['Maiores ganhos',bw.map(pl)]);
 return{stats:[[f(v),'VPIP'],[f(p),'PFR'],[nm,cash.length?`~${bbs.toFixed(0)} BB em ${n} mãos`:`${n} mãos`]],blocks}}

/* ===== Upload offline ===== */
const msg=t=>{$('msg').textContent=t};
function rebuild(){const r=parseHH(HANDS_RAW),seen=new Set();H=r.out.filter(h=>!seen.has(h.id)&&seen.add(h.id));MEMO.clear();SUM=IMP_SUM||autoSum();
 msg(H.length?`${H.length} mãos carregadas`+(r.skip?` · ${r.skip} ignorada(s) (formato não suportado ou mais de 10 assentos)`:''):'Nenhuma mão reconhecida. O arquivo precisa ser um histórico do GGPoker.');
 cur=H.find(x=>cur&&x.id===cur.id)||null;renderTabs();
 if(cur)renderAll();else{const f=H.find(h=>N[h.id])||H.find(h=>h.played)||H[0];if(f)pick(f);else renderAll()}}
function loadFiles(fs){fs=[...fs];if(!fs.length)return;
 Promise.all(fs.map(f=>f.text())).then(ts=>{HANDS_RAW+=(HANDS_RAW?'\n':'')+ts.join('\n').replace(/\r/g,'').replace(/^\uFEFF/,'');rebuild()})}
function loadFb(file){file.text().then(t=>{try{const d=JSON.parse(t),hs=d.hands||Object.fromEntries(Object.entries(d).filter(([k])=>k!=='summary'));N={};
 for(const [k,v] of Object.entries(hs))if(v&&v.title)N[k]={tag:['erro','marginal','ok'].includes(v.tag)?v.tag:'marginal',short:v.short||'',title:v.title,body:Array.isArray(v.body)?v.body:[v.body||''],ideal:v.ideal||''};
 IMP_SUM=d.summary&&d.summary.stats?d.summary:null;SUM=IMP_SUM||autoSum();msg(`${Object.keys(N).length} avaliações importadas`);renderTabs();renderAll()}catch(e){msg('JSON inválido: '+e.message)}})}
$('fh').onchange=e=>{loadFiles(e.target.files);e.target.value=''};
$('ff').onchange=e=>{if(e.target.files[0])loadFb(e.target.files[0]);e.target.value=''};
$('clr').onclick=()=>{HANDS_RAW='';H=[];N={};IMP_SUM=null;SUM=null;cur=null;MEMO.clear();msg('Tudo limpo. Carregue um histórico.');renderTabs();renderAll()};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const fs=[...e.dataTransfer.files],j=fs.filter(f=>/\.json$/i.test(f.name)),t=fs.filter(f=>!/\.json$/i.test(f.name));if(t.length)loadFiles(t);if(j[0])loadFb(j[0])});
renderTabs();renderAll();
</script>
</body>
