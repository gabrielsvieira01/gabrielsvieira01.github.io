<script>
/* [semana, tema, [[rótulo,texto]...], [[alternativa, comentário]...] (a 1ª é a correta; a ordem é embaralhada), {k:dado que decide, r:regra, d:diferencial}] — **x** = palavra/cláusula decisiva */
const Q=[
["S02","Osteoartrite com comorbidades",[["Apresentação","Mulher de 61 anos, professora aposentada, com dor em joelhos e mãos há 3 anos, pior ao fim do dia e ao subir escadas."],["Exame","Nódulos em IFD e IFP, crepitação bilateral nos joelhos, sem calor nem derrame. Rigidez matinal de 20 minutos. IMC 34 kg/m². Nega febre, psoríase e dor lombar noturna."],["Antecedentes","HAS controlada com losartana + hidroclorotiazida. Úlcera gástrica com sangramento há 2 anos. Creatinina 1,6 mg/dL (TFG ≈ 36 mL/min)."],["Exames","VHS 18 mm/h; FR e anti-CCP negativos. RX: osteófitos e redução assimétrica do espaço articular nos joelhos."],["","Qual o plano inicial mais adequado?"]],[
["Exercício supervisionado, perda de 5–10% do peso e AINE **tópico**, pois a doença é mecânica e o AINE oral tem risco gástrico e renal neste caso.","Correta. Rigidez <30 min, VHS normal e FR/anti-CCP negativos = mecânica. O AINE tópico entrega analgesia sem somar nefrotoxicidade."],
["Exercício supervisionado, perda de 5–10% do peso e AINE **oral + IBP**, pois a doença é mecânica e o IBP neutraliza o risco do AINE neste caso.","Erro conceitual — proteção que não protege: IBP cobre o estômago, não o rim. AINE + BRA + tiazídico com TFG 36 é a combinação nefrotóxica (‘tripla’)."],
["Exercício supervisionado, perda de 5–10% do peso e **glucosamina**, pois a doença é mecânica e há ação condroprotetora comprovada.","Erro conceitual — fármaco sem benefício: glucosamina/condroitina (e opioide) não mudam desfecho na OA; são distratores clássicos."],
["Exercício supervisionado, perda de 5–10% do peso e **prednisona** curta, pois os nódulos de Heberden indicam atividade inflamatória.","Erro conceitual — nódulo ≠ inflamação: Heberden/Bouchard são osteófitos. Sem VHS alto nem rigidez longa, corticoide sistêmico não tem lugar."]],
{k:"Creatinina 1,6 + losartana + tiazídico + úlcera prévia: o diagnóstico era fácil; o que escolhe a resposta é a via do AINE.",r:"Em OA, leia as comorbidades antes dos fármacos. Base = exercício + peso; AINE tópico primeiro.",d:"AR: rigidez >1 h, poupa IFD, FR/anti-CCP+. Espondiloartrite: dor noturna, rigidez longa que melhora com movimento. OA: <30 min, IFD/IFP, osteófitos."}],
["S02","Fratura exposta — Gustilo",[["Apresentação","Operador de empilhadeira, 44 anos, trazido pelo SAMU 40 minutos após uma caixa de aço cair sobre a perna esquerda. Consciente e estável."],["Exame","Deformidade no terço médio da perna, edema tenso e ferida de 1,5 cm sobre a face anterior da tíbia, com sangramento venoso discreto. Pulsos distais presentes, sensibilidade preservada. Sem dor desproporcional ao estiramento passivo."],["Antecedentes","Última dose de antitetânica há 12 anos. Nega alergias."],["Exames","RX: fratura transversa de tíbia e fíbula, sem cominuição."],["","Qual a classificação e a conduta inicial corretas?"]],[
["Gustilo **II**: cefazolina na 1ª hora, antitetânica, curativo estéril, imobilização e desbridamento no centro cirúrgico **sem fechar** a ferida.","Correta. Ferida >1 e ≤10 cm = II. ATB o mais cedo possível, reforço do tétano (>10 anos), imobilizar e desbridar sem fechamento primário."],
["Gustilo **I**: cefazolina na 1ª hora, antitetânica, curativo estéril, imobilização e desbridamento no centro cirúrgico sem fechar a ferida.","Erro conceitual — limite do corte: Gustilo I é <1 cm; 1,5 cm é II. A conduta está certa, a classificação não."],
["Gustilo II: cefazolina na 1ª hora, antitetânica, curativo estéril, imobilização e **sutura da ferida** após lavagem no pronto-socorro.","Erro conceitual — fechamento primário: ferida de fratura exposta nunca é fechada no PS; contamina o foco e favorece osteomielite."],
["Gustilo II: antitetânica e imobilização na 1ª hora, com antibiótico **apenas após a cultura** da ferida, para evitar resistência.","Erro conceitual — tempo do antibiótico: é empírico e o mais precoce possível (<1 h); esperar cultura aumenta infecção."]],
{k:"1,5 cm (limiar de 1 cm) e a cláusula ‘sem fechar’.",r:"Gustilo: I <1 cm; II 1–10 cm; III extensa (A cobre, B retalho, C lesão arterial). Ferida no foco = exposta. Acidente de trabalho: CAT + notificação no SINAN.",d:"Síndrome compartimental: dor desproporcional e ao estiramento passivo — ausentes aqui."}],
["S03","Leucemia x mononucleose",[["Apresentação","Menino de 6 anos, 21 kg, com febre diária há 12 dias, dor nas pernas que o acorda à noite e recusa a caminhar há 2 dias."],["Exame","Palidez +++, petéquias em MMII, fígado a 3 cm e baço a 4 cm do rebordo; linfonodos cervicais e axilares de 1 cm, móveis. Sem faringite e sem exantema."],["Exames","Hb 7,9 g/dL; leucócitos 3.100/mm³ com 22% de linfócitos atípicos e neutrófilos 600/mm³; plaquetas 48.000/mm³; LDH 1.620 U/L; ácido úrico 9,1 mg/dL. Radiografia de tórax sem alargamento do mediastino."],["Evolução","Recebeu amoxicilina há 4 dias, sem melhora."],["","Qual a conduta mais adequada agora?"]],[
["Mielograma com imunofenotipagem **antes** de qualquer corticoide, com hidratação e prevenção de lise tumoral, pois citopenias com LDH alto indicam infiltração medular.","Correta. Três séries acometidas + LDH/ácido úrico altos = medula até prova em contrário; o corticoide só depois do diagnóstico."],
["Sorologia para EBV e reavaliação em 7 dias, **mantendo** a conduta, pois linfócitos atípicos com hepatoesplenomegalia indicam mononucleose.","Erro conceitual — mimetismo: mono dá atipia reacional, mas não Hb 7,9, plaquetas 48 mil, LDH 1.620 e dor óssea noturna."],
["Prednisolona oral por 3 dias **e depois** mielograma, pois a resposta ao corticoide confirma doença linfoproliferativa.","Erro conceitual — ordem: corticoide antes do diagnóstico destrói blastos e impede a imunofenotipagem; ‘responder’ não diagnostica."],
["Biópsia excisional do linfonodo axilar **antes** do mielograma, pois a linfonodomegalia sugere linfoma.","Erro conceitual — alvo errado: linfonodos de 1 cm e móveis não são o alvo; com citopenias o diagnóstico é medular e a biópsia atrasa o tratamento."]],
{k:"Hb 7,9 + plaquetas 48 mil + neutrófilos 600 + LDH 1.620: o hemograma ‘atípico’ engana, a combinação decide.",r:"Atipia linfocitária não é blasto. Mielograma (≥20–25% de blastos); nada de corticoide antes. Lise tumoral: hidratar e alopurinol/rasburicase.",d:"PTI: plaqueta isolada. AIJ sistêmica: artrite, sem citopenias. Mono: sem anemia grave, sem LDH tão alto."}],
["S03","Queimadura pediátrica — ATLS 11",[["Apresentação","Menina de 4 anos, 18 kg, 2 horas após derramar água fervente no tórax e no braço esquerdo. Via aérea pérvia, sem rouquidão."],["Exame","Queimaduras de 2º grau somam 25% da superfície corporal (Lund-Browder). Outras áreas de 1º grau não contadas. FC 138 bpm."],["Evolução","O SAMU infundiu Ringer lactato a 125 mL/h por 1 hora. Sonda vesical: 20 mL na última hora."],["","Qual a taxa inicial de Ringer lactato e a meta de diurese pelo ATLS 11?"]],[
["**84 mL/h** (3 × 18 × 25 ÷ 16), com diurese-alvo de **1 mL/kg/h** ajustada a cada hora.","Correta. Criança: 3 mL/kg/%SCQ em 16 h = 1.350 mL → 84 mL/h; diurese-alvo 1 mL/kg/h (18 mL/h)."],
["**56 mL/h** (2 × 18 × 25 ÷ 16), com diurese-alvo de 1 mL/kg/h ajustada a cada hora.","Erro conceitual — fator do adulto: 2 mL/kg é adulto; criança usa 3 mL."],
["84 mL/h (3 × 18 × 25 ÷ 16), com diurese-alvo de **0,5 mL/kg/h** ajustada a cada hora.","Erro conceitual — meta do adulto: 0,5 mL/kg/h é adulto; criança é 1 mL/kg/h."],
["**112 mL/h** (4 × 18 × 25 ÷ 16), com diurese-alvo de 1 mL/kg/h ajustada a cada hora.","Erro conceitual — fator elétrico: 4 mL/kg é para queimadura elétrica de alta voltagem, não térmica."]],
{k:"Idade (3 mL) + meta de diurese (1 mL/kg/h): duas variáveis que mudam com a faixa etária.",r:"ATLS 11: adulto 2 mL (0,5 mL/kg/h); criança 3 mL (1 mL/kg/h); elétrica 4 mL (1–1,5). Divide por 16 h e titula pela diurese.",d:"Queimadura de 1º grau não entra no %SCQ."}],
["S04","Câncer de próstata — risco",[["Apresentação","Homem de 69 anos, sem sintomas urinários, procura rastreamento por insistência do filho. Toque retal: nódulo endurecido de 1 cm no lobo direito, limitado à próstata (T2a)."],["Exames","PSA 24 ng/mL. RM multiparamétrica: lesão PI-RADS 5. Biópsia guiada: adenocarcinoma Gleason 3+4 (ISUP 2) em 40% dos fragmentos. Cintilografia óssea e TC de pelve sem metástases."],["Contexto","Expectativa de vida >10 anos, ECOG 0."],["","Qual a classificação de risco e o tratamento?"]],[
["Alto risco, pois **PSA >20** basta para definir a faixa; radioterapia **associada** à privação androgênica prolongada.","Correta. Um único fator de pior faixa define o grupo (D’Amico): PSA 24 = alto risco, mesmo com Gleason 7 e T2a."],
["Risco intermediário, pois Gleason 7 e T2a; radioterapia **isolada**, sem hormonioterapia.","Erro conceitual — critério único: o pior fator manda; PSA >20 desloca para alto risco, que pede hormônio associado."],
["Baixo risco, pois T2a e assintomático; **vigilância ativa** com PSA a cada 6 meses.","Erro conceitual — baixo risco exige PSA <10, Gleason 6 e ≤T2a; assintomático não é critério."],
["Doença metastática, pois PSA >20; privação androgênica **isolada** como tratamento primário.","Erro conceitual — PSA alto ≠ metástase: cintilografia e TC são negativas (N0M0); ADT isolada não cura doença localizada."]],
{k:"PSA 24 isolado. Gleason 3+4 e T2a ‘parecem’ intermediário; basta um critério alto.",r:"Baixo: PSA <10, G6, ≤T2a. Intermediário: PSA 10–20, G7, T2b. Alto: PSA >20, G≥8, ≥T2c. Alto: prostatectomia ou RT + ADT.",d:"HPB: toque liso, PSA proporcional ao volume. Nódulo endurecido = biópsia mesmo com PSA <4."}],
["S05","Abortamento incompleto + Rh negativo",[["Apresentação","Mulher de 27 anos, G2P1, O negativo (Coombs indireto negativo há 1 mês), 9 semanas pela USG, com sangramento intenso e cólica há 8 horas."],["Exame","PA 108/68 mmHg, FC 94 bpm, afebril (36,8 °C). Colo pérvio com saída de coágulos e fragmentos. Sem secreção fétida, sem dor à mobilização do colo."],["Exames","USG transvaginal: endométrio de 22 mm com material heterogêneo, sem embrião, sem líquido livre. Hb 11,4 g/dL."],["","Qual a conduta?"]],[
["Esvaziamento uterino (AMIU) **e imunoglobulina anti-D** em até 72 h, pois colo pérvio com endométrio >15 mm é aborto incompleto em Rh negativo não sensibilizada.","Correta. Esvaziar (AMIU até 12 sem) e dar anti-D: sangramento, aborto e ectópica em Rh− não sensibilizada."],
["Esvaziamento uterino (AMIU) **sem anti-D**, pois a profilaxia só vale após o parto ou após 28 semanas.","Erro conceitual — escopo do anti-D: indicada também em aborto, ectópica, mola e sangramento, e não só no parto/28 sem."],
["Conduta **expectante** com anti-D em até 72 h, pois já há eliminação de restos e o útero tende a esvaziar sozinho.","Erro conceitual — classificação: endométrio >15 mm com restos = incompleto; completo tem <15 mm. Incompleto precisa de esvaziamento."],
["Esvaziamento uterino com anti-D e **clindamicina + gentamicina**, pois o colo pérvio indica risco de infecção.","Erro conceitual — infectado exige febre, secreção fétida e útero doloroso; aqui está afebril e sem sinais. ATB empírico não é de rotina."]],
{k:"Dois dados: endométrio 22 mm (>15) e tipagem O negativo.",r:"Colo fechado = ameaça, retido ou completo. Colo aberto = em curso, incompleto ou infectado. Rh− não sensibilizada: anti-D sempre.",d:"Infectado: febre, secreção fétida, dor à mobilização. Completo: endométrio <15 mm, observação."}],
["S05","Disfagia pós-AVC",[["Apresentação","Homem de 76 anos, diabético, 12 dias após AVC isquêmico de ACM direita, ainda na enfermaria. A enfermagem relata engasgo com água e voz ‘molhada’."],["Exame","Tosse imediata ao deglutir 50 mL de água, regurgitação nasal ocasional, sem dor ao engolir. Sem perda de peso nos últimos 6 meses e sem disfagia prévia."],["Evolução","Triagem à beira do leito sugere aspiração. Febre de 37,9 °C e SpO₂ 94%. Usa sonda nasoenteral."],["","Qual o exame mais adequado para definir a conduta?"]],[
["**Videofluoroscopia** (ou videoendoscopia) da deglutição, pois a disfagia é orofaríngea e o exame mostra a aspiração em tempo real.","Correta. Tosse imediata, voz molhada e regurgitação nasal em AVC = orofaríngea."],
["**Endoscopia digestiva alta**, pois todo paciente com disfagia precisa de avaliação do lúmen esofágico antes de reabilitar.","Erro conceitual — nível errado: EDA é para disfagia esofágica mecânica (sólidos → líquidos, progressiva)."],
["**Manometria esofágica**, pois a tosse com líquidos sugere distúrbio motor do esôfago.","Erro conceitual — motora é sólidos e líquidos desde o início, sem tosse imediata nem regurgitação nasal."],
["**Esofagograma** baritado, pois a regurgitação nasal indica estenose mecânica do esôfago proximal.","Erro conceitual — regurgitação nasal é sinal orofaríngeo; estenose mecânica não cursa com tosse imediata."]],
{k:"‘Tosse imediata + regurgitação nasal + AVC’: três pistas que localizam a boca/faringe.",r:"Orofaríngea → videofluoroscopia/videoendoscopia. Esofágica mecânica → EDA. Motora → EDA + manometria.",d:"Parkinson e AVC são as causas orofaríngeas clássicas."}],
["S06","Demência com corpos de Lewy",[["Apresentação","Homem de 73 anos, ex-engenheiro, com 14 meses de declínio cognitivo e alucinações visuais de ‘crianças sentadas no sofá’, descritas com calma. A esposa relata dias lúcidos alternando com dias de confusão e que ele ‘vive o sonho’, gritando e se debatendo à noite há 5 anos."],["Exame","Marcha lenta, leve rigidez em roda denteada bilateral, sem tremor de repouso. MEEM 21 (14 anos de escolaridade), com maior déficit de atenção e visuoespacial do que de evocação."],["Evolução","Há 5 dias o plantonista prescreveu haloperidol 2 mg/dia por agitação noturna. Desde então: sonolência, rigidez acentuada, quedas e mais confusão."],["","Qual a conduta?"]],[
["**Suspender haloperidol** e iniciar rivastigmina, pois a demência com corpos de Lewy tem sensibilidade grave a neurolépticos típicos.","Correta. Flutuação + alucinação visual + sono REM + parkinsonismo = Lewy; piora após haloperidol é sensibilidade a neuroléptico."],
["**Reduzir haloperidol** à metade e iniciar rivastigmina, pois a dose menor controla a agitação sem rigidez.","Erro conceitual — dose-resposta: na sensibilidade neuroléptica a reação ocorre mesmo em doses baixas; a droga deve sair."],
["Suspender haloperidol e iniciar **memantina**, pois a rivastigmina piora as alucinações visuais.","Erro conceitual — inversão: o inibidor da colinesterase melhora alucinações e flutuação em Lewy; memantina é moderada/grave."],
["**Trocar por risperidona** e iniciar donepezila, pois antipsicótico atípico é seguro nessa demência.","Erro conceitual — falsa segurança: atípicos com bloqueio D2 forte também são evitados; se necessário, quetiapina/clozapina em dose baixa."]],
{k:"A cláusula ‘Há 5 dias … haloperidol’ e a piora seriada depois dele.",r:"Lewy: flutuação, alucinação visual, parkinsonismo, sono REM → rivastigmina; evitar haloperidol.",d:"Alzheimer: amnésia primeiro. Vascular: degraus. FTD: 50–65 anos, comportamento. HPN: marcha + incontinência."}],
["S07","Isoimunização Rh na gestação",[["Apresentação","Gestante de 31 anos, G3P2, O negativo, parceiro O positivo. Primeiro filho Rh positivo (sem anti-D na época); o segundo teve icterícia grave e fototerapia."],["Evolução","Coombs indireto: 1:4 na 20ª semana, 1:16 na 24ª, 1:32 na 26ª. Doppler da ACM: 1,62 MoM aos 26 semanas e 1,71 MoM aos 28. USG sem hidropsia, BCF 150 bpm."],["","Qual a conduta aos 28 semanas?"]],[
["**Transfusão intrauterina** em centro de referência, pois título ≥1:16 com ACM >1,5 MoM indica anemia fetal.","Correta. ACM >1,5 MoM = anemia; com título crítico, cordocentese e transfusão intrauterina."],
["**Imunoglobulina anti-D** agora, pois aos 28 semanas é a dose de profilaxia da gestante Rh negativo.","Erro conceitual — já sensibilizada: com Coombs indireto positivo, o anti-D não tem mais efeito."],
["**Repetir o Doppler em 4 semanas**, pois a ACM só indica intervenção acima de 2,0 MoM ou com hidropsia.","Erro conceitual — limiar errado: o corte é 1,5 MoM; hidropsia é achado tardio."],
["**Antecipar o parto** aos 28 semanas, pois anemia fetal grave é indicação de cesárea imediata.","Erro conceitual — prematuridade: a anemia se corrige intraútero; o parto aos 28 semanas é desnecessário."]],
{k:"Série dos títulos (1:4 → 1:16 → 1:32) + dois Dopplers acima de 1,5 MoM.",r:"Rh− no pré-natal: Coombs indireto. Negativo → anti-D (28 sem, eventos, 72 h pós-parto). Positivo → títulos; ≥1:16 → Doppler da ACM; >1,5 MoM → transfusão intrauterina.",d:"Doença ABO: mãe O, RN A/B, pode ocorrer no 1º filho, leve."}],
["S07","Icterícia direta com BT baixa",[["Apresentação","Lactente de 24 dias, a termo, em aleitamento exclusivo e ganhando 32 g/dia. A mãe diz que ‘continua amarelinho’ desde o nascimento."],["Exame","Bom estado geral, icterícia até a zona 3, fígado a 2 cm do rebordo, sem baço palpável. Fezes amarelas (mãe mostra a foto). Urina clara."],["Exames","BT 7,2 mg/dL; BD 2,1 mg/dL (29% da BT); TGO 62, TGP 48; Coombs direto negativo."],["","Qual a conduta?"]],[
["**Investigar colestase hoje** (hepatograma, coagulograma e USG de vias biliares), pois BD >20% da BT define colestase mesmo com fezes coradas.","Correta. BD >1 mg/dL ou >20% da BT, com >2 semanas, é colestase; fezes ainda amarelas não afastam atresia no início."],
["**Manter o aleitamento** e reavaliar em 2 semanas, pois a BT de 7,2 está baixa e fezes amarelas afastam atresia.","Erro conceitual — olhar a fração: o que importa é a direta; BT baixa e fezes amarelas dão falsa segurança (Kasai <60 dias)."],
["**Fototerapia por 48 h** e repetir as bilirrubinas, pois a icterícia persistente após 14 dias é do leite materno.","Erro conceitual — tipo de bilirrubina: fototerapia age na indireta; icterícia do leite é indireta, e este caso tem BD alta."],
["**Suspender o leite por 48 h** como teste, pois a queda da BT confirmaria icterícia do leite.","Erro conceitual — teste inválido: suspender aleitamento não é conduta; BD alta exige investigação, não prova terapêutica."]],
{k:"29% da BT é direta (limiar 20%) — a bilirrubina total ‘baixa’ distrai.",r:"Icterícia >2 semanas com BD >1 mg/dL ou >20% da BT = colestase: investigar. Kasai antes de 60 dias.",d:"Icterícia do leite: indireta, RN bem, fezes normais, após 1ª semana."}],
["S08","Intoxicação por lítio — precipitantes",[["Apresentação","Mulher de 52 anos, TAB tipo I, estável há 6 anos com carbonato de lítio 900 mg/dia (litemia 12 h pós-dose 0,8 mEq/L há 3 meses; creatinina 0,9 mg/dL)."],["Evolução","Há 8 dias iniciou ibuprofeno 600 mg 8/8 h por lombalgia e enalapril 10 mg/dia por HAS recém-diagnosticada. Há 2 dias: náuseas, tremor grosseiro, disartria e marcha instável. Nega diarreia e vômitos."],["Exame","PA 112/70, FC 92, hiper-reflexia, sem convulsão, mucosas úmidas."],["Exames","Litemia 2,3 mEq/L; creatinina 1,5 mg/dL; Na 138; ECG sem alterações."],["","Qual a conduta?"]],[
["**Suspender lítio, ibuprofeno e enalapril**, hidratar com salina isotônica e repetir litemia e creatinina em 6 h, pois AINE e IECA reduzem a depuração do lítio.","Correta. Dois precipitantes (AINE + IECA) subiram a litemia; suspender lítio e causas, hidratar, monitorar."],
["Suspender lítio e ibuprofeno e **manter enalapril**, hidratar com salina e repetir litemia, pois o IECA não altera a litemia.","Erro conceitual — precipitante esquecido: IECA/BRA e tiazídicos também reduzem a depuração do lítio."],
["Reduzir o lítio a **450 mg/dia** e manter ibuprofeno e enalapril, pois a litemia de 2,3 exige apenas ajuste de dose.","Erro conceitual — gravidade: litemia 2,3 com ataxia/disartria é intoxicação com sintoma neurológico; manter lítio e precipitantes é perigoso."],
["Suspender o lítio, dar **carvão ativado** e indicar hemodiálise imediata, pois litemia >2,0 sempre exige diálise.","Erro conceitual — dois erros: carvão não adsorve lítio; diálise é para >4,0, ou >2,5 com sintoma neurológico/IR."]],
{k:"2,3 mEq/L: abaixo do limiar de 2,5 para diálise, mesmo com sintoma neurológico. E a cronologia: AINE + IECA há 8 dias.",r:"Precipitantes do lítio: desidratação, diarreia, AINE, IECA/BRA, tiazídico, dieta pobre em sódio, IR. Diálise: >4,0 ou >2,5 com neuro/IR.",d:"Leve 1,5–2,5; grave >2,5 (confusão, mioclonia, convulsão)."}],
["S08","Borderline x bipolar",[["Apresentação","Mulher de 26 anos, atendida no CAPS após a 4ª ida ao pronto-socorro em 6 meses por cortes superficiais no antebraço. Relata raiva intensa ‘em segundos’ após brigas com o namorado, com melhora em horas."],["Antecedentes","Relações intensas em que idealiza e rompe; medo de abandono; vazio crônico desde os 16 anos; compras impulsivas e álcool episódico. Nega períodos >2 dias com pouco sono ou energia aumentada. Nega psicose."],["Evolução","Usou fluoxetina e depois um ‘estabilizador’ por conta própria, sem benefício. Relata alívio transitório com clonazepam, que pede em dose maior."],["","Qual a abordagem?"]],[
["**Psicoterapia estruturada (DBT)** como base, com fármaco em dose baixa só para sintoma-alvo e **sem benzodiazepínico**.","Correta. Borderline: psicoterapia é o tratamento; fármaco só para sintoma-alvo; BZD evitado (dependência, desinibição)."],
["**Lítio como base** do tratamento, com psicoterapia de apoio opcional, pois a instabilidade reativa em horas indica bipolaridade.","Erro conceitual — duração: bipolar oscila em dias/semanas com sono e energia alterados; aqui são horas e reativo."],
["**Clonazepam em dose fixa** associado à psicoterapia, pois reduz a raiva sem risco de dependência.","Erro conceitual — benzodiazepínico: risco de dependência e desinibição; a paciente já pede aumento."],
["**Antidepressivo em dose plena** isolado, pois o vazio crônico e a autolesão indicam depressão resistente.","Erro conceitual — sintoma ≠ síndrome: vazio e autolesão são critérios do borderline; a fluoxetina já falhou."]],
{k:"‘Segundos/horas’ e ‘nega períodos >2 dias com pouco sono’.",r:"Borderline: ≥5 de 9 critérios, reativo, horas. Bipolar: episódios de dias a semanas com sono/energia alterados.",d:"TAB II: hipomania ≥4 dias + depressão maior."}],
["S08","Lamotrigina — rash grave",[["Apresentação","Mulher de 34 anos, TAB tipo II, em valproato 1.000 mg/dia, com depressão há 2 meses. Iniciou lamotrigina 50 mg/dia (dose de monoterapia) há 16 dias, com aumento previsto."],["Evolução","Há 2 dias: febre de 38,4 °C, erupção maculopapular no tronco e erosões em mucosa oral e conjuntiva. Linfonodos cervicais dolorosos. Nega novos medicamentos."],["Exames","Leucócitos 11.800/mm³ com 8% de eosinófilos; TGO 78; creatinina 0,8."],["","Qual a conduta?"]],[
["**Suspender a lamotrigina hoje** e encaminhar ao hospital, pois febre com mucosite no 16º dia sugere reação grave, agravada pelo valproato que dobra seu nível.","Correta. Febre + mucosas + eosinofilia = SJS/DRESS até prova em contrário; valproato dobra o nível da lamotrigina."],
["**Reduzir a lamotrigina** à metade e dar anti-histamínico, pois o rash melhora com redução de dose.","Erro conceitual — gravidade: rash com febre e mucosa não se manobra por dose; deve-se suspender."],
["**Manter a lamotrigina** com corticoide tópico e reavaliar em 72 h, pois rash benigno ocorre em até 10%.","Erro conceitual — falso benigno: a frequência de rash não justifica manter com mucosite e febre."],
["Suspender o **valproato** e manter lamotrigina, pois a interação é a causa do rash.","Erro conceitual — culpado errado: a interação explica a dose efetiva alta, mas o fármaco culpado é a lamotrigina."]],
{k:"Valproato + dose inicial plena (50 mg) + febre e erosões em mucosa.",r:"Lamotrigina: titular devagar; com valproato, iniciar com metade. Rash com febre/mucosa = suspender.",d:"Carbamazepina: SJS ligada ao HLA-B*1502."}],
["S08","Dissecção de aorta — pressão",[["Apresentação","Homem de 58 anos, hipertenso sem tratamento, com dor torácica lancinante de início súbito há 40 minutos, irradiada para o dorso, com sudorese."],["Exame","PA 204/118 no braço direito e 176/98 no esquerdo; FC 104 bpm. Pulsos femorais simétricos. Sem sopros. Radiografia com alargamento do mediastino; ECG sem supradesnível."],["Evolução","AngioTC confirma dissecção de aorta tipo A (Stanford)."],["","Qual a conduta pressórica inicial?"]],[
["**Esmolol IV** até FC ≈60 bpm e PAS <120 em ~20 min, com vasodilatador **só depois** do betabloqueio; cirurgia de urgência.","Correta. Betabloqueio primeiro reduz a força de ejeção; só então vasodilatador. Meta PAS <120 em ~20 min."],
["**Nitroprussiato isolado** para PAS <120 em 20 min, pois o vasodilatador dispensa betabloqueio associado.","Erro conceitual — taquicardia reflexa: vasodilatador isolado aumenta a taxa de ejeção e propaga a dissecção."],
["**Labetalol oral** com redução de 25% na 1ª hora, pois é a meta padrão das emergências hipertensivas.","Erro conceitual — meta e via: ‘≤25% na 1ª hora’ é a regra geral; na dissecção é PAS <120 em 20 min, por via IV."],
["**Hidralazina IV** para PAS <140 em 6 h, pois evita hipoperfusão de órgãos-alvo.","Erro conceitual — vasodilatador puro e prazo longo: aumenta dP/dt; meta é mais agressiva e rápida."]],
{k:"‘PAS <120 em 20 min’ e a ordem betabloqueador → vasodilatador.",r:"Emergência hipertensiva: IV, UTI, ≤25% na 1ª hora — exceto dissecção (PAS <120 em 20 min) e eclâmpsia.",d:"Urgência hipertensiva: sem lesão aguda, via oral, 24–48 h, nada de nifedipino sublingual."}],
["S09","HELLP",[["Apresentação","Gestante de 33 semanas, G1P0, com dor em hipocôndrio direito e náuseas há 12 horas. PA 156/100 mmHg (2 medidas, 4 h de intervalo), sem cefaleia nem escotomas."],["Exames","Plaquetas 78.000/mm³; LDH 820 U/L; TGO 104 U/L; bilirrubina total 1,9 com esquizócitos; creatinina 0,8; proteinúria 1,1 g/24 h. BCF 142 bpm; crescimento fetal no percentil 25."],["Evolução","Recebeu a 1ª dose de betametasona há 1 hora. Em 3 horas: PA 148/94 e plaquetas 71.000/mm³."],["","Qual a conduta?"]],[
["Estabilizar com **MgSO₄** e corticoide e **interromper sem aguardar** 34 semanas, pois HELLP indica parto em qualquer idade gestacional.","Correta. Plaquetas <100 mil, LDH ≥600 e TGO ≥70 = HELLP; piora laboratorial em 3 h reforça."],
["Manter conduta **conservadora até 34 semanas** com corticoide completo, pois a PA de 156/100 é leve.","Erro conceitual — foco na PA: a gravidade é laboratorial (HELLP), não pressórica."],
["Manter conduta conservadora **até 37 semanas**, pois a plaquetopenia melhora com corticoide e repouso.","Erro conceitual — tempo: 37 semanas é para formas sem gravidade; HELLP não espera."],
["**Transfundir plaquetas** até >100.000 e programar indução aos 34 semanas, pois o parto aguarda a correção laboratorial.","Erro conceitual — sequência: não se adia o parto para normalizar exames; plaquetas só se necessário para o procedimento."]],
{k:"Três critérios laboratoriais (78 mil, LDH 820, TGO 104) com PA ‘só’ 156/100 — e a queda de 78 → 71 mil em 3 h.",r:"HELLP: LDH ≥600 + AST ≥70 + plaquetas <100 mil. Parto: sem gravidade 37 sem; com gravidade 34 sem; HELLP, eclâmpsia, edema pulmonar, DPP ou sofrimento fetal = qualquer idade após estabilizar.",d:"PTT/SHU: creatinina alta e sem hipertensão; esteatose aguda: hipoglicemia e coagulopatia."}],
["S09","Profilaxia de pré-eclâmpsia",[["Apresentação","Gestante de 37 anos, G4P3, 11 semanas, IMC 31 kg/m², na 1ª consulta. Sem HAS, diabetes, DRC ou doença autoimune; gestação única; PA 112/70."],["Antecedentes","Última gestação há 11 anos, sem pré-eclâmpsia. Mãe teve pré-eclâmpsia aos 29 anos. Ingestão de cerca de 400 mg de cálcio/dia. Nega tabagismo."],["","Qual a profilaxia?"]],[
["**AAS 100–150 mg à noite** de 12–16 até 36 semanas, mais cálcio 1–2 g/dia, pois há ≥2 fatores moderados e ingestão de cálcio baixa.","Correta. Moderados: >35 anos, IMC >30, história familiar, intervalo >10 anos (4 fatores)."],
["AAS 100–150 mg à noite de 12–16 até 36 semanas, **sem cálcio**, pois o cálcio reduz a ação do AAS.","Erro conceitual — interação inventada: com ingestão baixa (<600 mg/dia) o cálcio é indicado."],
["**Apenas cálcio** 1–2 g/dia, pois sem fator de alto risco não há indicação de AAS.","Erro conceitual — regra do ‘ou’: 1 fator alto OU ≥2 moderados indica AAS; aqui há quatro moderados."],
["AAS 100–150 mg à noite **até o parto**, mais cálcio, pois a suspensão aumenta o risco puerperal.","Erro conceitual — duração: o AAS vai até 36 semanas, não até o parto."]],
{k:"Contar fatores moderados (idade, IMC, história familiar, intervalo) — multiparidade não é fator.",r:"AAS 100–150 mg à noite, 12–16 → 36 sem, se 1 alto ou ≥2 moderados; cálcio 1–2 g se ingestão baixa.",d:"Alto risco: pré-eclâmpsia prévia, HAS crônica, DM, DRC, lúpus/SAF, gemelar."}],
["S09","Bem-estar fetal em CIUR",[["Apresentação","Gestante de 31 semanas e 3 dias, hipertensa crônica, internada por restrição de crescimento (peso fetal estimado no percentil 2). PA 142/92. Corticoide fetal completo há 4 dias."],["Evolução","Há 5 dias: Doppler umbilical com diástole positiva e IP elevado. Hoje: umbilical com diástole zero; ACM vasodilatada; ducto venoso com onda ‘a’ reversa."],["Exames","CTG: linha de base 140 bpm, variabilidade 2 bpm, desacelerações tardias repetidas. Perfil biofísico 4/10."],["","Qual a conduta?"]],[
["**Interromper a gestação hoje** por via alta, pois onda ‘a’ reversa no ducto venoso, CTG anormal e PBF ≤4 indicam acidemia fetal.","Correta. Ducto venoso com ‘a’ reversa = acidemia; PBF ≤4 e CTG sem variabilidade confirmam."],
["Manter internação e **repetir o Doppler em 24 h**, pois a diástole zero isolada permite aguardar 34 semanas.","Erro conceitual — achado isolado: o quadro soma DV, CTG e PBF alterados; não é diástole zero isolada."],
["Manter internação e **repetir o PBF em 12 h**, pois a corticoterapia recente justifica reavaliação antes do parto.","Erro conceitual — corticoide completo já feito: não há mais o que ganhar com espera."],
["Indicar **indução do parto** vaginal em 48 h, pois o ducto venoso alterado não contraindica trabalho de parto.","Erro conceitual — via/tempo: feto acidêmico com CTG sem variabilidade tolera mal o parto vaginal; 48 h é tempo demais."]],
{k:"A evolução seriada (diástole positiva → zero → DV reversa) e três métodos concordantes.",r:"Sequência de piora: umbilical diástole zero → reversa; ACM vasodilatada (centralização); ducto venoso ‘a’ reversa = acidemia. PBF ≤4 → interromper.",d:"Padrão sinusoidal: anemia fetal."}],
["S09","Oclusão arterial aguda",[["Apresentação","Homem de 77 anos, FA permanente sem anticoagulação por ‘risco de queda’, procura o PS com dor súbita na perna direita há 3 horas, de início instantâneo, com frio e ‘formigamento’ no pé."],["Exame","Perna direita pálida e fria até o joelho, poplíteo ausente, femoral amplo. Perda leve da sensibilidade nos dedos; dorsiflexão preservada; panturrilha mole; enchimento venoso presente. Perna esquerda normal. PA 158/92, FC 118 irregular."],["","Qual a conduta?"]],[
["**Heparina IV imediata** e embolectomia por cateter, pois é embolia com membro viável (sensibilidade e motricidade preservadas).","Correta. Início súbito, FA e pulso femoral amplo = embolia; viável → heparina + embolectomia/trombólise."],
["**Heparina subcutânea profilática** e angiotomografia em 24 h, pois o pulso femoral está presente.","Erro conceitual — dose e tempo: dose profilática não trata oclusão aguda, e 24 h é tempo que o membro não tem."],
["**AAS 300 mg** e vasodilatador oral, com revascularização eletiva, pois é claudicação crônica agudizada.","Erro conceitual — cronicidade: início instantâneo com 6 Ps não é crônico; há ausência de colaterais."],
["**Amputação primária** no mesmo plantão, pois poplíteo ausente e palidez indicam membro inviável.","Erro conceitual — inviável exige paralisia e rigidez; aqui a motricidade e a sensibilidade estão preservadas."]],
{k:"‘Dorsiflexão preservada, panturrilha mole’: sinais de viabilidade, que decidem entre salvar e amputar.",r:"6 Ps: dor, palidez, ausência de pulso, parestesia, paralisia, poiquilotermia. Embolia (FA, súbito) × trombose (DAP prévia). Paralisia + rigidez = inviável.",d:"Isquemia crônica ameaçadora: dor em repouso/úlcera, ITB <0,4."}],
["S10","AVC com oclusão de grande vaso ao despertar",[["Apresentação","Mulher de 62 anos, FA sem anticoagulante. Vista bem às 22h; acordou às 6h com hemiplegia esquerda, desvio do olhar para a direita e negligência."],["Exames","Chegou às 7h15. NIHSS 18; glicemia 128; PA 168/92; INR 1,1. TC sem sangue, ASPECTS 9. AngioTC: oclusão da ACI direita terminal. Perfusão: core 18 mL e penumbra 140 mL."],["","Qual a conduta de reperfusão?"]],[
["**Trombectomia mecânica**, pois há oclusão de grande vaso entre 6 e 24 h com tecido salvável (core pequeno).","Correta. 9 h do último visto bem, oclusão de ACI e core pequeno com grande penumbra: trombectomia até 24 h."],
["Apenas AAS e observação, pois **>4,5 h** exclui qualquer terapia de reperfusão.","Erro conceitual — janela: 4,5 h vale para a trombólise; a trombectomia vai até 24 h com tecido salvável."],
["Trombectomia **somente se** até 6 h do início, e como já passaram 9 h, manter tratamento clínico.","Erro conceitual — corte antigo: >6 h exige imagem de perfusão, que aqui mostra penumbra."],
["Trombólise intravenosa **como única terapia**, pois a imagem de perfusão estende sua janela a 24 h.","Erro conceitual — misturar janelas: trombólise não vai a 24 h; e deixaria o grande vaso sem tratamento mecânico."]],
{k:"Horário do último visto bem (22h → 7h15 = 9 h 15 min) e a imagem de perfusão.",r:"Janelas: trombólise 4,5 h (até 9 h com imagem avançada em diretriz recente); trombectomia 6–24 h com tecido salvável; basilar até 24 h.",d:"Hemorragia: TC mostra sangue — nada de antitrombótico."}],
["S10","AIT de alto risco + carótida",[["Apresentação","Homem de 67 anos, diabético e hipertenso, teve 25 minutos de fraqueza no braço direito e dificuldade de fala hoje cedo, com resolução completa. Chegou 3 horas após o início."],["Exame","PA 158/94 mmHg; exame neurológico normal; ECG em ritmo sinusal. TC sem lesão; RM sem restrição à difusão."],["Exames","Doppler/angioTC: estenose de 76% da carótida interna esquerda, com placa ulcerada; direita 20%."],["","Qual a conduta?"]],[
["**AAS + clopidogrel por 21 dias**, estatina de alta intensidade e **endarterectomia em até 2 semanas**, pois a estenose sintomática é de 70–99%.","Correta. ABCD² = 6 (idade, PA, fraqueza, 25 min, diabetes) = alto risco; estenose sintomática 76% → endarterectomia precoce."],
["AAS isolado, estatina e **angioplastia eletiva em 6 meses**, pois AIT sem infarto não exige urgência.","Erro conceitual — risco precoce: AIT de alto risco tem risco de AVC em horas/dias; cirurgia precoce (≤2 semanas)."],
["AAS + clopidogrel por 21 dias e **tratamento clínico exclusivo**, pois cirurgia só vale se estenose >90%.","Erro conceitual — limiar: sintomática 70–99% opera; 50–69% considera."],
["**Anticoagulação plena** com heparina e cirurgia em 3 meses, pois placa ulcerada indica embolia cardíaca.","Erro conceitual — fonte: placa ulcerada é artério-arterial; o ritmo é sinusal; a anticoagulação plena não é indicada."]],
{k:"76% em carótida sintomática, e o intervalo para a cirurgia (≤2 semanas).",r:"ABCD² ≥4 = alto risco, investigar em 24 h. Estenose sintomática 70–99% → endarterectomia em ≤2 sem; 50–69% considerar; <50% clínico.",d:"AVC menor/AIT de alto risco: AAS + clopidogrel por 21 dias."}],
["S10","Hiponatremia após HSA",[["Apresentação","Mulher de 48 anos, 5º dia após HSA por aneurisma de comunicante anterior, clipado no 1º dia. Em nimodipino 60 mg 4/4 h. Mais sonolenta desde ontem, sem déficit focal novo."],["Exame","PA 128/74, FC 108, mucosas secas, turgor diminuído, PVC 2 cmH₂O, diurese 3.200 mL/24 h. Doppler transcraniano com velocidades normais."],["Exames","Na 125 mEq/L (130 no 3º dia); osmolaridade sérica 258; Na urinário 85 mEq/L; glicemia 110. TC sem hidrocefalia."],["","Qual a conduta?"]],[
["**Repor volume com salina isotônica** (hipertônica se sintomática), pois é perda cerebral de sal com hipovolemia.","Correta. Hipovolemia (PVC 2, mucosas secas, diurese alta) com Na urinário alto = perda cerebral de sal."],
["**Restrição hídrica** a 1 L/dia, pois é SIADH, em que a hiponatremia é diluicional.","Erro conceitual — volemia: SIADH é euvolêmico; restringir volume na HSA agrava o vasoespasmo."],
["**Furosemida IV** com reposição de potássio, pois é hipervolemia por sobrecarga de líquidos.","Erro conceitual — paciente seca: o exame mostra hipovolemia, não hipervolemia."],
["**Dieta hipossódica** e controle da glicemia, pois a hiponatremia reflete excesso de sódio corporal.","Erro conceitual — piora: reduzir sódio agrava a perda; o déficit é de sódio e volume."]],
{k:"Volemia: PVC 2 cmH₂O e mucosas secas. A natremia isolada não escolhe entre SIADH e perda de sal.",r:"HSA: hiponatremia por SIADH ou perda cerebral de sal; não se restringe volume (risco de vasoespasmo, 3º–14º dia).",d:"SIADH: euvolêmico, Na urinário alto. Perda de sal: hipovolêmico, Na urinário alto."}],
["S10","Hematoma cerebelar",[["Apresentação","Homem de 61 anos, hipertenso, com vômitos súbitos, vertigem intensa e incapacidade de sentar sem apoio há 2 horas. Glasgow 14, PA 220/124, nistagmo e ataxia de tronco."],["Exames","TC: hematoma cerebelar esquerdo de 3,6 cm, com compressão do 4º ventrículo e hidrocefalia obstrutiva."],["Evolução","Em 90 min: Glasgow 11, pupilas isocóricas, FC 52 bpm e respiração irregular."],["","Qual a conduta?"]],[
["**Evacuação cirúrgica urgente** da fossa posterior com derivação ventricular externa, pois há >3 cm, compressão de tronco e piora clínica.","Correta. Cerebelar >3 cm, hidrocefalia e deterioração = cirurgia; bradicardia e respiração irregular são sinais de tronco."],
["**Tratamento clínico** com PAS <110 e observação, pois hematomas cerebelares sangram menos que os supratentoriais.","Erro conceitual — meta e premissa: PAS alvo ~140 (evitar <130), e fossa posterior tolera mal volume."],
["**DVE isolada** na UTI, mantendo o hematoma, pois a hidrocefalia é a única indicação cirúrgica.","Erro conceitual — tratar só o efeito: a compressão do tronco pelo hematoma permanece."],
["**Manitol e dexametasona** por 5 dias com nova TC em 48 h, pois o edema peri-hematoma exige corticoide.","Erro conceitual — corticoide: não tem indicação na hemorragia; osmoterapia não substitui descompressão."]],
{k:"Três números: 3,6 cm (>3), Glasgow 14 → 11 e FC 52 (Cushing).",r:"HIP cerebelar com compressão do tronco, hidrocefalia ou >3 cm → drenar. PAS ~140; sem anticonvulsivante nem corticoide profiláticos.",d:"HIP supratentorial: cirurgia só se superficial e piorando."}],
["S10","Arterite temporal",[["Apresentação","Mulher de 69 anos, com cefaleia temporal direita nova há 3 semanas, dor ao pentear e ao mastigar (precisa parar de comer). Perda de 4 kg e febre baixa."],["Exame","Artéria temporal direita espessada, sem pulso. Acuidade visual normal hoje, mas relata ‘escurecimento’ do olho direito por segundos ontem. Rigidez de ombros pela manhã."],["Exames","VHS 102 mm/h; PCR 86 mg/L; Hb 10,8; plaquetas 480.000/mm³. TC de crânio normal."],["","Qual a conduta?"]],[
["**Iniciar corticoide em dose alta hoje** e agendar biópsia da temporal, pois o risco de cegueira não permite esperar o resultado.","Correta. >50 anos + claudicação de mandíbula + VHS alta + amaurose fugaz = arterite; corticoide não espera biópsia."],
["**Agendar biópsia da temporal** e iniciar corticoide só após o resultado, pois o corticoide negativa o exame.","Erro conceitual — risco assimétrico: atrasar expõe a cegueira; a biópsia continua útil."],
["Iniciar **triptano e AINE** e reavaliar em 7 dias, pois cefaleia nova com dor ao pentear é enxaqueca.","Erro conceitual — sinal de alarme: >50 anos, cefaleia nova, VHS alta e claudicação não são migrânea."],
["Solicitar **angiorressonância cerebral** e iniciar AAS, pois a cefaleia indica aneurisma.","Erro conceitual — doença extracraniana: o alvo é a artéria temporal; AAS não previne a cegueira."]],
{k:"‘Escurecimento do olho’ por segundos: é a amaurose fugaz que impõe tratar antes de confirmar.",r:"SNOOP: >50 anos, VHS alta, claudicação de mandíbula → corticoide já + biópsia. Fixação dos riscos: cegueira.",d:"Migrânea, tensional, salvas e HIC idiopática (obesa jovem + papiledema)."}],
["S11","LCR e etiologia",[["Apresentação","Menino de 9 anos, vacinado, com cefaleia e febre baixa há 3 semanas, vômitos nos últimos 5 dias e diplopia há 2. O avô, que mora na casa, tem tosse crônica."],["Exame","Sonolento, rigidez de nuca leve, paralisia do VI par à esquerda. Sem petéquias. Sem antibiótico prévio."],["Exames","LCR: 210 células/mm³ (78% linfócitos); proteína 240 mg/dL; glicose 24 mg/dL (glicemia 96); ADA elevada. Radiografia de tórax com infiltrado apical."],["","Qual o diagnóstico mais provável?"]],[
["**Meningite tuberculosa**, pois a evolução subaguda com par craniano, glicose muito baixa e proteína muito alta com linfócitos a define.","Correta. Subaguda, VI par, glicose <40% da glicemia, proteína muito alta, ADA e contato bacilífero."],
["**Meningite viral**, pois o predomínio linfocitário em criança vacinada é típico e a glicose baixa ocorre em 20%.","Erro conceitual — glicose: no viral é normal; glicose 24 e proteína 240 afastam."],
["**Meningite bacteriana comum**, pois glicose baixa e proteína alta bastam e o predomínio linfocitário é fase inicial.","Erro conceitual — tempo: 3 semanas de evolução e linfócitos 78% não são fase aguda de bacteriana."],
["**Encefalite herpética**, pois há sonolência e alteração de par craniano e o LCR linfocítico é típico.","Erro conceitual — perfil: herpes cursa com glicose normal, crises focais e lobo temporal."]],
{k:"Glicose 24 com glicemia 96 (razão 0,25) + 3 semanas + VI par.",r:"Bacteriana: neutrófilos, glicose baixa, proteína alta. Viral: linfócitos, glicose normal. TB: linfócitos, glicose muito baixa, proteína muito alta, subaguda, ADA.",d:"Herpes: crises focais, lobo temporal na RM → aciclovir."}],
["S11","Meningite neonatal",[["Apresentação","RN de 22 dias, a termo, em aleitamento exclusivo, com febre de 38,3 °C há 8 horas, recusa alimentar e irritabilidade. Mãe sem rastreio de estreptococo B."],["Exame","Fontanela normotensa, hipotonia, FC 168 bpm, enchimento capilar 3 s. Sem petéquias. Icterícia leve."],["Exames","Leucócitos 3.800 com neutropenia; PCR 96 mg/L; LCR turvo com 1.800 células (84% neutrófilos), glicose 12 e proteína 260; Gram com cocos gram-positivos."],["","Qual o esquema empírico?"]],[
["**Ampicilina + cefotaxima** IV, **sem dexametasona**, pois <1–3 meses há estreptococo B, E. coli e Listeria.","Correta. Listeria só é coberta pela ampicilina; dexametasona não se dá no recém-nascido."],
["**Ceftriaxona isolada** IV com dexametasona, pois cobre os agentes da faixa etária e o corticoide reduz a surdez.","Erro conceitual — cobertura: ceftriaxona não cobre Listeria, e o corticoide não é para RN."],
["Ampicilina + cefotaxima IV **com dexametasona 0,15 mg/kg**, pois o corticoide reduz sequelas em qualquer idade.","Erro conceitual — idade: o benefício foi mostrado em crianças maiores (Hib/pneumococo); evita-se no RN."],
["**Ceftriaxona + vancomicina** IV, pois é o esquema para pneumococo resistente e meningococo.","Erro conceitual — faixa etária: esse é o esquema >3 meses."]],
{k:"Idade de 22 dias: define agentes (GBS, E. coli, Listeria) e a exclusão do corticoide.",r:"<1–3 meses: ampicilina + cefotaxima (ou gentamicina). >3 meses: ceftriaxona ± vancomicina. Dexametasona 0,15 mg/kg 6/6 h em maiores.",d:"Meningococcemia: petéquias + choque → ceftriaxona antes da punção."}],
["S11","Espasmos infantis",[["Apresentação","Lactente de 5 meses, com espasmos flexores em salvas ao acordar (10 a 20 por salva, 4 salvas/dia) há 3 semanas, perda do sorriso social e do seguimento visual."],["Exame","Seis máculas hipocrômicas >5 mm em tronco e membros, hipotonia axial."],["Exames","EEG: hipsarritmia. RM: túberes corticais e nódulos subependimários."],["","Qual o tratamento de escolha neste caso?"]],[
["**Vigabatrina**, pois nos espasmos infantis da esclerose tuberosa é o fármaco preferido, com vigilância do campo visual.","Correta. West + esclerose tuberosa → vigabatrina (alternativa: ACTH/prednisolona)."],
["**Carbamazepina**, pois são crises de início focal e a hipsarritmia responde a bloqueadores de sódio.","Erro conceitual — síndrome: espasmos infantis não respondem; bloqueadores de sódio podem piorar."],
["**Etossuximida**, pois os espasmos em salvas são ausências atípicas com ponta-onda lenta.","Erro conceitual — traçado: hipsarritmia ≠ ponta-onda; etossuximida é para ausência infantil."],
["**Valproato** em dose baixa, pois é o fármaco de escolha em epilepsias generalizadas do lactente.","Erro conceitual — escolha: não é 1ª linha no West; hepatotoxicidade em <2 anos."]],
{k:"Máculas hipocrômicas + túberes na RM = esclerose tuberosa.",r:"West: ACTH ou prednisolona; esclerose tuberosa → vigabatrina.",d:"Lennox-Gastaut: múltiplos tipos de crise + ponta-onda lenta. Ausência infantil: 4–10 anos, 3 Hz, etossuximida."}],
["S11","Epilepsia mioclônica juvenil em mulher",[["Apresentação","Menina de 16 anos, estudante, com abalos mioclônicos de braços ao acordar (derruba a xícara) há 1 ano. Há 3 semanas, após festa com privação de sono e álcool, crise tônico-clônica de 2 minutos."],["Antecedentes","Menarca aos 12. Usa anticoncepcional oral combinado e planeja vida sexual ativa. Desenvolvimento normal."],["Exames","EEG: poliponta-onda generalizada a 4–6 Hz com fotossensibilidade. RM normal."],["","Qual o fármaco mais adequado?"]],[
["**Levetiracetam** (ou lamotrigina), pois é mioclônica juvenil e o valproato deve ser evitado em mulher em idade fértil.","Correta. O valproato é o mais eficaz, mas é teratogênico (tubo neural) — em mulher fértil usa-se levetiracetam/lamotrigina."],
["**Valproato**, pois é o mais eficaz na mioclônica juvenil e o risco teratogênico é menor que o de uma crise.","Erro conceitual — risco-benefício: há alternativas eficazes; evita-se valproato em mulher fértil."],
["**Carbamazepina**, pois é de primeira linha nas crises tônico-clônicas do adolescente.","Erro conceitual — piora: carbamazepina agrava mioclonias e ausências."],
["**Fenitoína**, pois controla as crises tônico-clônicas e não interage com anticoncepcionais.","Erro conceitual — interação: fenitoína é indutora e reduz o efeito do anticoncepcional; também piora mioclonias."]],
{k:"‘Menina de 16 anos’ + anticoncepcional: a cláusula que tira o valproato.",r:"Mioclônica juvenil: abalos ao acordar, privação de sono, álcool. Homem: valproato; mulher fértil: levetiracetam/lamotrigina. Evitar carbamazepina, oxcarbazepina, fenitoína.",d:"Rolândica: escolar, crises orofaciais noturnas, benigna."}],
["S12","Intoxicação por opioide — evolução",[["Apresentação","Homem de 31 anos, trazido de uma festa por amigos, encontrado inconsciente no banheiro com uma seringa ao lado há ~20 minutos."],["Exame","Glasgow 6, FR 5 irpm superficiais, pupilas puntiformes (1 mm), cianose labial, SpO₂ 78% em ar ambiente, FC 54 bpm, PA 92/58, pulso carotídeo palpável."],["Evolução","Após a conduta inicial correta, desperta, FR 16, SpO₂ 97%. Quarenta minutos depois: FR 7, sonolento novamente, pupilas 2 mm."],["","Qual a sequência adequada, incluindo o evento dos 40 minutos?"]],[
["**Ventilar com bolsa-válvula-máscara e naloxona**; na ressedação, **repetir naloxona** (ou infusão) e observar, pois a naloxona dura menos que o opioide.","Correta. Hipóxia primeiro: ventilar; naloxona tem meia-vida curta e a ressedação exige nova dose."],
["Ventilar e dar naloxona; na ressedação, **dar alta com acompanhante**, pois o efeito do opioide já cessou.","Erro conceitual — farmacocinética: a ressedação ocorre porque o opioide dura mais; alta é perigosa."],
["**Naloxona isolada** sem ventilação prévia, pois a SpO₂ se corrige com o antagonista em segundos.","Erro conceitual — prioridade: SpO₂ 78% e FR 5 pedem ventilar já; a naloxona não substitui oxigenação."],
["Ventilar e dar **flumazenil**, pois depressão respiratória com miose é por benzodiazepínico.","Erro conceitual — antídoto: miose puntiforme + depressão respiratória = opioide; flumazenil pode precipitar convulsão."]],
{k:"O dado temporal: ressedação aos 40 minutos.",r:"Opioide: miose, depressão respiratória, coma → ventilar + naloxona; observar por ressedação.",d:"Cocaína: midríase, agitação, hipertermia → BZD + resfriamento. BZD isolado: sonolência com respiração preservada."}],
["S12","Abstinência alcoólica — onde tratar",[["Apresentação","Homem de 44 anos, na UBS, parou de beber há 14 horas, após 12 doses/dia por 8 anos. Tremor fino, ansiedade, sudorese e insônia."],["Exame","PA 148/92, FC 102, T 36,9 °C, orientado, sem alucinações. CIWA-Ar = 14."],["Antecedentes","Teve crise tônico-clônica em abstinência há 2 anos. Mora sozinho. AST 52, ALT 40."],["","Qual a conduta?"]],[
["**Internar** e iniciar benzodiazepínico de meia-vida longa com tiamina, pois convulsão prévia em abstinência indica internação mesmo com CIWA moderado.","Correta. CIWA 10–19 é moderado, mas convulsão prévia (e morar só) pesam na decisão de internar."],
["**Tratar na UBS** com diazepam por poucos dias e retorno em 48 h, pois CIWA-Ar <20 é abstinência leve a moderada.","Erro conceitual — critério isolado: o CIWA orienta, mas convulsão prévia e falta de suporte indicam internação."],
["**Internar** e iniciar haloperidol com tiamina, pois ansiedade e insônia indicam risco psicótico.","Erro conceitual — fármaco: haloperidol não trata abstinência; BZD é o tratamento."],
["**Tratar na UBS** com carbamazepina isolada, pois previne convulsões sem sedar.","Erro conceitual — tratamento: carbamazepina não substitui BZD e não trata a hiperatividade autonômica."]],
{k:"A cláusula ‘Convulsão em abstinência há 2 anos’ + ‘mora sozinho’; o CIWA 14 distrai.",r:"CIWA-Ar: <10 leve, 10–19 moderada, ≥20 grave. Internar se grave, DT, convulsão prévia, comorbidade ou sem suporte. Tiamina antes da glicose.",d:"Convulsão 12–48 h; alucinose 12–48 h; DT 48–96 h."}],
["S12","Hemorragia varicosa",[["Apresentação","Homem de 54 anos, cirrótico alcoólico (Child C), com hematêmese volumosa há 1 hora. Sonolento."],["Exame","PA 86/52, FC 128, ascite grau 2, sem febre. Dois acessos venosos calibrosos."],["Exames","Hb 6,8 g/dL; plaquetas 62.000/mm³; INR 1,9."],["","Qual a conduta inicial?"]],[
["Transfusão restritiva (**Hb alvo 7–8**), terlipressina, **ceftriaxona** profilática e EDA com ligadura em até 12 h.","Correta. Restritiva evita aumento da pressão portal; ATB profilático reduz infecção e mortalidade."],
["Transfusão liberal para **Hb >10**, terlipressina, ceftriaxona e EDA em até 12 h.","Erro conceitual — alvo: liberal eleva a pressão portal e ressangra; alvo 7–8."],
["Transfusão restritiva, terlipressina e EDA em **48 h**, sem antibiótico.","Erro conceitual — tempo e profilaxia: EDA em ≤12 h; antibiótico faz parte do tratamento."],
["Transfusão restritiva e **balão de Sengstaken** como 1ª escolha, pois a plaquetopenia contraindica EDA.","Erro conceitual — plaquetopenia não contraindica EDA; balão/TIPS é resgate."]],
{k:"Dois números: Hb alvo (7–8) e janela da EDA (12 h).",r:"Hemorragia varicosa: volume restritivo, vasoativo (terlipressina/octreotide), ATB profilático, EDA ≤12 h. Profilaxia: betabloqueador não seletivo ou ligadura.",d:"PBE: PMN ≥250 → ceftriaxona + albumina."}],
["S12","Pancreatite necrosante infectada",[["Apresentação","Mulher de 49 anos, internada há 30 dias por pancreatite biliar grave (falência renal e respiratória por 6 dias, resolvidas). Em dieta enteral por sonda."],["Evolução","Há 3 dias: febre de 38,9 °C, leucócitos 19.400/mm³, PCR 188 mg/L, hemoculturas com Klebsiella. Hemodinamicamente estável."],["Exames","TC: coleção necrótica encapsulada (walled-off) de 11 cm com bolhas de gás peripancreáticas."],["","Qual a conduta?"]],[
["**Carbapenêmico IV** e drenagem percutânea (abordagem step-up), pois é necrose infectada com coleção encapsulada após 4 semanas.","Correta. Gás na TC = necrose infectada; ATB + drenagem adiada (>4 semanas), step-up."],
["**Necrosectomia aberta imediata**, pois gás na coleção exige remoção cirúrgica do tecido necrótico.","Erro conceitual — método: a abordagem é step-up (drenagem → minimamente invasiva), não laparotomia de entrada."],
["**Manter apenas a dieta enteral** e observar, pois a necrose estéril não precisa de antibiótico.","Erro conceitual — premissa: febre, hemocultura e gás indicam necrose infectada, não estéril."],
["**Cefalosporina VO** e nova TC em 2 semanas, pois febre isolada não indica coleção infectada.","Erro conceitual — sinais: não é febre isolada; há gás, hemocultura positiva e sepse."]],
{k:"Gás na coleção + hemocultura positiva + 30 dias (coleção já encapsulada).",r:"Pancreatite grave: sem ATB profilático. Necrose infectada: carbapenêmico + drenagem adiada (~4 semanas), step-up.",d:"Pseudocisto: >4 semanas, parede definida, sem necrose."}],
["S12","Hepatite alcoólica — resposta ao corticoide",[["Apresentação","Homem de 51 anos, etilista, internado com hepatite alcoólica grave (Maddrey 54, MELD 24). Hemoculturas, urina e líquido ascítico negativos; sem hemorragia digestiva; creatinina 1,0."],["Evolução","Iniciou prednisolona 40 mg/dia no 1º dia. No 7º dia: bilirrubina 14,6 mg/dL (12,9 no D1). Escore de Lille = 0,62. Afebril, sem infecção nova."],["","Qual a conduta?"]],[
["**Suspender a prednisolona**, pois Lille >0,45 no 7º dia indica não resposta, mantendo suporte nutricional e abstinência.","Correta. Lille >0,45 no D7 = não respondedor; seguir o corticoide não traz benefício e aumenta risco."],
["**Manter a prednisolona** até o 28º dia, pois a decisão só se baseia no Maddrey inicial.","Erro conceitual — reavaliação: o Lille no D7 é justamente para decidir continuar."],
["**Dobrar a dose** para 80 mg/dia, pois a bilirrubina não caiu e o Lille alto indica dose insuficiente.","Erro conceitual — interpretação: não resposta é do paciente, não da dose."],
["**Trocar por pentoxifilina** e manter prednisolona em desmame, pois Lille <0,45 contraindica o corticoide.","Erro conceitual — sentido invertido: Lille <0,45 é resposta; e 0,62 está acima."]],
{k:"0,62 versus o corte de 0,45, e a bilirrubina que subiu.",r:"Maddrey ≥32 ou MELD >20: prednisolona 40 mg/dia por 28 dias (após excluir infecção e sangramento). Lille D7 >0,45 = parar.",d:"Hepatite alcoólica: AST/ALT >2, transaminases <300–400, icterícia recente."}]
];
let Qs,st,i,ans;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=(s,on)=>esc(s).replace(/\*\*(.+?)\*\*/g,on?'<b>$1</b>':'$1');
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
const sems=[...new Set(Q.map(q=>q[0]))];
$('fs').innerHTML='<option value="">Todas ('+Q.length+')</option>'+sems.map(s=>'<option>'+s+'</option>').join('');
$('fs').onchange=init;
function init(){const f=$('fs').value;Qs=shuf(Q.filter(q=>!f||q[0]===f));i=0;ans=[];st=Qs.map(()=>shuf([0,1,2,3]));render()}
function render(){
 if(i>=Qs.length){fim();return}
 const q=Qs[i],p=st[i],a=ans[i],L='ABCD',done=a!==undefined;
 let h='<div class="card">';
 q[2].forEach((s,k)=>{const last=k===q[2].length-1&&!s[0];h+='<p class="seg'+(last?' q':'')+'">'+(s[0]?'<span class="r">'+esc(s[0])+'</span>':'')+esc(s[1])+'</p>'});
 p.forEach((k,pos)=>{const c=done?(k===0?' ok':(k===a?' bad':'')):'';
  h+='<button class="alt'+c+'" data-k="'+k+'"'+(done?' disabled':'')+'><span class="l">'+L[pos]+'</span><span>'+fmt(q[3][k][0],done)+'</span></button>';
  if(done)h+='<div class="fb"><span class="'+(k===0?'o':'e')+'">'+(k===0?'✓ ':'✗ ')+'</span>'+esc(q[3][k][1])+'</div>'});
 if(done){const m=q[4];h+='<div class="v '+(a===0?'o':'e')+'">'+(a===0?'Você acertou.':'Você errou — a correta está em verde.')+'</div>'
  +'<div class="box"><h4>O que decidia</h4>'+esc(m.k)+'</div><div class="box"><h4>Regra para levar</h4>'+esc(m.r)+'</div><div class="box"><h4>Diferencial</h4>'+esc(m.d)+'</div>'}
 $('app').innerHTML=h+'</div>';
 $('app').querySelectorAll('.alt:not(:disabled)').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;render();window.scrollTo({top:0})});
 const ok=ans.filter(x=>x===0).length,fe=ans.filter(x=>x!==undefined).length;
 $('sc').textContent=(i+1)+'/'+Qs.length+' · ✓'+ok+' ✗'+(fe-ok);$('pb').style.width=(fe/Qs.length*100)+'%';
 $('pv').disabled=i===0;$('nx').textContent=i===Qs.length-1?'Finalizar':'Próxima ›'}
function fim(){
 const g={};Qs.forEach((q,k)=>{g[q[0]]=g[q[0]]||[0,0];g[q[0]][1]++;if(ans[k]===0)g[q[0]][0]++});
 const ok=ans.filter(x=>x===0).length;
 $('app').innerHTML='<div class="card"><h3 style="margin-top:0">Resultado: '+ok+'/'+Qs.length+' ('+Math.round(ok/Qs.length*100)+'%)</h3><table><tr><th>Semana</th><th>Acertos</th></tr>'+Object.keys(g).map(s=>'<tr><td>'+s+'</td><td>'+g[s][0]+'/'+g[s][1]+'</td></tr>').join('')+'</table><p style="color:var(--tx2);font-size:13.5px">Não respondidas contam como erro. Use ‘‹’ para revisar.</p><button class="b" style="width:100%" id="rs">Refazer (alternativas embaralhadas)</button></div>';
 $('rs').onclick=init;$('nx').textContent='—';$('pv').disabled=false}
$('nx').onclick=()=>{if(i<Qs.length){i++;render();window.scrollTo({top:0})}};
$('pv').onclick=()=>{if(i>0){i--;render();window.scrollTo({top:0})}};
init();
</script></body></html>
